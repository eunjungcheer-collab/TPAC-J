  ['제5차 지침(2018) - 자금세탁 전제범죄에 사이버범죄·환경범죄 등 22가지 유형을 처음으로 도입.','제1차 지침(1991) - 금융기관 중심, KYC 최초 도입, 마약범죄 전제범죄 한정.','제3차 지침(2005) - DNFBP로 CDD·STR 확대, 25% 지분 실제소유자 확인.','제4차 지침(2015) - 고액현금거래보고 10,000유로, 카지노→도박서비스 제공업체 확대, 국내외 PEP 정밀조사.'],0,
  '자금세탁 전제범죄로 사이버범죄·환경범죄·탈세 등 22가지 유형을 도입한 것은 제5차 지침(AMLD 5)이 아니라 "형사법을 통한 자금세탁방지에 관한 지침(Directive (EU) 2018/1673)"의 내용이에요. 제5차 지침의 핵심은 가상자산·선불카드 규제, 실제소유자 중앙등록시스템 강화 등이에요.','ultra'),
M('jd2_6',
  '국제기구 및 FATF의 기준에 근거한 우리나라 자금세탁방지제도(AML)에 대한 설명으로 옳지 않은 것은?',
  ['자금세탁방지제도(AML)는 자금세탁을 범죄화하고 자금세탁의 전제범죄를 지정하여 범죄수익을 몰수 및 추징하는 것을 말한다.','자금세탁의 범죄화에는 범죄의 정의, 전제범죄의 범위, 국제협력을 위한 국경 간 고려사항, 주관적 요소(state of mind, 지식 또는 의도), 법인의 책임, 전제범죄를 범한 자의 책임 등이 포함된다.','자금세탁방지제도(AML)와 테러자금조달금지제도(CFT)는 그 목적과 체계가 완전히 동일하여 별도로 구분할 실익이 없다.','금융회사등이 자금세탁방지의무(고객확인, 의심거래보고, 고액현금거래보고, 내부통제)를 이행하여 FIU에 이를 이행하고, FIU가 자금세탁 의심거래를 분석한 이후 법집행기관에 제공하여 수사 및 처벌에 이르는 일련의 과정으로 요약될 수 있다.'],2,
  '자금세탁방지제도(AML)와 테러자금조달금지제도(CFT)는 목적·근거 및 주요내용이 서로 구분돼요. AML은 자금세탁의 범죄화·전제범죄 지정·범죄수익 몰수 등을 다루고, CFT는 테러자금조달을 범죄로 처벌하고 관련 자산을 동결·몰수하는 것을 말해요. "완전히 동일하여 구분할 실익이 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_6',
  '테러자금조달금지제도(CFT)의 주요내용에 해당하지 않는 것은?',
  ['테러자금조달행위를 처벌하는 것.','자금세탁의 전제범죄 범위를 국제조약에 따라 확대하는 것.','테러 관련자 자산의 동결과 금융거래 허가제도의 운영.','테러 관련 의심거래에 대하여 금융회사등이 FIU에 보고하는 것.'],1,
  'CFT(테러자금조달금지제도)의 주요내용은 테러자금조달행위의 처벌, 테러 관련 의심거래에 대한 FIU 보고, 테러 관련자 자산의 동결과 금융거래 허가제도 운영이에요. "자금세탁의 전제범죄 범위 확대"는 AML(자금세탁방지제도) 영역의 내용이에요.','ultra'),
M('jd2_6',
  '<보기> 중 테러자금조달금지제도(CFT)에 대한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 테러자금조달행위 처벌은 테러행위(UN협약 등)와 테러 관련자(단체·개인)에 대한 자금지원을 처벌하는 것을 포함한다.\nㄴ. 테러자금조달 의심거래 보고는 금융회사등이 관련 의심거래를 FIU에 보고하는 것을 말한다.\nㄷ. 테러 관련자 자산동결과 관련하여 우리나라는 금융거래제한대상자를 지정 및 고시하여 금융거래를 제한한다.\nㄹ. 금융거래 허가제도는 금융거래제한대상자와의 테러자금조달과 무관한 금융거래에 대해서는 허가할 수 없도록 원천 금지하는 제도이다.',
  ['ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄱ, ㄷ.'],2,
  'ㄱ, ㄴ, ㄷ이 옳아요. ㄹ은 틀려요 — 금융거래 허가제도는 금융거래제한대상자와의 거래라도 "테러자금조달과 무관한" 금융거래는 허가할 수 있도록 하는 제도예요. "원천 금지"라는 서술은 제도의 취지와 반대예요.','ultra'),
M('jd2_6',
  '금융위원회 고시 제2023-53호에 대한 설명으로 옳은 것은?',
  ['금융실명법의 전부개정에 관한 고시이다.','특정금융정보법 시행령의 전부개정에 관한 고시이다.','금융거래등제한대상자 지정 및 지정 취소에 관한 규정의 일부개정 고시이다.','FATF 40개 권고사항의 국내 이행에 관한 종합계획 고시이다.'],2,
  '금융위원회 고시 제2023-53호는 "금융거래등제한대상자 지정 및 지정 취소에 관한 규정"의 일부개정에 관한 고시로, 테러 관련자 자산동결 제도의 예시로 제시된 사례예요.','ultra'),
M('jd2_6',
  '우리나라의 자금세탁방지 및 테러자금조달금지(AML/CFT) 체계의 요약으로 가장 옳은 것은?',
  ['금융회사등이 직접 수사권을 행사하여 자금세탁 범죄자를 기소하는 체계로, 검찰이나 경찰 등 법집행기관은 별도로 관여하지 않는 것으로 이해해야 한다','FIU는 오직 해외 금융정보분석기구와의 정보교환만을 전담하며, 국내 법집행기관에는 수사에 필요한 어떠한 정보도 제공하지 않는 폐쇄적 기관으로 이해해야 한다','우리나라의 AML/CFT 체계는 FATF 등 국제기준과는 무관하게, 순수하게 국내의 독자적인 판단만으로 설계되고 운영되는 것으로 이해해야 한다','금융회사등이 고객확인(CDD)을 통한 의심거래보고(STR)와 고액현금거래보고(CTR)를 FIU에 보고하고, FIU는 법집행기관에 정보를 제공하여 범죄수사 등을 통한 자금세탁 및 테러자금조달을 방지하는 것이다.'],3,
  '우리나라의 AML/CFT 체계는 금융회사등이 고객확인(CDD)을 통해 의심거래보고(STR)와 고액현금거래보고(CTR)를 FIU에 보고하고, FIU가 법집행기관에 정보를 제공해 범죄수사·기소·처벌로 이어지는 구조예요.','ultra'),
M('jd2_6',
  '국내 AML/CFT 법률체계의 구분에 대한 설명으로 옳지 않은 것은?',
  ['국내 AML/CFT 법률체계는 ML/TF 보고제도와 ML/TF 처벌제도로 구분된다.','ML/TF 보고제도의 근거 법률로는 금융실명법과 특정금융정보법을 들 수 있다.','ML/TF 처벌 법률로는 범죄수익은닉규제법, 공중협박자금조달금지법, 마약거래방지법을 들 수 있다.','ML/TF 보고제도와 처벌제도는 사실상 동일한 단일 법률(특정금융정보법)에 의해서만 규율되며, 별도의 처벌 법률은 존재하지 않는다.'],3,
  '국내 AML/CFT 법률체계는 ML/TF "보고제도"(근거: 금융실명법, 특정금융정보법)와 ML/TF "처벌제도"(근거: 범죄수익은닉규제법, 공중협박자금조달금지법, 마약거래방지법)로 명확히 구분돼요. "단일 법률에 의해서만 규율되며 별도의 처벌 법률이 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_6',
  '<보기> 중 ML/TF "보고제도"의 근거 법률에 해당하는 것을 모두 고른 것은?\nㄱ. 금융실명법\nㄴ. 특정금융정보법\nㄷ. 범죄수익은닉규제법\nㄹ. 마약거래방지법',
  ['ㄱ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄷ, ㄹ.','ㄱ, ㄴ.'],3,
  'ML/TF 보고제도의 근거 법률은 금융실명법과 특정금융정보법 2가지예요. 범죄수익은닉규제법과 마약거래방지법은 ML/TF "처벌" 제도의 근거 법률에 해당해요.','ultra'),
M('jd2_6',
  '<보기> 중 ML/TF "처벌제도"의 근거 법률에 해당하는 것을 모두 고른 것은?\nㄱ. 범죄수익은닉규제법\nㄴ. 공중협박자금조달금지법\nㄷ. 마약거래방지법\nㄹ. 금융실명법',
  ['ㄱ, ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄴ, ㄷ, ㄹ.','ㄱ, ㄹ.'],1,
  'ML/TF 처벌제도의 근거 법률은 범죄수익은닉규제법, 공중협박자금조달금지법(테러자금금지법), 마약거래방지법 3가지예요. 금융실명법은 ML/TF "보고"제도의 근거 법률에 해당해요.','ultra'),
M('jd2_6',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 국제기구 및 FATF의 기준에 근거하여 자금세탁방지제도(AML)는 자금세탁을 범죄화하고, 자금세탁의 전제범죄를 지정하여 범죄수익을 몰수 및 추징하는 것이다.\nㄴ. 테러자금조달금지제도(CFT)의 주요내용에는 테러자금조달행위 처벌, 테러자금조달 의심거래 보고, 테러 관련자 자산동결, 금융거래 허가제도 운영이 포함된다.\nㄷ. 국내 AML/CFT 법률체계에서 ML/TF 보고제도의 근거 법률은 금융실명법과 특정금융정보법이다.\nㄹ. 국내 AML/CFT 법률체계에서 ML/TF 처벌 법률은 범죄수익은닉규제법, 공중협박자금조달금지법, 마약거래방지법이다.',
  ['1개.','2개.','4개.','3개.'],2,
  'ㄱ~ㄹ 모두 옳은 설명이에요. 국내 AML/CFT 법률체계의 보고제도(금융실명법·특정금융정보법)와 처벌제도(범죄수익은닉규제법·공중협박자금조달금지법·마약거래방지법)의 근거 법률을 정확히 구분해야 풀리는 문제예요.','ultra'),
M('jd2_6',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 직원 甲은 어느 고객이 자금세탁 의심거래를 하는 것을 발견하여 FIU에 보고하였고, 이후 FIU는 분석을 거쳐 이를 검찰에 제공하였다. 검찰은 해당 고객을 자금세탁 혐의로 기소하였고, 법원은 유죄를 선고하며 범죄수익에 대한 몰수를 명하였다.',
  ['이 사례는 국내 AML/CFT 법률체계 중 ML/TF 보고제도(금융회사등의 STR 보고, FIU 분석·제공)와 ML/TF 처벌제도(기소, 유죄 선고, 범죄수익 몰수)가 유기적으로 연결되어 작동한 사례에 해당한다.','이 사례에서 甲이 의심거래를 보고한 행위는 금융실명법상 실지명의 확인 절차와는 완전히 무관한 별개의 사안으로만 취급해야 한다','FIU는 수사기관이 아니므로, 이 사례와 같이 분석한 정보를 검찰과 같은 법집행기관에 제공할 법적 권한 자체를 전혀 갖고 있지 않은 것으로 이해해야 한다','이 사례에서 이루어진 범죄수익의 몰수는 특정금융정보법이 아니라, 특정금융정보법과는 무관한 전적으로 별개의 법률에만 근거해 이루어진 것으로 이해해야 한다'],0,
  '이 사례는 국내 AML/CFT 법률체계 중 ML/TF 보고제도(금융회사등의 STR 보고, FIU 분석·제공)와 ML/TF 처벌제도(기소, 유죄 선고, 범죄수익 몰수)가 함께 작동하는 종합적인 사례를 보여줘요.','ultra'),
M('jd1_5',
  '미국의 금융감독 체계에 대한 설명으로 옳지 않은 것은?',
  ['미국 재무부(Department of Treasury)는 우리나라의 기획재정부와 금융위원회의 역할을 겸하는 행정부처로서, 국내외 경제·금융정책 수립 및 시행, 금융정책과 감독에 관한 입법 관련 업무(AML/CFT 업무 포함)를 수행한다.','미국의 금융감독은 연방(US Federal)과 주(State)와의 관계, 법률의 제정 목적, 감독대상 및 연방준비제도(FRS) 또는 연방예금보험공사(FDIC) 등의 가입 유무에 따라 감독기관이 중복될 수 있다.','미국은 우리나라와 마찬가지로 단일한 통합 금융감독기구가 모든 금융업권을 총괄하는 "통합형 금융감독체계"를 가지고 있다.','미국은 우리나라와 달리 금융분야별 감독기구가 구분되어진 "분리형 금융감독체계"를 가지고 있다.'],2,
  '미국은 우리나라와 달리 금융분야별 감독기구가 구분되어진 "분리형 금융감독체계"를 가지고 있어요. "우리나라와 마찬가지로 통합형 체계"라는 서술은 원문과 정반대예요.','ultra'),
M('jd1_5',
  '미국의 금융안정감독협의회(FSOC)와 소비자금융보호국(CFPB)에 대한 설명으로 옳은 것은?',
  ['FSOC(Financial Stability Oversight Council)는 금융소비자 보호를 전담하는 기관이고, CFPB(Consumer Financial Protection Bureau)는 금융회사의 거래행위 등 금융시스템을 모니터링하고 대응하는 기관이다.','FSOC와 CFPB는 동일한 기관의 다른 명칭일 뿐이다.','FSOC는 금융회사의 거래행위 등 금융시스템을 모니터링하고 대응하는 기관이고, CFPB는 금융소비자 보호를 전담하는 기관이다.','FSOC와 CFPB 모두 통화감독청(OCC) 산하의 부속기구이다.'],2,
  'FSOC(금융안정감독협의회)는 금융회사의 거래행위 등 금융시스템을 모니터링하고 대응하는 기관이고, CFPB(소비자금융보호국)는 금융소비자 보호를 전담하는 정부기관이에요. 각각 별개의 독립 기관으로 OCC 산하 기구가 아니에요.','ultra'),
M('jd1_5',
  '미국의 은행 감독 체계에 대한 설명으로 옳지 않은 것은?',
  ['국법은행은 연방준비제도(FRS) 및 연방예금보험공사(FDIC)에 의무적으로 가입하게 되어 있다.','미국의 은행감독은 연방준비제도이사회(FRB)가 주도하고 있으며, 효과적인 통화정책 수행, 금융위기의 관리 및 예방, 결제제도의 안정성 확보 등을 목적으로 한다.','은행지주회사에 대한 감독권과 역할은 연방예금보험공사(FDIC)가 전담하며, 연방준비제도이사회(FRB)는 은행지주회사 감독과 무관하다.','국법은행, 연준 가입 주법은행, 외국은행지점, 은행지주회사에 대한 감독권은 여러 기관이 나누어 가지나, 이 중 국법은행에 대한 감독은 미국 재무부 산하 통화감독청(OCC)이 주로 담당한다.'],2,
  '1999년 제정된 금융서비스 현대화법(그램-리치-블라일리법)에 따라 연방준비제도이사회(FRB)가 은행지주회사의 업무 전반에 대한 감독권과 역할을 하도록 규정되었어요. "FDIC가 전담하며 FRB는 무관하다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '미국의 통화감독청(OCC)에 대한 설명으로 옳지 않은 것은?',
  ['OCC(Office of the Comptroller of the Currency)의 목적은 연방은행시스템을 구성하는 기관이 안전한 방식으로 운영되고, 금융서비스에 대한 공정한 접근과 금융시장 참여자들의 공정한 대우를 위하여 관련 법률 및 규정을 준수하도록 하는 데 있다.','OCC는 오직 미화 100억 달러 이상의 대형 국법은행에 대해서만 감독 권한을 가지며, 그보다 자산규모가 작은 국법은행은 감독 대상에서 제외된다.','OCC는 국법은행 및 연방저축기관협회(FSA)를 감독하고, 외국은행의 미국 내 지점에 대한 평가 및 관리업무를 수행한다.','OCC는 위험기반 감독절차를 수행하며, 세부 업무로는 대출 및 투자 포트폴리오, 자금 관리, 자본, 수익, 유동성 등을 포함한 현장 감독검사를 수행한다.'],1,
  'OCC는 모든 국법은행 및 연방저축기관협회에 대한 시장 위험예방을 위해 미화 100억 달러 "미만"의 자산으로 구성된 은행의 내부통제, 준법감시 및 경영진의 위험식별과 통제에 대해서도 분석하고 평가해요. "100억 달러 이상 대형 은행만 감독"이라는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '<보기> 중 통화감독청(OCC)의 수행 업무에 해당하는 것을 모두 고른 것을 고르시오.\nㄱ. 은행 규제 및 규정을 발행하고, 은행 관행을 지배하는 은행의 기업결정에 대한 법적 해석 및 지침 제공\nㄴ. 감독하는 은행의 방문조사\nㄷ. 미국에서 영업하려는 외국은행에 대한 시설평가\nㄹ. 법률 및 규정을 준수하지 않거나 안전성을 담보하지 않거나 불건전한 관행을 영위하는 은행들에 대한 시정조치 부과\nㅁ. 은행이 고객에게 공정한 접근과 공평한 대우를 제공하고 소비자금융법을 준수하도록 하여 소비자 보호',
  ['ㄱ, ㄴ, ㄷ만.','ㄱ, ㄴ, ㄷ, ㄹ, ㅁ 모두 해당.','ㄹ, ㅁ만.','ㄱ, ㄴ, ㄹ, ㅁ.'],1,
  'OCC의 수행 업무에는 은행 규제·법적 해석 및 지침 제공, 은행 방문조사, 신규은행·외국은행 시설평가, 위법·불건전 은행에 대한 시정조치, 소비자 공정 대우·소비자금융법 준수 유도 등이 모두 포함돼요.','ultra'),
M('jd1_5',
  '미국 재무부 산하 해외자산통제실(OFAC)에 대한 설명으로 옳지 않은 것은?',
  ['OFAC(The Office of Foreign Assets Control)은 국내외 테러리스트, 국제 마약밀매자 등 미국의 대량살상무기와 확산과 미국의 국가안보, 외교정책 또는 경제에 대한 위협에 대하여 외교정책 및 국가안보를 위하여 경제 및 무역제재를 관리하고 집행하는 기관이다.','OFAC은 대통령 관할 비상권한 및 특별법에서 부여한 권한 내에서 미국 관할권역의 거래에 대한 통제를 강화하고 자산을 동결시키는 업무를 수행한다.','OFAC은 독자적으로 모든 정보수집과 분석을 수행하며, 재무부 산하 금융범죄단속네트워크(FinCEN)와는 어떠한 협력 관계도 없다.','OFAC의 활동은 미국 내 국가긴급사태법(NEA, 1976), 유엔참가법(UNPA, 1945) 등 미국의 대외관계를 규율하는 법에 근거한다.'],2,
  'OFAC은 주로 정보수집가 및 변호사로 구성되어 있으며, 테러관련 기관 및 재무부 산하 금융범죄단속네트워크(FinCEN)의 "지원하에" 활동하고 있어요. "FinCEN과 어떠한 협력 관계도 없다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '금융범죄단속네트워크(FinCEN)에 대한 설명으로 옳은 것은?',
  ['FinCEN은 직접조사, 금융거래 조사 및 특정계좌 폐쇄 등의 조치를 할 수 없다.','FinCEN은 미국 법무부(DOJ) 산하 기관으로, 재무부와는 조직상 관련이 없다.','FinCEN은 은행비밀법(BSA) 및 AML과 관련하여 금융기관이 30일 이내에 의심활동보고(SAR, Suspicious Activity Reporting)를 제출하도록 의무화하고 있다.','FinCEN은 오직 국내 금융기관에 대해서만 권한을 가지며, 외국 금융기관과의 정보 교류는 전혀 하지 않는다.'],2,
  'BSA(은행비밀법) 및 AML과 관련된 31 USC 5318 조항은 금융기관이 30일 이내에 FinCEN에 의심활동보고(SAR)를 제출하도록 의무화하고 있어요. FinCEN은 직접조사, 금융거래 조사 및 특정계좌 폐쇄 등의 조치도 할 수 있으며, 재무부 산하 기관이에요.','ultra'),
M('jd1_5',
  '<보기> 중 미국의 금융감독기관과 그 역할의 연결로 옳은 것을 모두 고른 것은?\nㄱ. SEC(증권거래위원회) - 증권거래소, 증권회사(Broker-Dealer), 투자자문사, 뮤추얼펀드에 대한 감독\nㄴ. FRB(연방준비제도이사회) - 통화정책 수행, 금융위기 관리 및 예방, 결제제도의 안정성 확보\nㄷ. OCC(통화감독청) - 국법은행 및 연방저축기관협회(FSA)에 대한 감독\nㄹ. OFAC(해외자산통제실) - 경제 및 무역제재의 관리·집행',
  ['ㄱ, ㄴ만.','ㄷ, ㄹ만.','ㄱ, ㄷ만.','ㄱ, ㄴ, ㄷ, ㄹ 모두 옳음.'],3,
  'SEC는 1934년 증권거래법에 근거해 증권거래소·증권회사·투자자문사·뮤추얼펀드를 감독하고, FRB는 통화정책·금융위기 관리·결제제도 안정성을 담당하며, OCC는 국법은행·FSA를 감독하고, OFAC은 경제·무역제재를 관리·집행해요. ㄱ~ㄹ 모두 옳은 연결이에요.','ultra'),
M('jd1_5',
  '유럽금융감독체계(ESFS)와 유럽시스템리스크위원회(ESRB)에 대한 설명으로 옳지 않은 것은?',
  ['Jacques de Larosière의 2009년 \'EU에서의 금융감독에 관한 고위급그룹\' 보고서를 계기로 유럽금융감독체계(ESFS)를 분산 네트워크로 구축할 것이 촉구되었다.','ESRB(유럽시스템리스크위원회)는 미시건전성 감독을 담당하는 3개의 유럽감독당국(ESAs)을 지휘·감독하는 상급 기구로서, ESAs에 대한 인사권과 예산권을 직접 행사하는 것으로 이해해야 한다','유럽감독당국(ESAs)에는 유럽은행감독청(EBA), 유럽증권시장감독청(ESMA), 유럽보험연금감독청(EIOPA) 3개 기구가 포함된다.','2007~2008년 글로벌 금융위기 중 유럽의회는 유럽연합 차원의 모든 금융산업 관계자들에게 실질적인 수준의 경쟁을 보장하고 유럽연합의 높아지는 통합요구를 반영하기 위해 보다 통합된 유럽금융감독체제(ESFS)로의 전환을 촉구하였다.'],1,
  'ESRB는 3개의 ESAs(EBA·ESMA·EIOPA)와 함께 ESFS를 구성해 서로 협력하는 관계일 뿐, ESAs를 지휘·감독하거나 인사권·예산권을 행사하는 상급 기구가 아니에요. "ESAs를 지휘·감독하는 상급 기구"라는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '유럽증권시장감독청(ESMA)에 대한 설명으로 옳지 않은 것은?',
  ['ESMA(European Securities and Market Authority)는 투자자 보호와 안정적이며 질서정연한 금융시장의 향상과 유럽연합의 금융시스템 안정성을 보호하기 위한 유럽연합의 독립적인 증권시장 감독당국이다.','ESMA는 은행 및 보험회사의 건전성 감독을 전담하는 기구이며, 증권시장 관련 업무는 EBA와 EIOPA가 담당한다.','ESMA는 기존의 유럽증권감독위원회(CESR)를 대체하여 EU 전역의 단일화된 감독업무를 수행한다.','ESMA의 주요업무로는 투자자·시장 및 재무안정성에 대한 위험 평가, EU 금융시장을 위한 단일규정 완성, 증권시장 감독 증진, 신용평가기관(CRAs) 및 거래정보저장소(TRs)의 감독업무 등이 있다.'],1,
  'ESMA는 "증권시장" 감독을 담당하는 기구예요. 은행 건전성 감독은 EBA(유럽은행감독청), 보험·연금 감독은 EIOPA(유럽보험연금감독청)가 담당하며, 세 기구의 역할이 뒤바뀐 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '유럽보험연금감독청(EIOPA)에 대한 설명으로 옳지 않은 것은?',
  ['EIOPA(European Insurance & Occupational Pension Authority)는 보험 및 연금감독위원회(CEIOPS)를 대체한 기구로서, 2011년 1월에 유럽연합의 금융부문 감독구조의 개혁으로 설립되었다.','EIOPA의 핵심역할은 금융시스템의 안정성, 금융시장 및 금융상품의 투명성, 보험계약자·연금계획을 위한 회원 및 수혜자의 보호·지원 등이다.','EIOPA는 유럽연합 전역에 걸쳐 미시건전성 감독을 위한 위험 및 취약성에 대해 모니터링하도록 유럽금융감독시스템(ESFS)으로부터 위임을 받았다.','EIOPA는 각 회원국의 감독위원회(Board of Supervisors)의 통제를 받지 않으며, 완전히 독립적으로 회원국 감독 정책을 결정한다.'],3,
  'EIOPA는 각 회원국의 보험 및 직장연금 분야와 관련하여 회원국 감독위원회(Board of Supervisors)의 "통제를 받는다"고 명시되어 있어요. "완전히 독립적으로 결정한다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '영국(UK)의 자금세탁방지 감독기관에 대한 설명으로 옳지 않은 것은?',
  ['영국은 1997년부터 통합·수행해 오던 금융감독기구(FSA)를 2013년 4월부터 소비자를 보호하고 금융회사 영업행위를 감독하는 금융감독청(FCA)과 은행 및 보험회사 등 금융회사의 건전성을 감독하는 건전성감독청(PRA)으로 분리해 운영하고 있다.','영국의 AML/CFT 관련 금융감독은 FCA와 산하 OPBAS에서 주도하고 있다고 볼 수 있으며 필요시 PRA에서도 함께 병행하여 감독하고 있다.','영국정부는 AML 관련 법률개정과 AML 전문감독자에 대한 AML 감독의 일관성을 개선하는 것을 목표로 자금세탁방지전문감독실(OPBAS)을 2018년 1월에 설립하여 운영하고 있다.','OPBAS는 부동산 중개업자, 고가의 상품 거래업자, 세무사 등 특정 업종에 대한 AML 감독을 직접 수행하는 1차 감독기관이다.'],3,
  '부동산 중개업자, 고가의 상품 거래업자, 세무사 등 특정 업종에 대한 AML 감독은 국세청(HMRC, Her Majesty\'s Revenue and Customs)이 직접 수행해요. OPBAS는 이러한 전문기구(변호사·회계사 등)의 AML 감독자들을 대상으로 감독의 일관성을 개선하는 상위 감독기구이지, 직접 그 업종을 1차 감독하는 기관이 아니에요.','ultra'),
M('jd1_5',
  '영국의 자금세탁방지전문감독실(OPBAS)에 대한 설명으로 옳지 않은 것은?',
  ['OPBAS는 변호사, 회계사 등 특정 산업을 감독하는 전문기구들이 AML 규정을 효과적으로 이행하고 있는지 감독 및 평가하고, 전문기구에 AML/CFT에 대한 명확한 지침과 모범 사례를 제공한다.','OPBAS는 영국에서 AML 감독체계를 강화하기 위한 광범위한 개혁안의 일환으로 설립되었다.','OPBAS는 카지노와 도박 관련 사업자에 대한 AML 감독도 직접 담당하며, 이는 법정 도박위원회(Gambling Commission)와는 무관하다.','「OPBAS규정 2018」에서는 OPBAS의 의무와 권한을 부여하여 전문기구의 AML 감독자가 자금세탁방지 규정에서 요구하는 기준을 충족하도록 요구하고 있다.'],2,
  '카지노와 도박 관련 사업자의 AML 감독은 법정 도박위원회(Gambling Commission)가 담당해요. 이는 OPBAS가 감독하지 않는 영역 중 하나로 명시되어 있어요. "OPBAS가 직접 담당하며 도박위원회와 무관하다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '<보기>는 OPBAS가 감독하지 않는 영역이다. 옳지 않은 것은?',
  ['카지노와 도박 관련 사업자의 AML 감독을 담당하는 법정 도박위원회.','변호사, 회계사 등 전문기구가 자금세탁방지 규정에서 요구하는 기준을 충족하는지에 대한 감독·평가 업무.','금융 서비스 및 전자화폐 기관 등 금융업에 대한 AML 규제 및 감독을 수행하는 금융감독청(FCA) 자체의 직접적인 금융회사 감독 업무.','부동산 중개업자, 고가의 상품 거래업자, 세무사 등 특정 업종에 대한 AML 감독을 수행하는 국세청(HMRC).'],1,
  '변호사·회계사 등 전문기구의 AML 규정 준수 여부에 대한 감독·평가는 오히려 OPBAS "본연의 핵심 업무"예요. 나머지 세 가지(HMRC의 직접 감독 업종, FCA 자체의 직접 금융회사 감독, 도박위원회의 카지노·도박업 감독)는 OPBAS가 감독하지 "않는" 영역으로 명시되어 있어요.','ultra'),
M('jd1_5',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 미국 재무부 산하 통화감독청(OCC)은 국법은행 및 연방저축기관협회(FSA)를 감독한다.\nㄴ. 미국 해외자산통제실(OFAC)은 국가긴급사태법(NEA)과 유엔참가법(UNPA) 등에 근거하여 경제 및 무역제재를 수행한다.\nㄷ. 유럽 ESAs(유럽감독당국)에는 EBA, ESMA, ECB가 포함된다.\nㄹ. 영국은 2014년 4월부터 기존 FSA를 FCA와 PRA로 분리하였다.\nㅁ. 영국의 OPBAS는 2019년 1월에 설립되었다.',
  ['4개.','3개.','2개.','5개.'],2,
  'ㄱ, ㄴ은 옳은 설명이에요. 영국의 FSA 분리(FCA·PRA)는 2014년이 아니라 2013년 4월부터 이루어졌고(ㄹ), 유럽 ESAs에는 ECB가 아니라 EIOPA가 포함돼요(ㄷ). 또한 영국의 OPBAS 설립은 2019년이 아니라 2018년 1월이에요(ㅁ).','ultra'),
M('jd1_5',
  '<보기>의 감독기관을 소속 국가·지역(미국/EU/영국)별로 옳게 분류한 것은?\nㄱ. FSOC\nㄴ. ESMA\nㄷ. OPBAS\nㄹ. CFPB\nㅁ. EIOPA\nㅂ. PRA',
  ['미국: ㄱ, ㄹ / EU: ㄴ, ㅁ / 영국: ㄷ, ㅂ.','미국: ㄱ, ㄴ / EU: ㄹ, ㅁ / 영국: ㄷ, ㅂ.','미국: ㄱ, ㄹ, ㅂ / EU: ㄴ, ㅁ / 영국: ㄷ.','미국: ㄷ, ㄹ / EU: ㄱ, ㅁ / 영국: ㄴ, ㅂ.'],0,
  '미국: FSOC(금융안정감독협의회), CFPB(소비자금융보호국) / EU: ESMA(증권시장감독청), EIOPA(보험연금감독청) / 영국: OPBAS(자금세탁방지전문감독실), PRA(건전성감독청)예요. 6개 기관을 국가·지역별로 정확히 분류해야 풀 수 있어요.','ultra'),
M('jd1_5',
  '미국·EU·영국의 금융감독체계를 비교한 설명으로 옳지 않은 것은?',
  ['영국은 과거 통합형 감독기구(FSA)에서 2013년 이후 기능별 감독기구(FCA·PRA)로 전환하였고, 이후 AML 감독의 일관성을 위해 OPBAS를 추가로 설립하였다.','미국은 분리형 금융감독체계를 가지고 있어 은행·증권·소비자보호 등 영역별로 감독기관이 나뉘어 있다.','미국·EU·영국 모두 AML/CFT 감독 체계에 있어서 완전히 동일한 단일 기구가 모든 감독 기능을 전담하는 구조를 가지고 있다.','EU는 ESFS라는 분산 네트워크 체계 하에 ESAs(EBA·ESMA·EIOPA)와 ESRB가 각자의 역할을 수행한다.'],2,
  '미국·EU·영국 모두 각기 다른 방식으로 여러 기관이 역할을 나누어 AML/CFT 감독을 수행하는 구조를 가지고 있어요. "완전히 동일한 단일 기구가 모든 기능을 전담"한다는 서술은 세 국가·지역의 실제 감독체계와 맞지 않아요.','ultra'),
M('jd1_5',
  '<보기> 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 영국에서 활동하는 회계사 A는 소속 전문기구(회계사협회)로부터 AML 규정 준수 여부에 대한 감독을 받고 있으나, 해당 전문기구의 AML 감독 수준이 다른 전문기구에 비해 낮다는 지적이 제기되었다.',
  ['이러한 전문기구 간 AML 감독의 일관성 문제를 개선하는 것이 OPBAS 설립의 핵심 목적 중 하나이며, OPBAS는 이 전문기구의 AML 감독자가 기준을 충족하는지 감독·평가할 수 있다.','이 사안은 영국의 금융감독청(FCA)이 전문기구의 AML 감독 체계와는 무관하게, 독자적인 판단으로 해당 회계사에게 직접 개입해 처리해야 할 사항으로 이해해야 한다','이 사안은 영국이 아니라 미국 통화감독청(OCC)의 관할 사항으로, 영국의 감독기관은 이 문제에 대해 어떠한 권한도 갖지 않는 것으로 이해해야 한다','전문기구 간 AML 감독 수준의 차이는 OPBAS가 아니라 법정 도박위원회가 조정하는 사항으로 이해해야 한다'],0,
  '전문기구 간 AML 감독의 일관성 문제를 개선하는 것이 OPBAS 설립의 핵심 목적 중 하나이며, OPBAS는 전문기구의 AML 감독자가 기준을 일관되게 적용하도록 조율하는 역할을 해요.','ultra'),
M('jd2_7',
  '금융실명제의 제정 배경 및 추진 경과에 대한 설명으로 옳지 않은 것은?',
  ['금융실명제는 1982년에 처음 추진되었으며, 단군 이래 최대 사기사건으로 불리는 이철희·장영자 어음사기 사건을 계기로 하여 제5공화국에서 추진되었으나 연기되었다.','제2차 금융실명제 추진은 1987년 노태우 정부의 대선공약으로 추진되었으나, 3저 호황의 여파로 1989년 경기가 악화되고 증시 폭락이 계속되자 정부는 1990년 3월 금융실명제 유보선언을 하였다.','제3차 금융실명제 추진은 1993년 8월 12일 김영삼 정부가 대통령 긴급명령 발표를 통하여 금융실명제를 전격 발표한 것이다.','금융실명제는 최초 추진 이후 단 한 번의 시도 없이 곧바로 1993년에 법률 제정 절차를 거쳐 시행되었다.'],3,
  '금융실명제는 1982년 1차 추진(제5공화국·노태우 정부에서 각각 추진되었으나 연기), 1987년 2차 추진(노태우 정부 대선공약, 1990년 유보선언), 1993년 3차 추진(김영삼 정부의 대통령 긴급재정경제명령으로 전격 시행)까지 총 3차례의 추진 과정을 거쳤어요. "단 한 번의 시도 없이 곧바로 시행"이라는 서술은 옳지 않아요.','ultra'),
M('jd2_7',
  '<보기>의 금융실명제 추진 경과를 시간 순서대로 옳게 나열한 것은?\nㄱ. 노태우 정부의 대선공약으로 제2차 금융실명제 추진\nㄴ. 이철희·장영자 어음부도사건을 계기로 한 제1차 금융실명제 추진\nㄷ. 정부의 금융실명제 유보선언\nㄹ. 김영삼 대통령의 긴급재정경제명령을 통한 금융실명제 전격 시행',
  ['ㄷ → ㄴ → ㄱ → ㄹ.','ㄴ → ㄱ → ㄹ → ㄷ.','ㄴ → ㄱ → ㄷ → ㄹ.','ㄴ → ㄹ → ㄷ → ㄱ.'],2,
  '순서는 이철희·장영자 사건 계기 1차 추진(1982) → 노태우 정부 대선공약 2차 추진(1987) → 유보선언(1990.3) → 김영삼 대통령 긴급명령 전격 시행(1993.8.12)이에요.','ultra'),
M('jd2_7',
  '금융실명법의 AML/CFT와 관련된 주요 특징에 대한 설명으로 옳지 않은 것은?',
  ['금융회사등은 실명에 의해 금융거래를 해야 하며, 실명확인은 성명과 주민등록번호의 확인 및 실명확인증표에 첨부된 사진 등에 의하여 반드시 거래자 본인 여부를 확인해야 한다.','제시된 실명확인증표의 사진에 의해 본인 여부 식별이 어려운 경우에는 담당 직원의 육안 판단만으로 신속하게 본인 여부를 확정하고 별도의 보완 자료 요청 없이 거래를 진행한다.','금융거래에 있어서 차명거래를 금지행위로 규정하고 위반 시 제재에 처하며, 계좌 금전의 소유권은 원칙적으로 출연자가 아닌 명의자(차명계좌주)의 소유로 추정한다.','불법재산의 은닉, 자금세탁행위, 공중협박자금조달행위와 함께 강제집행의 면탈, 그 밖에 탈법행위를 목적으로 타인의 실명으로 금융거래를 하는 행위를 금지한다.'],1,
  '실명확인증표 사진으로 본인 식별이 어려운 경우에는 다른 실명확인증표를 보완용으로 사용할 수 있어요. "담당 직원의 육안 판단만으로 확정하고 보완자료 요청 없이 진행한다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7',
  '금융실명법상 차명 금융거래 금지 위반에 대한 제재로 옳은 것은?',
  ['불법 차명거래자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.','불법·차명거래를 알선·중개한 금융회사등의 종사자는 형사처벌 대상에서 완전히 제외된다.','금융회사등의 임직원에게는 과태료가 부과되지 않으며, 오직 형사처벌만 가능하다.','차명거래 금지 위반에 대한 제재는 민사상 손해배상 책임으로만 한정되며 형사처벌이나 과태료는 적용되지 않는다.'],0,
  '불법 차명거래자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처하고, 불법·차명거래를 알선·중개한 금융회사등의 종사자도 동일하게 처벌 대상이 되며, 금융회사등의 임직원에게는 3천만원 이하의 과태료가 부과돼요.','ultra'),
M('jd2_7',
  '<보기> 중 금융실명법 제2조(정의)에서 규정하는 "금융회사등"의 범위에 포함되지 않는 것은?\nㄱ. 「은행법」에 따른 은행\nㄴ. 「상호저축은행법」에 따른 상호저축은행\nㄷ. 「우체국예금·보험에 관한 법률」에 따른 체신관서\nㄹ. 「신용협동조합법」에 따른 신용협동조합\nㅁ. 관할 세무서에 등록된 모든 개인사업자',
  ['ㄴ, ㄷ.','ㄱ, ㄴ, ㄷ, ㄹ 모두 포함 안됨.','ㅁ만.','ㄱ, ㅁ.'],2,
  '금융실명법상 "금융회사등"에는 은행, 중소기업은행, 한국산업은행, 한국수출입은행, 투자매매업자 등 자본시장법상 기관, 상호저축은행, 농협·수협, 신용협동조합, 새마을금고, 보험회사, 체신관서 등이 포함돼요. "관할 세무서에 등록된 모든 개인사업자"는 금융회사등의 범위에 해당하지 않아요.','ultra'),
M('jd2_7',
  '금융실명법 제3조(금융실명거래)에 대한 설명으로 옳지 않은 것은?',
  ['실명이 확인된 계좌 또는 이와 유사한 방법으로 실명이 확인된 계좌에 보유하고 있는 금융자산은 그 계좌명의인의 소유가 아니라, 최초 예치행위자가 자신이 실소유자임을 별도로 입증하는 경우에 한하여 예치행위자의 소유로 인정된다','금융회사등은 실명이 확인된 계좌에 의한 계속거래(繼續去來), 공과금 수납 및 100만원 이하의 송금 등 대통령령으로 정하는 거래의 경우에는 실명을 확인하지 아니할 수 있다.','외국통화의 매입 또는 외국통화로 표시된 예금의 수입 등의 거래로서 대통령령으로 정하는 기간 동안의 거래도 실명확인 예외 사유에 해당할 수 있다.','금융회사등은 거래자의 실지명의로 금융거래를 하여야 한다.'],0,
  '실명이 확인된 계좌의 금융자산은 원칙적으로 계좌명의인의 소유로 추정돼요. 이 선택지처럼 "계좌명의인의 소유가 아니라 최초 예치행위자가 입증하는 경우에 한해서만 예치행위자의 소유로 인정된다"고 뒤집어 서술하면, 추정의 원칙과 예외가 뒤바뀌어 옳지 않아요.','ultra'),
M('jd2_7',
  '금융실명법 제3조 제3항이 금지하는 행위에 해당하지 않는 것은?',
  ['「특정 금융거래정보의 보고 및 이용 등에 관한 법률」 제2조 제4호에 따른 불법재산의 은닉을 목적으로 타인의 실명으로 금융거래를 하는 행위.','본인의 실명으로 정상적인 예금계좌를 개설하여 급여를 이체받는 행위.','같은 조 제6호에 따른 공중협박자금조달행위 및 강제집행의 면탈, 그 밖에 탈법행위를 목적으로 타인의 실명으로 금융거래를 하는 행위.','같은 조 제5호에 따른 자금세탁행위를 목적으로 타인의 실명으로 금융거래를 하는 행위.'],1,
  '제3조 제3항은 불법재산의 은닉, 자금세탁행위, 공중협박자금조달행위, 강제집행의 면탈, 그 밖의 탈법행위를 목적으로 "타인의 실명"으로 금융거래를 하는 행위를 금지해요. "본인의 실명으로 정상적인 예금계좌를 개설하여 급여를 이체받는 행위"는 통상적인 적법한 거래로, 이 조항이 금지하는 행위에 해당하지 않아요.','ultra'),
M('jd2_7',
  '금융실명법 제3조 제4항 및 제6항에 대한 설명으로 옳은 것은?',
  ['금융실명법 제3조 제4항과 제6항은 2014년에 새로 신설된 조항이 아니라, 1993년 금융실명제가 최초로 도입되던 당시부터 이미 존재하고 있던 원래의 조항인 것으로 이해해야 한다','금융회사등에 종사하는 자는 제3항에 따른 금지된 차명 금융거래를 알선하거나 중개하여서는 아니 되며(2014.5.28 신설), 금융회사등은 금융위원회가 정하는 방법에 따라 제3항의 주요내용을 거래자에게 설명하여야 한다(2014.5.28 신설).','금융회사등에 종사하는 자는, 제3항에 따라 금지되어 있는 차명 금융거래를 알선하거나 중개하는 행위가 법적으로 허용되는 것으로 이해해야 한다','금융회사등은 거래자에게 차명거래가 금지된다는 내용을 설명해야 할 어떠한 법적인 의무도 부담하지 않는 것으로 이해해야 한다'],1,
  '2014년 5월 28일 신설된 제3조 제4항은 금융회사등 종사자의 차명거래 알선·중개를 금지하고, 제6항은 금융회사등이 금융위원회가 정하는 방법에 따라 제3항(차명거래 금지)의 주요내용을 거래자에게 설명하도록 의무화했어요.','ultra'),
M('jd2_7',
  '금융실명법 제4조(금융거래의 비밀보장)에 대한 설명으로 옳지 않은 것은?',
  ['누구든지 금융회사등에 종사하는 자에게 거래정보등의 제공을 요구하여서는 아니 된다.','법원의 제출명령 또는 법관이 발부한 영장에 따른 거래정보등의 제공은 비밀보장 원칙의 예외에 해당할 수 있다.','금융회사등에 종사하는 자는 명의인(신탁의 경우에는 위탁자 또는 수익자를 말한다)의 서면상의 요구나 동의를 받지 아니하고는 그 금융거래의 내용에 대한 정보 또는 자료를 타인에게 제공하거나 누설하여서는 아니 된다.','조세에 관한 법률에 따라 제출의무가 있는 과세자료 등의 제공에 대해서는 금융위원회의 사전 승인을 받은 경우에 한하여만 예외적으로 허용된다.'],3,
  '조세에 관한 법률에 따라 제출의무가 있는 과세자료 등의 제공은 비밀보장 원칙의 예외에 해당해 법률상 요건 충족 시 허용돼요. "금융위원회의 사전 승인을 받은 경우에 한해서만 예외적으로 허용된다"는 절차는 실제 규정과 달라 옳지 않아요.','ultra'),
M('jd2_7',
  '<보기> 중 금융실명법 제4조 제1항에 따라 거래정보등의 제공이 예외적으로 허용되는 경우를 모두 고른 것은?\nㄱ. 법원의 제출명령 또는 법관이 발부한 영장에 따른 거래정보등의 제공\nㄴ. 조세에 관한 법률에 따라 제출의무가 있는 과세자료 등의 제공\nㄷ. 국정감사 및 조사에 관한 법률에 따른 국정조사에 필요한 자료로서 해당 조사위원회의 의결에 따른 금융감독원장 및 예금보험공사사장의 거래정보등의 제공\nㄹ. 금융회사등의 종사자가 개인적 호기심으로 거래정보를 조회하여 지인에게 알려주는 것',
  ['ㄱ, ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄱ, ㄹ.','ㄴ, ㄷ, ㄹ.'],1,
  'ㄱ, ㄴ, ㄷ은 법률이 명시적으로 허용하는 예외 사유예요. ㄹ(개인적 호기심에 의한 거래정보 조회·누설)은 금융실명법이 엄격히 금지하는 전형적인 위반 행위로, 예외 사유에 해당하지 않아요.','ultra'),
M('jd2_7',
  '금융실명법 제4조 제2항에 대한 설명으로 옳은 것은?',
  ['거래정보등의 제공을 요구하는 자는 표준양식이 아니라 각 금융회사등이 개별적으로 정한 자체 양식에 따라 요청하면 충분한 것으로 규정되어 있다','제1항 제5호에 따라 거래정보등의 제공을 요구하는 경우에는 표준양식 요건이 적용되지 않고 제6호부터 제8호까지의 경우에만 표준양식이 적용되는 것으로 규정되어 있다','제1항 제1호부터 제4호까지 또는 제6호부터 제8호까지의 규정에 따라 거래정보등의 제공을 요구하는 자는 금융위원회가 정하는 표준양식에 의하여 금융회사등의 특정 점포에 이를 요구하여야 한다.','금융회사등은 표준양식에 의하지 않은 요구라 하더라도 요구자의 신분이나 목적을 불문하고 예외 없이 반드시 이에 응하여야 하는 것으로 규정되어 있다'],2,
  '금융실명법 제4조 제2항은 제1항 제1호부터 제4호까지 또는 제6호부터 제8호까지의 규정에 따라 거래정보등의 제공을 요구하는 자는 금융위원회가 정하는 표준양식에 의하여 금융회사등의 특정 점포에 이를 요구하도록 정하고 있어요. 이는 제5호를 제외한 나머지 호에 공통 적용되는 요건이에요.','ultra'),
M('jd2_7',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 직원 甲은 배우자로부터 명의를 빌려 계좌를 개설해 달라는 부탁을 받고, 강제집행을 회피할 목적으로 배우자 명의의 계좌를 개설해 주었다.',
  ['금융회사 직원 甲의 행위는 단순한 편의 제공으로, 어떠한 법적 책임도 발생하지 않는다.','이는 금융실명법 제3조 제3항이 금지하는 강제집행의 면탈을 목적으로 한 타인 명의 금융거래에 해당할 수 있어 형사처벌 대상이 될 수 있다.','배우자 간의 명의 대여는 가족관계이므로 어떠한 경우에도 금융실명법 위반에 해당하지 않는다.','이 사례는 금융실명법이 아니라 전적으로 민법상 문제일 뿐이다.'],1,
  '강제집행의 면탈을 목적으로 타인의 실명으로 금융거래를 하는 행위는 금융실명법 제3조 제3항이 명시적으로 금지하는 행위이며, 배우자 관계라 하더라도 이러한 목적성이 인정되면 예외가 되지 않아요. 이를 알선한 금융회사 종사자도 처벌 대상이 될 수 있어요.','ultra'),
M('jd2_7',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 금융실명법 제2조는 금융자산을 예금·적금·부금·계금·예탁금·출자금·신탁재산·주식·채권·수익증권·출자지분·어음·수표·채무증서 등과 이와 유사한 것으로서 대통령령으로 정하는 것으로 정의한다.\nㄴ. 금융실명법 제2조의 "실지명의"란 주민등록표상의 명의, 사업자등록증상의 명의, 그 밖에 대통령령으로 정하는 명의를 말한다.\nㄷ. 금융실명법상 실명확인의 예외로 100만원 이하의 송금 등 대통령령으로 정하는 거래가 인정될 수 있다.\nㄹ. 금융실명법 제3조 제5항에 따라 실명이 확인된 계좌에 보유하고 있는 금융자산은 명의자의 소유로 추정한다.',
  ['4개.','3개.','1개.','2개.'],0,
  'ㄱ~ㄹ 모두 옳은 설명이에요. 금융실명법의 핵심 정의 조항과 실명확인 예외(100만원 이하 송금), 소유권 추정 규정을 정확히 이해해야 풀리는 종합형 문제예요.','ultra'),
M('jd2_7',
  '금융실명법 제4조 제1항 단서에서 규정하는 거래정보등의 제공이 허용되는 사유 중 조세 관련 사유에 대한 설명으로 옳지 않은 것은?',
  ['조세에 관한 법률에 따라 제출의무가 있는 과세자료 등의 제공과 조세 관련 범칙사건을 조사하기 위하여 필요한 경우에 인정될 수 있다.','체납액이 5천만원 이상인 체납자로서 체납자의 재산을 은닉한 혐의가 있다고 인정되는 자에 대한 재산조회가 포함될 수 있다.','이러한 조세 관련 예외 사유는 조세에 관한 법률이 정한 요건과는 무관하게, 국세청 직원이 법적 근거 없이 개인적 판단만으로도 임의로 적용할 수 있는 것으로 이해해야 한다','체납자의 배우자(사실상 혼인관계에 있는 사람을 포함한다), 체납자의 6촌 이내 혈족, 체납자의 4촌 이내 인척에 대한 재산조회도 대상에 포함될 수 있다.'],2,
  '조세 관련 예외 사유는 조세에 관한 법률이 정한 요건을 충족해야 인정되는 것으로, 국세청 직원이 법적 근거 없이 임의로 적용할 수 있는 것이 아니에요. "개인적 판단만으로 아무런 법적 근거 없이 임의로 적용할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7',
  '<보기>는 금융실명법상 실명확인의 예외가 인정될 수 있는 거래를 설명한 것이다. 옳지 않은 것은?',
  ['실명이 확인된 계좌에 의한 계속거래(繼續去來).','공과금 수납 및 100만원 이하의 송금 등 대통령령으로 정하는 거래.','본인 명의 계좌 신규 개설 이후 6개월이 경과한 법인 고객과의 재거래.','외국통화의 매입 또는 외국통화로 표시된 예금의 수입 등의 거래로서 대통령령으로 정하는 기간 동안의 거래.'],2,
  '실명확인 예외 인정 거래는 계속거래, 공과금 수납, 100만원 이하 송금, 외국통화 매입 등 대통령령으로 정하는 거래예요. "법인 고객과의 6개월 경과 재거래"는 이러한 예외 사유 목록에 해당하지 않아요.','ultra'),
M('jd2_8',
  '우리나라의 자금세탁에 대한 범죄수익 규제체계에 대한 설명으로 옳지 않은 것은?',
  ['전제범죄 자체의 처벌, 자금세탁행위의 처벌 및 관련 수익의 몰수·추징 그리고 자금세탁행위의 효과적인 예방과 처벌을 위한 제도적 장치를 마련하고 있다.','마약류 관련 불법수익의 은닉·가장·수수죄는 범죄수익은닉규제법으로만 처벌되며, 마약류불법거래방지법은 이와 무관한 법률이다.','전제범죄 자체에 대하여는 형법 등 개별법에 따라 처벌하며, 범죄수익 등의 은닉·가장죄 및 수수죄는 범죄수익은닉규제법을, 불법수익 등의 은닉·가장 및 수수죄는 마약류불법거래방지법으로 처벌하고 있다.','국제자금세탁방지기구(FATF)의 40 권고사항을 기준으로 특정금융정보법 및 테러자금금지법 등을 통하여 금융회사등에게 고객확인을 통한 의심거래보고 등의 의무를 부여하고 있다.'],1,
  '마약류와 관련된 불법수익 등의 은닉·가장 및 수수죄는 범죄수익은닉규제법이 아니라 "마약류불법거래방지법"으로 별도 처벌돼요. 일반 범죄수익에 대해서는 범죄수익은닉규제법이 적용되는 것과 구분되는 지점이에요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법의 제정 배경 및 발전 경과에 대한 설명으로 옳지 않은 것은?',
  ['2001년 범죄로 인한 수익의 자금세탁행위를 규제하고 동 수익의 몰수 및 추징에 관한 특례를 규정함으로써, 동법에 규정된 범죄를 조장하는 경제적 요인을 근원적으로 제거할 목적으로 특정금융정보법과 함께 제정되었다.','2009년 6월 개정 이후 현재까지 전제범죄의 범위는 단 한 차례도 추가로 확대되지 않았으며, 2009년 개정이 마지막 개정이었다.','2009년 3월, 상표법 위반 및 지적재산권 침해범죄를 포함한 저작권법 위반, 컴퓨터프로그램보호법 위반죄를 자금세탁의 전제범죄 범위에 포함시켰다.','2006년 7월, 형법상 사기 및 횡령·배임의 죄(3억원 이상 5억원 미만인 경우)와 식품위생법 위반 범죄를 자금세탁의 전제범죄 범위에 포함시켰다.'],1,
  '2009년 6월에는 공중협박자금조달금지법 위반행위를 몰수 대상 범죄에 추가하였고, 이후에도 수 차례의 개정을 거쳐 2022년 1월에는 재산상 부정한 이익을 취득할 목적으로 범한 죄로서 사형·무기 또는 장기 3년 이상의 징역·금고에 해당하는 죄를 모두 특정범죄에 해당하는 것으로 개정(이른바 혼합식 규정으로 전환)하는 등 지속적으로 개정되어 왔어요. "2009년 개정이 마지막"이라는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '2022년 1월 개정된 범죄수익은닉규제법상 "특정범죄"의 정의에 대한 설명으로 옳지 않은 것은?',
  ['재산상 부정한 이익을 취득할 목적으로 범한 죄로서 사형, 무기 또는 장기 3년 이상의 징역이나 금고에 해당하는 죄(제2호나목에 규정된 죄는 제외한다)를 포함한다.','별표에 규정된 죄도 특정범죄에 포함된다.','외국인이 대한민국 영역 밖에서 한 행위가 대한민국 영역 안에서 행하여졌다면 중대범죄 또는 제2호 나목에 규정된 죄에 해당하고, 행위지의 법령에 따라 죄에 해당하는 경우 그 죄도 특정범죄에 포함될 수 있다.','이러한 개정은 기존의 열거식 별표 방식을 완전히 폐지하고, 재산상 부정한 이익을 취득할 목적으로 범한 죄를 포괄하는 방식만으로 특정범죄의 범위를 새롭게 규정한 것으로 이해해야 한다'],3,
  '2022년 1월 개정은 기존의 열거식 별표 방식을 그대로 유지하면서, 재산상 부정한 이익을 취득할 목적으로 범한 죄를 포괄하는 방식을 추가로 도입한 것이에요. "기존 방식을 완전히 폐지하고 포괄적 방식만으로 새롭게 규정했다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법 제2조(정의)에서 규정하는 "범죄수익"에 해당하지 않는 것은?',
  ['전제범죄와 무관하게 우연히 습득한 유실물을 신고하지 않고 보유하고 있는 재산.','공중 등 협박목적 및 대량살상무기확산을 위한 자금조달행위의 금지에 관한 법률 제6조 제1항·제4항(제6조 제1항 제1호의 미수범에 한정한다)의 죄에 관계된 재산.','성매매알선 등 행위의 처벌에 관한 법률 제19조 제2항 제1호(성매매에 제공되는 사실을 알면서 자금·토지 또는 건물을 제공하는 행위만 해당한다)의 죄에 관계된 재산.','중대범죄에 해당하는 범죄행위에 의하여 생긴 재산 또는 그 범죄행위의 보수로 얻은 재산.'],0,
  '범죄수익은닉규제법상 "범죄수익"은 중대범죄에 해당하는 범죄행위로 생긴 재산·보수, 그리고 성매매알선법·폭력행위처벌법·국제상거래뇌물방지법·특정경제범죄가중처벌법·국제형사재판소관할범죄처벌법·공중협박자금조달금지법 등 특정 법률에 열거된 죄에 관계된 재산 등으로 정의돼요. "우연히 습득한 유실물 미신고 보유 재산"은 이 법이 정의하는 범죄수익의 범주에 해당하지 않아요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법 제3조(범죄수익등의 은닉 및 가장)에 대한 설명으로 옳지 않은 것은?',
  ['제1항의 죄를 범할 목적으로 예비하거나 음모한 자는 2년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.','제1항의 미수범은 처벌하지 않으며, 예비·음모의 경우에도 처벌 규정이 없다.','범죄수익등의 취득 또는 처분에 관한 사실을 가장한 자, 범죄수익등의 발생 원인에 관한 사실을 가장한 자, 특정범죄를 조장하거나 적법하게 취득한 재산으로 가장할 목적으로 범죄수익등을 은닉한 자는 5년 이하의 징역 또는 3천만원 이하의 벌금에 처한다.','이 조항은 자금세탁행위(은닉·가장)를 직접 처벌하는 핵심 조항에 해당한다.'],1,
  '제3조 제2항은 제1항의 "미수범은 처벌한다"고 규정하고 있으며, 제3항은 예비·음모의 경우에도 2년 이하의 징역 또는 1천만원 이하의 벌금에 처하도록 규정하고 있어요. "미수범은 처벌하지 않으며 예비·음모 처벌 규정도 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법 제5조(금융회사등의 신고 등)에 대한 설명으로 옳지 않은 것은?',
  ['이 신고의무는 금융회사등에게만 부과될 뿐, 변호사·회계사와 같은 비금융 전문직에게는 특정금융정보법상 의심거래보고 의무와 마찬가지로 적용되지 않는 것으로 이해해야 한다','제1항이나 제2항을 위반한 사람은 2년 이하의 징역 또는 1천만원 이하의 벌금에 처한다.','금융회사등에 종사하는 사람은 제1항에 따라 신고를 하려는 경우 또는 신고를 한 경우에 그 사실을 신고와 관련된 금융거래등의 상대방 및 그의 관계자에게 누설하여서는 아니 된다.','금융회사등에 종사하는 사람은 금융거래등과 관련하여 수수한 재산이 범죄수익등이라는 사실을 알게 되었을 때 또는 금융거래등의 상대방이 제3조의 죄에 해당하는 행위를 하고 있다는 사실을 알게 되었을 때에는, 다른 법률의 규정에도 불구하고 지체 없이 관할 수사기관에 신고하여야 한다.'],0,
  '범죄수익은닉규제법 제5조의 신고의무는 금융회사등뿐 아니라 관련 업무 종사자 전반에 적용될 수 있는 의무로, 특정금융정보법상 STR 의무와 유사한 취지로 함께 기능해요. "금융회사등에게만 부과되고 비금융 전문직에게는 적용되지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법 제8조(범죄수익등의 몰수)에서 몰수할 수 있는 재산에 해당하지 않는 것은?',
  ['범죄수익에서 유래한 재산.','범죄수익.','범죄피해재산으로서 특정경제범죄가중처벌법 제5조의2 제1항·제2항 제1호의 죄에 해당하는 범죄행위에 의하여 피해자로부터 취득한 재산(예외 사유에 해당하지 않는 한).','제3조 또는 제4조의 범죄행위에 관계된 범죄수익등.'],2,
  '제8조 제3항은 같은 항 각 호의 재산이 "범죄피해재산"에 관한 죄(특정경제범죄가중처벌법 제5조의2 제1항·제2항 제1호, 채무자회생파산법 제650조·제652조·제654조 등)에 해당하는 범죄행위에 의하여 피해자로부터 취득한 재산인 경우에는, 제1항에도 불구하고 "몰수할 수 없다"고 규정해요. 따라서 이는 몰수 대상에서 제외되는 재산이에요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법 제10조(추징)에 대한 설명으로 옳은 것은?',
  ['범죄수익은닉규제법 제10조에 따른 추징은 반드시 몰수와 동시에 이루어지는 경우에만 적용될 수 있으며, 몰수 자체가 불가능한 상황에서는 추징 또한 함께 불가능해지는 것으로 이해해야 한다','제8조 제1항에 따라 몰수할 재산을 몰수할 수 없거나 그 재산의 성질, 사용, 그 재산에 관한 범인 외의 자의 권리 유무, 그 밖의 사정으로 인하여 그 재산을 몰수하는 것이 적절하지 아니하다고 인정될 때에는 그 가액을 범인으로부터 추징할 수 있다.','몰수 제도와 추징 제도는 서로 완전히 무관하게 독립적으로 운영되는 별개의 제도로서, 두 제도 사이에는 어떠한 연관성이나 보완적인 관계도 존재하지 않는 것으로 이해해야 한다','추징은 몰수 대상 재산이 범죄피해재산에 해당하는 경우라 하더라도, 예외 없이 항상 적용이 가능한 것으로 범죄수익은닉규제법이 정하고 있는 것으로 이해해야 한다'],1,
  '제10조 제1항은 몰수할 재산을 몰수할 수 없거나 몰수가 적절하지 않다고 인정되는 경우 그 가액을 범인으로부터 "추징"할 수 있도록 규정해요(몰수를 갈음하는 제도). 다만 제10조 제2항에 따라 그 재산이 범죄피해재산인 경우에는 가액을 추징할 수 없어요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법 제10조의3(몰수·추징의 집행을 위한 검사의 처분)에 대한 설명으로 옳지 않은 것은?',
  ['검사는 이 법에 따른 몰수·추징의 집행을 위하여 필요하다고 인정되면 그 목적에 필요한 최소한의 범위에서 관계인의 출석 요구 및 진술의 청취, 서류나 그 밖의 물건의 소유자·소지자 또는 보관자에 대한 제출 요구 등의 처분을 할 수 있다.','범인 외의 자에 대한 특정금융거래정보 제공요청 및 금융거래정보 제공요청 처분은 검사가 아니라 사법경찰관이 신청하고 법원이 발부하는 영장에 의해서만 이루어지는 것으로 이해해야 한다','제1항의 자료제공 요청에 대하여 해당 기관은 군사, 외교, 대북관계 등 국가안위에 중대한 영향을 미치는 경우를 제외하고는 다른 법률을 근거로 이를 거부할 수 없다.','특정금융거래정보의 제공 요청, 국세기본법에 따른 과세정보의 제공 요청, 금융실명법에 따른 금융거래정보의 제공 요청도 검사가 할 수 있는 처분에 포함된다.'],1,
  '범인 외의 자에 대한 특정금융거래정보·금융거래정보 제공요청 처분은 사법경찰관이 아니라 검사가 법원의 영장에 의해 하는 처분이에요. "사법경찰관이 신청하고 법원이 발부하는 영장에 의해서만 이루어진다"는 서술은 신청 주체가 잘못되어 옳지 않아요.','ultra'),
M('jd2_8',
  '테러자금금지법(공중 등 협박목적 및 대량살상무기확산을 위한 자금조달행위의 금지에 관한 법률)의 제정 배경에 대한 설명으로 옳지 않은 것은?',
  ['이 법은 특정금융정보법과는 완전히 독립적으로 운영되며, 테러자금조달을 예방하거나 대응하는 법적 수단으로서 특정금융정보법과 어떠한 연계도 갖지 않는다.','이 법은 2007년 12월에 제정된 법률로서 테러자금조달행위를 금지하기 위한 법이며, 우리나라가 2004년 2월 17일 서명·비준한 「테러자금조달의 억제를 위한 국제협약(1999)」을 이행하기 위한 법적 장치의 역할을 하고 있다.','이 법은 \'테러자금\'이라는 용어 대신 \'공중 등 협박목적을 위한 자금(공중협박자금 또는 테러자금)\'을 사용하고 있으며, 이는 국가·지방자치단체 또는 외국정부(국제기구 포함)의 권한 행사를 방해하거나 의무 없는 일을 하게 할 목적으로 또는 공중을 협박할 목적으로 하는 일정한 유형의 폭력·파괴행위에 이용하기 위하여 모집·제공되거나 운반·보관된 자금이나 재산을 의미한다.','이 법은 금융거래제한대상자의 지정, 금융거래허가제도에 대해서도 규율하고 있다.'],0,
  '테러자금금지법은 특정금융정보법과 "함께" 테러자금조달을 위한 자금세탁을 예방하거나 이에 대응하는 법적 수단의 근거가 돼요. "완전히 독립적이며 어떠한 연계도 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '테러자금금지법의 발전 경과에 대한 설명으로 옳지 않은 것은?',
  ['2014년 5월 개정을 통해 특정 테러행위와 관계없는 테러리스트·테러단체에 대한 자금조달행위도 처벌할 수 있도록 관련 조항(제5조의2, 제6조)을 개정하였다.','국제자금세탁방지기구(FATF)는 2001년 9·11 테러 발생 직후 테러자금조달금지에 관한 9개 특별권고사항(Special Recommendations)을 발표하였고, 이후 FATF의 기준 개정을 거쳐 FATF 40 권고사항에 흡수되었다.','이 법은 제정 이후 단 한 번도 개정되지 않았으며, 대량살상무기 확산금융에 대한 대응 조항은 애초부터 포함되어 있지 않았다.','FATF 권고사항에 추가된 대량살상무기확산금융 관련 정밀금융제재를 이행하기 위해 관련 조항(제명, 제1조, 제2조, 제4조, 제5조)을 개정하였다.'],2,
  '이 법은 2014년 5월 개정 등 여러 차례 개정을 거쳤으며, FATF 권고사항에 추가된 대량살상무기확산금융 관련 정밀금융제재를 이행하기 위해 제명·제1조·제2조·제4조·제5조 등을 개정하였어요. "단 한 번도 개정되지 않았다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '금융거래제한대상자 지정 현황에 대한 설명으로 옳지 않은 것은?',
  ['\'금융거래등제한대상자 지정 및 지정 취소에 관한 규정(금융위원회 고시)\'에 따라 UN 안전보장이사회 결의 제1267/1989/2253호, 제1718호, 제2231호, 제1988호 및 각 후속결의에 의하여 구성된 각 제재위원회가 지명한 테러 및 대량살상무기확산 관련 개인·법인 또는 단체는 금융거래제한대상자로 자동 지정된다.','제1988호는 탈레반(Taliban) 관련 제재위원회이다.','금융위원회는 2008년 12월 22일 UN 안전보장이사회 결의 제1267호에 의해 지정된 탈레반 및 알카에다 관련자 등 974명의 개인 및 단체를 금융거래제한대상자로 최초 지정하였다.','제1718호는 이란(Iran)의 대량살상무기 확산과 관련된 제재위원회이다.'],3,
  'UN 안전보장이사회 결의 제1718호는 북한(DPRK)과 관련된 제재위원회(1718 Sanctions Committee)예요. 이란(Iran) 관련 제재위원회는 제2231호(2231 Sanctions Committee)에 해당해요. 두 제재위원회의 대상국이 뒤바뀐 오답이에요.','ultra'),
M('jd2_8',
  '<보기> 중 UN 안전보장이사회 결의와 관련 제재위원회의 연결로 옳은 것을 모두 고른 것은?\nㄱ. 제1267/1989/2253호 - ISIL(Da\'esh) & Al-Qaida Sanctions Committee\nㄴ. 제1718호 - 1718 Sanctions Committee(DPRK)\nㄷ. 제2231호 - 2231 Sanctions Committee\nㄹ. 제1988호 - 1988 Sanctions Committee(탈레반)',
  ['ㄱ, ㄴ만.','ㄷ, ㄹ만.','ㄱ, ㄷ만.','ㄱ, ㄴ, ㄷ, ㄹ 모두 옳음.'],3,
  'ㄱ~ㄹ 모두 옳은 연결이에요. 각 UN 안보리 결의 번호와 이에 따라 구성된 제재위원회, 관련 대상(ISIL·Al-Qaida, 북한, 이란, 탈레반)을 정확히 매칭해야 풀 수 있어요.','ultra'),
M('jd2_8',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 범죄수익은닉규제법은 2001년 특정금융정보법과 함께 제정되었다.\nㄴ. 범죄수익은닉규제법 제3조의 미수범은 처벌되나, 예비·음모는 처벌되지 않는다.\nㄷ. 범죄피해재산은 범죄수익은닉규제법 제8조에 따라 몰수할 수 없는 것이 원칙이다.\nㄹ. 테러자금금지법은 2007년 12월 제정되었으나 테러자금조달의 억제를 위한 국제협약과는 무관하게 순수 국내 필요에 의해서만 만들어졌다.\nㅁ. 금융위원회는 2008년 12월 UN 안보리결의 1267호에 의해 997명의 개인·단체를 금융거래제한대상자로 최초 지정하였다.',
  ['2개.','3개.','5개.','4개.'],0,
  'ㄱ, ㄷ은 옳은 설명이에요. 테러자금금지법은 테러자금조달의 억제를 위한 국제협약(1999) 이행을 위해 제정된 법이고(ㄹ), 제3조의 미수범뿐 아니라 예비·음모도 처벌돼요(ㄴ). 최초 지정된 금융거래제한대상자는 997명이 아니라 974명이에요(ㅁ).','ultra'),
M('jd2_8',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 직원 甲은 어느 고객이 거액을 입금하면서 이 자금의 발생 원인에 관한 사실을 의도적으로 꾸며 설명하는 것을 발견하였고, 그 자금이 범죄수익이라는 합당한 근거를 인지하였음에도 이를 관할 수사기관에 신고하지 않았다.',
  ['이 사례는 범죄수익은닉규제법이 아니라 오직 형법상 방조죄로만 처벌될 수 있다.','신고의무 위반에 대해서는 어떠한 벌칙 규정도 존재하지 않는다.','甲의 행위는 범죄수익은닉규제법 제5조상 금융회사등의 신고의무를 위반한 것으로, 2년 이하의 징역 또는 1천만원 이하의 벌금에 처해질 수 있다.','금융회사 직원의 신고의무는 임의규정이므로 甲은 어떠한 법적 책임도 지지 않는다.'],2,
  '범죄수익은닉규제법 제5조는 금융회사등 종사자가 수수한 재산이 범죄수익등이라는 사실 또는 거래 상대방이 은닉·가장죄에 해당하는 행위를 하고 있다는 사실을 알게 된 경우 지체 없이 관할 수사기관에 신고할 의무를 부과하며, 이를 위반한 사람은 2년 이하의 징역 또는 1천만원 이하의 벌금에 처하도록 규정하고 있어요.','ultra'),
M('jd2_9',
  'FATF가 2006년 TBML 보고서에서 정의한 무역기반자금세탁(TBML)의 정의로 가장 옳은 것은?',
  ['금융회사를 통한 계좌이체만을 이용하여 자금세탁을 하는 절차.','오로지 현금을 이용한 물리적 국경 간 이동만을 지칭하는 개념.','암호화폐 거래소를 통한 자금세탁만을 지칭하는 개념.','불법자금의 원천을 합법화시키기 위한 목적으로 무역거래를 이용하여 범죄수익을 가장하거나 이동시키는 일련의 절차.'],3,
  'FATF는 2006년 TBML 보고서에서 TBML을 "불법자금의 원천을 합법화시키기 위한 목적으로 무역거래를 이용하여 범죄수익을 가장하거나 이동시키는 일련의 절차"로 정의하였어요.','ultra'),
M('jd2_9',
  '2020년 FATF 방법론연구 실무그룹(RTMG)의 "TBML 업데이트: 동향 및 발전" 보고서에서 정의한 TBML에 대한 설명으로 가장 옳은 것은?',
  ['TBML이란 오로지 국내 거래에서만 발생하는 자금세탁 행위를 의미한다.','TBML은 2020년 보고서에서 처음으로 정의된 개념으로, 2006년 이전에는 FATF가 이 개념을 정의한 바가 없다.','TBML이란 자금의 불법적인 출처를 합법화하거나 범죄활동에 자금을 조달하기 위한 노력의 일환으로서, 무역거래를 통해 범죄수익을 숨기고 자금을 이동시키는 과정을 말한다.','TBML은 무역거래와는 무관하게 순수하게 금융기관 내부의 자금이동만을 지칭한다.'],2,
  '2020년 RTMG 보고서는 TBML을 "자금의 불법적인 출처를 합법화하거나 범죄활동에 자금을 조달하기 위한 노력의 일환으로서, 무역거래를 통해 범죄수익을 숨기고 자금을 이동시키는 과정"으로 정의했어요. TBML 개념은 이미 2006년 FATF 보고서에서부터 정의되어 왔어요.','ultra'),
M('jd2_9',
  'FATF가 2007년 발표한 "TBML 단속을 위한 6대 원칙"에 해당하지 않는 것은?',
  ['모든 국가에 무역거래에 대한 사전 정부 승인제를 전면 도입하여 합법적 무역활동을 제한할 것.','기존 자금세탁 프로그램에 TBML을 포함할 것.','FATF 발간 TBML 보고서를 활용할 것.','국내 세관당국과 기타 자금세탁 당국 간 협력을 강화할 것.'],0,
  'TBML 단속을 위한 6대 원칙은 ①기존 자금세탁프로그램에 TBML 포함 ②FATF 발간 TBML 보고서 활용 ③국내 세관당국과 기타 자금세탁 당국 간 협력강화 ④공인된 방식으로 무역정보를 수집·교환하고 정보보호법령 준수 ⑤무역정보 국제협력 채널 구축 ⑥합법적 무역 활동을 저해하지 않을 것이에요. "사전 정부 승인제 전면 도입으로 합법적 무역활동 제한"은 오히려 6번째 원칙(합법적 무역활동을 저해하지 않을 것)과 정면으로 배치돼요.','ultra'),
M('jd2_9',
  '<보기>는 FATF의 TBML 관련 주요 발표 연혁이다. 시간 순서대로 옳게 나열한 것은?\nㄱ. TBML을 위한 Best Practice 발간\nㄴ. TBML 단속을 위한 6대 원칙 발표\nㄷ. TBML을 위한 위험지표 발간\nㄹ. 회원국들에 대한 설문조사 및 사례연구 실시\nㅁ. TBML을 위한 동향 및 발전 보고서 발간',
  ['ㅁ → ㄹ → ㄷ → ㄴ → ㄱ.','ㄹ → ㄴ → ㄱ → ㅁ → ㄷ.','ㄴ → ㄱ → ㅁ → ㄹ → ㄷ.','ㄹ → ㄱ → ㄷ → ㄴ → ㅁ.'],1,
  '연혁은 회원국 설문조사 및 사례연구(2005) → TBML 단속을 위한 6대 원칙(2007) → TBML Best Practice 발간(2008) → TBML 동향 및 발전 보고서(2020) → TBML 위험지표 발간(2021) 순이에요.','ultra'),
M('jd2_9',
  '2008년 FATF의 "TBML Best Practice"(Best Practices on Traded Based Money Laundering)의 주요내용에 대한 설명으로 옳지 않은 것은?',
  ['FATF는 무역체계가 새로운 ML/TF의 위험을 증가시키고 있고, 세관, 법 집행기관, FIU, 세무당국 및 은행감독기관 등이 TBML/TF에 대한 협업체계를 구축하는 것이 중요하다고 판단하였다.','이 보고서는 TBML 대응에 있어 국내 체계와 권한당국과의 업무 연계, 개인정보 보호와 프라이버시, 국제협력, 무역관련 법률체계 등은 고려할 필요가 없다고 명시하였다.','TBML/TF의 위험에 적합한 교육 프로그램을 통하여 이해관계자(수출입업자, 운송업자, 세관, 세무당국, 금융기관, FIU 등)가 TBML/TF를 공감하고 관련 데이터·정보의 이동에 대해서도 인식할 필요가 있다고 보았다.','TBML의 중요 요소로서 TBML/TF의 징후, 무역거래 정보가 수출입업자들을 통해 전달되어지는 과정, 검사당국의 거래 모니터링, 무역금융에서 보아야 할 상품이동에 따른 결제, 대외무역에 따른 외환거래 등이 있다.'],1,
  '2008년 TBML Best Practice는 오히려 국내 체계와 권한당국과의 업무 연계, 개인정보 보호와 프라이버시, 국제협력, 무역관련 법률체계 등을 "고려해야 할" 요소로 명시하고 있어요. "고려할 필요가 없다"는 서술은 원문과 정반대예요.','ultra'),
M('jd2_9',
  '2020년 FATF의 "TBML 업데이트: 동향 및 발전" 보고서에서 2006년 FATF 연구를 통해 처음으로 확인된 TBML 수법에 해당하지 않는 것은?',
  ['물품의 과소 또는 과다 송장청구(under/over-invoicing).','재화가치의 과소 또는 과대 설정.','모든 무역거래에 대한 정부의 사전 허가 없이는 어떠한 결제도 불가능하도록 하는 제도.','실제 재화의 이동이 없는 유령선적(phantom shipments).'],2,
  '2006년 FATF 연구에서 처음 확인된 TBML 수법은 물품의 과소·과다 송장청구, 재화가치의 과소·과대 설정, 실제 재화 이동이 없는 유령선적(phantom shipments) 등이에요. "모든 무역거래에 정부의 사전 허가가 필요하도록 하는 제도"는 TBML 수법이 아니라 오히려 대응·규제 방안에 관한 서술로, 이 보고서가 열거하는 TBML 수법에 해당하지 않아요.','ultra'),
M('jd2_9',
  'TBML 방지의 실무적 한계에 대한 설명으로 옳지 않은 것은?',
  ['무역정보와 관련해서 무역거래는 다양한 이해관계자가 무역정보를 갖고 있지만, 이러한 정보를 운영상 또는 대량으로 공유할 수 있는 범위에는 한계가 있다.','온라인사업의 성장이나 무역절차의 디지털화와 같은 최근의 변화는 TBML 위험을 오히려 감소시키는 요인으로 작용해, 실무적 예방 한계와는 반대 방향으로 영향을 미치는 것으로 이해해야 한다','금융회사가 제3자 중개자와 관련된 위험을 인지한다 하더라도, 합법적인 수입업자·수출업자, 감사인 그리고 회계사와 같은 감독자 등 공급망과 관련된 주체들이 무역거래와 관련 없는 제3자가 지급결제과정에서 속해 있는 것은 다소 위험이 있다.','권한당국은 형사소송, 수출입 업자의 무역권한을 박탈하는 방식으로 TBML의 위험을 예방할 수 있다.'],1,
  '온라인사업 성장, 준수활동 범위 제한, 신기술, 무역절차 디지털화, 운영속도 증가 등은 TBML 예방의 실무적 한계를 심화시키는 요소예요. "위험을 오히려 감소시키는 요인"이라는 서술은 옳지 않아요.','ultra'),
M('jd2_9',
  'TBML/TF와 국가위험평가(NRA)의 관계에 대한 설명으로 옳은 것은?',
  ['국가위험평가(NRA) 보고서는 TBML/TF의 정의나 위험, 예방의 한계에 대해서는 전혀 다루지 않고 순수하게 통계 수치만을 나열하는 자료로 이해해야 한다','NRA는 2020년에 처음 도입된 개념으로, 2012년 개정된 RBA(위험기반접근법)와는 시기적으로 무관하게 독립적으로 발전해 온 것으로 이해해야 한다','국가위험평가(NRA)는 TBML/TF와는 전혀 무관한, 순수 국내 치안 유지만을 목적으로 하는 도구로 이해해야 한다','2012년 개정된 FATF의 위험기반접근법(RBA) 도입과 더불어 국가위험평가(NRA)가 TBML/TF의 위험 노출도 분석 및 위험기반 정책, 관련 절차 및 법안의 개정 등에 도움을 준다.'],3,
  '2012년 개정된 FATF의 위험기반접근법(RBA) 도입과 더불어 국가위험평가(NRA)가 TBML/TF의 위험 노출도 분석 및 위험기반 정책·관련 절차 수립에 활용되고 있어요.','ultra'),
M('jd2_9',
  '2020년 세관에 대한 TBML 가이드라인에 대한 설명으로 옳지 않은 것은?',
  ['세관은 TBML 대응에 있어 국내 법집행기관과는 협업하지만, 국제 사회와의 정보공유나 국경 간 협력체계 구축과는 무관하게 국내 단위로만 활동하는 기관으로 이해해야 한다','\'2020년 FATF의 TBML 업데이트: 동향 및 발전\' 보고서에서는 TBML에 대한 세관의 역할과 책임에 대하여 정의하였다.','국내 법집행기관인 관세청에서는 2016년 은행의 보고책임자들을 위하여 TBML 가이드라인을 제시하였다.','TBML 대응에는 세관뿐 아니라 법집행기관, FIU, 세무당국, 은행감독기관 등 여러 기관 간의 협업체계가 중요하다.'],0,
  '2020년 세관 TBML 가이드라인에 따르면 세관은 국제 사회 및 국내 법집행체계(법집행기관·FIU·세무당국·은행감독기관 등)와 긴밀히 협업하는 기관으로 규정돼요. "국내 단위로만 활동하며 국제 사회와는 무관하다"는 서술은 옳지 않아요.','ultra'),
M('jd2_9',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF는 2006년 TBML 보고서에서 TBML을 무역거래를 이용해 범죄수익을 가장하거나 이동시키는 절차로 정의하였다.\nㄴ. TBML 단속을 위한 6대 원칙은 2009년 FATF가 발표하였다.\nㄷ. 2010년 FATF는 TBML을 위한 Best Practice를 발간하였다.\nㄹ. 2012년 APG가 아니라 UN이 TBML을 위한 방법론 보고서를 발간하였다.\nㅁ. 2021년 FATF는 TBML을 위한 위험지표를 발간하였다.',
  ['5개.','2개.','3개.','4개.'],1,
  'ㄱ, ㅁ은 옳은 설명이에요. TBML 방법론 보고서는 UN이 아니라 2012년 APG가 발간하였고(ㄹ), TBML 6대 원칙은 2009년이 아니라 2007년(ㄴ), Best Practice는 2010년이 아니라 2008년에 발간되었어요(ㄷ).','ultra'),
M('jd2_9',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 수출업자 A사는 실제로는 인도하지 않은 물품에 대하여 수입업자 B사와 공모하여 선하증권 등 무역서류를 위조하고, 이를 근거로 은행을 통해 대금을 결제받았다. 실제 화물의 이동은 전혀 없었다.',
  ['이 사례는 TBML의 전형적인 수법 중 하나인 \'유령선적(phantom shipments)\'에 해당할 수 있다.','이러한 사례는 금융회사의 무역거래 모니터링 대상이 될 수 없다.','이 사례는 TBML과 무관한 단순 계약 위반 사안이다.','실제 화물 이동이 없었다는 사실은 자금세탁 위험 평가와 무관하다.'],0,
  '실제 재화의 이동 없이 무역서류만을 이용하여 결제가 이루어지는 것은 TBML의 전형적 수법인 "유령선적(phantom shipments)"에 해당할 수 있는 대표적 사례예요. 금융회사는 이러한 무역거래에 대한 모니터링을 통해 TBML 위험을 식별해야 해요.','ultra'),
M('jd1_1',
  '국제기준(비엔나 협약·팔레모 협약)에서 정의하는 자금세탁(Money Laundering)의 3가지 유형에 해당하지 않는 것은?',
  ['당해 재산의 취득 경위와 무관하게, 금융회사가 정상적인 절차에 따라 예금계좌를 개설해 주는 경우.','당해 재산이 마약밀매·범죄 등에서 유래된 자산임을 알면서도 그 불법 출처를 은닉하거나 가장할 목적으로, 또는 관련자의 법적 책임을 면하게 할 뿐만 아니라 지원을 목적으로 당해 재산의 전환 또는 이체하는 경우.','당해 재산이 범죄 또는 그러한 범죄의 가담에서 유래된 자산임을 수취 시점에 알면서도 그것의 취득, 소유 또는 사용하는 경우.','당해 재산이 범죄 또는 그러한 범죄의 가담에서 유래된 자산임을 알면서도 그것의 성질, 출처, 소재, 처분, 이동 권리 또는 소유권의 은닉 또는 가장하는 경우.'],0,
  '비엔나·팔레모 협약이 정의하는 자금세탁의 3가지 유형은 ①불법재산의 전환·이체(은닉·가장·법적책임 회피 목적) ②불법재산의 성질·출처·소재·처분·이동권리·소유권의 은닉·가장 ③수취 시점에 불법재산임을 알면서 취득·소유·사용하는 것이에요. "금융회사의 정상적인 예금계좌 개설"은 자금세탁의 정의에 해당하지 않는 통상적 업무예요.','ultra'),
M('jd1_1',
  '국제자금세탁방지기구(FATF)가 FATF 40 권고사항 서문에서 기술한 자금세탁의 정의로 가장 옳은 것은?',
  ['금융기관이 고객의 신원을 확인하는 절차.','국제무역거래에서 발생하는 모든 대금결제 절차.','국가 간 조세 정보를 교환하는 절차.','범죄수익의 불법원천을 가장하기 위한 과정(the process of criminal proceeds in order to disguise their illegal origin).'],3,
  'FATF는 40 권고사항 서문에서 자금세탁을 "범죄수익의 불법원천을 가장하기 위한 과정(the process of criminal proceeds in order to disguise their illegal origin)"이라고 정의하고 있어요.','ultra'),
M('jd1_1',
  '국제기준에서의 테러자금조달 정의에 대한 설명으로 옳지 않은 것은?',
  ['이 협약상 자금이 실제로 특정 테러행위에 사용되었다는 사실이 반드시 입증되어야만 테러자금조달죄가 성립한다.','UN은 「테러자금 억제를 위한 국제협약(International Convention for the Suppression of the Financing of Terrorism, 1999)」에서 테러에 대하여 정의하고 테러자금조달의 범죄화와 이에 대한 확인, 탐지, 동결, 몰수에 대해 정의하고 있다.','이 협약상 자금이 협약 별첨(annex)에 기재된 범위와 범죄가 되는 행위, 또는 대중을 협박하거나 정부·국제기구가 어떤 행위를 하도록 강요하거나 금지하려는 목적으로 하는 행위 등에 이용되어야 한다는 의도를 가지고 자금을 제공·모집하는 것을 범죄로 규정한다.','FATF는 테러자금조달을 "테러 행위, 테러리스트 및 테러조직에 자금을 조달하는 것(Terrorist financing is the financing of terrorist acts, and of terrorists and terrorist organisations.)"이라고 정의한다.'],0,
  '이 협약(1999)의 정의에 따르면, 무장 충돌 상황에서 시민이나 적대행위에 가담하지 않는 다른 개인들을 사망하게 하거나 심각한 범죄를 위해 자금이 "실제로 이용되는 것이 요구되지 않아야 한다"고 명시하고 있어요. 즉 자금이 실제 테러행위에 사용되었다는 사실의 입증은 요구되지 않아요.','ultra'),
M('jd1_1',
  '<보기> 중 테러자금 억제를 위한 국제협약(1999)에 대한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. 자금이 협약상의 범죄를 저지르는 데 이용된다는 것을 알면서도 직접적 또는 간접적, 불법적이고 고의로 자금을 제공하거나 모집하는 경우를 범죄로 규정한다.\nㄴ. 테러자금조달의 범죄화뿐 아니라 이에 대한 확인, 탐지, 동결, 몰수에 대해서도 정의하고 있다.\nㄷ. 2001년 9·11 테러 이후 FATF 40 권고사항에 9개 특별권고로 테러자금조달금지(CFT)가 반영되었다.\nㄹ. FATF 40 권고사항은 2012년 및 2023년 11월 개정 이후로는 더 이상 개정되지 않을 예정임이 이 협약에 명시되어 있다.',
  ['ㄱ, ㄴ, ㄷ.','ㄱ, ㄴ, ㄷ, ㄹ.','ㄴ, ㄷ, ㄹ.','ㄱ, ㄹ.'],0,
  'ㄱ, ㄴ, ㄷ이 옳아요. ㄹ은 틀려요 — 이 협약에는 FATF 40 권고사항의 향후 개정 여부에 대한 언급이 없으며, "더 이상 개정되지 않을 예정"이라는 서술은 근거 없는 오답이에요.','ultra'),
M('jd1_1',
  '국제자금세탁방지기구(FATF)의 자금세탁 목적에 대한 설명(참고1)으로 옳지 않은 것은?',
  ['범죄자는 기저 활동이나 관련자에게 관심이 집중되지 않도록 출처를 위장하거나 형태를 바꾸거나 관심을 덜 받을 곳으로 자금을 이동시켜 자금을 통제하려 한다.','FATF는 자금세탁에 대한 우려가 높아짐에 따라 1999년 G7 정상회담에서 파리에 설립되었으며, 처음부터 30개의 권고사항만을 개발하는 것을 목표로 하였다.','불법 무기 판매, 밀수, 마약 밀매 및 성매매를 포함한 조직범죄의 활동은 막대한 수익을 창출할 수 있으며, 횡령·내부자거래·뇌물수수·컴퓨터 사기 또한 막대한 이익을 창출하여 이를 자금세탁을 통해 "합법화"하려는 유인을 만든다.','다수의 범죄행위의 목표는 그 행위를 수행하는 개인 또는 집단을 위한 이익을 창출하는 것이며, 자금세탁은 이러한 범죄수익을 불법적 원천을 감추기 위해 처리하는 과정이다.'],1,
  'FATF는 자금세탁에 대한 우려가 높아짐에 따라 "1989년" G7 정상회담에서 파리에 설립되었으며, 초기 과제 중 하나로 각국 정부가 효과적인 자금세탁방지 프로그램을 이행하기 위해 취해야 할 조치를 규정한 "40개"의 권고사항을 개발하는 것이었어요. "1999년", "30개 권고사항"이라는 서술은 모두 옳지 않아요.','ultra'),
M('jd1_1',
  '자금세탁의 특성 중 "국제범죄성(International Crime)"에 대한 설명으로 옳지 않은 것은?',
  ['자금세탁방지 등의 체계가 미흡하거나 시행되고 있지 않은 국가도 자금세탁의 국제적 경유지로 선호될 수 있다.','국제범죄성은 자금세탁이 반드시 2개 이상의 국가에서 발생해야만 성립하는 법적 요건을 의미하며, 국내에서만 발생하는 자금세탁은 법적으로 자금세탁에 해당하지 않는다.','국제적으로 선호되는 자금세탁 경유지는 금융비밀보장이 철저하고 조세면제 또는 저세율의 세금이 부과되는 조세피난처(Tax Haven), 역외금융센터(Off-shore financing center)가 운용되는 국가 등을 들 수 있다.','자금세탁은 일반적으로 한 국가 내에서만 이루어지는 것이 아니고, 금융기관·무역거래·전자지갑(Electronic Wallet) 등 다양한 수단을 동원하여 2개 국가 이상의 국경을 넘나드는 것을 말한다.'],1,
  '국제범죄성은 자금세탁의 "가장 중요한 특징" 중 하나로 국경을 넘나드는 경향이 있다는 의미일 뿐, 국내에서만 발생하는 자금세탁 행위가 법적으로 자금세탁에 해당하지 않는다는 의미는 아니에요. 국내 자금세탁 역시 자금세탁 범죄의 정의에 해당할 수 있어요.','ultra'),
M('jd1_1',
  '자금세탁의 특성 중 "조직범죄성(Organized Crime)"과 "화이트칼라형 범죄(White-Collar)"에 대한 설명으로 옳지 않은 것은?',
  ['자금세탁은 자금의 실제 소유자가 직접 또는 단독으로 자금세탁을 수행하는 경우는 일부이고, 은밀하게 범죄조직에 의해 진행되는 것이 일반적이다.','화이트칼라형 범죄는 전문지식과 IT 기술 등이 필요한 범죄로서, 대부분 발견하기 쉽고 다른 범죄에 비해 국가나 사회에 미치는 피해가 직접적이면서도 작다는 특징을 가진다.','조직범죄는 공공기관 및 금융기관 종사자, 세관원, 투자자문 등 분야뿐 아니라 특정비금융사업자(DNFBPs) 관련 전문가들도 자금세탁의 위험에 노출되고 있으며 일부는 관여하고 있다.','화이트칼라형 범죄에 연루된 개인이나 조직은 경제적 이득을 취할 때 사회적 지위나 직업적 특성 및 권한을 이용한다.'],1,
  '화이트칼라형 범죄는 대부분 "발견하기 어렵고", 다른 범죄에 비해 국가나 사회에 미치는 피해가 "간접적이면서도 크다"는 특징을 가져요. "발견하기 쉽고 피해가 직접적이면서도 작다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_1',
  '자금세탁의 3단계 중 "예치·배치(Placement)"에 대한 설명과 주요 사례로 옳은 것은?',
  ['자금세탁행위자가 범죄자금의 출처와 소유주를 감추기 위하여 여러 가지 금융거래 단계를 거쳐 거래빈도, 거래량 등에서 정상적인 금융거래와 유사하게 만들어 자금추적을 불가능하게 만드는 단계이며, 주요 사례로는 허위서류 작성, 입출금 반복 등이 있다.','충분한 반복단계를 거쳐 출처 추적이 불가능하게 된 불법자금을 정상적인 금융과 사업활동 등으로 합법재산으로 통합시키는 과정이며, 주요 사례로는 허위송장 발행, 위장회사를 통한 부동산 매각 등이 있다.','범죄행위로 취득한 불법재산을 취급하기 용이하고 덜 의심되는 형태로 변형하여 수사기관에 적발되지 않도록 그 소재를 이전하여 최종적으로 금융기관에 유입시키는 단계이며, 주요 사례로는 자금 혼합, 환치기 거래, 금액 분할, 대출 등이 있다.','자금세탁의 3단계 중 최종 단계로서 몰수와 추징이 이루어지는 단계를 말한다.'],2,
  '예치·배치(Placement)는 불법재산을 취급하기 용이하고 덜 의심되는 형태로 변형하여 최종적으로 금융기관에 유입시키는 단계로, 자금 혼합, 환치기(환거래) 거래, 금액 분할, 대출 등이 주요 사례예요. ②는 은폐·반복(Layering), ③은 합법화·통합(Integration) 단계의 설명이에요.','ultra'),
M('jd1_1',
  '<보기>의 사례를 자금세탁 3단계와 옳게 짝지은 것은?\nㄱ. 자금 혼합, 환치기 거래, 금액 분할, 대출\nㄴ. 허위서류 작성, 입출금 반복, 국가간 자금이동, 전자자금 이체\nㄷ. 허위송장 발행, 수출가격 조작, 위장회사를 통한 부동산 매각',
  ['ㄱ-은폐·반복 / ㄴ-예치·배치 / ㄷ-합법화·통합.','ㄱ-예치·배치 / ㄴ-합법화·통합 / ㄷ-은폐·반복.','ㄱ-합법화·통합 / ㄴ-은폐·반복 / ㄷ-예치·배치.','ㄱ-예치·배치 / ㄴ-은폐·반복 / ㄷ-합법화·통합.'],3,
  '예치·배치(ㄱ: 자금 혼합·환치기·금액분할·대출), 은폐·반복(ㄴ: 허위서류 작성·입출금 반복·국가간 자금이동·전자자금이체), 합법화·통합(ㄷ: 허위송장 발행·수출가격 조작·위장회사를 통한 부동산 매각)이 옳은 짝이에요.','ultra'),
M('jd1_1',
  '자금세탁방지(AML/CFT)의 글로벌 기본원칙 중 "사법제도"에 대한 설명으로 옳지 않은 것은?',
  ['자금세탁행위를 범죄로 규정하는 것은 가장 필수적이며 기본적인 사항으로서, 범죄행위 또는 불법활동으로부터 유래된 불법수익의 세탁행위를 범죄로 규정하여 처벌할 수 있도록 각국의 입법체계를 정비하는 것을 말한다.','1990년대 후반 국제자금세탁방지기구가 전제범죄 범위를 마약류 범죄에서 조세범죄로 한정하여 축소하는 방향으로 개정하였다.','전제범죄(Predicate Offense)로 정립되지 않은 범죄(crime without direct victims)는 불법자금세탁행위로서 처벌할 수 없다.','1990년대 이전까지는 주로 마약류 범죄만을 전제 범죄로 규정하였으나, 1996년 국제자금세탁방지기구는 40 권고사항을 개정하여 전제범죄를 모든 중대범죄로 그 범위를 확대하도록 의무화하였다.'],1,
  '1990년대 이전에는 마약류 범죄만 전제범죄로 규정하였으나, 1996년 국제자금세탁방지기구가 40 권고사항을 개정해 전제범죄를 모든 중대범죄로 확대하였어요. "조세범죄로 한정하여 축소하였다"는 서술은 확대·축소 방향이 반대로 되어 있어 옳지 않아요.','ultra'),
M('jd1_1',
  '자금세탁방지(AML/CFT)의 글로벌 기본원칙 중 "금융제도"의 구성요소에 해당하지 않는 것은?',
  ['기록보존(Record Keeping).','전제범죄를 모든 중대범죄로 확대하는 입법체계 정비.','의심거래보고(Suspicious Transaction Report) 및 고액현금거래보고(Currency Transaction Report).','고객확인의무(Customer Due Diligence).'],1,
  '금융제도의 구성요소는 고객확인의무(CDD), 기록보존(Record Keeping), 의심거래보고(STR), 고액현금거래보고(CTR), FIU 설치·운영 및 국제협력 등이에요. "전제범죄를 모든 중대범죄로 확대하는 입법체계 정비"는 금융제도가 아니라 "사법제도" 영역의 내용이에요.','ultra'),
M('jd1_1',
  '자금세탁방지 규제를 구성하는 세 가지 축에 대한 설명으로 옳지 않은 것은?',
  ['국가간 자금세탁 관련 정보교환, 범죄인 인도, 사법공조와 같은 제도는 자금세탁방지 규제의 세 가지 축에 포함되지 않는 부차적인 사항이다.','사법규제 측면에서는 자금세탁행위 및 공중협박자금조달행위를 범죄로 규정하여 처벌하고, 그로부터 얻은 수익 및 재산을 몰수·추징하며, 금융회사등이 범죄수익의 사실을 수사기관에 신고하도록 하고 있다.','자금세탁방지 규제는 금융제도, 사법제도 및 국제협력체계 등 세 가지 축으로 이루어진다.','금융규제 측면에서는 금융회사등에게 고객확인의무와 자금세탁행위 및 공중협박자금 조달행위로 의심되는 거래, 고액현금거래를 보고하는 의무를 부과한다.'],0,
  '국가간 자금세탁 관련 정보교환, 범죄인 인도, 사법공조 등은 "국제협력체계"라는 세 번째 축을 구성하는 핵심 내용이에요. "세 가지 축에 포함되지 않는 부차적 사항"이라는 서술은 옳지 않아요.','ultra'),
M('jd1_1',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 비엔나 협약과 팔레모 협약에서 정의하는 자금세탁의 유형은 전환·이체, 은닉·가장, 취득·소유·사용의 3가지이다.\nㄴ. FATF는 1990년 G7 정상회담에서 파리에 설립되었다.\nㄷ. 자금세탁의 3단계는 예치·배치, 반복·은폐, 검증·확인으로 구성된다.\nㄹ. 1996년 FATF 40 권고사항 개정으로 전제범죄의 범위가 오히려 마약범죄로만 축소되었다.\nㅁ. 자금세탁방지 규제는 금융제도, 사법제도, 국제협력체계의 3가지 축으로 구성된다.',
  ['4개.','5개.','3개.','2개.'],3,
  'ㄱ, ㅁ은 옳은 설명이에요. 1996년 개정은 전제범죄 범위를 축소가 아니라 모든 중대범죄로 확대한 것이고(ㄹ), FATF는 1990년이 아니라 1989년 설립(ㄴ), 자금세탁 3단계는 "반복·은폐, 검증·확인"이 아니라 "예치·배치, 은폐·반복, 합법화·통합"이에요(ㄷ).','ultra'),
M('jd1_1',
  '<보기>의 사례를 자금세탁 3단계 중 어디에 해당하는지 가장 적절하게 판단한 것은?\n[사례] 범죄조직 A는 마약 밀매로 얻은 현금을 여러 명의 명의로 나누어 소액씩 은행에 입금한 후(1단계), 이 자금을 여러 국가의 계좌로 반복해서 이체하여 거래빈도와 거래량을 정상거래처럼 보이게 하였다(2단계). 이후 위장회사를 설립하여 이 자금으로 부동산을 매입해 합법적인 자산으로 전환하였다(3단계).',
  ['1단계는 예치·배치, 2단계는 은폐·반복, 3단계는 합법화·통합에 해당한다.','1단계는 은폐·반복, 2단계는 예치·배치, 3단계는 합법화·통합에 해당한다.','1단계는 합법화·통합, 2단계는 은폐·반복, 3단계는 예치·배치에 해당한다.','세 단계 모두 은폐·반복 단계에 해당한다.'],0,
  '현금을 나누어 은행에 입금하는 것(1단계)은 예치·배치, 여러 국가 계좌로 반복 이체하여 정상거래처럼 보이게 하는 것(2단계)은 은폐·반복, 위장회사를 통해 부동산을 매입하여 합법적 자산으로 전환하는 것(3단계)은 합법화·통합에 해당해요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제2조(정의)에서 규정하는 "금융회사등"의 범위에 해당하지 않는 것은?',
  ['「가상자산 이용자 보호 등에 관한 법률」 제2조 제2호에 따른 가상자산사업자.','「관광진흥법」에 따라 허가를 받아 카지노업을 하는 카지노 사업자.','「보험업법」에 따른 보험회사.','제2호에 따른 금융거래등을 하지 않는, 순수하게 컨설팅만 제공하는 경영자문업체.'],3,
  '특정금융정보법상 "금융회사등"에는 한국산업은행, 한국수출입은행, 중소기업은행, 은행, 자본시장법상 투자매매업자 등, 상호저축은행, 농협·수협, 신용협동조합, 새마을금고, 보험회사, 체신관서뿐 아니라 카지노 사업자, 가상자산사업자 등도 포함돼요. "금융거래등을 하지 않는 순수 컨설팅 경영자문업체"는 이 법상 금융회사등에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제2조 제2호(금융거래등)의 정의에 대한 설명으로 옳지 않은 것은?',
  ['금융회사등이 금융자산(금융실명법 제2조 제2호에 따른 금융자산)을 수입·매매·환매·중개·할인·발행·상환·환급·수탁·등록·교환하거나 그 이자·할인액 또는 배당을 지급하는 것과 이를 대행하는 것, 그 밖에 금융자산을 대상으로 하는 거래로서 대통령령으로 정하는 것을 포함한다.','자본시장법에 따른 파생상품시장에서의 거래, 그 밖에 대통령령으로 정하는 것도 포함된다.','카지노사업자의 영업장에서 현금 또는 수표를 대신하여 쓰이는 것으로서 대통령령으로 정하는 것과 현금 또는 수표를 교환하는 거래도 포함된다.','가상자산사업자가 「가상자산 이용자 보호 등에 관한 법률」에 따라 수행하는 업무는 "금융거래등"의 정의에서 명시적으로 제외된다.'],3,
  '제2조 제2호 라목은 가상자산사업자가 「가상자산 이용자 보호 등에 관한 법률」에 따라 수행하는 업무(이하 "가상자산거래")를 "금융거래등"의 정의에 "포함"시키고 있어요. "명시적으로 제외된다"는 서술은 원문과 반대예요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제2조 제4호(자금세탁행위)의 정의에 해당하지 않는 것은?',
  ['범죄수익은닉규제법 제3조에 따른 범죄행위.','조세범 처벌법 제3조, 관세법 제270조, 지방세기본법 제102조 또는 특정범죄가중처벌 등에 관한 법률 제8조의 죄를 범할 목적 또는 조세·지방세를 포탈할 목적으로 재산의 취득·처분 또는 발생 원인에 관한 사실을 가장하거나 그 재산을 은닉하는 행위.','적법하게 신고·납부된 세금으로 정상적인 금융거래를 하는 행위.','마약류 불법거래 방지에 관한 특례법 제7조에 따른 범죄행위.'],2,
  '자금세탁행위는 범죄수익은닉규제법상 범죄행위, 마약류 불법거래 방지에 관한 특례법상 범죄행위, 조세·관세·지방세 포탈 목적의 재산 취득·처분·발생원인 사실의 가장·은닉 행위 등으로 정의돼요. "적법하게 신고·납부된 세금으로 정상적인 금융거래를 하는 행위"는 자금세탁행위의 정의에 해당하지 않는 통상적 적법 행위예요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제3조(금융정보분석원)에 대한 설명으로 옳지 않은 것은?',
  ['금융정보분석원(FIU)은 금융위원회 소속으로 설치되며, 보고받거나 통보받은 사항의 정리·분석 및 제공, 금융회사등이 수행하는 업무에 대한 감독 및 검사 등의 업무를 효율적으로 수행한다.','금융정보분석원의 장(FIU장)은 업무 수행과 관련하여 국회가 아니라 감사원에 매년 정기적으로 보고하여야 하는 의무를 부담한다.','금융정보분석원의 정원과 조직 및 운영 등에 필요한 사항은 업무의 독립성, 정치적 중립성 등을 고려하여 대통령령으로 정한다.','금융정보분석원은 그 권한에 속하는 사무를 독립적으로 수행하며, 그 소속 공무원은 특정금융정보법과 테러자금금지법에 따른 업무 외의 다른 업무를 겸직할 수 없다.'],1,
  '금융정보분석원의 장(FIU장)은 업무 수행과 관련하여 매년 정기국회에 보고하여야 해요. "국회가 아니라 감사원에 보고한다"는 서술은 보고 대상 기관이 잘못되어 옳지 않아요.','ultra'),
M('jd2_7b',
  '<보기> 중 금융정보분석원(FIU)의 장이 매년 정기국회에 보고해야 하는 사항에 해당하는 것을 모두 고른 것은?\nㄱ. 금융회사등으로부터 보고받은 건수\nㄴ. 특정금융거래정보의 제공요청 건수 및 제공한 건수\nㄷ. 통보 및 통보유예 현황에 관한 통계자료\nㄹ. 외국금융정보분석기구와 정보교환한 건수',
  ['ㄱ, ㄴ만.','ㄱ, ㄴ, ㄷ, ㄹ 모두.','ㄷ, ㄹ만.','ㄱ, ㄷ만.'],1,
  'FIU장은 ①금융회사등으로부터 보고받은 건수 ②특정금융거래정보 제공요청 및 제공한 건수 ③통보·통보유예 현황 통계자료 ④외국금융정보분석기구와 정보교환한 건수 ⑤기타 FIU 업무 관련 통계자료를 매년 정기국회에 보고해야 해요. ㄱ~ㄹ 모두 해당돼요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제4조(불법재산 등으로 의심되는 거래의 보고, STR)에 대한 설명으로 옳지 않은 것은?',
  ['금융회사등은 금융거래등과 관련하여 수수한 재산이 불법재산이라고 의심되는 합당한 근거가 있는 경우 대통령령으로 정하는 바에 따라 지체 없이 그 사실을 FIU장에게 보고하여야 한다.','금융회사등에 종사하는 자는 제1항에 따른 보고를 하려고 하거나 보고를 하였을 때에는 그 사실을 준법감시인에게는 사전에 알려야 하나, 보고책임자에게는 알릴 필요가 없다.','금융회사등은 제1항에 따라 보고를 할 때에는 그 의심되는 합당한 근거를 분명하게 밝혀야 한다.','제1항에 따라 보고를 한 금융회사등(금융회사등의 종사자를 포함한다)은 고의 또는 중대한 과실로 인하여 거짓 보고를 한 경우 외에는 그 보고와 관련된 금융거래등의 상대방 및 그의 관계자에 대하여 손해배상책임을 지지 아니한다.'],1,
  'Tip-off 금지 규정상 "다른 사람"은 보고책임자의 보고체계를 제외한 그 어떤 자도 포함하는 넓은 개념으로, 준법감시인을 포함한 금융회사 내부의 다른 부서에도 보고 사실을 누설해서는 안 돼요. "준법감시인에게는 사전에 알려야 하나 보고책임자에게는 알릴 필요가 없다"는 서술은 원칙이 뒤바뀌어 옳지 않아요.','ultra'),
M('jd2_7b',
  '<보기> 중 특정금융정보법 제4조 제1항에 따라 의심거래보고(STR) 대상이 되는 경우를 모두 고른 것은?\nㄱ. 금융거래등과 관련하여 수수한 재산이 불법재산이라고 의심되는 합당한 근거가 있는 경우\nㄴ. 금융거래등의 상대방이 금융실명법 제3조 제3항을 위반하여 불법적인 금융거래를 하는 등 차명거래행위나 공중협박자금조달행위를 하고 있다고 의심되는 합당한 근거가 있는 경우\nㄷ. 범죄수익은닉규제법 제5조 제1항 및 테러자금금지법 제5조 제2항에 따라 금융회사등의 종사자가 관할 수사기관에 신고한 경우\nㄹ. 고객이 실명이 확인된 계좌로 정상적인 급여를 이체받는 경우',
  ['ㄱ, ㄹ.','ㄱ, ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄴ, ㄷ, ㄹ.'],2,
  'ㄱ, ㄴ, ㄷ은 제4조 제1항 각 호가 규정하는 STR 대상 사유예요. ㄹ(정상적인 급여 이체)은 통상적인 적법 거래로 의심거래보고 대상에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제4조의2(금융회사등의 고액현금거래 보고, CTR)에 대한 설명으로 옳지 않은 것은?',
  ['금융회사등은 5천만원의 범위에서 대통령령으로 정하는 금액 이상의 현금(외국통화는 제외한다)이나 현금과 비슷한 기능의 지급수단으로서 대통령령으로 정하는 것을 금융거래등의 상대방에게 지급하거나 그로부터 영수한 경우에는 그 사실을 30일 이내에 FIU장에게 보고하여야 한다.','다른 금융회사등(대통령령으로 정하는 자는 제외한다)과의 현금등의 지급 또는 영수는 보고 대상에서 제외될 수 있다.','국가, 지방자치단체, 그 밖에 대통령령으로 정하는 공공단체와의 현금등의 지급 또는 영수는 다른 금융회사등과의 거래와는 달리 보고 대상에서 원칙적으로 배제되지 않는 일반 거래로 취급된다','금융회사등은 금융거래등의 상대방이 보고 기준금액 이상의 거래를 회피할 목적으로 금액을 분할하여 금융거래등을 하고 있다고 의심되는 합당한 근거가 있는 경우에는 그 사실을 금융정보분석원장에게 보고하여야 한다.'],2,
  '국가·지방자치단체·대통령령으로 정하는 공공단체와의 현금등 지급·영수는 다른 금융회사등과의 거래와 마찬가지로 보고 대상에서 제외될 수 있는 예외 항목이에요. "보고 대상에서 배제되지 않는 일반 거래로 취급된다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제4조의2 제3항에 따른 "중계기관"에 대한 설명으로 옳지 않은 것은?',
  ['금융정보분석원장은 고액 현금거래 보고에 관한 자료를 중계하는 기관(중계기관)으로 특정 기관을 지정·운영할 수 있다.','「상호저축은행법」에 따라 설립된 상호저축은행중앙회는 중계기관으로 지정될 수 있는 대상에서 명시적으로 배제된다.','「민법」 제32조에 따라 금융위원회의 허가를 받아 설립된 사단법인인 전국은행연합회가 중계기관으로 지정될 수 있다.','「자본시장과 금융투자업에 관한 법률」 제283조에 따라 설립된 한국금융투자협회가 중계기관으로 지정될 수 있다.'],1,
  '「상호저축은행법」 제25조에 따라 설립된 상호저축은행중앙회도 고액현금거래 보고 자료를 중계하는 기관(중계기관)으로 지정될 수 있는 대상 중 하나예요. "명시적으로 배제된다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조(금융회사등의 조치 등)에 따라 금융회사등이 마련해야 하는 절차 및 업무지침에 포함되어야 하는 사항으로 옳지 않은 것은?',
  ['자금세탁행위와 공중협박자금조달행위 방지 업무를 담당하는 부서를 신설하지 않고, 오직 외부 컨설팅업체에 전면 위탁하여야 한다는 사항.','자금세탁행위와 공중협박자금조달행위의 방지 업무를 수행하는 부서로부터 독립된 부서나 기관에서 그 업무수행의 적절성, 효과성을 검토·평가하고 이에 따른 문제점을 개선하기 위한 업무체계의 마련 및 운영에 관한 사항.','금융거래등에 내재된 자금세탁행위와 공중협박자금조달행위의 위험을 식별·분석·평가하여 위험도에 따라 관리 수준을 차등화하는 업무체계의 구축 및 운영에 관한 사항.','그 밖에 자금세탁행위와 공중협박자금조달행위를 효율적으로 방지하기 위하여 대통령령으로 정하는 사항.'],0,
  '제5조 제3항이 규정하는 절차·업무지침 포함 사항은 위험식별·분석·평가에 따른 관리수준 차등화 업무체계, 독립된 부서·기관에 의한 업무수행 적절성·효과성 검토·평가 체계, 그 밖에 대통령령으로 정하는 사항이에요. "부서를 신설하지 않고 외부 컨설팅업체에 전면 위탁"해야 한다는 내용은 이 법이 규정하는 사항이 아니에요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조의2(금융회사등의 고객확인의무, CDD)에 대한 설명으로 옳지 않은 것은?',
  ['금융회사등은 금융거래등을 이용한 자금세탁행위 및 공중협박자금조달행위를 방지하기 위하여 합당한 주의(注意)로서 각 호의 구분에 따른 조치를 하여야 하며, 이를 위한 업무지침을 작성하고 운용하여야 한다.','고객이 계좌를 신규로 개설하거나 대통령령으로 정하는 금액 이상으로 일회성 금융거래를 하는 경우에는 고객의 신원에 관한 사항과 고객을 최종적으로 지배하거나 통제하는 자연인(실제 소유자)에 관한 사항을 확인하여야 한다.','고객이 가상자산사업자인 경우에는 가상자산사업자의 신고 및 변경신고의 이행에 관한 사항 등을 추가로 확인하여야 한다.','금융회사등은 고객확인의무 이행 시 고객의 신원사항만 확인하면 충분하며, 실제 소유자에 관한 사항이나 가상자산사업자 관련 사항은 확인할 필요가 없다.'],3,
  '고객확인의무는 단순한 신원확인을 넘어, 고객을 최종적으로 지배·통제하는 실제 소유자에 관한 사항, 그리고 고객이 가상자산사업자인 경우 신고·변경신고 이행 여부 등도 함께 확인하도록 요구해요. "신원사항만 확인하면 충분하다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조의2 제4항에 따라 금융회사등이 신규거래를 거절하거나 기존 거래관계를 종료하여야 하는 사유에 해당하지 않는 것은?',
  ['고객이 단순히 외국인이라는 이유만으로 거래를 거절하거나 종료하여야 한다.','고객이 신원확인 등을 위한 정보 제공 등을 거부하는 등의 사유로 고객확인을 할 수 없는 경우.','고객이 가상자산사업자인 경우로서 신고·변경신고 의무를 이행하지 아니한 사실이 확인된 경우.','고객이 가상자산사업자인 경우로서 신고가 수리되지 아니한 사실 또는 신고나 변경신고가 직권으로 말소된 사실이 확인된 경우.'],0,
  '신규거래 거절·기존거래 종료 사유는 고객확인 불가, 가상자산사업자의 신고·변경신고 미이행, 신고 미수리, 신고·변경신고 직권말소, 자금세탁행위 등의 위험성이 특별히 높다고 판단되는 경우로서 대통령령으로 정하는 경우 등이에요. "단순히 외국인이라는 이유만으로" 거래를 거절·종료해야 한다는 것은 이 법이 규정하는 사유가 아니에요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조의2 제5항에 대한 설명으로 가장 옳은 것은?',
  ['금융회사등은 제4항에 따라 거래를 거절하거나 종료하는 경우에는 제4조에 따른 의심되는 거래의 보고 여부를 검토하여야 한다.','거래 거절이나 종료 시에는 CTR(고액현금거래보고) 여부만 검토하면 되고 STR 검토는 불필요하다.','거래 거절이나 종료는 반드시 관할 수사기관의 사전 승인을 받아야만 가능하다.','거래 거절이나 종료 시에는 어떠한 후속 검토도 필요하지 않다.'],0,
  '제5조의2 제5항은 금융회사등이 제4항에 따라 거래를 거절하거나 종료하는 경우 제4조에 따른 의심거래보고(STR) 여부를 검토하도록 규정하고 있어요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조의3(전신송금 시 정보제공)에 대한 설명으로 옳지 않은 것은?',
  ['전신송금(電信送金)이란 송금인의 계좌보유 여부를 불문하고 금융회사등을 이용하여 국내외의 다른 금융회사등으로 자금을 이체하는 서비스를 말한다.','금융회사등은 송금인이 전신송금의 방법으로 500만원의 범위에서 대통령령으로 정하는 금액 이상을 송금하는 경우에는 송금인 및 수취인에 관한 정보를 송금받는 금융회사등(수취금융회사)에 제공하여야 한다.','국내송금의 경우 송금인의 성명(법인인 경우에는 법인의 명칭을 말한다) 등에 관한 정보를 제공하여야 한다.','전신송금 시 정보제공 의무는 해외송금에 대해서만 적용되는 규정으로, 국내송금에 대해서는 별도의 법령 근거가 마련되어 있지 않은 것으로 이해해야 한다'],3,
  '전신송금 정보제공 의무는 해외송금뿐 아니라 국내송금에도 적용되며, 국내송금의 경우 송금인 성명 등에 관한 정보를 제공해야 해요. "해외송금에 대해서만 적용될 뿐 국내송금에는 법령 근거가 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 특정금융정보법 제2조상 "금융회사등"에는 카지노 사업자와 가상자산사업자도 포함된다.\nㄴ. 특정금융정보법 제3조에 따라 금융정보분석원(FIU)은 금융위원회 소속으로 설치된다.\nㄷ. 특정금융정보법 제4조에 따른 STR 보고 시 금융회사등은 의심되는 합당한 근거를 분명하게 밝혀야 한다.\nㄹ. 특정금융정보법 제4조의2에 따른 CTR 보고 기준금액은 5천만원의 범위에서 대통령령으로 정한다.\nㅁ. 특정금융정보법 제5조의2에 따라 고객이 계좌를 신규 개설하는 경우 고객 신원 및 실제 소유자에 관한 사항을 확인하여야 한다.',
  ['4개.','3개.','5개.','2개.'],0,
  'ㄱ, ㄴ, ㄷ, ㅁ은 옳은 설명이에요. CTR 보고 기준금액은 5천만원이 아니라 1천만원의 범위에서 대통령령으로 정해요(ㄹ).','ultra'),
M('jd2_7b',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 직원 甲은 고객 A가 신규 계좌를 개설하려는 과정에서 A가 실제 소유자에 관한 정보 제공을 거부하였고, 신원확인에도 협조하지 않았다.',
  ['甲이 소속된 금융회사등은 특정금융정보법 제5조의2 제4항에 따라 A와의 신규거래를 거절하여야 하며, 제5항에 따라 의심되는 거래의 보고(STR) 여부를 검토하여야 한다.','신원확인 협조 거부는 금융실명법 위반에만 해당할 뿐, 특정금융정보법과는 무관하다.','이 경우 금융회사등은 CTR 보고만 하면 충분하고 STR 검토는 불필요하다.','실제 소유자 정보 제공 거부는 법적으로 아무런 문제가 되지 않으므로 정상적으로 계좌를 개설해 주면 된다.'],0,
  '고객이 신원확인을 위한 정보 제공 등에 협조하지 않아 고객확인을 할 수 없는 경우, 금융회사등은 제5조의2 제4항에 따라 신규거래를 거절하여야 하며, 제5항에 따라 이러한 거래 거절 시 제4조에 따른 의심거래보고(STR) 여부를 검토하여야 해요.','ultra'),
M('jd2_10',
  'VASP를 위한 자금이동규칙(Travel Rule)상 "Sanctions screening"에 대한 설명으로 옳지 않은 것은?',
  ['VASP는 가상자산의 이전이 발생할 때 서로의 고객에 대해 Sanctions screening을 수행해야 하며, 송금사업자는 수취인에 대해, 수취사업자는 송금인에 대해 이를 수행한다.','가상자산(VA) 이전이 필수 정보 전송 이전에 발생할 수도 있다는 특성을 고려하여, screening이 완료되기 전까지 지갑에 자산을 반영하는 것을 일시 중지하거나 VASP 외 지갑에 이전된 자산은 screening이 끝난 후에 고객 지갑으로 자산을 옮기는 등의 사전 통제장치를 구현해야 한다.','VA 이전이 필수 정보 전송보다 먼저 발생할 수 있다는 점은 전통적인 금융회사의 전신송금과 구별되는 가상자산 거래의 특성 중 하나이다.','Sanctions screening은 오직 국내 거래에만 적용되며, 국경을 넘는 VASP 간 거래에는 적용되지 않는다.'],3,
  'Sanctions screening은 국내외를 불문하고 VASP 간 가상자산 이전이 발생할 때 서로의 고객에 대해 수행해야 하는 조치로, 국경을 넘는 거래에도 당연히 적용돼요. "국내 거래에만 적용된다"는 서술은 옳지 않아요.','ultra'),
M('jd2_10',
  'VASP 간 거래에서 "VASP 조사(Due Diligence)"의 모범적 수행 방법(3단계)에 대한 설명으로 옳은 것은?',
  ['1단계: 거래상대방이 VASP인지 판단, 2단계: VASP의 확인(identification), 3단계: VASP가 믿을만한 거래상대방인지 평가하는 순서로 진행된다.','FATF는 지갑주소만으로 수취인 지갑을 관리하는 VASP를 기술적으로 완벽하게 식별할 수 있는 검증된 방법이 이미 확립되어 있다고 명시하였다.','모든 거래마다 예외 없이 Due Diligence를 재수행하여야 하며, 어떠한 경우에도 생략할 수 없다.','1단계: VASP가 믿을만한 거래상대방인지 평가, 2단계: 거래상대방이 VASP인지 판단, 3단계: VASP의 확인(identification) 순서로 진행된다.'],0,
  'VASP 조사(Due Diligence)의 모범적 수행 방법은 1단계(거래상대방이 VASP인지 판단) → 2단계(VASP의 확인, 이름 확인) → 3단계(VASP가 믿을만한 거래상대방인지 평가) 순서로 진행돼요. 모든 거래에서 Due Diligence를 재수행할 필요는 없으며(특별히 의심스러운 정황은 제외), FATF는 지갑주소만으로 VASP를 기술적으로 완벽하게 식별할 수 있는 검증된 방법을 알지 못한다고 명시하였어요.','ultra'),
M('jd2_10',
  'VASP끼리의 VA 이전 시 VASP 확인(Identification) 및 조사(Due Diligence)에 대한 설명으로 옳지 않은 것은?',
  ['VASP가 또 다른 VASP에 필수 정보를 제공할 때에는 1) VASP를 확인(Identify)하고 2) 그 VASP를 조사(Diligence)해야 한다.','VASP 확인 및 조사 절차는 자금이동규칙과 무관하게 오직 카지노 사업자에게만 적용되는 절차이다.','모든 거래에서 Due Diligence를 재수행할 필요는 없으며, 특별히 의심스러운 정황은 예외로 한다.','이 과정을 통해 VASP는 제공되는 정보의 기밀성(confidentiality)을 유지할 수 있을지 판단해야 한다.'],1,
  'VASP 확인(Identification) 및 조사(Due Diligence) 절차는 VASP를 위한 자금이동규칙(Travel Rule)의 일환으로 VASP 간 거래에 적용되는 절차로, 카지노 사업자와는 무관해요.','ultra'),
M('jd2_10',
  '유럽연합(EU)의 암호자산시장에 관한 법률(MiCA, Market in Crypto Asset)의 제정 배경에 대한 설명으로 옳지 않은 것은?',
  ['디지털 금융 패키지에는 디지털 금융 전략, 암호자산시장에 관한 규제법안(MiCA), 금융업체의 디지털 운영상 복원력 확보 요구 법안(DORA), 분산원장 기술의 금융시장인프라 시범 적용 방안 등 4가지 방안이 포함되었다.','2020년 9월, 유럽연합 집행위원회(European Commission)는 디지털 금융 패키지(digital finance package)를 발표하였다.','EU의 디지털 금융 패키지는 소비자와 투자자에 대한 적절한 보호 수준의 제공, 새로운 디지털 금융기술의 활용 및 혁신에 대한 지원을 목표로 하였다.','MiCA는 2020년 9월 초안 발표와 동시에 최종 법률로 확정되어 별도의 입법 절차 없이 즉시 발효되었다.'],3,
  'MiCA는 2020년 9월 초안 발표 이후 유럽각료이사회의 수정안, 유럽의회의 법률안 임시 채택, 3대 기관 간 협상(Trilogue) 등을 거쳐 2023년 5월 최종 가결되고 2023년 6월 29일에 발효되었어요. "초안 발표와 동시에 최종 확정되어 즉시 발효"라는 서술은 옳지 않아요.','ultra'),
M('jd2_10',
  '<보기>는 MiCA Regulation의 제정 경과 및 시행 예정일이다. 시간 순서대로 옳게 나열한 것은?\nㄱ. 유럽 각료이사회, 최종 법률안 가결\nㄴ. 유럽 집행위원회, 법률안 초안 공개 및 의견수렴\nㄷ. MiCA Regulation 공식 발효\nㄹ. 법률 성립(유럽의회 및 유럽 각료이사회 수장, 최종 법안 공동 서명)\nㅁ. 유럽 공식 관보에 공포',
  ['ㄹ → ㅁ → ㄱ → ㄴ → ㄷ.','ㄴ → ㄷ → ㅁ → ㄱ → ㄹ.','ㄴ → ㄱ → ㄹ → ㅁ → ㄷ.','ㅁ → ㄴ → ㄹ → ㄷ → ㄱ.'],2,
  '순서는 법률안 초안 공개·의견수렴(2020.9.24) → 유럽 각료이사회 최종 법률안 가결(2023.5.16) → 법률 성립·공동서명(2023.5.31) → 유럽 공식 관보 공포(2023.6.9) → MiCA 공식 발효(2023.6.29)예요.','ultra'),
M('jd2_10',
  'MiCA Regulation의 경과규정에 따른 시행 시점에 대한 설명으로 옳은 것은?',
  ['여타 암호자산 및 암호자산서비스제공자 관련 규정은 발효일부터 6개월 후에 시행되었다.','모든 암호자산 관련 규정은 발효와 동시에 예외 없이 일괄 시행되었다.','자산준거 토큰과 이머니 토큰 관련 규정은 나머지 규정보다 더 늦게 시행되었다.','자산준거 토큰(Asset Referenced Token) 및 이머니 토큰(E-money Token) 관련 규정은 발효일부터 12개월 후인 2024년 6월 30일부터 시행된다.'],3,
  'MiCA는 경과규정을 통해 자산준거 토큰(ART) 및 이머니 토큰(EMT) 관련 규정은 발효일부터 12개월 후인 2024년 6월 30일부터, 여타 암호자산 및 암호자산서비스제공자 관련 규정은 발효일부터 18개월 후인 2024년 12월 30일부터 단계적으로 시행되도록 구분하고 있어요.','ultra'),
M('jd2_10',
  'MiCA Regulation의 법적 성격에 대한 설명으로 옳지 않은 것은?',
  ['MiCA는 유럽의회와 유럽 각료이사회가 정한 EU의 Regulation, 즉 암호자산시장에 관한 법률이다.','MiCA의 정식 제목은 "Regulation (EU) 2023/1114 of the European Parliament and of the Council of 31 May 2023 on markets in crypto-assets"이다.','MiCA는 시장남용 행위에 관한 규칙이 매매거래가 허용된 암호자산 또는 매매거래 허용 신청이 이루어진 암호자산에 관한 행위 일체에 있어 그 거래, 주문 또는 행위가 거래플랫폼에서 발생하였는지를 불문하고 적용된다는 점을 명확히 하고 있다.','MiCA는 혁신을 저해하되 금융 안정성을 유지하면서 투자자를 보호하고 암호자산이 가진 잠재력을 끌어낼 수 있도록 암호자산시장에 대한 규제의 틀을 목표로 한다.'],3,
  'MiCA는 "혁신을 저해하되"가 아니라 "혁신을 지원하되" 금융 안정성을 유지하면서 투자자를 보호하고 암호자산이 가진 잠재력을 끌어낼 수 있도록 규제의 틀을 목표로 해요. "혁신을 저해"한다는 서술은 원문과 반대예요.','ultra'),
M('jd2_10',
  'MiCA Regulation의 주무당국, 유럽증권시장감독청(ESMA), 유럽은행감독청(EBA)의 협력과 권한에 대한 설명으로 옳지 않은 것은?',
  ['주무당국들의 행정제재와 기타 행정조치 권한, 감독 권한의 행사와 제재 부과 권한 및 이에 대한 항소 권한, 제재 등 결정 사실의 공표 권한, 법규 위반 사실에 대한 공익신고자 보호 요건 등은 MiCA의 규율 대상이 아니다.','ESMA나 EBA의 일시적 개입 권한, 주무당국들의 암호자산 상품 관련 개입 권한 등도 규정되어 있다.','MiCA는 회원국 주무당국들과 ESMA, EBA 간의 협력, 권한, 통지, 암호자산 분류체계의 수렴 촉진, 직무상 비밀 유지 의무, 데이터 보호, 위법행위 예방을 위한 조치 등을 규정한다.','ESMA가 유지하게 될 암호자산백서, 자산준거 토큰/이머니 토큰 발행자, 암호자산서비스제공자 등록부와 법규를 준수하지 않는 비준수업체 등록부의 유지 및 해당 등록부를 통해 공개되어야 할 정보의 범위 등을 규정하고 있다.'],0,
  'MiCA는 주무당국들의 행정제재·행정조치 권한, 감독 권한의 행사와 제재 부과 권한 및 이에 대한 항소 권한, 제재 등 결정 사실의 공표 권한, 법규 위반 사실에 대한 공익신고자 보호 요건 등도 명시적으로 규정하고 있어요. "규율 대상이 아니다"라는 서술은 옳지 않아요.','ultra'),
M('jd2_10',
  '가상자산 관련 국내 법률의 정비 경과에 대한 설명으로 옳지 않은 것은?',
  ['2018년 10월, FATF는 40 권고사항의 권고 15(새로운 기술), 권고 16(전신송금)의 가상자산 관련 부문 업데이트 후, G20(2018년 11월), FATF 10월 총회 등에서 가상자산 관련 각국의 자금세탁방지 관련 국제기준 이행을 촉구하였다.','특정금융정보법에서는 가상자산의 정의·범위 및 신고수리와 실명확인입출금계정, 가상자산사업자의 조치 등의 내용이 개정·반영되었으나, 가상자산이용자보호법은 이와 완전히 무관한 별개의 법률로서 어떠한 연계도 없다.','이에 따라 국내 자금세탁방지 법률인 특정금융정보법 시행령과 특정 금융거래정보 보고 및 감독규정이 2021년 3월 개정되었다.','시장 이용자 보호에 초점을 맞춘 「가상자산 이용자 보호 등에 관한 법률」(이하 가상자산이용자보호법)은 2023년 6월 30일에 국회 본회의를 통과하여 2024년 7월부터 시행되었다.'],1,
  '특정금융정보법과 가상자산이용자보호법은 서로 연계된 법률로, 특정금융정보법은 가상자산의 정의·신고수리·실명확인입출금계정·가상자산사업자의 조치 등을, 가상자산이용자보호법은 사업자의 고유재산과 고객예치금의 분리 보관 등 이용자 보호에 초점을 맞춘 내용을 규정해요. "완전히 무관한 별개의 법률로서 어떠한 연계도 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_10',
  '「가상자산 이용자 보호 등에 관한 법률」(가상자산이용자보호법)의 주요내용에 해당하지 않는 것은?',
  ['사업자의 고유재산과 고객 예치금을 동일한 종류 및 수량으로 분리 보관하며, 예치금에 대해서는 보증보험, 보험 또는 공제 가입, 준비금 적립, 15년간의 거래기록 보관 등의 의무를 부과한다.','불공정거래행위 규제 부문은 미공개 중요정보 이용, 시세조종, 사기적 부정거래, 자기발행 가상자산 거래의 금지 및 제한에 초점을 맞추었다.','이 법은 가상자산사업자의 자금세탁방지의무(CDD, STR 등)를 처음으로 규정한 법률로서, 이전까지 가상자산사업자에게는 어떠한 자금세탁방지의무도 부과되지 않았다.','사업자의 의무로는 임의적 입출금 차단금지, 이상거래 상시 감시, 금융당국 및 수사기관 보고 등의 내용이 명시되어 있다.'],2,
  '가상자산사업자에 대한 자금세탁방지의무(CDD, STR 등)는 2019년경부터 특정금융정보법 개정을 통해 이미 부과되어 왔어요. 가상자산이용자보호법은 시장 이용자 보호(예치금 분리보관, 불공정거래행위 규제 등)에 초점을 맞춘 법률로, "자금세탁방지의무를 처음으로 규정"했다는 서술은 옳지 않아요.','ultra'),
M('jd2_10',
  '2024년 6월 개정된 특정 금융거래정보 보고 및 감독규정의 주요 개정 내용에 해당하지 않는 것은?',
  ['특정금융정보법, 가상자산이용자보호법 등 가상자산 관련 법령준수체계 및 대주주 현황을 신고 사항으로 추가하였다.','가상자산사업자 변경신고 시 신고 사항별 특성을 감안하여 변경신고서 제출기한을 달리하여 규정하였다.','가상자산사업자 신고 심사의 중단 및 재개 절차를 폐지하고, 모든 신고를 접수 즉시 일괄 수리하도록 개정하였다.','금융회사등이 가상자산사업자에 대한 실명확인 입출금계정 발급 시 실시하는 위험평가의 절차, 방법 등을 업무 지침에 포함하도록 규정하였다.'],2,
  '2024년 6월 개정에서는 오히려 가상자산사업자 신고 심사의 "중단 및 재개" 절차를 "도입"하였어요. "절차를 폐지하고 접수 즉시 일괄 수리"한다는 서술은 원문과 반대예요.','ultra'),
M('jd2_10',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. VASP 간 거래에서 VASP 조사(Due Diligence)는 거래상대방이 VASP인지 판단, VASP의 확인, VASP가 믿을만한 거래상대방인지 평가의 3단계로 이루어진다.\nㄴ. MiCA는 2018년 EU 집행위원회의 디지털 금융 패키지 발표로 시작되어 2023년 6월 29일에 발효되었다.\nㄷ. MiCA의 자산준거 토큰·이머니 토큰 관련 규정은 발효일부터 6개월 후, 여타 암호자산 관련 규정은 12개월 후에 시행된다.\nㄹ. 가상자산이용자보호법은 2023년 6월 30일 국회 본회의를 통과하여 2024년 7월부터 시행되었다.\nㅁ. 2024년 6월 개정된 특정 금융거래정보 보고 및 감독규정은 가상자산사업자 신고 제도 자체를 전면 폐지하였다.',
  ['3개.','4개.','5개.','2개.'],3,
  'ㄱ, ㄹ은 옳은 설명이에요. 2024년 6월 개정은 가상자산사업자 신고 제도를 폐지한 것이 아니라 신고 심사의 중단·재개 절차를 도입한 것이고(ㅁ), MiCA는 2018년이 아니라 2020년 9월에 시작되었으며(ㄴ), 관련 규정 시행은 6개월/12개월이 아니라 12개월/18개월 후예요(ㄷ).','ultra'),
M('jd2_10',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 국내 VASP인 A거래소는 해외 VASP인 B거래소로부터 가상자산 이전 요청을 받았다. A거래소는 B거래소가 실제로 가상자산사업자로서 정상 운영되고 있는지 확인하는 절차 없이, 단순히 B거래소가 제공한 지갑 주소만을 근거로 거래를 진행하였다.',
  ['이는 VASP 조사(Due Diligence)의 모범적 수행 방법에 부합하지 않는 사례로, A거래소는 거래상대방이 VASP인지 판단하고 VASP를 확인(identification)하는 절차를 거쳐야 한다.','VASP 조사(Due Diligence)는 국내 VASP 간 거래에만 적용되며, 해외 VASP와의 거래에는 적용되지 않는다.','지갑 주소만으로 거래상대방이 신뢰할 수 있는 VASP인지 기술적으로 완벽하게 판단할 수 있으므로 이 사례는 문제가 없다.','이 사례는 자금이동규칙(Travel Rule)과 무관한 사안이다.'],0,
  'FATF는 지갑주소만으로 수취인 지갑을 관리하는 VASP를 기술적으로 완벽하게 식별할 수 있는 검증된 방법을 알지 못한다고 명시하고 있어요. 따라서 A거래소는 거래상대방이 VASP인지 판단하고, VASP를 확인(identification)하며, 믿을만한 거래상대방인지 평가하는 절차를 거쳐야 하며, 이는 국내외 VASP 간 거래 모두에 적용돼요.','ultra'),
M('jd2_6',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 직원 甲은 고객 A의 거래가 자금세탁 의심거래에 해당한다고 판단하여 FIU에 보고하였다. FIU는 이를 분석한 후 검찰에 관련 정보를 제공하였고, 검찰은 수사를 거쳐 A를 기소하였다. 재판 결과 A는 자금세탁 혐의로 유죄를 선고받았고, 법원은 범죄수익에 대한 몰수·추징을 명하였다.',
  ['甲의 STR 보고(보고제도)와 이후 기소·유죄판결·몰수(처벌제도)가 유기적으로 연결된, 국내 AML/CFT 체계의 전형적 작동 사례에 해당한다.','이 사례는 국내 AML/CFT 법률체계 중 ML/TF "처벌제도"에만 해당하며, "보고제도"와는 무관하다.','FIU는 검찰에 정보를 제공할 법적 근거가 없으므로 이 사례는 위법하다.','몰수·추징은 특정금융정보법에 근거하여 이루어진 것이다.'],0,
  '이 사례는 금융회사등의 STR 보고(ML/TF 보고제도, 특정금융정보법 근거) → FIU 분석 및 법집행기관 제공 → 검찰 기소 → 법원의 유죄판결 및 몰수·추징(ML/TF 처벌제도, 범죄수익은닉규제법 근거)으로 이어지는, 국내 AML/CFT 법률체계의 보고제도와 처벌제도가 유기적으로 연결되어 작동한 사례예요.','ultra'),
M('jd2_6',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 국내 거주 외국인 B는 국내 은행 계좌를 이용하여 해외 테러단체에 자금을 송금하려 하였고, 이 사실을 인지한 은행 직원은 관련 절차에 따라 조치를 취하였다.',
  ['국내 거주 외국인이므로 국내 AML/CFT 법률체계가 전혀 적용되지 않는다.','이 사안은 테러자금조달금지제도(CFT)의 영역으로, 테러자금조달행위의 처벌, 테러 관련 의심거래에 대한 FIU 보고, 테러 관련자 자산동결 등의 제도가 적용될 수 있다.','이 사안은 오직 출입국관리법의 문제일 뿐 금융 관련 법률과는 무관하다.','이 사안은 자금세탁방지제도(AML)의 영역일 뿐, 테러자금조달금지제도(CFT)와는 무관하다.'],1,
  '해외 테러단체에 대한 자금송금 시도는 테러자금조달금지제도(CFT)의 전형적인 적용 대상으로, 테러자금조달행위의 처벌, 테러 관련 의심거래에 대한 FIU 보고, 테러 관련자 자산동결과 금융거래 허가제도 운영 등이 관련될 수 있어요. 국내 거주 외국인이라도 국내에서 이루어지는 금융거래인 이상 국내 AML/CFT 법률체계가 적용돼요.','ultra'),
M('jd2_6',
  '<보기> 중 국내 AML/CFT 법률체계에 대한 설명으로 옳은 것을 모두 고른 것은?\nㄱ. ML/TF 보고제도의 근거 법률은 금융실명법과 특정금융정보법이다.\nㄴ. ML/TF 처벌제도의 근거 법률은 범죄수익은닉규제법, 공중협박자금조달금지법, 마약거래방지법이다.\nㄷ. 금융회사등은 수사권을 직접 행사하여 범죄자를 기소할 수 있다.\nㄹ. FIU는 금융회사등으로부터 보고받은 정보를 분석하여 법집행기관에 제공하는 역할을 한다.',
  ['ㄱ, ㄴ, ㄹ.','ㄱ, ㄷ.','ㄱ, ㄴ, ㄷ, ㄹ.','ㄴ, ㄷ, ㄹ.'],0,
  'ㄱ, ㄴ, ㄹ이 옳아요. ㄷ은 틀려요 — 금융회사등은 직접 수사권을 행사하거나 기소할 권한이 없으며, 이는 검찰 등 법집행기관의 역할이에요. 금융회사등의 역할은 STR·CTR 등 보고에 한정돼요.','ultra'),
M('jd2_6',
  '<보기>의 사례에서 금융위원회가 취한 조치로 가장 적절한 것은?\n[사례] UN 안전보장이사회가 새로운 테러단체 관련 개인·단체를 제재대상으로 지정하자, 금융위원회는 이들을 국내 금융거래제한대상자로 지정 및 고시하는 절차를 진행하였다.',
  ['금융위원회는 UN 안전보장이사회의 결정과 무관하게 독자적으로만 이러한 지정을 할 수 있다.','이는 자금세탁방지제도(AML)의 전제범죄 지정 절차에 해당한다.','이는 테러자금조달금지제도(CFT) 중 테러 관련자 자산동결 제도의 실무적 이행에 해당한다.','이러한 지정·고시 절차는 금융실명법에 근거한 것이다.'],2,
  'UN 안전보장이사회 결의에 따라 지정된 테러 관련 개인·단체를 국내 금융거래제한대상자로 지정·고시하는 것은 테러자금조달금지제도(CFT)의 핵심 내용인 "테러 관련자 자산동결" 제도의 실무적 이행에 해당해요.','ultra'),
M('jd2_6',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 C는 고객 D와의 금융거래가 금융거래제한대상자와 관련이 있지만, 테러자금조달과는 명백히 무관한 거래임을 확인하였다. C는 이 거래를 진행하기 위해 금융위원회의 허가를 받았다.',
  ['이는 테러자금조달금지제도(CFT)상 "금융거래 허가제도"가 실무적으로 적용된 사례로, 금융거래제한대상자와의 거래라도 테러자금조달과 무관하면 허가를 받아 진행할 수 있다.','금융위원회의 허가 없이도 이러한 거래는 자유롭게 진행할 수 있다.','금융거래제한대상자와 관련된 거래는 어떠한 경우에도 예외 없이 절대적으로 금지되므로 이 사례는 위법하다.','이 사례는 금융실명법상 실명확인 절차에 관한 사안일 뿐이다.'],0,
  '테러자금조달금지제도(CFT)의 금융거래 허가제도는 금융거래제한대상자와의 거래라 하더라도 테러자금조달과 무관함이 확인되면 금융위원회의 허가를 받아 거래를 진행할 수 있도록 하는 제도예요. "어떠한 경우에도 예외 없이 절대적으로 금지"라는 서술은 이 제도의 취지와 반대예요.','ultra'),
M('jd1_3',
  'FATF 40 권고사항의 7개 대분류(I~VII)에 해당하지 않는 것은?',
  ['II. 자금세탁과 몰수.','I. 자금세탁방지(AML)/테러자금조달금지(CFT) 정책과 조정.','V. 법인과 법률관계의 투명성과 실제소유자.','VIII. 특정비금융사업자에 대한 세제 혜택 부여.'],3,
  'FATF 40 권고사항은 I.AML/CFT 정책과 조정 II.자금세탁과 몰수 III.테러자금조달과 확산금융 IV.예방조치 V.법인과 법률관계의 투명성과 실제소유자 VI.FIU 설립 등 관계기관의 권한·책임 VII.국제협력의 7개 대분류로 구성돼요. "특정비금융사업자에 대한 세제 혜택 부여"라는 대분류는 존재하지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 1(위험평가와 위험기반접근법의 적용)에 대한 설명으로 옳지 않은 것은?',
  ['각국은 자국의 자금세탁 및 테러자금조달 위험을 확인·평가 및 이해하여야 하며, 위험을 효과적으로 경감시킬 수 있도록 위험평가를 총괄(coordinate)할 당국 혹은 메커니즘 지정 등의 조치를 취하고 재원을 사용하여야 한다.','보다 높은 위험이 확인된 경우, 각국은 자국의 AML/CFT 체제가 그런 위험에 적절하게 대응할 수 있도록 하여야 한다.','보다 낮은 위험이 확인된 경우라도, 각국은 어떠한 예외나 완화 없이 모든 FATF 권고사항을 동일한 강도로 이행하여야 한다.','각국은 금융회사와 특정 전문직·비금융 사업자(DNFBP)가 자신의 자금세탁 및 테러자금조달 위험을 확인·평가하고 이를 경감시킬 수 있는 조치를 취하도록 의무화하여야 한다.'],2,
  '보다 낮은 위험이 확인된 경우, 각국은 "특정 조건하에서 일부 FATF 권고사항을 간소화된 조치로 이행하기로 결정할 수 있다"고 명시되어 있어요. "어떠한 예외나 완화 없이 동일한 강도로 이행"이라는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 2(국가적 협력과 조정)에 대한 설명으로 옳은 것은?',
  ['정책당국, FIU, 법집행당국, 감시감독관 등 관련 권한 당국 간의 협력은 권고사항 2의 범위에 포함되지 않는다.','각국은 확인된 위험을 참고로 반영한 국가적 AML/CFT 정책을 가져야 하며 이를 정기적으로 검토하여야 한다.','권고사항 2는 오직 국내 정책에만 국한되며 자금세탁·테러자금조달·확산금융방지에 관한 정책 개발과는 무관하다.','국가적 AML/CFT 정책은 한 번 수립되면 향후 재검토나 개정 없이 영구적으로 유지되어야 한다.'],1,
  '권고사항 2는 각국이 확인된 위험을 참고로 반영한 국가적 AML/CFT 정책을 가지고 이를 "정기적으로 검토"하도록 요구하며, 정책당국·FIU·법집행당국·감시감독관 등이 협력할 수 있는 효과적인 메커니즘을 갖추어 자금세탁·테러자금조달·확산금융방지에 관한 정책 개발과 이행방안을 마련하도록 요구해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 4(몰수와 잠정조치)에서 각국이 동결·압수 및 몰수할 수 있도록 하여야 하는 대상에 해당하지 않는 것은?',
  ['세탁된 재산(property).','자금세탁 혹은 전제범죄의 범죄수익, 또는 해당 범죄에 사용되었거나 사용될 의도인 수단.','테러리즘, 테러행위 혹은 테러조직의 범죄수익 또는 이들의 자금조달에 사용되었거나 사용을 위해 할당되거나 또는 사용될 의도인 재산.','선의의 제3자가 정당하게 취득하여 보유하고 있는, 범죄와 무관한 고유 재산.'],3,
  '권고사항 4가 규정하는 동결·압수·몰수 대상은 세탁된 재산, 자금세탁·전제범죄의 범죄수익 또는 관련 수단, 테러리즘·테러행위·테러조직의 범죄수익 또는 자금조달 관련 재산, 이에 상응하는 가치가 있는 재산이에요. 이러한 조치는 "선의의 제3자의 권리를 침해하지 않으면서" 이루어져야 하므로, 범죄와 무관한 선의의 제3자의 고유 재산은 몰수 대상이 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 4에 따라 권한당국이 가져야 하는 권한에 해당하지 않는 것은?',
  ['몰수대상 재산을 사전 재판 절차 없이 권한당국이 임의로 매각하여 국고에 즉시 귀속시킬 권한.','몰수대상 재산을 확인·추적·평가할 권한.','해당 재산의 거래, 이전 또는 처분을 막기 위하여 동결 및 압수 등의 잠정조치를 취할 권한.','몰수대상 재산을 국가가 동결, 압수 혹은 회복할 권리를 방해하는 행위를 저지 또는 무효화시키기 위한 대책을 취할 권한 또는 적절한 수사권.'],0,
  '권고사항 4가 규정하는 권한당국의 권한은 몰수대상 재산의 확인·추적·평가, 동결·압수 등 잠정조치, 방해행위 저지·무효화 대책 및 적절한 수사권이에요. "사전 재판 절차 없이 임의로 매각하여 즉시 국고 귀속"시키는 권한은 이 권고사항이 규정하는 내용이 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 4의 "기소전몰수제도(non-conviction based confiscation)"에 대한 설명으로 가장 옳은 것은?',
  ['기소전몰수제도는 모든 국가에서 예외 없이 강행적으로 반드시 도입해야 하는 절대적인 의무 규정으로, 각국의 재량이 인정되지 않는 것으로 이해해야 한다','각국은 자국법이 허용하는 범위에서 범죄수익, 범죄수단 등을 유죄판결 없이 몰수할 수 있도록 하는 조치 또는 범죄자에게 몰수대상 재산의 정당한 원천을 밝히도록 요구하는 조치의 적용을 고려하여야 한다.','기소전몰수제도는 그 명칭과 달리 실제로는 유죄판결이 확정된 이후에만 비로소 적용될 수 있는 사후적 제도에 불과한 것으로 이해해야 한다','기소전몰수제도는 테러자금조달과 관련된 재산에만 한정되어 적용될 뿐, 일반적인 자금세탁 범죄수익에는 적용될 수 없는 것으로 이해해야 한다'],1,
  '각국은 자국법이 허용하는 범위에서 범죄수익·범죄수단 등을 유죄판결 없이 몰수할 수 있도록 하는 조치, 또는 범죄자에게 몰수대상 재산의 정당한 원천을 밝히도록 요구하는 조치를 채택할 수 있어요. 이는 강행 의무가 아니라 각국이 채택할 수 있는 조치이며, 자금세탁 범죄수익에도 적용돼요.','ultra'),
M('jd1_3',
  'FATF 권고사항 5(테러자금조달범죄)에 대한 설명으로 옳지 않은 것은?',
  ['각국은 이러한 범죄행위가 자금세탁 전제범죄로 지정되도록 하여야 한다.','각국은 테러자금조달금지 협약에 의거하여 테러자금조달을 범죄화하여야 한다.','테러자금조달죄는 특정 테러행위의 실행이 실제로 완료되어야만 성립하는 결과범(結果犯)으로 규정되어야 한다.','테러행위에 대한 자금조달뿐만 아니라 특정 테러행위(들)와의 연관성 여부와 상관없이 테러조직과 개별 테러리스트에 대한 자금조달도 범죄화하여야 한다.'],2,
  '권고사항 5는 특정 테러행위(들)와의 연관성 여부와 "상관없이" 테러조직과 개별 테러리스트에 대한 자금조달도 범죄화하도록 요구해요. 즉 실제 테러행위의 실행 여부와 무관하게 성립할 수 있어야 하며, "결과범으로 규정되어야 한다"는 서술은 이 권고사항의 취지와 반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 6(테러와 테러자금조달 관련 정밀금융제재)과 권고사항 7(확산금융 관련 정밀금융제재)의 차이에 대한 설명으로 옳은 것은?',
  ['권고사항 6과 권고사항 7은 서로 완전히 동일한 내용을 형식만 바꾸어 반복적으로 규정한 것에 불과하여, 두 권고사항 사이에는 실질적으로 아무런 차이가 존재하지 않는 것으로 이해해야 한다','권고사항 6은 테러자금조달 방지 및 억제에 관한 유엔안보리결의안(유엔안보리결의 1267호 등)을 이행하기 위한 정밀금융제재를 다루고, 권고사항 7은 대량살상무기확산과 이에 대한 자금조달을 방지·억제·금지하는 유엔안보리결의안을 이행하기 위한 정밀금융제재를 다룬다.','권고사항 6은 확산금융에 관한 정밀금융제재를 규율하고, 반대로 권고사항 7은 테러자금조달에 관한 정밀금융제재를 규율하는 것으로 두 권고사항의 대상이 서로 뒤바뀌어 있는 것으로 이해해야 한다','권고사항 6과 7이 다루는 정밀금융제재는 모두 유엔안전보장이사회의 결의와는 무관하게, 각국이 독자적인 판단에 따라 지정한 대상에게만 적용되는 것으로 이해해야 한다'],1,
  '권고사항 6은 테러·테러자금조달 관련 유엔안보리결의(예: 1267호(1999) 및 후속 결의)를 이행하기 위한 정밀금융제재를, 권고사항 7은 대량살상무기확산과 그 자금조달을 방지·억제·금지하는 유엔안보리결의안을 이행하기 위한 정밀금융제재를 다뤄요. 두 권고사항 모두 유엔헌장 제7장에 의거한 유엔안보리 결의를 근거로 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 8(비영리조직, NPO)에 대한 설명으로 옳지 않은 것은?',
  ['각국은 FATF의 비영리단체(NPO) 정의에 해당하는 조직을 식별하고 이들의 테러자금 조달위험을 평가해야 한다.','권고사항 8의 취지는 모든 비영리단체(NPO)의 활동을 원칙적으로 전면 금지하고 예외적으로만 허용하는 것이다.','각국은 위험기반접근방식(RBA)에 맞춰 합법적인 NPO 활동을 과도하게 방해하거나 억제하지 않으면서 집중적이고 위험에 비례하는 위험기반 조치를 취해야 한다.','이러한 조치의 목적은 테러조직이 합법적인 단체로 위장하거나, 자산동결 조치를 회피하는 목적 등으로 합법적인 단체를 테러자금조달의 수단으로 이용하거나, 합법적 목적의 자금을 테러 조직으로 전용하는 것을 감추거나 은폐하는 것으로부터 NPO를 보호하기 위함이다.'],1,
  '권고사항 8의 취지는 합법적인 NPO 활동을 과도하게 방해하거나 억제하지 않으면서, 테러자금조달의 남용으로부터 NPO를 보호하기 위한 위험기반 조치를 취하는 것이에요. "모든 NPO 활동을 원칙적으로 전면 금지"한다는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  '<보기>는 FATF 권고사항 8이 NPO를 보호하고자 하는 3가지 남용 유형이다. 옳지 않은 것은?',
  ['자산동결 조치를 회피하는 목적 등을 포함하여, 합법적인 단체를 테러자금조달의 수단으로 이용하는 경우.','합법적 목적의 자금을 테러 조직으로 전용하는 것을 감추거나 은폐(obscure)하는 경우.','NPO가 정관에 명시된 사업 목적 범위를 초과하여 수익사업을 영위하는 경우.','테러조직을 합법적 단체로 가장하는 경우.'],2,
  '권고사항 8이 제시하는 3가지 남용 유형은 (a)테러조직의 합법단체 위장 (b)자산동결 회피 목적 등을 포함한 합법단체의 테러자금조달 수단화 (c)합법목적 자금의 테러조직 전용 은폐예요. "정관상 사업목적 범위를 초과한 수익사업 영위"는 이 권고사항이 다루는 테러자금조달 관련 남용 유형이 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 9(금융회사의 비밀유지 법률)에 대한 설명으로 가장 옳은 것은?',
  ['금융비밀 유지 법률은 FATF 권고사항의 적용대상에서 완전히 배제된 별개의 영역이다.','권고사항 9는 금융회사의 비밀유지 의무를 전면 폐지할 것을 요구한다.','금융비밀 유지에 관한 법률은 FATF 권고사항보다 항상 우선하여 적용되어야 한다.','각국은 금융비밀 유지에 관한 법률(financial institution secrecy laws)이 FATF 권고사항 이행에 방해되지 않도록 하여야 한다.'],3,
  '권고사항 9는 각국의 금융비밀 유지에 관한 법률이 FATF 권고사항의 이행에 "방해되지 않도록" 해야 한다고 규정할 뿐, 금융비밀 유지 의무 자체를 전면 폐지하라거나 FATF 권고사항보다 항상 우선해야 한다고 요구하지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 10(고객확인의무, CDD)에서 금융회사가 고객확인을 이행할 의무가 발생하는 경우에 해당하지 않는 것은?',
  ['거래관계(business relation)를 수립하는 경우.','고객이 3년 이상 동일 계좌를 정상적으로 이용해 온 경우.','기준금액(USD/EUR 15,000)을 초과하는 일회성 거래행위를 행하는 경우.','자금세탁 또는 테러자금조달이 의심되는 경우, 또는 기존에 확보된 고객확인 정보의 진위나 타당성이 의심되는 경우.'],1,
  '고객확인의무가 발생하는 경우는 (i)거래관계 수립 (ii)기준금액(USD/EUR 15,000) 초과 일회성 거래 또는 권고사항 16 주석서에 의해 규제되는 전자자금이체 (iii)자금세탁·테러자금조달 의심 (iv)기존 고객확인 정보의 진위·타당성 의심이에요. "3년 이상 동일 계좌를 정상적으로 이용해 온 경우"는 그 자체만으로 고객확인 의무가 발생하는 사유가 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 10에서 규정하는 고객확인 조치 (a)~(d)에 대한 설명으로 옳지 않은 것은?',
  ['(a) 신뢰성 있고 독립적인 문서, 데이터 또는 정보를 이용하여 고객의 신원을 확인하고 검증할 것.','(d) 거래관계 수립 시 단 1회에 한하여 고객확인을 실시하면 충분하며, 이후 거래관계 존속 기간 동안에는 어떠한 지속적 확인 절차도 요구되지 않음.','(b) 실제소유자의 신원을 확인하고, 실제소유자의 신원을 검증하기 위한 합리적인 조치를 취하여 금융회사가 그 계좌의 실제소유자가 누구인지 파악할 수 있어야 하며, 법인 및 법률관계의 경우 금융회사는 법인 등의 소유권과 지배구조를 파악하여야 함.','(c) 거래관계의 목적 및 성격에 대한 정보를 이해하고, 필요시 확보할 것.'],1,
  '(d) 조치는 "거래관계에 대한 지속적인 고객확인 절차 이행(ongoing due diligence)" 및 거래관계 수립 이후 실시된 거래에 대한 면밀한 조사를 수행하여, 고객의 사업 및 리스크 프로필, 자금출처에 대해 금융회사가 파악하고 있는 바가 실제 거래내용과 일치하도록 하는 것이에요. "단 1회에 한하여 실시하면 충분"하다는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 10에 따른 고객확인의 시기에 대한 설명으로 옳은 것은?',
  ['고객확인은 항상 거래관계가 종료된 이후에만 이행하면 충분하다.','자금세탁 및 테러자금조달 위험이 효과적으로 관리되고 있더라도, 정상적인 거래를 위하여 불가피한 경우라도 예외 없이 반드시 사전에 검증절차를 완료하여야 한다.','고객확인의 시기는 전적으로 금융회사의 재량에 맡겨져 있으며 아무런 기준이 없다.','금융회사는 고객 및 실제소유자의 신원검증을 원칙적으로 거래관계 수립 이전 또는 거래관계를 유지하는 동안 또는 일회성 거래행위의 수행 이전에 이행할 의무가 있다.'],3,
  '금융회사는 원칙적으로 거래관계 수립 이전, 또는 거래관계를 유지하는 동안, 또는 일회성 거래행위 수행 이전에 고객 및 실제소유자의 신원검증을 이행할 의무가 있어요. 다만 ML/TF 위험이 효과적으로 관리되고 있고 정상적인 거래를 위해 불가피한 경우에는, 각국은 금융회사가 거래관계 수립 후 합리적으로 수행 가능한 최단 시간 내에 검증절차를 수행하도록 허용할 수 있어요.','ultra'),
M('jd1_3',
  'FATF 권고사항 10에서 금융회사가 (a)~(c) 조항에 해당하는 의무사항을 이행할 수 없는 경우에 대한 설명으로 옳지 않은 것은?',
  ['고객확인 조치를 이행할 수 없는 경우라도 금융회사는 기존에 수립된 거래관계를 그대로 유지하면서 추가적인 모니터링만 강화하면 충분한 것으로 이해해야 한다','금융회사는 계좌개설, 거래관계 수립 또는 거래이행을 중단하여야 한다.','이미 수립된 거래관계는 종결하여야 한다.','해당 고객에 대한 의심거래보고(suspicious transactions report) 여부를 고려하여야 한다.'],0,
  '권고 10에 따르면 고객확인 조치를 이행할 수 없는 경우 금융회사는 계좌개설·거래관계 수립·거래이행을 중단하거나 이미 수립된 거래관계를 종결해야 해요. "기존 거래관계를 그대로 유지하면서 모니터링만 강화하면 충분하다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 12(정치적 주요인물, PEPs)에서 금융회사가 취해야 하는 조치 (a)~(d)에 해당하지 않는 것은?',
  ['고객 또는 실제소유자의 고위공직자 여부를 확인할 수 있는 적절한 위험관리시스템(risk management systems) 운용.','이러한 거래관계를 수립하기 위한(기존 고객인 경우 이러한 거래관계를 지속하여도 된다는) 고위 관리자의 승인 취득.','고위공직자로 확인된 고객에 대해서는 재산·자금 출처를 확인하는 절차 없이, 고위 관리자의 승인만 받으면 곧바로 거래관계를 수립할 수 있는 것으로 이해해야 한다','재산 및 자금의 출처를 확인할 수 있는 합리적인 조치, 거래관계에 대한 강화된 모니터링을 지속적으로 수행.'],2,
  '권고 12는 PEP 고객에 대해 고위 관리자 승인과 함께 재산·자금 출처 확인, 강화된 모니터링을 요구해요. "재산·자금 출처 확인 절차 없이 고위 관리자 승인만으로 거래관계를 수립할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 12의 적용 대상에 대한 설명으로 옳은 것은?',
  ['모든 종류의 고위공직자에게 적용되는 의무사항은 고위공직자의 가족과 가까운 지인에게도 적용되어야 한다.','PEP 관련 의무는 오직 외국의 고위공직자에게만 적용되며, 국내 고위공직자나 국제기구 요직자에게는 적용되지 않는다.','PEP의 가족이나 가까운 지인에 대해서는 어떠한 강화된 조치도 요구되지 않는다.','PEP 관련 의무는 국제기구의 요직에 재임 중이거나 재임했던 개인에게는 적용되지 않는다.'],0,
  '모든 종류의 고위공직자에게 적용되는 의무사항은 고위공직자의 가족과 가까운 지인에게도 적용되어야 해요. 또한 금융회사는 고객 또는 실제소유자가 국내 고위공직자이거나 국제기구의 요직에 재임 중이거나 재임했던 개인인지 확인하기 위한 합리적인 조치를 취할 의무가 있어요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF 권고사항 4는 세탁된 재산, 자금세탁·전제범죄의 범죄수익, 테러 관련 재산, 상응하는 가치의 재산을 동결·압수·몰수 대상으로 규정한다.\nㄴ. FATF 권고사항 6은 확산금융 관련 정밀금융제재를, 권고사항 7은 테러 관련 유엔안보리결의 이행을 위한 정밀금융제재를 규정한다.\nㄷ. FATF 권고사항 10에 따른 고객확인 의무 발생 사유는 거래관계 수립, 일회성거래(USD/EUR 10,000 초과), 자금세탁·테러자금조달 의심, 기존 정보의 진위 의심 4가지이다.\nㄹ. FATF 권고사항 12는 PEP에 대해 위험관리시스템, 고위 관리자 승인, 자금출처 확인, 강화된 모니터링의 4가지 조치를 요구한다.',
  ['3개.','2개.','1개.','4개.'],1,
  'ㄱ, ㄹ은 옳은 설명이에요. 권고사항 6은 테러 관련, 권고사항 7은 확산금융 관련 정밀금융제재를 규정하는데 ㄴ은 이 둘이 서로 뒤바뀌어 있어 옳지 않고, 권고사항 10의 일회성거래 기준금액은 10,000이 아니라 15,000이에요(ㄷ).','ultra'),
M('jd1_3',
  'FATF 권고사항 14(자금 또는 가치의 이전서비스, MVTS)에 대한 설명으로 옳지 않은 것은?',
  ['MVTS 제공업자는 인가나 등록 없이도 자유롭게 영업할 수 있으며, 각국은 이를 감시할 의무가 없다.','MVTS는 자금 또는 가치의 이전 서비스를 의미하며, 이를 제공하는 개인 또는 법인(natural or legal persons) 모두가 규제 대상이다.','각국은 인가를 받지 않은 또는 미등록인 개인이나 법인이 MVTS를 제공하는 것을 확인할 수 있어야 하고, 그러한 경우 적절한 제재를 가하여야 한다.','각국은 자금 또는 가치의 이전 서비스(MVTS)를 제공하는 개인이나 법인이 인가 또는 등록이 되어 있고 FATF 권고사항에 촉구되어 있는 관련 조치를 이행하는지 감독하기 위한 효과적인 감시체계의 대상이 되도록 하여야 한다.'],0,
  '권고사항 14는 각국이 인가를 받지 않았거나 미등록인 개인·법인이 MVTS를 제공하는 것을 확인할 수 있어야 하고, 그러한 경우 적절한 제재를 가하도록 요구해요. "인가나 등록 없이도 자유롭게 영업 가능하며 감시 의무가 없다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 15의 가상자산사업자에 대한 자금세탁방지의무(3번 세부사항)에 대한 설명으로 옳지 않은 것은?',
  ['가상자산사업자에게 금융회사에 준하는 자금세탁방지의무를 부과하며, CDD·STR 등 기존 금융회사와 동일하게 가상자산 송금도 송금·수취 기관 모두 송금인, 수취인 관련 정보를 수집·보유하고 필요시 당국에 정보를 제공해야 한다.','고객이 1,000 USD/EUR 이상 거래를 한 경우에는 고객확인의무에 따라서 세부정보를 수집해야 한다.','자금송금 시 취급업체가 확인·보관해야 하는 고객정보에는 송금인의 성명, 송금인이 거래처리를 위해 접속한 계정의 정보, 송금인의 주소 또는 국가등록 신분번호 또는 신원식별이 가능한 처리업체 등록번호 또는 생년월일, 수취인의 성명, 수취인이 거래 처리를 위해 접속한 계정의 정보가 포함된다.','가상자산서비스 제공업자는 정확한 송금인·수취인 요구정보의 획득·보관 및 수취기관 제공 여부와 무관하게, 거래 즉시 처리를 최우선으로 하여야 한다.'],3,
  '가상자산서비스 제공업자는 정확한 송금인 요구정보와 수취인 요구정보를 획득·보관하고 이를 수취기관에 제공하는지 여부, 수취기관이 송금인 요구정보(일부)와 정확한 수취인 요구정보를 획득·보관하는지를 "확인해야 한다"고 규정되어 있어요. "거래 즉시 처리를 최우선으로 한다"는 서술은 이 의무의 취지와 맞지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 17(제3자 의존)에서 제3자에게 고객확인 업무를 위탁하기 위해 충족되어야 할 기준 (a)~(d)에 대한 설명으로 옳지 않은 것은?',
  ['제3자에게 고객확인 업무를 위탁한 경우, 고객확인 조치에 대한 최종책임은 위탁받은 제3자에게 있으며 위탁한 금융회사는 어떠한 책임도 지지 않는다.','(c) 금융회사는 제3자가 감독당국의 규제, 감독, 또는 모니터링의 대상인지 확인을 받으며, 권고사항 10과 11에 따른 고객확인과 기록보존 요건을 충족하는 조치를 이행하고 있는지를 확인하여야 한다.','(b) 금융회사는 제3자에게 고객확인 정보와 기타 고객확인 수행과 관련된 문서 요구 시, 이를 지체 없이 제공받을 수 있도록 적절히 절차를 갖추어야 한다.','(a) 제3자에게 고객확인을 위탁한 금융회사는 권고사항 10에 명시되어 있는 고객확인조치 중 (a)~(c)의 조항에 명시되어 있는 필수정보를 즉시 획득하여야 한다.'],0,
  '제3자 위탁이 허용된 경우라도 고객확인 조치에 대한 "최종책임은 제3자에게 업무를 위탁한 금융회사"에 있어요. "위탁받은 제3자에게 있으며 위탁한 금융회사는 어떠한 책임도 지지 않는다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 17에서 금융그룹 계열사 간 고객확인 위탁에 대한 특례에 대한 설명으로 가장 옳은 것은?',
  ['금융그룹 계열사 간에는 같은 그룹에 속한다는 사실 자체만으로, 개별 요건 충족 여부나 국가별 위험도·감독 수준과 전혀 무관하게 고객확인 업무 위탁이 항상 자동으로 인정되며 어떠한 사후 점검도 요구되지 않는 것으로 이해되어야 하며, 이는 금융그룹 내부 결속을 강화하는 취지로도 해석된다','금융그룹 계열사 간 위탁의 경우에도 기준 (a)부터 (d)까지를 예외 없이 개별적으로 모두 충족해야 하며, 그룹 차원의 통합적인 AML/CFT 프로그램 운영이나 그룹 차원의 감독 수준은 위탁 요건 판단에 전혀 고려되지 않는 별개의 사안으로 다루어지는 것으로 이해되며, 개별 심사가 항상 우선된다','금융회사와 고객확인을 위탁받는 제3자가 같은 금융그룹의 계열사이고, 해당 그룹이 권고사항 10·11·12에 따른 고객확인·기록보존의무 및 권고사항 18에 따른 AML/CFT 프로그램을 그룹 차원에서 이행·감독받는 경우, 위탁 요건이 충족된 것으로 볼 수 있다','금융그룹 계열사 간 위탁 특례는 오직 국내 계열사 간의 관계에서만 인정될 뿐이며, 해외지점이나 해외 자회사가 포함된 금융그룹의 경우에는 그룹 차원의 AML/CFT 프로그램 수준이 아무리 우수하더라도 특례가 적용될 수 없는 것으로 이해해야 하며, 이는 국경 간 감독 협력 부족을 이유로 한다'],2,
  '금융그룹 계열사 간 위탁은, 해당 그룹이 권고사항 10·11·12에 따른 고객확인·기록보존의무 및 권고사항 18에 따른 AML/CFT 프로그램을 그룹 차원에서 이행·감독받는 경우 요건이 충족될 수 있어요. 무조건 자동 인정, 개별 요건 전부 충족 필요, 국내 계열사 한정이라는 서술은 모두 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 18(내부통제와 해외지점 및 자회사)에 대한 설명으로 옳지 않은 것은?',
  ['금융회사는 자금세탁 및 테러자금조달을 방지할 수 있는 프로그램을 이행할 의무가 있다.','금융그룹은 그룹 차원의 자금세탁 및 테러자금조달 방지를 위한 프로그램을 이행할 의무가 있으며, 이 프로그램에는 AML/CFT 목적을 위한 그룹 내 정보 공유정책 및 절차가 포함되어야 한다.','해외지점 및 자회사는 본국의 AML/CFT 기준과 무관하게 오직 현지국 기준만을 독자적으로 적용하면 충분하다.','금융회사는 FATF 권고사항을 이행하기 위하여 본국에서 이행되고 있는 AML/CFT 조치와 일관된 조치를 금융그룹의 자금세탁 및 테러자금조달 방지 프로그램을 통해 해외지점과 지배지분 보유 자회사(majority-owned subsidiary)에 적용할 의무가 있다.'],2,
  '금융회사는 본국에서 이행되고 있는 AML/CFT 조치와 "일관된" 조치를 해외지점과 지배지분 보유 자회사에 적용할 의무가 있어요. "본국 기준과 무관하게 오직 현지국 기준만 독자적으로 적용하면 충분하다"는 서술은 원문과 반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 20(의심거래보고, STR)에 대한 설명으로 가장 옳은 것은?',
  ['의심거래보고 의무는 자금이 범죄수익이라는 사실이 법원의 확정판결을 통해 명확히 확인된 이후에 비로소 발생하는 사후적인 의무로 규정되어 있는 것으로 이해해야 한다','의심거래보고는 반드시 확실한 물적 증거가 사전에 충분히 확보된 경우에만 이루어져야 하며, 합당한 근거에 기반한 단순한 의심만으로는 보고 의무가 발생하지 않는 것으로 이해해야 한다','의심거래보고 의무는 오직 자금세탁과 관련된 사안에만 적용되는 규정으로, 테러자금조달과 관련된 의심거래에는 별도의 보고 의무가 적용되지 않는 것으로 이해해야 한다','금융회사는 (특정) 자금(funds)이 범죄수익이거나 테러자금조달과 연관이 있다고 의심되는 경우 또는 의심할 만한 합당한 근거(reasonable ground to suspect)가 있는 경우, 법률에 따라 그 의심내용을 FIU(Financial Intelligence Unit)에 보고할 의무가 있다.'],3,
  '권고사항 20은 자금이 범죄수익이거나 테러자금조달과 연관이 있다고 "의심되는 경우" 또는 "의심할 만한 합당한 근거"가 있는 경우 FIU에 보고할 의무를 규정해요. 확정판결이나 확실한 증거를 요구하지 않으며, 자금세탁뿐 아니라 테러자금조달 관련 의심거래도 포함돼요.','ultra'),
M('jd1_3',
  'FATF 권고사항 21(정보누설과 비밀유지)에 대한 설명으로 옳지 않은 것은?',
  ['금융회사와 금융회사의 이사, 임원(officers) 및 직원(employees)이 선의에 의하여(in good faith) FIU에 의심거래보고를 한 경우, 비록 그 전제 범죄가 무엇인지 정확히 알지 못하고 불법행위가 실제 일어나지 않았더라도, 계약서나 그 어떤 법률·규정 또는 행정적 조치에 의하여 부과된 정보누설 금지의무를 위배하더라도 형사 또는 민사상의 책임을 지지 않는다.','의심거래보고 또는 관련 정보가 FIU에 보고되었다는 사실을 공개(disclosing, 소위 tipping-off)하지 않도록 법으로 금지하여야 한다.','이 면책 규정은 전제범죄를 정확히 알지 못했거나 실제 불법행위가 발생하지 않았던 경우에도 적용된다(regardless of whether illegal activity actually occurred).','선의로 STR을 보고한 금융회사 임직원이라도, 추후 해당 의심이 사실이 아닌 것으로 밝혀지면 소급하여 형사·민사상 책임을 져야 한다.'],3,
  '권고사항 21은 선의로 STR을 보고한 경우, 전제범죄를 정확히 알지 못했거나 불법행위가 실제 일어나지 않았더라도 정보누설 금지의무 위반에 대해 형사·민사 책임을 지지 않는다는 면책(safe harbor)을 규정해요. "추후 의심이 사실이 아닌 것으로 밝혀지면 소급하여 책임을 져야 한다"는 서술은 이 면책 규정의 취지와 반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 22(d)에서 변호사, 공증인, 기타 독립적 법률전문직 및 회계사가 고객을 위하여 다음 활동과 관련된 거래를 준비하거나 수행하는 경우 고객확인 의무가 적용되는 활동에 해당하지 않는 것은?',
  ['법정에서 의뢰인을 대리하여 소송을 수행하는 통상적인 변론 활동.','부동산 매매.','은행, 예금, 적금 계좌 또는 증권거래 계좌의 관리, 회사 설립, 경영, 관리에 관여, 법인(신탁 등) 법률관계에 근거한 법인/단체의 설립·운영·관리 및 사업체의 매매.','고객의 자금, 증권 또는 기타 자산의 관리.'],0,
  '권고사항 22(d)가 규정하는 5가지 활동은 부동산 매매, 고객 자금·증권·기타 자산 관리, 은행·예금·적금·증권거래 계좌 관리, 회사 설립·경영·관리 관여, 법인·신탁 등 법률관계에 근거한 법인/단체 설립·운영·관리 및 사업체 매매예요. "법정에서의 통상적인 변론 활동"은 이 조항이 규정하는 고위험 활동에 해당하지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 24(법인의 투명성과 실제소유자)에 대한 설명으로 옳지 않은 것은?',
  ['법인이 신규 무기명 주식 또는 무기명 신주인수권을 발행하는 것을 허용해서는 안 되며, 기존 무기명 주식 및 무기명 신주인수권의 오용을 방지하기 위한 조치를 취해야 한다.','국가는 명의주주 보유자나 임원(nominee shareholders or director)이 자금세탁이나 테러자금조달에 악용되지 않도록 효과적인 조치를 취해야 한다.','각국은 자금세탁이나 테러자금조달 목적으로 법인이 악용되는 것을 방지하는 조치를 취하여야 하며, 법인의 실제소유자 및 지배구조에 대한 적정하고, 정확하며 시의적절한 정보를 권한당국이 신속히 입수하거나 접근할 수 있도록 하여야 한다.','법인의 무기명 주식 발행은 자금세탁 위험과 무관하므로 각국은 이에 대해 어떠한 규제도 취할 필요가 없다.'],3,
  '권고사항 24는 법인이 신규 무기명 주식이나 무기명 신주인수권을 발행하는 것을 "허용해서는 안 되며", 기존 무기명 주식·신주인수권의 오용을 방지하기 위한 조치를 취하도록 명시적으로 요구해요. "무기명 주식 발행은 위험과 무관하며 규제할 필요가 없다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 25(법률관계의 투명성과 실제소유자)에 대한 설명으로 옳은 것은?',
  ['신탁은 법인이 아니므로 권고사항 25의 적용 대상이 될 수 없다.','권고사항 25는 권고사항 10과 22의 의무사항을 수행하는 금융회사와 특정 전문직 및 비금융 사업자에게는 실제 소유자 및 지배구조에 대한 정보 접근을 고려할 필요가 없다고 명시한다.','각국은 자금세탁이나 테러자금조달 목적으로 신탁과 같은 법률관계가 악용되는 것을 방지하는 조치를 취해야 하며, 특히 각국은 설정자, 수탁자, 수익자 정보 등 신탁에 대한 적정하고 정확한 최신정보를 권한당국이 시의적절하게 입수하거나 접근할 수 있도록 하여야 한다.','신탁의 설정자, 수탁자, 수익자에 대한 정보는 권한당국이 입수하거나 접근할 필요가 없는 사적 영역에 해당한다.'],2,
  '권고사항 25는 신탁과 같은 법률관계가 자금세탁·테러자금조달 목적으로 악용되는 것을 방지하기 위해, 설정자·수탁자·수익자 정보 등 신탁에 대한 적정하고 정확한 최신정보를 권한당국이 시의적절하게 입수·접근할 수 있도록 요구해요. 또한 권고사항 10과 22의 의무를 수행하는 금융회사와 DNFBP도 이러한 정보에 접근 가능하도록 하는 조치 마련을 "고려하여야 한다"고 명시하고 있어요.','ultra'),
M('jd1_3',
  'FATF 권고사항 26(금융회사에 대한 규제와 감독)에 대한 설명으로 옳지 않은 것은?',
  ['범죄자나 그 관련자가 금융회사의 지배지분을 소유하는 것은 자금세탁 위험과 무관하므로 각국이 이를 별도로 규제할 필요는 없다.','각국은 금융회사를 적절히 규제하고 감독하여 FATF 권고사항을 효과적으로 이행하도록 하여야 한다.','권한당국은 범죄자나 그 관련자(associate)가 금융회사에 중대한 영향력을 미칠 수 있는 지분(significant interest) 또는 지배지분을 소유하거나 이에 대한 실제소유자가 되는 것 또는 금융회사의 경영권을 가지는 것을 방지하기 위하여 필요한 법적·규제적 조치를 취하여야 한다.','각국은 위장은행의 설립 혹은 운영을 허용하여서는 안 된다.'],0,
  '권고사항 26은 범죄자나 그 관련자가 금융회사에 중대한 영향력을 미칠 수 있는 지분이나 지배지분을 소유하거나 실제소유자·경영권을 갖는 것을 "방지"하기 위한 법적·규제적 조치를 취하도록 명시적으로 요구해요. "규제할 필요가 없다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
