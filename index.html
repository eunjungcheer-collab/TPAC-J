  ['부동산 사업은 고객 및 제공되는 서비스와 관련하여 사업에 내재된 위험에 대한 평가를 기준으로 해야 하며, 부동산 중개인의 우려 사항 및 고객의 의심 또는 일반적인 행동을 포함한 고위험을 평가할 필요가 있다.','위험평가는 부동산 전문가 사업의 규모, 부동산 회사와 관련된 거래의 재정적 가치, 회사가 부동산 거래에 관여하게 된 방법 및 부동산 거래의 성격(해외 구매 여부, 상업용·주거용 여부 포함)을 고려하는 접근 방식을 따라야 한다.','위험평가는 부동산 거래의 재정적 가치나 성격과는 무관하게 획일적인 단일 기준만을 적용해야 한다.','부동산 부문과 관련하여 기타 DNFBPs 및 은행 등은 AML/CFT 위험에 대한 노출을 고려하는 RBA를 채택해야 한다.'],2,
  '위험평가는 부동산 전문가 사업의 규모, 거래의 재정적 가치, 부동산 거래의 성격(해외 구매 여부, 상업용·주거용 여부 등)을 고려하는 접근 방식을 따라야 해요. "재정적 가치나 성격과 무관하게 획일적인 단일 기준만 적용"한다는 서술은 원문과 반대예요.','ultra'),
M('jd3_11',
  '부동산 중개업자를 위한 가이던스 3.2.1(지리적 위험)에서 지리적 위험 식별 시 고려해야 할 요소에 해당하지 않는 것은?',
  ['해당 국가의 AML/CFT 제도의 효율성 및 결함이 있는 것으로 식별되었는지 여부.','해당 지역 부동산 중개업소들의 평균 직원 근속연수.','해당 지역의 부동산과 관련된 위협과 취약성의 수준과 특성.','해당 국가 또는 부동산 전문가가 활동하는 국가와 연관된 UN 및 국제기구에서 발표한 경제 또는 금융 제재, 금수 조치 또는 유사한 조치의 대상인지 여부.'],1,
  '지리적 위험 식별 시 고려 요소는 AML/CFT 제도 효율성·결함, 지역 부동산 관련 위협·취약성, 법적 투명성·프레임워크 준수 수준, UN·국제기구의 제재·금수 조치 대상 여부, 부동산 소재지, 구매자·판매자 소재지 및 비즈니스 관계의 성격·목적, 해외발생 비대면 거래 여부 등이에요. "부동산 중개업소들의 평균 직원 근속연수"는 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  '부동산 중개업자를 위한 가이던스에서 지리적 위험 요소로 언급되는 것에 해당하는 것은?',
  ['부동산 전문가가 소속된 협회의 회비 납부 이력.','부동산이 위치한 국가의 조세 회피처 여부 및 조세 정보 교환 협정 체결 현황.','부동산 전문가가 활동하는 국가의 최근 5년간 부동산 가격 상승률.','자금이 해외에서 발생하여 대면하지 않고 거래가 이루어졌는지 여부.'],3,
  '지리적 위험 요소에는 자금이 해외에서 발생하여 대면하지 않고 거래가 이루어졌는지 여부가 포함돼요. 나머지 선택지들은 이 가이던스가 제시하는 지리적 위험 요소에 해당하지 않아요.','ultra'),
M('jd3_11',
  '부동산 중개업자를 위한 가이던스 3.2.2(고객 위험) 109번 문단에서 고려해야 할 고객 관련 위험 요소에 해당하지 않는 것은?',
  ['고객이 해당 중개업소를 이용한 총 횟수 및 거래 완료까지 걸린 평균 기간.','고객이 금융제재 대상에 포함되어 있는지 또는 UN과 같은 국제기구에서 채택한 제재·금수 조치 또는 유사한 조치의 대상인지 여부.','구매자가 부동산 구매와 관련된 투자 프로그램에 의한 시민권을 갖고 있는지 여부, 고객이 자금세탁·테러지원 위험과 연관성이 있는지 여부.','구매자 또는 판매자가 부패, 조직범죄 또는 심각한 사기에 연루되었거나 테러 활동에 자금을 제공·지원한다고 신뢰할 수 있는 출처에 의해 파악된 고위험 국가 출신인지 여부.'],0,
  '고객 위험 요소는 부패·조직범죄·심각한 사기·테러 관련 고위험국 출신 여부, 금융제재·국제기구 제재 대상 여부, 투자 프로그램에 의한 시민권 보유 여부, 자금세탁·테러지원 위험 연관성 등이에요. "고객의 중개업소 이용 횟수 및 거래 완료까지의 평균 기간"은 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  '국제변호사협회(미국·유럽 등 주요 변호사 협회 공동)의 AML 가이드북(2014년, A Lawyer\'s Guide to Detecting and Preventing Money Laundering)의 발간 배경에 대한 설명으로 옳지 않은 것은?',
  ['자금세탁 및 테러 자금 조달은 생명과 사회에 심각한 위협을 가하며 폭력을 초래하는 범죄 행위이며, 변호사라는 직업군은 항상 정직하게 행동하고 법치를 준수하며 범죄 행위를 저지르지 않도록 주의해야 한다.','변호사는 돈세탁 및 테러자금조달 활동을 위해 법조계를 오용하려는 범죄자의 위협에 대한 인식을 늘 가지고 있어야 하며 현상 파악이 빨라야 한다.','이 가이드북은 변호사의 AML 의무와는 무관하며 오직 변호사의 보수 체계만을 다룬다.','변호사협회는 법조계를 교육하는 데 있어 핵심적인 역할을 하지만, 개인 변호사와 법률회사는 자금세탁방지(AML) 의무를 인식하고 준수해야 할 책임이 있다.'],2,
  '이 가이드북(2014년)은 변호사가 돈세탁·테러자금조달을 위한 법조계 오용 위협에 대한 인식을 갖고, 개인 변호사·법률회사가 AML 의무를 인식·준수할 책임이 있음을 강조하는 발간물이에요. "변호사의 보수 체계만을 다룬다"는 서술은 옳지 않아요.','ultra'),
M('jd3_11',
  '국제변호사협회 AML 가이드북(2014년)의 발간 취지에 대한 설명으로 옳은 것은?',
  ['2009년 자금세탁 규모는 세계 GDP의 0.1%에 불과한 미미한 수준으로 파악되어, 국제변호사협회가 이를 심각한 문제로 다루지 않고 별도의 가이드북 발간도 필요하지 않다고 판단하였다','이 가이드북은 자금세탁방지와는 전혀 무관하게, 변호사들의 소득세 신고 절차를 안내하기 위한 순수 세무 실무 지침서로 발간되었다','이 가이드북에 따르면 자금세탁방지 조치와 테러자금조달방지 조치는 각국의 법체계에서 완전히 별개로 다루어지며, 두 조치 사이에는 어떠한 중복이나 연계도 존재하지 않는 것으로 서술되어 있다','2009년 자금세탁 규모는 세계 국내총생산(GDP)의 2.7%(또는 미화 1조 6,000억 달러)에 달한다는 보도 자료가 나올 정도로 상황이 심각하며, 자금세탁 및 테러자금조달을 방지하기 위한 조치는 범죄자가 자금의 출처와 목적지를 숨기면서 자금이체를 시도하므로 상당 부분 중복된다.'],3,
  '2009년 자금세탁 규모는 세계 GDP의 2.7%(미화 1조 6,000억 달러)에 달한다는 보도가 나올 정도로 심각해, 국제변호사협회는 변호사들이 자금세탁·테러자금조달 방지에 대한 인식을 높이도록 가이드북을 발간했어요.','ultra'),
M('jd3_11',
  '국제변호사협회 AML 가이드북(2014년)의 주요내용에 대한 설명으로 옳지 않은 것은?',
  ['이 가이드에서는 변호사는 자금세탁의 위험은 국가/지리적 위험, 고객위험, 거래위험에서 기인함을 강조하고 있다.','변호사는 범죄자의 자금세탁 활동을 돕는 데 오용될 수 있으며, 범죄자는 범죄 기반 금융·기업 및 부동산 거래에 합법성을 부여하기 위해 법률 서비스(금융시스템 포함)를 찾고 있고, 불법자금을 전달하기 위해 점점 더 정교하고 복잡한 수단을 찾고 있다.','본 가이드는 자금세탁방지(AML) 준수에 초점을 맞추고 있다.','변호사가 범죄자에 의해 오용될 가능성은 대형 로펌에서만 발생할 뿐 개인 변호사에게는 해당되지 않는 것으로 이 가이드는 설명하고 있다'],3,
  '국제변호사협회 AML 가이드북(2014)은 변호사 일반이 규모와 무관하게 범죄자의 자금세탁 활동에 오용될 가능성을 강조해요. "대형 로펌에서만 발생할 뿐 개인 변호사에게는 해당되지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd3_11',
  '국제변호사협회 AML 가이드북(2014년)에서 변호사의 태도에 대한 설명으로 가장 옳은 것은?',
  ['변호사는 고객과의 신뢰관계 보호를 최우선 가치로 삼아야 하므로, 자금세탁이나 테러자금조달에 대한 인식이나 경계심을 가질 필요가 전혀 없는 것이 국제변호사협회의 기본 입장이다','인식, 경계, 위험 신호 인식 및 주의야말로 자금세탁 및 테러자금조달에 대한 의심스러운 상황을 평가하는 변호사의 최선의 도구라고 볼 수 있으며, 일부 국가에서 변호사가 고객을 제대로 확인하지 못하거나 의심스러운 거래를 보고하지 않아 자금세탁 지원 범죄로 유죄 판결을 받을 수 있다.','위험 신호(red flag) 인식은 회계사나 은행원과 같은 금융 전문직의 고유 업무일 뿐, 법률 자문을 제공하는 변호사의 업무 범위와는 무관한 사항으로 분류된다','변호사는 의뢰인에 대한 고객확인에 실패하거나 의심거래를 인지하고도 보고하지 않은 경우라 하더라도, 직업적 특권을 이유로 어떠한 법적 책임도 지지 않는 것이 국제 기준이다'],1,
  '인식·경계·위험신호 인식·주의는 변호사가 자금세탁·테러자금조달 관련 의심스러운 상황을 평가하는 최선의 도구이며, 일부 국가에서는 변호사가 고객을 제대로 확인하지 못하거나 의심거래를 보고하지 않아 자금세탁 지원 범죄로 유죄 판결을 받을 수 있어요.','ultra'),
M('jd3_11',
  '국제변호사협회 AML 가이드북(2014년)에서 제시하는 "변호사가 취약한 5가지 유형(Money laundering and terrorist financing susceptible legal services)"에 해당하지 않는 것은?',
  ['고객 계좌의 이용(Use of client accounts).','"위장" 소송(\'Sham\' litigation), 부동산 매입(Purchase of real estate).','신탁·회사·자선단체의 관리(Management of trusts, companies and charities), 신탁·회사·자선단체의 설립(Creation of trusts, companies and charities).','법률 자문 수수료를 정액제(flat fee)로 청구하는 방식(Flat-fee billing).'],3,
  '변호사가 취약한 5가지 유형은 고객 계좌 이용, 위장 소송, 부동산 매입, 신탁·회사·자선단체의 관리, 신탁·회사·자선단체의 설립이에요. "수수료를 정액제로 청구하는 방식"은 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  'OECD 조세범죄 및 화이트칼라 범죄를 조장하는 전문가 단속 가이던스(2021)의 개요에 대한 설명으로 옳지 않은 것은?',
  ['많은 금융범죄는 법적, 재정적 구조의 설계에 도움을 줄 수 있는 변호사, 회계사, 금융기관 등의 일부 전문적 조력자에 의해 발생된다.','이 가이던스는 전문 조력자의 역할을 옹호하며 이들에 대한 어떠한 규제나 차단도 필요하지 않다고 결론짓는다.','금융범죄의 기회를 만들고 범죄행위를 은폐하는 전문 조력자를 표적화하여 이들의 활동을 차단해야 범죄활동을 원천적으로 해결할 수 있다.','이 보고서에서는 전문 조력자에 대한 정부의 대응책을 5가지로 제시하고 있다.'],1,
  '이 가이던스는 오히려 금융범죄의 기회를 만들고 범죄행위를 은폐하는 전문 조력자를 "표적화하여 이들의 활동을 차단"해야 한다고 강조하고 있어요. "전문 조력자의 역할을 옹호하며 규제·차단이 필요하지 않다"는 서술은 원문과 정반대예요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 제시하는 정부의 5가지 대응책에 해당하지 않는 것은?',
  ['전문 조력자 차단을 위한 법과 규제, 전문 조력자 억제 방안.','전문 조력자에게 세금 감면 혜택을 무조건 제공하는 방안','전문 조력자 대응을 위한 국내외 다자간 노력.','전문 조력자의 역할 이해, 전문 조력자의 식별 방안.'],1,
  'OECD 정부 5가지 대응책은 법·규제, 전문 조력자 식별, 다자간 노력, 억제 방안 등을 포함해요. "전문 조력자에 대한 무조건적인 세금 감면 혜택 제공"은 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 조세 및 금융범죄에서의 전문 조력자의 범위에 해당하지 않는 것은?',
  ['세무사, 변호사 및 법률 고문, 회계사, 재무 고문.','금융기관, 회사 설립 및 등록 대리인.','공증인, 신탁 관리자, 신탁 및 기업 서비스 제공자.','일반 소비자로서 단순히 은행 예금 계좌를 개설한 개인.'],3,
  '조세 및 금융범죄에서 전문 조력자는 세무사, 변호사·법률고문, 회계사, 재무고문, 금융기관, 회사 설립·등록 대리인, 공증인, 신탁 관리자, 신탁·기업 서비스 제공자 등을 포함해요. "단순히 은행 예금 계좌를 개설한 일반 소비자"는 전문 조력자에 해당하지 않아요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 전문 조력자가 제공하는 불법적 서비스의 방식에 대한 설명으로 옳지 않은 것은?',
  ['전문 조력자가 제공하는 서비스 중 쉘 컴퍼니 설립이나 허위 문서 작성과 같은 요소는 반드시 형사처벌 대상 행위로 확정되어 있는 것으로 이해해야 한다','전문 조력자가 제공하는 서비스 대부분은 합법적으로 이루어지지만, 이들은 여러 방식으로 불법적 서비스를 제공한다.','실소유권과 소득 및 자산을 숨기고 출처를 위장하기 위해 여러 관할 구역에 해외 법인과 쉘 컴퍼니를 설립하여 소유권과 통제 구조를 복잡하게 만든다.','허위의 이사와 수탁자, 주주 등을 설정해 고객의 실소유권을 위장하거나, 납세 회피나 부당한 세금 환급을 위해 허위 문서를 작성하기도 한다.'],0,
  '전문 조력자가 제공하는 서비스는 대부분 합법적이지만 여러 방식으로 불법적 서비스(쉘 컴퍼니 설립, 허위 문서 작성 등)도 제공할 수 있어요. "반드시 형사처벌 대상 행위로 확정되어 있다"는 서술은 개별 사안 판단 없이 일률적으로 단정해 옳지 않아요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 전문 조력자 식별 방안에 대한 설명으로 가장 옳은 것은?',
  ['전문 조력자를 식별하는 것은 그 특성상 사실상 불가능한 작업으로 알려져 있어, 이들을 파악하기 위한 어떠한 절차적 방안도 마련할 실익이 없는 것으로 평가된다','전문 조력자의 활동은 오로지 기업의 사업 감사(business audit) 영역에만 국한되어 나타나는 현상으로, 민사·형사 절차와 같은 다른 법적 절차와는 전혀 무관한 것으로 이해된다','전문 조력자로 인해 발생하는 위협을 해결하기 위해서는 이들에 대한 정보를 포착하고 식별할 수 있는 절차적 방안이 마련되어야 하며, 국가는 범죄행위를 나타낼 수 있는 의심스러운 행동 패턴과 추세를 식별하고 데이터와 정보를 활용하여 이에 대한 지표를 개발하여야 한다.','데이터와 정보를 활용하여 위험 지표를 개발하는 작업은, 전문 조력자를 식별하고 그 활동을 포착하는 목적과는 아무런 관련이 없는 별개의 독립적인 사안으로 취급된다'],2,
  '전문 조력자로 인한 위협 해결을 위해서는 이들에 대한 정보 포착·식별 절차가 마련되어야 하며, 국가는 의심스러운 행동 패턴·추세를 식별하고 데이터·정보를 활용해 지표를 개발해야 해요. 전문 조력자의 활동은 사업 감사부터 민사·형사 절차까지 넓은 영역에서 이루어질 수 있어요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 "Hot spot"에 대한 설명으로 가장 옳은 것은?',
  ['\'Hot spot\'은 전문 조력자의 활동과는 무관하게 기후 변화가 자금세탁 위험에 미치는 영향을 설명하기 위해 OECD가 새로 도입한 지리적 기후 용어이다','회피 구조를 위한 관할권(\'Hot spot\')은 국제 조세조약 개정 시점에 한 번 정해지면 이후 어떠한 상황에서도 변동되지 않는 고정된 목록으로 관리된다','\'Hot spot\' 개념은 이 가이던스가 다루는 전문 조력자의 회피 구조 문제와는 무관하며, 순수하게 부동산 시장의 지역별 가격 상승 현상을 지칭하는 용어이다','이미 여러 국가는 데이터 분석과 감사 활용을 위해 해외 서비스 제공업체 및 회사와 관련된 전문 조력자에 대한 정보를 수집하고 있으며, 회피 구조를 위한 \'Hot spot\'으로 알려진 해외 관할권이 동일한 전문 조력자에 의해 반복적으로 형성되고 있다는 것을 확인할 수 있다.'],3,
  '\'Hot spot\'은 회피 구조를 위해 반복적으로 활용되는 해외 관할권을 지칭하는 용어로, 동일한 전문 조력자에 의해 반복적으로 형성되고 있음이 데이터 분석을 통해 확인되고 있어요. 이러한 권역은 새로운 전략에 따라 변동될 수 있으므로 국가적 대응 전략이 새로운 정보에 유연하게 적응할 수 있어야 해요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 전문 조력자 활동 식별을 위한 구체적인 방안에 해당하지 않는 것은?',
  ['STR 정보분석을 통한 반복적 거래와 전문가 및 고객식별.','데이터 마이닝·정보 활용을 통한 특정 관할 구역의 공통 고객 및 구조 분석.','전문 조력자가 소속된 사무소의 연간 광고비 지출 규모 확인.','의심스러운 구조 및 거래에 대한 세무 행정 공무원의 보고 체계.'],2,
  '전문 조력자 활동 식별을 위한 구체적 방안은 데이터 마이닝을 통한 공통 고객·구조 분석, STR 정보분석을 통한 반복 거래·전문가·고객 식별, 의심스러운 구조·거래에 대한 세무 행정 공무원의 보고 체계 등이에요. "사무소의 연간 광고비 지출 규모 확인"은 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 전문 조력자 식별을 위해 활용할 수 있는 방식에 해당하지 않는 것은?',
  ['규제당국 발표 자료를 활용한 사후적 통계 집계만으로 전문 조력자를 사후에 분류하는 방식.','자발적 공개 프로그램을 통한 정보 수집, 페이퍼 컴퍼니 및 의심스러운 이사진에 대한 내부 데이터베이스 생성.','내부고발 보고서 활용, 정부 기관과의 문서 진위 확인, 납세자 신원확인.','세금에 대한 데이터베이스인 OECD APT 디렉토리 확인.'],0,
  '전문 조력자 식별 방안은 자발적 공개 프로그램, 내부 데이터베이스 생성, 내부고발 보고서 활용, 문서 진위 확인, 납세자 신원 확인, OECD APT 디렉토리 확인, 데이터 마이닝 등이에요. "규제당국 발표 자료를 활용한 사후적 통계 집계만으로 사후에 분류하는 방식"은 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 "전문 조력자 차단을 위한 법과 규제"에 대한 설명으로 옳지 않은 것은?',
  ['전문 조력자의 범죄행위를 처벌하기 위해 형사 제재뿐 아니라 감독·규제 기관을 통한 민사적 대응, 금지 명령 및 해고를 통해 전문 조력자의 범죄행위 개입을 막아야 한다.','변호사, 세무사, 공증인, 회계사는 법률로 부여된 전문적 특권과 전문적 기술을 바탕으로 법률 및 금융시스템의 게이트키퍼로서 활동하며, 국가는 이들이 법에 따라 업무를 수행하도록 해야 한다.','전문 조력자에 대해서는 어떠한 국가도 형사처벌과 별개의 민사적 제재를 규정하고 있지 않다.','일부 국가에서는 특별법을 통해 전문 조력자의 행위에 대해 금융범죄에 대한 방조·교사보다 더 높은 형벌을 받도록 규정하고 있다.'],2,
  '호주, 프랑스, 영국과 같은 일부 국가에 대해서는 전문 조력자에 대한 형사처벌과 "별개로 민사적 제재 조항도 존재"한다고 명시되어 있어요. "어떠한 국가도 민사적 제재를 규정하고 있지 않다"는 서술은 옳지 않아요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 전문 기관을 통한 AML/CFT 제재에 대한 설명으로 가장 옳은 것은?',
  ['면허 정지나 회원 자격 박탈(구성원 추방)과 같은 강도 높은 제재 조치는, 전문 기관이 자율적으로 행사할 수 있는 권한의 범위를 벗어나는 것으로 알려져 있다','변호사협회와 국제회계윤리이사회(IESBA)는 각자의 직역 특성상 서로 완전히 독립적으로 운영되어, 이 둘 사이에는 AML/CFT 관련 어떠한 형태의 협력이나 정보 교류도 이루어지지 않는 것으로 알려져 있다','전문 기관은 그 구성원들의 직역 특성상, AML/CFT 관련 사안에 있어서는 어떠한 감독이나 제재 역할도 수행하지 않는 것으로 이해된다','많은 국가에서는 AML/CFT를 위해 변호사협회나 국제회계윤리이사회(IESBA) 등의 전문 기관에 행동 강령과 윤리적 의무를 부과하고 있으며, 이러한 전문 기관은 전문직 구성원들의 위법 행위에 대해 보고받고 면허 정지 및 구성원 추방 등의 제재를 가할 수 있다.'],3,
  '많은 국가에서는 변호사협회나 국제회계윤리이사회(IESBA) 등의 전문 기관에 행동 강령과 윤리적 의무를 부과하며, 이들 기관은 전문직 구성원의 위법 행위를 보고받고 면허 정지·구성원 추방 등의 제재를 가할 수 있어요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 FATF 표준과 전문 조력자 차단의 관계에 대한 설명으로 가장 옳은 것은?',
  ['DNFBP에 대한 모니터링과 감독은 FATF 표준이 다루는 범위 밖의 사안으로, FATF 표준 이행 체제와는 전혀 무관하게 별도로 규율되는 것으로 이해해야 한다','FATF 표준은 DNFBP(특정비금융사업자 및 전문직)와는 전혀 무관하며, 오로지 전통적인 금융기관만을 규율 대상으로 삼는 것으로 이해해야 한다','FATF 표준은 DNFBP에 대해 AML과 CTF를 위한 모니터링과 감독을 요구하고 있으며, FATF 표준을 시행하고 있는 감독·규제 체제에 적용한다면 전문 조력자의 금융범죄를 효과적으로 차단할 수 있다.','FATF 표준은 전문 조력자 차단이라는 목표와는 어떠한 관련성도 갖지 않는, 완전히 별개의 독립적인 국제기준으로 이해해야 한다'],2,
  'FATF 표준은 DNFBP에 대해 AML과 CTF를 위한 모니터링과 감독을 요구하고 있으며, FATF 표준을 시행하는 감독·규제 체제에 적용하면 전문 조력자 차단에도 기여할 수 있어요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 이사자격 박탈 관련 국가별 제도에 대한 설명으로 가장 옳은 것은?',
  ['이사자격 박탈에 관한 명부는, 조사한 어떠한 국가에서도 이러한 형태의 공개 제도를 운영하고 있지 않은 것으로 알려져 있어 국제적으로 전혀 활용되지 않는 개념인 것으로 이해해야 한다','특정 국가에서 이사자격이 박탈된 사람이라 하더라도, 국경을 넘어 다른 국가로 이동하는 경우에는 그 국가에서 아무런 법적 제약 없이 자유롭게 다시 이사로 활동할 수 있는 것으로 이해해야 한다','일부 국가에서는 이사자격 박탈에 대한 공개 명부가 있어, 자격이 박탈된 이사가 다른 국가에서 이사로 활동하지 못하게 하는 장치로 활용하기도 하며, 이는 정부 및 국가 간 정보 공유를 통해 추가 범죄의 발생을 방지할 수 있게 한다.','국가와 국가 사이에 이루어지는 정보 공유는, 이사자격을 박탈하거나 그 효력을 유지하는 문제와는 직접적인 관련성이 없는 무관한 사안으로 취급되는 것으로 이해해야 한다'],2,
  '일부 국가에서는 이사자격 박탈에 대한 공개 명부가 있어, 자격이 박탈된 이사가 다른 국가에서 이사로 활동하지 못하게 하는 장치로 활용되며, 이는 정부 및 국가 간 정보 공유를 통해 추가 범죄 발생을 방지하는 효과가 있어요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 "전문 조력자 억제 방안"에 대한 설명으로 옳지 않은 것은?',
  ['전문 조력자 억제 방안은 국가별 형사처벌 수준을 통일하는 국제조약 체결만을 유일한 수단으로 다루고 있는 것으로 이해해야 한다','정부 및 언론 보도와 온라인 세미나 및 교육 기관 협력을 통한 정기적 공공-민간 대화 등의 의사소통 전략을 통해 위험을 알리고 자발적으로 규정을 준수할 필요가 있다.','사후 해결 방안과 더불어, 전문 조력자 남용으로 인한 위험을 인식하고 자발적인 규정 준수 문화를 확산시켜 범죄활동을 저지하기 위한 선제적 예방 전략도 중요하다.','세간의 이목을 끄는 금융범죄에 대해 범죄자에 대한 처벌 및 제재조치를 대중에게 공개하여, 범죄자의 최후를 공개하고 공정한 조세 제도에 대한 대중의 신뢰를 강화하여 유사한 범죄를 저지할 수 있다.'],0,
  '전문 조력자 억제 방안은 형사처벌 통일을 위한 국제조약뿐 아니라 자발적 규정 준수 문화 확산 등 다양한 방안을 중요하게 다뤄요. "국제조약 체결만을 유일한 수단으로 다룬다"는 서술은 옳지 않아요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 영국의 기업 책임 강화 사례에 대한 설명으로 가장 옳은 것은?',
  ['영국의 2017년 법안이 다루는 기업 책임은 순수하게 재무제표 작성 관련 책임에 국한되며, 기업 내부의 통제 문화나 조직적 대응 체계와는 관련이 없는 규정이다','영국의 경우 2017년 새로운 법안을 도입하여 내부적으로 기업 범죄 발생을 막지 못한 기업에 대해 형사 책임과 시스템 및 통제 문화에 대한 개선의 책임을 부과하고 있으며, 이는 기업이 조직 내부의 행동에 책임을 지고 적절한 시스템을 통해 통제하도록 사회적 의무를 부과하는 것이다.','2017년 영국의 법안은 기업 범죄 발생 시 기업이 부담하던 기존의 형사 책임을 오히려 경감하거나 면제해 주는 방향으로 제정된 규정이다','영국은 브렉시트 이후 자국 기업의 국제 경쟁력을 고려하여, 기업의 형사 책임을 강화하는 어떠한 법안도 도입하지 않기로 결정하였다'],1,
  '영국은 2017년 새로운 법안을 도입하여 내부적으로 기업 범죄 발생을 막지 못한 기업에 형사 책임과 시스템·통제 문화 개선 책임을 부과했어요. 이는 기업이 조직 내부 행동에 책임을 지고 적절한 시스템으로 통제하도록 하는 사회적 의무를 부과하는 것이에요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 "전문 조력자 대응을 위한 국내외 다자간 노력"에 대한 설명으로 옳지 않은 것은?',
  ['금융범죄의 예방과 적발, 수사와 기소 및 범죄자산 회수까지의 절차에는 세무서부터 금융 규제기관, 금융 정보기관, 경찰과 검사까지 다양한 기관이 개입하게 된다.','법집행기관 단독의 대응만으로 전문 조력자 문제를 완전히 해결할 수 있으므로 다른 기관과의 협력은 불필요하다.','법집행기관의 단독적인 대응은 전문 조력자 관련 문제를 포괄적으로 해결할 수 없으므로, 전문 조력자와 관련된 문제에는 정부 전체 및 다자간 접근이 요구되며, 국가는 타 관할 구역의 기관 및 국제적으로 협력할 필요가 있다.','국가는 보고 및 정보 공유를 위한 법적 체제를 마련하고, 기관의 역할 및 보유 정보 관리에 대해 담당자 배치 및 충분한 교육훈련이 이루어지도록 지원해야 한다.'],1,
  '법집행기관의 "단독적인 대응은 전문 조력자 관련 문제를 포괄적으로 해결할 수 없으므로" 정부 전체 및 다자간 접근이 요구된다고 명시되어 있어요. "법집행기관 단독 대응만으로 완전히 해결 가능하며 협력이 불필요하다"는 서술은 원문과 정반대예요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 기관 간 정보 공유 메커니즘에 대한 설명으로 가장 옳은 것은?',
  ['전문 조력자의 예방과 식별, 범죄 차단 및 기소까지 일관되게 구현하기 위해서는 자발적인 정보 공유 시스템, 데이터에 대한 직접적인 액세스, 사례 교환 등의 기관 간 능동적인 정보 공유가 가능한 메커니즘이 마련되어야 한다.','기관 간에 정보를 공유하는 메커니즘은, 전문 조력자에 대한 예방·식별·대응 조치와는 직접적인 관련이 없는 무관한 사안으로 다루어지는 것으로 이해해야 한다','전문 조력자 문제에 대응하기 위해서는, 각 기관이 서로 완전히 독립적으로만 활동해야 하며 기관 간 어떠한 형태의 정보 공유도 이루어져서는 안 되는 것으로 이해해야 한다','데이터에 대한 직접적인 접근 권한을 확보하는 것은, 전문 조력자에 대한 효과적인 대응에는 실질적으로 도움이 되지 않는 것으로 평가되는 것으로 이해해야 한다'],0,
  '전문 조력자의 예방·식별·범죄차단·기소까지 일관되게 구현하려면 자발적인 정보 공유 시스템, 데이터에 대한 직접적인 액세스, 사례 교환 등 기관 간 능동적인 정보 공유 메커니즘이 마련되어야 해요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 중앙 정보센터와 국제협력의 역할에 대한 설명으로 가장 옳은 것은?',
  ['중앙 정보센터는 국제협력이나 정보 공유와는 무관하게, 순수하게 국내 사건만을 취급하는 자국 전용 데이터베이스 관리 기구로서의 성격만을 갖는 것으로 이해된다','금융범죄는 그 특성상 국경 내에서만 발생하고 완결되는 경향이 있으므로, 국제협력이나 정보센터를 통한 공조 체계는 실무상 큰 실익이 없는 것으로 평가된다','중앙 정보센터를 통해 기관의 정보 수집과 분석을 집중화함으로써 정보 공유 및 협력을 효과적으로 만들어야 하며, 조세 회피를 포함한 금융범죄가 국경을 넘나들며 자금을 이동시키는 등 범세계적 문제인 만큼 국제협력을 통해 국경 밖에서 일어나는 활동에 대해서도 집중해야 한다.','여러 기관의 정보 수집과 분석 기능을 하나의 중앙 정보센터로 집중화하는 방식은, 오히려 각 기관의 독립성을 저해하여 국제협력의 효과성을 전반적으로 떨어뜨리는 요인으로 작용한다'],2,
  '중앙 정보센터를 통해 정보 수집·분석을 집중화하면 정보 공유·협력이 효과적이며, 조세 회피를 포함한 금융범죄는 국경을 넘나드는 범세계적 문제이므로 국제협력을 통해 국경 밖 활동에도 집중해야 해요.','ultra'),
M('jd3_11',
  'OECD 전문가 단속 가이던스(2021)에서 중개자 및 납세자를 대상으로 하는 공시 의무 규정에 대한 설명으로 가장 옳은 것은?',
  ['내부고발이나 익명 제보를 활성화하는 것과 같은 방안은, 이 가이던스가 다루는 전문 조력자 대응 문제와는 직접적인 관련이 없는 무관한 사안으로 취급되는 것으로 이해해야 한다','중개자나 납세자에게 특정 거래나 약정에 대한 공시 의무를 부과하는 규정은, 실질적으로 금융범죄를 예방하는 효과와는 무관한 순전히 행정적인 절차에 불과한 것으로 이해해야 한다','중개자 및 납세자를 대상으로 하는 공시 의무 규정을 통해 특정 형태의 약정을 만들어내거나 거래에 관여하는 경우, 관련 규제기관에 보고하도록 법적으로 규정함으로써 금융범죄를 저지하고 범죄 발생 초기 단계에 개입하여 대처할 수 있다.','수사와 기소 과정에서 핵심적인 정보를 제공하는 제보자들에게는, 그 어떠한 형태의 인센티브나 보호 조치도 제공되어서는 안 되는 것으로 이 가이던스가 명시적으로 정하고 있는 것으로 이해해야 한다'],2,
  '중개자·납세자 대상 공시 의무 규정은 특정 형태의 약정 형성이나 거래 관여 시 관련 규제기관에 보고하도록 법적으로 규정하여 금융범죄를 저지하고 초기 단계에 개입할 수 있게 해요. 또한 내부고발·익명 제보 활성화, 수사·기소에 핵심 정보를 제공하는 사람에 대한 처벌 면제 등 인센티브 제공을 통해 국가가 고급 정보에 대한 접근성을 높일 수 있어요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스 102번 문단(국가/지리적 위험)에서 고객의 거주지, 자산 위치 또는 자산·자금의 출처 국가를 더 높은 위험 범주에 두는 이유에 해당하지 않는 것은?',
  ['UN과 같은 국제기구에서 발표한 제재, 금수 조치 또는 유사한 조치의 대상국, AML/CFT 체제가 약한 것으로 FATF 성명서에 의해 확인된 국가.','테러활동에 자금 또는 지원을 제공하거나 테러조직으로 지정된 곳과 같은 지역에서 활동하는 것으로 신뢰할 수 있는 출처에서 확인된 국가/지역.','해당 국가의 국내총생산(GDP) 성장률이 세계 평균보다 낮은 경우.','불법 약물, 인신매매, 밀수, 불법도박의 출처 또는 통과 국가를 포함하여 상당한 수준의 조직범죄, 부패 또는 기타 범죄활동이 있는 것으로 신뢰할 수 있는 출처에 의해 확인된 국가.'],2,
  '국가/지리적 위험 요소는 (a)테러활동 자금·지원 제공 지역 (b)조직범죄·부패 관련 국가 (c)UN 등 국제기구 제재·금수 대상국 (d)AML/CFT 체제가 약한 것으로 확인된 국가 등이에요. "GDP 성장률이 세계 평균보다 낮은 경우"는 이와 무관해요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 실제소유자 정보 제공에 비협조적인 국가 판단 방법에 대한 설명으로 가장 옳은 것은?',
  ['실제소유자 정보 제공 협조 여부는 공식적으로 발간되는 어떠한 국제 보고서로도 확인할 수 없으므로 법률 전문가가 개별적으로 해당 국가에 문의하는 것 외에는 판단 방법이 없다','FATF 상호평가 보고서는 각국의 형사사법 통계만을 다루고 있어 실제소유자 정보 제공 협조 수준과는 무관한 내용으로 구성된다','OECD 글로벌 포럼 보고서는 조세 분야의 국제기준만을 다루므로 자금세탁방지 목적의 실제소유자 정보 제공 판단에는 참고할 수 없는 자료이다','법률 전문가는 권한 당국에 실제소유자 정보를 제공하는 데 비협조적인 것으로 신뢰할 수 있는 출처에 의해 확인된 국가를, FATF 상호평가 보고서 또는 국제조세 투명성 기준에 대한 OECD 글로벌 포럼 보고서와 같은 다양한 협력 수준을 고려하는 조직이 작성한 보고서를 검토함으로써 판단에 도달할 수 있다.'],3,
  '법률 전문가는 FATF 상호평가 보고서나 국제조세 투명성 기준에 대한 OECD 글로벌 포럼 보고서 등 다양한 협력 수준을 고려하는 조직의 보고서를 검토함으로써, 실제소유자 정보 제공에 비협조적인 국가를 판단할 수 있어요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스 102번 문단에 대한 설명으로 가장 옳은 것은?',
  ['국가 위험에 대해서는 이미 보편적으로 합의된 단일한 정의가 명확하게 확립되어 있어, 모든 관할권의 감독당국이나 법률 전문가가 이를 완전히 동일하게 해석하고 적용하고 있는 것으로 이해해야 한다','국가 위험이라는 요소는, 고객이나 거래가 실제로 제기하는 ML/TF 위험을 평가하는 전반적인 과정과는 직접적인 관련성이 없는 무관한 별개의 요소로 취급되는 것으로 이해해야 한다','관할 당국, SRB 또는 법률 전문가가 특정 국가/지리적 영역이 더 높은 위험을 나타내는지 여부를 규정하는 보편적으로 합의된 정의는 없으나, 국가 위험은 다른 위험 요소와 함께 ML/TF 위험에 대한 유용한 정보를 제공한다.','국가 위험이라는 요소는 반드시 단독으로만 고려되어야 하며, 고객 위험이나 상품 위험과 같은 다른 위험 요소들과 결합하여 종합적으로 평가해서는 안 되는 것으로 이해해야 한다'],2,
  '국가/지리적 영역의 위험 수준을 규정하는 보편적으로 합의된 정의는 없지만, 국가 위험은 다른 위험 요소와 "함께" ML/TF 위험에 대한 유용한 정보를 제공해요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스 103번 문단(고객·의뢰인 위험, Client Risk)에서 더 높은 위험을 나타낼 수 있는 고객 유형에 해당하지 않는 것은?',
  ['오랜 기간 동일한 법률사무소를 이용해 온 개인 고객으로서 모든 거래 내역이 투명하게 공개되어 있는 고객.','정치적 주요인물(PEP) 및 PEP와 밀접한 관련이 있거나 관련된 사람.','비정상적이거나 비관습적인 상황에서 비즈니스 관계를 수행하거나 서비스를 요청하는 고객.','법인 또는 관계의 구조나 특성으로 인해 적시에 진정한 실제소유자 또는 지배적 이해관계를 식별하기 어려운 고객.'],0,
  '높은 위험을 나타낼 수 있는 고객 유형은 PEP 및 관련자, 비정상적·비관습적 상황의 비즈니스 관계, 실제소유자·지배관계 식별이 어려운 법인, 지리적 위험이 높은 국가에서 사업을 운영하는 고객회사 등이에요. "오랜 기간 동일 법률사무소를 이용하고 거래 내역이 투명하게 공개된 고객"은 오히려 저위험 요소에 가까워요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 실제소유자 식별이 어려운 고객의 구체적 사례에 해당하지 않는 것은?',
  ['고객이 법률사무소에 제출한 신분증 사본의 스캔 해상도가 낮은 경우.','특정 상황, 구조, 지리적 위치, 국제 활동 또는 기타 요인이 고객의 비즈니스 및 경제적 목적에 대한 법률 전문가의 이해와 일치하지 않는 명확한 설명 없이 통제 또는 소유 구조의 비정상적인 복잡성.','대리 주주 또는 이사(nominee shareholder or director)로 활동하는 가족 또는 가까운 동료와 같은 비공식적 계약의 설명되지 않은 사용.','비즈니스 소유권 또는 거래의 성격에 대한 이해를 모호하게 하려는 고객이나, 설명할 수 없는 페이퍼 컴퍼니 및/또는 Shell company, 명의주식(nominee shareholder) 또는 무기명 주식을 통한 소유권이 있는 법인.'],0,
  '실제소유자 식별이 어려운 고객의 사례는 설명할 수 없는 페이퍼·쉘 컴퍼니, 명의주주·무기명주식을 통한 소유권, 대리 주주·이사로서의 가족·동료 활용, 비정상적으로 복잡한 통제·소유 구조 등이에요. "신분증 사본의 스캔 해상도가 낮은 경우"는 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 정치적 주요인물(PEP)에 대한 설명으로 가장 옳은 것은?',
  ['PEP는 이 가이던스에서 저위험 고객으로 분류되어, 일반 고객과 동일한 표준적 수준의 확인 절차만 거치면 충분한 것으로 서술되어 있다','PEP와 관련된 별도의 지침은 이 가이던스에 존재하지 않으며, 법률 전문가는 PEP 식별에 관해 참고할 수 있는 어떠한 안내도 제공받지 못하는 것으로 이해해야 한다','정치적 주요인물(PEP) 및 PEP와 밀접한 관련이 있거나 관련된 사람은 고위험 고객으로 간주되며, PEP를 식별하는 방법에 대한 추가 지침은 PEP에 대한 FATF 지침(2013)을 참조할 수 있다.','PEP 본인이 아닌 그 가족이나 측근은, PEP와의 관계와 무관하게 위험 평가 대상에서 완전히 제외되는 것으로 가이던스가 명시하고 있다'],2,
  '법률가를 위한 RBA 가이던스에서 PEP 및 PEP와 밀접한 관련이 있거나 관련된 사람(가족·측근 포함)은 고위험 고객으로 간주되며, PEP 식별 방법에 대한 추가 지침은 FATF의 PEP 가이던스를 참고하도록 안내하고 있어요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스 103번 문단(d)에서 언급하는 고위험 고객 회사의 특징으로 가장 옳은 것은?',
  ['자회사의 소재지는 위험평가와 무관하다.','고객 회사의 산업 운영 지역은 고려 대상이 아니다.','지리적 위험이 낮은 국가에서만 사업을 운영하는 회사가 고위험 고객으로 분류된다.','지리적 위험이 더 높은 국가에서 산업의 상당 부분을 운영하거나 주요 자회사를 두고 있는 고객 회사는 더 높은 위험을 나타낼 수 있는 고객 유형에 해당한다.'],3,
  '지리적 위험이 더 높은 국가에서 산업의 상당 부분을 운영하거나 주요 자회사를 두고 있는 고객 회사는 더 높은 위험을 나타낼 수 있는 고객 유형에 해당해요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스 103번 문단에서 위험 변수의 적용에 대한 설명으로 가장 옳은 것은?',
  ['고객 범주라는 개념은 위험평가 절차와는 직접적인 관련이 없는, 순수하게 행정적 분류를 위한 참고용 개념에 불과한 것으로 이해해야 한다','위험 변수를 적용하는 것은 최종적으로 산출되는 위험평가 결과에 어떠한 형태의 영향도 미치지 않는 형식적 절차에 불과한 것으로 이해해야 한다','고객 또는 고객 범주에 의해 제기된 잠재적 ML/TF 위험을 결정하는 것은 전반적인 위험 기반 프레임워크의 개발 및 구현에 아주 중요하며, 위험 변수를 적용하면 위험평가가 완화되거나 악화될 수 있다.','위험 기반 프레임워크를 개발·구현하는 작업은 법률 전문가가 실제로 수행하는 업무 범위와는 무관한, 감독당국만의 고유 업무로 이해해야 한다'],2,
  '법률가를 위한 RBA 가이던스 103번 문단은 고객 또는 고객 범주에 의해 제기된 잠재적 ML/TF 위험을 결정하는 것이 위험기반 프레임워크의 개발·구현에 매우 중요하며, 위험 변수를 적용하면 위험평가가 완화되거나 악화될 수 있다고 설명해요.','ultra'),
M('jd3_11',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 법률가를 위한 RBA 가이던스에서 PEP 및 관련자는 고위험 고객으로 간주된다.\nㄴ. 국가/지리적 위험에 대한 보편적으로 합의된 단일 정의는 없다.\nㄷ. 지리적 위험이 높은 국가에서 산업의 상당 부분을 운영하는 고객 회사는 오히려 저위험 유형으로 분류되어 간소화된 확인이 적용된다.\nㄹ. 위험 변수를 적용하면 위험평가가 완화되거나 악화될 수 있다.',
  ['1개.','2개.','3개.','4개.'],2,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. 지리적 위험이 높은 국가에서 산업 상당 부분을 운영하는 고객 회사는 저위험이 아니라 고위험 유형에 해당할 수 있어요(ㄷ).','ultra'),
M('jd1_2',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] C국은 UN 안전보장이사회의 별도 지정 없이도 자국법에 근거하여 테러 관련자의 자산을 동결하는 조치를 취하고 있으며, 이러한 조치가 UNSCR 1373호의 취지에 부합하는지 검토하고 있다.',
  ['UNSCR 1373호는 국가가 자체적으로 또는 타국의 요청에 따라 테러 관련자를 지정하고 국내법에 근거하여 자산을 동결할 수 있도록 하는 것을 특징으로 하므로, C국의 조치는 이 결의의 취지에 부합할 수 있다.','이 사례는 UNSCR 1373호가 아니라 오직 UNSCR 1267호와만 관련이 있는 것으로 이해해야 한다','UNSCR 1373호는 오직 UN이 직접 지정한 대상에게만 적용될 뿐이며, 각국이 자체적으로 대상을 지정하는 방식은 허용되지 않는 것으로 이해해야 한다','자국법에 근거한 자산동결은 UNSCR과는 무관한 순수 국내 조치일 뿐이며, 국제적 정밀금융제재 체계와는 관련성이 없는 것으로 이해해야 한다'],0,
  'UNSCR 1373호는 UNSCR 1267호와 달리 UN의 개별 지정 없이도 국가가 자체적으로 또는 타국의 요청에 따라 테러 관련자를 지정하고 국내법에 근거해 자산을 동결할 수 있도록 하는 것을 특징으로 해요.','ultra'),
M('jd2_8',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 직원 甲은 특정 거래가 확산자금조달로 의심되는 정황을 포착하였으나, 이를 FIU에 보고하지 않고 내부적으로만 종결하였다.',
  ['내부적으로 종결하면 어떠한 법적 문제도 발생하지 않는다.','확산자금 관련 테러자금금지법의 주요 특징에 따르면, 확산자금조달로 의심되는 금융거래는 FIU에 보고해야 하므로, 甲의 행위는 이러한 보고의무에 부합하지 않을 수 있다.','확산자금조달 의심 거래는 보고할 필요가 전혀 없다.','FIU 보고 의무는 자금세탁에만 적용되며 확산자금조달과는 무관하다.'],1,
  '확산자금 관련 테러자금금지법의 주요 특징에 따르면 확산자금조달로 의심되는 금융거래는 FIU에 보고해야 해요. 甲이 이를 내부적으로만 종결한 것은 이러한 보고의무에 부합하지 않을 수 있어요.','ultra'),
M('jd3_11',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 법률사무소 D는 신규 고객 E로부터 회사 설립 및 다수 국가에 걸친 복잡한 자산 관리 서비스를 의뢰받았다. E는 이러한 복잡한 구조를 사용하는 명백한 법적·경제적 이유를 설명하지 못하고 있다.',
  ['복잡한 자산 관리 서비스는 항상 저위험으로 간주되어야 한다.','법적·경제적 이유를 설명하지 못하는 것은 위험평가와 무관하다.','이는 법률가를 위한 RBA 가이던스에서 언급하는 실제소유자 식별이 어려운 고위험 고객의 전형적 특징에 해당할 수 있으며, 법률사무소 D는 강화된 고객확인 절차를 고려해야 한다.','이 사례는 법률가를 위한 RBA 가이던스와 관련이 없다.'],2,
  '명백한 법적·경제적 이유 없이 여러 국가에 걸친 자산 관리, 복잡한 회사 설립 등을 요청하는 것은 법률가를 위한 RBA 가이던스에서 언급하는 실제소유자 식별이 어려운 고위험 고객의 전형적 특징에 해당할 수 있어, 법률사무소는 강화된 고객확인 절차를 고려해야 해요.','ultra'),
M('jd3_11',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 법률가를 위한 RBA 가이던스는 설명할 수 없는 페이퍼·쉘 컴퍼니를 통한 소유권을 고위험 요소로 언급한다.\nㄴ. 대리 주주·이사로 가족·동료를 활용하는 비공식적 계약의 설명되지 않은 사용도 고위험 요소이다.\nㄷ. 통제·소유 구조의 비정상적인 복잡성으로서 명확한 설명이 없는 경우도 고위험 요소에 해당한다.',
  ['2개만 옳음.','1개만 옳음.','모두 틀림.','3개 모두 옳음.'],3,
  'ㄱ~ㄷ 모두 옳은 설명이에요. 법률가를 위한 RBA 가이던스가 제시하는 실제소유자 식별이 어려운 고위험 고객의 구체적 사례들을 정확히 기억해야 풀리는 문제예요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 위험평가의 근본 목적에 대한 설명으로 가장 옳은 것은?',
  ['고객 또는 고객 범주에 의해 제기된 잠재적 ML/TF 위험을 결정하는 것은 전반적인 위험기반 프레임워크의 개발 및 구현에 필수적이며, 법률회사와 법률 전문가는 자체 기준에 따라 특정 고객이 더 높은 위험을 제기하는지 여부를 결정해야 한다.','위험기반 프레임워크는 각 법률회사가 처한 개별적 상황이나 고객 특성과는 무관하게, 정부가 모든 법률회사에 일괄적으로 동일하게 적용되는 기준을 하향식으로 결정하여 부과하는 방식으로 운영된다','법률 전문가가 상대하는 모든 고객은 실제로 제기하는 ML/TF 위험 수준의 높고 낮음과는 무관하게, 예외 없이 완전히 동일한 절차와 통제 수준을 적용받아야 하는 것으로 이해된다','위험평가라는 작업은 법률 전문가가 실제로 수행하는 법률 자문 업무와는 직접적인 관련이 없는, 단순한 행정상의 형식적 절차에 불과한 것으로 취급되고 있다'],0,
  '고객·고객 범주에 의해 제기된 잠재적 ML/TF 위험을 결정하는 것은 위험기반 프레임워크의 개발·구현에 필수적이며, 법률회사와 법률 전문가는 자체 기준에 따라 특정 고객의 위험 수준을 판단해야 해요.','ultra'),
M('jd4_12',
  'FATF 권고사항 8(R.8, 비영리단체 NPO)의 정의에 대한 설명으로 가장 옳은 것은?',
  ['각국은 FATF의 비영리단체(NPO) 정의에 해당하는 조직을 식별하고 이들의 테러자금조달 위험을 평가해야 하며, 위험기반접근법(RBA)에 맞춰 합법적인 NPO 활동을 과도하게 방해하거나 억제하지 않으면서 집중적이고 비례적인 위험기반 조치를 취해야 한다','NPO는 그 설립 목적의 공익적 성격으로 인해, 자금세탁방지 관련 국제기준의 적용 대상에서 전면적으로 제외되는 특수한 유형의 조직으로 취급되는 것으로 알려져 있다','FATF의 NPO 정의에 해당하는 것으로 분류된 모든 비영리단체는, 예외 없이 자동으로 고위험 단체로 지정되어 강화된 고객확인 대상이 되는 것으로 이해해야 한다','NPO와 관련하여 각국이 취할 수 있는 구체적인 조치의 내용에 대해서는, 개별 국가의 재량이 전혀 인정되지 않고 모든 국가에 획일적으로 적용되는 국제 규범으로 정해져 있다'],0,
  '각국은 FATF의 NPO 정의에 해당하는 조직을 식별하고 테러자금조달 위험을 평가해야 하며, 위험기반접근법(RBA)에 맞춰 합법적인 NPO 활동을 과도하게 방해·억제하지 않으면서 집중적이고 비례적인 위험기반 조치를 취해야 해요.','ultra'),
M('jd4_12',
  'FATF 권고사항 8의 조치 목적(합법적 단체로 위장한 테러리스트 조직으로부터 NPO를 보호)에 해당하지 않는 것은?',
  ['테러조직이 합법적 단체로 가장(假裝)하는 것','자산동결조치를 회피하는 목적 등을 포함하여 합법적인 단체를 테러자금조달의 통로로 이용하는 것','합법적 목적의 자금을 테러조직으로 전용하는 것을 은폐하는 것','NPO가 정부 보조금을 신청하는 행정 절차를 간소화하는 것'],3,
  'R.8의 조치 목적은 (a)테러조직이 합법적 단체로 가장 (b)자산동결 회피 목적 등으로 합법적 단체를 테러자금조달 통로로 이용 (c)합법적 목적 자금의 테러조직 전용을 은폐하는 것으로부터 NPO를 보호하는 것이에요. "NPO의 정부 보조금 신청 행정절차 간소화"는 이에 해당하지 않아요.','ultra'),
M('jd4_12',
  'FATF의 R.8 NPO 주석서에서 제시하는, 각국이 NPO의 ML/TF 위험 예방 및 악용 방지를 위해 취해야 할 4가지 방법에 해당하지 않는 것은?',
  ['NPO에 대한 교육 및 지원(outreach)','NPO에 대한 관리감독(supervision)','NPO에 대한 효과적인 조사 및 정보수집(investigation)','NPO에 대한 법인세 감면 확대(tax exemption expansion)'],3,
  '4가지 방법은 ①NPO에 대한 교육 및 지원(outreach) ②관리감독(supervision) ③효과적인 조사 및 정보수집(investigation) ④국제적 협력체계 수립(international cooperation)이에요. "법인세 감면 확대"는 이에 해당하지 않아요.','ultra'),
M('jd4_12',
  '2023년 11월 FATF의 NPO 관련 권고사항 및 주석서 개정에 대한 설명으로 가장 옳은 것은?',
  ['2023년 11월 FATF는 NPO에 대하여 집중적이고 비례적이며 위험에 기반한 조치가 NPO에 대한 TF(테러자금 지원) 남용을 식별, 예방 및 퇴치하는 효과적인 접근방식의 핵심임을 강조하며 권고사항과 주석서를 개정하였다','2023년 11월 개정을 통해, 모든 NPO에 대해 감독당국이 반드시 실사를 수행해야 하는 새로운 의무가 신설된 것으로 이해해야 한다','2023년 11월에 이루어진 개정은, NPO와 관련하여 실질적인 내용상의 변화를 전혀 수반하지 않은 순전히 형식적인 차원의 개정에 불과한 것으로 이해해야 한다','2023년 11월 개정으로 인해, 기존의 R.8은 완전히 폐지되고 이를 대체하는 전혀 새로운 권고사항이 도입된 것으로 이해해야 한다'],0,
  '2023년 11월 FATF는 NPO에 대한 집중적·비례적·위험기반 조치가 TF 남용 식별·예방·퇴치의 핵심임을 강조하며 R.8 권고사항과 주석서를 개정했어요.','ultra'),
M('jd4_12',
  '개정된 R.8의 "정기적인 NPO 식별 및 NPO의 TF 위험평가"에 대한 설명으로 가장 옳은 것은?',
  ['R.8은 비영리 영역에서 활동하는 단체 전체에 적용되는 것이 아니라 FATF의 NPO 정의에 해당하는 단체에만 적용되며, 적용되는 비영리단체 중 극히 일부만이 TF 남용에 따른 "고위험"에 해당할 수 있다고 정의하고 있다','R.8은 예외를 전혀 두지 않고, 비영리 영역에서 활동하는 모든 단체 전체에 대해 아무런 구분 없이 획일적으로 적용되도록 정하고 있는 것으로 이해된다','R.8이 적용되는 대상으로 분류된 비영리단체는, 그 전부가 예외 없이 자동으로 테러자금조달 관련 고위험 단체로 간주되어 강화된 규제를 받게 되는 것으로 알려져 있다','해당 단체가 FATF가 정의하는 NPO 개념에 실제로 해당하는지 여부는, R.8의 적용 범위를 판단하는 과정에서 특별히 고려할 필요가 없는 무관한 요소로 취급된다'],0,
  'R.8은 비영리 영역에서 활동하는 단체 전체가 아니라 FATF의 NPO 정의에 해당하는 단체에만 적용되며, 그 중에서도 극히 일부만이 TF 남용에 따른 "고위험"에 해당할 수 있다고 정의해요.','ultra'),
M('jd4_12',
  'NPO에 대한 집중적이고 비례적인 RBA 적용에 대한 설명으로 가장 옳은 것은?',
  ['NPO 부문의 다양성과 TF 남용의 위험 정도가 다양하다는 점을 고려할 때 위험기반접근법(RBA)의 적용은 필수적이며, 다수의 NPO는 이미 TF 위험을 완화하기 위한 적절한 자체 규제조치 및 관련 내부통제 체계를 갖추고 있는 경우도 있으므로 권한당국의 추가 조치가 필요하지 않을 수 있다','NPO 부문의 위험 수준과 무관하게 모든 NPO에 대해 동일한 강도의 규제를 획일적으로 적용하는 것이 위험기반접근법(RBA)의 본래 취지이자 핵심 원칙이다','NPO는 그 조직 특성상 자체 규제조치나 내부통제 체계를 전혀 갖출 수 없는 조직 유형으로 간주되므로, 모든 통제 부담은 전적으로 권한당국이 부담해야 한다','권한당국의 추가적인 감독 조치는 개별 NPO가 이미 갖추고 있는 자체 통제체계의 수준이나 TF 위험 완화 정도와는 무관하게 일률적으로 항상 필요한 것으로 간주된다'],0,
  'NPO 부문의 다양성과 TF 남용 위험 정도의 다양성을 고려하면 RBA 적용이 필수적이며, 다수의 NPO는 이미 적절한 자체 규제조치·내부통제 체계를 갖추고 있어 권한당국의 추가 조치가 불필요할 수 있어요.','ultra'),
M('jd4_12',
  'NPO에 대한 합법적 활동의 보호에 대한 설명으로 가장 옳은 것은?',
  ['각 국가의 감독당국은 합법적인 NPO 활동에 대한 국가 조치가 미치는 잠재적 영향을 고려해야 하는데, NPO에 대한 과도한 규제는 NPO의 합법적인 활동 및 필요한 서비스 제공을 저해하여 경제적 권리와 기타 인권에 영향을 미칠 수 있기 때문이다','NPO에 대한 규제는 그 강도가 강력할수록 무조건적으로 바람직한 것으로 평가되며, 규제를 과도하게 적용함으로써 발생할 수 있는 부작용은 애초에 고려할 필요가 없는 요소로 취급해야 한다','합법적인 NPO 활동을 보호해야 한다는 문제의식은, R.8이 각국에 요구하는 고려사항의 범위에 아예 포함되어 있지 않은 것으로 이해해야 한다','국가가 NPO에 대해 취하는 각종 조치는, 인권이나 경제적 권리와 같은 가치와는 전혀 연관성이 없는 별개의 독립적인 행정 영역으로 다루어지는 것으로 이해해야 한다'],0,
  '감독당국은 합법적 NPO 활동에 대한 국가 조치의 잠재적 영향을 고려해야 해요. NPO에 대한 과도한 규제는 합법적 활동과 필요한 서비스 제공을 저해하여 경제적 권리와 기타 인권에 영향을 미칠 수 있기 때문이에요.','ultra'),
M('jd4_12',
  'FATF의 개정 권고사항 8과 NPO의 보고주체 지정 여부에 대한 설명으로 가장 옳은 것은?',
  ['FATF의 개정 권고사항 8은 각국의 NPO에 대한 감독 또는 모니터링을 요구하고 있지만, NPO를 보고주체로 지정하여 고객 실사를 수행하도록 요구하거나 감독할 필요는 없음을 명시하고 있다','NPO는 R.8에 따라 반드시 금융회사와 동일한 수준의 고객확인의무(CDD) 보고주체로 지정되어야 하는 것으로 이해해야 한다','R.8은 NPO에 대한 어떠한 형태의 감독이나 모니터링도 요구하지 않는, 순전히 권고적 성격에 그치는 규정으로 이해해야 한다','NPO를 보고주체로 지정할 것인지 여부는 각국이 아니라 FATF가 개별 국가마다 직접 결정하는 사항으로 이해해야 한다'],0,
  'FATF 개정 권고사항 8은 각국의 NPO에 대한 감독·모니터링을 요구하지만, NPO를 금융회사와 동일한 보고주체로 지정해 고객확인의무를 부과할 것까지 요구하지는 않아요.','ultra'),
M('jd4_13',
  '우리나라 금융정보분석원(FIU) 설립 연혁에 대한 설명으로 가장 옳은 것은?',
  ['FATF가 각국에 대한 FIU 설립 의무는 제3차 라운드 상호평가(2004년~2013년)에서 반영되었으며, 우리나라는 특정금융정보법과 공중협박자금조달금지법을 제정한 2001년에 FIU(2001년 11월 28일)도 함께 설립하여 현재에 이르고 있다','우리나라의 FIU는 특정금융정보법이 제정된 시점보다 약 10년 앞선 1991년에 이미 독자적으로 최초 설립되어, 이후 관련 법률 제정과는 별개로 운영되어 온 것으로 알려져 있다','FATF가 회원국들에 대해 FIU 설립을 의무화한 것은, 제3차 라운드가 아니라 그보다 훨씬 이른 시기인 제1차 라운드 상호평가에서 최초로 반영된 사항인 것으로 알려져 있다','우리나라의 FIU는 현재까지도 정식으로 설립되지 못하고, 여전히 설립을 위한 준비 단계에 머물러 있는 상태인 것으로 이해해야 한다'],0,
  'FATF의 FIU 설립 의무는 제3차 라운드 상호평가(2004~2013년)에서 반영되었으며, 우리나라는 특정금융정보법·공중협박자금조달금지법을 제정한 2001년에 FIU(2001년 11월 28일)를 함께 설립했어요.','ultra'),
M('jd4_13',
  'FIU의 기능 및 역할에 대한 설명으로 가장 옳은 것은?',
  ['FIU는 특히 국경을 넘는 테러 네트워크의 재정 운영을 식별하고 그들의 재정적 후원자를 알아내는 데 중요한 역할을 하며, 테러범죄와 네트워크 그리고 테러조직의 계획을 밝히는 데 매우 중요하다','FIU는 오직 국내에서 발생하는 자금세탁 사건만을 다룰 뿐이며, 테러자금조달이나 국경을 넘는 사안과는 관련이 없는 것으로 이해해야 한다','FIU의 기능과 역할은 국제기준에 따라 모든 회원국에서 완전히 동일하게 표준화되어 있어, 국가 간 편차가 전혀 존재하지 않는 것으로 이해해야 한다','FIU는 재정적 후원자를 식별하는 업무와는 무관한, 순수하게 통계 자료만을 작성하는 기관으로 이해해야 한다'],0,
  'FIU는 국경을 넘는 테러 네트워크의 재정 운영을 식별하고 재정적 후원자를 파악하는 데 중요한 역할을 하며, 테러범죄·네트워크·자금조달 간의 연결고리를 밝히는 데 기여해요.','ultra'),
M('jd4_13',
  '각국 FIU 간 기능·역량·권한의 차이에 대한 설명으로 가장 옳은 것은?',
  ['국제기준 규범의 부족으로 회원국들의 FIU는 그 기능, 역량 및 권한과 관련해 현저한 차이를 유지하고 있으며, 각국은 가상화폐 오용 등을 포함하여 테러와 관련된 금융조사를 다루기 위해 보다 효율적이고 조직화된 접근방식 보장을 위해 노력해야 한다','국제기준에 따라 모든 회원국의 FIU는 그 기능, 역량 및 권한에 있어 완전히 동일한 수준으로 통일되어 운영되고 있는 것으로 알려져 있어 국가 간 편차가 존재하지 않는다','가상화폐가 자금세탁이나 테러자금조달에 오용되는 문제는, FIU가 다루어야 할 업무 범위와는 전혀 관련이 없는 무관한 사안으로 취급되는 것으로 이해해야 한다','각국 FIU 간에 존재하는 기능·역량의 차이는, FIU가 실제로 수행하는 활동이나 역량 발휘에 있어서는 어떠한 형태로도 영향을 미치지 않아야 하는 것으로 이해된다'],0,
  '국제기준 규범 부족으로 각국 FIU는 기능·역량·권한에 현저한 차이가 있으며, 각국은 가상화폐 오용 등을 포함한 테러 관련 금융조사를 위해 보다 효율적·조직화된 접근방식을 보장하도록 노력해야 해요.','ultra'),
M('jd4_13',
  'FIU의 업무 수행 시 정보 접근 및 법집행기관과의 협력에 대한 설명으로 가장 옳은 것은?',
  ['업무 수행 시 FIU는 정보에 접근할 수 있어야 하며 법집행기관과의 적절한 협력을 통해 지연 없이 정보를 교환할 수 있어야 하고, 범죄가 의심되는 모든 경우 특히 테러자금과 관련된 경우 정보는 과도한 지체 없이 직접적이고 신속하게 전달되어야 한다','FIU는 법집행기관과 정보를 교환하거나 협력하는 관계를 전혀 맺지 않으며, 다른 어떠한 기관과도 연계 없이 완전히 독립적으로 운영되는 폐쇄적 기관으로 알려져 있다','정보가 얼마나 신속하게 전달되는지 여부는, 테러자금과 관련된 사안에서는 오히려 부차적인 문제로 취급되어 그 중요성이 상대적으로 낮게 평가되는 것으로 이해된다','FIU가 보유한 정보 접근권은 오직 일반 형사범죄 사건에만 한정되어 적용될 뿐, 테러자금 관련 사안에 대해서는 이러한 접근권이 인정되지 않는 것으로 알려져 있다'],0,
  'FIU는 정보에 접근할 수 있어야 하며 법집행기관과 적절히 협력해 지연 없이 정보를 교환해야 해요. 범죄가 의심되는 모든 경우, 특히 테러자금 관련 경우 정보는 과도한 지체 없이 직접적·신속하게 전달되어야 해요.','ultra'),
M('jd4_13',
  'FATF R.29(FIU)의 본문에 대한 설명으로 가장 옳은 것은?',
  ['각국은 (a) 의심스러운 거래보고와 (b) 자금세탁 및 관련 전제범죄와 테러자금조달과 관련된 기타 정보의 수집·분석 그리고 분석된 정보의 제공을 담당하는 중앙행정기관(national centre)으로 FIU를 설립하여야 하며, FIU는 보고기관(reporting entities)으로부터 추가 정보를 취득할 수 있어야 한다','FIU는 의심스러운 거래보고(STR)만을 전담하여 처리할 뿐, CTR·전신송금 정보 등 자금세탁·테러자금조달 관련 그 밖의 정보는 FIU의 업무 범위에서 제외되는 것으로 이해해야 한다','FIU는 보고기관으로부터 이미 제출된 정보 외에 추가 정보를 취득할 권한을 전혀 갖고 있지 않아, 필요 시에도 보고기관에 추가 자료를 요청할 수 없는 것으로 이해해야 한다','R.29에 따르면 FIU는 중앙행정기관이 아니라 각국의 지방자치단체 산하 조직으로 설치되어야 한다는 것이 국제기준의 요구사항인 것으로 이해해야 한다'],0,
  'R.29에 따르면 각국은 (a) 의심스러운 거래보고와 (b) 자금세탁·전제범죄·테러자금조달 관련 기타 정보의 수집·분석 및 분석된 정보의 제공을 담당하는 중앙행정기관으로서 FIU를 설립해야 해요. STR만 전담하는 것이 아니라 다양한 정보를 다루며, 필요시 추가 정보도 요청할 수 있어요.','ultra'),
M('jd4_13',
  'FATF R.29 주석서 29.2항에서 FIU가 보고기관으로부터 보고받는 정보로 규정하는 것에 해당하지 않는 것은?',
  ['R.20, R.23에서 규정한 의심거래보고','국내법에 규정된 기타 정보(고액현금거래보고, 전신송금보고, 기타 금액 기준 신고·공개 등)','보고기관 임직원의 개인 신용카드 사용 명세','위 선택지 중 R.29 주석서가 규정하는 정보에 해당하는 것은 없다'],2,
  'R.29 주석서 29.2항은 FIU가 보고기관으로부터 (a)R.20·R.23의 의심거래보고 (b)국내법상 기타 정보(고액현금거래보고, 전신송금보고, 기타 금액 기준 신고·공개 등)를 보고받는 중앙기관 역할을 한다고 규정해요. "보고기관 임직원의 개인 신용카드 사용 명세"는 이에 해당하지 않아요.','ultra'),
M('jd4_13',
  'FATF R.29 주석서 29.3항에 대한 설명으로 가장 옳은 것은?',
  ['FIU는 보고기관들이 FIU에 보고하는 정보 이외에도 FIU의 필요에 따라 추가적인 정보를 보고기관으로부터 취득·사용할 수 있어야 하며, FIU의 업무를 적절히 수행하기 위해 필요한 금융·행정 및 법집행 관련 정보에 최대한 폭넓게 접근할 수 있어야 한다','FIU는 보고기관이 자발적인 판단에 따라 제공하는 정보만을 수동적으로 받아들일 수 있을 뿐, 이를 넘어서는 추가적인 정보를 별도로 요청할 권한은 갖고 있지 않은 것으로 이해해야 한다','FIU가 접근할 수 있는 정보의 범위는 오로지 금융 관련 정보로만 한정되어 있으며, 행정이나 법집행과 관련된 정보에는 접근할 수 없는 것으로 이해해야 한다','FIU가 접근할 수 있는 정보의 구체적인 범위는, FIU 자체가 아니라 각 보고기관이 개별적인 판단에 따라 임의로 결정하는 것으로 이해해야 한다'],0,
  '29.3항에 따르면 FIU는 보고기관이 보고하는 정보 외에도 필요에 따라 추가 정보를 보고기관으로부터 취득·사용할 수 있어야 하고, 업무 수행에 필요한 금융·행정·법집행 관련 정보에 최대한 폭넓게 접근할 수 있어야 해요.','ultra'),
M('jd4_13',
  'FATF R.29 주석서 29.4항(a)에서 규정하는 FIU의 업무(기초분석)에 대한 설명으로 가장 옳은 것은?',
  ['FIU는 기초분석을 통해 활용·취득 가능한 정보를 이용하여 특정 대상을 식별하고, 특별한 활동 또는 거래를 추적하며, 대상과 범죄(자금세탁·전제범죄 또는 테러자금조달) 범죄수익 간의 관계를 결정하는 업무를 수행한다','FIU의 기초분석 업무는 특정 대상 식별이나 거래 추적과는 무관하게, 단순 통계 작성에만 한정되는 것으로 이해해야 한다','FIU는 범죄수익과 대상 간의 관계를 결정할 권한이 전혀 없으며, 이는 오로지 사법기관만이 수행할 수 있는 업무로 이해해야 한다','기초분석은 FIU가 아니라 보고기관이 직접 수행해야 하는 업무로, FIU는 이 과정에 관여하지 않는 것으로 이해해야 한다'],0,
  'FIU는 기초분석을 통해 활용·취득 가능한 정보를 이용해 특정 대상을 식별하고 특별한 활동·거래를 추적하며, 대상과 범죄(자금세탁·전제범죄 또는 테러자금조달) 간의 관계를 결정해요.','ultra'),
M('jd4_13',
  '우리나라 금융정보분석원(KoFIU)에 대한 설명으로 가장 옳은 것은?',
  ['금융정보분석원은 금융위원회, 법무부, 행정안전부, 국세청, 관세청, 경찰청, 선거관리위원회, 대법원 등 관계기관의 전문인력으로 구성되어 운영되고 있으며, 금융회사등으로부터 ML/TF 거래를 수집·분석하여 불법거래·ML/TF와 연관된다고 판단되는 금융거래를 법집행기관에 제공하는 업무를 수행하고 있다','금융정보분석원은 금융위원회 소속 공무원만으로 단일하게 구성된 조직으로, 법무부·행정안전부·국세청 등 다른 관계기관의 전문인력이 파견되어 합류하는 구조가 아닌 것으로 이해해야 한다','금융정보분석원은 금융회사등으로부터 어떠한 형태의 거래정보나 보고자료도 수집하지 않으며, 순수하게 자금세탁방지 정책만을 연구하는 정책 연구 기관으로 이해해야 한다','금융정보분석원은 분석한 정보를 법집행기관에 제공할 법적 권한을 보유하고 있지 않아, 수집한 정보를 오로지 내부적으로만 활용할 수 있는 것으로 이해해야 한다'],0,
  '금융정보분석원은 금융위원회·법무부·행정안전부·국세청·관세청·경찰청·선거관리위원회·대법원 등 관계기관의 전문인력으로 구성되어 운영되며, 금융회사등으로부터 보고받은 정보를 분석해 법집행기관에 제공할 권한을 가져요.','ultra'),
M('jd4_13',
  'FIU의 업무에 해당하지 않는 것은?',
  ['AML/CFT 정책수립 및 법령 개정(특정금융정보법), 접수·분석업무(금융회사등의 CTR/STR 심사분석)','감독 및 검사업무(금융회사등에 대한 감독 및 검사), 대외협력업무(외국 FIU 및 국제기구 등과의 협력)','전산시스템 구축 및 보안업무(특정금융거래정보의 효율적인 관리·운영), 기타 협의회 운영','금융회사등에 대한 대출 심사 및 여신 승인 업무'],3,
  'FIU의 업무는 AML/CFT 정책수립·법령개정, CTR/STR 접수·분석, 금융회사등에 대한 감독·검사, 외국 FIU·국제기구와의 대외협력, 전산시스템 구축·보안, 관련 협의회 운영 등이에요. "금융회사등에 대한 대출 심사 및 여신 승인 업무"는 FIU의 업무가 아니에요.','ultra'),
M('jd4_13',
  '특정금융정보법 제3조(금융정보분석원) 제1항에 따라 금융정보분석원이 수행하는 업무에 해당하지 않는 것은?',
  ['제4조·제4조의2 및 제9조에 따라 보고받거나 통보받은 사항의 정리·분석 및 제공','제4조·제4조의2·제5조·제5조의2·제5조의3·제5조의4 및 제8조에 따라 금융회사등이 수행하는 업무에 대한 감독 및 검사','제7조에 따른 가상자산사업자의 신고에 관한 업무','금융회사등의 여신 포트폴리오에 대한 신용평가 등급 산정 업무'],3,
  '제3조 제1항은 보고·통보 사항의 정리·분석·제공, 금융회사등 업무에 대한 감독·검사, 외국금융정보분석기구와의 협조·정보교환, 가상자산사업자 신고 업무, 외국금융감독검사기관과의 협조·정보교환, 테러자금금지법에 따른 업무 등을 규정해요. "금융회사등의 여신 포트폴리오 신용평가 등급 산정 업무"는 이에 해당하지 않아요.','ultra'),
M('jd4_13',
  '특정금융정보법 제3조 제1항에 따라 금융위원회 소속으로 두는 금융정보분석원에 대한 설명으로 가장 옳은 것은?',
  ['금융정보분석원은 각 호의 업무를 효율적으로 수행하기 위하여 금융위원회 소속으로 두며, 제15조의2에 따른 외국 금융감독·검사기관과의 협조 및 정보교환 업무와 공중 등 협박목적 및 대량살상무기확산을 위한 자금조달행위의 금지에 관한 법률에 따른 업무도 수행한다','금융정보분석원은 법무부 소속으로 설치되는 독립 기구로서, 금융위원회와는 조직상 아무런 소속 관계를 갖지 않는 것으로 특정금융정보법이 규정하고 있다','금융정보분석원은 어떠한 정부 부처에도 소속되지 않은 대통령 직속 기구로 설치되어, 정부 부처의 통상적인 지휘 체계와는 별도로 독립적으로 운영되는 것으로 알려져 있다','금융정보분석원은 특정한 법률적 근거 없이, 단순히 행정 관행이나 내부 지침에 따라 임의로 설치·운영되고 있는 조직에 불과한 것으로 이해해야 한다'],0,
  '금융정보분석원은 특정금융정보법 제3조 제1항에 따라 금융위원회 소속으로 두며, 외국 금융감독·검사기관과의 협조·정보교환(제15조의2) 및 테러자금금지법에 따른 업무도 수행해요.','ultra'),
M('jd4_13',
  '특정금융정보법 제3조 제2항 및 제3항에 대한 설명으로 가장 옳은 것은?',
  ['금융정보분석원은 그 권한에 속하는 사무를 독립적으로 수행하며, 그 소속 공무원은 이 법과 테러자금금지법에 따른 업무 외에 다른 업무에 종사하지 못하고, 금융정보분석원의 정원·조직 및 운영 등에 필요한 사항은 업무의 독립성·정치적 중립성 등을 고려하여 대통령령으로 정한다','금융정보분석원 소속 공무원은 특정금융정보법과 테러자금금지법에 따른 업무 외에도, 다른 정부 부처의 업무를 자유롭게 겸직하며 병행하여 수행할 수 있는 것으로 규정되어 있다','금융정보분석원의 정원, 조직 및 운영에 필요한 사항은 대통령령이 아니라, 오직 국회가 개별적인 법률을 별도로 제정하는 방식을 통해서만 정할 수 있도록 규정되어 있다','금융정보분석원이 사무를 수행함에 있어서는 독립성이 특별히 요구되지 않으며, 오히려 관계기관들의 직접적인 지휘와 통제를 받아야 하는 것으로 특정금융정보법이 정하고 있다'],0,
  '금융정보분석원은 권한에 속하는 사무를 독립적으로 수행하고, 소속 공무원은 이 법과 테러자금금지법에 따른 업무 외 다른 업무에 종사할 수 없어요. 정원·조직·운영에 필요한 사항은 업무의 독립성·정치적 중립성 등을 고려해 대통령령으로 정해요.','ultra'),
M('jd4_14',
  '특정금융정보법상 감독·검사·제재의 법적 근거에 대한 설명으로 가장 옳은 것은?',
  ['특정금융정보법에서는 금융회사등에 대하여 AML/CFT 의무를 부과하고 있으며, 동법과 동법 시행령 관련 조항 및 행정규칙에 해당하는 특정 금융거래정보 보고 및 감독규정, 자금세탁방지 및 공중협박자금조달금지에 관한 업무규정, 검사 및 제재규정 등을 법적근거로 금융회사등에 대한 감독 및 검사, 제재를 시행하고 있다','금융회사등에 대한 감독·검사·제재는 법령상 근거 없이, 각 검사수탁기관의 내부 관행에 따라 임의로 이루어지며 특정금융정보법에는 이에 관한 규정이 존재하지 않는 것으로 이해해야 한다','특정금융정보법은 금융회사등에 대해 AML/CFT 관련 보고의무만을 규정할 뿐, 이를 이행하지 않을 경우의 감독·검사·제재에 관한 근거 규정은 전혀 두고 있지 않은 것으로 이해해야 한다','감독규정·업무규정·검사 및 제재규정은 특정금융정보법과는 별개로, 국회에서 독자적으로 제정한 법률로서 특정금융정보법의 하위 행정규칙에는 해당하지 않는 것으로 이해해야 한다'],0,
  '특정금융정보법은 금융회사등에 AML/CFT 의무를 부과하며, 동법·시행령 관련 조항 및 행정규칙(특정 금융거래정보 보고 및 감독규정, 업무규정, 검사 및 제재규정 등)을 법적근거로 감독·검사·제재를 시행해요.','ultra'),
M('jd4_14',
  'FIU의 감독·검사 방식에 대한 설명으로 가장 옳은 것은?',
  ['FIU는 가상자산과 카지노 업권에 대해서는 직접 검사를 실시하고 있고, 감독·검사의 효율화를 위하여 금감원 등 11개 검사수탁기관을 통하여 은행, 증권, 보험, 전자금융, 대부, 상호금융업계 등에 대해 검사를 실시하고 있다','FIU는 은행·증권·보험 등을 포함한 모든 금융업권에 대해 예외 없이 오직 직접 검사의 방식만을 통해 감독·검사를 실시하는 것으로 알려져 있다','FIU는 감독·검사라는 업무 자체를 전혀 수행하지 않으며, 이와 관련된 모든 권한과 역할을 전적으로 다른 기관에 위임하여 운영하는 것으로 이해해야 한다','가상자산과 카지노 업권은 오히려 FIU의 검사 대상 범위에서 완전히 제외되어, 어떠한 형태의 감독이나 검사도 받지 않는 사각지대로 남아 있는 것으로 알려져 있다'],0,
  'FIU는 가상자산·카지노 업권에 대해서는 직접 검사를 실시하고, 감독·검사 효율화를 위해 금감원 등 11개 검사수탁기관을 통해 은행·증권·보험·전자금융·대부·상호금융업계 등에 대해 검사를 실시해요.','ultra'),
M('jd4_14',
  'FIU의 검사수탁기관 체계에 대한 설명으로 가장 옳은 것은?',
  ['FIU는 감독·검사의 총괄기관으로서 행안부, 과기정통부, 중기부, 관세청, 금감원, 농협·수협·신협·산림조합, 새마을금고, 제주도청 등 11개 기관에 검사권한을 위탁 또는 병행위탁하고 있으며, 검사수탁기관은 대상 기관에 대한 검사 및 조치를 하고 그 결과를 FIU에 통보한다','검사수탁기관은 FIU로부터 위탁받은 검사권한을 행사하면서도 FIU와는 완전히 독립적으로 활동하며, 검사 결과나 조치사항을 FIU에 통보할 법적 의무는 부담하지 않는다','검사수탁기관을 통한 위탁 검사 제도는 은행업권에만 적용되는 제도이며, 증권·보험·전자금융 등 다른 업권에 대한 검사는 이러한 위탁 체계와는 무관하게 이루어진다','FIU는 검사권한을 어떠한 외부 기관에도 위탁하지 않고, 가상자산·카지노를 포함한 모든 업권에 대한 검사를 예외 없이 FIU가 직접 수행하는 체계로 운영되고 있다'],0,
  'FIU는 감독·검사 총괄기관으로서 행안부·과기정통부·중기부·관세청·금감원·농협/수협/신협/산림조합·새마을금고·제주도청 등 11개 검사수탁기관에 검사권한을 위탁 또는 병행위탁하며, 수탁기관은 검사·조치 후 결과를 FIU에 통보해요.','ultra'),
M('jd4_14',
  '검사수탁기관별 검사 대상 금융회사 연결로 옳지 않은 것은?',
  ['과학기술정보통신부 - 우체국','중소벤처기업부 - 벤처투자회사, 벤처투자조합','관세청 - 환전업자','금융감독원 - 제주 카지노사업자'],3,
  '검사수탁기관별 대상은 과기정통부-우체국, 중기부-벤처투자회사·벤처투자조합, 행안부-새마을금고중앙회, 관세청-환전업자, 제주도청-제주카지노사업자, 금감원-은행·증권·보험 등이에요. "금융감독원-제주 카지노사업자"는 옳지 않으며, 제주 카지노사업자는 제주도청의 검사 대상이에요.','ultra'),
M('jd4_14',
  '행정안전부가 검사수탁기관으로서 검사 대상으로 하는 금융회사에 해당하는 것은?',
  ['새마을금고중앙회','벤처투자회사','우체국','환전업자'],0,
  '행정안전부는 검사수탁기관으로서 새마을금고중앙회를 검사 대상으로 해요. 벤처투자회사는 중기부, 우체국은 과기정통부, 환전업자는 관세청이 각각 검사수탁기관으로서 담당해요.','ultra'),
M('jd4_14',
  'FIU의 검사 절차 중 "연간검사계획 수립" 및 "분기검사계획"에 대한 설명으로 가장 옳은 것은?',
  ['FIU원장은 매년 연간 감독·검사 정책방향 등을 정하여 검사수탁기관의 장에게 통보하며, 검사수탁기관의 장은 분기별로 이전 직전분기 검사실적, 검사대상 금융회사등에 대한 검사결과·조치사항 및 다음분기 검사계획을 FIU원장에게 통보하여야 한다','연간검사계획은 FIU원장이 아니라 각 검사수탁기관이 독자적인 판단에 따라 수립하며, 이를 FIU원장에게 별도로 통보할 법적 의무는 부담하지 않는 것으로 알려져 있다','분기검사계획은 매 분기가 아니라 5년에 한 번씩만 수립하면 충분한 것으로 감독규정이 정하고 있어, 상대적으로 낮은 빈도로 이루어지는 것으로 이해된다','검사수탁기관은 자신이 실시한 검사의 실적이나 조치사항에 대해 FIU원장에게 통보할 법적 의무를 전혀 부담하지 않는 것으로 감독규정이 정하고 있다'],0,
  'FIU원장은 매년 연간 감독·검사 정책방향을 정해 검사수탁기관의 장에게 통보하고, 검사수탁기관의 장은 분기별로 직전분기 검사실적·검사결과·조치사항 및 다음분기 검사계획을 FIU원장에게 통보해야 해요.','ultra'),
M('jd4_14',
  '검사를 받는 금융회사등의 임직원의 권리에 대한 설명으로 가장 옳은 것은?',
  ['검사를 받는 금융회사등의 임직원은 문답서 및 확인서 작성 시 변호사 또는 전문지식을 갖춘 조력자의 도움을 받을 수 있다','검사를 받는 임직원은 어떠한 경우에도 변호사의 조력을 받을 수 없다','조력자의 도움을 받는 것은 검사 결과에 부정적인 영향을 미치므로 권장되지 않는다','문답서 작성은 조력자 없이 반드시 단독으로 진행해야 한다'],0,
  '검사를 받는 금융회사등의 임직원은 문답서 및 확인서 작성 시 변호사 또는 전문지식을 갖춘 조력자의 도움을 받을 권리가 있어요.','ultra'),
M('jd4_14',
  'FIU 검사 절차 중 "검사"에 대한 설명으로 가장 옳은 것은?',
  ['효율적인 감독·검사를 위하여 금융회사등의 관계자에 대한 출석, 진술요구, 금융거래 기록 등의 관련 자료 제출 요구를 할 수 있다','검사 과정에서는 어떠한 자료 제출 요구도 할 수 없으며 자발적 제공만 가능하다','관계자에 대한 출석 요구는 검사 절차에 포함되지 않는다','금융거래 기록에 대한 자료 제출 요구는 법적 근거가 없는 임의 절차이다'],0,
  '효율적인 감독·검사를 위해 금융회사등의 관계자에 대한 출석·진술요구, 금융거래 기록 등 관련 자료 제출 요구를 할 수 있어요.','ultra'),
M('jd4_14',
  '검사결과의 통보 및 검사 후 시정조치에 대한 설명으로 가장 옳은 것은?',
  ['검사기관 및 검사수탁기관의 장은 금융회사등에 대하여 검사를 실시한 경우에는 그 검사 결과를 FIU원장에게 통보하여야 하며, 검사 후 금융회사등에 필요한 조치를 직접 취하거나 해당 금융회사등의 장에게 필요한 조치를 취할 것을 요구할 수 있다','검사 결과에 대해서는 FIU원장에게 통보할 법적 의무가 존재하지 않으며, 검사를 실시한 기관이 그 결과를 자체적으로만 보관하면 충분한 것으로 이해해야 한다','검사를 실시한 이후 취해지는 시정조치는, 오로지 검사를 받은 금융회사등의 장이 자발적인 판단에 따라 결정할 사항일 뿐 검사기관이 이를 요구할 권한을 갖지 않는 것으로 이해해야 한다','검사 결과를 통보하는 절차와 그 이후에 이루어지는 시정조치는, 서로 아무런 연관성이 없는 완전히 독립적이고 별개의 절차로서 취급되는 것으로 이해해야 한다'],0,
  '검사기관·검사수탁기관의 장은 검사 실시 후 그 결과를 FIU원장에게 통보해야 하며, 금융회사등에 필요한 조치를 직접 취하거나 해당 금융회사등의 장에게 필요한 조치를 취할 것을 요구할 수 있어요.','ultra'),
M('jd4_14',
  '농협·수협·산림조합·신협·새마을금고의 검사수탁기관별 검사 대상에 대한 설명으로 가장 옳은 것은?',
  ['농협·수협·산림조합·신협의 검사 대상은 단위조합이며, 새마을금고의 검사 대상은 단위금고이다','농협·수협·산림조합·신협·새마을금고는 모두 동일하게 중앙회 전체를 검사 대상으로 한다','농협·수협·산림조합·신협·새마을금고는 검사수탁기관 체계에 포함되지 않는다','단위조합이나 단위금고는 검사 대상에서 제외되며 오직 중앙회만 검사 대상이다'],0,
  '농협·수협·산림조합·신협의 검사수탁기관별 검사 대상은 단위조합이며, 새마을금고의 검사 대상은 단위금고예요.','ultra'),
M('jd4_13',
  '특정금융정보법 제3조 제4항에 따라 금융정보분석원장이 매년 정기국회에 보고하여야 하는 사항에 해당하지 않는 것은?',
  ['제4조에 따라 금융회사등으로부터 보고받은 건수','제10조에 따라 특정금융거래정보의 제공을 요구받은 건수 및 제공한 건수','제11조에 따라 외국금융정보분석기구와 정보를 교환한 건수','금융정보분석원 직원 개개인의 연차 사용 현황'],3,
  '금융정보분석원장이 매년 정기국회에 보고해야 하는 사항은 보고받은 건수, 특정금융거래정보 제공 요구·제공 건수, 통보·통보유예 현황 통계, 외국금융정보분석기구와의 정보교환 건수, 기타 관련 통계자료 등이에요. "직원 개개인의 연차 사용 현황"은 이에 해당하지 않아요.','ultra'),
M('jd4_13',
  '특정금융정보법 시행령 제5조 제1항에서 "대통령령으로 정하는 업무"에 해당하지 않는 것은?',
  ['자금세탁행위와 공중협박자금조달행위의 동향 및 방지대책에 관한 조사·연구','자금세탁행위와 공중협박자금조달행위의 방지를 위한 금융회사등에 대한 교육훈련·지원·상담','자금세탁행위와 공중협박자금조달행위의 방지를 위한 국내외 협력증진 및 정보교류','금융회사등의 일반 여신 상품에 대한 금리 결정 업무'],3,
  '시행령 제5조 제1항의 대통령령으로 정하는 업무는 동향·방지대책 조사연구, 금융회사등에 대한 교육훈련·지원·상담, 국내외 협력증진·정보교류예요. "금융회사등의 일반 여신 상품 금리 결정 업무"는 이에 해당하지 않아요.','ultra'),
M('jd4_13',
  '특정금융정보법 시행령 제5조 제3항에 따라 금융정보분석원장이 설치·운영할 수 있는 협의회의 구성원에 해당하지 않는 기관은?',
  ['검찰청, 고위공직자범죄수사처, 경찰청, 해양경찰청','행정안전부, 국세청, 관세청, 중앙선거관리위원회','금융위원회, 국가정보원','대한변호사협회, 한국공인회계사회'],3,
  '협의회 구성원 기관은 금융정보분석원, 검찰청, 고위공직자범죄수사처, 경찰청, 해양경찰청, 행정안전부, 국세청, 관세청, 중앙선거관리위원회, 금융위원회, 국가정보원 소속 공무원이에요. "대한변호사협회, 한국공인회계사회"는 이에 해당하지 않아요.','ultra'),
M('jd4_13',
  '특정금융정보법 시행령 제5조 제4항에 따라 금융정보분석원장이 국제협약과 국제기구의 권고사항을 고려하여 세부내용을 정하여 고시할 수 있는 사항에 해당하지 않는 것은?',
  ['법 제5조 제1항 제1호에 따른 내부 보고체제의 수립에 관한 사항','법 제5조 제1항 제2호에 따른 업무지침의 작성 및 운용에 관한 사항','법 제5조의2 제1항 각 호에 따른 확인조치(CDD)에 관한 사항','금융회사등 임직원의 개인 성과급 산정 기준에 관한 사항'],3,
  '금융정보분석원장이 고시할 수 있는 세부내용은 내부 보고체제 수립, 업무지침 작성·운용, 임직원 교육·연수, 확인조치(CDD), 자료·정보의 보존에 관한 사항이에요. "임직원의 개인 성과급 산정 기준"은 이에 해당하지 않아요.','ultra'),
M('jd4_12',
  'FATF의 "Money laundering and terrorist financing risks"(2021년 5월) 문서에 대한 설명으로 가장 옳은 것은?',
  ['FATF 권고사항의 주요 요구사항 중 하나는 국가가 자금세탁(ML) 및 테러자금조달(TF) 위험을 식별, 평가 및 이해하는 것이며, 이러한 위험기반접근방식은 FATF 기준의 효과적인 구현의 핵심이며 금융기관, DNFBPs, NPO 모두에도 적용된다','이 문서가 다루는 위험기반접근방식은 오직 금융기관에만 적용되는 것으로 한정되어 있으며, DNFBPs(특정비금융사업자)나 NPO와 같은 다른 부문에는 적용되지 않는 것으로 규정하고 있다','국가 위험평가의 결과를 대외적으로 공개하는 것은 FATF 표준이 예외 없이 요구하는 필수적인 의무사항으로, 이를 이행하지 않으면 국제기준 위반으로 간주된다','이 문서에서 강조하는 위험기반접근방식은 FATF 기준의 실질적인 구현과는 직접적인 관련이 없는, 단순히 참고할 만한 부수적인 권고사항 정도로 취급되고 있다'],0,
  'FATF 권고사항의 핵심 요구사항 중 하나는 국가가 ML/TF 위험을 식별·평가·이해하는 것이며, 이 위험기반접근방식은 FATF 기준의 효과적인 구현의 핵심으로 금융기관·DNFBPs·NPO 모두에 적용돼요. 다만 국가 위험평가의 공개 자체는 FATF 표준의 필수 요구사항은 아니에요.','ultra'),
M('jd4_12',
  'FATF의 "Best Practices on Combating the Abuse of Non-Profit Organisations"(2023년 11월)에 대한 설명으로 가장 옳은 것은?',
  ['FATF는 R.8의 수정 사항을 반영하고 합법적인 NPO 활동을 부당하게 방해하거나 제한하지 않으면서 관련 NPO를 테러자금조달을 위한 남용으로부터 보호하는 최선의 방법에 대하여 국가, NPO 및 금융기관이 이해할 수 있도록 모범 사례를 업데이트하였다','이 문서는 합법적인 NPO 활동을 전면적으로 제한하거나 금지하는 것을 주된 목적으로 삼아, 각국이 NPO에 대한 규제를 대폭 강화하도록 요구하는 방향으로 작성되었다','이 문서는 R.8과는 아무런 연관성이 없는 완전히 별개의 독립적인 권고사항으로, R.8의 수정이나 개정 내용과는 무관하게 독자적으로 발표된 것으로 이해해야 한다','이 문서는 오직 국가와 금융기관만을 적용 대상으로 삼고 있을 뿐, 정작 보호의 대상이 되어야 할 NPO 자체는 이 문서가 다루는 범위에서 완전히 제외되어 있다'],0,
  'FATF는 R.8의 수정사항을 반영해, 합법적 NPO 활동을 부당하게 방해·제한하지 않으면서 NPO를 테러자금조달 남용으로부터 보호하는 최선의 방법에 대해 국가·NPO·금융기관이 이해할 수 있도록 모범 사례를 업데이트했어요.','ultra'),
M('jd4_12',
  'FATF R.8의 유형 보고서에서 NPO의 테러리스트 남용 취약성에 대한 설명으로 가장 옳은 것은?',
  ['테러조직과 NPO는 자금, 자산, 인력 및 대중의 영향력이라는 동일한 자원을 추구하므로 NPO는 테러리스트나 테러리스트 네트워크의 남용에 의해 상대적으로 취약해질 수 있으며, FATF R.8은 국가들이 NPO가 테러자금조달을 위해 남용되지 않도록 자국의 법률과 규정을 검토할 것을 요구한다','NPO와 테러조직은 자금·자산·인력·대중의 영향력 측면에서 완전히 다른 별개의 자원을 필요로 하는 조직이므로, NPO가 테러자금조달에 남용될 위험은 구조적으로 존재하지 않는다','NPO의 테러자금조달 남용 위험은 오로지 해당 NPO가 활동하는 국내 상황에만 국한되는 문제이며, 국제적인 인식 제고나 국가 간 정보 공유와는 전혀 관련이 없는 사안이다','FATF는 NPO 부문의 남용 위험을 파악함에 있어 법집행기관이나 NPO 관계자로부터 어떠한 의견도 수집하지 않고, 오직 통계 데이터 분석만으로 위험 평가를 수행한다'],0,
  '테러조직과 NPO는 자금·자산·인력·대중의 영향력이라는 동일한 자원을 추구하므로, NPO는 테러리스트·테러네트워크의 남용에 상대적으로 취약해질 수 있어요. FATF R.8은 각국이 NPO의 테러자금조달 남용 방지를 위해 자국 법률·규정을 검토할 것을 요구해요.','ultra'),
M('jd4_14',
  '특정금융정보법상 AML/CFT 위반에 대한 제재에 대한 설명으로 가장 옳은 것은?',
  ['특정금융정보법령에서는 AML/CFT 위반에 대한 제재의 종류를 법령에 규정하고 이에 대한 제재 조치별 부과 사유를 구체적으로 나열하고 있으며, 양정에 대한 기준은 특정 금융거래정보 보고등에 관한 검사 및 제재규정에 명시되어 있다','AML/CFT 위반에 대한 제재는 관련 법령상 아무런 근거 없이, 각 금융회사가 순전히 자율적인 판단에 따라 임의로 정하여 운영하는 것으로 이해해야 한다','제재의 구체적인 종류나 그 부과 사유는 법령에 명시적으로 규정되어 있지 않고, 오랜 기간 형성되어 온 관행에 따라 비공식적으로 운영되고 있는 것으로 이해해야 한다','제재 수준을 정하는 양정 기준에 관한 사항은, 어떠한 법령이나 감독규정에도 명시되어 있지 않은 순전히 재량에 맡겨진 사항으로 이해해야 한다'],0,
  '특정금융정보법령은 AML/CFT 위반에 대한 제재의 종류를 규정하고 조치별 부과 사유를 구체적으로 나열하고 있으며, 양정 기준은 검사 및 제재규정에 명시되어 있어요.','ultra'),
M('jd4_14',
  '검사 및 제재규정 제14조에 따른 기관제재에 대한 설명으로 가장 옳은 것은?',
  ['금융회사등의 법규위반 정도에 비례하여 시정명령, 영업 전부 또는 일부 정지(6월 이내), 기관경고, 기관주의 등이 규정되어 있다','기관제재는 오직 영업 전면 취소 한 가지 종류만 존재한다','영업정지 기간은 법규위반 정도와 무관하게 항상 1년으로 고정되어 있다','기관제재의 종류나 기준은 검사 및 제재규정에 명시되어 있지 않다'],0,
  '검사 및 제재규정 제14조는 법규위반 정도에 비례하여 시정명령, 영업 전부·일부 정지(6월 이내), 기관경고, 기관주의 등의 기관제재를 규정하고 있어요.','ultra'),
M('jd4_14',
  '특정금융정보법 시행령 제16조(민감정보 및 고유식별정보의 처리)에 따라 금융정보분석원장이 처리할 수 있는 사무에 해당하지 않는 것은?',
  ['법 제4조에 따른 불법재산 등으로 의심되는 거래의 보고등에 관한 사무','법 제4조의2에 따른 금융회사등의 고액 현금거래 보고에 관한 사무','법 제11조에 따른 외국금융정보분석기구와의 정보 교환 등에 관한 사무','법 제7조에 따른 외국환거래법상 지급 또는 수령에 관한 사무'],3,
  '시행령 제16조에 따라 금융정보분석원장이 민감정보·고유식별정보를 처리할 수 있는 사무는 법 제4조(STR), 제4조의2(CTR), 제11조(외국FIU와의 정보교환) 등에 관한 사무예요. "외국환거래법상 지급·수령에 관한 사무"는 이러한 열거 사무에 해당하지 않아요.','ultra'),
M('jd4_14',
  '금융정보분석원장의 수탁기관에 대한 지원에 대한 설명으로 가장 옳은 것은?',
  ['금융정보분석원장은 금융회사등에 대한 검사업무의 효율적인 수행을 위하여 필요한 경우에는 수탁기관의 장과 협의하여 금융정보분석원 소속 직원으로 하여금 수탁기관의 검사업무에 필요한 지원을 하게 할 수 있다','금융정보분석원장은 검사업무의 효율적 수행이 필요한 경우라 하더라도, 수탁기관에 대해 어떠한 형태의 지원도 제공할 수 없는 것으로 이해해야 한다','수탁기관은 검사를 실시한 결과를 금융정보분석원장에게 통보할 법적 의무를 전혀 부담하지 않는 것으로 이해해야 한다','검사 지원은 수탁기관의 동의 절차 없이, 금융정보분석원이 일방적으로 강제할 수 있는 사항으로 이해해야 한다'],0,
  '금융정보분석원장은 금융회사등에 대한 검사업무의 효율적인 수행을 위해 필요한 경우 수탁기관의 장과 협의하여 소속 직원으로 하여금 수탁기관의 검사업무를 지원하게 할 수 있어요.','ultra'),
M('jd4_14',
  '인적 제재(임직원 제재)에 대한 설명으로 가장 옳은 것은?',
  ['FIU원장이 검사결과에 따라 금융회사등의 임원에 대하여 해당 금융회사등의 장에게 요구할 수 있는 조치의 종류 및 사유는 해임권고, 직무정지, 문책경고, 주의적 경고, 주의가 있다','인적 제재는 오직 해임권고 한 가지 종류만 존재한다','임원에 대한 제재는 FIU원장이 직접 해임을 집행하는 방식으로 이루어진다','인적 제재는 금융회사등의 장과는 무관하게 FIU원장이 임원에게 직접 통보한다'],0,
  'FIU원장은 검사결과에 따라 금융회사등의 임원에 대해 해당 금융회사등의 장에게 해임권고·직무정지·문책경고·주의적 경고·주의 등의 조치를 요구할 수 있어요.','ultra'),
M('jd4_14',
  '제재의 감면에 대한 설명으로 가장 옳은 것은?',
  ['FIU원장과 검사수탁기관의 장은 금융회사등에 대한 제재 및 임직원에 대한 조치요구를 함에 있어서 사후 수습, 공적, 자진신고, 시정 여부 등을 참작하여 감경하거나 면제할 수 있다','제재의 감면은 어떠한 경우에도 허용되지 않는 절대적 원칙이다','자진신고 여부는 제재 감면 판단과 무관한 요소이다','제재 감면 권한은 FIU원장에게만 있으며 검사수탁기관의 장에게는 없다'],0,
  'FIU원장과 검사수탁기관의 장은 제재 및 조치요구 시 사후 수습, 공적, 자진신고, 시정 여부 등을 참작하여 감경하거나 면제할 수 있어요.','ultra'),
M('jd4_14',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 A는 최근 3년 이내에 4회 이상 기관주의 이상의 제재를 받았음에도 다시 관련 법규를 위반하였다.',
  ['금융회사가 최근 3년 이내에 4회 이상 기관주의 이상의 제재를 받고도 관련 법규를 다시 위반한 경우에는 1단계 가중할 수 있다','제재 이력이 있더라도 이후 위반에 대한 제재 수준을 가중할 수 있는 근거는 없다','제재 가중은 임직원에게만 적용되며 금융회사(기관)에는 적용되지 않는다','제재 횟수와 무관하게 항상 동일한 수준의 제재만 부과된다'],0,
  '금융회사등이 최근 3년 이내에 4회 이상 기관주의 이상의 제재를 받고도 관련 법규를 다시 위반한 경우에는 제재를 1단계 가중할 수 있어요.','ultra'),
M('jd4_14',
  '임원 및 직원에 대한 제재 가중 요건에 대한 설명으로 가장 옳은 것은?',
  ['임원이 최근 3년 이내에 문책경고 또는 2회 이상의 주의적 경고조치를 받고도 다시 주의적 경고 이상에 해당하는 행위를 한 경우, 직원이 최근 3년 이내에 2회 이상의 조치를 받고도 다시 위법 또는 부당한 행위를 한 경우에는 각각 1단계 가중할 수 있다','임원과 직원의 제재 가중 요건은 대상이나 판단 기준에 있어 완전히 동일하게 규정되어 있어, 감독규정상 양자를 구분하여 별도로 취급할 실익이 전혀 없는 것으로 이해된다','제재 가중 제도는 오직 임원에게만 적용되는 것으로 한정되어 있으며, 직원이 유사한 위반행위를 반복하더라도 이러한 가중 규정의 적용 대상에는 포함되지 않는다','제재 가중 요건은 과거 위반행위의 횟수나 시점과는 무관하게, 오직 최근 발생한 위반행위 하나만을 기준으로 그 경중을 판단하여 적용되는 것으로 규정되어 있다'],0,
  '임원이 최근 3년 이내에 문책경고 또는 2회 이상의 주의적 경고를 받고도 다시 주의적 경고 이상의 행위를 한 경우, 직원이 최근 3년 이내에 2회 이상의 조치를 받고도 다시 위법·부당한 행위를 한 경우 각각 1단계 가중할 수 있어요.','ultra'),
M('jd4_14',
  '제재 절차 중 "제재심의위원회"에 대한 설명으로 가장 옳은 것은?',
  ['FIU원장은 과태료, 시정명령 등 제재관련 사항에 대한 심의를 위해 제재심의위원회를 통하여 심의하며, 10인 이내의 민간위원이 구성되며 심의위원회에는 2인 이상이 포함되어 개의한다','제재심의위원회는 공무원으로만 구성되며 민간위원은 포함될 수 없다','과태료나 시정명령은 제재심의위원회의 심의 대상이 아니다','제재심의위원회는 개의를 위한 최소 인원 요건이 없다'],0,
  'FIU원장은 과태료·시정명령 등 제재관련 사항 심의를 위해 제재심의위원회를 운영하며, 10인 이내의 민간위원으로 구성되고 심의위원회에는 2인 이상이 포함되어야 개의할 수 있어요.','ultra'),
M('jd4_14',
  '제재 절차 중 "사전통지 및 의견진술"에 대한 설명으로 가장 옳은 것은?',
  ['FIU원장 또는 검사수탁기관의 장이 제재조치를 하는 때에는 제재의 내용 등을 제재 대상자에게 사전통지하고 일정기간을 정하여 구술 또는 서면에 의한 의견진술 기회를 주어야 한다','제재 대상자에게 사전통지할 의무는 없으며 제재는 통보 없이 즉시 집행된다','의견진술 기회는 서면으로만 가능하며 구술로는 인정되지 않는다','사전통지 절차는 검사수탁기관에는 적용되지 않고 FIU원장에게만 적용된다'],0,
  'FIU원장 또는 검사수탁기관의 장이 제재조치를 할 때는 제재 내용을 제재 대상자에게 사전통지하고, 일정기간을 정해 구술 또는 서면에 의한 의견진술 기회를 주어야 해요.','ultra'),
M('jd4_14',
  '제재 절차의 흐름에 대한 설명으로 가장 옳은 것은?',
  ['검사수탁기관의 장은 검사결과 적출된 지적사항에 대하여 조치내용을 결정하여 FIU원장에게 제재를 건의하거나 직접 조치하며, 제재 대상자에 대한 사전통지 및 의견진술 기회 부여를 거쳐 제재가 확정된다','검사수탁기관의 장은 검사결과 적출된 지적사항에 대해 어떠한 조치도 결정할 권한이 없으며, 모든 조치 결정은 오로지 FIU원장만이 단독으로 내릴 수 있는 것으로 이해해야 한다','제재 절차에서 사전통지나 의견진술 절차는 법령상 요구되지 않는 임의적 선택사항에 불과하여, 이를 생략하더라도 절차적 문제가 되지 않는 것으로 이해해야 한다','제재 건의나 직접 조치는 검사결과와는 무관하게, 검사수탁기관의 재량적 판단만으로 자유롭게 이루어질 수 있는 것으로 이해해야 한다'],0,
  '검사수탁기관의 장은 검사결과 적출된 지적사항에 대해 조치내용을 결정하여 FIU원장에게 제재를 건의하거나 직접 조치하며, 제재 대상자에 대한 사전통지 및 의견진술 절차를 거쳐야 해요.','ultra'),
M('jd4_14',
  '제재권 및 위탁 현황표에 따른 제재권자 연결로 옳지 않은 것은?',
  ['지정명령 - FIU원장','관계부처장에 대한 영업정지 요구, 과태료 - FIU원장','기관경고·기관주의 - 검사수탁기관','임원에 대한 해임권고·직무정지 - 검사수탁기관'],3,
  '임원에 대한 해임권고·직무정지의 제재권자는 검사수탁기관이 아니라 "FIU원장"이에요. 임원에 대한 문책경고·주의적경고·주의는 검사수탁기관이 제재권자예요.','ultra'),
M('jd4_14',
  '제재권 및 위탁 현황표에서 직원에 대한 제재(면직·정직·감봉·견책·주의)의 제재권자는 누구인가?',
  ['FIU원장','검사수탁기관','금융위원회','국세청'],1,
  '직원에 대한 면직·정직·감봉·견책·주의의 제재권자는 검사수탁기관이에요. 반면 기관에 대한 지정명령·영업정지요구·과태료와 임원에 대한 해임권고·직무정지의 제재권자는 FIU원장이에요.','ultra'),
M('jd4_14',
  '제재 절차 중 "불복 및 이의신청"에 대한 설명으로 가장 옳은 것은?',
  ['금융회사등 또는 그 임직원에 대하여 제재를 한 경우에는 FIU원장 및 검사수탁기관의 장은 그 제재에 대하여 이의신청, 행정심판, 행정소송의 제기 등 불복을 할 수 있는 권리에 관한 사항을 제재대상자에게 알려주어야 한다','제재 대상자는 자신이 받은 제재에 대해 어떠한 상황에서도 이의를 제기하거나 불복할 수 있는 권리를 전혀 갖지 못하는 것으로 이해해야 한다','제재 대상자는 이의신청이나 행정심판이라는 수단은 활용할 수 있지만, 행정소송을 제기하는 것은 관련 법령상 원천적으로 금지되어 있는 것으로 이해해야 한다','불복할 수 있는 권리에 관한 사항을 제재 대상자에게 알려주어야 할 의무는, 검사수탁기관의 장에게는 적용되지 않고 오직 FIU원장에게만 부과되는 것으로 이해해야 한다'],0,
  '금융회사등 또는 임직원에게 제재를 한 경우, FIU원장 및 검사수탁기관의 장은 이의신청·행정심판·행정소송 제기 등 불복할 수 있는 권리에 관한 사항을 제재대상자에게 알려주어야 해요.','ultra'),
M('jd4_14',
  '특정금융정보법 제16조(벌칙)에 대한 설명으로 가장 옳은 것은?',
  ['제4조 제5항 또는 제13조 제3항의 요건에 해당하지 아니함에도 불구하고 권한을 남용하여 금융회사등이 보존하는 관련 자료를 열람·복사하거나 금융회사등의 장에게 금융거래등 관련 정보 또는 자료의 제공을 요구한 자는 5년 이하의 징역 또는 5천만 원 이하의 벌금에 처한다','제16조 위반에 대해서는 형사처벌인 징역이나 벌금이 아니라, 오로지 행정처분인 과태료만 부과되는 것으로 규정되어 있어 상대적으로 가벼운 제재에 그친다','권한을 남용하여 금융회사등이 보존하는 관련 자료를 열람하거나 복사하는 행위는, 제16조가 규정하는 처벌 대상에 해당하지 않는 것으로 명시적으로 제외되어 있다','제16조의 법정형은 오직 벌금형만으로 구성되어 있으며, 이 조항에는 징역형이라는 형벌 유형 자체가 처음부터 포함되어 있지 않은 것으로 규정되어 있다'],0,
  '제16조 제1호는 제4조 제5항·제13조 제3항의 요건에 해당하지 않음에도 권한을 남용해 금융회사등의 관련 자료를 열람·복사하거나 정보·자료 제공을 요구한 자를 5년 이하 징역 또는 5천만 원 이하 벌금에 처하도록 규정하고 있어요.','ultra'),
M('jd4_14',
  '특정금융정보법 제16조 제2호에 따라 처벌되는 행위에 해당하는 것은?',
  ['제12조 제1항을 위반하여 직무와 관련해 알게 된 특정금융거래정보 등을 다른 사람에게 제공·누설하거나 그 목적 외의 용도로 사용한 자','정상적인 업무 절차에 따라 STR을 금융정보분석원에 보고한 보고책임자','법령에 따라 적법하게 정보 제공을 요구받고 이에 응한 금융회사 직원','내부 감사 목적으로 자사의 CDD 자료를 적법하게 열람한 준법감시인'],0,
  '제16조 제2호는 제12조 제1항을 위반해 직무상 알게 된 특정금융거래정보·제5조의3 제공정보·제13조 제공정보·제15조 제7항 제공정보를 다른 사람에게 제공·누설하거나 목적 외 용도로 사용한 자를 처벌 대상으로 규정해요. 나머지 선택지는 적법한 정상 업무 수행에 해당해요.','ultra'),
M('jd4_14',
  '특정금융정보법 제17조 제1항(벌칙)에 대한 설명으로 가장 옳은 것은?',
  ['제7조 제1항을 위반하여 신고를 하지 아니하고 가상자산거래를 영업으로 한 자(거짓이나 그 밖의 부정한 방법으로 신고를 하고 가상자산거래를 영업으로 한 자를 포함)는 5년 이하의 징역 또는 5천만 원 이하의 벌금에 처한다','신고 없이 가상자산거래를 영업으로 하는 미신고 가상자산사업자에 대해서는, 관련 법령상 별도의 형사처벌 규정이 마련되어 있지 않은 것으로 이해해야 한다','거짓이나 부정한 방법으로 신고를 하고 가상자산거래를 영업으로 한 자는, 제17조 제1항이 규정하는 처벌 대상에서 명시적으로 제외되는 것으로 이해해야 한다','제17조 제1항이 정하는 법정형은 오로지 벌금형만으로 구성되어 있으며, 이 조항에는 애초에 징역형이라는 형벌의 종류가 포함되어 있지 않은 것으로 이해해야 한다'],0,
  '제17조 제1항은 미신고 가상자산거래 영업자(거짓·부정한 방법으로 신고한 자 포함)에 대해 5년 이하의 징역 또는 5천만 원 이하의 벌금에 처하도록 규정하며, 이는 2020년 3월 24일 신설된 조항이에요.','ultra'),
M('jd4_14',
  '특정금융정보법 제17조 제3항에 따라 1년 이하의 징역 또는 1천만 원 이하의 벌금에 처해지는 자에 해당하는 것은?',
  ['제4조 제1항 및 제4조의2 제1항·제2항에 따른 보고를 거짓으로 한 자(STR·CTR 허위보고)','적법하게 미신고 상태에서 가상자산거래를 영업으로 한 자','변경신고를 거짓으로 한 자','고객확인의무를 이행하지 않은 자'],0,
  '제17조 제3항은 STR·CTR 보고를 거짓으로 한 자, 제4조 제6항을 위반한 자를 1년 이하의 징역 또는 1천만 원 이하의 벌금에 처하도록 규정해요. 미신고 영업(제1항)은 5년/5천만원, 거짓 변경신고(제2항)는 3년/3천만원으로 별도 규정돼요.','ultra'),
M('jd4_14',
  '특정금융정보법 제18조(징역과 벌금의 병과)에 대한 설명으로 가장 옳은 것은?',
  ['제16조 및 제17조에 규정된 죄를 범한 자에게는 징역과 벌금을 병과(倂科)할 수 있다','징역과 벌금은 어떠한 경우에도 동시에 부과할 수 없으며 반드시 택일해야 한다','징역과 벌금의 병과는 제16조에만 적용되며 제17조에는 적용되지 않는다','병과 규정은 법인에게만 적용되고 개인에게는 적용되지 않는다'],0,
  '제18조는 제16조·제17조에 규정된 죄를 범한 자에게 징역과 벌금을 함께 부과(병과)할 수 있도록 규정하고 있어요.','ultra'),
M('jd4_14',
  '특정금융정보법 제19조(양벌규정)에 대한 설명으로 가장 옳은 것은?',
  ['법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 제17조의 위반행위를 한 경우에는 행위자를 벌하는 외에 그 법인 또는 개인에 대하여도 해당 조문의 벌금형을 과하되, 법인 또는 개인이 위반행위를 방지하기 위해 상당한 주의와 감독을 게을리하지 아니한 경우에는 그러하지 아니하다','양벌규정은 위반행위를 직접 저지른 행위자 개인에게만 책임을 묻고, 그 행위자가 소속된 법인이나 개인 사업주에 대해서는 상당한 주의·감독 이행 여부와 무관하게 어떠한 경우에도 별도의 벌금형을 부과하지 않는 것으로 이해해야 한다','법인 또는 개인이 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 않은 경우라 하더라도, 이러한 사정과 무관하게 법인 또는 개인에게 예외 없이 동일한 벌금형이 부과되는 것으로 이해해야 한다','양벌규정은 제17조 위반행위에는 적용되지 않고, 오직 제16조(권한남용에 의한 자료 열람·정보누설 등) 위반행위에 대해서만 한정적으로 적용되는 별개의 독립적인 규정으로 이해해야 한다'],0,
  '특정금융정보법 제19조(양벌규정)는 법인의 대표자나 법인·개인의 대리인·사용인·종업원이 업무에 관해 제17조 위반행위를 한 경우 행위자를 벌하는 외에 법인·개인에게도 해당 조문의 벌금형을 과하되, 위반행위 방지를 위해 상당한 주의·감독을 게을리하지 않았다면 예외로 해요.','ultra'),
M('jd4_14',
  '특정금융정보법 시행령 제17조(과태료의 부과기준)에 대한 설명으로 가장 옳은 것은?',
  ['법 제20조 제1항 및 제2항에 따른 과태료는 위반행위의 동기와 결과, 위반 횟수 등을 고려하여 감독규정이 정하는 범위 내에서 감경하거나 가중할 수 있다','과태료 부과기준은 법령에 규정되어 있지 않고 각 검사수탁기관이 임의로 정한다','시행령 제17조는 과태료가 아니라 징역형의 양정 기준을 규정한다','과태료는 위반행위의 경중과 관계없이 항상 동일한 정액으로 부과되도록 정해져 있다'],0,
  '특정금융정보법 시행령 제17조에 따른 과태료 부과기준(별표 2)은 위반행위의 동기·결과, 위반 횟수 등 정상을 고려하여 감독규정이 정하는 범위 내에서 감경하거나 가중할 수 있도록 정하고 있어요. 각 검사수탁기관이 임의로 정한다거나, 징역형 양정 기준을 규정한다거나, 항상 동일한 정액으로 부과된다는 서술은 모두 옳지 않아요.','ultra'),
M('jd4_13',
  '2021년 금융정보분석원(FIU)의 조직 개편에 대한 설명으로 가장 옳은 것은?',
  ['2021년 FIU는 가상자산사업자의 관리·감독 및 자금세탁방지 제도운영 효율화를 위해 조직을 개편하고 인력을 확충하였으며, 특정금융정보법 개정에 따른 법정 사무 전담을 위해 「금융위원회와 그 소속기관 직제」를 개정하여 가상자산검사과 등 직위를 신설하였다','FIU는 2021년 이후 현재에 이르기까지 조직 구조에 어떠한 변화도 주지 않고, 설립 당시의 조직 체계를 그대로 유지하며 운영해 오고 있는 것으로 이해해야 한다','가상자산사업자에 대한 관리·감독 업무는 FIU가 아니라, 이와는 완전히 별도로 존재하는 다른 기관이 전담하여 처리하는 소관 업무로 취급되는 것으로 이해해야 한다','가상자산검사과라는 조직은 특정금융정보법의 개정 내용과는 무관하게, 순전히 내부 행정상의 필요에 따라 임의로 신설된 조직에 불과한 것으로 이해해야 한다'],0,
  '2021년 FIU는 가상자산사업자 관리·감독 및 자금세탁방지 제도운영 효율화를 위해 조직을 개편·인력을 확충했고, 특정금융정보법 개정에 따른 법정 사무 전담을 위해 「금융위원회와 그 소속기관 직제」를 개정해 가상자산검사과 등을 신설했어요.','ultra'),
M('jd4_13',
  '금융정보분석원의 조직과 업무분장에 대한 설명으로 가장 옳은 것은?',
  ['금융정보분석원장 아래에 제도운영기획관과 정보분석심의위원의 두 축이 있으며, 제도운영기획관 산하에는 기획행정담당·제도운영과·가상자산검사과·심사분석실이, 정보분석심의위원 산하에는 심사분석1과·심사분석2과·심사분석3과가 있다','금융정보분석원은 원장 직속의 단일한 부서로만 이루어져 있을 뿐, 그 아래에 별도의 하부 조직이 전혀 존재하지 않는 단순한 조직 구조를 갖는 것으로 이해해야 한다','가상자산검사과라는 조직은 독립된 부서가 아니라, 심사분석실 산하에 편제되어 있는 하위 부서로서 심사분석실장의 지휘를 받는 것으로 이해해야 한다','심사분석1과, 심사분석2과, 심사분석3과는 서로 다른 업무를 각각 분담하지 않고, 세 부서 모두 동일하게 탈세정보분석 업무만을 전담하여 수행하는 것으로 이해해야 한다'],0,
  '금융정보분석원장 아래 제도운영기획관(기획행정담당·제도운영과·가상자산검사과·심사분석실)과 정보분석심의위원(심사분석1·2·3과)의 두 축으로 조직이 구성되어 있어요.','ultra'),
M('jd4_13',
  '금융정보분석원 심사분석1과~3과의 업무분장에 대한 설명으로 가장 옳은 것은?',
  ['심사분석1과는 탈세정보분석·요구분석을, 심사분석2과는 외환범죄분석·요구분석을, 심사분석3과는 형사범죄분석·요구분석을 담당한다','심사분석1과~3과는 모두 동일하게 형사범죄분석만을 전담한다','외환범죄분석은 심사분석3과가 아니라 가상자산검사과의 업무이다','탈세정보분석은 기획행정담당의 업무에 해당한다'],0,
  '심사분석1과는 탈세정보분석·요구분석, 심사분석2과는 외환범죄분석·요구분석, 심사분석3과는 형사범죄분석·요구분석을 각각 담당해요.','ultra'),
M('jd4_13',
  '「금융위원회와 그 소속기관 직제 시행규칙」 제12조(기획행정실)에 따라 기획행정실장이 분장하는 사항에 해당하지 않는 것은?',
  ['자금세탁방지제도에 관한 정책과 주요업무계획의 종합·조정','특정금융거래정보 보고제도의 운영 및 전산시스템의 개발·관리 업무의 총괄·조정','특정금융거래정보의 수집·처리 체계의 개선에 관한 사항','금융회사등에 대한 개별 대출 승인 여부 결정'],3,
  '기획행정실장은 자금세탁방지제도 정책·주요업무계획 종합조정, 특정금융거래정보 보고제도 운영·전산시스템 개발관리 총괄조정, 특정금융거래정보 수집·처리 체계 개선에 관한 사항을 분장해요. "금융회사등에 대한 개별 대출 승인 여부 결정"은 이에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조의2 제4항에 따라 금융회사등이 신규거래를 거절하거나 기존 거래를 종료해야 하는 사유에 해당하지 않는 것은?',
  ['고객이 신원확인을 위한 정보 제공을 거부하는 등의 사유로 고객확인을 할 수 없는 경우','고객이 가상자산사업자인 경우, 제7조 제1항 및 제2항에 따른 신고 및 변경신고 의무를 이행하지 아니한 사실이 확인된 경우','그 밖에 고객이 자금세탁행위나 공중협박자금조달행위를 할 위험성이 특별히 높다고 판단되는 경우로서 대통령령으로 정하는 경우','고객이 창구 방문 대신 인터넷뱅킹을 이용하여 거래하기를 희망하는 경우'],3,
  '거래거절·종료 사유는 고객확인 불가(정보제공 거부 등), 가상자산사업자의 미신고·미수리·직권말소 등 확인, 자금세탁·테러자금조달 위험성이 특별히 높다고 판단되는 경우 등이에요. "인터넷뱅킹 이용 희망"은 이에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조의2 제4항 제2호에 따라 고객이 가상자산사업자인 경우 거래거절·종료 사유에 해당하는 것은?',
  ['제7조 제3항에 따라 신고가 수리되지 아니한 사실이 확인된 경우, 제7조 제4항에 따라 신고 또는 변경신고가 직권으로 말소된 사실이 확인된 경우','가상자산사업자가 최근 1년간 순이익을 기록하지 못한 경우','가상자산사업자의 임직원 수가 10명 미만인 경우','가상자산사업자가 특정 지역에 본사를 두고 있는 경우'],0,
  '가상자산사업자인 고객에 대한 거래거절·종료 사유는 신고·변경신고 의무 미이행, 신고 미수리, 신고·변경신고의 직권 말소 등이 확인된 경우예요. "순이익 미기록", "임직원 수", "본사 소재지"는 이에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조의2 제5항에 대한 설명으로 가장 옳은 것은?',
  ['제4항에 따라 거래를 거절 또는 종료하는 경우에는 금융회사등은 제4조에 따른 의심되는 거래의 보고(STR) 여부를 검토하여야 한다','거래를 거절하거나 종료하는 경우에는 의심거래보고 검토 의무가 자동으로 면제된다','거래거절·종료와 의심거래보고는 서로 완전히 무관한 별개의 절차이다','의심거래보고 검토는 거래를 계속 유지하는 경우에만 필요하며 거절·종료 시에는 불필요하다'],0,
  '제5항은 제4항에 따라 거래를 거절 또는 종료하는 경우 금융회사등이 제4조에 따른 의심되는 거래의 보고(STR) 여부를 검토하도록 규정하고 있어요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제5조의3(전신송금 시 정보제공)에 대한 설명으로 가장 옳은 것은?',
  ['금융회사등은 송금인이 전신송금(送金人의 계좌보유 여부를 불문하고 금융회사등을 이용하여 국내외의 다른 금융회사등으로 자금을 이체하는 서비스)의 방법으로 500만 원의 범위에서 대통령령으로 정하는 금액 이상을 송금하는 경우에는 송금인 및 수취인에 관한 정보를 수취금융회사등에게 제공하여야 한다','전신송금 시 정보제공 의무는 송금인이 해당 금융회사에 계좌를 개설하여 보유하고 있는 경우에만 적용되며, 계좌 없이 창구에서 현금으로 송금하는 경우에는 적용되지 않는다','전신송금 정보제공 기준금액은 시행령 위임 없이 법률 본문에서 1천만 원으로 직접 명시하고 있어 대통령령으로 별도로 정할 수 없다','전신송금 정보제공 의무는 국내송금에는 적용되지 않고 해외로 나가는 송금에 한하여만 적용되는 것으로 법에 명시되어 있다'],0,
  '제5조의3은 전신송금(송금인의 계좌보유 여부와 무관하게 금융회사등을 이용해 국내외 다른 금융회사등으로 자금을 이체하는 서비스)이 500만 원 범위에서 대통령령으로 정하는 금액 이상인 경우, 송금인·수취인 정보를 수취금융회사등에 제공하도록 규정해요.','ultra'),
M('jd2_9',
  '국제자금세탁방지기구(FATF)의 TBML 가이던스 발간 연혁에 대한 설명으로 옳지 않은 것은?',
  ['2008년 FATF는 \'TBML을 위한 Best Practice\'를 발간하였고, 2012년 APG는 \'TBML을 위한 방법론\' 보고서를 발간하였다','2020년 FATF는 \'TBML을 위한 동향 및 발전\'을 발간하였고, 2021년 FATF는 \'TBML을 위한 위험지표\'를 발간하였다','TBML 관련 국제기구의 가이던스 발간은 2008년 최초 발간 이후 현재까지 단 한 차례도 추가로 이루어진 적이 없다','TBML 가이던스는 FATF뿐만 아니라 APG와 같은 지역기구에서도 발간되었다'],2,
  'TBML 관련 가이던스는 2008년(FATF Best Practice), 2012년(APG 방법론), 2020년(FATF 동향 및 발전), 2021년(FATF 위험지표) 등 지속적으로 발간되어 왔어요. "2008년 이후 추가 발간이 없었다"는 서술은 옳지 않아요.','ultra'),
M('jd2_9',
  'FATF의 2008년 TBML Best Practice(Best Practices on Trade Based Money Laundering)에 대한 설명으로 가장 옳은 것은?',
  ['FATF는 무역체계가 새로운 ML/TF의 위험을 증가시키고 있고, 세관·법 집행기관·FIU·세무당국 및 은행감독기관 등이 TBML/TF에 대한 협업체계를 구축하는 것이 중요하다고 판단하였다','FATF는 2008년 보고서에서 무역체계가 ML/TF 위험과는 전혀 무관하다고 결론지어, 이후 관련 대응책 마련에 소극적인 입장을 취했던 것으로 이해해야 한다','TBML 대응은 세관만의 단독 책임 영역이며, 법집행기관·FIU·세무당국·은행감독기관 등 다른 기관과의 협업은 불필요한 것으로 이 보고서가 명시하고 있는 것으로 이해해야 한다','이 보고서는 TBML 대응에 있어 은행감독기관이 수행하는 역할에 대해서는 전혀 언급하지 않고 있는 것으로 이해해야 한다'],0,
  'FATF의 2008년 TBML Best Practice는 무역체계가 새로운 ML/TF 위험을 증가시키고 있다고 지적하며, 세관·법집행기관·FIU·세무당국·은행감독기관 등이 TBML/TF에 대한 협업체계를 구축해야 한다고 강조해요.','ultra'),
M('jd2_9',
  'TBML의 중요 요소에 해당하지 않는 것은?',
  ['TBML의 혐의 문역(무역)거래 정보가 수출입업자들을 통해 전달되어지는 과정','검사당국의 거래 모니터링, 무역금융에서 보아야 할 상품 이동에 따른 결제','대외무역에 따른 외환거래','수출입업자의 개인 신용카드 결제 한도'],3,
  'TBML의 중요 요소는 무역거래 정보가 수출입업자를 통해 전달되는 과정, 검사당국의 거래 모니터링, 상품 이동에 따른 결제, 대외무역에 따른 외환거래 등이에요. "수출입업자의 개인 신용카드 결제 한도"는 이에 해당하지 않아요.','ultra'),
M('jd2_9',
  'FATF의 2020년 \'Trade-Based Money Laundering 2020 Update: Trends and Developments\'에 대한 설명으로 가장 옳은 것은?',
  ['2006년 FATF의 연구에서 처음으로 확인된 TBML 수법은 과소 또는 과다 송장 청구, 재화가치의 과소 또는 과대 설정과 실제 재화의 이동이 없는 유령선적(phantom shipments) 등을 포함하고 있다','TBML 수법(과소·과다 송장 청구 등)은 2020년 보고서에서 처음으로 확인된 것이며, 그 이전에는 전혀 알려진 바가 없었던 것으로 이해해야 한다','유령선적(phantom shipments)은 실제로 재화의 이동이 수반되는 정상적인 무역 관행으로, TBML과는 무관한 것으로 이해해야 한다','과소 또는 과다 송장 청구는 TBML의 전형적인 수법에 해당하지 않는, 정상적인 가격 협상의 일환으로 이해해야 한다'],0,
  '2006년 FATF의 연구에서 처음 확인된 TBML 수법에는 과소·과다 송장 청구, 재화가치의 과소·과대 설정, 실제 재화 이동이 없는 유령선적(phantom shipments) 등이 포함돼요. 이는 2020년이 아니라 2006년부터 알려진 수법이에요.','ultra'),
M('jd2_9',
  'TBML/TF의 위험에 적합한 교육 프로그램을 통해 이해관계자들이 인식해야 할 데이터·정보의 이동 관련 요소에 해당하지 않는 것은?',
  ['국내 체계와 권한당국과의 업무 연계','개인정보 보호와 프라이버시','국제협력, 무역관련 법률체계','금융회사 자체의 내부 인사평가 및 승진 심사 기준'],3,
  'TBML/TF 위험에 적합한 교육 프로그램에서 인식해야 할 데이터·정보의 이동 관련 요소는 국내 체계와 권한당국과의 업무 연계, 개인정보 보호와 프라이버시, 국제협력·무역관련 법률체계 등이에요. "금융회사 자체의 내부 인사평가 및 승진 심사 기준"은 이에 해당하지 않아요.','ultra'),
M('jd2_9',
  'TBML 예방을 위한 권한당국의 조치와 그 한계에 대한 설명으로 가장 옳은 것은?',
  ['권한당국은 허위 회사, 수출입 업자의 무역권한을 박탈하는 방식으로 TBML의 위험을 예방할 수 있으나, 금융회사가 제3자 중개자와 관련된 위험을 인지한다 하더라도 합법적인 수입업자·수출업자, 감사인 그리고 회계사와 같은 감독자 등 공급망과 관련된 주체들이 무역거래와 관련 없는 제3자가 지급결제과정에 속해 있는 것은 다소 위험이 있다','무역거래와 관련 없는 제3자가 지급결제과정에 개입하는 것은 자금 흐름을 오히려 투명하게 만드는 요소이므로, TBML 관점에서는 어떠한 경우에도 위험 요소로 취급되지 않는 것으로 이해해야 한다','권한당국이 허위 회사나 수출입업자의 무역권한을 박탈하는 조치만 취하면 TBML 위험을 완전히 제거할 수 있으므로, 금융회사 차원의 별도 모니터링이나 예방책은 불필요한 것으로 이해해야 한다','합법적인 수입업자·수출업자, 감사인, 회계사와 같은 공급망 관련 주체가 지급결제과정에 관여하는 것은 오히려 거래의 적법성을 자동으로 보장하므로, 위험 평가 대상에서 제외해야 하는 것으로 이해해야 한다'],0,
  '권한당국은 허위 회사·수출입 업자의 무역권한 박탈 등으로 TBML 위험을 예방할 수 있지만, 금융회사가 제3자 중개자와 관련된 위험을 인지하고 대응하는 것도 중요해요. 합법적 주체의 관여라도 위험 평가 대상에서 자동 제외되지는 않아요.','ultra'),
M('jd2_9',
  '2012년 FATF의 위험기반접근법(RBA) 도입과 국가위험평가(NRA)의 TBML/TF 대응 관련성에 대한 설명으로 가장 옳은 것은?',
  ['TBML/TF를 위하여 2012년에 개정된 FATF의 RBA 도입과 더불어 국가위험평가(National Risk Assessment, NRA)가 TBML/TF의 위험 노출도 분석 및 위험기반 정책, 관련 절차 및 법안의 개정 등에 도움을 준다','국가위험평가(NRA)라는 제도는 TBML이나 TF에 대한 대응과는 전혀 관련이 없는, 완전히 별개의 독립적인 제도로서 서로 연계되지 않는 것으로 이해해야 한다','FATF의 위험기반접근법(RBA) 도입은 2012년이 아니라, 그보다 훨씬 앞선 2001년에 이미 이루어진 것으로 알려져 있어 시기상의 혼동이 없어야 한다','NRA는 위험기반 정책을 수립하는 과정에는 전혀 도움이 되지 않고, 오로지 사후적인 통계 자료를 작성하기 위한 목적으로만 활용되는 것으로 이해해야 한다'],0,
  '2012년 개정된 FATF의 RBA 도입과 함께 국가위험평가(NRA)는 TBML/TF의 위험 노출도 분석과 위험기반 정책·관련 절차·법안 개정 등에 도움을 줘요.','ultra'),
M('jd2_9',
  'TBML/TF 관련 국가위험평가(NRA) 보고서가 기술하는 사항에 해당하지 않는 것은?',
  ['TBML/TF의 정의 및 무역금융, TBML 위험 및 동향','TBML 예방의 한계, TBML 방지방안 및 사례','TBML 위험지표(부록)','금융회사 임직원의 연차별 승진 심사 및 인사평가 기준'],3,
  'TBML/TF 관련 국가위험평가(NRA) 보고서는 TBML/TF의 정의 및 무역금융, TBML 위험 및 동향, TBML 예방의 한계, TBML 방지방안 및 사례, TBML 위험지표(부록) 등을 기술해요. "금융회사 임직원의 연차별 승진 심사 및 인사평가 기준"은 이에 해당하지 않아요.','ultra'),
M('jd2_9',
  '세관에 대한 TBML 가이드라인에 대한 설명으로 가장 옳은 것은?',
  ['2020년 FATF의 \'TBML 업데이트: 동향 및 발전\' 보고서에서는 TBML에 대한 세관의 역할과 책임에 대하여 정의를 하였고, 국내 법집행기관인 관세청에서는 2016년 은행의 보고책임자들을 위하여 TBML 가이드라인을 제시하였다','세관의 역할과 책임에 관한 사항은 2020년 FATF의 \'TBML 업데이트: 동향 및 발전\' 보고서에서 전혀 다루어지지 않아, 이 문서와는 무관한 별개의 영역으로 남아 있는 것으로 알려져 있다','관세청이 제시한 TBML 가이드라인은 2020년 FATF 보고서 발표와 동일한 시점에 최초로 마련되어, 그 이전에는 국내에 이와 관련된 어떠한 지침도 존재하지 않았던 것으로 알려져 있다','관세청은 지금까지 은행 보고책임자들을 위한 TBML 관련 가이드라인을 제시한 사례가 전혀 없으며, 이러한 업무는 전적으로 금융감독원의 소관으로만 남아 있는 것으로 알려져 있다'],0,
  '2020년 FATF의 \'TBML 업데이트: 동향 및 발전\' 보고서는 세관의 역할·책임을 정의했고, 국내 관세청은 이보다 앞선 2016년에 은행 보고책임자들을 위한 TBML 가이드라인을 제시했어요.','ultra'),
M('jd4_12',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF R.8은 NPO 정의에 해당하는 단체에만 적용되며 비영리 영역 전체에 적용되는 것은 아니다.\nㄴ. 2023년 11월 FATF는 집중적·비례적·위험기반 조치를 강조하며 R.8과 주석서를 개정하였다.\nㄷ. R.8 주석서는 모든 NPO를 예외 없이 금융회사와 동일한 수준의 보고주체로 지정할 것을 각국에 요구한다.\nㄹ. NPO에 대한 과도한 규제는 합법적 활동과 인권에 부정적 영향을 미칠 수 있다.',
  ['4개','3개','2개','1개'],1,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. R.8 주석서는 NPO에 대한 감독·모니터링은 요구하지만, 모든 NPO를 금융회사와 동일한 보고주체로 지정할 것까지 요구하지는 않아요(ㄷ).','ultra'),
M('jd4_13',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 우리나라 FIU는 2001년 11월 28일 특정금융정보법·테러자금금지법 제정과 함께 설립되었다.\nㄴ. FATF R.29에 따르면 FIU는 보고기관이 이미 제출한 정보 외의 추가 정보는 취득할 수 없다.\nㄷ. FIU는 국경을 넘는 테러 네트워크의 재정 운영 식별과 재정적 후원자 파악에 중요한 역할을 한다.\nㄹ. 2021년 FIU는 가상자산사업자 관리·감독을 위해 조직을 개편하고 가상자산검사과를 신설하였다.',
  ['4개','3개','2개','1개'],1,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. R.29에 따르면 FIU는 보고기관으로부터 추가 정보를 취득할 수 있어야 해요. "추가 정보는 취득할 수 없다"는 ㄴ의 서술은 옳지 않아요.','ultra'),
M('jd4_14',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FIU는 가상자산과 카지노 업권에 대한 검사를 전적으로 검사수탁기관에 위탁하며 직접 검사는 실시하지 않는다.\nㄴ. 검사수탁기관은 검사 및 조치 결과를 FIU에 통보해야 한다.\nㄷ. 검사를 받는 금융회사등의 임직원은 문답서·확인서 작성 시 변호사의 조력을 받을 수 있다.\nㄹ. 제재를 받은 금융회사등은 이의신청·행정심판·행정소송 등으로 불복할 수 있다.',
  ['4개','3개','2개','1개'],1,
  'ㄴ, ㄷ, ㄹ은 옳은 설명이에요. FIU는 가상자산·카지노 업권에 대해 직접 검사를 실시해요. "전적으로 위탁하며 직접 검사는 실시하지 않는다"는 ㄱ의 서술은 옳지 않아요.','ultra'),
M('jd4_14',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 은행 M의 임원 갑은 최근 3년 이내에 문책경고를 1회 받은 적이 있었는데, 이번 검사에서 다시 주의적 경고에 해당하는 행위가 확인되었다.',
  ['임원이 최근 3년 이내에 문책경고 또는 2회 이상의 주의적 경고조치를 받고도 다시 주의적 경고 이상에 해당하는 행위를 한 경우에는 해당 금융회사의 장에게 요구할 수 있는 조치를 1단계 가중할 수 있으므로, 이 사례는 가중 요건 해당 여부를 검토해야 한다','제재 가중 제도는 임원 개인에게는 적용되지 않고, 오직 금융회사(기관) 차원의 제재에만 적용되는 것으로 한정되어 있어 개인에 대한 가중은 이루어지지 않는다','임원이 과거에 문책경고를 받은 이력이 있다는 사실은, 이후 발생하는 새로운 위반행위에 대한 제재 수준을 결정하는 과정에서 전혀 고려되지 않는 별개의 정보로 취급된다','제재 가중 여부에 대한 최종 판단은 검사수탁기관이 아니라, 제재 대상이 되는 임원 본인이 스스로의 재량에 따라 판단하여 결정하는 것으로 규정되어 있다'],0,
  '임원이 최근 3년 이내에 문책경고 또는 2회 이상의 주의적 경고조치를 받고도 다시 주의적 경고 이상에 해당하는 행위를 한 경우 조치를 1단계 가중할 수 있어요. 이 사례에서는 문책경고 이력이 있으므로 가중 요건 해당 여부를 검토해야 해요.','ultra'),
M('jd4_13',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 N의 담당 직원은 법집행기관으로부터 테러자금 관련 정보 제공을 요청받았으나, 통상적인 업무 절차를 이유로 처리를 지연시켰다.',
  ['범죄가 의심되는 모든 경우, 특히 테러자금과 관련된 경우 정보는 과도한 지체 없이 직접적이고 신속하게 전달되어야 하므로, 담당 직원의 지연 처리는 FIU의 정보 접근·법집행기관 협력 원칙에 부합하지 않을 수 있다','테러자금 관련 정보라 하더라도, 일반적인 통상적 업무 절차에 따라 순차적으로 처리하면 충분한 것으로 이해해야 한다','정보 제공의 신속성 요건은 오직 국내 사건에만 적용될 뿐이며, 국경을 넘는 국제 테러 사건에는 적용되지 않는 것으로 이해해야 한다','법집행기관의 정보 요청은 FIU의 업무 범위와는 무관한, 별개의 독립적인 사안으로 이해해야 한다'],0,
  '범죄가 의심되는 모든 경우, 특히 테러자금과 관련된 경우 정보는 과도한 지체 없이 직접적이고 신속하게 전달되어야 해요. 담당 직원의 지연 처리는 이러한 신속성 요건에 부합하지 않을 수 있어요.','ultra'),
M('jd2_9',
  'TBML 관련 무역정보 공유의 한계 및 새로운 문제점에 대한 설명으로 가장 옳은 것은?',
  ['무역거래는 다양한 이해관계자가 무역정보를 갖고 있지만 이러한 정보를 운영상 또는 대량으로 공유할 수 있는 범위에는 한계가 있으며, 새로운 문제점으로서 온라인사업의 성장, 예방적 준수활동의 범위 제한, 신기술, 무역절차의 디지털화, 무역 운영속도의 증가 등이 대두되고 있다','온라인사업의 성장은 전자상거래에 대한 규제 강화로 자연스럽게 이어지므로, 이러한 흐름 자체가 TBML 위험을 완전히 제거하는 긍정적인 요인으로 작용하는 것으로 평가된다','신기술의 도입이나 무역절차의 디지털화는 거래의 투명성을 절대적으로 보장하는 효과를 가지므로, TBML 문제와는 애초에 무관한 것으로 간주할 수 있다','무역거래 관련 이해관계자들 사이의 정보 공유는 운영상·법적 제약이 전혀 없이 무제한으로 자유롭게 이루어질 수 있는 것으로 알려져 있다'],0,
  '무역거래는 다양한 이해관계자가 정보를 보유하지만 대량 공유에는 한계가 있으며, 온라인사업 성장·예방적 준수활동 범위 제한·신기술·무역절차 디지털화·운영속도 증가 등이 새로운 문제점으로 대두되고 있어요.','ultra'),
M('jd4_14',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 검사수탁기관인 금융감독원은 은행 O에 대한 검사를 실시하여 법규 위반사항을 확인하였다.',
  ['검사기관 및 검사수탁기관의 장은 금융회사등에 대하여 검사를 실시한 경우에는 그 검사 결과를 FIU원장에게 통보하여야 하며, 검사 후 금융회사등에 필요한 조치를 직접 취하거나 해당 금융회사등의 장에게 필요한 조치를 취할 것을 요구할 수 있다','검사수탁기관은 검사를 실시한 결과를 오로지 자체적으로만 보관하면 충분하며, 이를 FIU원장에게 별도로 통보할 법적 의무는 부담하지 않는 것으로 이해해야 한다','검사수탁기관이 검사 과정에서 법규 위반사항을 확인하였다 하더라도, 이에 대한 어떠한 형태의 시정조치도 요구할 수 있는 권한을 갖지 않는 것으로 이해해야 한다','이 사례에서 금융감독원이 은행 O에 대해 실시한 검사는, 금융감독원 고유의 업무 범위를 벗어난 것으로 검사 자체가 위법한 것으로 이해해야 한다'],0,
  '검사수탁기관인 금융감독원은 검사 실시 후 그 결과를 FIU원장에게 통보해야 하며, 금융회사등에 필요한 조치를 직접 취하거나 해당 금융회사등의 장에게 필요한 조치를 취할 것을 요구할 수 있어요.','ultra'),
M('jd4_13',
  '각국 FIU 간 국제기준 규범 부족으로 인한 문제와 그 대응 필요성에 대한 설명으로 가장 옳은 것은?',
  ['국제기준 규범의 부족으로 회원국들의 FIU는 그 기능·역량 및 권한과 관련해 현저한 차이를 유지하고 있으며, 그러나 이러한 차이점이 FIU의 활동, 특히 정보·조사·사법활동 그리고 국제협력담당 당국을 지원하는 예방분석을 개발할 수 있는 능력에 영향을 미쳐서는 안 된다','각국 FIU 간의 기능이나 역량 차이가 국제협력의 효과성에 미치는 영향에 대해서는, 이를 규율하거나 경계하는 어떠한 원칙도 국제기준상 마련되어 있지 않은 것으로 이해된다','국제기준 규범이 부족한 상황이라 하더라도, 이는 각국 FIU 간의 실질적인 기능·역량 차이와는 직접적인 관련성을 갖지 않는 별개의 사안으로 다루어지는 것으로 알려져 있다','각국은 자국 FIU가 다른 나라의 FIU와 비교해 상대적으로 어떠한 차이를 보이더라도, 이를 좁히거나 개선하기 위해 별도의 노력을 기울일 국제적 의무를 부담하지 않는 것으로 이해된다'],0,
  '국제기준 규범 부족으로 각국 FIU는 기능·역량·권한에 현저한 차이가 있지만, 이러한 차이가 FIU의 활동(정보·조사·사법활동, 국제협력 지원 예방분석 개발 능력)에 영향을 미쳐서는 안 된다는 점이 강조돼요.','ultra'),
M('jd4_14',
  '검사수탁기관별 검사대상 금융회사 연결로 가장 옳은 것은?',
  ['중소벤처기업부 - 벤처투자회사, 벤처투자조합','과학기술정보통신부 - 새마을금고중앙회','제주도청 - 우체국','행정안전부 - 환전업자'],0,
  '중소벤처기업부는 벤처투자회사·벤처투자조합을 검사대상으로 해요. 과학기술정보통신부는 우체국, 행정안전부는 새마을금고중앙회, 관세청은 환전업자, 제주도청은 제주카지노사업자를 각각 검사대상으로 담당해요.','ultra'),
M('jd2_7b',
  '2025년 10월 개정된 금융회사지배구조법과 자금세탁방지의무의 관계에 대한 설명으로 가장 옳은 것은?',
  ['2025년 10월 개정된 금융회사지배구조법은 내부통제 체계에 대한 명확성을 강조하는데, 금융회사지배구조법이 내부통제의 골격을 제공하고 자금세탁방지업무규정이 그 골격 위에 자금세탁방지 내부통제를 구체화하는 구조로서, 특정금융정보법상 CDD·STR·CTR 이행이 내부통제를 통해 효과적으로 작동될 수 있는 중요한 토대가 된다','금융회사지배구조법의 개정 내용은 자금세탁방지의무와는 전혀 무관한 순수 지배구조상의 문제로, 특정금융정보법상 CDD·STR·CTR 이행과는 어떠한 연관성도 없는 것으로 이해해야 한다','금융회사지배구조법은 자금세탁방지업무규정보다 하위의 세부 규정에 불과하여, 오히려 업무규정이 지배구조법의 골격을 제공하는 관계로 이해해야 한다','금융회사지배구조법 개정은 내부통제의 책임 주체를 명확히 하기는커녕, 오히려 기존의 책임 소재를 더욱 불분명하게 만드는 결과를 가져온 것으로 이해해야 한다'],0,
  '2025년 10월 개정 금융회사지배구조법은 내부통제 체계의 명확성을 강조하며, 지배구조법이 내부통제의 골격을 제공하고 자금세탁방지업무규정이 그 위에 자금세탁방지 내부통제를 구체화하는 구조예요. CDD·STR·CTR 이행이 내부통제를 통해 효과적으로 작동하는 토대가 돼요.','ultra'),
M('jd2_7b',
  '금융회사지배구조법상 자금세탁방지의무와 연관된 조항에 해당하지 않는 것은?',
  ['제24조(내부통제기준)','제30조의2(임원의 내부통제등 관리의무)','제30조의3(책무구조도), 제30조의4(대표이사등의 내부통제등 총괄 관리의무)','제45조(외국환거래 신고 및 보고에 관한 특례)'],3,
  '금융회사지배구조법상 자금세탁방지의무와 연관된 조항은 제24조(내부통제기준), 제30조의2(임원의 내부통제등 관리의무), 제30조의3(책무구조도), 제30조의4(대표이사등의 내부통제등 총괄 관리의무) 등이에요. "제45조(외국환거래 신고 및 보고에 관한 특례)"는 이에 해당하지 않으며, 애초에 금융회사지배구조법상 존재하는 조항이 아니에요.','ultra'),
M('jd2_7b',
  '금융회사지배구조법 제24조(내부통제기준)에 대한 설명으로 가장 옳은 것은?',
  ['금융회사는 법령을 준수하고 경영을 건전하게 하며 주주 및 이해관계자 등을 보호하기 위하여 금융회사의 임직원이 직무를 수행할 때 준수하여야 할 기준 및 절차(내부통제기준)를 마련하여야 하며, 다만 금융지주회사가 금융회사인 자회사등의 내부통제기준을 마련하는 경우 그 자회사등은 내부통제기준을 마련하지 아니할 수 있다','내부통제기준은 금융회사가 마련할지 여부를 전적으로 임의로 선택할 수 있는 단순 권장 사항에 불과하며, 법률상 반드시 준수해야 하는 강행적 의무 사항은 아닌 것으로 이해해야 한다','금융지주회사가 자회사등의 내부통제기준을 이미 마련한 경우라 하더라도, 각 자회사등은 이와는 별개로 자체적인 내부통제기준을 중복하여 반드시 추가로 마련해야 하는 것으로 이해해야 한다','내부통제기준에서 정해야 할 세부적인 사항과 그 밖에 필요한 사항은, 대통령령에 위임하지 않고 법률 본문에서 직접 확정적으로 열거하여 규정하고 있는 것으로 이해해야 한다'],0,
  '금융회사는 법령준수·건전경영·이해관계자 보호를 위해 임직원이 준수할 내부통제기준을 마련해야 해요. 다만 금융지주회사가 자회사등의 내부통제기준을 마련하면 그 자회사등은 별도로 마련하지 않을 수 있어요.','ultra'),
M('jd2_7b',
  '금융회사지배구조법 제30조의2(임원의 내부통제등 관리의무)에 따라 임원이 하여야 하는 관리조치에 해당하지 않는 것은?',
  ['이 법 및 금융관계법령에 따른 내부통제기준등이 적정하게 마련되었는지 여부에 대한 점검','내부통제기준등이 효과적으로 집행·운영되고 있는지 여부에 대한 점검, 임직원이 법령 또는 내부통제기준등을 충실하게 준수하고 있는지 여부에 대한 점검','점검 과정에서 알게 된 법령 및 내부통제기준등의 위반사항이나 미흡한 사항에 대한 시정·개선 등 필요한 조치','임원 본인의 개인 재산에 대한 국세청 세무조사 결과를 대표이사등에게 정기적으로 보고하는 조치'],3,
  '제30조의2에 따른 관리조치는 ①내부통제기준등의 적정성 점검 ②효과적 집행·운영 여부 점검 ③임직원의 준수 여부 점검 ④위반사항·미흡사항 시정·개선 조치 ⑤내부통제등 효과적 작동을 위한 대통령령 정 관리조치 등이에요. "임원 개인 재산의 세무조사 결과 보고"는 이에 해당하지 않아요.','ultra'),
M('jd1_2',
  '유엔안보리결의(UNSCR) 1373호(2001)가 재확인한 이전 결의들에 대한 설명으로 가장 옳은 것은?',
  ['안전보장이사회는 2001년 9월 12일 채택된 결의 1368호(2001)와 1999년 10월 10일 채택된 결의 1269호(1999)를 재확인하였으며, 1970년 10월 유엔 총회의 선언(결의 2625호(XXV))을 통해 확립되고 1998년 8월 13일 채택된 안보리 결의 1189호(1998)가 재천명한 원칙도 함께 재확인하였다','UNSCR 1373호는 그 이전에 채택된 어떠한 결의도 재확인하지 않고, 오로지 새로운 내용만으로 처음부터 완전히 독립적으로 작성된 결의에 해당하는 것으로 이해해야 하며 다른 결의와의 연관성은 언급되지 않는다','UNSCR 1373호가 재확인한 결의는 오로지 1368호 하나뿐이며, 1269호나 2625호, 1189호와 같은 다른 결의와는 전혀 무관한 것으로 이해해야 하며 이는 결의문 본문에서도 확인된다','UNSCR 1373호는 1970년대 이전에 채택된 결의만을 선별하여 재확인할 뿐, 1990년대 이후 채택된 결의와는 어떠한 연계성도 갖지 않는 것으로 이해해야 하며 시기적 단절이 뚜렷하다'],0,
  'UNSCR 1373호(2001)는 2001년 9월 12일 결의 1368호, 1999년 10월 10일 결의 1269호를 재확인하고, 1970년 10월 유엔총회 선언(결의 2625호(XXV))을 통해 확립되어 1998년 8월 13일 결의 1189호가 재천명한 원칙(자국 영토 내 테러조직 활동 묵인 금지 등)도 재확인했어요.','ultra'),
M('jd1_2',
  '유엔안보리결의(UNSCR) 1373호(2001) 제1항이 모든 국가에 요구하는 사항에 해당하지 않는 것은?',
  ['테러자금조달을 방지하고 억제할 것','테러 행위에 사용할 목적으로 또는 사용될 것을 알면서 자국민 또는 자국 영토 내에서 수단을 불문하고 직간접적으로 자금을 제공 또는 모집하는 행위를 범죄화할 것','테러 행위를 자행·시도·가담·촉진하는 자 및 관련 단체의 자금·재원을 지체 없이 동결할 것(직간접적으로 소유·통제하는 재산에서 유래하는 자금 포함)','테러 용의자에 대해서는 재판 없이 즉결 처형할 수 있는 권한을 각국 행정부에 부여할 것'],3,
  'UNSCR 1373호 제1항은 ①테러자금조달 방지·억제 ②테러자금 제공·모집 행위의 범죄화 ③테러 관련자·단체의 자금·재원 동결 등을 요구해요. "재판 없는 즉결 처형 권한 부여"는 국제인권법에 반하는 것으로, 이 결의가 요구하는 사항이 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 4(몰수 및 잠정조치) 주석서에 따른 잠정조치(provisional measures)에 대한 설명으로 가장 옳은 것은?',
  ['각국은 법원의 명령 없이 범죄수익재산 및 이에 상응하는 가치의 재산을 동결하거나 압수할 필요가 있는 경우, 가능한 신속하게 조치를 취할 필요가 있으며 이러한 조치는 일정 기간 내에 사법절차를 통하여 심사를 받을 수 있어야 한다','잠정조치는 반드시 법원의 사전 명령을 거친 후에만 취할 수 있으며, 긴급한 경우에도 예외 없이 법원의 사전 승인 절차를 생략할 수 없다','동결 또는 압수 신청은 상대방에게 사전 통지를 반드시 완료한 이후에만 이루어질 수 있으며, 사전 통지 없는(ex parte) 신청은 어떠한 경우에도 허용되지 않는다','잠정조치의 최대 지속기간은 명확히 규정할 필요가 없으며, 각국이 무기한으로 자유롭게 연장할 수 있도록 하는 것이 바람직하다'],0,
  '각국은 법원 명령 없이도 범죄수익재산을 신속하게 동결·압수할 수 있어야 하며, 이러한 조치는 일정 기간 내 사법절차 심사를 받도록 해야 해요. 사전 통지 없는(ex parte) 신청도 허용되며, 조치의 최대 지속기간은 명확히 규정해야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 16(전신송금) 주석서상 도입 목적에 대한 설명으로 가장 옳은 것은?',
  ['권고 16은 테러리스트 및 기타 범죄자들이 자금의 이전을 위해 전신송금에 자유롭게 접근하는 것을 금지하고, 접근이 이뤄졌을 경우 이러한 악용을 찾아낼 목적으로 도입되었으며, 특히 송금인·수취인에 관한 기본정보를 법집행기관·FIU·지시금융기관 등이 즉시 이용 가능하게 하기 위함이다','권고 16은 오로지 금융기관 간의 수수료 정산 방식을 표준화하기 위한 순수 행정적·회계적 목적으로만 도입된 규정에 불과한 것으로 이해해야 하며, 자금세탁방지와는 무관한 것으로 이해해야 한다','권고 16의 목적은 전신송금의 처리 속도를 의도적으로 최대한 지연시켜, 자금세탁 시도를 물리적인 시간 지연을 통해 원천적으로 차단하는 데 있는 것으로 이해해야 하며 이것이 핵심 취지이다','권고 16은 테러자금조달 문제와는 전혀 무관하며, 오로지 일반적인 상거래 대금 결제의 효율성을 높이는 것만을 목적으로 하는 규정으로 이해해야 하며 정보 제공 요건과는 무관하다'],0,
  '권고 16은 테러리스트·범죄자의 전신송금 접근을 금지하고, 접근 시 악용을 찾아낼 목적으로 도입됐어요. 송금인·수취인 기본정보를 법집행기관 수사·FIU 분석·지시금융기관의 결의 1267호·1373호 동결조치 준수에 즉시 활용하기 위함이에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 16(전신송금) 주석서에 따라 각국이 국외 전신송금에 대해 채택할 수 있는 최소 금액 한도에 대한 설명으로 가장 옳은 것은?',
  ['각국은 USD/EUR 1,000을 넘지 않는 국외 전신송금에 대해 최소 금액 한도를 채택할 수 있으며, 이 경우 금융기관이 송금인 성명·수취인 성명·각각의 계좌번호 또는 고유 거래조회번호 정보를 포함하도록 해야 하고 해당 정보의 정확성이 검증될 필요는 없으나 자금세탁·테러자금조달이 의심되는 경우 고객 정보를 검증해야 한다','최소 금액 한도는 USD/EUR 10,000으로 정해져 있으며, 이 기준을 초과하는 거래에 대해서만 정보를 포함할 의무가 비로소 발생하는 것으로 이해해야 하며 그 이하 거래는 완전 면제된다','국외 전신송금에는 어떠한 최소 금액 한도도 채택할 수 없도록 되어 있어, 모든 금액의 거래에 대해 완전히 동일한 수준의 검증 절차가 예외 없이 요구되는 것으로 이해해야 하며 이는 강행규정이다','최소 금액 한도 이하의 거래는 정보의 정확성 검증 여부와는 무관하게, 애초에 어떠한 정보도 포함할 필요가 없는 완전 면제 거래로 이해해야 하며 예외가 인정되지 않는다'],0,
  '각국은 USD/EUR 1,000을 넘지 않는 국외 전신송금에 최소 금액 한도를 채택할 수 있으며, 이 경우 송금인·수취인 성명과 계좌번호(또는 고유 거래조회번호)를 포함해야 해요. 정확성 검증은 불요하나 자금세탁·테러자금조달 의심 시에는 검증해야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 16(전신송금) 주석서에 따라 적법한 국외 전신송금에 동반되어야 하는 정보에 해당하지 않는 것은?',
  ['송금인 성명, 거래 진행에 사용된 송금인 계좌번호','송금인의 주소, 또는 주민등록번호, 또는 고객식별번호, 또는 생년월일과 출생지','수취인 성명, 거래 진행에 사용된 수취인 계좌번호','송금인과 수취인이 재직 중인 회사의 최근 3개년 감사보고서 요약본'],3,
  '적법한 국외 전신송금에 동반되어야 하는 정보는 송금인 성명·계좌번호, 송금인 주소(또는 주민등록번호·고객식별번호·생년월일과 출생지), 수취인 성명·계좌번호예요. "재직 회사의 감사보고서 요약본"은 이에 해당하지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 16(전신송금) 주석서에 따라 송금인이 여러 개의 국외 전신송금을 묶음파일 형태로 수취인들에게 일괄송금하는 경우에 대한 설명으로 가장 옳은 것은?',
  ['송금인이 여러 개의 국외 전신송금을 묶음파일 형태로 수취인들에게 일괄송금하는 경우 송금인 정보 요건에서 면제되나, 계좌가 없는 경우 거래 추적이 가능하도록 요구되는 송금인의 계좌번호 또는 고유 거래조회번호는 포함하여야 한다','묶음파일 형태로 이루어지는 일괄송금은 어떠한 예외도 인정되지 않아, 개별 전신송금과 완전히 동일한 수준의 정보 요건을 예외 없이 모두 충족해야 하는 것으로 이해해야 한다','묶음파일 형태의 일괄송금은 그 성격상 자금세탁방지 규제 자체의 적용 대상에서 원천적으로 완전히 제외되는 거래 유형에 해당하는 것으로 이해해야 한다','묶음파일 형태의 일괄송금에서는 수취인에 관한 정보 역시 전면적으로 면제되어, 수취인에 대한 어떠한 정보도 포함할 필요가 없는 것으로 이해해야 한다'],0,
  '묶음파일 형태로 일괄송금하는 경우 송금인 정보 요건에서 면제되지만, 계좌번호 또는 고유 거래조회번호(거래 추적 가능하도록)는 포함해야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 20(의심거래보고) 주석서에서 "범죄행위등"의 범위에 대한 설명으로 가장 옳은 것은?',
  ['권고 20에서 언급하는 범죄행위등이라 함은 자금세탁의 전제범죄를 구성하는 모든 범죄행위 또는 최소한 권고 3에서 전제범죄로 구성하도록 의무화한 범죄를 말하며, 각국에게는 두 가지 방안 중 전자(모든 범죄행위)를 채택할 것을 강력하게 권고한다','권고 20의 범죄행위등은 오로지 권고 3에서 전제범죄로 의무화한 최소 범위로만 엄격하게 한정되며, 그 이상을 채택하는 것은 허용되지 않는다','권고 20의 범죄행위등은 마약범죄에만 한정되며 그 밖의 중대범죄는 포함되지 않는다','각국은 자금세탁 전제범죄를 구성하는 모든 범죄행위와 권고 3의 최소 의무 범위 중 어느 것을 채택하더라도 FATF로부터 동일한 권고를 받는다'],0,
  '권고 20의 범죄행위등은 자금세탁 전제범죄를 구성하는 모든 범죄행위 또는 최소한 권고 3의 의무화 범위를 말하며, FATF는 두 방안 중 전자(모든 범죄행위)를 채택할 것을 강력히 권고해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 20(의심거래보고) 주석서에서 테러자금조달 관련 의심거래보고에 대한 설명으로 가장 옳은 것은?',
  ['권고 20에서 테러자금조달이라 함은 특정 테러행위 또는 행위들과 연관되어 있지 않더라도, 테러행위를 위한 자금조달, 테러조직 또는 개별 테러리스트에 대한 자금조달을 말한다','권고 20의 테러자금조달 보고의무는 특정 테러행위와 직접 연관성이 명백히 입증된 경우에만 적용된다','권고 20은 테러조직에 대한 자금조달만을 다룰 뿐 개별 테러리스트에 대한 자금조달은 포함하지 않는다','테러자금조달 관련 의심거래보고는 다른 일반 자금세탁 의심거래보고와는 전혀 다른 별도의 독립적 체계로 운영되어야 한다'],0,
  '권고 20의 테러자금조달은 특정 테러행위와 연관이 없더라도, 테러행위를 위한 자금조달이나 테러조직·개별 테러리스트에 대한 자금조달을 포함하는 넓은 개념이에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 20(의심거래보고) 주석서에서 보고 요건의 성격에 대한 설명으로 가장 옳은 것은?',
  ['보고 요건은 직접적인 법적 의무여야 하며, 자금세탁 또는 테러자금조달 혐의로 기소될 수 있다는 이유든 다른 이유든 간접적 또는 내재된 의무(이른바 "간접보고")는 적절하지 않다','보고 요건은 직접적인 법적 의무일 필요가 없으며, 간접적이거나 내재된 형태의 의무로도 충분히 그 취지를 달성할 수 있다','기소 가능성을 근거로 한 간접적인 보고 방식이 오히려 FATF가 권장하는 가장 바람직한 보고 체계이다','보고 요건의 성격이 직접적인지 간접적인지는 권고 20의 평가 대상이 아니다'],0,
  '권고 20의 보고 요건은 직접적인 법적 의무여야 하며, 기소 가능성 등을 근거로 한 간접적·내재된 의무(간접보고)는 적절하지 않다고 명시하고 있어요.','ultra'),
M('jd1_3',
  'FATF 권고사항 24 주석서 24.12에 따라 국가가 무기명주식의 오용 위험을 방지·완화하기 위해 취해야 할 조치에 해당하지 않는 것은?',
  ['새로운 무기명주식 및 무기명주식인수증권서의 발행을 금지할 것','기존의 무기명주식을 합리적인 기간 내에 기명식으로 전환하거나, 규제된 금융기관·전문 중개인이 보관·동결하도록 하거나, 소유자가 회사에 통지하고 권리 행사 전 신원을 기록하도록 요구할 것','관계당국이 해당 정보에 적시에 접근할 수 있도록 할 것','모든 상장회사에 대해 무기명주식 발행을 오히려 의무화하여 주식시장의 유동성을 극대화할 것'],3,
  '24.12는 새 무기명주식 발행 금지, 기존 무기명주식의 기명식 전환·보관·동결 또는 신원 기록 요구, 관계당국의 적시 정보 접근 등을 요구해요. "무기명주식 발행을 오히려 의무화"는 이에 해당하지 않으며 취지에 정반대돼요.','ultra'),
M('jd1_3',
  'FATF 권고사항 24 주석서 24.13에 따라 국가가 명의주주(nominee shareholder)의 오용 위험을 방지·완화하기 위해 적용할 수 있는 메커니즘에 해당하지 않는 것은?',
  ['명의주주 및 명의이사가 자신의 명의자 지위와 지정자의 신원을 회사 및 관련 등록부에 공개하도록 요구하고, 해당 정보가 등록부에 포함되거나 공공기관 또는 대체 메커니즘에 의해 보유되도록 할 것','명의주주 및 명의이사가 허가를 받도록 요구하고, 최종적으로 대리하는 자연인을 식별할 수 있는 정보를 유지하며 요청 시 관계당국에 제공하도록 할 것','명의주주 또는 명의이사의 사용을 금지할 것','명의주주 제도를 전면적으로 장려하고 그 신원 확인이나 등록 요건은 일체 두지 않을 것'],3,
  '24.13은 명의자 지위 공개·등록 요구, 허가제·최종 대리 자연인 식별정보 유지, 또는 명의주주·명의이사 사용 자체를 금지하는 메커니즘을 제시해요. "신원 확인·등록 요건 없이 전면 장려"는 이에 해당하지 않으며 오용 위험을 오히려 키우는 조치예요.','ultra'),
M('jd1_3',
  '핵심원칙(Core Principles)을 적용받는 금융기관에 대한 AML/CFT 감독에 대한 설명으로 가장 옳은 것은?',
  ['핵심원칙을 적용받는 금융기관의 경우, 건전성 목적으로 적용되고 자금세탁·테러자금조달과도 관련 있는 규제와 감독조치를 AML/CFT 목적을 위해 유사한 방법으로 적용해야 하며, 이에는 금융기관의 본사·지점·자회사에 대한 통합적 그룹 감시와 고객확인 위험관리의 효과적인 이행이 포함되어야 한다','핵심원칙을 적용받는 금융기관은 건전성 감독과 AML/CFT 감독이 완전히 분리되어, 두 감독 체계가 서로 어떠한 방법론이나 절차도 공유할 수 없도록 엄격히 구분되어 운영되는 것으로 이해해야 한다','핵심원칙 적용 금융기관은 본사에 대해서만 감독하면 충분하며, 해외지점이나 자회사에 대한 통합적 그룹 감시까지는 요구되지 않는 것으로 이해해야 한다','핵심원칙 적용 금융기관에 대한 AML/CFT 감독은, 해당 금융기관이 고객확인 위험관리를 실제로 이행하고 있는지 여부와는 무관하게 이루어지는 것으로 이해해야 한다'],0,
  '핵심원칙 적용 금융기관은 건전성 목적 규제·감독조치를 AML/CFT 목적으로도 유사하게 적용하며, 본사·지점·자회사에 대한 통합적 그룹 감시와 고객확인 위험관리의 효과적 이행이 포함돼요.','ultra'),
M('jd1_3',
  '감독에 대한 위험기반접근법(RBA)에 대한 설명으로 가장 옳은 것은?',
  ['감독에 대한 위험기반접근법이란 감독기관이 위험에 대한 이해를 바탕으로 AML/CFT 감독에 자원을 할당하는 일반적인 과정과, 감독기관이 AML/CFT 위험기반접근법을 적용하는 금융기관들을 감독하는 구체적인 과정을 모두 말한다','감독에 대한 위험기반접근법은 감독기관의 자원 배분과는 무관하며, 오직 금융기관 내부의 자체적인 위험관리 절차만을 지칭하는 개념이다','감독에 대한 위험기반접근법을 적용하면 감독기관은 고위험 부문과 저위험 부문에 동일한 비율로 자원을 배분해야 한다','감독기관이 위험기반접근법을 적용하는 것은 금융기관에 대한 감독 빈도나 강도와는 무관한 사항이다'],0,
  '감독 RBA는 감독기관이 위험 이해를 바탕으로 AML/CFT 감독에 자원을 할당하는 일반적 과정과, RBA를 적용하는 금융기관들을 감독하는 구체적 과정을 모두 포함하는 개념이에요.','ultra'),
M('jd1_3',
  '감독기관이 위험기반접근법을 적용하기 위해 갖추어야 할 요건에 대한 설명으로 가장 옳은 것은?',
  ['감독기관은 자국의 자금세탁 및 테러자금조달 위험에 대한 명확한 이해를 가져야 하며, 금융기관의 고객·재화·서비스와 관련된 구체적인 국내외 위험에 대한 관련 정보에 임점(on-site) 및 비임점(off-site) 접근을 할 수 있어야 한다','감독기관은 자국의 자금세탁 위험에 대한 이해 수준과는 무관하게, 모든 금융기관에 대해 항상 동일한 강도의 감독을 획일적으로 적용하면 충분한 것으로 이해해야 한다','감독기관이 확보하는 정보는 반드시 임점 방식으로만 접근해야 하며, 비임점 방식을 통한 정보 접근은 감독 절차상 인정되지 않는 것으로 이해해야 한다','감독기관은 금융기관의 준법감시기능이 실제로 어느 수준으로 갖추어져 있는지와는 무관하게, 감독 자원을 배분해야 하는 것으로 이해해야 한다'],0,
  '감독기관은 자국 ML/TF 위험에 대한 명확한 이해를 갖고, 금융기관의 고객·재화·서비스 관련 국내외 위험 정보에 임점·비임점 접근을 할 수 있어야 해요. 이를 바탕으로 고위험 부문에 자원을 집중할 수 있어요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29(FIU) 주석서 F항목 "부적절한 영향 또는 간섭"(12번)에 대한 설명으로 가장 옳은 것은?',
  ['FIU는 운영의 독립성을 해치는 정치, 정부, 산업의 부적절한 영향 또는 간섭으로부터 자유로운 상태에서 FIU의 기능을 수행하는 데 필요한 자원을 취득하고 활용할 수 있어야 한다','FIU는 정부 부처의 직접적인 통제와 지시를 받아 운영되어야 하며, 독립성이라는 가치는 애초에 FIU 운영에서 고려할 대상이 아닌 것으로 이해해야 한다','FIU가 자원을 취득하고 활용하는 과정은, 정치적 영향력을 적극적으로 반영하여 결정하는 것이 오히려 바람직한 방향으로 이해해야 한다','FIU에 대한 산업계 관계자의 영향력 행사는, 전문성 제고에 도움이 된다는 이유로 오히려 적극 권장되는 것으로 이해해야 한다'],0,
  'FIU는 정치·정부·산업의 부적절한 영향이나 간섭으로부터 자유로운 상태에서, 기능 수행에 필요한 자원을 취득·활용할 수 있는 운영의 독립성을 가져야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29(FIU) 주석서 G항목 "에그몬트 그룹"(13번)에 대한 설명으로 가장 옳은 것은?',
  ['각국은 FIU가 에그몬트 그룹의 회원 규약과 자금세탁 및 테러자금조달에 관한 FIU 간의 정보교환원칙(FIU의 역할·기능 및 FIU 간 정보교환 운영체계에 관한 중요한 지침 제공)을 고려하도록 해야 하며, FIU는 에그몬트 그룹 회원가입을 신청해야 한다','에그몬트 그룹 가입은 FIU가 수행하는 정보교환 업무와는 전혀 무관한 선택적 사항으로, 각국이 이를 전혀 고려할 필요가 없는 것으로 이해해야 한다','에그몬트 그룹은 FIU 간에 이루어지는 실질적인 정보교환과는 무관하게, 순수한 학술적 교류만을 목적으로 운영되는 조직으로 이해해야 한다','FIU는 에그몬트 그룹이 정한 회원 규약을 고려할 필요 없이, 각자 독자적으로 수립한 정보교환 원칙만으로도 충분한 것으로 이해해야 한다'],0,
  '각국은 FIU가 에그몬트 그룹의 회원 규약과 정보교환원칙을 고려하도록 해야 하며, FIU는 에그몬트 그룹 회원가입을 신청해야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29(FIU) 주석서 H항목 "고액 거래 보고"(14번)에 대한 설명으로 가장 옳은 것은?',
  ['각국은 금융기관 및 DNFBP가 일정 금액 이상의 모든 국내/국제 현금거래를 보고하는 시스템의 실행가능성과 실용성을 고려해야 한다','고액 거래 보고 시스템의 도입 여부는 각국이 전혀 검토할 필요가 없는 사항이다','고액 거래 보고 대상은 국내 현금거래로 한정되며 국제 현금거래는 고려 대상이 아니다','고액 거래 보고 시스템은 DNFBP에는 적용되지 않고 금융기관에만 적용되는 것으로 한정된다'],0,
  '각국은 금융기관·DNFBP가 일정 금액 이상의 모든 국내·국제 현금거래를 보고하는 시스템의 실행가능성과 실용성을 고려해야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 30 주석서 30.2에 따른 "병행금융수사(parallel financial investigation)"에 대한 설명으로 가장 옳은 것은?',
  ['병행금융수사란 전통적 범죄수사와 병행하여 금융수사(범죄활동과 관련된 재무 조사로서 범죄 네트워크·범행 규모의 확인, 몰수대상 범죄수익의 확인 및 추적, 형사증거 확보 절차를 포함)를 수행하는 것을 말하며, 각국은 전제범죄 수사관이 이를 다른 수사와 병행하여 수행하거나 동 사건을 다른 기관에 회부할 수 있어야 한다','병행금융수사는 전통적 범죄수사가 완전히 종결되어 판결이 확정된 이후에만 비로소 별도로 착수할 수 있는 순수한 후속 절차에 불과한 것으로 이해해야 하며, 병행 수행이라는 개념 자체가 성립할 수 없다','병행금융수사는 형사증거의 확보와는 전혀 무관하며, 오로지 내부 통계 자료를 작성하기 위한 순수 행정적 목적으로만 수행되는 절차인 것으로 이해해야 하며 수사 실익은 없다','병행금융수사는 전제범죄를 수사하는 수사관이 아니라, 오직 별도로 지정된 회계 전문 공무원만이 독점적으로 담당할 수 있는 절차이며 다른 기관 회부는 허용되지 않는다'],0,
  '병행금융수사는 전통적 범죄수사와 병행하여 범죄 네트워크·범행 규모 확인, 몰수대상 범죄수익 확인·추적, 형사증거 확보 절차를 포함하는 금융수사예요. 전제범죄 수사관이 이를 병행 수행하거나 다른 기관에 회부할 수 있어야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 30 주석서 30.1에 따른 법집행당국 지정에 대한 설명으로 가장 옳은 것은?',
  ['각국은 자국의 AML/CFT 정책에 부합하는 범위 내에서 자금세탁, 전제범죄 및 테러자금조달범죄의 적절한 수사에 책임을 지는 법집행당국을 지정해야 한다','법집행당국의 지정은 각국의 AML/CFT 정책과는 무관하게 국제기구가 일괄적으로 지정하는 사항으로 이해해야 한다','자금세탁 수사에 대한 책임은 어떠한 국가기관도 지정할 필요가 없으며 민간 자율에 맡기면 충분한 것으로 이해해야 한다','전제범죄와 테러자금조달범죄에 대한 수사 책임은 자금세탁범죄 수사와는 완전히 분리된 별개의 무관한 절차로 이해해야 한다'],0,
  '각국은 자국의 AML/CFT 정책에 부합하는 범위에서 자금세탁·전제범죄·테러자금조달범죄의 적절한 수사에 책임을 지는 법집행당국을 지정해야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 30 주석서 30.3에 따른 권한당국의 자산 식별·추적 및 동결·압수 권한에 대한 설명으로 가장 옳은 것은?',
  ['각국은 몰수대상이거나 몰수대상이 될 수 있는 자산 또는 범죄수익이라는 사실이 의심되는 자산을 신속하게 식별·추적하고, 해당 재산에 대한 동결·압수 절차를 개시할 수 있는 하나 이상의 권한당국을 지정해야 한다','몰수대상 자산의 식별·추적 권한은 법원의 최종 유죄판결이 확정된 이후에만 비로소 행사할 수 있는 것으로 이해해야 한다','동결·압수 절차의 개시는 반드시 하나의 단일 기관만이 전담해야 하며 복수의 권한당국을 지정하는 것은 허용되지 않는 것으로 이해해야 한다','범죄수익으로 의심되는 자산이라 하더라도, 몰수대상으로 확정되기 전까지는 어떠한 식별·추적 조치도 취할 수 없는 것으로 이해해야 한다'],0,
  '각국은 몰수대상이거나 몰수대상이 될 수 있는 자산·범죄수익 의심 자산을 신속히 식별·추적하고 동결·압수 절차를 개시할 수 있는 하나 이상의 권한당국을 지정해야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 37(국제사법공조) 주석서 (d)항에 따른 비밀유지 관련 사법공조 거부 제한에 대한 설명으로 가장 옳은 것은?',
