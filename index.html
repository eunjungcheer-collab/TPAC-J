  '특정금융정보법 제12조의2는 금융정보분석원장이 특정금융거래정보(제5조의3·제9조·제13조·제15조 제7항에 따라 제공받거나 통보받은 정보 또는 자료)를 다른 법령에도 불구하고 대통령령으로 정하는 바에 따라 기간을 정하여 보존하도록 규정하고 있어요. 개인 재량이나 영구보존, 즉시폐기가 아니라 대통령령이 정하는 일정 기간 동안의 보존이 원칙이에요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 통보 유예 요청은 서면으로 이루어져야 하며, 반복 요청은 최대 2회로 한정된다(생명·신체 안전 위협 사유 제외).\nㄴ. 제10조에 따라 제공된 특정금융거래정보는 어떠한 재판에서도 예외 없이 증거로 사용될 수 있다.\nㄷ. STR 보고에 관여한 금융회사 종사자는 원칙적으로 증언을 거부할 수 있으나 중대한 공익상 필요가 있으면 거부할 수 없다.\nㄹ. 금융정보분석원장은 특정금융거래정보를 대통령령으로 정하는 바에 따라 기간을 정하여 보존해야 한다.',
  ['3개.','2개.','1개.','4개.'],0,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. 제10조에 따라 제공된 특정금융거래정보는 원칙적으로 재판에서 증거로 할 수 없어요. "예외 없이 증거로 사용될 수 있다"는 ㄴ의 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조의2(특정금융거래정보 등의 보존 및 폐기)에서 정보등의 폐기에 대한 설명으로 옳지 않은 것은?',
  ['이 법에 따른 목적을 달성하기 위하여 필요하다고 인정하여 대통령령으로 정하는 경우에는 보존기간이 경과하더라도 예외적으로 폐기하지 않을 수 있다.','금융정보분석원장은 제1항에 따른 보존기간이 경과한 때에는 「공공기록물 관리에 관한 법률」에서 정한 절차에 따라 그 정보등을 폐기하여야 한다.','금융정보분석원장은 정보등을 폐기하는 때에는 복구 또는 재생되지 아니하도록 조치하여야 한다.','정보등의 폐기 방법 및 절차는 각 금융정보분석원 직원이 개인적으로 임의로 정할 수 있다.'],3,
  '정보등의 폐기 방법 및 절차 등에 필요한 사항은 "대통령령"으로 정해요. "각 직원이 개인적으로 임의로 정할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제13조(자료 제공의 요청 등) 제1항에서 금융정보분석원장이 관계 행정기관등의 장에게 제공을 요청할 수 있는 자료에 해당하지 않는 것은?',
  ['「주민등록법」에 따른 주민등록전산정보자료.','타 금융회사가 보유한 고객의 예금 잔액 및 대출 금리 정보 전체.','「형의 실효 등에 관한 법률」에 따른 범죄경력자료 및 수사경력자료, 「국민건강보험법」에 따른 보험료 금액에 관한 자료.','「가족관계의 등록 등에 관한 법률」에 따른 등록전산정보자료.'],1,
  '제13조 제1항이 규정하는 자료는 가족관계등록 전산정보자료, 주민등록전산정보자료, 범죄경력·수사경력자료, 국민건강보험 보험료 금액 자료, 사업자 기본사항 등이며, "금융거래정보는 제외"된다고 명시되어 있어요. "타 금융회사가 보유한 고객의 예금 잔액 및 대출 금리 정보 전체"는 금융거래정보에 해당하여 이 조항의 자료 제공 요청 대상에서 제외돼요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제13조 제3항에 대한 설명으로 가장 옳은 것은?',
  ['이 조항은 외국환거래와 무관한 순수 국내 원화 거래 정보에 대해서도 별도의 요건 없이 동일하게 적용되므로, 국내 계좌 간 이체 내역도 제4조 제1항 요건 판단과 무관하게 상시 요구 대상이 된다.','금융정보분석원장은 제4조 제1항 요건 해당 여부와 관계없이 상시적으로 모든 금융회사에 외국환 관련 정보 제공을 요구할 수 있으며, 이는 별도의 문서 작성 절차 없이 구두 통보만으로 충분하다.','제13조 제3항에 따른 정보 제공 요구는 반드시 구두로만 이루어져야 하며, 문서에 의한 요구는 절차상 허용되지 않고 사후 서면 확인 절차도 요구되지 않는다.','금융정보분석원장은 특정금융거래정보를 분석할 때에 보고·제공받은 사항이 제4조 제1항의 요건에 해당한다고 판단하는 경우에만, 거래자의 인적사항·사용 목적·요구 자료의 내용을 적은 문서로 금융회사등의 장에게 외국환업무 관련 거래정보 등의 제공을 요구할 수 있다.'],3,
  '제13조 제3항은 금융정보분석원장이 제4조 제1항(STR) 요건에 해당한다고 "판단하는 경우에만" 거래자 인적사항·사용목적·요구내용을 적은 "문서"로 외국환업무 관련 정보 제공을 요구할 수 있도록 제한적으로 규정해요. 요건과 무관한 상시 요구, 구두 요구, 국내 거래에 대한 무조건 적용은 모두 원문과 배치돼요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제13조 제4항에 대한 설명으로 가장 옳은 것은?',
  ['제1항부터 제3항까지의 규정에 따른 정보 또는 자료 제공의 요청이나 요구는 필요한 최소한으로만 하여야 한다.','자료 제공 요청은 필요한 범위와 무관하게 최대한 광범위하게 이루어져야 한다.','이 조항은 자료 제공 요청의 범위에 대해 어떠한 제한도 두지 않는다.','자료 제공 요청의 최소성 원칙은 금융회사에게만 적용되고 행정기관에게는 적용되지 않는다.'],0,
  '제13조 제4항은 제1항부터 제3항까지의 정보·자료 제공 요청이나 요구가 "필요한 최소한"으로만 이루어지도록 명시하여, 정보 제공 요청의 범위를 제한하는 원칙(최소성 원칙)을 규정하고 있어요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 정보등의 폐기는 원칙적으로 보존기간 경과 시 공공기록물 관리에 관한 법률에서 정한 절차에 따라야 한다.\nㄴ. 제13조 제1항에 따라 요청 가능한 자료에는 금융거래정보가 포함되지 않는다.\nㄷ. 제13조 제3항의 외국환업무 관련 정보 요구는 구두로도 충분하며 문서 작성이 필요하지 않다.\nㄹ. 제13조 제4항은 자료 제공 요청이 필요한 최소한으로 이루어지도록 규정한다.',
  ['3개.','2개.','4개.','1개.'],0,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. 제13조 제3항의 외국환업무 관련 정보 요구는 STR 요건 해당 판단 시에만 문서로 이루어져야 해요. "구두로도 충분하다"는 ㄷ의 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '자금세탁방지 및 공중협박자금조달금지에 관한 업무규정 제4조(이사회의 역할 및 책임)에 대한 설명으로 옳지 않은 것은?',
  ['이사회의 역할과 책임에는 대표이사·준법감시인등에게 내부통제체계 구축·운영 실태와 보고 요구, 취약점 개선지시, 취약점 개선조치 사항에 대한 검토와 승인이 포함되지 않는다.','금융회사등은 자금세탁방지와 공중협박자금·대량살상무기확산자금조달금지(이하 "자금세탁방지등") 업무와 관련하여 이사회에 역할과 책임을 부여하여야 한다.','이사회의 역할과 책임에는 법 제5조 제1항 제2호에 따른 절차 및 업무지침(이하 "업무지침")의 제정·개정 및 폐지가 포함되어야 한다.','이사회의 역할과 책임에는 독립적 감사 결과 및 사후조치에 대한 검토와 승인이 포함되어야 한다.'],0,
  '업무규정 제4조 제2항 제3호는 이사회의 역할과 책임에 대표이사·금융회사의 지배구조법 등 법령에 따른 준법감시인등에게 내부통제체계(계열회사·자회사 포함) 구축·운영 실태와 보고를 요구하고, 취약점에 대한 개선지시, 취약점 개선조치 사항에 대한 검토와 승인을 "포함"시키고 있어요. "포함되지 않는다"는 서술은 원문과 정반대예요.','ultra'),
M('jd2_7b',
  '업무규정 제5조(대표이사의 역할 및 책임)에서 대표이사에게 부여되는 역할과 책임에 해당하지 않는 것은?',
  ['자금세탁방지등을 위한 내부통제체계의 총괄적 구축·운영.','업무지침 제정·개정·폐지 승인(법규 개정에 따른 용어변경, 자구수정 등 업무지침 내용의 실질적인 변화를 수반하지 않는 개정의 경우에는 대표이사가 이를 승인할 수 있다) 및 세부 업무지침 승인.','금융회사의 연간 배당 정책 및 주주총회 안건 상정 여부에 대한 최종 결정.','전문인력 배치 등 지원조직 구성 및 유지, 보고책임자 등에게 보고받은 내부통제체계의 취약점 개선 및 개선조치 사항의 이사회 보고.'],2,
  '업무규정 제5조가 규정하는 대표이사의 역할과 책임은 내부통제체계 총괄 구축·운영, 업무지침 제정·개정·폐지 승인, 전문인력 배치 등 지원조직 구성·유지, 취약점 개선사항의 이사회 보고, 보고책임자 자격요건 관련 기준 등이에요. "연간 배당 정책 및 주주총회 안건 상정 여부에 대한 최종 결정"은 이 조항이 규정하는 자금세탁방지 관련 역할·책임이 아니에요.','ultra'),
M('jd2_7b',
  '업무규정 제5조 제2항 제5호에서 규정하는 준법감시인등의 자격요건에 대한 설명으로 옳지 않은 것은?',
  ['변호사 또는 공인회계사 자격을 가진 사람으로서 2년 이상 자금세탁방지등 관련 분야 업무를 수행한 경력이 있는 사람도 자격요건을 충족할 수 있다.','준법감시인등의 자격요건 중 실무경력으로 인정되는 기간은 업권이나 소속기관과 관계없이 동일하게 5년 이상이어야 한다','자금세탁방지등 관련 분야의 석사학위 이상 학위 소지자로서 2년 이상 자금세탁방지등 관련 분야 업무를 수행한 경력이 있는 사람도 자격요건을 충족할 수 있다.','법 제2조 제1호의 금융사 또는 금융사지배구조법 시행령 제21조 제2항 제2호 가목부터 바목까지의 기관에서 2년 이상 자금세탁방지등 관련 분야 업무를 수행한 경력이 있는 사람은 자격요건을 충족할 수 있다.'],1,
  '업무규정 제5조 제2항 제5호에 따르면 실무경력 인정 기간은 소속 기관 유형에 따라 2년 이상 등으로 다르게 규정돼요. "업권·소속기관과 관계없이 예외 없이 5년 이상이어야 한다"는 서술은 기간과 적용방식이 잘못되어 옳지 않아요.','ultra'),
M('jd2_7b',
  '업무규정상 준법감시인등의 자격요건 중 경력 인정 방식에 대한 설명으로 가장 옳은 것은?',
  ['자금세탁방지등을 주된 업무로 하지 않은 경력이라도, 소속 기관의 규모나 업무 특성과 무관하게 항상 전체 기간을 100% 그대로 인정하는 것으로 업무규정이 정하고 있다','월 단위로 경력을 계산할 때, 15일 미만의 짧은 기간이라 하더라도 예외 없이 반드시 1개월로 산입하여 계산해야 하는 것으로 업무규정이 정하고 있다','경력 인정 방식에 관한 구체적인 규정은 존재하지 않으며, 각 금융회사가 완전히 임의로 자율적인 기준을 정해 적용할 수 있는 것으로 이해해야 한다','금융사지배구조법 시행령 제21조 제2항 제2호 가목부터 바목까지의 기관에서 자금세탁방지등을 주된 업무로 하지 않은 경우 경력의 절반만 인정하고, 월 단위 15일 이상은 1월로 하며 15일 미만은 계산하지 아니한다.'],3,
  '금융사지배구조법 시행령 제21조 제2항 제2호 가목부터 바목까지의 기관에서 자금세탁방지등을 주된 업무로 하지 않은 경우 경력의 절반만 인정하고, 월 단위 계산 시 15일 미만은 산입하지 않아요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 업무규정 제4조는 이사회의 역할과 책임으로 업무지침 제정·개정·폐지, 독립적 감사결과 검토·승인, 내부통제체계 취약점 개선 검토·승인을 규정한다.\nㄴ. 업무규정 제5조는 대표이사에게 내부통제체계의 총괄적 구축·운영 책임을 부여한다.\nㄷ. 준법감시인등 자격요건에는 관련 분야 석사 이상 학위 소지 경력자, 변호사·공인회계사 자격 소지 경력자가 포함된다.\nㄹ. 자금세탁방지등을 주된 업무로 하지 않은 경력은 3분의 2만 인정된다.',
  ['3개.','2개.','4개.','1개.'],0,
  'ㄱ, ㄴ, ㄷ은 옳은 설명이에요. 자금세탁방지등을 주된 업무로 하지 않은 경력은 3분의 2가 아니라 절반만 인정돼요(ㄹ).','ultra'),
M('jd1_3',
  '2008년 서울에서 개최된 Egmont Group 총회에 대한 설명으로 가장 옳은 것은?',
  ['2008년 서울 총회는 국제기구 관계자의 참여 없이, 오로지 각국 FIU 대표들만 비공개로 참석하여 진행된 소규모 실무 회의였던 것으로 이해해야 한다','2008년 서울 총회에는 10개국 미만의 소수 FIU 관계자만 참석하여, 국제적 주목을 받지 못한 소규모 행사에 그쳤던 것으로 이해해야 한다','2008년 서울 총회는 에그몬트 그룹이 1995년 창설된 이래 최초로 개최한 첫 번째 총회로서, 그룹의 역사상 상징적인 의미를 갖는 것으로 이해해야 한다','동 총회에는 90개국 FIU 관계자 및 UNODC, 세계은행(World Bank) 등 12개 국제기구 관계자 250여 명이 참석하여 자금세탁·테러자금조달 방지를 위한 전 세계 FIU 간 협력 강화 방안을 논의하였다.'],3,
  '2008년 서울 총회에는 90개국 FIU 관계자 및 UNODC, 세계은행 등 12개 국제기구 관계자 250여 명이 참석하여 자금세탁·테러자금조달 방지를 위한 국제협력을 논의했어요. 에그몬트 그룹의 첫 총회가 아니라 아시아 최초 개최라는 점에서 의미가 있어요.','ultra'),
M('jd1_4',
  '유럽연합 제3차 지침(AMLD 3)의 강화된 고객확인의무(EDD) 수행 시, 비대면 고객에 대한 조치로 가장 옳은 것은?',
  ['비대면고객에 대해서는 어떠한 추가 확인 조치도 요구되지 않는다.','비대면고객에 대한 첫 번째 자금이체는 반드시 현금으로만 이루어져야 한다.','비대면고객에 대해서는 기존문서의 확인 및 고객 신원확인이 추가로 문서화되어 있는지 여부와, 믿을 만한 금융기관을 통해 고객 명의의 계좌로 첫 번째 자금이체를 실시해야 한다.','비대면고객은 대면고객보다 오히려 더 간소화된 절차를 적용받는다.'],2,
  '제3차 지침상 강화된 고객확인의무 이행 시, 비대면고객에 대해서는 기존문서 확인 및 고객 신원확인의 추가 문서화 여부를 확인하고, 믿을 만한 금융기관을 통해 고객 명의의 계좌로 첫 번째 자금이체를 실시하도록 요구해요.','ultra'),
M('jd1_4',
  '유럽연합 제3차 지침(AMLD 3)의 익명계좌(Anonymous account)에 대한 규정으로 가장 옳은 것은?',
  ['익명계좌는 프라이빗 뱅킹 고객에 한해 예외적으로 허용된다.','익명계좌 유지와 통장보관을 금지하며, 기존의 익명계좌 소유자 및 수익자에 대해 고객확인을 실시한다.','기존에 개설된 익명계좌는 소급하여 고객확인을 실시할 필요가 없다.','익명계좌에 대한 규정은 제3차 지침이 아니라 제5차 지침에서 처음 도입되었다.'],1,
  '제3차 지침은 익명계좌의 유지와 통장보관을 금지하며, 기존의 익명계좌 소유자 및 수익자에 대해서도 고객확인을 실시하도록 규정하고 있어요.','ultra'),
M('jd1_4',
  '유럽연합 제3차 지침(AMLD 3)의 기록보관(Record Keeping) 규정에 대한 설명으로 가장 옳은 것은?',
  ['기록보관 의무는 FIU나 감독기관의 문의 대응과는 무관하다.','기록보관은 오직 서면 문서로만 이루어져야 하며 전자 시스템은 허용되지 않는다.','기록보관 기간은 거래 종료 후 1년으로 제한된다.','거래 종료 후 5년 동안 필요한 증거의 사본이 참고자료를 모두 보관하고, 금융정보분석원(FIU)이나 감독기관 등 관련기관 문의에 신속히 대응하는 시스템 구축 등을 해야 한다.'],3,
  '제3차 지침은 거래 종료 후 5년 동안 필요한 증거의 사본과 참고자료를 모두 보관하고, FIU나 감독기관 등 관련기관의 문의에 신속히 대응할 수 있는 시스템을 구축하도록 요구해요.','ultra'),
M('jd1_4',
  '유럽연합 제3차 지침(AMLD 3)의 정치적 주요인물(PEPs)에 대한 조치로 가장 옳은 것은?',
  ['정치적 주요인물에 대한 모니터링은 최초 거래 시점에만 이루어지면 충분하며 이후에는 불필요하다.','정치적 주요인물에 대해서는 경영진의 승인과 자금에 대한 출처 확인, 비즈니스에 대한 모니터링을 강화해야 한다.','정치적 주요인물에 대한 조치는 제4차 지침에서 처음 도입되었으며 제3차 지침에는 규정이 없다.','정치적 주요인물에 대해서는 일반 고객과 동일한 수준의 확인만 하면 충분하다.'],1,
  '제3차 지침은 정치적 주요인물(PEPs)에 대해 경영진의 승인, 자금 출처 확인, 비즈니스에 대한 모니터링 강화를 요구해요.','ultra'),
M('jd1_4',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 제3차 지침(AMLD 3)은 익명계좌의 유지와 통장보관을 금지한다.\nㄴ. 제3차 지침은 비대면고객에 대해 믿을 만한 금융기관을 통한 첫 번째 자금이체를 요구할 수 있다.\nㄷ. 제3차 지침상 기록보관 기간은 거래 종료 후 5년이다.\nㄹ. 제3차 지침은 PEP에 대해 경영진 승인과 자금출처 확인, 모니터링 강화를 요구한다.',
  ['4개.','3개.','2개.','1개.'],0,
  'ㄱ~ㄹ 모두 옳은 설명이에요. 제3차 지침의 익명계좌 금지, 비대면고객 첫 이체 요건, 기록보관 기간(5년), PEP 요건을 정확히 이해해야 풀리는 종합형 문제예요.','ultra'),
M('jd2_6',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 D는 특정 고객의 거래가 금융실명법상 차명거래 금지 규정 위반이 의심되어, 이를 특정금융정보법 제5조의2 제2항에 따라 관할 수사기관에 신고하지 않고 내부적으로만 종결하였다.',
  ['이 사례는 특정금융정보법상 STR 보고제도와는 무관하게, 오로지 해당 금융회사 내부의 인사 징계 절차만으로 종결하면 충분한 순수 내부 인사 문제에 불과한 것으로 이해해야 한다','의심되는 차명거래를 관할 수사기관에 신고하지 않고 내부적으로만 종결하더라도, 신고의무 위반과 관련된 어떠한 법적 문제도 발생하지 않는 것으로 이해해야 한다','차명거래는 금융실명법이 아니라 특정금융정보법에서만 규율하는 사항이므로, 이 사례는 금융실명법과는 애초에 무관한 것으로 이해해야 한다','이는 국내 AML/CFT 법률체계상 ML/TF 보고제도(범죄수익은닉규제법 제5조 등)의 신고의무를 위반한 것으로 볼 수 있으며, 금융회사등의 종사자가 관련 신고의무를 이행하지 않은 데 따른 문제가 발생할 수 있다.'],3,
  '이 사례는 국내 AML/CFT 법률체계상 ML/TF 보고제도(범죄수익은닉규제법 제5조 등)의 신고의무를 위반한 것으로 볼 수 있으며, 금융회사등의 종사자가 관련 신고의무를 이행하지 않은 데 따른 문제가 발생할 수 있어요. 내부적으로만 종결하는 것은 신고의무 위반에 해당할 수 있어요.','ultra'),
M('jd2_6',
  '국내 AML/CFT 법률체계에서 "보고제도"와 "처벌제도"를 구분하는 실익에 대한 설명으로 가장 옳은 것은?',
  ['보고제도(금융실명법·특정금융정보법)는 CDD·STR·CTR 등 사전적·예방적 의무를 규율하고, 처벌제도(범죄수익은닉규제법 등)는 형사처벌·몰수·추징 등 사후적 제재를 규율한다','보고제도는 형사처벌과 몰수·추징을 규정하고, 처벌제도는 오히려 CDD·STR·CTR과 같은 사전적·예방적 의무를 규정하여 두 제도의 기능이 서로 뒤바뀌어 있다','국내 AML/CFT 법률체계는 사전적·예방적 의무를 규율하는 보고제도만으로 구성되어 있으며, 사후적 형사처벌을 규율하는 별도의 처벌제도는 존재하지 않는다','보고제도와 처벌제도는 하나의 단일 법률(특정금융정보법)에 의해서만 규율되므로, 두 제도를 별도의 법률체계로 구분하는 것은 실익이 없는 이론적 구분에 불과하다'],0,
  '보고제도(금융실명법·특정금융정보법)는 CDD·STR·CTR 등 사전적·예방적 의무를, 처벌제도(범죄수익은닉규제법 등)는 형사처벌·몰수·추징 등 사후적 제재를 각각 규율해요. 기능이 뒤바뀌었다거나, 보고제도만 존재한다거나, 단일 법률로만 규율된다는 서술은 모두 옳지 않아요.','ultra'),
M('jd1_1',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 범죄조직 E는 마약 밀매로 얻은 자금을 국내 은행에 소액으로 분산 입금한 후(1단계), 이를 다시 여러 해외 계좌로 이체하여 거래 흐름을 복잡하게 만들었다(2단계). 이후 위장회사를 설립하여 부동산을 매입함으로써 최종적으로 자금을 합법화하였다(3단계). 이 과정에서 조직원들은 서로 다른 국가의 금융기관을 이용하였다.',
  ['이 사례는 범죄조직 E가 개인이 아니라 여러 조직원과 함께 진행한 것이지만, 자금세탁이 성립하기 위한 조직범죄성 요건과는 무관한 것으로 이해해야 한다','이 사례에서 자금의 예치·배치가 국내에서 이루어졌다는 사실만으로, 이후 자금이 해외로 이동하는 단계가 있더라도 국제범죄성과는 무관한 순수 국내 사건으로 이해해야 한다','이 사례는 자금세탁의 국제범죄성(2개 이상 국가에 걸친 활동), 조직범죄성(범죄조직에 의한 진행), 그리고 3단계(예치·배치, 은폐·반복, 합법화·통합)의 특성을 모두 보여주는 전형적인 자금세탁 사례이다.','이 사례는 자금의 출처나 흐름과 무관하게, 단순히 물건을 훔친 절도 사건에 불과하여 자금세탁의 어떠한 특성과도 관련이 없는 것으로 이해해야 한다'],2,
  '이 사례는 자금세탁의 국제범죄성(2개 이상 국가에 걸친 활동), 조직범죄성(범죄조직에 의한 진행), 그리고 3단계(예치·배치, 은폐·반복, 합법화·통합)의 특성을 모두 보여주는 전형적인 자금세탁 사례예요.','ultra'),
M('jd2_9',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 수출업체 F사는 실제 국제 시세보다 현저히 낮은 가격으로 상품을 수출 신고하였으나, 실제 대금은 시세에 맞게 별도의 경로로 수취하였다. 세관은 이러한 화물 신고 내역의 이상을 포착하여 FIU에 통보하였다.',
  ['세관은 화물 신고 내역의 이상을 인지하더라도 FIU에 이를 통보할 법적 권한이나 실무 관행이 전혀 존재하지 않는 것으로 이해해야 한다','이는 TBML의 전형적 수법인 물품의 과소 송장청구(under-invoicing)에 해당할 수 있으며, 세관과 FIU 간의 협력을 통해 TBML 의심 활동을 확인하는 사례에 해당한다.','이 사례는 오로지 국내법상 순수한 관세 문제일 뿐이며, 자금세탁방지제도와는 어떠한 관련성도 갖지 않는 것으로 이해해야 한다','과소 송장청구(under-invoicing)는 TBML과는 무관한, 국제 무역 실무상 흔히 이루어지는 정상적인 가격 협상 관행에 불과한 것으로 이해해야 한다'],1,
  '이는 TBML의 전형적 수법인 과소 송장청구(under-invoicing)에 해당할 수 있으며, 세관과 FIU 간의 협력을 통해 TBML 의심 활동을 확인·대응할 수 있어요.','ultra'),
M('jd2_10',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 국내 가상자산사업자 G사는 해외 VASP H사로부터 100만원 상당의 가상자산 이전 요청을 받았다. G사는 자금이동규칙(Travel Rule)에 따라 필요한 송금인·수취인 정보를 확인하려 하였으나, H사가 정확한 수취인 정보를 제공하지 않았다.',
  ['자금이동규칙(Travel Rule)은 국내 VASP 간 거래에만 적용될 뿐이며, 해외 VASP와의 국경 간 거래에는 애초에 적용되지 않는 것으로 이해해야 한다','G사는 상대방인 H사가 정확한 송금인·수취인 정보를 제공하는지 여부와 무관하게, 요청받은 거래를 그대로 진행하기만 하면 되는 것으로 이해해야 한다','가상자산 이전 금액이 100만원이라는 이유로, 이 거래는 자금이동규칙이 정하는 적용 대상 기준금액에 미달해 규칙 적용 대상이 아닌 것으로 이해해야 한다','G사는 정확한 송금인 요구정보와 수취인 요구정보의 획득·보관 및 제공 여부를 확인해야 할 의무가 있으며, H사가 정확한 정보를 제공하지 않는 경우 이는 자금이동규칙 준수의 문제로 이어질 수 있다.'],3,
  'G사는 정확한 송금인 요구정보와 수취인 요구정보의 획득·보관 및 제공 여부를 확인해야 할 의무가 있으며, H사가 정확한 정보를 제공하지 않는 경우 이는 자금이동규칙 위반 문제로 이어질 수 있어요.','ultra'),
M('jd1_5',
  '미국의 저축금융기관(Thrifts)에 대한 감독 체계에 대한 설명으로 옳지 않은 것은?',
  ['예금보험 가입이 의무일 경우, 연방예금보험공사(FDIC)의 감독을 함께 받는다.','미국 저축금융기관에 대한 감독은 "월스트리트 개혁과 금융소비자보호법인 도드-프랭크법(Dodd-Frank Act)"에 근거하여 연방준비제도이사회(FRB), 통화감독청(OCC) 및 연방예금보험공사(FDIC)의 검사를 받는다.','주정부로부터 영업허가를 받은 저축금융기관은 연방 차원의 감독 대상에서 완전히 제외되며, 오직 주정부 금융당국의 감독만 받는다','주정부로부터 영업허가를 받는 저축금융기관은 주(州)정부 금융당국으로부터도 함께 감독을 받는다.'],2,
  '주정부 인가 저축금융기관도 예금보험 가입 시 FDIC 등 연방 차원의 감독과 함께 주정부 금융당국의 감독을 함께 받아요. "연방 차원의 감독 대상에서 완전히 제외되며 주정부 감독만 받는다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '미국 보험회사에 대한 감독 체계에 대한 설명으로 가장 옳은 것은?',
  ['보험회사는 연방예금보험공사(FDIC)가 아니라 오히려 연방준비제도(FRS)의 배타적이고 직접적인 감독을 받도록 법령상 정해져 있는 것으로 이해해야 한다','은행에 대한 감독기능이 연방정부와 주(州)정부로 적절히 나누어 있는 것과 달리, 보험회사는 전적으로 주정부의 감독 관할에 있으며, 이는 대법원의 판례가 보험업의 감독업무를 주정부 영역이라고 못박고 있기 때문이다.','연방보험청(FIO)은 보험업에 대한 직접적인 인허가 권한을 가지며, 주정부의 보험 감독 권한을 사실상 대체하는 기관으로 운영되고 있는 것으로 이해해야 한다','보험회사는 은행과 마찬가지로 연방정부가 전적으로 감독하며, 주정부는 보험 감독과 관련해 어떠한 역할도 수행하지 않는 것으로 이해해야 한다'],1,
  '미국은 은행에 대한 감독기능이 연방정부와 주정부로 나뉘어 있는 것과 달리, 보험회사는 전적으로 주정부의 감독 관할에 있어요. 이는 대법원 판례가 보험업의 규제를 주정부 권한으로 인정해 온 데 따른 것이에요.','ultra'),
M('jd1_5',
  '전국신용조합관리국(NCUA, National Credit Union Administration)에 대한 설명으로 옳지 않은 것은?',
  ['1934년 연방신용조합법(Federal Credit Union Act of 1934)에 따라 연방신용조합국(Bureau of Federal Credit Unions)을 설립하여 신용조합에 대한 연방 면허 및 규제감독을 담당하였다.','미국 의회는 1970년에 신용조합법을 개정하여 미국의 독립적 연방기관인 전국신용조합관리국(NCUA)을 설립하였다.','NCUA는 국법 신용조합의 인가와 검사를 담당하고 있으며, 주(州)감독당국과의 협의를 통하여 연방보험가입 및 주법 신용조합의 검사도 함께 하고 있다.','NCUA는 신용조합에 대한 예금보험 관련 업무를 수행하지 않으며, 이는 연방예금보험공사(FDIC)가 전담하는 업무이다'],3,
  'NCUA는 국가신용조합주식보험기금(NCUSIF)을 직접 운영하며 신용조합 예금보험 관련 기능을 수행해요. "예금보험 업무를 전혀 수행하지 않으며 FDIC가 전담한다"는 서술은 옳지 않아요(신용조합 예금보험은 FDIC가 아니라 NCUA·NCUSIF의 소관이에요).','ultra'),
M('jd1_5',
  '미국 재무부(Department of Treasury)의 역할에 대한 설명으로 옳지 않은 것은?',
  ['재무부는 주화와 통화의 생산, 미국 국민들에 대한 균비지출, 국세 징수, 정부재정 및 공공부채 관리, 국법은행 및 저축기관 감독 등의 업무를 수행한다.','미국 재무부는 평화발전과 미국의 금융안보를 담당하는 정부부처로, 경제·금융 문제에 대한 대통령 자문, 지속 가능한 경제성장 촉진, 금융기관의 관리 등 다양한 업무를 하고 있다.','재무부는 국내·국제금융, 경제, 무역 및 조세정책에 대한 자문 기능도 수행한다.','미국 재무부는 주화·통화 생산 및 국세 징수 업무만을 담당할 뿐, 경제·금융 정책에 대한 대통령 자문이나 국법은행 감독 업무와는 무관하다'],3,
  '미국 재무부는 주화·통화 생산, 국세 징수 외에도 정부재정 관리, 국법은행 감독, 경제·금융 정책에 대한 대통령 자문 등 폭넓은 업무를 수행해요. "국세 징수 업무만 담당할 뿐 대통령 자문이나 은행 감독과는 무관하다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 저축금융기관은 도드-프랭크법에 근거해 FRB, OCC, FDIC의 검사를 받는다.\nㄴ. 보험회사는 대법원 판례에 따라 전적으로 주정부의 감독 관할에 있다.\nㄷ. NCUA는 1980년 신용조합법 개정으로 설립된 독립적 연방기관이다.\nㄹ. 미국 재무부는 경제·금융 정책 자문, 조폐, 국세 징수, 국법은행 감독 등 다양한 업무를 수행한다.',
  ['1개.','4개.','3개.','2개.'],2,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. NCUA는 1980년이 아니라 1970년 신용조합법 개정으로 설립된 독립적 연방기관이에요(ㄷ).','ultra'),
M('jd1_5',
  '유럽은행감독청(EBA, European Banking Authority)에 대한 설명으로 옳지 않은 것은?',
  ['EBA는 2011년 1월 1일, 유럽금융감독체계(ESFS)의 일환으로 설립되었으며 기존의 유럽은행감독당국위원회(CEBS)의 모든 책임과 임무를 부여받았다.','EBA가 발행하는 모든 문서는 가이드라인과 동일하게 권고적 성격만 가지며, 회원국에 대해 어떠한 법적 구속력도 가지지 않는다.','EBA의 주요 임무는 구속력 있는 기술 표준서(Binding Technical Standard, BTS)와 가이드라인 등을 통해 은행에서 EU 단일규정집(European Single Rulebook) 수립에 기여하는 것이다.','EBA는 정기적인 위험평가보고서와 EU 스트레스 테스트를 통해 EU 은행 부문의 위험과 취약성을 평가하도록 의무화하고 있다.'],1,
  'EBA가 발행하는 문서 중 구속력 있는 기술표준서(BTS)는 가이드라인이나 권고와 달리 "법적 구속력이 있으며 EU의 모든 회원국에 직접 적용"돼요. "모든 문서가 권고적 성격만 가지며 법적 구속력이 없다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '유럽은행감독청(EBA)의 역할에 해당하지 않는 것은?',
  ['유럽의회, 협의회 또는 위원회에 대한 독립적 자문, EU의 소비자 금융상품 또는 서비스 시장에서 투명성, 단순성 및 공정성 촉진.','비상상황에서 개별 권한당국 또는 금융기관에 대한 결정, 국경 간 상황에서 권한당국 간의 의견불일치에 대한 중재.','국가별 감독당국에 의한 EU 법률의 부적용이나 불충분한 적용에 대한 조사.','EU 회원국의 국방 예산을 직접 편성하고 승인하는 것.'],3,
  'EBA의 역할은 EU 법률의 부적용·불충분 적용 조사, 비상상황·의견불일치 시 결정·중재, 유럽 기구에 대한 자문, 금융상품·서비스 시장의 투명성·단순성·공정성 촉진 등이에요. "EU 회원국의 국방 예산 편성·승인"은 EBA의 역할과 전혀 무관해요.','ultra'),
M('jd1_5',
  'EBA의 AML/CFT 분야 기능에 대한 설명으로 옳은 것은?',
  ['EBA는 AML/CFT 분야에서 회원국 감독당국 간 정보 공유를 오히려 제한하는 방향으로 기능하며, 개별 회원국의 독자적인 감독 권한을 강화하는 역할만을 수행한다','EBA는 EU 전역에서의 AML/CFT 당국과의 협력을 촉진하고 장려하며, AML/CFT를 위해 ESMA 및 EIOPA와 공동위원회를 구성하여 권한당국과 신용 및 금융기관과의 긴밀한 협력을 통한 위험기반접근방식(Risk Based Approach)의 적용방법에 대한 개방된 공동의 이해를 촉진한다.','EBA는 ESMA·EIOPA와 공동위원회를 구성할 법적 권한이 없어, AML/CFT 관련 사안에서도 항상 단독으로만 활동하도록 제한적으로 설계되어 있는 것으로 이해해야 한다','EBA의 AML/CFT 관련 기능은 은행 부문에만 엄격히 한정되며, 신용기관이나 다른 금융기관과의 협력 촉진 업무는 EBA의 소관 범위에서 제외되어 있는 것으로 이해해야 한다'],1,
  'EBA는 EU 전역에서의 AML/CFT 당국 간 협력을 촉진하고 장려하며, AML/CFT를 위해 ESMA·EIOPA와 공동위원회를 구성해 권한당국과 협력해요. 정보 공유 제한이나 단독 활동, 은행 부문 한정이라는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  'EBA가 ESMA, EIOPA와 공동위원회를 구성하여 수행하는 업무에 대한 설명으로 가장 옳은 것은?',
  ['공동위원회는 AML/CFT와는 무관하게 오로지 은행 부문의 이자율 결정만을 다루는 것으로 한정되어 있는 것으로 이해해야 한다','AML/CFT를 위해 ESMA 및 EIOPA와 공동위원회를 구성하여 지침(EU) 2015/849 및 규정(EU) 2015/847을 관련 회원국에 위임사항으로 전달하고 관련 표준 수립 등에도 참여한다.','공동위원회는 AML/CFT와는 전혀 무관한, 소비자 불만 처리 업무만을 전담하는 것으로 이해해야 한다','EBA, ESMA, EIOPA는 서로 완전히 독립적으로만 운영되며, 이 세 기관이 함께 공동위원회를 구성하는 일은 전혀 없는 것으로 이해해야 한다'],1,
  'EBA는 AML/CFT를 위해 ESMA 및 EIOPA와 공동위원회를 구성해 지침(EU) 2015/849 및 규정(EU) 2015/847 등 관련 위임사항을 회원국에 전달하고 표준 수립에 참여해요.','ultra'),
M('jd1_5',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. EBA는 2011년 1월 1일 ESFS의 일환으로 설립되어 CEBS의 책임과 임무를 승계하였다.\nㄴ. EBA의 구속력 있는 기술표준서(BTS)는 EU의 모든 회원국에 직접 적용되는 법적 구속력을 가진다.\nㄷ. EBA는 정기적 위험평가보고서와 EU 스트레스 테스트를 통해 EU 은행 부문의 위험을 평가한다.\nㄹ. EBA는 ESMA·EIOPA와 공동위원회를 구성하여 AML/CFT 관련 지침·규정의 위임사항 전달 및 표준 수립에 참여한다.',
  ['3개.','4개.','2개.','1개.'],1,
  'ㄱ~ㄹ 모두 옳은 설명이에요. EBA의 설립 연혁, BTS의 법적 구속력, 위험평가보고서·스트레스테스트 역할, ESMA·EIOPA와의 공동위원회 구성을 정확히 이해해야 풀리는 문제예요.','ultra'),
M('jd1_5',
  '영국의 국가범죄수사청(NCA, National Crime Agency)에 대한 설명으로 옳지 않은 것은?',
  ['영국 금융정보분석원(UK Financial Intelligence Unit, UKFIU) 및 일부 법집행기관의 기능을 포함하는 국가범죄수사청(NCA)은 AML/CFT 업무를 수행하고 있다.','NCA의 주요업무에는 자금세탁혐의자에 대한 기소와 유죄판결 확보 등 법 집행 및 수사, 범죄자산에 대한 자산 회수 및 압수가 포함된다.','NCA는 SARs(Suspicious Activity Reports) 시스템을 통한 자금세탁이 의심되는 활동에 대한 신고 접수 및 관리 업무도 수행한다.','NCA는 오직 국내 업무만을 수행하며 Europol, Interpol 등 국제적인 수사기관과의 협력 업무는 수행하지 않는다.'],3,
  'NCA의 주요업무에는 "국제적인 자금세탁방지를 위해 다른 국가의 수사기관(Europol, Interpol 등) 및 금융정보분석원(FIU)과 협력"하는 것이 포함되어 있어요. "오직 국내 업무만을 수행"한다는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '영국 금융정보분석원(UKFIU)에 대한 설명으로 가장 옳은 것은?',
  ['UKFIU는 국가범죄수사청(NCA)과는 완전히 무관한 별개의 독립 정부부처로 설치되어 있어, NCA의 조직 체계와는 어떠한 소속 관계도 갖지 않는 것으로 알려져 있다','UKFIU는 각국 FIU 간 정보교류와 국제협력을 목적으로 설립된 에그몬트 그룹(Egmont Group)의 정식 회원 자격을 갖추고 있지 않은 것으로 알려져 있다','국가범죄수사청(NCA) 산하의 영국 금융정보분석원(UKFIU)은 FIU의 독립적인 역할을 유지하며, 영국 내에서 자금세탁방지 및 테러자금조달방지(AML/CFT)와 관련된 금융정보 분석을 전담하고, 의심거래보고(SARs)를 관리하는 핵심 기관이다.','UKFIU는 금융기관들이 의심거래보고서(SARs)를 작성하고 제출하는 과정에서 참고할 수 있는 지침이나 가이드라인을 전혀 제공하지 않는 것으로 알려져 있다'],2,
  'NCA 산하의 UKFIU는 FIU로서의 독립적 역할을 유지하며 영국 내 AML/CFT 관련 금융정보 분석을 전담하고 SARs를 관리하는 핵심 기관이에요. 또한 영국 금융정보분석원은 금융기관 및 보고의무가 있는 기타 조직에도 SARs 작성·제출 지침을 제공하고, 에그몬트 그룹의 회원으로 전 세계 FIU와 협력해요.','ultra'),
M('jd1_5',
  '합동자금세탁운영그룹(JMLSG, Joint Money Laundering Steering Group)에 대한 설명으로 옳지 않은 것은?',
  ['JMLSG는 금융서비스업 관련 업무를 위하여 영국무역협회 내에 구성하여 운영하고 있으며, AML/CFT 우수사례 공표와 영국의 자금세탁(Money Laundering) 규정 마련 및 실무 해석에 도움을 주고 있다.','JMLSG는 정부기관으로서 법적 강제력을 가진 형사처벌을 직접 부과할 수 있는 권한을 가진다.','JMLSG는 1990년부터 영국은행과 연계하여 금융부문에 대한 자금세탁방지 지침을 제정하고, 정기적으로 AML/CFT 관련 지침을 갱신하여 제공하고 있다.','JMLSG의 이사회는 금융산업 관련 15개 유관단체의 전문가로 구성되어 있다.'],1,
  'JMLSG는 정부기관이 아니라 금융서비스업 관련 업무를 위해 영국무역협회 내에 구성된 조직으로, AML/CFT 우수사례 공표와 자금세탁 규정 마련·실무 해석에 도움을 주는 역할을 해요. "정부기관으로서 형사처벌을 직접 부과할 수 있는 권한을 가진다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. NCA는 UKFIU와 일부 법집행기관의 기능을 포함하여 AML/CFT 업무를 수행한다.\nㄴ. UKFIU는 SARs 관리의 핵심 기관이며 에그몬트 그룹 회원이다.\nㄷ. JMLSG는 영국 금융감독청(FCA) 내부 조직으로 구성되어 AML/CFT 우수사례 공표 등을 담당한다.\nㄹ. JMLSG 이사회는 금융산업 관련 15개 유관단체 전문가로 구성된다.',
  ['3개.','2개.','1개.','4개.'],0,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. JMLSG는 FCA 내부 조직이 아니라 금융산업 관련 유관단체들이 구성한 민간 자율기구예요(ㄷ은 소속이 잘못되어 옳지 않아요).','ultra'),
M('jd1_1',
  '<보기>는 국제자금세탁방지기구(FATF)의 자금세탁 및 테러자금조달 정의를 정리한 것이다. 옳지 않은 것은?',
  ['자금세탁이란 "범죄수익의 불법원천을 가장하기 위한 과정(the process of criminal proceeds in order to disguise illegal origin)"을 말한다.','이 두 정의는 FATF의 핵심 개념 정리에 해당하는 것으로, AML(자금세탁방지)과 CFT(테러자금조달방지)가 서로 구분되는 근거가 된다.','자금세탁과 테러자금조달은 완전히 동일한 개념으로, FATF는 이 둘을 구분하여 정의하지 않는다.','테러자금조달이란 "테러자금조달은 테러행위, 테러리스트 및 테러조직에 자금을 조달하는 것(Terrorist financing is the financing of terrorist acts, and of terrorists and terrorist organisations.)"이라고 말한다.'],2,
  'FATF는 자금세탁(범죄수익의 불법원천을 가장하기 위한 과정)과 테러자금조달(테러행위·테러리스트·테러조직에 대한 자금조달)을 "서로 구분하여" 정의하고 있어요. "완전히 동일한 개념으로 구분하지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  '<보기>는 AML/CFT 관련 주요 국제조약 및 국제성명을 정리한 것이다. 옳지 않은 것은?',
  ['메리다협약(2003년): 국제테러에 대한 경제적인 대응조치를 규정한 협약이다.','비엔나협약(1988년): "마약 및 향정신성 물질의 불법거래방지"에 관한 UN협약으로 마약거래와 관련된 자금세탁행위만을 범죄로 규정하였다.','바젤위원회 선언(1988년): 국제결제은행(BIS)의 바젤위원회에서 발표한 "자금세탁을 목적으로 하는 은행제도의 범죄적 사용 방지에 관한 선언"으로 회원국들이 채택하였다.','유럽(EU)평의회 범죄수익규제협약(1990년): 유럽(EU) 차원의 법적 체계로서, 범죄수익을 추적·압수·몰수하는 데 있어 국제협력과 상호지원을 촉진하는 것을 목표로 한다.'],0,
  '메리다협약(2003년)은 "부패범죄에 대한 사법공조와 자산환수에 대한 국제협력"을 규정한 UN 반부패협약이에요. "국제테러에 대한 경제적인 대응조치"는 테러자금조달 억제를 위한 UN협약(1999년)의 내용이에요.','ultra'),
M('jd1_2',
  '<보기>는 볼프스버그 자금세탁방지 준칙에 대한 설명이다. 가장 옳은 것은?',
  ['볼프스버그 준칙은 UN 총회의 결의로 채택된 국제조약이다.','볼프스버그 자금세탁방지 준칙은 금융기관이 규정 준수 및 실사 등의 문화를 지향할 수 있도록 안내하는 12개 글로벌 은행 연합체의 준칙이다.','볼프스버그 준칙은 오직 한 개 은행이 독자적으로 제정한 내부 지침이다.','볼프스버그 준칙은 자금세탁방지와 무관한 순수 마케팅 지침이다.'],1,
  '볼프스버그 자금세탁방지 준칙은 금융기관이 규정 준수 및 실사(due diligence) 등의 문화를 지향할 수 있도록 안내하는 12개 글로벌 은행 연합체(Wolfsberg Group)의 준칙이에요.','ultra'),
M('jd1_1',
  '<보기>는 국제자금세탁방지기구(FATF)의 주요 기준을 정리한 것이다. 옳지 않은 것은?',
  ['FSRB(FATF Style Regional Bodies)는 FATF 스타일 지역별 자금세탁방지기구로, 9개가 존재한다.','FATF 40 권고사항은 AML/CFT에 대한 국제기준으로 각국이 이행해야 할 핵심적인 조치를 규정한다.','FATF 40 권고사항과 11개 효과성 평가는 완전히 동일한 것으로 서로 구분할 필요가 없다.','FATF 11개 효과성 평가(IO)는 FATF 40 권고사항의 제도의 효과적인 이행과 결과를 평가한다.'],2,
  'FATF 40 권고사항(기술적 이행평가, TC)과 11개 효과성 평가(IO)는 서로 다른 평가 축으로 구분돼요. 40 권고사항은 법률·제도의 구축 여부를, 11개 IO는 제도의 효과적인 이행과 결과를 평가해요. "완전히 동일하여 구분할 필요가 없다"는 서술은 옳지 않아요.','ultra'),
M('jd1_4',
  '유럽연합의 자금세탁방지 규정(Regulation (EU) 2024/1624)에 대한 설명으로 옳지 않은 것은?',
  ['이 규정은 2021년 7월 20일에 유럽연합 집행위원회에 의해 제안되었고, 유럽의회와 유럽연합이사회에서 논의가 진행되어 2024년 5월 31일에 공동으로 공표되었다.','2024년 6월 19일에 유럽연합 관보에 게재되었고 2024년 7월 9일에 발효되었다.','이 규정은 회원국 간의 법적 차이를 줄이기 위해 기존의 수차례 지침(Directive)과 함께 직접 적용 가능한 규정(Regulation)을 도입하여 의무 기관이 충족해야 하는 AML/CFT 요구 사항을 규율하는 법적 체계를 형성하는 것이다.','이 규정은 지침(Directive)과 마찬가지로 각 회원국이 국내법으로 전환하는 절차를 거쳐야만 비로소 효력을 가진다.'],3,
  '이 규정(Regulation)은 지침(Directive)과 달리 회원국의 개별 법률로 전환할 필요 없이 "EU 회원국 전체에 직접 적용되는 법규"예요. 모든 회원국에서 동일하게 시행되므로 각국에서 다른 방식으로 해석되거나 적용되지 않아요. "지침과 마찬가지로 국내법 전환 절차를 거쳐야만 효력을 가진다"는 서술은 옳지 않아요.','ultra'),
M('jd1_4',
  '유럽연합의 지침(Directive)과 규정(Regulation)의 차이에 대한 설명으로 가장 옳은 것은?',
  ['규정(Regulation)은 일부 회원국에만 선택적으로 적용되는 임의규범이고, 지침(Directive)은 모든 회원국에 별도의 전환 절차 없이 자동으로 직접 적용되는 강행규범이다','자금세탁방지 지침(AML Directive)은 회원국의 국내 법률로 전환되어야 하며 각국이 지침의 요구사항을 준수하도록 개별 법률을 만들어 시행하는 반면, 자금세탁방지 규정(AML Regulation)은 EU 회원국 전체에 직접 적용되는 법규로 각국의 개별 법률로 전환할 필요가 없다.','지침과 규정은 EU 법체계상 법적 효력이나 회원국에 대한 구속 방식 면에서 완전히 동일하여, 둘을 구분하여 사용할 실익이 전혀 없는 동의어에 불과하다','지침(Directive)은 회원국 국내법으로의 전환 절차 없이 즉시 직접 적용되고, 규정(Regulation)은 오히려 각 회원국의 국내법 전환을 거쳐야만 효력을 갖는다'],1,
  '자금세탁방지 지침(Directive)은 회원국의 국내 법률로 전환되어야 시행되는 반면, 자금세탁방지 규정(Regulation)은 EU 회원국 전체에 "직접 적용"되는 법규로 개별 법률 전환이 필요 없어요. 이는 EU 입법 형식의 근본적 차이예요.','ultra'),
M('jd1_4',
  '자금세탁방지 규정(AML Regulation, Regulation (EU) 2024/1624)의 시행 시점 및 집행 체계에 대한 설명으로 옳은 것은?',
  ['이 규정은 2027년 이후에도 여전히 각 회원국의 국내법 전환이 필요하다.','이 규정의 집행은 AMLA가 아니라 각 회원국의 개별 세관이 전담한다.','이 규정은 2027년 7월 10일부터 유럽연합 회원국에 직접 적용될 예정이며, 유럽자금세탁방지청(AMLA)의 운영을 중심으로 효과적으로 집행할 계획이다.','이 규정은 발효 즉시 2024년 7월 9일부터 전면 적용되었으며 유예기간이 전혀 없다.'],2,
  '자금세탁방지 규정은 2027년 7월 10일부터 EU 회원국에 직접 적용될 예정이며, 유럽자금세탁방지청(AMLA)의 운영을 중심으로 효과적으로 집행할 계획이에요.','ultra'),
M('jd1_4',
  '자금세탁방지 규정(Regulation (EU) 2024/1624)의 발표 목적에 해당하지 않는 것은?',
  ['각 회원국이 자금세탁방지 규제 수준을 자율적으로 낮출 수 있도록 재량권을 확대한다.','금융 시스템 보호, 자금세탁 및 테러자금조달에 대한 예방 조치를 강화한다.','디지털 자산 포함: 암호화폐 및 기타 디지털 자산을 규제에 포함하여 새로운 위협에 대응한다.','통일된 법적 틀 제공: 기존의 지침(AMLD 4, AMLD 5)에서 발생하는 회원국 간 차이를 해소하고, 유럽연합 전역에서 통일된 규정을 수립·적용하여 회원국 간 법적 규제 차이를 최소화하고 규제의 일관성을 높인다.'],0,
  '이 규정의 목적은 금융시스템 보호·예방조치 강화, 통일된 법적 틀 제공(회원국 간 규제 차이 최소화), 디지털 자산 규제 포함, 고객확인의무 강화 및 거래보고 표준화 등이에요. "각 회원국이 규제 수준을 자율적으로 낮출 수 있도록 재량권을 확대"하는 것은 오히려 규정 도입의 취지(통일성 강화)와 정반대예요.','ultra'),
M('jd1_4',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. AML Regulation(2024/1624)은 2021년 7월 EU 집행위원회가 제안하였다.\nㄴ. AML Regulation은 2024년 6월 19일 EU 관보에 게재되고 2024년 7월 9일 발효되었다.\nㄷ. AML Regulation은 2030년 1월 1일부터 회원국에 직접 적용될 예정이다.\nㄹ. AML Regulation은 AMLA(유럽자금세탁방지청)의 운영을 중심으로 집행될 계획이다.\nㅁ. AML Regulation도 지침(Directive)과 마찬가지로 회원국의 개별 법률 전환 절차를 반드시 거쳐야 효력이 발생한다.',
  ['3개.','4개.','5개.','2개.'],0,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. AML Regulation은 2030년 1월이 아니라 2027년 7월 10일부터 회원국에 직접 적용될 예정이고(ㄷ), Regulation은 Directive와 달리 회원국의 개별 법률 전환 없이 직접 적용되는 것이 특징이에요(ㅁ은 취지가 반대로 되어 있어요). 또한 AML Regulation은 신설되는 AMLA(유럽자금세탁방지청)의 운영을 중심으로 집행될 계획이에요(ㄹ).','ultra'),
M('jd1_4',
  '자금세탁방지 규정(AML Regulation)의 적용 범위 확대에 대한 설명으로 옳은 것은?',
  ['금융 기관뿐만 아니라 특정 비금융 업종(예: 부동산 중개인, 가상자산 서비스 제공자 등)도 규제 대상에 포함하여 다양한 분야에서의 자금세탁 위험을 방지한다.','이 규정은 오직 은행에만 적용되며 다른 금융업권이나 비금융업종은 대상이 아니다.','가상자산 서비스 제공자는 이 규정과 무관하다.','부동산 중개인은 이 규정의 적용 대상에서 명시적으로 제외된다.'],0,
  'AML Regulation은 금융 기관뿐만 아니라 부동산 중개인, 가상자산 서비스 제공자 등 특정 비금융 업종도 규제 대상에 포함하여 다양한 분야의 자금세탁 위험을 방지하도록 적용 범위를 확대했어요.','ultra'),
M('jd1_4',
  '자금세탁방지 규정(AML Regulation)의 데이터 공유 및 투명성 증대 조치에 대한 설명으로 가장 옳은 것은?',
  ['회원국 간의 정보 공유를 촉진하고, 법인의 실제소유자에 대한 투명성을 높이기 위한 조치를 포함하고 있다.','법인의 실제소유자 정보는 이 규정의 적용 범위와 무관하다.','이 규정은 회원국 간 정보 공유를 오히려 제한하는 것을 목적으로 한다.','데이터 공유 조치는 오직 역외 국가와의 협력만을 다루며 EU 회원국 간에는 적용되지 않는다.'],0,
  'AML Regulation은 회원국 간 정보 공유 촉진과 법인의 실제소유자에 대한 투명성을 높이기 위한 조치를 포함하고 있어요.','ultra'),
M('jd1_4',
  '자금세탁방지 지침(AMLD)과 자금세탁방지 규정(AML Regulation)의 향후 관계에 대한 설명으로 가장 옳은 것은?',
  ['지침과 규정은 자금세탁방지 규제 수단으로서 서로 대체하거나 보완하는 관계를 전혀 형성하지 않으며, EU 입법 체계상 완전히 독립적으로 병존하는 별개의 제도로 설계되어 있다','자금세탁방지 규정(AML Regulation)이 도입되는 즉시 기존의 자금세탁방지지침은 전면 폐지되어 완전히 대체되므로, 지침은 더 이상 어떠한 법적 효력도 갖지 않게 된다','향후 AMLA(유럽연합 자금세탁방지청)의 감독 권한과 영향력은 규정 도입이 진행됨에 따라 오히려 점차 축소되어, 궁극적으로는 각 회원국 감독당국으로 권한이 환원될 것으로 전망된다','현재 자금세탁방지지침은 여전히 유럽연합의 주요 자금세탁방지 규제 도구로 주로 사용되고 있으나, 자금세탁방지규정 도입이 점진적으로 진행 중이며, 지침은 유연성과 조정 역할을, 규정은 표준화 역할을 맡고 있고, 향후 자금세탁방지규정과 자금세탁방지청(AMLA)의 영향력이 더욱 강화될 가능성이 높다.'],3,
  '자금세탁방지지침과 규정은 자금세탁방지 체계를 강화하기 위한 상호 보완적 역할을 하며, 지침은 유연성과 조정 역할을, 규정은 표준화 역할을 맡고 있어요. 새로운 규정이 지침을 대체하거나 보완할 것으로 예상되며, 향후 AML Regulation과 AMLA의 영향력이 더욱 강화될 가능성이 높아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제9조(외국환거래자료 등의 통보)에 대한 설명으로 옳은 것은?',
  ['이 조항은 금융회사등의 의심거래보고(STR)와 동일한 내용을 규정하는 조항으로, 제4조의 STR 조항과 사실상 중복되는 규정에 해당한다','통보 대상 자료의 범위와 절차는 대통령령에 위임하지 않고 특정금융정보법 본문에서 구체적인 항목까지 직접 확정적으로 규정하고 있는 것으로 이해해야 한다','한국은행 총재, 세관의 장, 그 밖에 대통령령으로 정하는 자는 「외국환거래법」 제17조에 따른 신고 관련 자료와 같은 법 제21조에 따른 통보에 관련된 자료를 금융정보분석원장에게 통보하여야 한다.','이 조항에 따른 통보 의무는 오직 민간 금융회사에만 적용될 뿐, 한국은행이나 세관의 장은 애초에 이 조항이 정하는 통보 의무의 적용대상 자체가 아닌 것으로 이해해야 한다'],2,
  '특정금융정보법 제9조는 한국은행 총재, 세관의 장, 그 밖에 대통령령으로 정하는 자가 「외국환거래법」 제17조에 따른 신고 관련 자료와 같은 법 제21조에 따른 통보 관련 자료를 금융정보분석원장에게 통보하도록 정한 조항으로, STR과는 별개의 통보 의무이며 통보 대상·절차의 세부사항은 대통령령에 위임되어 있어요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조(수사기관 등에 대한 정보 제공)에 대한 설명으로 옳지 않은 것은?',
  ['금융정보분석원장은 불법재산·자금세탁행위·공중협박자금조달행위와 관련된 형사사건의 수사 등에 필요하다고 인정되는 경우라 하더라도, 어떠한 수사기관에도 특정금융거래정보를 제공할 수 없는 것으로 이해해야 한다','특정금융거래정보에는 금융회사등이 보고한 정보(STR·CTR)뿐 아니라 외국금융정보분석기구로부터 제공받은 정보 중 관련성이 있는 정보, 이를 정리·분석한 정보도 포함될 수 있다.','금융정보분석원장은 불법재산·자금세탁행위 또는 공중협박자금조달행위와 관련된 형사사건의 수사, 조세탈루혐의 확인을 위한 조사업무, 조세체납자에 대한 징수업무 등(특정형사사건의 수사등)에 필요하다고 인정되는 경우 특정금융거래정보를 제공한다.','특정금융거래정보의 제공 대상 기관에는 검찰총장, 고위공직자범죄수사처장, 경찰청장, 관세청장, 중앙선거관리위원회, 금융위원회, 국가정보원장 등이 포함될 수 있다.'],0,
  '특정금융정보법 제10조는 금융정보분석원장이 불법재산·자금세탁행위 등과 관련된 형사사건 수사 등에 필요한 경우 검찰·경찰 등 수사기관에 정보를 제공할 수 있도록 규정해요. "어떠한 경우에도 제공할 수 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제1항에서 "특정형사사건의 수사등"에 해당하는 업무에 해당하지 않는 것은?',
  ['금융회사의 신제품 개발 및 마케팅 전략 수립 업무.','불법재산·자금세탁행위 또는 공중협박자금조달행위와 관련된 형사사건의 수사.','정치자금법 위반사건의 조사, 금융감독업무 또는 테러위험인물에 대한 조사업무.','조세탈루혐의 확인을 위한 조사업무, 조세체납자에 대한 징수업무, 관세법 위반사건 조사, 관세탈세혐의 확인을 위한 조사업무, 관세체납자에 대한 징수업무.'],0,
  '특정형사사건의 수사등에는 불법재산·자금세탁·공중협박자금조달 관련 형사사건 수사, 조세탈루·체납 관련 조사·징수업무, 관세법 위반·탈세·체납 관련 업무, 정치자금법 위반사건 조사, 금융감독업무, 테러위험인물 조사업무 등이 포함돼요. "금융회사의 신제품 개발 및 마케팅 전략 수립 업무"는 이에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조에서 "특정금융거래정보"의 범위에 해당하지 않는 것은?',
  ['금융회사등의 임직원 개인의 연봉 및 인사평가 정보.','제1호 및 제2호의 정보 또는 제4조의2 및 제9조에 따라 보고·통보받은 정보를 정리하거나 분석한 정보.','제4조 제1항 또는 제4조의2에 따라 금융회사등이 보고한 정보 중 특정형사사건의 수사등과의 관련성을 고려하여 대통령령으로 정하는 정보.','제11조 제1항에 따라 외국금융정보분석기구로부터 제공받은 정보 중 특정형사사건의 수사등과의 관련성을 고려하여 대통령령으로 정하는 정보.'],0,
  '특정금융거래정보는 금융회사등이 보고한 STR·CTR 정보, 외국금융정보분석기구로부터 제공받은 관련 정보, 그리고 이를 정리·분석한 정보를 포함해요. "금융회사등 임직원 개인의 연봉 및 인사평가 정보"는 이에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 제9조는 한국은행 총재·세관의 장 등이 외국환거래법 관련 자료를 FIU장에게 통보하도록 규정한다.\nㄴ. 제10조에 따라 FIU장은 특정형사사건의 수사등에 필요한 경우 검찰총장 등에게 특정금융거래정보를 제공할 수 있다.\nㄷ. 특정금융거래정보 제공 대상 기관에는 관세청장, 지방자치단체장, 교육감 등이 포함될 수 있다.\nㄹ. 특정금융거래정보에는 STR·CTR 보고정보, 외국FIU 제공정보, 이를 정리·분석한 정보가 포함된다.',
  ['3개.','4개.','2개.','1개.'],0,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. 특정금융거래정보 제공 대상 기관은 관세청장, 중앙선거관리위원회, 국가정보원장 등이며, 지방자치단체장·교육감은 이에 해당하지 않아요(ㄷ).','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제4항에 따라 특정금융거래정보의 제공을 요구할 수 있는 기관(검찰총장등)에 해당하지 않는 것은?',
  ['행정안전부장관, 국세청장, 관세청장.','지방자치단체의 환경미화 담당 부서장.','검찰총장, 고위공직자범죄수사처장, 경찰청장, 해양경찰청장.','중앙선거관리위원회, 금융위원회, 국가정보원장.'],1,
  '검찰총장등에는 검찰총장, 고위공직자범죄수사처장, 경찰청장, 해양경찰청장, 행정안전부장관, 국세청장, 관세청장, 중앙선거관리위원회, 금융위원회, 국가정보원장이 포함돼요. "지방자치단체의 환경미화 담당 부서장"은 이에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제5항에 따라 검찰총장등이 특정금융거래정보의 제공을 요구할 때 문서에 적어야 하는 사항에 해당하지 않는 것은?',
  ['대상자의 인적사항.','요구하는 정보의 법적 보관 및 파기 예정일자.','사용 목적.','요구하는 정보의 내용.'],1,
  '검찰총장등이 특정금융거래정보 제공을 요구할 때 문서에 적어야 하는 사항은 대상자의 인적사항, 사용 목적, 요구하는 정보의 내용, 법적 근거 등이에요. "요구하는 정보의 법적 보관 및 파기 예정일자"는 이에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제6항에 대한 설명으로 가장 옳은 것은?',
  ['제5항 위반 요구에 대한 거부 규정은 존재하지 않는다.','이 조항은 2011년 이전에 삭제되었다.','금융정보분석원의 소속 공무원은 제5항을 위반한 요구라도 예외 없이 응해야 한다.','금융정보분석원의 소속 공무원은 제5항을 위반하여 특정금융거래정보의 제공을 요구받은 경우에는 이를 거부하여야 한다.'],3,
  '제10조 제6항은 금융정보분석원 소속 공무원이 제5항(적법한 요구 요건)을 위반하여 특정금융거래정보 제공을 요구받은 경우 이를 "거부하여야 한다"고 규정하고 있어요(2011.5.19. 개정).','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제7항에 따라 금융정보분석원장이 특정금융거래정보를 제공하였을 때 기록·보존해야 하는 사항에 해당하지 않는 것은?',
  ['특정금융거래정보를 수령한 공무원(담당자 및 책임자)의 소속 기관, 직위 및 성명, 요구한 특정금융거래정보의 내용 및 사용목적.','심사분석 및 제공과정에 참여한 FIU 직원(담당자 및 책임자)의 직위 및 성명, 특정금융거래정보를 제공받은 기관의 명칭 및 제공일자.','정보분석심의회가 사전에 부여한 정보 보안등급 분류기준.','제공된 특정금융거래정보의 내용 및 제공 사유, 명의인에게 통보한 날, 통보를 유예한 경우 통보유예 사유·기간 및 횟수.'],2,
  '금융정보분석원장이 특정금융거래정보를 제공하였을 때 기록·보존해야 하는 사항은 수령 공무원의 소속·직위·성명·내용·목적, 심사분석·제공에 참여한 FIU 직원 정보, 제공받은 기관 명칭·제공일자, 제공 내용·사유, 통보일·통보유예 관련 사항 등이에요. "정보 보안등급 분류기준"은 이에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제8항 및 제9항에서 규정하는 "정보분석심의회"에 대한 설명으로 옳지 않은 것은?',
  ['금융정보분석원장과 심사분석 총괄책임자를 제외한 나머지 1명은 대통령령으로 정하는 자격을 가진 사람이어야 한다.','정보분석심의회는 금융정보분석원장과 심사분석 총괄책임자를 포함한 금융정보분석원 소속 공무원 3명으로 구성된다.','정보분석심의회의 심의 절차는 금융정보분석원의 재량으로 어떠한 법적 근거 없이 임의로 운영할 수 있다.','금융정보분석원장 소속으로 정보분석심의회를 두고, 금융정보분석원장은 특정금융거래정보를 검찰총장등에게 제공하는 경우에는 정보분석심의회의 심의를 거쳐 제공해야 한다.'],2,
  '정보분석심의회의 심의 절차 및 운영 등에 대해서는 금융정보분석원 업무의 독립성과 중립성을 고려하여 "대통령령으로 정한다"고 명시되어 있어요. "어떠한 법적 근거 없이 임의로 운영할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제11항에 대한 설명으로 가장 옳은 것은?',
  ['행정안전부장관, 국세청장 및 관세청장은 제4항에 따라 금융정보분석원장으로부터 특정금융거래정보를 제공받아 조사·관련 탈루사건 조사 및 조세·관세 체납자에 대한 징수업무에 활용한 경우에는 1년 이내에 「금융실명거래 및 비밀보장에 관한 법률」 제4조 제1항에 따라 금융회사등에 해당 거래정보등의 제공을 요구하여야 한다.','행정안전부장관 등은 특정금융거래정보를 조세·관세 체납자 징수업무 등에 활용한 이후에는, 그 결과와 무관하게 어떠한 형태의 후속 보고나 통보 절차도 이행할 필요가 없는 것으로 이해해야 한다','금융실명법상 거래정보 제공 요구 절차는 특정금융정보법상 특정금융거래정보 활용 절차와는 완전히 별개로 운영되어, 두 법 사이에는 어떠한 연계 조항도 존재하지 않는 것으로 이해해야 한다','이 조항은 정보 활용 이후의 유예기간을 1년이 아니라 10년으로 정하고 있어, 행정안전부장관 등은 활용 사실을 최대 10년까지 통보하지 않아도 무방한 것으로 이해해야 한다'],0,
  '행정안전부장관·국세청장·관세청장이 특정금융거래정보를 제공받아 조사·탈루사건 조사·체납 징수업무에 활용한 경우, 1년 이내에 금융실명법 제4조 제1항에 따라 금융회사등에 해당 거래정보등의 제공을 요구해야 한다는 후속 절차가 규정되어 있어요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조의2(특정금융거래정보 제공사실의 통보)에 대한 설명으로 가장 옳은 것은?',
  ['금융정보분석원장은 제4조의2에 따라 금융회사등이 보고한 정보(제10조 제1항 제3호에 해당하는 정보는 제외)를 제10조에 따라 검찰총장등에게 제공한 경우, 원칙적으로 제공한 날부터 10일 이내에 제공한 거래정보의 주요 내용·사용 목적·제공받은 자 및 제공일자를 명의인에게 통보해야 한다.','통보 기한은 사안의 성격이나 유예 사유 해당 여부와 관계없이, 어떠한 특수한 사정이 있더라도 예외 없이 항상 1개월이라는 동일한 기한으로 고정되어 적용되는 것으로 이해해야 한다','금융정보분석원장은 정보 제공 사실을 명의인에게 통보할 법적 의무를 전혀 부담하지 않으며, 통보 여부는 순수하게 담당 공무원 개인의 재량에 전적으로 맡겨져 있는 것으로 이해해야 한다','통보 유예 제도는 특정금융정보법상 별도로 마련되어 있지 않으며, 모든 정보 제공 사실은 사안의 경중과 무관하게 예외 없이 즉시 명의인에게 통보되어야 하는 것으로 이해해야 한다'],0,
  '제10조의2는 금융정보분석원장이 제4조의2(CTR)에 따라 보고된 정보를 검찰총장등에게 제공한 경우(제10조 제1항 제3호 해당 정보 제외), 원칙적으로 제공한 날부터 10일 이내에(통보 유예한 경우에는 유예기간이 끝난 날부터 10일 이내에) 제공한 거래정보의 주요 내용·사용목적·제공받은 자 및 제공일자를 명의인에게 통보하도록 규정하고 있어요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 제10조 제6항에 따라 FIU 소속 공무원은 위법한 정보 제공 요구라도 상급자의 지시가 있으면 이를 거부할 수 없다.\nㄴ. 제10조 제7항에 따라 FIU장은 정보 제공 시 관련 사항을 2년간 기록·보존해야 한다.\nㄷ. 정보분석심의회는 FIU장, 심사분석 총괄책임자를 포함한 FIU 소속 공무원 7명으로 구성된다.\nㄹ. 제10조의2에 따라 FIU장은 원칙적으로 정보 제공일로부터 10일 이내에 명의인에게 통보해야 한다.',
  ['3개.','1개.','4개.','2개.'],1,
  'ㄹ만 옳은 설명이에요. FIU 소속 공무원은 상급자 지시와 무관하게 위법한 정보 제공 요구를 거부해야 하고(ㄱ), 기록보존 기간은 2년이 아니라 5년이며(ㄴ), 정보분석심의회는 7명이 아니라 3명으로 구성돼요(ㄷ).','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조의2 제2항에 따라 금융정보분석원장이 명의인에 대한 통보를 유예해야 하는 사유에 해당하지 않는 것은?',
  ['단순히 명의인이 통보받는 것을 원하지 않는다고 사전에 의사를 표시한 경우.','해당 통보가 사람의 생명이나 신체의 안전을 위협할 우려가 있는 경우.','해당 통보가 증거인멸, 증인 위협 등 공정한 사법절차의 진행을 방해할 우려가 명백한 경우.','해당 통보가 질문·조사 등 행정절차의 진행을 방해하거나 과도하게 지연시킬 우려가 명백한 경우.'],0,
  '통보 유예 사유는 생명·신체 안전 위협 우려, 증거인멸·증인 위협 등 사법절차 방해 우려, 행정절차 방해·지연 우려로 한정돼요. "명의인이 통보를 원하지 않는다는 사전 의사표시"는 법정 유예 사유에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조의2 제3항에 따른 통보유예 재요청에 대한 설명으로 가장 옳은 것은?',
  ['통보유예는 검찰총장등의 서면 요청만 있으면, 정해진 횟수 제한 없이 무제한으로 반복하여 연장될 수 있는 것으로 특정금융정보법이 규정하고 있는 것으로 이해해야 한다','통보유예 재요청 시 적용되는 유예 기간에 대해서는, 법령상 어떠한 상한이나 제한도 존재하지 않아 검찰총장등이 임의로 원하는 기간을 정해 요청할 수 있는 것으로 이해해야 한다','금융정보분석원장은 검찰총장등이 제2항 각 호의 어느 하나에 해당하는 사유가 지속되고 있음을 제시하고 통보의 유예를 서면으로 반복하여 요청하는 경우에는, 요청받은 날부터 2회에 한정하여(제2항 제1호의 경우는 제외한다) 매 1회 3개월의 범위에서 유예 요청 기간 동안 통보를 유예하여야 한다.','통보유예 재요청은 반드시 구두로만 이루어져야 하며, 서면으로 이루어진 유예 재요청은 법적 효력이 인정되지 않아 무효로 처리되는 것으로 이해해야 한다'],2,
  '통보유예 재요청은 2회에 한정하여(생명·신체 위협 사유인 제2항 제1호의 경우는 제외) 매 1회 3개월의 범위에서 서면으로 반복 요청할 수 있어요. "무제한으로 반복 연장"되거나 "기간 제한이 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조(금융거래정보의 비밀보장 등)에 대한 설명으로 옳지 않은 것은?',
  ['누구든지 비밀보장 대상자에게 특정금융거래정보 등을 제공받은 목적 외의 다른 용도로 사용할 것을 요구해서는 아니 된다.','이러한 비밀보장 의무는 금융정보분석원 소속 공무원에게만 적용될 뿐이며, 전산시스템 관리자나 중계기관 종사자에게는 별도의 법적 근거가 없어 적용되지 않는 것으로 이해해야 한다','특정금융거래정보, 제13조에 따라 제공받은 정보 또는 자료, 제15조 제7항에 따라 제공받은 정보 및 정보분석심의회에서 알게 된 사항을 직무와 관련하여 알게 된 자는 이를 다른 사람에게 제공·누설하거나 목적 외의 용도로 사용하여서는 아니 된다.','이러한 비밀보장 의무의 대상자에는 금융정보분석원 소속 공무원, 전산시스템 관리자, 중계기관 종사자, 수탁금융회사등 종사자, 특정형사사건 수사 종사자, 감독·검사를 한 자 등이 포함된다.'],1,
  '제12조의 비밀보장 의무는 금융정보분석원 소속 공무원 외에도 전산시스템 관리자·중계기관 종사자·수탁금융회사등 종사자 등 다양한 관계자에게 적용돼요. "전산시스템 관리자나 중계기관 종사자에게는 법적 근거가 없어 적용되지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조 제3항에 대한 설명으로 가장 옳은 것은?',
  ['제10조에 따라 제공된 특정금융거래정보는 모든 재판에서 핵심 증거로 사용될 수 있다.','제10조에 따라 제공된 특정금융거래정보는 재판에서 증거로 할 수 없다.','이 조항은 특정금융거래정보의 증거능력에 대해 어떠한 제한도 두지 않는다.','특정금융거래정보는 오직 민사재판에서만 증거로 사용할 수 없으며 형사재판에서는 사용할 수 있다.'],1,
  '특정금융정보법 제12조 제3항은 제10조에 따라 수사기관 등에 제공된 특정금융거래정보는 "재판에서 증거로 할 수 없다"고 명시적으로 규정하고 있어요. 이는 STR·CTR 정보가 수사의 단서로는 활용되지만 그 자체가 직접 증거로 법정에 제출될 수는 없다는 중요한 원칙이에요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조 제4항에 대한 설명으로 가장 옳은 것은?',
  ['제4조 제1항에 따른 STR 보고에 관여한 금융회사등의 종사자는, 어떠한 재판 절차에서도 예외 없이 증언을 거부할 권리를 전혀 인정받지 못하는 것으로 이해해야 한다','제4조 제1항에 따른 보고(STR)에 관여한 금융회사등의 종사자는 제16조 및 제17조와 관련된 재판을 제외하고는 그 보고와 관련된 사항에 관한 증언을 거부할 수 있다. 다만 중대한 공익상 필요가 있는 경우에는 그러하지 아니하다.','STR 보고와 관련한 증언 거부권은, 제16조나 제17조에 따른 재판을 포함하여 어떠한 재판 절차에서도 예외 없이 절대적으로 인정되는 것으로 이해해야 한다','이 조항은 STR 보고 관련 사항과는 무관하게, 모든 금융회사등의 종사자에게 일반적으로 적용되는 포괄적인 증언거부권을 별도로 규정하고 있는 것으로 이해해야 한다'],1,
  'STR 보고에 관여한 금융회사등의 종사자는 원칙적으로 그 보고와 관련된 사항에 대한 증언을 거부할 수 있지만(제16조·제17조 관련 재판은 제외), 중대한 공익상 필요가 있는 경우에는 예외가 인정돼요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조의2(특정금융거래정보 등의 보존 및 폐기)에 대한 설명으로 가장 옳은 것은?',
  ['금융정보분석원장은 특정금융거래정보, 제5조의3·제9조·제13조·제15조 제7항에 따라 제공받거나 통보받은 정보 또는 자료(정보등)를 다른 법령에도 불구하고 대통령령으로 정하는 바에 따라 기간을 정하여 보존하여야 한다.','정보 보존 기간은 특정금융정보법 본문에서 구체적인 연수까지 직접 확정적으로 규정하고 있을 뿐, 그 세부사항을 대통령령에 위임하는 방식은 전혀 채택하고 있지 않은 것으로 이해된다','금융정보분석원장은 보고·제공받은 특정금융거래정보를 보존기간과 무관하게 예외 없이 영구적으로 보존하도록 정해져 있어, 어떠한 경우에도 이를 폐기할 수 없는 것으로 규정되어 있다','이 조항이 정하는 정보등의 보존 및 폐기에 관한 규정은, 다른 법령에 별도로 마련된 보존 관련 규정이 존재하는 경우 항상 그보다 후순위로 밀려나 적용되는 것으로 이해해야 한다'],0,
  '금융정보분석원장은 특정금융거래정보 등을 "다른 법령에도 불구하고" 대통령령으로 정하는 바에 따라 기간을 정하여 보존해야 해요. 즉 이 조항은 다른 법령의 보존 규정에 우선하여 적용되는 특별 규정의 성격을 가져요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 통보유예 재요청은 원칙적으로 5회에 한정하여 매 1회 6개월 범위에서 가능하다.\nㄴ. 제10조에 따라 제공된 특정금융거래정보는 재판에서 증거로 할 수 없다.\nㄷ. STR 보고에 관여한 금융회사 종사자는 원칙적으로 증언을 거부할 수 있으나 중대한 공익상 필요가 있으면 예외가 인정된다.\nㄹ. 금융정보분석원장은 정보등을 다른 법령에도 불구하고 대통령령으로 정하는 기간 동안 보존해야 한다.',
  ['3개.','2개.','1개.','4개.'],0,
  'ㄴ, ㄷ, ㄹ은 옳은 설명이에요. 통보유예 재요청은 5회가 아니라 원칙적으로 2회에 한정하여 매 1회 3개월 범위에서 가능해요(ㄱ).','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조의2(특정금융거래정보 등의 보존 및 폐기)에서 정보등의 폐기에 대한 설명으로 옳지 않은 것은?',
  ['보존기간이 경과한 정보등은 대통령령으로 정하는 예외 사유와 관계없이, 보존기간이 지난 순서대로 담당자가 임의로 정한 시점에 폐기하면 되는 것으로 이해해야 한다','금융정보분석원장은 보존기간이 경과한 때에는 「공공기록물 관리에 관한 법률」에서 정한 절차에 따라 그 정보등을 폐기하여야 한다. 다만, 이 법에 따른 목적을 달성하기 위하여 필요하다고 인정하여 대통령령으로 정하는 경우에는 그러하지 아니하다.','금융정보분석원장은 정보등을 폐기하는 때에는 복구 또는 재생되지 아니하도록 조치하여야 한다.','정보등의 폐기 방법 및 절차 등에 필요한 사항은 대통령령으로 정한다.'],0,
  '제12조의2는 보존기간 경과 정보를 원칙적으로 폐기하되, 법 목적 달성을 위해 필요하다고 인정하여 대통령령으로 정하는 경우에는 예외를 인정해요. "담당자가 임의로 정한 시점에 폐기하면 된다"는 서술은 폐기 절차를 담당자 재량으로 왜곡해 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제13조(자료 제공의 요청 등) 제1항에 따라 금융정보분석원장이 관계 행정기관등의 장에게 제공을 요청할 수 있는 자료에 해당하지 않는 것은?',
  ['금융회사등이 보유한 고객의 실시간 금융거래 원장 전체.','「형의 실효 등에 관한 법률」 제5조의2 제2항에 따른 범죄경력자료 및 수사경력자료.','「주민등록법」 제30조 제1항에 따른 주민등록전산정보자료.','「가족관계의 등록 등에 관한 법률」 제11조 제6항에 따른 등록전산정보자료.'],0,
  '제13조 제1항이 규정하는 자료는 등록전산정보자료, 주민등록전산정보자료, 범죄경력·수사경력자료, 국민건강보험법상 보험료금액 자료, 사업자 관련 기본사항 등이며 "금융거래정보는 제외"한다고 명시되어 있어요. "금융회사등이 보유한 고객의 실시간 금융거래 원장 전체"는 이 조항이 요청할 수 있는 자료가 아니에요.','ultra'),
M('jd2_7b',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융정보분석원 담당자는 보고받은 특정금융거래정보를 분석하던 중, 해당 거래가 제4조 제1항의 불법재산 등 의심 요건에 해당한다고 판단하여 은행 X에 문서로 외국환업무 관련 거래정보 제공을 요구하려 한다.',
  ['이 요구는 제4조 제1항 요건 해당 여부와 무관하게 상시적으로 이루어질 수 있으므로, 굳이 의심 요건 해당 여부를 판단하는 절차를 거칠 필요가 없다.','외국환업무 관련 거래정보 제공 요구는 구두 통보만으로 충분하며, 거래자 인적사항이나 요구 목적을 적은 문서를 작성할 필요는 없다.','금융정보분석원장은 제4조 제1항의 요건에 해당한다고 판단하는 경우에만 거래자의 인적사항·사용 목적·요구하는 정보의 내용을 적은 문서로 외국환업무 관련 거래정보 등의 제공을 요구할 수 있으므로, 담당자는 이러한 문서 요건을 갖추어 요구해야 한다.','이러한 요구는 국내 원화 거래에는 적용되지 않으므로 은행 X에 대한 요구 자체가 처음부터 성립할 수 없다.'],2,
  '제13조 제3항에 따라 금융정보분석원장은 제4조 제1항 요건(불법재산 등 의심) 해당 여부를 "판단하는 경우에만" 거래자 인적사항·사용목적·요구내용을 적은 "문서"로 외국환업무 관련 거래정보 제공을 요구할 수 있어요. 상시 요구, 구두 요구, 국내 거래 적용 배제는 모두 원문과 배치돼요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제13조 제4항에 대한 설명으로 가장 옳은 것은?',
  ['정보·자료 제공 요청은 필요 여부와 무관하게 최대한 광범위하게 이루어져야 한다.','이 조항은 정보 제공 요청의 범위에 대해 어떠한 제한도 두지 않는다.','필요한 최소한 원칙은 제1항에만 적용되며 제2항, 제3항에는 적용되지 않는다.','제1항부터 제3항까지의 규정에 따른 정보 또는 자료 제공의 요청이나 요구는 필요한 최소한으로만 하여야 한다.'],3,
  '제13조 제4항은 제1항부터 제3항까지의 정보·자료 제공 요청·요구가 "필요한 최소한으로만" 이루어져야 한다는 비례 원칙을 명시하고 있어요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 정보등의 폐기 시 복구·재생되지 않도록 조치해야 한다.\nㄴ. 제13조 제1항에 따른 자료 요청 대상에는 금융거래정보를 포함한 모든 개인정보가 예외 없이 포함된다.\nㄷ. 제13조 제3항의 외국환업무 관련 정보 요구는 제4조 제1항 요건에 해당한다고 판단하는 경우에만 가능하다.\nㄹ. 제13조에 따른 모든 정보·자료 제공 요청은 필요한 최소한으로 이루어져야 한다.',
  ['2개.','1개.','3개.','4개.'],2,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. 제13조 제1항에 따른 자료 요청 대상에는 금융거래정보가 제외되어 있어요(ㄴ의 "예외 없이 포함된다"는 서술은 옳지 않아요).','ultra'),
M('jd2_7b',
  '자금세탁방지 및 공중협박자금조달금지에 관한 업무규정 제4조(이사회의 역할 및 책임)에 대한 설명으로 옳지 않은 것은?',
  ['이사회의 역할과 책임에는 법 제5조 제1항 제2호에 따른 절차 및 업무지침의 제정·개정 및 폐지가 포함되어야 한다.','금융회사등은 자금세탁방지등 업무와 관련하여 이사회에 역할과 책임을 부여하여야 한다.','이사회는 대표이사·준법감시인등의 내부통제체계 구축·운영 실태와 관련된 보고를 받을 뿐, 개선지시나 개선조치 검토·승인과 같은 후속 조치 권한은 갖지 않는 것으로 이해해야 한다','이사회의 역할과 책임에는 독립적 감사 결과 및 사후조치에 대한 검토와 승인이 포함되어야 한다.'],2,
  '업무규정 제4조는 이사회가 대표이사·준법감시인등의 내부통제체계 구축·운영 실태 보고 요구뿐 아니라 개선지시, 개선조치 검토·승인 업무까지 수행하도록 정해요. "보고만 받을 뿐 후속 조치 권한은 갖지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '업무규정 제5조(대표이사의 역할 및 책임)에 대한 설명으로 옳지 않은 것은?',
  ['업무지침 제정·개정·폐지 승인이 대표이사의 역할에 포함되나, 법규 개정에 따른 용어변경·자구수정 등 실질적 변화를 수반하지 않는 개정의 경우에는 대표이사가 이를 승인할 수 있는 자에게 위임할 수 있다.','금융회사등은 대표이사(대표이사가 없는 경우 이에 준하는 자)에게 자금세탁방지등 업무와 관련하여 역할과 책임을 부여하여야 한다.','대표이사의 역할과 책임에는 보고책임자 등에게 보고받은 내부통제체계의 취약점 개선 및 개선조치 사항을 이사회에 보고하는 것은 포함되지 않는다.','대표이사의 역할과 책임에는 자금세탁방지등을 위한 내부통제체계의 총괄적 구축·운영이 포함된다.'],2,
  '대표이사의 역할과 책임에는 "보고책임자 등에게 보고받은 내부통제체계의 취약점 개선 및 개선조치 사항의 이사회 보고"가 명시적으로 포함되어 있어요. "포함되지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '업무규정 제5조에 따른 보고책임자 임명 기준(자격요건)에 해당하지 않는 것은?',
  ['자금세탁방지 업무와 무관하게 단순히 근속연수가 10년 이상인 사람이면 학위나 자격, 관련 경력과 무관하게 자동으로 자격요건을 충족한다.','금융회사등에서 2년 이상 자금세탁방지등 관련 분야 업무를 수행한 경력이 있는 사람.','자금세탁방지등 관련 분야의 석사학위 이상 학위소지자로서 2년 이상 자금세탁방지 관련 분야 업무를 수행한 경력이 있는 사람.','변호사 또는 공인회계사 자격을 가진 사람으로서 2년 이상 자금세탁방지등 관련 분야 업무를 수행한 경력이 있는 사람.'],0,
  '보고책임자 자격요건은 금융회사등에서의 자금세탁방지등 관련 경력, 관련 분야 석사학위 이상 소지자의 경력, 변호사·공인회계사 자격자의 경력, 금융정보분석원·법집행기관·검사수탁기관에서의 경력 등으로 구체적으로 규정돼요. "단순 근속연수 10년 이상이면 학위·자격·관련경력과 무관하게 자동 충족"한다는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '업무규정 제4조·제5조상 이사회와 대표이사의 역할 구분에 대한 설명으로 가장 옳은 것은?',
  ['이사회는 업무지침의 제정·개정·폐지, 독립적 감사 결과 및 취약점 개선조치에 대한 검토·승인 등 감독·승인 기능을 수행하고, 대표이사는 내부통제체계의 총괄적 구축·운영, 업무지침 제정·개정 승인, 보고책임자 임명 등 집행 기능을 수행한다.','이사회와 대표이사가 수행하는 역할은 업무규정상 서로 명확히 구분되지 않고 사실상 동일하게 취급되어, 두 기관의 기능을 별도로 나누어 이해할 실익이 없는 것으로 해석된다','대표이사는 오로지 감독 기능만을 수행할 뿐이고, 오히려 이사회가 실제 업무 집행에 관한 모든 사항을 직접 담당하는 것으로 업무규정이 정하고 있다','업무규정은 이사회나 대표이사가 자금세탁방지 관련 업무에서 수행해야 할 역할에 대하여 어떠한 구체적인 규정도 두지 않고, 이를 전적으로 각 금융회사의 내부 재량에 맡기고 있다'],0,
  '업무규정 제4조는 이사회가 업무지침 제정·개정·폐지, 독립적 감사 결과 검토·승인 등 감독·승인 기능을, 제5조는 대표이사가 내부통제체계의 총괄적 구축·운영, 업무지침 승인, 보고책임자 임명 등 집행 기능을 수행하도록 역할을 구분하고 있어요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 이사회는 업무지침의 제정·개정·폐지를 담당한다.\nㄴ. 이사회는 독립적 감사 결과 및 사후조치에 대한 검토와 승인을 담당한다.\nㄷ. 준법감시인등은 자금세탁방지등을 위한 내부통제체계의 총괄적 구축·운영을 담당하며 대표이사는 이와 무관하다.\nㄹ. 보고책임자의 자격요건에는 변호사·공인회계사로서 2년 이상 관련 경력이 있는 사람이 포함될 수 있다.',
  ['3개.','2개.','1개.','4개.'],0,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. 내부통제체계의 총괄적 구축·운영은 준법감시인등이 아니라 대표이사가 담당해요(ㄷ은 담당 주체가 뒤바뀌어 있어요).','ultra'),
M('jd2_7b',
  '업무규정 제5조의2(준법감시인등의 역할 및 책임)에 대한 설명으로 옳지 않은 것은?',
  ['준법감시인등을 둘 법령상 의무가 없는 금융회사등은 제2항 제1호의 역할과 책임을 보고책임자에게 부여하여야 한다.','금융회사등은 준법감시인등에게 자금세탁방지등 업무와 관련하여 역할과 책임을 부여하여야 한다.','준법감시인등의 역할에는 법 제5조 제4항에 따라 임직원의 직무 수행이 업무지침을 준수하는지 여부를 감독하는 것이 포함된다.','준법감시인등이 보고책임자를 겸직하는 경우에 한하여, 보고책임자가 수행하는 업무를 상당한 주의를 다하여 감독할 책임을 진다.'],3,
  '준법감시인등이 보고책임자를 겸직하지 않는 경우에 한정하여, 보고책임자가 수행하는 자금세탁방지등 업무를 상당한 주의를 다하여 감독할 책임이 준법감시인등의 역할에 포함돼요. "겸직하는 경우에 한하여 감독 책임을 진다"는 서술은 겸직 여부 요건이 뒤바뀌어 옳지 않아요(겸직하지 않는 경우에 감독 책임이 발생해요).','ultra'),
M('jd2_7b',
  '업무규정 제6조(보고책임자의 역할 및 책임) 제1항 및 제2항에 대한 설명으로 가장 옳은 것은?',
  ['보고책임자는 STR·CTR 보고 업무만 전담할 뿐, 법 제5조의2에 따른 고객확인(CDD) 이행 관련 업무의 총괄과는 무관한 것으로 업무규정이 정하고 있다','보고책임자는 금융정보분석원장이 아니라 금융위원회에 직접 STR·CTR을 보고해야 하는 것으로 업무규정 제6조가 정하고 있다','금융회사등의 보고책임자는 법 제4조 및 제4조의2에 따라 의심되는 거래 또는 고액 현금거래를 금융정보분석원장에게 보고하여야 하며, 법 제5조의2에 따른 고객확인의 이행과 관련된 업무를 총괄한다.','보고책임자가 수행해야 할 업무의 범위는 관련 법령이나 업무규정에 명시되어 있지 않고, 각 금융회사가 전적으로 임의로 정할 수 있는 재량 사항에 불과한 것으로 이해해야 한다'],2,
  '업무규정 제6조 제1항·제2항에 따르면 보고책임자는 법 제4조·제4조의2에 따라 의심되는 거래·고액 현금거래를 금융정보분석원장에게 보고해야 하며, 법 제5조의2에 따른 고객확인(CDD) 이행 관련 업무도 총괄해요. STR·CTR 보고만 전담하는 것이 아니라 CDD까지 포괄하는 것이 핵심이에요.','ultra'),
M('jd2_7b',
  '업무규정 제6조 제4항에 따라 보고책임자의 역할과 책임에 포함되어야 하는 사항에 해당하지 않는 것은?',
  ['세부 업무지침의 마련 및 운용, 직무기술서 등에 자금세탁방지등 업무와 관련한 임직원별 역할과 책임 및 보고체계 등 명시.','전자금융기술의 발전, 금융 신상품의 개발 등에 따른 자금세탁행위등의 유형과 기법에 대한 대응방안 마련.','금융회사 전체 임직원의 연차휴가 사용 현황을 관리하고 승인하는 업무.','직원알기제도(Know Your Employee)의 수립 및 운영, 임직원에 대한 교육 및 연수.'],2,
  '보고책임자의 역할에는 세부 업무지침 마련, 직무기술서 명시, 신기술·신상품에 따른 자금세탁 대응방안 마련, 직원알기제도 수립·운영, 임직원 교육·연수, 자료 보존 책임, 내부통제체계 점검 및 대표이사 보고 등이 포함돼요. "임직원의 연차휴가 사용 현황 관리·승인"은 보고책임자의 역할에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '업무규정 제6조 제4항 제7호에 대한 설명으로 가장 옳은 것은?',
  ['내부통제체계 구축·운영실태에 대한 정기적 점검은 보고책임자가 아니라 오로지 외부감사인만이 수행할 수 있는 업무로 업무규정 제6조 제4항 제7호가 정하고 있다','정기적 점검 결과 취약점이 발견되더라도 이를 대표이사등에게 보고할 의무는 업무규정상 규정되어 있지 않은 것으로 이해해야 한다','이 조항은 대표이사가 점검·보고 업무를 준법감시인등에게 위임하는 것을 명시적으로 금지하는 규정으로 이해해야 한다','자금세탁방지등 관련 내부통제체계 구축·운영실태의 정기적 점검 및 그 결과 발견된 취약점의 대표이사등에 대한 보고가 포함되며, 다만 대표이사는 준법감시인등이 점검·보고하도록 할 수 있다.'],3,
  '업무규정 제6조 제4항 제7호는 자금세탁방지등 관련 내부통제체계 구축·운영실태의 정기적 점검 및 그 결과 발견된 취약점의 대표이사등에 대한 보고를 규정하며, 다만 대표이사는 준법감시인등이 점검·보고하도록 위임할 수 있어요.','ultra'),
M('jd2_7b',
  '업무규정 제6조 제5항에 대한 설명으로 가장 옳은 것은?',
  ['보고책임자는 자신이 아무리 합리적인 업무절차를 따르고 상당한 주의를 기울여 직무를 수행하였다 하더라도, 결과가 발생한 이상 어떠한 경우에도 그 책임을 면할 수 없는 것으로 엄격하게 규정되어 있다','제1항부터 제4항까지의 규정에도 불구하고 보고책임자가 합리적 업무절차에 따라 상당한 주의를 다하여 직무를 수행한 경우, 업무의 분장 및 조직구조 등을 포함한 위법·부당행위의 실질을 고려하여 관련자의 구분을 달리할 수 있다.','보고책임자가 합리적인 업무절차에 따라 상당한 주의를 다하여 직무를 수행하였는지 여부는, 책임 면제 여부를 판단하는 과정에서 전혀 고려되지 않는 요소로 취급된다','이 조항은 보고책임자가 부담하는 책임의 범위를 기존보다 더욱 확대하고 가중시키기 위한 목적으로 마련된 규정으로, 면책과는 정반대의 취지를 갖는 것으로 이해해야 한다'],1,
  '업무규정 제6조 제5항은 보고책임자가 합리적 업무절차에 따라 상당한 주의를 다하여 직무를 수행한 경우, 위법·부당행위의 실질을 고려하여 관련자(책임 소재)의 구분을 달리할 수 있다는 일종의 면책적 성격의 규정을 두고 있어요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 준법감시인등을 둘 법령상 의무가 없는 금융회사등은 관련 역할·책임을 보고책임자에게 부여해야 한다.\nㄴ. 보고책임자는 오직 CTR 보고 업무만을 전담하며 STR 보고나 CDD 이행 업무와는 무관하다.\nㄷ. 보고책임자의 역할에는 직원알기제도 수립·운영, 임직원 교육·연수가 포함된다.\nㄹ. 보고책임자가 합리적 절차에 따라 상당한 주의를 다하였더라도 위법·부당행위가 발생하면 예외 없이 동일한 최고 수준의 제재를 받는다.',
  ['3개.','2개.','1개.','4개.'],1,
  'ㄱ, ㄷ은 옳은 설명이에요. 보고책임자는 CTR뿐 아니라 STR 보고 및 CDD 이행 관련 업무도 총괄하며(ㄴ), 상당한 주의를 다한 경우 관련자 구분을 달리할 수 있어요(ㄹ은 취지가 반대로 되어 있어요).','ultra'),
M('jd2_7b',
  '업무규정 제6조 제6항 및 제7항에 대한 설명으로 가장 옳은 것은?',
  ['금융회사등의 보고책임자는 금융정보분석원과의 업무협조 및 정보교환 등을 위해 적절한 조치를 취하여야 하며, 이러한 조치에는 특정금융거래정보의 분석을 위해 금융정보분석원장이 문서에 의해 외국환거래 등을 이용한 금융거래 관련 정보·자료의 제공을 요청하는 경우 그 제공, 그리고 의심되는 거래보고 및 고액현금거래보고와 관련한 내부보고체계 운용상황의 점검·개선사항에 대한 금융정보분석원과의 정보교환 등이 포함된다.','내부보고체계의 운용상황을 점검하는 업무는 준법감시인만이 담당할 수 있는 고유하고 배타적인 업무로 한정되어 있어, 보고책임자가 이러한 점검이나 개선사항 논의에 직접 관여하는 것은 업무규정상 명시적으로 금지되어 있는 것으로 이해해야 한다','보고책임자는 금융정보분석원과 정보를 교환할 수 있는 어떠한 법적 근거도 갖고 있지 않으며, 금융정보분석원장이 문서를 통해 정보 제공을 요청하더라도 이에 응해야 할 의무를 전혀 부담하지 않는 것으로 이해해야 한다','보고책임자는 금융정보분석원장의 정당한 문서 요청에 대해서도, 별도의 사유를 제시하지 않고 오로지 자신의 재량만으로 이를 거부할 수 있는 절대적인 권한을 업무규정상 부여받고 있는 것으로 이해해야 한다'],0,
  '보고책임자는 금융정보분석원과의 업무협조·정보교환을 위한 적절한 조치를 취해야 하며, 여기에는 금융정보분석원장의 문서에 의한 외국환거래 관련 정보·자료 제공 요청에 대한 대응, 그리고 STR·CTR 관련 내부보고체계 운용상황의 점검·개선사항에 대한 정보교환이 포함돼요.','ultra'),
M('jd1_3',
  'IO-4의 세부 평가항목 4.4에서 강화되거나 특정한 조치의 적용 여부를 평가하는 대상에 해당하지 않는 것은?',
  ['금융기관 임직원의 개인 신용카드 한도 설정.','정치적 주요인물(PEPs), 환거래은행(correspondent banking).','새로운 금융기법, 전신송금.','테러자금조달(TF) 정밀금융제재, FATF가 지정한 고위험 국가와의 거래.'],0,
  'IO-4의 4.4는 (a)PEP (b)환거래은행 (c)새로운 금융기법 (d)전신송금 (e)TF 정밀금융제재 (f)FATF가 지정한 고위험 국가와의 거래 시 강화되거나 특정한 조치의 적용 여부를 평가해요. "금융기관 임직원의 개인 신용카드 한도 설정"은 이에 해당하지 않아요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. IO-4는 금융기관·DNFBP·VASP의 위험기반 예방조치 적용과 의심거래보고를 다룬다.\nㄴ. IO-5는 국제협력을 통한 정보 교환과 법집행 공조를 다룬다.\nㄷ. IO-6은 금융정보 등이 자금세탁·테러자금조달 수사에 적절히 활용되는지를 다룬다.\nㄹ. IO-4의 세부항목에는 PEP·환거래은행·전신송금·TF 정밀제재·고위험국가 거래에 대한 강화조치 적용 여부가 포함된다.',
  ['3개.','4개.','2개.','1개.'],0,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. IO-5는 법인·신탁의 ML/TF 악용 방지와 실소유자 정보의 장애 없는 제공을 다루는 항목이며, "국제협력을 통한 정보 교환"은 IO-2의 내용이에요(ㄴ).','ultra'),
M('jd1_3',
  'IO-7의 세부 평가항목 7.5에 대한 설명으로 가장 옳은 것은?',
  ['IO-7 세부 평가항목 7.5는 ML 유죄판결을 받지 못한 경우 이를 대체할 수 있는 어떠한 형사사법 조치도 고려하지 않는다는 원칙을 규정하고 있어, 대체 수단 활용 자체를 금지한다','IO-7 세부 평가항목 7.5는 오직 무죄 판결이 최종적으로 확정된 사건에 대해서만 적용되며, 유죄판결을 받지 못한 나머지 사건에는 적용되지 않는다','대체 형사사법 조치의 적극적 활용은 오히려 자금세탁범죄에 대한 기소·유죄판결 확보 노력의 중요성을 감소시키는 수단으로 간주되어, IO-7 평가에서 부정적으로 평가된다','ML 수사를 하였으나 정당한 이유로 ML 유죄판결을 확보할 수 없는 경우, 어느 정도로 다른 형사사법 조치(other criminal justice measures)를 적용하는지를 평가하며, 이러한 대체 조치들은 자금세탁범죄의 기소와 유죄판결과 관련하여 그 중요성을 감소시키거나 이를 대체하는 수단이 되지 말아야 한다.'],3,
  'IO-7의 7.5는 ML 수사 후 정당한 이유로 ML 유죄판결을 확보하지 못한 경우 다른 형사사법 조치를 적용하는 정도를 평가하되, 이러한 대체 조치가 자금세탁범죄 기소·유죄판결의 중요성을 "감소시키거나 대체하는 수단이 되어서는 안 된다"는 원칙을 명시하고 있어요.','ultra'),
M('jd1_4',
  '유럽연합 자금세탁방지 및 테러자금조달방지청(AMLA) 설립에 관한 규정(Regulation (EU) 2024/1620)에 대한 설명으로 옳지 않은 것은?',
  ['2024년 6월 19일에 유럽연합 관보에 게재되었으며, 자금세탁방지청(AMLA)은 2024년 6월 26일에 설립되었다.','이 규정은 2021년 7월 20일에 유럽연합 집행위원회에 의해 제안되었고, 유럽의회와 유럽연합이사회에서 논의가 진행되어 2024년 5월 31일에 공동으로 공표되었다.','AMLA는 각 회원국의 국내법 절차를 거쳐야만 비로소 설립 효력이 발생하는 자문기구에 불과하다.','이 규정에 따라 유럽연합 전역에서 자금세탁 규제의 일관성을 보장하여 금융시스템의 안전성과 투명성을 강화하고자 하였다.'],2,
  'AMLA는 Regulation (EU) 2024/1620에 따라 2024년 6월 26일에 이미 설립되었으며, 특정 고위험 금융기관과 대규모 자산운용사에 대해 "직접 감독 권한"을 갖는 초국가적 감독기관이에요. "각 회원국의 국내법 절차를 거쳐야만 설립 효력이 발생하는 자문기구"라는 서술은 옳지 않아요.','ultra'),
M('jd1_4',
  '자금세탁방지청(AMLA)의 성격과 본부 소재지에 대한 설명으로 가장 옳은 것은?',
  ['AMLA는 실질적인 감독 권한을 갖지 않는 순수 자문 성격의 기구로서, 프랑스 파리에 그 본부를 두고 운영되는 것으로 알려져 있다','AMLA는 유럽연합의 자금세탁과 테러자금조달 방지 체계를 강화하기 위한 중앙감독기구로서 특정 고위험 금융기관과 대규모 자산운용사에 대해 직접 감독 권한을 갖는 초국가적 감독기관이며, 본부는 독일 프랑크푸르트 암 마인에 있다.','AMLA는 고위험 금융기관에 대해서도 직접적인 감독 권한을 전혀 행사하지 못하며, 회원국 감독당국에 대한 권고만을 할 수 있는 제한적인 지위에 머무는 것으로 알려져 있다','AMLA는 개별 회원국의 감독당국과 어떠한 형태의 협력이나 정책 조정 역할도 수행하지 않고, 완전히 독립적으로 단독 활동하는 기구로 설계되어 있는 것으로 이해된다'],1,
  'AMLA는 유럽연합의 AML/CFT 체계를 강화하기 위한 중앙감독기구로서 특정 고위험 금융기관과 대규모 자산운용사에 대해 직접 감독 권한을 갖는 초국가적 감독기관이며, 본부는 독일 프랑크푸르트 암 마인에 있어요.','ultra'),
M('jd1_4',
  '자금세탁방지청(AMLA)의 역할에 대한 설명으로 가장 옳은 것은?',
  ['AMLA는 각 회원국의 FIU와 어떠한 형태의 협력 관계도 맺지 않으며, 오히려 회원국 FIU의 독자적인 활동과 완전히 분리되어 독립적으로 운영되는 기구로 설계되어 있다','AMLA는 EU의 자금세탁방지 패키지와는 전혀 무관하게, 그와 별도로 독자적으로 추진되고 있는 완전히 분리된 프로젝트에 해당하는 것으로 이해해야 한다','AMLA는 자금세탁 및 테러자금조달로부터 유럽연합 시민과 유럽연합 금융시스템을 보호하기 위해 고안된 자금세탁방지 패키지의 핵심 요소로서, 회원국의 금융정보분석원(FIU) 등 관련 기관들과 협력하여 규정의 일관된 적용을 감독하고 조정하는 역할을 수행한다.','AMLA의 역할은 회원국으로부터 제출받은 통계 자료를 단순히 수집하고 집계하는 업무에만 한정되며, 그 밖의 감독이나 조정 기능은 전혀 수행하지 않는다'],2,
  'AMLA는 자금세탁방지 패키지의 핵심 요소로서, 회원국 FIU 등 관련 기관들과 협력하여 규정의 일관된 적용을 감독·조정하는 역할을 수행해요.','ultra'),
M('jd1_4',
  '자금세탁방지청(AMLA)의 주요 기능에 해당하지 않는 것은?',
  ['위험도가 높거나 국경을 넘어 운영되는 암호화폐 자산서비스 제공업체를 포함하여 특정 유형의 신용 및 금융기관을 직접 감독할 수 있는 권한.','의무 기관의 자금세탁방지 준수를 보장하고 금융부문에서 테러자금조달(AML/CFT) 의무에 대응하며 금융부문에 지원을 제공하기 위해 국가 감독기관과 협력.','유럽연합 회원국의 국방 정책 수립 및 군사 예산 배정에 관한 권한.','암호화 자산 서비스 제공업체를 포함하여 금융 부문의 고위험 의무 기관에 대한 직간접적인 감독 권한.'],2,
  'AMLA의 주요 기능은 고위험 의무 기관에 대한 직간접적 감독, 위험도 높은 암호화폐 자산서비스 제공업체를 포함한 특정 신용·금융기관의 직접 감독, 국가 감독기관과의 협력을 통한 AML/CFT 준수 보장·지원 등이에요. "국방 정책 수립 및 군사 예산 배정"은 AMLA의 기능과 전혀 무관해요.','ultra'),
M('jd1_4',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. AMLA 설립 규정(2024/1620)은 2021년 7월 EU 집행위원회가 제안하였다.\nㄴ. AMLA는 2024년 6월 26일에 설립되었다.\nㄷ. AMLA의 본부는 벨기에 브뤼셀에 있다.\nㄹ. AMLA는 특정 고위험 금융기관과 대규모 자산운용사에 대한 직접 감독 권한을 가진다.\nㅁ. AMLA는 위험도가 높은 암호화폐 자산서비스 제공업체를 직접 감독할 수 있다.',
  ['2개.','5개.','3개.','4개.'],3,
  'ㄱ, ㄴ, ㄹ, ㅁ은 옳은 설명이에요. AMLA의 본부는 벨기에 브뤼셀이 아니라 독일 프랑크푸르트 암 마인에 있어요(ㄷ).','ultra'),
M('jd1_3',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] A국의 FATF 상호평가 결과, TC 기준으로는 PC 또는 NC가 6개였고 핵심권고 5개 모두 C 또는 LC였다. 그러나 IO 기준으로는 HE 또는 SE가 3개에 불과하고 LE가 5개나 되었다.',
  ['IO 기준은 후속점검 결정에 전혀 고려되지 않는다.','이 사례는 후속점검 대상에서 완전히 제외된다.','TC 기준만 보면 정규 후속점검 대상에 해당할 수 있으나, IO 기준(HE 또는 SE가 5개 미만)을 종합적으로 고려하면 강화된 후속점검 대상이 될 가능성이 있다.','TC 기준과 IO 기준 중 하나만 충족하면 항상 정규 후속점검으로 확정된다.'],2,
  '정규 후속점검은 TC 기준(PC·NC 8개 미만, 핵심권고 모두 C·LC)과 IO 기준(HE·SE 5개 이상)을 모두 고려해요. 이 사례는 TC 기준은 충족하지만 IO 기준(HE·SE 3개, 5개 미만)은 충족하지 못하므로, 종합적으로 강화된 후속점검 대상이 될 가능성이 있어요.','ultra'),
M('jd1_4',
  '<보기>의 EU 자금세탁방지 지침·규정의 발전을 목적에 따라 옳게 짝지은 것은?\nㄱ. AMLD 3(2005) - CDD의 위험기반접근법 세부화, 실제소유자 확인의무 도입\nㄴ. AMLD 4(2015) - PEP 요건의 국내외 확대, 고액현금거래보고 기준 강화\nㄷ. AMLD 5(2018) - 가상자산·선불카드 규제, 중앙등록시스템 강화\nㄹ. 6th AML Directive(2024) - 부동산 정보 접근, 실제소유자 등록부 설정 및 감독대학 도입',
  ['ㄱ, ㄴ만 옳음.','ㄱ, ㄴ, ㄷ, ㄹ 모두 옳음.','ㄱ, ㄹ만 옳음.','ㄷ, ㄹ만 옳음.'],1,
  'ㄱ~ㄹ 모두 각 지침의 핵심 목적과 정확히 일치해요. AMLD 3(CDD 세부화·실소유자확인), AMLD 4(PEP 확대·CTR기준강화), AMLD 5(가상자산·선불카드), 6th AMLD(부동산정보·감독대학)의 발전 순서와 핵심 내용을 종합적으로 이해해야 풀리는 문제예요.','ultra'),
M('jd1_5',
  '<보기>의 미국·EU·영국 감독기관을 소관 분야에 따라 옳게 짝지은 것은?\nㄱ. OCC - 국법은행 감독\nㄴ. EBA - 은행 부문 구속력 있는 기술표준서 수립\nㄷ. NCA - 영국의 자금세탁혐의자 기소 및 SARs 관리\nㄹ. FSOC - 금융시스템 리스크 모니터링',
  ['ㄱ, ㄷ만 옳음.','ㄱ, ㄴ만 옳음.','ㄱ, ㄴ, ㄷ, ㄹ 모두 옳음.','ㄷ, ㄹ만 옳음.'],2,
  'ㄱ~ㄹ 모두 옳은 연결이에요. OCC(국법은행 감독), EBA(BTS를 통한 은행부문 규제 표준화), NCA(영국 자금세탁 기소·SARs 관리), FSOC(미국 금융시스템 리스크 모니터링)의 소관 분야를 정확히 구분해야 풀리는 종합형 문제예요.','ultra'),
M('jd1_3',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] B국은 자국 FIU가 에그몬트 그룹의 회원이 아님에도 불구하고, 별도의 국제협력 채널을 구축하지 않고 독자적으로만 국제 정보교환을 수행하고 있다.',
  ['에그몬트 그룹 가입은 완전히 선택사항으로, FATF 권고사항 29와 같은 어떠한 국제 기준과도 관련성을 갖지 않는 것으로 이해해야 한다','FIU가 국제협력을 수행하는 데 있어 에그몬트 그룹 가입 여부는 전혀 문제가 되지 않으며, 국제협력의 실효성과는 무관한 것으로 이해해야 한다','FATF 권고사항 29 주석(29.8)에 따르면 FIU를 설립한 국가는 자국 FIU가 에그몬트 그룹 회원이 아닌 경우 회원가입을 신청해야 하므로, B국의 태도는 이 권고사항의 취지에 부합하지 않을 수 있다.','이 사례는 FATF 권고사항과는 무관한, 순수하게 양국 간 외교적 판단에만 맡겨진 사안으로 이해해야 한다'],2,
  'FATF 권고사항 29 주석(29.8)에 따르면 FIU를 설립한 국가는 자국 FIU가 에그몬트 그룹 회원이 아닌 경우 회원가입을 신청해야 해요. B국의 상황은 이 국제기준에 부합하지 않는 것으로 볼 수 있어요.','ultra'),
M('jd2_8',
  'FATF 40 권고사항 중 권고사항 7(확산금융 중 정밀금융제재, targeted financial sanction)에 대한 설명으로 옳지 않은 것은?',
  ['이 결의안에 따라 각국은 유엔 헌장 제7장에 의거하여 유엔 안보리 또는 그 권한에 의하여 지정한 어떠한 개인이나 단체(entity)의 자금 혹은 기타 자산을 지체 없이 동결하여야 한다.','각국은 대량살상무기확산과 이에 대한 자금조달을 방지, 억제 및 차단(disruption)하는 유엔안보리결의안을 이행하기 위하여 정밀화된 금융제재를 이행하여야 한다.','이 결의안에 따른 제재는 권고적 성격에 불과하여 각국이 이행 여부를 완전히 자유롭게 선택할 수 있다.','유엔안보리결의안(UNSCR)은 2094호와 연관되며, UNSCR의 결정은 비군사적 제재인 경우 모든 회원국가에게 법적 구속력을 갖고 있다.'],2,
  'UNSCR의 결정은 비군사적 제재인 경우 "모든 회원국가에게 법적 구속력"을 갖고 있어요. "권고적 성격에 불과하여 이행 여부를 완전히 자유롭게 선택할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '테러자금금지법에 확산금융 이슈를 반영하게 된 배경에 대한 설명으로 옳지 않은 것은?',
  ['제정 당시 WMD 확산행위자의 금융행위에 대한 정밀금융제재를 시행할 수 있는 입법이 부재하였다.','외국환거래법 및 고시를 통해 WMD 확산행위자의 외환거래에 한해서는 사전허가제 운영이 가능하였다.','테러자금금지법은 제정 당시부터 WMD 확산금융 규제를 명시적 목적으로 포함하고 있었으므로 별도의 반영이 필요하지 않았다.','당시 테러자금금지법은 테러자금조달방지를 목적으로 하고 있어 WMD 확산행위는 규제 범위에 없었다.'],2,
  '테러자금금지법은 제정 당시 테러자금조달방지를 목적으로 하고 있어 WMD 확산행위는 규제 범위에 "없었다"는 점이 확산금융 이슈를 반영하게 된 배경이에요. "제정 당시부터 확산금융 규제를 명시적 목적으로 포함"했다는 서술은 원문과 반대예요.','ultra'),
M('jd2_8',
  '확산자금 관련 테러자금금지법의 주요 특징에 해당하지 않는 것은?',
  ['금융거래등의 확대 및 사전동결제도(사전동결제도: 동결리스트를 설정하고 허가를 받게 하는 방식).','금융거래제한대상자의 지정, 금융거래제한대상자의 금융거래등에 대한 금융위원회의 허가.','수사기관 신고의무와 의심거래보고 의무, 누설금지 등.','확산자금조달과 관련된 자에 대한 감독은 오직 국세청이 전담하며 금융위원회는 어떠한 역할도 하지 않는다.'],3,
  '확산자금 관련 테러자금금지법의 주요 특징은 금융거래제한대상자 지정, 금융위원회의 허가, 사전동결제도, 신고·보고·누설금지 의무 등이며, "금융위원회는 확산자금조달등과 관련된 자를 금융거래제한대상자로 지정해야 한다"고 명시되어 있어요. "오직 국세청이 전담하며 금융위원회는 어떠한 역할도 하지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '확산자금 관련 테러자금금지법의 주요내용에 대한 설명으로 옳은 것은?',
  ['확산자금조달로 이용된다는 사실을 알면서도 관련 자금·재산을 모집·제공·운반·보관한 자에 대해서는 처벌 규정이 없으므로 보고할 필요가 없는 것으로 이해해야 한다','금융거래제한대상자 지정 절차는 확산자금조달 문제와는 완전히 별개의 독립적인 절차로서, 서로 아무런 연관성이 없는 것으로 이해해야 한다','확산자금조달로 이용된다는 사실을 알면서 자금 또는 재산을 모집·제공하거나 이를 운반·보관한 자와 이를 강요하거나 권유한 자에 대해 처벌하며, 확산자금조달로 의심되는 금융거래는 FIU에 보고해야 한다.','확산자금조달과 관련된 행위는 그 성격상 국제 관할권의 문제로 취급되어, 국내법으로는 어떠한 경우에도 처벌 대상이 될 수 없는 것으로 이해해야 한다'],2,
  '테러자금금지법은 확산자금조달로 이용된다는 사실을 알면서 자금·재산을 모집·제공하거나 운반·보관한 자와 이를 강요·권유한 자를 처벌하며, 확산자금조달로 의심되는 거래는 보고 대상이고 금융위원회는 관련자를 금융거래제한대상자로 지정할 수 있어요.','ultra'),
M('jd2_8',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF 권고사항 7은 대량살상무기확산 자금조달 방지를 위한 정밀금융제재 이행을 요구한다.\nㄴ. UNSCR의 비군사적 제재 결정은 모든 회원국에 법적 구속력을 갖는다.\nㄷ. 테러자금금지법 제정 당시에는 WMD 확산행위가 규제 범위에 없었으나 이후 반영되었다.\nㄹ. 확산자금조달로 의심되는 금융거래는 FIU에 보고해야 하며, 금융위원회는 관련자를 금융거래제한대상자로 지정해야 한다.',
  ['4개.','3개.','2개.','1개.'],0,
  'ㄱ~ㄹ 모두 옳은 설명이에요. 권고사항 7의 확산금융 정밀금융제재, UNSCR의 법적 구속력, 테러자금금지법 제정 연혁, 확산자금조달 보고체계를 정확히 이해해야 풀리는 종합형 문제예요.','ultra'),
M('jd2_10',
  '특정금융정보법 제6조(적용범위등)에 대한 설명으로 옳지 않은 것은?',
  ['가상자산사업자의 금융거래등에 대해서는 국외에서 이루어진 행위로서 그 효과가 국내에 미치는 경우에도 이 법률을 적용한다.','이 장(가상자산사업자에 대한 특례)은 가상자산사업자에 대하여 적용한다.','가상자산사업자에 대하여 제5조의3(전신송금)을 적용하는 경우 정보제공의 대상·기준·절차·방법과 그 밖에 필요한 사항은 대통령령으로 정한다.','가상자산사업자가 국외에서 영업하는 경우, 그 효과가 국내에 미치더라도 국내법이 아닌 영업지 국가의 법령만 적용되는 것으로 이해해야 한다'],3,
  '제6조는 가상자산사업자의 국외 행위라도 그 효과가 국내에 미치면 이 법이 적용된다고 규정해요. "영업지 국가의 법령만 적용된다"는 서술은 국내법 적용 원칙을 부정해 옳지 않아요.','ultra'),
M('jd2_10',
  '특정금융정보법 제7조(신고) 제1항에 대한 설명으로 가장 옳은 것은?',
  ['가상자산사업자는 사업장 소재지나 대표자 성명 등 어떠한 신고 의무도 부담하지 않으며, 이는 순수 자율적 등록 사항에 불과한 것으로 규정되어 있다','제7조 제1항에 따른 신고 대상 기관은 금융정보분석원장이 아니라 금융위원회이며, 신고서는 금융위원회에 직접 제출해야 하는 것으로 규정되어 있다','가상자산사업자(이를 운영하려는 자를 포함한다)는 대통령령으로 정하는 바에 따라 상호 및 대표자의 성명, 사업장의 소재지·연락처 등 대통령령으로 정하는 사항을 금융정보분석원장에게 신고하여야 한다.','신고는 사업 개시 시점과 무관하게 사업자가 원하는 임의의 시점에 자유롭게 할 수 있으며, 별도의 기한이나 사전 신고 요건은 규정되어 있지 않다'],2,
  '특정금융정보법 제7조 제1항은 가상자산사업자(운영하려는 자 포함)가 대통령령으로 정하는 바에 따라 상호·대표자 성명, 사업장 소재지·연락처 등을 금융정보분석원장에게 신고하도록 규정하고 있어요. 신고 대상 기관은 금융위원회가 아니라 금융정보분석원장이에요.','ultra'),
M('jd2_10',
  '특정금융정보법 제7조 제3항에 따라 금융정보분석원장이 가상자산사업자 신고를 수리하지 아니할 수 있는 사유에 해당하지 않는 것은?',
  ['이 법, 범죄수익은닉규제법, 테러자금금지법, 외국환거래법 및 자본시장법 등 대통령령으로 정하는 금융관련 법률에 따라 벌금 이상의 형을 선고받고 그 집행이 끝나거나 집행이 면제된 날부터 5년이 지나지 아니한 자.','단순히 신생 법인이라는 이유만으로, 설립 후 1년이 지나지 않았다는 사정만으로 신고가 자동으로 불수리된다.','실명확인이 가능한 입출금 계정을 대통령령으로 정하는 금융회사등에 한정하여, 가상자산사업자의 계좌와 그 고객의 계좌 사이에서만 금융거래등을 허용하는 계정을 통하여 금융거래등을 하지 아니하는 자(가상자산거래의 특성을 고려하여 금융정보분석원장이 정하는 자에 대해서는 예외).','정보보호 관리체계 인증을 획득하지 못한 자.'],1,
  '신고 불수리 사유는 정보보호 관리체계 인증 미획득, 실명확인 입출금 계정 요건 미충족, 관련 법률상 벌금 이상 형 선고 후 5년 미경과, 신고·변경신고 말소 후 5년 미경과 등으로 구체적으로 규정돼요. "단순히 신생 법인이라는 이유만으로 자동 불수리"된다는 서술은 옳지 않아요.','ultra'),
M('jd2_10',
  '특정금융정보법 제7조 제4항에 따라 금융정보분석원장이 가상자산사업자의 신고 또는 변경신고를 직권으로 말소할 수 있는 사유에 해당하지 않는 것은?',
  ['제6항에 따른 영업의 전부 또는 일부의 정지명령을 이행하지 아니한 경우.','가상자산사업자가 창립 3주년을 맞이한 경우.','제3항 각 호의 어느 하나에 해당하는 경우(다만 제3항 제1호에 해당하는 경우로서 대통령령으로 정하는 경우는 제외).','「부가가치세법」 제8조에 따라 관할 세무서장에게 폐업신고를 하거나 관할 세무서장이 사업자등록을 말소한 경우.'],1,
  '직권말소 사유는 제3항 각 호 해당, 폐업신고·사업자등록 말소, 영업정지명령 미이행, 그 밖에 건전하고 신중한 방법으로 신고·변경신고를 하는 등 대통령령으로 정하는 경우예요. "창립 3주년을 맞이한 경우"는 말소 사유가 아니에요.','ultra'),
M('jd2_10',
  '특정금융정보법 제7조 제5항에 따라 금융정보분석원장이 6개월의 범위에서 영업의 전부 또는 일부의 정지를 명할 수 있는 사유에 해당하지 않는 것은?',
  ['제15조 제2항 제1호에 따른 시정명령을 이행하지 아니한 경우.','제15조 제2항 제2호에 따른 기관경고를 3회 이상 받은 경우.','가상자산사업자의 대표자가 개인적으로 해외여행을 다녀온 경우.','그 밖에 고의 또는 중대한 과실로 자금세탁행위와 공중협박자금조달행위를 방지하기 위해 필요한 조치를 하지 아니한 경우로서 대통령령으로 정하는 경우.'],2,
  '영업정지 사유는 시정명령 미이행, 기관경고 3회 이상, 고의·중대한 과실로 인한 자금세탁방지 조치 미비 등이에요. "대표자의 개인적 해외여행"은 영업정지 사유가 아니에요.','ultra'),
M('jd2_10',
  '특정금융정보법 제7조 제6항에 따른 신고의 유효기간에 대한 설명으로 가장 옳은 것은?',
  ['신고의 유효기간은 관련 법령에서 특정 연수를 직접 확정적으로 규정하지 않고, 오직 대통령령의 위임 범위와 무관하게 각 사업자가 신고 시점에 자율적으로 원하는 기간을 선택하여 정할 수 있다','신고 유효기간이 경과하더라도 별도의 갱신신고 절차 없이 기존 신고의 효력이 자동으로 계속 유지되어, 사업자는 아무런 추가 조치 없이 영업을 계속할 수 있다','신고의 유효기간은 한번 신고가 수리되면 그 이후로는 영구적으로 효력이 지속되어, 이후 별도의 갱신신고나 기간 만료라는 개념 자체가 존재하지 않는다','신고의 유효기간은 신고를 수리한 날부터 5년 이하의 범위에서 대통령령으로 정하는 기간으로 하며, 신고 유효기간이 지난 후 계속하여 같은 행위를 영업으로 하려는 자는 대통령령으로 정하는 바에 따라 신고를 다시 하여야 한다.'],3,
  '가상자산사업자 신고의 유효기간은 신고를 수리한 날부터 5년 이하의 범위에서 대통령령으로 정하는 기간이며, 유효기간 경과 후 계속 영업하려면 신고를 다시 해야 해요.','ultra'),
M('jd2_10',
  '특정금융정보법 제8조(가상자산사업자의 조치)에 대한 설명으로 가장 옳은 것은?',
  ['가상자산사업자는 고객별 거래내역을 분리할 의무가 없다.','가상자산사업자는 제4조 제1항 및 제4조의2에 따른 보고의무 이행 등을 위하여 고객별 거래내역을 분리하여 관리하는 등 대통령령으로 정하는 조치를 하여야 한다.','제8조는 STR·CTR 보고의무와는 무관한 조항이다.','가상자산사업자는 거래내역을 통합하여 관리해야 하며 분리 관리는 금지된다.'],1,
  '가상자산사업자는 STR(제4조 제1항)·CTR(제4조의2) 보고의무 이행 등을 위하여 고객별 거래내역을 분리하여 관리하는 등 대통령령으로 정하는 조치를 해야 해요.','ultra'),
M('jd2_10',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 가상자산사업자는 상호·대표자 성명·사업장 소재지 등을 금융정보분석원장에게 신고해야 한다.\nㄴ. 정보보호 관리체계 인증 미획득은 신고 불수리 사유에 해당한다.\nㄷ. 신고 유효기간은 10년 이하의 범위에서 금융위원회 고시로 정한다.\nㄹ. 가상자산사업자는 고객별 거래내역을 분리하여 관리하는 등의 조치를 해야 한다.',
  ['3개.','2개.','1개.','4개.'],0,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. 신고 유효기간은 10년이 아니라 5년 이하의 범위에서, 금융위원회 고시가 아니라 대통령령으로 정해요(ㄷ).','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제1조의2(가상자산거래의 범위)에 대한 설명으로 가장 옳은 것은?',
  ['가상자산거래의 범위는 오직 매매만을 의미하며 보관·관리는 포함되지 않는다.','법 제2조 제1호 하목 3)에서 "대통령령으로 정하는 행위"란 고객의 요청에 따라 가상자산의 매매·교환·보관 또는 관리 등을 위해 가상자산을 이전하는 모든 행위를 말한다.','가상자산거래의 범위는 법률에서 직접 확정되며 시행령에 위임되지 않는다.','가상자산거래의 범위는 고객의 요청과 무관하게 사업자가 임의로 정할 수 있다.'],1,
  '시행령 제1조의2는 "대통령령으로 정하는 행위"를 고객의 요청에 따라 가상자산의 매매·교환·보관 또는 관리 등을 위해 가상자산을 이전하는 모든 행위로 정의하고 있어요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의10(가상자산 이전 시 정보제공)에 대한 설명으로 옳지 않은 것은?',
  ['정보제공은 금융정보분석원장이 정하여 고시하는 환산기준에 따라 가상자산사업자가 다른 가상자산사업자에게 100만원 이상에 상당하는 가상자산을 이전하는 경우에 하여야 한다.','가상자산을 이전하는 사업자는 이전받는 사업자에게 송금인·수취인의 성명(법인·단체의 경우 명칭 및 대표자 성명)과 가상자산 주소(고유식별번호)를 제공해야 한다.','금융정보분석원장 또는 이전받는 가상자산사업자가 요청하는 경우에는 송금인의 주민등록번호(법인은 법인등록번호) 또는 여권번호·외국인등록번호를 제공해야 하며, 이는 정보제공을 요청받은 날부터 3영업일 이내에 제공해야 한다.','이러한 정보제공 의무는 이전받는 가상자산사업자가 국내에 사업장을 두지 않은 해외 사업자인 경우에는 적용이 면제된다.'],3,
  '정보제공 의무는 "100만원 이상에 상당하는 가상자산"을 이전하는 경우에 적용되도록 기준금액이 설정되어 있으며, 이전받는 사업자가 국내 사업장이 있는지 여부와는 무관하게 적용돼요. "해외 사업자인 경우 면제된다"는 서술은 옳지 않아요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의10에 따른 가상자산 이전 시 정보제공 시기에 대한 설명으로 가장 옳은 것은?',
  ['정보제공 시기에 대한 규정은 존재하지 않는다.','모든 정보는 이전 후 1개월 이내에만 제공하면 충분하다.','송금인·수취인의 성명·가상자산 주소 정보는 가상자산을 이전하는 경우에 함께 제공하고, 주민등록번호 등 추가 정보는 정보제공을 요청받은 날부터 3영업일 이내에 제공해야 한다.','주민등록번호 등 추가 정보는 이전과 동시에 반드시 제공해야 하며 유예기간이 없다.'],2,
  '기본 정보(성명, 가상자산 주소)는 가상자산 이전과 함께 제공하고, 요청 시 제공하는 추가 정보(주민등록번호 등)는 요청받은 날부터 3영업일 이내에 제공하도록 시기가 구분되어 있어요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의11(가상자산사업자의 신고)에 따라 신고 시 첨부해야 하는 서류에 해당하지 않는 것은?',
  ['정관 또는 이에 준하는 업무운영규정, 사업추진계획서.','정보보호 관리체계 인증에 관한 자료.','대표자 개인의 병역이행 여부를 증명하는 서류.','실명확인이 가능한 입출금 계정(실명확인입출금계정)에 관한 자료.'],2,
  '신고 첨부서류는 정관·업무운영규정, 사업추진계획서, 정보보호 관리체계 인증 자료, 실명확인입출금계정 자료, 그 밖에 금융정보분석원장이 필요하다고 고시하는 자료예요. "대표자 개인의 병역이행 여부 증명 서류"는 이에 해당하지 않아요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의11 제2항에서 규정하는 "사업장의 소재지, 연락처 등 대통령령으로 정하는 사항"에 해당하지 않는 것은?',
  ['직위 및 성명(법인의 경우에는 대표자와 임원의 직위 및 성명을 말한다).','전자우편주소 및 인터넷 도메인 이름, 호스트서버의 소재지.','사업장의 소재지 및 연락처.','가상자산사업자의 발행주식총수 및 주주명부 전체.'],3,
  '시행령 제10조의11 제2항에서 정하는 사항은 직위 및 성명(법인의 경우 대표자와 임원의 직위·성명), 전자우편주소 및 인터넷 도메인 이름·호스트서버의 소재지, 사업장의 소재지 및 연락처 등이에요. "발행주식총수 및 주주명부 전체"는 이에 해당하지 않아요.','ultra'),
M('jd2_10',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 가상자산거래의 범위에는 고객 요청에 따른 가상자산의 매매·교환·보관·관리를 위한 이전 행위가 포함된다.\nㄴ. 가상자산 이전 시 정보제공 의무의 기준금액은 100만원 이상이다.\nㄷ. 주민등록번호 등 추가 정보는 요청받은 날부터 10영업일 이내에 제공해야 한다.\nㄹ. 신고 첨부서류에는 정관, 사업추진계획서, 정보보호 관리체계 인증 자료, 실명확인입출금계정 자료가 포함된다.',
  ['4개.','2개.','3개.','1개.'],2,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. 추가 정보 제공 기한은 10영업일이 아니라 3영업일 이내예요(ㄷ).','ultra'),
M('jd2_10',
  '특정금융정보법 시행령상 가상자산사업자의 변경신고 절차에 대한 설명으로 가장 옳은 것은?',
  ['법 제7조 제2항에 따른 변경신고 기한은 30일이 아니라 90일이며, 이 기간 내에는 변경사항을 증명하는 서류를 제출하지 않아도 무방한 것으로 규정되어 있다','법 제7조 제2항에 따라 변경신고를 하려는 자는 신고한 사항이 변경된 날부터 30일 이내에 금융정보분석원장이 정하여 고시하는 변경신고서에 그 변경사항을 증명하는 서류를 첨부하여 금융정보분석원장에게 제출해야 한다.','변경신고는 정식 서면 신고서 없이 유선 통화 등 구두 통보만으로 완결될 수 있는 것으로 시행령이 정하고 있다','신고한 사항 중 대표자 성명이나 사업장 소재지 등이 변경되더라도, 이를 별도로 금융정보분석원장에게 신고할 법적 의무는 부과되어 있지 않은 것으로 이해해야 한다'],1,
  '법 제7조 제2항에 따라 변경신고를 하려는 자는 신고한 사항이 변경된 날부터 30일 이내에 금융정보분석원장이 정하는 변경신고서에 변경사항을 증명하는 서류를 첨부하여 제출해야 해요. 90일이 아니라 30일이고, 구두 통보가 아닌 서면 신고이며, 변경신고 의무는 실제로 존재해요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의12(신고의 불수리) 제2항에서 규정하는 "대통령령으로 정하는 금융회사등"(실명확인입출금계정 개설 가능 금융회사)에 해당하지 않는 것은?',
  ['증권사가 설립한 자회사 형태의 대부업체.','「은행법」에 따른 은행.','「중소기업은행법」에 따른 중소기업은행.','「농업협동조합법」에 따른 농협은행, 「수산업협동조합법」에 따른 수협은행.'],0,
  '실명확인입출금계정 개설이 가능한 금융회사등은 은행법상 은행, 중소기업은행, 농협은행, 수협은행으로 한정돼요. "증권사가 설립한 자회사 형태의 대부업체"는 이에 해당하지 않아요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의12 제3항에서 규정하는 신고 불수리 사유 중 "금융관련 법률"의 범위에 해당하지 않는 것은?',
  ['「도로교통법」.','특정금융정보법, 범죄수익은닉규제법.','테러자금금지법, 외국환거래법.','자본시장과 금융투자업에 관한 법률, 금융회사의 지배구조에 관한 법률 시행령 제5조 각 호(제32호·제35호 및 제43호는 제외)에 따른 법률.'],0,
  '금융관련 법률의 범위는 특정금융정보법, 범죄수익은닉규제법, 테러자금금지법, 외국환거래법, 자본시장과 금융투자업에 관한 법률, 금융회사 지배구조법 시행령 제5조 각호(일부 제외)에 따른 법률로 한정돼요. 「도로교통법」은 이에 해당하지 않아요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의13(신고등의 직권말소)에 대한 설명으로 옳지 않은 것은?',
  ['직권말소 결정은 신고인에게 통지할 필요 없이 즉시 효력이 발생한다.','금융정보분석원장은 법 제7조 제4항에 따라 신고 또는 변경신고를 직권으로 말소하는 경우 서면(전자문서 포함)으로 그 사실 및 사유를 신고인에게 알려야 한다.','법 제7조 제4항 제1호 단서의 "대통령령으로 정하는 경우"란 가상자산사업자의 정보보호 관리체계 인증 갱신 신청에 대해 가상자산사업자의 책임 없는 사유로 그 갱신 여부가 결정되지 않은 경우를 말한다.','법 제7조 제4항 제4호의 "거짓이나 그 밖의 부정한 방법으로 신고 또는 변경신고를 하는 등 대통령령으로 정하는 경우"란 거짓이나 부정한 방법으로 금융정보분석원장에게 신고 또는 변경신고를 하는 경우를 말한다.'],0,
  '금융정보분석원장은 직권말소 시 "서면(전자문서 포함)으로 그 사실 및 사유를 신고인에게 알려야" 해요. "통지할 필요 없이 즉시 효력이 발생한다"는 서술은 옳지 않아요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의14(영업의 정지)에서 금융정보분석원장이 영업정지를 명할 때 종합적으로 고려해야 하는 사항에 해당하지 않는 것은?',
  ['가상자산사업자의 향후 5년간 예상 매출 성장률 전망치.','위반행위의 유형 및 성격.','위반행위의 동기 및 배경.','위반행위의 효과 및 영향력, 법 위반상태의 시정 노력.'],0,
  '영업정지 명령 시 종합적으로 고려해야 하는 사항은 위반행위의 유형·성격, 동기·배경, 효과·영향력, 법 위반상태의 시정 노력 등이에요. "향후 5년간 예상 매출 성장률 전망치"는 이에 해당하지 않아요.','ultra'),
M('jd2_10',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 변경신고는 신고사항 변경일로부터 90일 이내에 해야 한다.\nㄴ. 실명확인입출금계정 개설 가능 금융회사에는 은행·중소기업은행·농협은행·수협은행이 포함된다.\nㄷ. 직권말소 시 금융정보분석원장은 별도의 통지 없이 즉시 효력을 상실시킬 수 있다.\nㄹ. 영업정지 명령 시 위반행위의 동기·배경, 유형·성격, 효과·영향력, 시정노력을 종합적으로 고려해야 한다.',
  ['3개.','4개.','1개.','2개.'],3,
  'ㄴ, ㄹ은 옳은 설명이에요. 변경신고 기한은 90일이 아니라 30일 이내이고(ㄱ), 직권말소 시에는 통지 없이 즉시가 아니라 서면으로 사실·사유를 알려야 해요(ㄷ).','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의15(신고의 유효기간)에 대한 설명으로 가장 옳은 것은?',
  ['신고의 유효기간은 1년으로 정해져 있어, 사업자는 매년 갱신신고서를 새롭게 제출해야 하는 부담을 지는 것으로 관련 시행령이 규정하고 있는 것으로 이해해야 한다','법 제7조 제6항 전단에서 "대통령령으로 정하는 기간"이란 3년을 말하며, 갱신하려는 자는 유효기간이 만료되기 45일 전까지 정보보호 관리체계 인증 자료와 실명확인입출금계정에 관한 자료를 첨부한 갱신신고서를 제출해야 한다.','갱신 신청의 기한은 유효기간이 이미 만료된 이후 45일 이내에 사후적으로 제출하면 충분한 것으로 시행령이 정하고 있는 것으로 이해해야 한다','갱신을 신청할 때에는, 정보보호 관리체계 인증 자료나 실명확인입출금계정 관련 자료와 같은 어떠한 첨부서류도 제출할 필요가 없는 것으로 이해해야 한다'],1,
  '법 제7조 제6항의 "대통령령으로 정하는 기간"은 3년이며, 갱신하려는 자는 유효기간 만료 "45일 전까지" 정보보호 관리체계 인증 자료와 실명확인입출금계정 자료를 첨부한 갱신신고서를 제출해야 해요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의17(신고 관련 업무의 위탁)에 따라 금융정보분석원장이 금융감독원장에게 위탁하는 업무에 해당하지 않는 것은?',
  ['법 제7조 제3항에 따른 불수리 사유에 대한 심사, 법 제7조 제4항에 따른 직권말소 사유에 대한 심사.','가상자산사업자의 세무조사 및 법인세 부과·징수 업무.','법 제7조 제1항 및 제2항에 따른 신고 및 변경신고에 대한 심사.','법 제7조 제6항 후단에 따른 신고 갱신에 대한 심사.'],1,
  '금융정보분석원장이 금융감독원장에게 위탁하는 업무는 신고·변경신고 심사, 불수리 사유 심사, 직권말소 사유 심사, 신고 갱신 심사예요. "세무조사 및 법인세 부과·징수 업무"는 이에 해당하지 않으며 국세청 소관이에요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의18(실명확인입출금계정의 개시)에 따른 개시 요건에 해당하지 않는 것은?',
  ['가상자산사업자의 고객별 거래내역을 분리하여 관리하고 있을 것.','정보보호 관리체계 인증을 획득하였을 것.','예치금을 고유재산과 구분하여 관리하고 있을 것.','가상자산사업자가 최근 1년간 매출액 100억원을 달성했을 것.'],3,
  '실명확인입출금계정 개시 요건은 예치금과 고유재산의 구분 관리, 정보보호 관리체계 인증 획득, 고객별 거래내역 분리 관리예요. "최근 1년간 매출액 100억원 달성"은 개시 요건이 아니에요.','ultra'),
M('jd2_10',
  '특정금융정보법 시행령 제10조의18 제2항 및 제3항에 대한 설명으로 가장 옳은 것은?',
  ['금융회사등은 자체적인 위험평가 절차를 거치지 않고, 가상자산사업자로부터 신고서가 접수되는 즉시 형식적 요건만 확인하여 실명확인입출금계정을 개시해야 한다','실명확인입출금계정의 개시 시점은 신고 수리 여부와는 무관하게, 오직 가상자산사업자와 체결한 계약서상의 계약 체결일에 맞추어 기계적으로 결정된다','금융회사등은 실명확인입출금계정을 개시하려는 경우 절차 및 업무지침을 확인하여 가상자산사업자와의 금융거래등에 내재된 자금세탁행위와 공중협박자금조달행위의 위험을 식별·분석·평가해야 하며, 필요하다고 인정하는 경우 신고 또는 변경신고가 수리된 이후에 금융거래등이 이루어질 것을 조건으로 계정을 개시할 수 있다.','가상자산사업자와의 금융거래에 내재된 자금세탁행위·공중협박자금조달행위 위험의 식별·분석·평가는 금융회사등이 아니라 전적으로 가상자산사업자 스스로 수행해야 하는 자체 의무이다'],2,
  '금융회사등은 실명확인입출금계정 개시 전 절차·업무지침을 확인하여 자금세탁·테러자금조달 위험을 식별·분석·평가해야 하며, 필요시 신고·변경신고 수리 이후 거래가 이루어질 것을 조건으로 계정을 개시할 수 있어요.','ultra'),
M('jd2_10',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 가상자산사업자 신고의 유효기간은 3년이다.\nㄴ. 갱신신고서는 유효기간 만료 45일 전까지 제출해야 한다.\nㄷ. 금융정보분석원장은 신고·불수리·직권말소·갱신 심사 업무를 한국은행총재에게 위탁할 수 있다.\nㄹ. 실명확인입출금계정 개시 요건에는 예치금 구분관리, 정보보호 관리체계 인증, 고객별 거래내역 분리관리가 포함된다.',
  ['2개.','4개.','1개.','3개.'],3,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. 관련 심사 업무 위탁 대상은 한국은행총재가 아니라 금융감독원장이에요(ㄷ).','ultra'),
M('jd3_11',
  'J5(Joint Chiefs of Global Tax Enforcement)에 대한 설명으로 옳지 않은 것은?',
  ['호주, 캐나다, 네덜란드, 영국, 미국의 5개 국가는 국제 조세범죄 및 자금세탁 방지를 위해 J5(세계 조세 집행 합동참모본부)를 구성하였다.','전 세계 160개 이상의 요세 정보의 투명성과 교환에 관한 글로벌 포럼에 가입하여 국제 표준의 효과적인 이행 보장을 위해 노력하는 것도 국제협력의 일환이다.','J5는 오직 유럽 국가들로만 구성된 조직으로 미국은 참여하지 않는다.','J5는 2020년부터 세무 관련 사례와 암호화 및 사이버 전문지식을 바탕으로, 정보를 신속하게 공유하고 역량을 강화하며 통화 범죄, 사이버 범죄 및 세계 조세 회피의 대응 활동을 수행하고 있다.'],2,
  'J5는 호주, 캐나다, 네덜란드, 영국, "미국"의 5개 국가로 구성된 조직이에요. "오직 유럽 국가들로만 구성되며 미국은 참여하지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd3_11',
  '세계경제포럼(World Economic Forum)의 "Gatekeepers: A Unifying Framework"(2021년) 보고서에서 제시하는 게이트키퍼를 위한 5가지 방안에 해당하지 않는 것은?',
  ['명확하고 구체적인 최신 정책 수립, 효과적인 기업실사 추진.','게이트키퍼 산업에 대한 전면적인 국유화 및 정부 직접 운영.','교육과 인센티브를 통한 청렴 문화 조성, \'내부고발\' 문화 육성.','산업 및 부문 간 협업.'],1,
  '게이트키퍼를 위한 5가지 방안은 ①명확하고 구체적인 최신 정책 수립 ②효과적인 기업실사 추진 ③교육과 인센티브를 통한 청렴 문화 조성 ④\'내부고발\' 문화 육성 ⑤산업 및 부문 간 협업이에요. "게이트키퍼 산업의 전면적인 국유화 및 정부 직접 운영"은 이 보고서가 제시하는 방안이 아니에요.','ultra'),
M('jd3_11',
  '세계경제포럼 보고서에서 제시하는 게이트키퍼 산업의 3원칙에 해당하지 않는 것은?',
  ['청렴성(Integrity).','책임성(Accountability).','수익성(Profitability).','투명성(Transparency).'],2,
  '게이트키퍼 산업의 3원칙은 청렴성(Integrity), 투명성(Transparency), 책임성(Accountability)이에요. "수익성(Profitability)"은 이 3원칙에 해당하지 않아요.','ultra'),
M('jd3_11',
  '세계경제포럼 보고서에서 정의하는 "게이트키퍼(Gatekeeper)"의 개념에 대한 설명으로 가장 옳은 것은?',
  ['게이트키퍼 개념은 파나마페이퍼나 핀센파일과 같은 폭로 사건들과는 전혀 관련 없이, 순수하게 학술적 이론 연구 과정에서 독자적으로 발전된 개념이다','게이트키퍼는 불법 거래를 사전에 차단하는 긍정적 역할만을 수행하도록 설계된 직군으로, 해당 지위나 전문성이 자금세탁에 악용될 가능성은 구조적으로 존재하지 않는다','게이트키퍼라는 용어는 회계사나 변호사와 같은 전문직은 포함하지 않고, 오직 은행에서 실제 송금 업무를 처리하는 은행원만을 한정하여 지칭하는 용어이다','게이트키퍼라는 단어는 불법 거래를 조장하면서도 차단한다는 이중적 잠재성을 의미하며, 전문가(중개인)들은 금융시장에 접근해 복잡한 회사구조를 만들고 페이퍼 컴퍼니를 관리하며 부정 수익의 출처를 세탁할 수 있는 동시에, 적절한 기업실사를 통해 불법 금융 흐름을 방지하고 차단할 수도 있다.'],3,
  '게이트키퍼는 불법 거래를 조장하면서도 차단할 수 있는 이중적 잠재성을 가진 개념으로, 회계사·예술 고문·은행가·기업 서비스 제공자·변호사·명품 판매자·공증인·자산관리사·공인중개사 등 민간 부문의 중개인들이 이에 해당해요. 이 개념은 \'파나마페이퍼\'와 \'핀센파일\' 사건을 계기로 전문 산업의 역할에 대한 관심이 집중되며 부각되었어요.','ultra'),
M('jd3_11',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. J5는 호주·캐나다·네덜란드·영국·미국 5개국으로 구성된 국제 조세범죄·자금세탁방지 조직이다.\nㄴ. 게이트키퍼 산업의 3원칙은 수익성·경쟁력·효율성이다.\nㄷ. 게이트키퍼를 위한 5가지 방안에는 내부고발 문화 육성과 산업·부문 간 협업이 포함된다.\nㄹ. 게이트키퍼 개념은 불법 거래를 조장할 수도, 차단할 수도 있는 이중적 잠재성을 갖는다.',
  ['1개.','2개.','4개.','3개.'],3,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. 게이트키퍼 산업의 3원칙은 수익성·경쟁력·효율성이 아니라 청렴성·투명성·책임성이에요(ㄴ).','ultra'),
M('jd3_11',
  '세계경제포럼 보고서에서 지적하는 게이트키퍼 잠재성 활용의 문제점에 대한 설명으로 옳지 않은 것은?',
  ['모든 국가는 이미 동일한 수준의 게이트키퍼 규제를 시행하고 있어 국가별 규제 격차는 존재하지 않는다.','일부 국가의 전문가들은 고도의 규제를 받지만, 다른 국가들은 범죄가 의심되는 행위를 보고하거나 자산 출처를 확인할 적극적 의무가 없다.','세간의 이목을 끌었던 사건들은 게이트키퍼의 고의 또는 과실로, 개발도상국과 중산층 국가의 불법자금이 공공 투자와 거리가 먼 금융기관으로 흘러가는 결과를 보여주고 있다.','게이트키퍼의 잠재력 활용 시도는 항상 특정 국가 및 산업을 대상으로만 하는 규제로 이루어져 왔으나, 업종의 다양화와 국가별로 다른 규제 체제는 효과적인 게이트키퍼 활용을 어렵게 하고 있다.'],0,
  '보고서는 일부 국가의 전문가들은 고도의 규제를 받지만 다른 국가들은 관련 보고·확인 의무가 없는 등 "국가별로 다른 규제 체제"가 문제라고 지적하고 있어요. "모든 국가가 동일한 수준의 규제를 시행하고 있어 격차가 존재하지 않는다"는 서술은 원문과 정반대예요.','ultra'),
M('jd3_11',
  '게이트키퍼 전문가를 통합체제로 접근시킬 때의 이점에 대한 설명으로 옳지 않은 것은?',
  ['불법 금융 흐름에는 초국가적, 교차 산업별 대응이 요구되지만, 현재의 세분된 산업별 규제는 여러 지역에 걸치는 활동을 효과적으로 포착할 수 없을 뿐더러 대응하기도 어렵다.','둘째, 게이트키퍼의 역할과 책임에 관한 공동의 가치 기반 접근법은 게이트키퍼 산업 전반에 있어 신뢰 구축과 동시에 교차 산업 및 범국가적 협력을 가능하게 한다.','통합체제 접근은 오히려 산업 간 협력을 저해하고 각 산업의 개별적 고립을 심화시킨다.','첫째, 통합 체제는 공동 인식과 행동을 불러일으켜 법적 규제 준수와 더불어 청렴성, 투명성, 책임성의 3원칙을 실현할 수 있도록 하는 내부 정책과 인센티브에 더 중점을 두어 위험과 법 위반에 대한 위험을 인식할 수 있도록 한다.'],2,
  '통합체제 접근은 "교차 산업 및 범국가적 협력을 가능하게" 하는 것이 이점으로 제시돼요. "산업 간 협력을 저해하고 개별적 고립을 심화시킨다"는 서술은 원문과 정반대예요.','ultra'),
M('jd3_11',
  '게이트키퍼의 잠재성을 활용한 불법 자금흐름 대응에 대한 설명으로 가장 옳은 것은?',
  ['게이트키퍼의 잠재성을 활용하는 것은 시장 효율성 제고와는 어떠한 관련성도 갖지 않는, 순수하게 규제 준수 목적에만 국한된 조치로 이해해야 한다','게이트키퍼를 활용하는 것은 오로지 규제 준수 비용만을 증가시킬 뿐이며, 자금세탁 방지 측면에서 어떠한 긍정적 효과도 가져오지 않는 것으로 이해해야 한다','전문가 협회는 소속 회원(게이트키퍼)의 행동 변화를 유도하는 데 있어 어떠한 역할도 수행하지 않으며, 이는 전적으로 정부 규제기관의 몫으로 이해해야 한다','불법 자금흐름의 대응에 있어서, 게이트키퍼의 잠재성을 활용하면 자금세탁, 부패, 금융사기, 조세회피, 범죄 및 테러 자금조달에 관한 거래로 인한 막대한 비용을 줄이고 시장 효율성을 증대할 수 있다.'],3,
  '불법 자금흐름 대응에 있어 게이트키퍼의 잠재성을 활용하면 자금세탁, 부패, 금융사기, 조세회피, 범죄·테러 자금조달에 관한 거래로 인한 막대한 비용을 줄일 수 있어요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 법률 전문가의 고객 위험평가에 대한 설명으로 옳지 않은 것은?',
  ['법률 전문가는 의뢰인 즉 고객 관계 초기에 고객의 위험평가를 수행해야 하며, 이러한 위험평가는 NRA(국가위험평가)의 결과, 초국가적 위험평가, 법률 서비스/부문에 내재된 ML/TF 위험에 대해 관할 당국이 수행한 부문별 보고서 등을 통해 알 수 있다.','법적 관행에 특정한 위험 수준을 평가하는 데 관련될 수 있는 기타 정보에는 특정 관할권에서 발생할 수 있는 문제를 강조하는 언론 기사 및 기타 널리 사용 가능한 공개 정보들이 해당한다.','법률 전문가는 지표 및 위험 요소에 대한 FATF 지침을 참조할 수 있으며, 고객관계 과정에서 고객·거래 위험 프로필을 지속적으로 모니터링하고 검토하는 절차도 중요하다.','법률 전문가는 고객 관계가 일단 수립되면 이후에는 어떠한 위험 재평가도 할 필요가 없다.'],3,
  '법률 전문가는 고객관계 과정에서 고객·거래 위험 프로필을 "지속적으로" 모니터링하고 검토하는 절차가 중요하다고 명시되어 있어요. "관계 수립 이후 어떠한 위험 재평가도 할 필요가 없다"는 서술은 옳지 않아요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 법률 서비스의 특성에 대한 설명으로 가장 옳은 것은?',
  ['법률 전문가는 업무 특성과 무관하게, 금융기관에서 사용하는 자동 거래 모니터링 시스템을 예외 없이 동일하게 도입하여 사용해야 하는 것으로 가이던스가 요구하고 있다','법률 전문가와 의뢰인의 관계는 그 특성상 항상 단기적인 1회성 거래에 그치며, 장기간에 걸친 전문적 관계로 발전하는 경우는 실무상 전혀 발생하지 않는다','법률 전문가는 의뢰인과의 관계 성격이나 위험 수준과 무관하게, 모든 고객의 업무 전반을 예외 없이 전면적으로 조사해야 할 절대적 의무를 부담한다','법률 전문가가 일반적으로 제공하는 법률 서비스의 특성상, 금융기관에서 사용하는 자동 거래 모니터링 시스템은 대부분의 법률 전문가에게는 적합하지 않으나, 개별 법률 전문가는 비즈니스 관계 과정에서 업무 유형 또는 고객 활동의 특성 변화를 식별하고 감지할 수 있는 좋은 위치에 있을 수 있다.'],3,
  '금융기관의 자동 거래 모니터링 시스템은 법률 서비스의 특성상 대부분의 법률 전문가에게 적합하지 않지만, 개별 법률 전문가는 비즈니스 관계 과정에서 업무 유형이나 고객 활동의 특성 변화를 식별·감지할 수 있는 좋은 위치에 있어요. 의뢰인과의 관계는 장기간의 상호작용하는 전문적 관계로 발전할 수 있으며(예: 부동산 거래처럼 단기 고객에게도 존재), 개별 법률 전문가가 고객의 업무를 전면 조사할 것으로 기대되지는 않아요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 특정 고객·작업 관련 ML/TF 위험 식별 시 법률 전문가의 대응에 대한 설명으로 가장 옳은 것은?',
  ['법률 전문가는 고객이 추구하는 전문 서비스의 주제와 관련된 위험은 고려할 필요가 없으며, 오로지 고객의 신원 정보만 확인하면 충분한 것으로 이해해야 한다','특정 고객 또는 고객 범주 및 특정 유형의 작업과 관련된 ML/TF 위험을 식별하면 법률 전문가가 그러한 위험을 완화하기 위해 합리적이고 비례적인 조치 및 통제를 결정하고 구현할 수 있다.','위험을 완화하기 위한 조치는 고객이나 작업의 특성과 무관하게, 항상 동일한 강도로 획일적으로 적용되어야 하는 것으로 이해해야 한다','법률 전문가는 특정 고객이나 작업에 대한 위험을 실제로 식별하더라도, 이를 완화하기 위한 어떠한 조치도 취할 필요가 없는 것으로 이해해야 한다'],1,
  '특정 고객·고객 범주 및 특정 유형의 작업과 관련된 ML/TF 위험을 식별하면, 법률 전문가는 그러한 위험을 완화하기 위해 합리적이고 비례적인 조치를 취해야 해요. 위험을 고려하지 않거나, 획일적 조치, 조치 불필요라는 서술은 모두 옳지 않아요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 "거래/서비스 위험(Transaction/Service Risk)"에 대한 설명으로 옳지 않은 것은?',
  ['의뢰인에 대한 전반적인 위험평가에는 법률 전문가가 제공하는 서비스의 성격을 고려할 때 법률 전문가가 제공하는 서비스가 제공하는 잠재적 위험을 결정하는 것도 포함되어야 한다.','제공되거나 제공되는 서비스의 문맥(context)은 항상 위험기반접근법(RBA)의 기본이 된다.','법률 전문가가 제공하는 서비스의 위험은 서비스가 이루어지는 문맥(context)보다는, 오직 수수료 규모에 따라서만 결정되는 것으로 이해해야 한다','이 지침에서 논의된 요소 중 어느 하나 자체가 고위험 상황을 구성하지 않을 수 있지만 누적하여 총체적으로 고려해야 할 것들이다.'],2,
  '법률가를 위한 RBA 가이던스는 서비스 위험이 문맥(context)에 따라 달라진다고 강조해요. "문맥보다는 오직 수수료 규모에 따라서만 결정된다"는 서술은 위험 판단 기준을 왜곡해 옳지 않아요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 서비스 제공과 관련된 위험을 결정할 때 고려해야 할 요소에 해당하지 않는 것은?',
  ['법률 전문가가 수행하거나 R.22에 명시된 활동을 수행하는 거래와 관련되지 않은, 법률 전문가의 신탁 계좌를 통해 고객의 자금을 입금·이체할 수 있는 서비스.','법률 전문가가 의뢰인의 업무에 대한 적절한 지식 없이 실제로 의뢰인의 지위, 평판 및 신용을 제3자에게 대표하거나 보증하는 서비스, 관할 당국으로부터 실소유권을 숨길 수 있는 서비스.','실질적으로 금융 중개자 역할을 하는 법률 전문가가 비즈니스 거래를 용이하게 하는 행위에서 자신이 관리하는 계좌를 통해 자금의 수취 및 송금을 처리하는 서비스.','법률 전문가가 제공하는 문서 작성 서비스의 글꼴과 서식을 표준화하는 것.'],3,
  '서비스 위험을 결정할 때 고려할 요소는 (a)법률전문가 관리 계좌를 통한 자금 수취·송금 (b)R.22 활동과 무관한 신탁계좌를 통한 고객자금 입출금 (c)신탁계좌 이외 금융거래 요구 (d)의뢰인 지위·평판·신용의 부적절한 대표·보증 (e)실소유권을 숨길 수 있는 서비스 등이에요. "문서 작성 서비스의 글꼴과 서식 표준화"는 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  '법률가를 위한 RBA 가이던스에서 고위험 요소로 언급되는 서비스에 대한 설명으로 가장 옳은 것은?',
  ['신탁계좌 이외의 금융거래 요구는 어떠한 경우에도 위험 요소가 될 수 없다.','고객이 법률 전문가의 신탁계좌(고객을 위하여 법률 전문가가 보유하고 있는 계좌) 이외의 금융거래를 요구할 수 있는 서비스는 위험 요소로 고려되어야 한다.','법률 전문가의 신탁계좌를 통한 자금 처리는 위험과 전혀 무관하다.','실소유권을 숨길 수 있는 서비스는 위험 요소로 고려할 필요가 없다.'],1,
  '고객이 법률 전문가의 신탁계좌 이외의 금융거래를 요구할 수 있는 서비스는 거래/서비스 위험의 고려 요소 중 하나로 명시되어 있어요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스(2019년)에 대한 설명으로 옳지 않은 것은?',
  ['FATF의 RBA 가이던스는 국가의 ML/TF에 대한 위험평가와 AML/CFT 관련 법률 및 규제 체계를 고려하여 RBA 이행을 지원하는 것을 목표로 하며, 회계 전문가 및 감독자를 위한 구체적인 지침을 제공한다.','위험기반접근법(RBA)은 FATF 권고안의 효과적인 이행에 핵심이며, 이는 감독자, 금융기관 및 회계사의 위험 식별, 평가 및 노출된 자금세탁 및 테러자금조달(ML/TF) 위험을 이해하고 가장 적절한 완화 조치를 구현함을 의미한다.','이 가이던스는 회계사의 비즈니스 규모나 복잡성과 무관하게 모든 회계사에게 획일적으로 동일한 위험평가 기준을 적용하도록 강제한다.','ML/TF 위험평가의 개발은 RBA 적용의 핵심 출발점이며 비즈니스의 특성, 규모 및 복잡성에 비례해야 한다. 가장 일반적인 위험평가 기준은 국가 또는 지리적 위험, 고객 위험, 서비스/거래 위험 등을 말한다.'],2,
  'ML/TF 위험평가의 개발은 "비즈니스의 특성, 규모 및 복잡성에 비례"해야 한다고 명시되어 있어요. "규모나 복잡성과 무관하게 모든 회계사에게 획일적으로 동일한 기준을 적용"한다는 서술은 원문과 반대예요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스에서 고객확인(CDD) 관련 내용에 대한 설명으로 가장 옳은 것은?',
  ['이 가이던스는 오직 강화된 CDD 절차만을 상세히 다루고 있으며, 일반적인 간소화된 CDD나 저위험 고객에 대한 절차는 이 문서의 적용 범위에서 완전히 배제되어 있다','회계사는 최초 계약 체결 시점에 신규 고객확인만 1회 수행하면 충분하며, 이후 거래 관계가 지속되는 동안 발생하는 위험 변화에 대한 지속적인 고객확인은 요구되지 않는다','이 가이던스는 고객확인(CDD)이나 실제소유자 식별과 같은 절차적 사항은 전혀 다루지 않고, 오직 회계 감사 기준과 재무제표 작성 원칙만을 규정하고 있다','이 가이던스는 회계사가 신규 및 지속적인 고객확인(CDD)을 수행함에 있어서 정책 및 절차를 설계할 때 노출된 ML/TF 위험을 해결해야 함을 강조하며, 실제소유자 식별 및 검증에 관한 회계사의 의무를 설명하고, 일반 CDD, 간소화된 CDD 및 강화된 CDD의 사례를 제공한다.'],3,
  '이 가이던스는 신규 및 지속적인 고객확인(CDD) 수행 시 정책·절차 설계에서 ML/TF 위험을 해결해야 함을 강조하고, 실제소유자 식별·검증 의무를 설명하며, 일반 CDD·간소화된 CDD·강화된 CDD 사례를 모두 제공해요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스에서 감독 및 모니터링에 대한 설명으로 가장 옳은 것은?',
  ['회계 분야의 감독은 오직 정부기관만이 담당할 수 있으며 자율규제기관은 어떠한 역할도 할 수 없다.','이 가이던스는 감독자를 위한 내용을 전혀 포함하지 않는다.','감독 및 모니터링은 이 가이던스의 범위 밖의 사안이다.','이 가이던스는 회계사의 감독자들을 위한 내용을 담고 있으며 감독 및 모니터링에서 자율 규제기관(SRB)의 역할을 강조하고 있다.'],3,
  '이 가이던스는 회계사의 감독자들을 위한 내용을 담고 있으며, 감독·모니터링에서 자율규제기관(SRB, Self-Regulatory Body)의 역할을 강조하고 있어요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스에서 회계사의 고위경영진의 책임에 대한 설명으로 가장 옳은 것은?',
  ['ML/TF 위험 관리는 오로지 말단 실무 직원만의 책임 영역에 속할 뿐이며, 고위경영진의 책임과는 무관한 것으로 이 가이던스가 규정하고 있는 것으로 이해해야 한다','비즈니스 관계를 수립하거나 유지하는 단계에서는 ML/TF 위험을 굳이 고려할 필요가 없는 것으로 이 가이던스가 정하고 있는 것으로 이해해야 한다','고위경영진이 부담하는 책임에 관한 내용은 이 가이던스에 전혀 포함되어 있지 않으며, 별도의 다른 문서에서만 다루어지는 것으로 이해해야 한다','이 가이던스는 회계사의 핵심 비즈니스 가치를 육성하고 촉진하기 위한 고위경영진의 책임과, 회계사가 비즈니스 관계를 수립하거나 유지할 때 ML/TF 위험을 관리하도록 노력해야 할 것을 강조하고 있다.'],3,
  '이 가이던스는 회계사의 핵심 비즈니스 가치를 육성·촉진하기 위한 고위경영진의 책임과, 회계사가 비즈니스 관계를 수립·유지할 때 ML/TF 위험을 고려해야 함을 강조해요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스에서 실제소유자 요건 및 지명자 약정에 대한 감독의 중요성에 대한 설명으로 가장 옳은 것은?',
  ['이 가이던스는 실제소유자의 요건 및 지명자 약정(nominee arrangement)에 대한 감독의 중요성을 강조하며, 회계사가 법인 및 법적 계약에 대한 최신의 정확한 실제소유자 정보를 관리해야 하고 적정 시기에 관할 감독당국에 필요한 정보를 제공하는 것이 감독 체계 확인에 어떻게 도움이 되는지를 강조한다.','관할 감독당국에 대한 정보 제공 절차는 이 가이던스가 다루는 핵심 관심사와는 무관하며, 오히려 정보 제공을 최소화하는 것이 회계사의 직업윤리상 바람직한 태도로 서술되어 있는 것으로 이해해야 한다','지명자 약정(nominee arrangement)이라는 개념은 이 가이던스에서 자금세탁 위험과 관련해 전혀 언급되거나 다루어지지 않는, 완전히 무관한 개념으로 이해해야 한다','회계사는 법인 고객의 실제소유자 정보를 최신으로 유지하거나 관리할 의무를 전혀 부담하지 않으며, 이는 전적으로 고객 스스로가 관리해야 할 사항으로 이 가이던스가 정하고 있는 것으로 이해해야 한다'],0,
  '이 가이던스는 실제소유자의 요건 및 지명자 약정(nominee arrangement)에 대한 감독의 중요성을 강조하며, 회계사가 법인 및 법적 계약에 대한 이해를 바탕으로 실제소유자 정보를 최신으로 유지·관리하고 감독당국에 필요한 정보를 제공할 수 있어야 함을 설명해요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스 본문 60번 문단에 대한 설명으로 옳지 않은 것은?',
  ['회계사는 ML/TF에 사용될 수 있는 특정 고객군을 고려하여 회사의 위험을 식별하고 평가하기 위한 적절한 조치를 취해야 하며, 이는 일반적으로 전체 고객의 계약수락 절차의 일부로 수행된다.','회계사는 위험평가를 문서화해야 하며, 최신 상태로 유지하고 위험평가 정보를 관할 기관 및 감독자에게 제공할 적절한 메커니즘을 갖추어야 한다.','회계사의 위험평가는 구두로만 이루어지면 충분하며 어떠한 문서화도 필요하지 않다.','ML/TF 위험평가의 특성과 범위는 비즈니스 유형, 고객의 특성 및 운영 규모에 적합해야 한다.'],2,
  '회계사는 "위험평가를 문서화"해야 하며 최신 상태로 유지하고 필요시 관할 기관·감독자에게 제공할 수 있는 메커니즘을 갖추어야 해요. "구두로만 이루어지면 충분하며 문서화가 필요하지 않다"는 서술은 원문과 정반대예요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스 본문 61번 문단에서 제시하는 ML/TF 위험의 세 가지 범주에 해당하지 않는 것은?',
  ['국가/지리적 위험.','고객 위험.','회계사 개인의 정치적 성향에 따른 위험.','거래/서비스 및 관련 전달채널 위험.'],2,
  'ML/TF 위험은 (a)국가/지리적 위험 (b)고객위험 (c)거래/서비스 및 관련 전달채널 위험의 세 가지 범주로 구성될 수 있어요. "회계사 개인의 정치적 성향에 따른 위험"은 이 범주에 해당하지 않아요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스 본문 62번 문단에 대한 설명으로 가장 옳은 것은?',
  ['회계사는 위험 요소 중 단 하나만 고려하면 충분하다.','완화 수준 결정은 위험 요소 고려와 무관하게 이루어져야 한다.','이 문단은 위험평가와 무관한 내용을 다룬다.','회계사는 위험을 평가할 때, 전반적인 위험 수준과 적용할 적절한 완화 수준을 결정하기 전에 모든 관련 위험 요소를 고려해야 한다.'],3,
  '회계사는 위험을 평가할 때 전반적인 위험 수준과 적용할 적절한 완화 수준을 결정하기 전에 "모든 관련 위험 요소"를 고려해야 해요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스 65번 문단에 대한 설명으로 가장 옳은 것은?',
  ['지속적인 모니터링의 수준과 빈도는 고객의 위험도나 거래 관계의 특성과는 무관하게, 모든 고객에게 예외 없이 동일한 수준으로 고정되어 적용되어야 하는 것으로 이 가이던스가 정하고 있는 것으로 이해해야 한다','지속적인 모니터링 및 검토의 수준과 정도는 고객/거래위험에 대한 포괄적인 평가 및 고객과의 관계의 특성과 빈도에 따라 달라지며, 회계사는 권한 당국, 자율규제기관 또는 기타 신뢰할 수 있는 출처(회계사 추천 포함), 지정된 권한당국으로부터 받은 정보를 기반으로 특정 고객의 위험평가를 조정해야 할 수도 있다.','고객과의 관계가 얼마나 빈번한지 여부는 지속적 모니터링의 수준을 결정하는 것과는 전혀 관련이 없는 요소로, 이 가이던스에서도 고려 대상으로 언급되지 않는 것으로 이해해야 한다','회계사는 권한당국이나 자율규제기관 등 외부 출처로부터 얻은 정보를 고객 위험평가 과정에 전혀 반영해서는 안 되며, 오직 내부적으로 수집한 정보만을 활용해야 하는 것으로 이 가이던스가 정하고 있는 것으로 이해해야 한다'],1,
  '지속적인 모니터링 및 검토의 수준과 정도는 고객/거래위험에 대한 포괄적인 평가 및 고객과의 관계의 특성·빈도에 따라 달라지며, 회계사는 권한당국·자율규제기관 등 외부 출처의 정보도 위험평가에 반영해야 해요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스 67~68번 문단에 대한 설명으로 옳지 않은 것은?',
  ['보편적으로 인정되는 위험 범주는 없지만 지침서에 제공되는 예시는 가장 일반적으로 식별되는 위험의 범주이며, 이러한 위험 범위를 적용하는 단일 방법론은 없다.','잠재적인 ML/TF의 전반적인 위험을 평가할 때 위험 범주에 부여된 가중치는 회계사 및/또는 회사가 제공하는 서비스의 규모, 정교함, 성격 및 범위에 따라 달라질 수 있으며, 이러한 기준은 개별적으로가 아니라 전체적으로 고려할 필요가 있다.','위험 범주에 대한 가중치 부여 방법론은 전 세계적으로 단 하나의 표준화된 공식이 존재하며 모든 회계사가 이를 그대로 따라야 한다.','소규모 회사 및 단독 개업자의 경우에는 제공하는 서비스를 살펴보는 것이 바람직하다(예: 회사 관리 서비스 제공은 다른 서비스보다 더 큰 위험을 수반할 수 있음).'],2,
  '보편적으로 인정되는 위험 범주는 없으며, 위험 범위를 적용하는 "단일 방법론은 없다"고 명시되어 있어요. 회계사는 개별 관행과 합리적인 판단에 따라 각 위험 요소에 부여할 가중치를 독립적으로 평가해야 해요. "전 세계적으로 단 하나의 표준화된 공식이 존재하며 그대로 따라야 한다"는 서술은 원문과 정반대예요.','ultra'),
M('jd3_11',
  '회계사를 위한 RBA 가이던스 69번 문단에서 언급하는 실소유권 은폐 관련 FATF 자료에 해당하지 않는 것은?',
  ['2014년 FATF 투명성 및 실제소유자 지침.','2001년 FATF 40 권고사항 최초 제정 문서.','2018년 FATF 및 실제소유자 은폐에 관한 공동 보고서.','범죄자들이 자산과 거래의 실소유권을 은폐하기 위해 사용하는 다양한 기술과 메커니즘에 대한 일반적인 메커니즘과 방법론 제시.'],1,
  '69번 문단은 실소유권 은폐 관련하여 2014년 FATF 투명성 및 실제소유자 지침과 2018년 FATF 및 실제소유자 은폐에 관한 공동 보고서를 언급하고 있어요. "2001년 FATF 40 권고사항 최초 제정 문서"는 이 문단이 언급하는 자료가 아니에요.','ultra'),
M('jd3_11',
  '부동산 중개업자를 위한 가이던스(RBA Guidance for the Real Estate Sector, FATF 2022)의 Chapter 3(부동산전문가를 위한 지침)에 대한 설명으로 옳지 않은 것은?',
  ['이 지침은 각 특정 상황 내에서 고려되어야 하며, 예를 들어 전담 전문가의 도움 없이 이러한 기능을 수행하는 소기업 또는 부동산 전문가는 관할권의 법률 및 규제 요구사항을 준수하는 동시에 규모에 따라 실현 가능한 방식으로 모범 사례를 구현하기 위한 조치를 취해야 한다.','민간 부문에 대한 이 지침은 주로 부동산 매매와 관련하여 고객을 위한 거래에 관여하는 부동산 전문가를 위한 것이다.','부동산 전문가는 그들의 비즈니스가 ML/TF 위험에 어떻게 노출될 수 있는지 이해하고 시스템이 이러한 위험을 처리하도록 설계 및 구현되었는지 확인해야 한다.','이 지침은 모든 부동산 전문가에게 규모와 무관하게 동일한 방식의 모범 사례 구현을 강제하며 어떠한 실현 가능성도 고려하지 않는다.'],3,
  '이 지침은 소기업이나 전담 전문가가 없는 부동산 전문가의 경우 "규모에 따라 실현 가능한 방식으로" 모범 사례를 구현하도록 하고 있어요. "규모와 무관하게 동일한 방식을 강제하며 실현 가능성을 고려하지 않는다"는 서술은 원문과 반대예요.','ultra'),
M('jd3_11',
  '부동산 중개업자를 위한 가이던스에서 위험평가(3.1)에 대한 설명으로 가장 옳은 것은?',
  ['위험평가를 통해 비즈니스 활동 과정에서 잠재적으로 노출될 수 있는 ML/TF 위험을 식별할 수 있으며, 문서화된 위험평가에는 현재 및 새로운 ML/TF 추세가 포함되어야 하고 최신 상태로 유지되어야 한다.','위험평가는 문서로 작성할 법적 필요 없이, 담당자가 구두로 인식하고 기억하는 정도로만 충분한 것으로 가이던스가 정하고 있다','위험평가는 최초 한 번 작성하면 그 이후로는 시장 상황이나 규제 환경 변화와 무관하게 갱신할 필요가 전혀 없는 것으로 이해해야 한다','위험평가에는 과거의 정적인 위험 요소만 반영하면 충분하며, 새롭게 등장하는 ML/TF 추세를 반영할 필요는 없는 것으로 가이던스가 정하고 있다'],0,
  '부동산 중개업자를 위한 가이던스(3.1)는 위험평가를 통해 비즈니스 활동 과정에서 노출될 수 있는 ML/TF 위험을 식별할 수 있으며, 문서화된 위험평가에는 현재 및 새로운 ML/TF 추세가 반영되어야 한다고 설명해요.','ultra'),
M('jd3_11',
  '부동산 중개업자를 위한 가이던스 104번 문단에서 위험평가 시 고려해야 할 요소에 해당하지 않는 것은?',
  ['지리적 위험: FATF 또는 국가 당국이 고위험으로 식별한 지역.','부동산 중개업자가 소속된 협회의 연간 회비 납부 여부.','고객 위험: 거래의 실제 당사자.','거래 위험: 자금 조달 방법 및 전달 경로를 포함한 거래 전반.'],1,
  '위험평가 시 고려 요소는 지리적 위험(FATF·국가당국의 고위험 식별 지역), 고객 위험(거래의 실제 당사자), 거래 위험(자금조달 방법·전달경로 포함 거래 전반)이에요. "부동산 중개업자가 소속된 협회의 연간 회비 납부 여부"는 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  '부동산 중개업자를 위한 가이던스 105~106번 문단에 대한 설명으로 옳지 않은 것은?',
