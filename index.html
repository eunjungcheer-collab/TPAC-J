  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF 권고사항 14는 MVTS 제공자에 대한 인가·등록 및 감시체계를 규정한다.\nㄴ. FATF 권고사항 6은 유엔안보리결의 1267호(1999), 1373호(2001) 등에 명시된 의무사항에 따른 동결 조치를 요구한다.\nㄷ. FATF 권고사항 21은 선의로 STR을 보고한 금융회사 임직원에 대한 면책(safe harbor) 및 tipping-off 금지를 규정한다.\nㄹ. FATF 권고사항 26은 범죄자나 관련자가 금융회사의 지배지분을 소유하는 것을 방지하는 조치와 위장은행 설립·운영 금지를 규정한다.',
  ['2개.','1개.','4개.','3개.'],2,
  'ㄱ~ㄹ 모두 옳은 설명이에요. 권고사항 14(MVTS), 6(정밀금융제재-테러), 21(면책 및 tipping-off금지), 26(지배지분 소유 방지·위장은행 금지)의 내용을 정확히 구분해야 풀리는 종합형 문제예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 26의 건전성 규제 관련 바젤위원회 핵심원칙 적용에 대한 설명으로 옳지 않은 것은?',
  ['바젤위원회 핵심원칙을 적용받는 금융회사의 경우, 건전성을 목적으로 적용하지만 자금세탁 및 테러자금조달과도 관련 있는 규제와 감독조치를 AML/CFT 목적을 위하여 유사한 방법으로 적용하여야 한다.','핵심원칙을 적용받지 않는 그 외의 금융회사는 허가나 등록을 받아야 하고, 관련 분야의 자금세탁 및 테러자금조달의 위험을 고려하여 AML/CFT를 위한 적절한 규제와 감독 혹은 관리(oversight)를 받아야 한다.','AML/CFT 목적에 따른 금융회사의 본사와 지점, 자회사에 대한 통합적 그룹 차원의 감독이 포함되어야 한다.','자금 또는 가치 이전의 서비스를 제공하거나 환전업(money or currency changing)을 영위하는 기업들은 규제나 감독의 대상에서 완전히 면제된다.'],3,
  '자금 또는 가치 이전의 서비스를 제공하거나 환전업을 영위하는 기업들은 "최소한으로 허가나 등록을 받아야" 하고, 국가적 AML/CFT 의무사항에 부합하기 위한 효과적인 모니터링 체제의 대상이 되어야 해요. "규제나 감독의 대상에서 완전히 면제된다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 27(검사자의 권한)에 대한 설명으로 옳지 않은 것은?',
  ['감독기관은 금융회사의 AML/CFT 의무사항 이행 여부 모니터링과 관련된 정보를 금융회사로부터 요구할 수 있고, 금융회사가 이러한 요구사항에 응하지 않는 경우 권고사항 35에 의거한 제재를 부과할 수 있는 권한을 가져야 한다.','감독기관은 검사권한 등 자금세탁 및 테러자금조달을 방지하기 위한 금융회사의 의무 이행 여부를 감독 또는 모니터링하고 이를 확인할 수 있는 적절한 권한을 가져야 한다.','자금세탁 및 테러자금조달 방지에 대한 의무 준수 여부를 확인하기 위한 감독기관의 권한은 상황의 심각성에 따라 비례하고 폭넓어야 하며, 상황에 따라 징계처분과 금융제재를 부과하고 금융회사의 사업허가를 취소(withdraw), 제한 또는 정지시킬 수 있는 권한도 포함된다.','감독기관의 검사권한은 상황의 심각성과는 무관하게 사전에 정해진 단일한 수준의 제재만을 부과하도록 권고 27이 규정하고 있는 것으로 이해해야 한다'],3,
  '권고 27은 감독기관의 검사권한이 상황의 심각성에 비례해 폭넓게(징계처분·금융제재·사업허가 취소 등 포함) 부과될 수 있어야 한다고 규정해요. "심각성과 무관하게 사전에 정해진 단일한 수준의 제재만 부과한다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 28에서 카지노 외의 기타 특정 전문직과 비금융 사업자(other categories of DNFBPs)에 대한 규제·감독에 대한 설명으로 옳은 것은?',
  ['기타 DNFBP에 대한 규제·감독은 위험도와 무관하게 일률적으로 동일한 강도로 이루어져야 한다.','자율규제기구(SRB)가 이 업무를 수행하는 경우, SRB는 그 회원들의 자금세탁 및 테러자금조달 방지의무의 이행 여부를 확인할 수 있어야 한다.','각국은 기타 특정 전문직과 비금융 사업자의 AML/CFT 의무사항 준수 여부를 확인하여야 하며, 이는 위험기반으로 행해져야 한다.','이는 오직 권한 당국에 의해서만 수행될 수 있으며, 자율규제기구(SRB)는 어떠한 경우에도 관여할 수 없다.'],1,
  '권고사항 28은 기타 특정 전문직과 비금융 사업자에 대한 AML/CFT 의무 준수 여부 확인이 위험기반으로 행해져야 하며, 권한 당국"이나" 적절한 자율규제기구(SRB, Self-Regulatory Body)에 의하여 수행될 수 있다고 규정해요. SRB가 수행하는 경우, SRB는 그 회원들의 자금세탁·테러자금조달 방지의무의 이행 여부를 확인할 수 있어야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 30(법집행기관과 조사당국의 책임)에 대한 설명으로 옳지 않은 것은?',
  ['각국은 지정된 법집행당국이 자국의 AML/CFT 정책 기틀(framework) 내에서 자금세탁 및 테러자금조달 관련 수사에 대한 책임을 지도록 하여야 한다.','금융수사는 반드시 전제범죄 수사가 완전히 종결되고 유죄가 확정된 이후에만 별도로 개시할 수 있다.','이러한 지정된 법집행당국은 적어도 모든 대규모 범죄수익 관련 사건에서 자금세탁, 테러자금조달 및 이와 연루된(associated) 전제범죄를 수사할 때 적극적인 병시에 금융수사기법(pro-active parallel financial investigation)을 개발하여야 한다.','각국은 필요시 여러 분야의 전문가들로 구성된 금융자산수사팀(multi-disciplinary groups specialised in financial or asset investigation)을 영구적 또는 임시적으로 운용하여야 한다.'],1,
  '권고사항 30은 대규모 범죄수익 관련 사건에서 자금세탁·테러자금조달 및 연루된 전제범죄를 수사할 때 "적극적인 병시에 금융수사기법(pro-active parallel financial investigation)"을 개발하도록 요구해요. 즉 전제범죄 수사와 "병행하여" 금융수사를 진행해야 하며, "전제범죄 수사가 완전히 종결되고 유죄가 확정된 이후에만" 개시할 수 있다는 서술은 원문과 반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 32(현금휴대반출입 관리)에 대한 설명으로 옳지 않은 것은?',
  ['현금이나 무기명지급수단이 테러자금조달, 자금세탁 또는 전제범죄와 연루된 경우라도, 각국은 이를 몰수할 수 있는 어떠한 법적 조치도 마련할 필요가 없다.','각국은 허위 신고·공개를 하는 자에 대하여 위반사항에 비례하며 효과적이고 억제력 있는 제재조치를 마련하여야 한다.','각국은 테러자금조달이나 자금세탁 또는 전제범죄와 관련 있다고 의심되거나 허위로 신고·공개된 현금이나 무기명지급수단의 휴대반출입을 막거나 제한할 수 있는 법적 권한을 권한당국에 부여하여야 한다.','각국은 세관신고시스템(declaration system) 및/또는 정보공개체제(disclosure system) 등을 통해 현금(currency)과 무기명지급수단(bearer negotiable instrument)이 물리적으로 국경 간 이전되는 것을 탐지할 수 있는 조치를 마련하여야 한다.'],0,
  '현금이나 무기명지급수단이 테러자금조달·자금세탁·전제범죄와 연루된 경우, 각국은 권고사항 4에 따른 법적 조치를 포함한 "몰수할 수 있는 조치를 적용하여야 한다"고 명시되어 있어요. "몰수할 수 있는 어떠한 법적 조치도 마련할 필요가 없다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 33(통계)에서 각국이 종합적인 통계를 작성할 때 최소한으로 포함되어야 하는 사항에 해당하지 않는 것은?',
  ['수집·제공된 STR(의심거래보고)에 관한 통계.','금융회사 임직원의 개인 신용카드 사용 내역에 관한 통계.','자금세탁 및 테러자금조달 관련 수사, 기소, 유죄판결에 관한 통계.','동결·압수·몰수된 재산에 관한 통계, 사법공조 및 기타 국제협력 요청에 관한 통계.'],1,
  '권고사항 33이 요구하는 종합적 통계는 STR 관련 통계, 자금세탁·테러자금조달 관련 수사·기소·유죄판결 통계, 동결·압수·몰수된 재산에 관한 통계, 사법공조 및 기타 국제협력 요청에 관한 통계예요. "금융회사 임직원의 개인 신용카드 사용 내역"은 이 권고사항이 요구하는 통계 항목이 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 37(국제사법공조)에 대한 설명으로 옳지 않은 것은?',
  ['금융회사가 비밀 혹은 기밀유지의 법적 의무가 있다는 이유로 사법공조 요청을 거부하여서는 안 된다.','각국은 자금세탁 및 관련 전제범죄와 테러자금조달의 수사, 기소 및 관련 사법절차(proceedings)에 최대한 폭넓은 사법공조를 신속하고, 건설적이며 효과적으로 제공하여야 한다.','각국은 사법공조를 금지하거나 비합리적인 또는 부당한 제한조건을 두어서는 안 되며, 범죄행위가 재정문제(fiscal matters)와 관련 있는 것으로 사료된다는 이유 하나만으로 사법공조 요청을 거부하여서는 안 된다.','각국은 쌍방가벌성(dual criminality) 요건이 부재한 경우, 강압적 행위의 수반 여부와는 관계없이 사법공조 요청을 거부하는 것이 권고 37의 원칙적인 태도인 것으로 이해해야 한다'],3,
  '권고 37은 쌍방가벌성 요건이 없더라도 강압적 행위가 수반되지 않는 지원의 경우 사법공조를 제공하도록 요구해요. "강압적 행위 수반 여부와 무관하게 거부하는 것이 원칙적 태도"라는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 37에서 쌍방가벌성(dual criminality) 요건에 대한 설명으로 가장 옳은 것은?',
  ['사법공조를 위해 쌍방가벌성이 요구되는 경우, 양국 모두 해당 범죄에 전제되는 행위를 불법화하고 있다면 양국이 이를 같은 유형의 범죄로 분류하는지, 동일한 용어로 지칭하는지와 무관하게 요건이 충족된 것으로 본다','쌍방가벌성 요건은 양국이 해당 범죄를 완전히 동일한 법률 조문의 문언과 동일한 용어를 사용하여 규정하고 있어야만 비로소 충족되는 매우 엄격한 형식적 요건이다','쌍방가벌성 요건은 사법공조 절차와는 완전히 무관하며, 오로지 국내 형사재판에서 유죄판결의 형량을 정하는 양형 기준으로만 활용되는 개념이다','쌍방가벌성 요건은 양국이 해당 범죄를 같은 유형의 범죄로 분류하는지 여부와는 무관하게, 오직 범죄에 대한 법정형의 상한이 동일한 경우에만 충족된다'],0,
  '쌍방가벌성이 요구되는 경우, 양국 모두 해당 범죄의 전제행위를 불법화하고 있다면 같은 유형 분류·동일 용어 사용 여부와 무관하게 요건이 충족돼요. 동일 조문·용어 요구나 사법공조 무관, 법정형 상한 동일성 요구는 모두 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 38(국제사법공조: 동결과 몰수)에 대한 설명으로 옳지 않은 것은?',
  ['자국법의 기본원칙과 일관되지 않는 경우를 제외하고, 기소전몰수(non-conviction based confiscation) 기반의 소송절차와 관련 잠정조치를 기반으로 한 요청 등에도 대응할 수 있어야 한다.','국제사법공조를 통한 동결·몰수 요청에 대해서는 자국법의 기본원칙에 위배되는 경우에도 이를 이유로 거절할 수 없도록 권고 38이 규정하고 있는 것으로 이해해야 한다','각국은 세탁된 재산, 자금세탁·전제범죄 및 테러자금조달의 수익, 이러한 범죄행위에 사용되었거나 사용될 의도가 있는 수단, 또는 이에 상응하는 가치의 재산에 대하여 외국으로부터 확인, 동결, 압수 및 몰수 요청이 있는 경우, 이에 대하여 신속한 대응을 취할 수 있는 권한을 가지고 있어야 한다.','각국은 몰수된 재산을 상호 배분하는 문제(sharing of confiscated assets)를 포함한 압수 및 몰수 소송절차를 관리하는 방식(arrangements for coordinating seizure and confiscation proceedings)도 마련하여야 한다.'],1,
  '권고 38은 자국법의 기본원칙과 일관되지 않는 경우를 제외하고 동결·몰수 요청에 대응하도록 해요. "자국법의 기본원칙에 위배되는 경우에도 이를 이유로 거절할 수 없다"는 서술은 원칙과 예외를 뒤바꿔 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 39(범죄인 송환)에 대한 설명으로 옳지 않은 것은?',
  ['각국은 자금세탁 및 테러자금조달 관련 범죄인 송환 요청을 과도한 지체(undue delay) 없이 건설적이고 효과적으로 이행하여야 한다.','각국은 테러리즘, 테러행위나 테러단체에 대한 자금조달 혐의를 받은 개인에게 피난처를 제공하지 않도록 가능한 모든 조치를 취하여야 한다.','국적만을 근거로 범죄인 송환을 하지 않는 국가라도, 자국민에 대한 어떠한 후속 조치도 취할 필요가 없다.','각국은 자금세탁 및 테러자금조달을 범죄인 송환이 가능한 범죄로 규정하여야 한다.'],2,
  '국적만을 근거로 범죄인 송환을 하지 않는 국가의 경우, 타국의 범죄인 송환요청을 받은 후 요청사항에 명시된 범죄를 기소하는 목적으로 해당 사건을 자국의 권한당국에 송치하여야 하며, 권한당국은 자국법상 중죄(offence of a serious nature)를 처리하는 방식과 마찬가지로 해당 범죄에 대한 판결과 사법절차를 행하여야 해요. "어떠한 후속 조치도 취할 필요가 없다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 39에서 범죄인 송환 관련 각국의 의무 (a)~(d)에 대한 설명으로 옳지 않은 것은?',
  ['(a) 자금세탁 및 테러자금조달을 범죄인 송환이 가능한 범죄로 규정하여야 한다.','(d) 각국은 범죄인 송환의 효과적인 이행을 위한 법률체계 마련 여부와 무관하게, 오직 개별 사건에서의 정치적 판단만으로 송환 여부를 결정하면 충분하다','(c) 요청 이행에 비합리적이거나 부당한 제한조건을 두어서는 안 된다.','(b) 필요시 범죄인 송환 요청을 우선순위로 하는 것을 포함, 이를 시의적절하게 이행하기 위한 명확하고 효율적인 절차를 두어야 하며, 해당 요청 처리 진행을 모니터링하기 위한 관리시스템(case management system)을 운용해야 한다.'],1,
  '권고 39 (d)는 각국이 범죄인 송환의 효과적 이행을 위해 명확한 정책·절차를 포함한 법률체계를 마련하도록 요구해요. "법률체계 마련 여부와 무관하게 개별 사건의 정치적 판단만으로 충분하다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF 권고사항 29는 STR 및 자금세탁·전제범죄·테러자금조달 관련 정보의 수집·분석·제공을 담당하는 중앙행정기관으로서 FIU 설립을 요구한다.\nㄴ. FATF 권고사항 31은 권한당국이 소유자에게 반드시 사전 공지를 한 후에만 자산을 확인할 수 있는 절차를 갖추도록 요구한다.\nㄷ. FATF 권고사항 37은 쌍방가벌성 요건이 없으면 강압적 행위 수반 여부와 무관하게 사법공조를 예외 없이 전면 거부하도록 요구한다.\nㄹ. FATF 권고사항 39는 각국이 자국민을 송환해야 하며, 국적만을 근거로 송환하지 않는 경우 자국 권한당국에 사건을 송치하여 기소하도록 요구한다.',
  ['2개.','1개.','3개.','4개.'],0,
  'ㄱ, ㄹ은 옳은 설명이에요. 권고사항 37은 쌍방가벌성 요건이 없더라도 강압적 행위가 수반되지 않으면 사법공조를 제공하도록 요구하는데(ㄷ은 반대로 서술), 권고사항 31은 사전 공지 없이 자산을 확인할 수 있는 절차를 요구해요(ㄴ).','ultra'),
M('jd1_3',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] A국은 B국으로부터 특정 범죄자에 대한 범죄인 송환 요청을 받았으나, 자국 헌법상 자국민을 외국으로 송환하지 않는 원칙을 가지고 있어 국적을 이유로 송환을 거부하였다.',
  ['국적을 이유로 한 송환 거부 자체는 FATF 권고사항상 허용되는 사유이지만, 이후 아무런 후속 조치를 취하지 않는다면 그 자체로 권고사항 위반에 해당하는 것으로 이해해야 한다','A국은 국적을 이유로 송환을 거부한 이상, 그 이후로는 해당 사건과 관련해 어떠한 형태의 후속 조치도 취할 법적 필요가 없는 것으로 이해해야 한다','이 사안은 국제 형사공조의 문제가 아니라 오로지 양국 간의 순수한 외교적 사안일 뿐이며, FATF 권고사항이 규율하는 범위와는 무관한 것으로 이해해야 한다','A국은 국적을 이유로 송환을 거부하더라도, B국의 요청사항에 명시된 범죄를 기소하는 목적으로 해당 사건을 자국의 권한당국에 송치하고, 자국법상 중죄를 처리하는 방식과 마찬가지로 판결과 사법절차를 진행하여야 한다.'],3,
  '권고사항 39는 각국이 자국민을 송환해야 하되, 국적만을 근거로 송환하지 않는 경우에는 자국 권한당국에 사건을 송치해 기소하도록 요구해요. A국은 국적을 이유로 송환을 거부하더라도, B국 요청사항에 명시된 범죄를 기소하기 위해 자국 권한당국에 송치해야 해요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 기술적 평가(TC)의 평가 요소에 대한 설명으로 가장 옳은 것은?',
  ['기술적 이행요소(TC) 평가는, 해당 국가가 실제로 거두고 있는 자금세탁방지 성과나 효과와는 무관하게 오로지 법령의 문구만을 형식적으로 심사하는 것으로 이해해야 한다','기술적 이행요소(TC) 평가는 FATF의 40개 권고사항이 아니라, 오로지 유엔안전보장이사회의 결의만을 유일한 평가 기준으로 삼는 것으로 이해해야 한다','평가방법론의 기술적 이행요소는 FATF 권고사항들의 구체적 요구사항들의 이행조치들(법률과 강제수단의 체계, 권한당국의 존재, 권한과 그 행사 절차 등)을 말하며, 각 권고사항의 구체적인 요구사항들에 대하여 기준들의 목록으로 보여준다.','기술적 이행요소(TC) 평가에 활용되는 요소들은, 상호평가 라운드가 바뀔 때마다 완전히 다른 별개의 권고사항 체계로 전면 교체되어 사용되는 것으로 이해해야 한다'],2,
  'TC(기술적 평가)의 기술적 이행요소는 FATF 권고사항들의 구체적 요구사항의 이행조치(법률·강제수단 체계, 권한당국의 존재, 권한과 행사 절차 등)를 말하며, 각 권고사항의 구체적 요구사항에 대해 기준들의 목록으로 보여줘요. 이 기준들은 권고사항의 의무 요소를 완전하게 이행함을 나타내기 위해 반드시 갖춰야 하는 요소들이에요.','ultra'),
M('jd1_3',
  'IO-2(국제협력)의 세부 평가방법 항목에 대한 설명으로 옳지 않은 것은?',
  ['IO-2는 "국제협력을 통해 적절한 정보, 금융정보, 증거 등을 공유하고, 범죄자와 불법재산에 대한 조치를 추진한다"는 성과를 다룬다.','국내에서 발생했지만 국경을 초월하는 자금세탁, 관련 전제범죄, 테러자금조달 사건을 추적하기 위해 적절하고 적시의 국제적 협력을 통한 사법공조를 어느 정도로 모색해 왔는지도 평가 대상이다.','외국의 국제공조 요청이 있는 경우, 국제사법공조와 범죄인 송환을 얼마나 적극적이고 시의적절하게 하는지, 제공된 협력의 수준(quality)이 어떠한지도 평가 대상이다.','IO-2는 국내 사건에 대한 평가이므로, 권한당국이 법인과 신탁 등 법률관계에 대한 기본정보와 실제소유자 정보를 파악하고 교환하기 위한 외국의 공조 요청에 대한 대응 수준은 평가 대상에서 제외된다.'],3,
  'IO-2의 세부 평가항목에는 권한당국이 법인과 신탁 등 법률관계에 대한 기본정보와 실제소유자 정보를 파악하고 교환하기 위한 외국의 공조 요청에 대해 얼마나 잘 정보를 제공하고 대응하는가도 포함되어 있어요. "평가 대상에서 제외된다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29(FIU)의 세부 평가방법론 중 29.8에 대한 설명으로 옳지 않은 것은?',
  ['각국의 FIU는 에그몬트 그룹에 가입한 경우에 한하여 다른 국가 FIU와의 국제협력 의무를 이행하면 되는 것으로 이해해야 한다','FIU는 회원가입 조건에 대한 유보 없이 가입 신청을 해야 하며, 회원가입 절차에 적극 참여해야 한다.','FIU를 설립한 국가는 자국의 FIU가 에그몬트 그룹 회원이 아닌 경우, 에그몬트 그룹 회원가입을 신청해야 한다.','에그몬트 그룹은 각국 FIU 간의 정보 교환과 협력을 위한 국제기구로서의 역할을 한다.'],0,
  '29.8은 FIU를 설립한 국가가 자국 FIU가 에그몬트 그룹 회원이 아닌 경우 회원가입을 신청하도록 요구하지만, 이는 국제협력 자체의 전제조건이 아니에요. "에그몬트 그룹 가입한 경우에 한해서만 국제협력 의무를 이행하면 된다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF 평가방법론은 기술적 평가(TC)와 효과성 평가(IO)로 구성된다.\nㄴ. IO는 총 9개 항목으로 구성되며, IO.1은 정책/공조, IO.9는 확산금융제재이다.\nㄷ. IO-3은 국제협력을 통한 정보 공유와 법집행 공조를 다룬다.\nㄹ. KoFIU는 2002년 6월 13일 에그몬트 그룹에 가입하였다.\nㅁ. IO-8은 범죄수익과 수단에 대한 몰수를 다룬다.',
  ['2개.','3개.','4개.','5개.'],0,
  'ㄱ, ㅁ은 옳은 설명이에요. IO-3은 감독기관의 위험기반 감독을 다루는 것이며 국제협력은 IO-2의 내용이에요(ㄷ). IO는 9개가 아니라 11개 항목이고(ㄴ), KoFIU의 에그몬트 가입일은 6월 13일이 아니라 6월 5일이에요(ㄹ).','ultra'),
M('jd1_3',
  'FATF 상호평가(Mutual Evaluation)에 대한 설명으로 옳지 않은 것은?',
  ['상호평가는 FATF 사무국 직원이 아니라 회원국에서 파견된 전문가(평가관)들만으로 구성되는 평가팀이 진행하는 것으로 이해해야 한다','상호평가는 FATF가 각국의 국제기준 이행을 점검하고 후속조치를 통해 이행을 지속 관리하며 미이행국은 금융제재조치를 실행하는 과정을 말한다.','상호평가는 일반적으로 7~8년 주기로 실시하고 있다.','상호평가 절차는 자료 제출(6개월) → 현지실사(2~3주) → 보고서 작성(6~8개월) → 총회 토의 → 후속조치 결정 → 제재(ICRG 프로세스)로 구성되어 있다.'],0,
  'FATF 상호평가는 FATF 사무국 직원과 함께 회원국에서 파견된 전문가(평가관)들이 참여하는 평가팀이 진행해요. "사무국 직원이 아니라 회원국 파견 전문가들만으로 구성된다"는 서술은 사무국 직원의 참여를 배제해 옳지 않아요.','ultra'),
M('jd1_3',
  'The FATF Methodology 다이어그램에서 제시하는 평가 흐름에 대한 설명으로 가장 옳은 것은?',
  ['기술적 이행평가(TC)와 효과성 평가(IO)는 서로 완전히 독립적인 별개의 트랙으로만 진행되며, 두 평가 결과는 최종 보고서 작성 시 서로 통합·연계되지 않는 것으로 이해해야 한다','효과성 평가는 반드시 기술적 이행평가가 모두 완료된 이후에만 순차적으로 착수할 수 있으며, 두 평가를 병행해 동시에 진행하는 것은 방법론상 허용되지 않는 것으로 이해해야 한다','위험과 맥락(Risk and Context)을 바탕으로 기술적 이행평가(Technical Compliance Assessment)와 효과성 평가(Effectiveness Assessment)가 이루어지고, 이를 통해 통합된 결론과 권고 조치(Integrated conclusions and recommended actions)가 도출된다.','위험과 맥락(Risk and Context)이라는 요소는 다이어그램에서 참고 정보로만 표시될 뿐, 실제 기술적 이행평가나 효과성 평가 과정에는 전혀 반영되지 않는 형식적 요소에 불과한 것으로 이해해야 한다'],2,
  '위험과 맥락(Risk and Context)을 바탕으로 기술적 이행평가(TC)와 효과성 평가(IO)가 함께 진행되고 두 결과가 통합되어 최종 상호평가 결과가 도출돼요. 두 평가는 독립적이지 않고 서로 연계되며, 순차적으로만 진행되는 것도 아니에요.','ultra'),
M('jd1_3',
  '우리나라의 FATF 상호평가 이력에 대한 설명으로 옳지 않은 것은?',
  ['우리나라는 2009년 FATF의 상호평가를 받아 정회원에 가입하게 되었다.','우리나라는 2019년 FATF 제4차 라운드 기준으로 상호평가를 다시 주검하였다.','2019년 FATF 상호평가 결과는 우리나라에 대하여 자금세탁/테러자금조달 위험을 잘 이해하고 있고, 자금세탁방지 등을 위한 금융정보를 효과적으로 활용하고 있으며 범죄수익 환수도 좋은 성과를 내고 있다고 평가를 받았다.','2019년 FATF 상호평가에서 우리나라는 모든 항목에서 완벽한 평가를 받아 어떠한 개선 필요사항도 지적받지 않았다.'],3,
  '2019년 평가에서 우리나라는 좋은 평가를 받은 부분도 있었지만, 변호사·회계사 등 특정비금융사업자에 대해 자금세탁 및 테러자금조달 방지(AML/CFT) 의무를 부과해야 하고, 금융회사에 대한 AML/CFT 감독·검사, 법인과 신탁의 자금세탁 악용방지, 자금세탁범죄 수사·기소 강화가 필요하다는 개선 필요사항도 지적받았어요. "모든 항목에서 완벽한 평가를 받았다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  '2019년 FATF 제4차 라운드 상호평가에서 우리나라가 개선이 필요하다고 지적받은 사항에 해당하지 않는 것은?',
  ['변호사, 회계사 등 특정비금융사업자에 대해 자금세탁 및 테러자금조달 방지(AML/CFT) 의무를 부과해야 한다.','금융회사등에 대한 AML/CFT 감독·검사를 강화해야 한다.','우리나라의 카지노업은 AML/CFT 의무 대상에서 완전히 제외해야 한다는 지적을 받았다.','법인과 신탁의 자금세탁 악용방지 조치가 필요하다.'],2,
  '2019년 상호평가에서 지적받은 개선사항은 변호사·회계사 등 DNFBP에 대한 AML/CFT 의무 부과, 금융회사에 대한 감독·검사 강화, 법인·신탁의 자금세탁 악용방지, 자금세탁범죄 수사·기소 강화였어요. "카지노업을 AML/CFT 의무 대상에서 완전히 제외해야 한다"는 지적은 없었으며, 오히려 카지노는 이미 국내에서 특정금융정보법상 자금세탁방지의무를 부담하고 있어요.','ultra'),
M('jd1_3',
  'FATF 상호평가의 평가대상과 평가항목에 대한 설명으로 옳은 것은?',
  ['FATF 상호평가의 평가대상은 오직 법률이나 제도가 문언상 갖추어져 있는지 여부(기술적 평가) 하나에만 국한되며, 그러한 제도가 실제로 효과를 발휘하고 있는지에 대한 평가는 별도로 이루어지지 않는 것으로 알려져 있다','평가대상은 법률·제도 구축 여부(기술평가)와 제도의 효과적 이행 여부(효과성 평가)로 나뉘며, 평가항목은 각각 FATF 40개 권고사항의 기술적(법률·제도 구축) 이행 여부와 11개 즉시성과(Immediate Outcome)의 이행 여부이다.','평가항목은 오로지 FATF 40개 권고사항의 기술적 이행 여부만으로 구성되어 있을 뿐, 즉시성과(Immediate Outcome, IO)라는 별도의 평가항목 자체가 존재하지 않는 것으로 이해된다','상호평가에서 다루는 평가대상과 세부 평가항목은 매 라운드마다 특별한 기준이나 원칙 없이 무작위로 정해지는 것으로, 라운드 간 일관성을 기대하기 어려운 것으로 알려져 있다'],1,
  'FATF 상호평가의 평가대상은 법률·제도 구축 여부(기술평가)와 제도의 효과적 이행 여부(효과성 평가) 2가지로 나뉘며, 평가항목은 각각 FATF 40개 권고사항의 기술적 이행 여부와 11개 즉시성과의 이행 여부예요.','ultra'),
M('jd1_3',
  'FATF 상호평가 결과에 따른 후속점검 중 "정규 후속점검"의 기준에 대한 설명으로 가장 옳은 것은?',
  ['TC 기준으로는 PC 또는 NC가 8개 미만이고 핵심권고 5개 모두 C 또는 LC이어야 하며, IO 기준으로는 HE 또는 SE가 5개 이상이어야 정규 후속점검 대상이 될 수 있다.','TC 기준으로 PC 또는 NC가 20개 이상이면 정규 후속점검 대상이 된다.','IO 기준으로 LE가 6개 이상이면 정규 후속점검 대상이 된다.','정규 후속점검은 TC와 IO 기준을 전혀 고려하지 않고 임의로 결정된다.'],0,
  '정규 후속점검은 TC 기준으로 PC 또는 NC가 8개 미만이고 핵심권고 5개 모두 C 또는 LC인 경우, IO 기준으로 HE 또는 SE가 5개 이상인 경우에 해당돼요. "PC 또는 NC가 20개 이상"이거나 "LE가 6개 이상"인 경우는 오히려 ICRG 후속점검 대상에 해당해요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF 상호평가는 일반적으로 4~5년 주기로 실시된다.\nㄴ. 상호평가 절차는 현지실사만으로 완결되며 별도의 자료 제출이나 보고서 작성 절차는 없다.\nㄷ. 상호평가는 조약과 같은 국제법적 구속력을 갖지 않는다.\nㄹ. 우리나라는 2009년 FATF 상호평가를 받아 정회원에 가입하였고, 2019년 제4차 라운드 상호평가를 다시 받았다.\nㅁ. TC 평가등급은 C, LC, PC, NC로 구성되고 IO 평가등급은 HE, SE, PE, LE로 구성된다.',
  ['2개.','3개.','5개.','4개.'],1,
  'ㄷ, ㄹ, ㅁ은 옳은 설명이에요. 우리나라는 실제로 2009년 10월 14일 FATF 정회원으로 가입했고(2001년 금융정보분석원 설립, 2006년 8월 옵서버 자격 취득을 거쳐), 2019년 1월부터 시작된 제4차 라운드 상호평가를 받아 2020년 결과보고서가 채택됐어요(ㄹ은 옳은 설명). 상호평가 절차는 자료 제출·현지실사·보고서 작성·총회 토의·후속조치 결정·제재로 구성되며 현지실사만으로 완결되지 않아요(ㄴ은 옳지 않음). 상호평가는 4~5년이 아니라 7~8년 주기예요(ㄱ은 옳지 않음).','ultra'),
M('jd1_3',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] A국은 FATF 상호평가에서 TC 기준 PC 또는 NC가 22개, 핵심권고 중 4개가 PC 또는 NC로 평가되었다.',
  ['A국의 평가 결과는 IO 기준과는 무관하므로 후속점검 대상 여부를 판단할 수 없다.','A국은 자동으로 정규 후속점검 대상이 된다.','이 사례는 상호평가 후속점검 기준과 무관한 가상의 상황이다.','A국은 TC 기준 PC 또는 NC가 20개 이상이고 핵심권고 3개 이상이 PC 또는 NC이므로 ICRG 후속점검 대상이 될 수 있다.'],3,
  'ICRG 후속점검 기준은 TC 기준으로 PC 또는 NC가 20개 이상이거나 핵심권고 3개 이상이 PC 또는 NC인 경우예요. A국은 PC 또는 NC가 22개이고 핵심권고 중 4개가 PC 또는 NC이므로 두 기준을 모두 충족하여 ICRG 후속점검 대상이 될 수 있어요.','ultra'),
M('jd1_3',
  'FATF 상호평가 제2차 라운드(1996~2003)의 특징에 대한 설명으로 옳지 않은 것은?',
  ['적용 대상을 금융회사에서 금융회사 및 비금융사업자(NFBPs)로 확대하고 STR 보고를 의무화하였다.','제2차 라운드는 "마약·중대범죄 금융조치기구로 역할·범위 확대"를 특징으로 하며, 포괄 범위를 마약에서 중대범죄로 확대하였다.','제2차 라운드에서는 테러자금조달 관련 9개 특별권고사항이 최초로 도입되었다.','법인에 대한 CDD 의무화 및 위장기업에 대한 특별주의가 도입되었고, 비협조국가(NCCT)를 선별하고 발표하였다.'],2,
  '테러자금조달 관련 9개 특별권고사항이 도입된 것은 제3차 라운드(2004~2012)의 특징이에요. 제2차 라운드는 마약에서 중대범죄로 포괄 범위를 확대하고 NCCT(비협조국가)를 선별·발표한 것이 핵심 특징이에요.','ultra'),
M('jd1_3',
  '<보기>의 각 라운드별 핵심 키워드를 시간 순서대로 옳게 나열한 것은?\nㄱ. 마약·중대범죄·테러로 확대, 이행을 실체·공고화\nㄴ. 비엔나 협약(1988) 관련 금융조치의 제도화\nㄷ. 제도의 실질적 이행과 효과성을 추구, 제도 성숙기\nㄹ. 마약·중대범죄 금융조치기구로 역할·범위 확대',
  ['ㄹ → ㄷ → ㄱ → ㄴ.','ㄴ → ㄹ → ㄱ → ㄷ.','ㄱ → ㄷ → ㄹ → ㄴ.','ㄷ → ㄹ → ㄴ → ㄱ.'],1,
  '순서는 제1차 라운드(비엔나 협약 관련 금융조치 제도화, 1990~1995) → 제2차 라운드(마약·중대범죄로 역할·범위 확대, 1996~2003) → 제3차 라운드(마약·중대범죄·테러로 확대, 2004~2012) → 제4차 라운드(제도의 실질적 이행과 효과성 추구, 2014~2022)예요.','ultra'),
M('jd1_3',
  '아시아태평양 자금세탁방지기구(APG, Asia Pacific Group on Money Laundering)에 대한 설명으로 옳지 않은 것은?',
  ['APG는 자금세탁방지를 위한 아·태지역 국가 간 협조를 위해 1998년 3월 설립되었으며, 2023년 현재 총 42개국의 회원으로 참여하고 있다.','우리나라는 APG 설립 이후 단 한 번도 공동의장국이나 운영위원회 위원을 역임한 적이 없다.','APG는 FATF 평가방법론에 의거해 회원국에 대한 상호평가를 실시하고 이행현황을 모니터하는 등 역내 국제기준 이행 및 국제협력 도모를 목적으로 활동하고 있다.','우리나라는 1998년 10월부터 APG 정회원으로 활동하고 있다.'],1,
  '우리나라는 2002년 7월부터 2004년 6월까지 APG 공동의장국을 역임하였고, 2013년부터 4년간 APG 운영위원회 위원을 연임하는 등 아·태지역의 자금세탁방지 선도국으로서 역할을 수행하고 있어요. "단 한 번도 역임한 적이 없다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  '유럽 자금세탁방지기구(MONEYVAL)에 대한 설명으로 옳지 않은 것은?',
  ['MONEYVAL은 FATF 정회원국만을 대상으로 하는 기구로, FATF 비회원국은 가입할 수 없다.','1997년 9월 유럽평의회 각료위원회에서는 FATF 회원이 아닌 유럽평의회 회원국에서 AML/CFT 조치를 위한 상호평가를 위하여 설립되었다.','2010년 자금세탁방지 및 테러자금조달 평가에 관한 유럽평의회 결의안 CM/Res(2010)12에 의해 처음 채택되었다.','2011년 1월 1일에는 MONEYVAL을 각료회의에서 직접 답변할 수 있는 독립적인 모니터링 메커니즘으로 격상하였다.'],0,
  'MONEYVAL은 "FATF 회원이 아닌" 유럽평의회 회원국에서 AML/CFT 조치를 위한 상호평가를 위해 설립된 기구예요. "FATF 정회원국만을 대상으로 하며 비회원국은 가입할 수 없다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF 상호평가는 총 5차 라운드로 구분되며, 제5차 라운드는 2024년부터 실시된다.\nㄴ. FSRB는 7개의 FATF 스타일 지역 기관으로 구성되어 있다.\nㄷ. APG는 1998년 3월 설립되었고 우리나라는 2003년부터 정회원으로 활동하고 있다.\nㄹ. EAG는 2004년 10월 서울에서 설립된 아시아 지역 AML/CFT 기구이다.\nㅁ. MENAFATF는 2004년 11월 바레인 마나마에서 설립이 결정되었고 본부는 바레인에 있다.',
  ['4개.','1개.','5개.','2개.'],1,
  'ㅁ만 옳은 설명이에요. FATF 상호평가는 5차가 아니라 아직 4차 라운드까지 진행되었고(ㄱ), FSRB는 7개가 아니라 9개 기관이며(ㄴ), 우리나라는 2003년이 아니라 1998년 10월부터 APG 정회원으로 활동해 왔고(ㄷ), EAG는 서울이 아니라 모스크바에서 설립된 유라시아 지역 기구예요(ㄹ). MENAFATF의 설립 결정 시점과 본부 소재지(바레인)만 옳게 서술되어 있어요(ㅁ).','ultra'),
M('jd1_2',
  '비엔나 협약(United Nations Convention Against Illicit Traffic In Narcotic Drugs and Psychotropic Substances, 1988)의 배경에 대한 설명으로 옳지 않은 것은?',
  ['비엔나 협약은 마약거래방지에 관한 전 세계의 규범이 되고 있는 UN의 협약이다.','우리나라는 동 협약을 기준으로 1995년 \'마약류 불법거래 방지에 관한 특례법\'을 제정하였다.','우리나라는 1998년에 동 협약 가입에 대하여 국회에서 비준하였다.','우리나라는 비엔나 협약을 제정 당시부터 원 서명국으로 참여하였으며, 별도의 국회 비준 절차 없이 협약이 자동으로 발효되었다.'],3,
  '우리나라는 1998년에 비엔나 협약 가입에 대하여 "국회에서 비준"하는 절차를 거쳤어요. "별도의 국회 비준 절차 없이 자동으로 발효되었다"는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  '비엔나 협약의 주요내용에 대한 설명으로 가장 옳은 것은?',
  ['비엔나 협약은 오직 마약 밀매에 대한 형사처벌만을 규정할 뿐, 자금세탁행위의 범죄화나 몰수, 국제협력에 대해서는 전혀 다루지 않는 협소한 협약으로 이해해야 한다','동 협약은 마약 등 관련 범죄수익의 자금세탁행위 범죄화 및 몰수를 포함하는 형사처벌, 범죄인도 및 사법공조 등에 관하여 규정하고 있으며, 주요 조항으로는 마약범죄의 정의, 자금세탁 행위의 범죄화, 몰수, 국제협력 등이 있다.','비엔나 협약은 마약 관련 범죄가 아니라 오로지 테러자금조달에 관한 사항만을 규정하는 협약으로 이해해야 한다','비엔나 협약은 범죄인도에 관한 규정만 두고 있을 뿐, 사법공조에 관한 규정은 전혀 포함하고 있지 않은 것으로 이해해야 한다'],1,
  '비엔나 협약은 마약 등 관련 범죄수익의 자금세탁행위 범죄화 및 몰수를 포함하는 형사처벌, 범죄인도 및 사법공조 등을 폭넓게 규정하고 있어요.','ultra'),
M('jd1_2',
  '비엔나 협약 제3조(범죄 및 제재) 제1항 나호에서 규정하는 자금세탁 관련 범죄행위에 대한 설명으로 옳지 않은 것은?',
  ['당해 재산이 마약범죄 등에 가담한 행위로부터 발생한 재산이라는 점을 알면서, 당해 재산의 불법 출처를 은닉하거나 위장할 목적으로 또는 이러한 범죄의 실행에 관여한 자들의 법적 책임을 면하도록 원조할 목적으로 행한 당해 재산의 전환 또는 양도.','이 항의 자금세탁 관련 규정은 재산의 취득·소지·사용 행위와는 무관하게, 재산의 이전이나 전환 행위에 대해서만 적용되는 것으로 이해해야 한다','이 항 가호의 규정에 따라 정해진 범죄로부터 발생한 재산이라는 점을 알면서 행한 당해 재산의 진정한 성질·출처·소재·처분·이동, 당해 재산에 대한 권리 또는 소유권의 은닉 또는 위장.','자금세탁 관련 범죄의 요건으로 필요한 인식, 고의 또는 목적은 객관적 사실관계에 의하여 추정할 수 있다.'],1,
  '비엔나 협약 제3조 제1항 나호는 재산의 취득·소지·사용 행위도 자금세탁 관련 범죄행위에 포함해요. "재산의 이전·전환 행위에 대해서만 적용될 뿐 취득·소지·사용 행위와는 무관하다"는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  '비엔나 협약 제3조 제5항에서 당사국의 법원 기타 재판관할권이 있는 관할당국이 범죄의 실행을 둘러싼 사실관계 중 특히 중요한 요소로 고려할 수 있도록 하여야 하는 사항에 해당하지 않는 것은?',
  ['범죄자가 과거에 해당 국가에서 납세 신고를 성실히 이행하였다는 사실.','범죄자가 소속된 조직범죄단체의 당해 범죄에 대한 관여.','범죄자의 다른 국제적 조직범죄행위에 대한 관여.','범죄자가 공직을 보유하고 있고 당해 범죄행위와 그 공직이 관련되어 있다는 사실, 미성년자의 희생 또는 이용.'],0,
  '비엔나 협약 제3조 제5항이 규정하는 중요 고려사항은 조직범죄단체 관여, 다른 국제적 조직범죄행위 관여, 조장된 다른 불법행위 관여, 폭력행사·무기사용, 공직 보유와 범죄의 관련성, 미성년자의 희생·이용 등이에요. "과거 납세 신고 성실 이행"은 이 조항이 규정하는 고려사항이 아니에요.','ultra'),
M('jd1_2',
  '비엔나 협약 제3조에 대한 설명으로 옳지 않은 것은?',
  ['이 조의 규정에 따라 정해진 범죄는 협약에 따른 당사국 간의 협력을 위하여, 당사국의 헌법상의 제약 및 기본적인 국내법을 침해하지 아니하는 한, 재정범죄, 정치범죄 또는 정치적 동기에 의한 범죄로 취급될 수 있어야 한다.','당사국은 이 조에 규정된 범죄를 행한 자의 기소와 관련된 국내법상의 법적 재량권이 법집행조치의 효과를 극대화하고 범죄의 실행을 억제할 필요성을 적절히 고려하여 행사되도록 노력하여야 한다.','이 조의 어떠한 규정도, 이 조에서 정하는 범죄 및 그에 대한 법률상 항변사유를 당사국의 국내법에 의하여 규정하고 또한 그러한 법률에 의하여 당해 범죄를 기소·처벌하여야 한다는 원칙에 영향을 미쳐서는 아니 된다.','당사국은 적절한 경우, 이 조 제1항의 규정에 따라 정해진 범죄에 대한 재판절차 개시와 관련하여 자국의 국내법상 장기간의 공소시효를 설정하여야 하며, 범죄혐의자가 사법처리를 회피하였을 경우 더욱 장기간의 시효를 설정하여야 한다.'],0,
  '제3조 제10항은 협약에 따른 당사국 간의 협력을 위해, 이 조에 따라 정해진 범죄는 헌법상 제약과 기본적 국내법을 침해하지 않는 한 재정범죄·정치범죄·정치적 동기에 의한 범죄로 취급되어서는 "아니 된다"고 규정해요. "취급될 수 있어야 한다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_2',
  '비엔나 협약 제7조(사법공조)에 대한 설명으로 옳지 않은 것은?',
  ['당사국은 은행의 비밀유지를 이유로 이 조에 따른 공조의 제공을 거절하여서는 아니 된다.','당사국은 이 조에 의하여, 제3조 제1항의 규정에 따라 정해진 범죄에 관한 수사, 기소 및 사법절차에서 상호 최대한의 사법공조를 제공하여야 한다.','당사국은 은행 비밀유지를 이유로 사법공조 제공을 거절할 수 있는 것으로 이해해야 한다','사법공조는 관계인으로부터의 증거 또는 진술의 취득, 재판 서류의 송달, 수색 및 압수의 집행, 물건 및 장소의 조사, 정보 및 증거물의 제공, 은행·재무·법인 또는 상업기록을 포함한 관련 문서 및 기록의 원본 또는 인증등본의 제공 등의 목적으로 요청할 수 있다.'],2,
  '비엔나 협약 제7조는 은행 비밀유지를 이유로 공조 제공을 거절해서는 안 된다고 규정해요. "은행 비밀유지를 이유로 사법공조 제공을 거절할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  '비엔나 협약 제7조에서 사법공조를 거절할 수 있는 사유에 해당하지 않는 것은?',
  ['공조요청이 이 조의 규정에 따라 이루어지지 않은 경우.','피요청당사국이 당해 요청을 이행함으로써 자국의 주권, 안전, 공공질서 또는 기타 중요한 이익을 해할 우려가 있다고 판단하는 경우.','요청을 이행하는 것이 피요청당사국의 사법공조에 관한 법제에 반하게 되는 경우.','요청당사국이 해당 범죄사건에 대해 자국 언론에 보도자료를 배포한 사실이 있는 경우.'],3,
  '사법공조 거절 사유는 공조요청 요건 미비, 주권·안전·공공질서 등 중요 이익 침해 우려, 재판관할권이 미치지 않는 지역 내 유사범죄에 대한 조치 금지, 피요청당사국의 사법공조 법제 위반 4가지예요. "요청당사국이 언론에 보도자료를 배포한 사실"은 협약이 규정하는 거절 사유가 아니에요.','ultra'),
M('jd1_2',
  '비엔나 협약 제7조 제19항에 대한 설명으로 가장 옳은 것은?',
  ['공조요청의 이행을 위한 통상비용은 관계당사국이 달리 합의하지 아니하는 한 피요청당사국이 부담하며, 고액의 비용 또는 특별한 성질의 비용이 소요되거나 소요될 경우 관계당사국은 비용부담의 방법 및 공조요청의 이행 조건을 결정하기 위하여 협의하여야 한다.','비엔나 협약은 공조요청 이행에 소요되는 비용의 부담 주체나 분담 방식에 관하여 어떠한 규정도 두지 않고, 이를 전적으로 각국의 국내법에 위임하고 있는 것으로 알려져 있다','공조요청의 이행을 위해 소요되는 모든 비용은 요청당사국과 피요청당사국 간의 별도 합의 여부와 관계없이, 예외 없이 항상 공조를 요청한 국가가 전액을 부담하도록 협약이 확정적으로 정하고 있다','협약에 따르면 이행 비용의 규모나 성격과 무관하게, 비용 문제를 이유로 공조요청의 처리를 지연시키거나 유보하는 것은 어떠한 경우에도 절대적으로 허용되지 않는 것으로 규정되어 있다'],0,
  '공조요청 이행을 위한 통상비용은 관계당사국이 달리 합의하지 않는 한 피요청당사국이 부담하며, 고액이거나 특별한 성질의 비용이 소요되는 경우 관계당사국이 비용부담 방법과 이행 조건을 결정하기 위해 협의하도록 규정되어 있어요.','ultra'),
M('jd1_2',
  '자금세탁을 목적으로 하는 은행제도의 범죄 이용 방지에 관한 바젤위원회 선언(1988년)의 배경에 대한 설명으로 옳지 않은 것은?',
  ['국제결제은행(BIS)은 금융시장이 범죄와 관련될 경우, 일반인의 신뢰도가 저하될 수 있다는 인식하에 각 회원국들의 은행들이 위원회 선언에 합치되는 정책과 관행을 채택하도록 권고 및 장려할 것을 발표하였다.','이 선언은 은행 경영진이 은행 시스템을 통해 자금세탁을 억제하는 데 도움이 되도록 기관 내에서 시행해야 하는 몇 가지 기본 정책과 절차를 개략적으로 설명하고자 하였다.','이 선언은 은행 간의 기존 모범 사례를 강화하고, 특히 지급결제 시스템의 범죄 이용에 대한 경계와 은행의 효과적인 예방 및 보호 조치, 법 집행 기관과의 협력을 증진하기 위해 마련되었다.','이 선언은 국제결제은행(BIS)이 각국 은행에 대해 직접적이고 강행적인 법적 구속력을 가지는 규정으로, 위반 시 BIS가 직접 형사처벌을 부과할 수 있다.'],3,
  '바젤위원회 선언은 각 회원국들의 은행들이 선언에 합치되는 정책과 관행을 채택하도록 "권고 및 장려"하는 성격의 선언으로, BIS가 직접 형사처벌을 부과할 수 있는 강행적 법적 구속력을 가진 규정이 아니에요.','ultra'),
M('jd1_2',
  '바젤위원회 선언(1988년)의 주요내용 4가지에 해당하지 않는 것은?',
  ['은행의 고객확인의무(CDD).','자금거래와 관련한 법규 준수 및 자금세탁 혐의거래에 대한 지원거절.','고객비밀보호 관련법규가 허용하는 범위 내에서 수사기관에 대한 협조, 동 원칙준수와 관련된 내부절차 수립.','은행이 보유한 모든 고객의 예금 잔액을 매월 국세청에 자동으로 통보하는 것.'],3,
  '바젤위원회 선언의 주요내용은 ①은행의 고객확인의무(CDD) ②자금거래 관련 법규 준수 및 자금세탁 혐의거래에 대한 지원거절 ③고객비밀보호 관련법규가 허용하는 범위 내 수사기관에 대한 협조 ④동 원칙준수와 관련된 내부절차 수립이에요. "모든 고객의 예금 잔액을 매월 국세청에 자동 통보"하는 것은 이 선언의 주요내용이 아니에요.','ultra'),
M('jd1_2',
  '바젤위원회의 2001년 10월 "은행의 고객확인의무 관련 보고서(Customer due diligence for banks)"에 대한 설명으로 옳지 않은 것은?',
  ['바젤위원회는 은행의 안전성과 건전성, 은행시스템의 완전성(integrity)을 확보하기 위하여 이 보고서를 발표하였다.','이 보고서는 은행의 고객 식별(CDD)과는 무관한, 오직 은행의 재무건전성 비율 규제만을 다루는 보고서이다.','보고서의 목적 부분에서는 은행 및 금융기관 등이 금융시스템을 통하여 범죄 활동에서 얻은 불법자금을 이체하거나 입금하는 중개자로 이용될 수 있고 이러한 거래는 자금의 실제 소유자를 숨길 수 있다는 점을 지적하고 있다.','이 보고서는 FATF의 40개 권고사항 개정에 영향을 끼쳤다.'],1,
  '이 보고서는 "고객 식별(CDD)"을 핵심 내용으로 다루는 보고서로, 금융시스템이 범죄자금의 통로로 사용되지 않도록 은행이 고객의 실제 신원을 확인하기 위해 합리적인 노력을 기울여야 한다는 점 등을 규정하고 있어요. "오직 재무건전성 비율 규제만을 다룬다"는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  '바젤위원회의 은행 고객확인의무 보고서(2001년)의 "고객 식별" 부분에 대한 설명으로 가장 옳은 것은?',
  ['고객 식별이라는 절차는 오로지 법인 형태의 고객에게만 적용될 뿐이며, 개인 형태의 고객에게는 이러한 절차가 적용되지 않는 것으로 이해해야 한다','은행에 자신의 신원 확인 정보를 제공하지 못하는 고객이라 하더라도, 그 고객과의 중요한 사업 거래를 계속하여 진행하는 것이 은행이 마땅히 취해야 할 명확한 정책이어야 하는 것으로 이해해야 한다','금융시스템이 범죄자금의 통로로 사용되지 않도록 은행은 기관의 서비스를 요청하는 모든 고객의 실제 신원을 확인하기 위해 합리적인 노력을 기울여야 하며, 모든 계좌의 소유권과 안전 보관 시설을 사용하는 계좌의 소유권을 확인하기 위해 특별한 주의를 기울여야 한다.','고객 식별을 위한 절차는 신규로 거래를 시작하는 고객에게만 적용될 뿐이며, 이미 오랫동안 거래해 온 기존 고객에게는 전혀 적용되지 않는 것으로 이해해야 한다'],2,
  '이 보고서는 은행이 서비스를 요청하는 모든 고객(개인·법인 불문)의 실제 신원을 확인하기 위해 합리적인 노력을 기울여야 하며, 모든 계좌의 소유권과 안전 보관 시설을 사용하는 계좌의 소유권을 확인하기 위해 특별한 주의를 기울여야 한다고 규정해요. 신원 확인을 제공하지 못하는 고객과는 중요한 사업 거래를 하지 않는다는 명확한 정책이 있어야 한다고 명시되어 있어요.','ultra'),
M('jd1_2',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 비엔나 협약(1988)은 마약범죄 관련 자금세탁행위의 범죄화, 몰수, 국제협력 등을 규정한다.\nㄴ. 비엔나 협약 제7조는 사법공조에 관한 규정이나, 은행의 비밀유지를 이유로 공조를 자유롭게 거절할 수 있도록 허용한다.\nㄷ. 바젤위원회 선언(1988년)은 은행의 CDD, 법규준수, 수사기관 협조, 해외지점 통합 운영을 주요내용으로 한다.\nㄹ. 바젤위원회는 1998년 은행의 고객확인의무 관련 보고서를 발표하였고, 이는 FATF 40개 권고사항 개정에 영향을 끼쳤다.\nㅁ. 우리나라는 비엔나 협약을 기준으로 1995년 마약류 불법거래 방지에 관한 특례법을 제정하였다.',
  ['5개.','4개.','3개.','2개.'],3,
  'ㄱ, ㅁ은 옳은 설명이에요. 비엔나 협약 제7조는 은행 비밀유지를 이유로 공조를 거절할 수 없도록 하는데(ㄴ은 반대로 서술), 바젤위원회 선언의 내용에는 "해외지점 통합 운영"이 아니라 CDD·법규준수·수사기관 협조·내부절차 수립이 포함돼요(ㄷ). 관련 보고서는 1998년이 아니라 2001년 10월 발표됐어요(ㄹ).','ultra'),
M('jd1_2',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] A국은 B국으로부터 마약범죄 관련 자금세탁 사건에 대한 사법공조를 요청받았으나, 자국 은행법상 고객의 계좌 정보는 절대 비밀이라는 이유로 공조 제공을 거절하였다.',
  ['A국의 거절 사유는 비엔나 협약 제7조에 위배될 수 있다. 협약은 당사국이 은행의 비밀유지를 이유로 사법공조 제공을 거절하여서는 아니 된다고 명시하고 있다.','사법공조와 은행 비밀유지는 서로 무관한 문제이므로 이 사안은 협약과 관련이 없다.','은행 비밀유지는 협약상 명시적으로 인정되는 절대적인 거절 사유이므로 A국의 조치는 적법하다.','A국은 어떠한 이유로도 사법공조를 거절할 수 없으므로, 은행 비밀유지 주장 자체가 무의미하다.'],0,
  '비엔나 협약 제7조 제5항은 당사국이 은행의 비밀유지를 이유로 사법공조의 제공을 거절하여서는 아니 된다고 명시적으로 규정하고 있어요. 따라서 A국이 은행 비밀유지만을 이유로 공조를 거절한 것은 협약에 위배될 수 있어요.','ultra'),
M('jd1_2',
  '팔레모 협약(United Nations Convention Against Transnational Organized Crime, 2000)의 배경에 대한 설명으로 옳지 않은 것은?',
  ['1998년 유엔 총회 결의에 따라, 정부 간 임시위원회를 설치해 국제조직범죄에 대처하기 위한 포괄적 국제협약을 만들기로 결정하였다.','이 협약은 비엔나 협약을 대체하는 협약으로, 비엔나 협약 발효와 동시에 비엔나 협약은 완전히 폐기되었다.','이 협약의 주요내용은 3인 이상의 조직범죄단체의 국제적인 중대범죄와 관련해 조직범죄단체 가담, 범죄수익금 세탁, 사법 방해, 각종 부패행위 등을 처벌하기 위한 국가 간 협력의무와 국내 입법 의무를 규정하고 있다.','2000년 12월에 이탈리아 팔레모에서 국제조직범죄 방지와 관련된 협약이 체결되었다.'],1,
  '팔레모 협약은 비엔나 협약을 대체하는 것이 아니라, 자금세탁의 전제범죄 범위를 마약범죄에서 조직범죄 전반으로 "확대"하는 별도의 협약이에요. 비엔나 협약이 완전히 폐기되었다는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  '팔레모 협약 제6조(범죄수익의 세탁 범죄화)에서 자금세탁 관련 범죄행위로 규정하는 것에 해당하지 않는 것은?',
  ['그 재산이 범죄수익임을 알면서, 당해 재산의 불법출처를 은닉 또는 가장하거나, 전제범죄 실행에 관여한 자의 법적 책임을 면하게 하기 위하여 행한 당해 재산의 전환 또는 양도.','그 재산이 범죄수익임을 알면서 행한, 당해 재산의 진정한 성질·출처·소재·처분·이동, 당해 재산에 대한 소유권 또는 권리의 은닉 또는 가장.','범죄수익과 무관한 재산을 당사국의 세법에 따라 정상적으로 신고·납부하는 행위.','법체계상의 기본개념에 따를 것을 조건으로, 수령 당시 그 재산이 범죄수익임을 알면서 행한 재산의 취득, 소지 또는 사용.'],2,
  '팔레모 협약 제6조가 규정하는 범죄화 대상은 범죄수익의 전환·양도, 성질·출처·소재 등의 은닉·가장, 취득·소지·사용, 그리고 이러한 범죄의 실행에 대한 가담·공모·미수·방조·교사·원조 및 상담이에요. "범죄수익과 무관한 재산의 정상적인 세법상 신고·납부"는 이 조항이 규정하는 범죄화 대상이 아니에요.','ultra'),
M('jd1_2',
  '팔레모 협약 제6조 제2항에서 전제범죄의 범위에 대한 설명으로 옳지 않은 것은?',
  ['각 당사국은 이 협약 제2조에 정의된 모든 중대범죄와 이 협약 제5조, 제8조 및 제23조에 규정된 범죄를 전제범죄로 포함한다.','각 당사국은 이 조 제1항을 최대한 넓은 범위의 전제범죄에 적용하도록 노력한다.','당사국의 관할권 밖에서 범하여진 범죄는 국내에서 범해진 범죄와 마찬가지로 별도의 요건 검토 없이 곧바로 전제범죄로 인정되는 것으로 이해해야 한다','전제범죄를 특별히 법에 열거하여 규정하는 당사국의 경우 최소한 조직범죄단체와 연관이 있는 유형의 범죄가 폭넓게 포함되도록 한다.'],2,
  '팔레모 협약 제6조 제2항은 관할권 밖에서 범한 범죄가 행위지 법령상 범죄를 구성하는 등 요건을 충족하는 경우에만 전제범죄가 될 수 있다고 규정해요. "요건 검토 없이 곧바로 전제범죄로 인정된다"는 서술은 요건 검토 절차를 생략해 옳지 않아요.','ultra'),
M('jd1_2',
  '유럽(EU)평의회 범죄수익규제협약(Convention on Laundering, Search, Seizure and Confiscation from Proceeds from Crime, 1990)에 대한 설명으로 가장 옳은 것은?',
  ['이 협약은 유럽평의회(Council of Europe)에 의하여 도입된 협약으로, 비엔나 협약과 달리 자금세탁행위의 지준범죄를 마약관련 범죄에 한정하지 않고 불법수익이 발생하는 모든 범죄를 대상으로 하는 것이 특징이다.','이 협약은 비엔나 협약과 마찬가지로, 자금세탁의 전제범죄가 될 수 있는 범죄의 범위를 오로지 마약 관련 범죄 하나만으로 한정하여 규정하고 있는 것으로 이해해야 한다','이 협약은 유엔(UN)이 아니라, 국제결제은행(BIS)이라는 국제금융기구가 주도하여 도입한 협약인 것으로 이해해야 한다','이 협약이 실제로 체결된 시점은 1990년이 아니라, 그보다 10년 늦은 2000년인 것으로 알려져 있어 시기상의 혼동이 없어야 한다'],0,
  '유럽평의회 범죄수익규제협약(1990)은 유럽평의회가 도입한 협약으로, 비엔나 협약과 달리 자금세탁행위의 지준범죄를 마약관련 범죄에 한정하지 않고 불법수익이 발생하는 모든 범죄를 대상으로 하는 것이 특징이에요.','ultra'),
M('jd1_2',
  '볼프스버그 자금세탁방지 준칙(Wolfsberg Anti-Money laundering Principles)에 대한 설명으로 옳지 않은 것은?',
  ['이 준칙은 UN 총회의 결의로 채택된 국제조약으로서 모든 UN 회원국에 대해 강행적인 법적 구속력을 가진다.','이 준칙은 국제적인 선진은행들의 모임인 Wolfsberg group이 제정한 준칙이다.','Private Banking 업무와 밀접하게 연관된 고객확인의무에 대한 지침(Global AML Guidelines for Private Banking, 2000.10)이 포함된다.','자금중개 업무(Correspondent Banking)와 관련된 환거래은행 주의의무에 대한 준칙(Wolfsberg AML Principles for Correspondent Banking, 2002.11)도 포함된다.'],0,
  '볼프스버그 준칙은 UN이 아니라 국제적인 선진은행들의 모임인 Wolfsberg group이 자발적으로 제정한 민간 차원의 준칙으로, UN 총회 결의에 의한 국제조약이 아니며 모든 UN 회원국에 강행적 법적 구속력을 갖는 것이 아니에요.','ultra'),
M('jd1_2',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 팔레모 협약(2000)은 2000년 12월 이탈리아 팔레모에서 체결되었다.\nㄴ. 팔레모 협약 제6조는 범죄수익의 세탁을 범죄화하며 전제범죄를 최대한 넓게 적용하도록 노력할 것을 규정한다.\nㄷ. 유럽평의회 범죄수익규제협약(1990)은 자금세탁의 전제범죄를 마약범죄에 한정하지 않는다.\nㄹ. 볼프스버그 준칙은 Wolfsberg group이라는 선진은행 모임이 제정한 민간 차원의 준칙이다.',
  ['4개.','3개.','1개.','2개.'],0,
  'ㄱ~ㄹ 모두 옳은 설명이에요. 팔레모 협약의 체결 시점·장소, 제6조의 취지, 유럽평의회 협약의 전제범죄 확장 특징, 볼프스버그 준칙의 민간 성격을 정확히 이해해야 풀리는 종합형 문제예요.','ultra'),
M('jd1_2',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] A국은 팔레모 협약 가입국으로서, 자국 관할권 밖에서 발생한 조직범죄 관련 범죄수익 은닉 행위에 대해 이를 전제범죄로 취급할 수 있는지 검토하고 있다. 해당 행위는 범죄지 국가에서도 범죄를 구성하며, A국의 국내법으로도 동일한 행위가 범죄를 구성한다.',
  ['이 사안은 팔레모 협약이 아니라 비엔나 협약에 의해서만 규율된다.','전제범죄 해당 여부는 오직 A국의 국내법만을 기준으로 판단하며 범죄지 국가의 법률은 전혀 고려하지 않는다.','관할권 밖에서 발생한 행위는 어떠한 경우에도 전제범죄가 될 수 없다.','이 경우 팔레모 협약 제6조 제2항 다호에 따라, 해당 행위는 A국의 관할권 밖에서 발생하였더라도 전제범죄로 취급될 수 있다.'],3,
  '팔레모 협약 제6조 제2항 다호에 따르면, 당사국의 관할권 밖에서 범하여진 범죄라도 그 행위가 범죄지 국가의 국내법상 범죄를 구성하고, 이 조를 이행·적용하는 당사국(A국)에서 범했을 경우에도 범죄를 구성한다면 전제범죄가 될 수 있어요.','ultra'),
M('jd1_2',
  'Wolfsberg Group(볼프스버그 그룹)을 구성하는 12개의 선진은행에 해당하지 않는 것은?',
  ['Santander, MUFG, Societe Generale, Standard Chartered.','한국은행, 중국인민은행, 일본은행 등 각국의 중앙은행.','Bank of America, Deutsche Bank, Goldman Sachs, JPMorgan Chase.','Citi, HSBC, Barclays, UBS.'],1,
  'Wolfsberg Group은 Santander, Bank of America, Barclays, Citi, Deutsche Bank, Goldman Sachs, HSBC, JPMorgan Chase, MUFG, Societe Generale, Standard Chartered, UBS 등 12개의 "민간 선진은행"들의 모임이에요. 각국의 중앙은행은 이 그룹의 구성원이 아니에요.','ultra'),
M('jd1_2',
  'Wolfsberg 그룹의 Private Banking 자금세탁방지지침 중 "1. 고객수용(Client Acceptance)"에 대한 설명으로 옳지 않은 것은?',
  ['비대면고객에 대해서는 어떠한 고객확인절차도 마련할 필요가 없으며 대면고객과 완전히 동일하게 취급하지 않아도 무방하다.','모든 신규 거래고객에 대해 거래관계 수립 전 공식 증빙에 의한 고객확인, 거래계좌의 실제소유자(beneficial owner) 확인, 비대면고객(non-face-to-face customers)에 대한 고객확인절차 수립이 포함된다.','고객확인을 위한 정보수집으로 계좌개설 목적, 자금의 원천, 예상 거래빈도 등에 대한 정보의 수집 및 기록이 포함된다.','고객수용 단계는 Private Banking 자금세탁방지지침의 4가지 구성요소 중 첫 번째 항목이다.'],0,
  '이 지침은 비대면고객(non-face-to-face customers)에 대한 "고객확인절차 수립"을 명시적으로 요구하고 있어요. "어떠한 절차도 마련할 필요가 없다"는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  'Wolfsberg 그룹의 Private Banking 자금세탁방지지침 중 "2. 내부감독"에 대한 설명으로 옳지 않은 것은?',
  ['private banker를 제외한 1인 이상의 직원에 의한 고객 수용 승인이 이루어져야 한다.','내부감독 절차는 private banker 본인 단독의 판단만으로 모든 고객 수용을 승인할 수 있도록 설계되어야 한다.','요주의인물에 대한 실사 및 계좌개설요건 강화 대상에는 자금세탁방지제도가 부실한 국가와 관련된 고객, 자금세탁에 취약한 업종에 종사하는 고객, PEPs(Politically Exposed Persons, 고위정부관료·주요정치인 등) 및 동 고객의 가족 등이 포함된다.','고객자료의 지속적 보완 및 심사는 정기적으로 또는 주요 변동사항 발생 시 고객정보 보완 및 적정성 여부를 심사하는 것을 포함한다.'],1,
  '내부감독은 "private banker를 제외한" 1인 이상의 직원에 의한 고객 수용 승인을 요구해요. 즉 이해상충 방지를 위해 private banker 본인 단독의 판단만으로 고객을 수용할 수 없도록 하는 것이 취지이며, "private banker 단독 판단으로 모든 것을 승인"한다는 서술은 원문과 반대예요.','ultra'),
M('jd1_2',
  'Wolfsberg 그룹의 Private Banking 자금세탁방지지침 중 "3. 의심거래의 확인 및 조치"에 대한 설명으로 가장 옳은 것은?',
  ['의심거래가 발견되더라도 어떠한 형태의 추가 조치도 취할 필요 없이, 단순히 내부 기록만 남겨 두는 것으로 지침상 의무가 완결되는 것으로 이해해야 한다','의심거래 확인 절차는 오로지 신규고객에게만 적용될 뿐이며, 이미 거래 관계가 있는 기존고객에게는 전혀 적용되지 않는 것으로 이해해야 한다','의심거래가 확인되면 예외 없이 무조건 거래를 즉시 종료해야 하며, 감시강화와 같은 중간 단계의 조치는 지침상 인정되지 않는 것으로 이해해야 한다','일정금액 이상의 현금거래, 고객정보와 상이한 금융거래 등에 대하여 거래내역감시, 고객면담 등을 통해 이를 확인하고, 필요시 거래 감시강화, 거래종료, 금융정보분석기구 보고 등의 조치를 취한다.'],3,
  'Wolfsberg Private Banking 지침의 "의심거래의 확인 및 조치"는 일정금액 이상 현금거래, 고객정보와 상이한 금융거래 등을 거래내역감시·고객면담 등으로 확인하고, 필요시 거래 감시강화·거래종료 등 단계적 조치를 취하도록 정하고 있어요.','ultra'),
M('jd1_2',
  'Wolfsberg 그룹의 Private Banking 자금세탁방지지침 중 "4. 내부통제시스템 구축, 직원교육 등"에 대한 설명으로 옳지 않은 것은?',
  ['내부감사, 준법감시인 등에 의한 내부통제시스템 구축이 포함된다.','자금세탁관련 법규 등에 대한 직원교육이 포함된다.','자금세탁방지관련 자료는 거래 종료 즉시 파기하여야 한다는 것이 이 지침의 내용이다.','자금세탁방지관련 자료는 최소 5년간 보존하여야 한다.'],2,
  '이 지침은 자금세탁방지관련 자료를 "최소 5년간 보존"하도록 규정하고 있어요. "거래 종료 즉시 파기하여야 한다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_2',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. Wolfsberg Group은 12개의 민간 선진은행들의 모임이다.\nㄴ. Wolfsberg 그룹의 Private Banking 지침은 고객수용, 내부감독, 의심거래의 확인 및 조치, 내부통제시스템 구축·직원교육의 4가지로 구성된다.\nㄷ. 내부감독 단계에서는 PEPs 및 그 가족에 대한 실사와 계좌개설요건 강화가 요구된다.\nㄹ. 자금세탁방지관련 자료는 최소 5년간 보존하여야 한다.',
  ['1개.','2개.','4개.','3개.'],2,
  'ㄱ~ㄹ 모두 옳은 설명이에요. Wolfsberg Group의 구성, Private Banking 지침의 4대 구성요소, 내부감독 단계의 PEP 실사 요건, 자료 보존기간(5년)을 정확히 기억해야 풀리는 문제예요.','ultra'),
M('jd1_2',
  '유엔안보리결의(UNSCR) 1373호(2001)의 목적에 대한 설명으로 가장 옳은 것은?',
  ['테러관련 유엔안보리결의안으로서 국가는 테러행위를 예방하고 테러행위를 진압하며 테러행위로 인한 피해를 신속하게 구제함으로써 모든 사람의 생명과 신체의 안전 및 재산을 보호할 의무가 있으며, 이를 국내외적으로 효율적·체계적으로 수행할 책임이 있음을 각인하고 회원국들의 합의에 따라 채택되었다.','이 결의는 오직 특정 개인(오사마 빈 라덴)에 대한 자산동결과 여행금지 조치만을 목적으로 하며, 회원국 일반의 테러 예방 의무와는 무관한 제재 대상자 지정 결의이다','이 결의는 대량살상무기 확산 방지에 관한 사항만을 규정하고 있으며, 테러행위 예방이나 테러자금조달 방지와는 전혀 관련이 없는 별개의 결의이다','이 결의는 회원국에 대해 어떠한 법적 구속력도 갖지 않는 순수 권고적 성격의 문서에 불과하여, 각국이 이를 따르지 않더라도 아무런 문제가 되지 않는다'],0,
  'UNSCR 1373호(2001)는 테러관련 유엔안보리결의안으로서, 국가가 테러행위를 예방·진압하고 피해를 신속히 구제함으로써 모든 사람의 생명·신체·재산을 보호할 의무를 국내외적으로 효율적·체계적으로 수행할 책임이 있음을 각인하고 회원국들의 합의에 따라 채택되었어요.','ultra'),
M('jd1_2',
  '유엔안보리결의(UNSCR) 1373호(2001)에 대한 설명으로 옳지 않은 것은?',
  ['유엔 헌장 제7장에 따라 행동함에 있어, 모든 국가에 대해 테러자금조달을 방지하고 억제할 것, 테러 행위에 사용할 목적으로 또는 사용될 것을 알면서 자금을 제공 또는 모집하는 행위를 범죄화할 것을 결의하였다.','이 결의는 2001년 9월 12일 채택된 안보리 결의 1368호(2001)와 1999년 10월 10일 채택된 결의 1269호(1999)를 재확인하고, 2001년 9월 11일 뉴욕·워싱턴 D.C.·펜실베니아에서 발생한 테러 공격을 명백히 규탄하였다.','2001년 9월 28일 안전보장이사회의 제4385회 회의에서 채택된 결의이다.','이 결의는 미국 9·11 테러와는 무관하게 그 이전부터 독립적으로 논의되어 온 사안을 채택한 것이다.'],3,
  'UNSCR 1373호는 2001년 9월 11일 뉴욕·워싱턴 D.C.·펜실베니아에서 발생한 테러 공격(9·11 테러)을 명백히 규탄함과 동시에 그러한 활동을 방지하고자 하는 의지를 표명하며 채택된 결의로, 9·11 테러와 직접적인 연관이 있어요. "무관하게 독립적으로 논의되어 온 사안"이라는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  'UNSCR 1373호(2001)의 주요내용 3가지에 해당하지 않는 것은?',
  ['테러집단의 충원 등 테러행위에 개입된 단체나 개인을 지원하는 일체의 행위금지, 다른 나라와의 정보교환을 통하여 테러행위에 대한 조기경보를 제공하는 조치, 테러행위에 대한 비호금지, 테러행위자 등의 이동 저지.','테러행위에 대한 정보교환 등 국제협력, 테러관련 국제조약과 의정서의 비준 및 이행.','테러행위에 대한 자금조달을 예방하고 진압하기 위한 조치.','모든 회원국의 국방예산을 유엔이 직접 통제하고 배분하는 조치.'],3,
  'UNSCR 1373호의 주요내용 3가지는 ①테러자금조달의 예방·진압 조치 ②테러행위 개입 단체·개인 지원 금지, 정보교환을 통한 조기경보, 비호금지, 이동 저지 ③정보교환 등 국제협력, 테러관련 국제조약·의정서의 비준·이행이에요. "회원국 국방예산을 유엔이 직접 통제·배분"하는 조치는 이 결의의 내용이 아니에요.','ultra'),
M('jd1_2',
  'UNSCR 1373호(2001) 제3조에서 모든 국가들에게 요청하는 사항에 해당하지 않는 것은?',
  ['상호 간 정보 교환, 특히 테러리스트나 테러 조직망의 활동이나 움직임, 여행 관련 서류의 위조 및 변조, 무기·폭발물·민감한 물질 등의 거래, 테러 단체의 통신기술 사용, 테러 단체의 대량살상무기 소지에 따른 위협 등에 대한 정보 교환을 강화 및 증대하기 위한 방법을 모색한다.','1999년 12월 9일 채택된 테러자금조달억제에관한국제협약 등과 같은 테러리즘 관련 국제협약 및 협정에 가능한 신속하게 당사국으로 가입한다.','테러리즘 관련 국제협약 및 협정과 안보리 결의 1269호(1999)와 1368호(2001)의 완전한 이행을 위해 협력을 증진한다.','각 회원국이 독자적으로 판단하여 테러 관련 국제협약 가입 여부를 무기한 보류할 수 있도록 전적인 재량을 부여한다.'],3,
  'UNSCR 1373호 제3조는 테러 관련 국제협약 및 협정에 "가능한 신속하게" 당사국으로 가입할 것을 요청하고 있어요. "무기한 보류할 수 있도록 전적인 재량을 부여한다"는 서술은 원문과 반대예요.','ultra'),
M('jd1_2',
  'UNSCR 1373호(2001) 제6조 및 제9조에 대한 설명으로 옳은 것은?',
  ['이 결의의 이행을 감시하는 위원회는 안보리 절차규정 제28조가 아니라 유엔 총회 결의에 근거해 안보리 비회원국들로만 구성되어야 하는 것으로 정해져 있다','위원회는 결의 채택 후 90일이 아니라 10년 이내에 각국의 이행 조치를 보고받으면 되는 것으로 여유 있게 정해져 있다','본 결의의 채택 이후 안보리는 이 사안에 대한 논의를 완전히 종결하고 후속 계류 없이 사건을 종료한 것으로 결정하였다','안보리 절차규정 제28조에 따라, 적절한 전문적 지원을 바탕으로 본 결의의 이행을 감시하기 위해 안보리의 모든 회원국으로 구성된 위원회를 설립하기로 결정하였으며, 본 사안은 안보리에 계속 계류됨을 결정한다.'],3,
  'UNSCR 1373호 제6조 및 제9조는 안보리 절차규정 제28조에 따라, 적절한 전문적 지원을 바탕으로 결의의 이행을 감시하기 위해 안보리의 모든 회원국(비회원국이 아님)으로 구성된 위원회를 설립하기로 결정했고, 해당 사안은 안보리에 계속 계류됨을 결정했어요.','ultra'),
M('jd1_2',
  '<보기>는 테러 관련 유엔안보리결의안(UNSCR)을 정리한 것이다. 옳게 짝지어지지 않은 것은?',
  ['UNSCR 1988호(2011) - 아프간과 탈레반 관련.','UNSCR 1718호(2006) - 북한 대량살상무기 관련.','UNSCR 1267호(1999) - 탈레반 및 오사마빈라덴 관련.','UNSCR 2231호(2015) - ISIL과 알카에다 관련.'],3,
  'UNSCR 2231호(2015)는 "이란의 무기수출" 관련 결의이고, ISIL과 알카에다 관련 결의는 UNSCR 2253호(2015)예요. UNSCR 1989호(2011)는 알카에다와 테러조직 관련 결의예요. 각 결의 번호와 대상을 정확히 매칭해야 풀 수 있는 문제예요.','ultra'),
M('jd1_2',
  '<보기>는 테러 관련 유엔안보리결의안(UNSCR)이다. 옳게 짝지어진 것을 모두 고른 것은?\nㄱ. UNSCR 1267호(1999) - 탈레반 및 오사마빈라덴 관련\nㄴ. UNSCR 1989호(2011) - 알카에다와 테러조직 관련\nㄷ. UNSCR 2231호(2015) - 이란의 무기수출 관련\nㄹ. UNSCR 2253호(2015) - ISIL과 알카에다 관련',
  ['ㄷ, ㄹ만.','ㄱ, ㄹ만.','ㄱ, ㄴ만.','ㄱ, ㄴ, ㄷ, ㄹ 모두 옳음.'],3,
  'ㄱ~ㄹ 모두 옳은 연결이에요. UNSCR 1267호(탈레반·오사마빈라덴), 1718호(북한 대량살상무기), 1988호(아프간·탈레반), 1989호(알카에다·테러조직), 2231호(이란 무기수출), 2253호(ISIL·알카에다) 각 결의의 대상을 정확히 구분해야 풀리는 문제예요.','ultra'),
M('jd1_2',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. UNSCR 1373호는 2001년 9월 28일 안보리 제4385회 회의에서 채택되었다.\nㄴ. UNSCR 1373호는 9·11 테러를 계기로 채택되었으며, 테러자금조달의 범죄화를 요구한다.\nㄷ. UNSCR 1373호 제6조는 상임이사국 5개국만으로 구성된 소규모 위원회 설립을 결정하였다.\nㄹ. UNSCR 1718호는 이란 대량살상무기 관련 결의이고, UNSCR 2231호는 북한의 무기수출 관련 결의이다.',
  ['2개.','1개.','3개.','4개.'],0,
  'ㄱ, ㄴ은 옳은 설명이에요. UNSCR 1373호 제6조가 설립을 결정한 대테러위원회는 상임이사국 5개국만이 아니라 안보리 모든 회원국으로 구성되며(ㄷ), UNSCR 1718호는 이란이 아니라 북한 관련 결의예요(ㄹ).','ultra'),
M('jd1_3',
  'FATF 평가방법론 중 권고사항 10(고객확인의무)의 세부 평가방법론에 대한 설명으로 옳지 않은 것은?',
  ['고객확인 과정에서 고객 또는 잠재적 고객에게 의심거래보고 사실이 누설될 것으로 판단되는 경우, 금융기관은 STR 자체를 생략하고 어떠한 보고도 하지 않아도 된다.','통상, 계속적 거래 또는 일회성 거래를 불문하고, 다른 예외조항이나 기준금액에 관계없이, 자금세탁 또는 테러자금조달의 우려가 있다고 의심되는 경우 고객 및 실제소유자의 신원을 확인하고 검증해야 한다.','권고사항 20에 따라 FIU에 의심거래보고(STR)를 해야 한다.','권고사항 21은 금융기관, 이사, 직원이 금융정보가 FIU에 보고된다는 사실을 해당 고객에게 누설하는 것을 금지하고 있다.'],0,
  '의심거래보고 사실이 고객에게 누설될 것으로 판단되는 경우, 고객확인(CDD) "과정"은 생략할 수 있으나 STR은 "반드시" 해야 한다고 명시되어 있어요. "STR 자체를 생략하고 어떠한 보고도 하지 않아도 된다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 법인 및 신탁 등 법률관계(legal arrangement)에 대한 고객확인(권고사항 24, 25 관련)의 목적에 대한 설명으로 옳지 않은 것은?',
  ['법인 고객에 대해서는 소유권 및 지배구조를 이해할 필요가 없으며 오직 법인의 명칭만 확인하면 충분하다.','고객에 관한 충분한 이해로 법인과 신탁 등 법률관계의 불법 이용을 방지하여 거래관계와 관련된 잠재적 자금세탁 및 테러자금조달 위험을 제대로 평가할 수 있게 하기 위함이다.','위험을 감소시키는 적절한 조치를 취하도록 하기 위함이다.','법인 또는 신탁 등 법률관계인 고객에 대하여 고객확인을 이행할 때, 금융기관은 고객의 신원을 확인·검증하고 거래의 성격과 소유권 및 지배구조를 이해해야 한다.'],0,
  '법인 또는 신탁 등 법률관계인 고객에 대해 고객확인을 이행할 때, 금융기관은 고객의 신원 확인·검증뿐 아니라 "거래의 성격과 소유권 및 지배구조를 이해"해야 해요. "법인의 명칭만 확인하면 충분하다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 법인 고객의 실제소유자 확인을 위한 "단계적 접근(cascading approach)"에 대한 설명으로 가장 옳은 것은?',
  ['법인의 소유구조가 복잡한지 단순한지 여부와는 무관하게, 모든 법인에 대해 예외 없이 동일한 단일 기준(예: 지분율 25%) 하나만으로 실제소유자를 확인하면 충분한 것으로 방법론이 규정하고 있는 것으로 이해해야 한다','실제소유자 확인 절차에서 지배지분을 보유한 자를 도저히 확인할 수 없는 경우라 하더라도, 금융기관은 이러한 상황을 그대로 방치한 채 어떠한 대안적인 추가 조치도 취할 필요가 없는 것으로 이해해야 한다','(i.i) 법인에 대해 최종적으로 지배지분을 보유한 자연인의 신원을 확인하고, (i.ii) 그러한 자가 실제소유자임이 의심되거나 소유권으로 지배력을 행사하는 자연인이 없는 경우 다른 수단을 통해 지배권을 행사하는 자연인의 신원을 확인하며, (i.iii) 위 단계에서 확인된 자연인이 없는 경우 금융기관은 상위직급자의 신원을 확인하고 합리적 조치를 통해 검증하여야 한다.','실제소유자를 확인하는 절차는 법인이 실제로 갖고 있는 소유구조나 지배구조와는 무관하게, 항상 등기부상에 기재된 대표이사 한 사람만을 확인 대상으로 삼으면 충분한 것으로 방법론이 규정하고 있는 것으로 이해해야 한다'],2,
  '법인의 실제소유자 확인은 (i.i) 최종적으로 지배지분을 보유한 자연인 확인 → (i.ii) 그 자가 의심되거나 소유권으로 지배력을 행사하는 자연인이 없는 경우 다른 수단으로 지배권을 행사하는 자연인 확인 → (i.iii) 그래도 확인된 자연인이 없는 경우 상위직급자의 신원을 확인하는 단계적(cascading) 접근을 따라요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 신탁 등 법률관계 고객의 실제소유자 확인에 대한 설명으로 옳지 않은 것은?',
  ['신탁의 경우 위탁자, 수탁자, 보호자(해당 사항이 있는 경우), 수익자 또는 종류별 수익자 집단(순환구조를 통한 지배권/소유권을 포함하여), 신탁에 대해 최종적으로 실질적 지배권을 행사하는 기타 자연인의 신원을 확인해야 한다.','기타 형태의 법률관계의 경우, 신탁에서의 위탁자·수탁자 등과 동등하거나 유사한 직책에 있는 자의 신원을 확인해야 한다.','신탁 등 법률관계에 대해서는 실제소유자 확인 개념 자체가 적용되지 않으며 법인에 대해서만 적용된다.','신탁의 실제소유자 확인은 위탁자·수탁자·보호자·수익자뿐 아니라 순환구조를 통한 지배권·소유권 행사자도 포함하는 포괄적인 개념이다.'],2,
  '신탁 등 법률관계에 대해서도 실제소유자 확인이 적용되며, 위탁자·수탁자·보호자·수익자(또는 종류별 수익자 집단) 및 신탁에 대해 최종적으로 실질적 지배권을 행사하는 기타 자연인의 신원을 확인해야 해요. "법인에 대해서만 적용되며 신탁에는 적용되지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 고객확인 과정에서 STR 사실 누설이 우려되는 경우 CDD 과정은 생략할 수 있으나 STR은 반드시 이행해야 한다.\nㄴ. 법인 실제소유자 확인은 상위직급자 확인 → 지배지분 보유 자연인 확인 → 다른 수단의 지배권 행사자 확인의 단계적 접근을 따른다.\nㄷ. 상장법인으로서 적절한 공시요건이 적용되는 경우 실제소유자 확인이 면제될 수 있다.\nㄹ. 생명보험 수익자의 신원 검증은 보험금 지불 시 이루어져야 한다.',
  ['3개.','2개.','4개.','1개.'],0,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. 법인 실제소유자 확인의 단계적 접근은 지배지분 보유 자연인 확인 → 다른 수단의 지배권 행사자 확인 → 상위직급자 확인 순서예요. ㄴ은 순서가 뒤바뀌어 있어 옳지 않아요.','ultra'),
M('jd1_3',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 금융회사 직원 甲은 법인고객 A사의 고객확인을 진행하던 중, A사의 지분 구조가 매우 복잡하여 지배지분을 보유한 자연인을 특정할 수 없었고, 소유권을 통해 지배력을 행사하는 자연인도 확인되지 않았다.',
  ['실제소유자를 특정할 수 없으므로 甲은 고객확인 절차 전체를 포기하고 A사와의 거래를 자동으로 진행하면 된다.','이 경우 A사와의 거래관계 수립을 무조건 거절해야 하며 어떠한 추가 확인 절차도 필요하지 않다.','甲은 다른 수단을 통해 A사를 지배하는 자연인의 신원을 확인해야 하며, 그마저도 확인되는 자연인이 없다면 A사의 상위직급자의 신원을 확인하고 합리적 조치를 통해 검증하여야 한다.','실제소유자 확인이 어려운 경우 금융기관은 임의로 아무 자연인이나 실제소유자로 기재하면 된다.'],2,
  'FATF 평가방법론의 단계적 접근에 따르면, 지배지분을 통한 자연인 확인이 어려운 경우 다른 수단을 통해 지배권을 행사하는 자연인의 신원을 확인하고, 그마저 확인되지 않으면 상위직급자의 신원을 확인하고 합리적 조치를 통해 검증해야 해요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 고객 검증을 거래관계 수립 이후에 시행할 수 있는 상황의 예시에 해당하지 않는 것은?',
  ['증권 거래업의 경우 증권회사 및 증권중개소가 고객과 접촉할 당시 및 고객 신원확인 작업이 완료되기 전, 주식시장 상황에 따라 거래를 매우 빠르게 처리해야 하는 경우.','비대면 거래.','고객이 검증 연기를 요청하는 경우에는 별도의 사유 확인 없이 금융회사의 재량만으로 연기 여부를 결정할 수 있는 것으로 이해해야 한다','생명보험 수익자에 관해 언급된 상황.'],2,
  '고객 검증의 사후 시행은 증권거래의 신속처리·비대면거래·생명보험 수익자 관련 상황 등 자금세탁·테러자금조달 위험 관리 절차상 제한된 사유에 한해 인정돼요. "별도의 사유 확인 없이 금융회사의 재량만으로 결정할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 제시하는 고위험 "고객 위험 요소"에 해당하지 않는 것은?',
  ['금융기관과 고객 간의 지리적 거리를 설명할 수 없는 경우 등, 일반적이지 않은 상황에서 거래관계가 이루어지는 경우.','고객이 오랜 기간 동일한 지점을 방문하여 대면 거래를 지속해 온 경우.','고객이 비거주자인 경우, 법인 및 신탁 등 법률관계가 개인 자산보전 수단인 경우.','명의주주(nominee shareholders) 또는 무기명 주식(shares in bearer form)을 보유한 회사인 경우, 현금흐름이 많은 사업, 회사 지배구조가 비정상적이거나 지나치게 복잡한 경우.'],1,
  '고위험 고객 위험 요소는 지리적 거리를 설명할 수 없는 비정상적 거래관계, 비거주자 고객, 개인 자산보전 수단으로서의 법인·신탁, 명의주주·무기명 주식 보유 회사, 현금흐름이 많은 사업, 비정상적이거나 지나치게 복잡한 지배구조 등이에요. "오랜 기간 동일 지점에서 대면 거래를 지속해 온 경우"는 오히려 저위험 요소에 가까우며 고위험 요소로 열거되지 않아요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 권고사항 10의 고객확인은 매 거래 시마다 예외 없이 반복적으로 처음부터 다시 이루어져야 한다.\nㄴ. 비대면 거래는 신원검증을 거래관계 수립 이후에 시행할 수 있는 상황의 예시에 해당한다.\nㄷ. 기존 고객에 대해서도 중요성과 위험도에 근거하여 고객확인조치를 적용해야 한다.\nㄹ. FATF의 위험기반접근법 관련 예시는 의무사항이 아니라 지침 제공 목적으로 제시된 것이다.\nㅁ. 명의주주 또는 무기명 주식을 보유한 회사는 저위험 고객 요소에 해당하며 별도의 강화된 확인이 필요하지 않다.',
  ['2개.','3개.','5개.','4개.'],1,
  'ㄴ, ㄷ, ㄹ은 옳은 설명이에요. 권고사항 10의 고객확인은 매 거래마다 처음부터 반복될 필요는 없으며 위험기반으로 지속 관리되고(ㄱ은 옳지 않음), 명의주주·무기명 주식 보유 회사는 저위험이 아니라 고위험 고객 요소로, 강화된 확인이 필요해요(ㅁ).','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 제시하는 고위험 "국가 또는 지리적 위험 요소"에 해당하지 않는 것은?',
  ['신뢰성 있는 출처에 의해 중대한 수준의 부패 또는 기타 범죄행위가 있는 것으로 확인된 국가.','단순히 자국과 인접해 있다는 지리적 근접성만을 이유로 위험한 것으로 분류되는 모든 국가.','UN에 의해 제재조치, 통상금지 및 기타 유사한 제재를 받은 국가.','FATF 상호평가, 상세평가보고서 또는 발표된 후속조치이행보고서 등 신뢰성 있는 출처에 의해 적절한 AML/CFT 시스템을 갖추지 못한 것으로 확인된 국가.'],1,
  '고위험 국가·지리적 위험 요소는 FATF 상호평가 등에서 AML/CFT 시스템 미비로 확인된 국가, UN 제재·통상금지 등을 받은 국가, 중대한 부패·범죄행위가 확인된 국가, 테러자금조달 지원이나 지정된 테러 조직 활동이 확인된 국가·지역 등이에요. "단순히 지리적으로 인접해 있다는 이유만으로" 위험하다고 분류하는 것은 이 평가방법론이 제시하는 기준이 아니에요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 저위험 "재화, 서비스, 전달 채널 관련 위험 요소"의 예시에 해당하지 않는 것은?',
  ['해약조항이 없고 보험 증권이 담보로 자용될 수 없는 조건의 연금보험.','피고용자에게 퇴직금을 지급하는 연금/퇴직연금 또는 유사한 보험계약으로서, 보험료는 급여에서 공제되는 방식으로 지불되며 보험 약관상 이익의 양도를 허용하지 않는 경우.','연간 보험료 납부액이 미화/유로화 1,000 이하이거나 1회 납부액이 미화/유로화 2,500 이하인 생명보험.','프라이빗 뱅킹 상품은 그 특성상 고액자산가를 대상으로 맞춤형 서비스를 제공하며 강화된 고객확인이 요구되는 상품군으로, 저위험 예시에 해당하지 않는다'],3,
  '저위험 요소 예시는 해약조항 없는 연금보험, 급여공제 방식 퇴직연금, 소액 생명보험 등이에요. 프라이빗 뱅킹 상품은 고액자산가 대상 맞춤형 서비스로 오히려 강화된 고객확인이 필요한 상품군이라 저위험 예시에 해당하지 않아요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 고위험 거래관계에 적용될 수 있는 강화된 고객확인조치(EDD)에 해당하지 않는 것은?',
  ['사업관계의 목적에 관한 정보 취득, 고객의 자금 원천 및 자산출처에 관한 정보 취득, 미래 또는 과거 거래의 목적에 관한 정보 취득.','사업관계를 시작하고 지속하기 위한 고위경영진의 승인 취득, 통제장치를 증대함으로써 사업관계에 대한 점검을 강화하고 추가적 조사가 필요한 거래 패턴을 선택.','고객에 대해 추가적 정보(예: 직업, 자산규모, 인터넷이나 공공기록물을 통해 확인 가능한 정보 등)를 취득하고, 고객과 실제소유자에 대한 신원확인 정보를 더 정기적으로 갱신.','고위험 거래관계일수록 오히려 고객확인 절차를 생략하고 신속하게 거래를 처리하는 것을 EDD의 핵심 원칙으로 한다.'],3,
  'EDD는 고위험 거래관계에 대해 오히려 "더 강화된" 확인·점검 조치(추가 정보 취득, 정기적 갱신, 고위경영진 승인, 점검 강화 등)를 요구하는 것이에요. "절차를 생략하고 신속하게 처리하는 것을 핵심 원칙"으로 한다는 서술은 EDD의 취지와 정반대예요.','ultra'),
M('jd1_3',
  'FATF 평가방법론에서 간소화된 고객확인조치(Simplified CDD)에 대한 설명으로 옳지 않은 것은?',
  ['간소화된 조치는 낮은 위험 요소에 비례하여야 한다(예: 간소화된 조치는 고객수용조치 또는 지속적인 모니터링에 대해서만 적용될 수 있다).','가능한 조치의 예로는 거래관계 설립 후 고객과 실제소유자의 신원을 확인·검증하는 것, 고객 신원정보 갱신 주기를 축소하는 것, 합리적인 금액 한도에 근거하여 지속적 점검 및 거래의 상세 검토 정도를 완화하는 것 등이 있다.','간소화된 고객확인조치는 위험도 평가 결과와 무관하게 모든 신규 고객에게 최초 거래 시 일률적으로 적용해야 하는 표준절차이다','금융회사는 자금세탁 또는 테러자금조달 위험이 낮은 경우 간소화된 고객확인을 할 수 있으며, 이때 저위험의 특성을 고려하여야 한다.'],2,
  '간소화된 CDD는 낮은 위험 요소에 비례해 적용되는 것으로, 저위험으로 평가된 경우에 한해 활용돼요. "위험도 평가 결과와 무관하게 모든 신규 고객에게 일률적으로 적용해야 하는 표준절차"라는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  'FATF 평가방법론(10.2)에서 금융회사가 CDD 조치를 수행해야 하는 경우에 해당하지 않는 것은?',
  ['권고사항 16 및 관련 주석서가 규정하는 전신송금 형태로 이루어지는 일회성 거래는 CDD 조치를 수행해야 하는 사유에 해당한다','기준금액(USD/EUR 15,000) 이상의 일회성 거래가 발생하는 경우(연결거래 포함) CDD 조치를 수행해야 한다','ML/TF가 의심되는 경우이며, 이 경우에는 FATF 권고사항에서 허용하는 예외 한도(threshold) 등이 동일하게 적용되어 거래금액이 기준금액 미만이면 CDD 조치가 면제된다','거래관계(business relations)를 수립하는 것은 CDD 조치를 수행해야 하는 사유에 해당한다'],2,
  'FATF 평가방법론 10.2에 따르면 전신송금 거래, 기준금액 이상 일회성 거래, 거래관계 수립은 모두 CDD 조치가 필요한 사유예요. 다만 ML/TF가 의심되는 경우에는 다른 예외 한도(threshold)와 달리 거래금액이 기준금액 미만이더라도 CDD 조치를 수행해야 해요. "예외 한도가 동일하게 적용되어 면제된다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 자금세탁·테러자금 의심이 있거나 고위험 시나리오가 적용되는 상황에서는 간소화된 CDD가 적용될 수 없다.\nㄴ. ML/TF가 의심되는 경우 FATF 권고사항이 허용하는 예외 한도가 적용되지 않는다.\nㄷ. 금융회사는 익명 또는 가명계좌라도 고객이 요청하는 경우 예외적으로 개설이 허용된다.\nㄹ. 권고사항 10의 일회성 거래금액 한도는 미화/유로화 20,000이며 연결거래금액을 포함한다.\nㅁ. 지속적인 고객확인은 특히 고위험 고객에 대해 더욱 철저히 이루어져야 한다.',
  ['3개.','2개.','5개.','4개.'],0,
  'ㄱ, ㄴ, ㅁ은 옳은 설명이에요. 자금세탁·테러자금 의심이 있거나 고위험 시나리오에서는 간소화된 CDD가 적용될 수 없고(ㄱ), ML/TF가 의심되는 경우 예외 한도가 적용되지 않으며(ㄴ), 고위험 고객에 대한 지속적 고객확인은 더욱 철저히 이루어져야 해요(ㅁ). 반면 금융회사는 익명·가명계좌를 어떠한 경우에도 개설해서는 안 되고(ㄷ은 옳지 않음), 권고사항 10의 일회성 거래금액 한도는 20,000이 아니라 15,000이에요(ㄹ도 옳지 않음).','ultra'),
M('jd1_3',
  'FATF 평가방법론 10.7에서 규정하는 "지속적인 고객확인" 절차에 대한 설명으로 옳지 않은 것은?',
  ['거래관계가 유지되는 동안 발생한 거래들이 금융회사가 해당 고객에 대해 확보한 정보, 사업내용 및 리스크 특성, 필요시 자금출처 등에 비추어 합당한지를 면밀히 검토하여야 한다.','특히, 고위험 고객 관련 기존 기록을 검토하여, CDD 조치를 통해 수집한 문서·데이터·정보가 최신 상태로 유지되며 유용한지 여부를 확인하여야 한다.','지속적인 고객확인은 저위험 고객에게만 요구되며 고위험 고객에게는 요구되지 않는다.','지속적인 고객확인은 거래관계가 유지되는 전체 기간에 걸쳐 이루어지는 절차이다.'],2,
  '지속적인 고객확인은 오히려 "특히 고위험 고객"에 대해 기존 기록을 검토하여 문서·데이터·정보가 최신 상태로 유지되고 유용한지 확인하도록 강조하고 있어요. "저위험 고객에게만 요구되며 고위험 고객에게는 요구되지 않는다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 18(내부통제)의 주석에서 규정하는 금융기관의 자금세탁 및 테러자금조달 방지 프로그램에 포함되어야 하는 사항에 해당하지 않는 것은?',
  ['금융기관 대표이사의 개인 자산에 대한 별도 신탁 관리 프로그램.','내부통제 이행체계(system)를 테스트하기 위한 독립적 감사 기능.','지속적인 직원 교육 프로그램.','적절한 준법 관리체계를 비롯한 내부 정책, 절차와 통제장치 개발 및 직원 채용 시 높은 수준을 확보하기 위한 적합한 선별 절차.'],0,
  '금융기관의 자금세탁·테러자금조달 방지 프로그램은 적절한 준법 관리체계(내부 정책·절차·통제장치, 직원 선별 절차), 지속적인 직원 교육 프로그램, 내부통제 이행체계를 테스트하는 독립적 감사 기능을 포함해야 해요. "대표이사 개인 자산의 별도 신탁 관리 프로그램"은 이 조항이 요구하는 사항이 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 18 주석에 대한 설명으로 옳지 않은 것은?',
  ['조치의 규모 및 수준은 자금세탁 및 테러자금조달 위험도와 사업규모에 적합해야 한다.','금융그룹의 자금세탁 및 테러자금조달 방지 프로그램은 해당 금융그룹의 모든 지점과 지배지분 보유 자회사에 적용되어야 하며, 고객확인과 위험관리를 위한 정보공유정책과 절차를 포함하여야 한다.','준법 관리체계에는 경영진급 준법감시인(compliance officer) 임명을 포함해야 한다.','준법감시인은 반드시 외부 전문기관 소속의 자문위원이어야 하며 금융기관 내부 경영진급 임직원이 맡을 수 없다.'],3,
  '준법 관리체계에는 "경영진급" 준법감시인(compliance officer) 임명을 포함해야 한다고 명시되어 있어요. "외부 전문기관 소속 자문위원이어야 하며 내부 경영진급 임직원이 맡을 수 없다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 18 주석의 5번 문단(해외 사업장)에 대한 설명으로 가장 옳은 것은?',
  ['현지 국가가 본사 국가 수준의 조치 이행을 허용하지 않는 경우, 금융그룹은 이러한 상황에 대해 아무런 추가적인 조치도 취할 필요가 없는 것으로 이해해야 한다','본사 국가의 감독기관은 해외 사업장의 AML/CFT 수준에 대해 어떠한 형태의 관여도 할 수 없도록 국제기준상 원천적으로 제한되어 있는 것으로 이해해야 한다','현지 국가의 요건이 본사 국가보다 덜 엄격한 경우, 금융그룹은 항상 현지 국가가 정한 낮은 기준만을 그대로 따르면 충분한 것으로 이해해야 한다','해외 사업장의 경우, 현지 국가의 AML/CFT 최소요건이 본사 국가보다 덜 엄격할 시, 금융기관은 현지 국가에 있는 지점 및 지배 지분 보유 자회사가 현지 국가의 법과 규정의 허용범위 내에서 본사 국가의 요건을 이행하도록 해야 한다.'],3,
  '해외 사업장의 현지 국가 AML/CFT 요건이 본사 국가보다 덜 엄격한 경우, 금융기관은 현지 법규가 허용하는 범위 내에서 본사 국가의 (더 엄격한) 요건을 이행하도록 해야 해요. 현지 국가가 이를 허용하지 않으면 금융그룹은 위험 관리를 위한 적절한 추가 조치를 적용하고 본사 국가 감독기관에 알려야 하며, 본사 감독당국은 추가적인 감독행위를 고려해야 해요.','ultra'),
M('jd1_3',
  'FATF 평가방법론 18.1(내부통제와 해외지점 및 자회사)에서 금융회사가 이행해야 하는 ML/TF 대응 프로그램의 요소에 해당하지 않는 것은?',
  ['지속적인 직원 교육 프로그램, 내부통제 체계(system) 점검을 위한 독립적 감사활동.','준법감시체계(준법감시인에 경영진급 임직원을 임명하는 것 포함).','경쟁 금융회사의 영업 전략에 대한 정보 수집 및 분석 체계.','직원 채용 시의 적절한 스크리닝 절차.'],2,
  '18.1이 요구하는 ML/TF 대응 프로그램 요소는 준법감시체계(경영진급 준법감시인 임명 포함), 직원 채용 시 적절한 스크리닝 절차, 지속적인 직원 교육 프로그램, 내부통제 체계 점검을 위한 독립적 감사활동이에요. "경쟁사 영업 전략 정보 수집·분석 체계"는 이 프로그램의 요소가 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 20(의심거래보고, STR) 주석에서 "범죄활동"의 정의에 대한 설명으로 가장 옳은 것은?',
  ['권고사항 20이 규정하는 범죄활동의 정의는, 이 권고사항의 취지와는 무관하게 각국이 완전히 자유로운 재량으로 독자적으로 정할 수 있는 것으로 이해해야 한다','권고사항 20이 다루는 범죄활동이라는 개념은, 마약 관련 범죄만을 지칭하는 좁은 의미로 한정되어 사용되는 것으로 이해해야 한다','각국은 권고사항 3에서 전제범죄로 의무화한 최소한의 범위만을 그대로 채택해야 하며, 그 범위를 넘어서는 추가적인 전제범죄를 채택하는 것은 허용되지 않는 것으로 이해해야 한다','권고사항 20에서 언급하는 범죄활동이라 함은 자금세탁의 전제범죄를 구성하는 모든 범죄행위 또는, 최소한 권고사항 3에서 전제범죄로 구성하도록 의무화한 범죄를 말하며, 각국에는 두 가지 방안 중 전자(모든 범죄행위)를 채택할 것을 강력하게 권고한다.'],3,
  '권고사항 20에서 범죄활동은 자금세탁의 전제범죄를 구성하는 모든 범죄행위, 또는 최소한 권고사항 3에서 의무화한 전제범죄를 말하며, FATF는 각국이 두 가지 방안 중 "모든 범죄행위"를 채택할 것을 강력히 권고해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29(FIU) 주석의 개요에 대한 설명으로 옳지 않은 것은?',
  ['FIU는 한 국가의 AML/CFT 관리망의 일부이자 중심적 역할을 담당하며, 다른 권한 당국의 업무수행을 지원한다.','본 주석은 FIU의 핵심 권한과 역할을 설명하며 국제기준에 포함된 의무를 명확하게 하고 있다.','권고사항 29는 한 국가가 채택해야 하는 단 하나의 FIU 모델을 구체적으로 지정하고 있으며, 다른 모델의 채택은 허용하지 않는다.','각국은 (a) 의심스러운 거래보고와 (b) 자금세탁, 이와 연루된 전제범죄와 테러자금조달과 관련된 기타 정보의 수집·분석 그리고 분석된 정보의 제공을 담당하는 중앙행정기관으로 FIU를 설립하여야 한다.'],2,
  '다양한 FIU 모델이 있음을 감안하여, 권고사항 29는 한 국가의 특정 모델 선택을 "정하지 않으며" 모든 모델에 동등하게 적용돼요. "단 하나의 FIU 모델을 구체적으로 지정하며 다른 모델은 허용하지 않는다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29(FIU) 주석에서 FIU의 역할 중 "분석(Analysis)"에 대한 설명으로 옳지 않은 것은?',
  ['FIU는 기초분석(operational analysis)과 전략분석(strategic analysis) 두 가지 유형의 분석을 실시하여야 한다.','FIU의 분석 기능은 소프트웨어 도구만으로 완전히 자동화되어야 하며, 사람의 판단이 개입해서는 안 된다.','FIU가 정보를 더욱 효율적으로 처리하고 적절히 연결짓기 위해 분석 소프트웨어를 사용하는 것이 장려되어야 하지만, 이런 도구는 사람의 판단을 필요로 하는 분석의 요소를 전부 대신할 수는 없다.','FIU 분석은 FIU가 수령하고 보유한 정보에 가치를 더해야 하며, 이러한 분석은 모든 정보를 고려하면서도 보고받은 정보의 유형·분량과 제공 후 예상되는 이용목적에 따라 각각의 보고정보 또는 적절히 선정된 정보에 초점을 맞추어야 한다.'],1,
  '분석 소프트웨어 사용이 장려되지만, 이러한 도구는 "사람의 판단을 필요로 하는 분석의 요소를 전부 대신할 수는 없다"고 명시되어 있어요. "완전히 자동화되어야 하며 사람의 판단이 개입해서는 안 된다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29 주석에서 "기초분석(operational analysis)"에 대한 설명으로 가장 옳은 것은?',
  ['기초분석(operational analysis)은 개별 대상이나 거래를 다루지 않고, 오직 국가 전체의 거시적 경제 성장률이나 물가 동향과 같은 통계만을 산출하는 것을 의미한다','이용·입수 가능하고 취득 가능한 정보를 이용하여 특정 대상(예: 사람, 자산, 범죄 네트워크 및 조직)을 식별하고, 특별한 활동 또는 거래를 추적하며, 대상과 범죄(자금세탁, 전제범죄 또는 테러자금조달) 범죄수익 간의 연결고리를 확인(determine)하는 것이다.','기초분석은 특정 대상(사람, 자산, 범죄 네트워크 등)을 식별하거나 추적하는 기능을 전혀 수행하지 않으며, 단순히 접수된 보고서를 데이터베이스에 등록하는 행정 처리에 그친다','기초분석은 전략분석(strategic analysis)과 대상·목적·기법 면에서 완전히 동일한 개념이어서, FATF 주석서에서도 두 용어를 구분 없이 혼용하고 있는 것으로 이해된다'],1,
  '기초분석(operational analysis)은 이용·취득 가능한 정보를 이용해 특정 대상(사람, 자산, 범죄 네트워크·조직 등)을 식별하고, 특별한 활동·거래를 추적하며, 대상과 범죄(자금세탁·전제범죄·테러자금조달) 범죄수익 간의 연결고리를 확인하는 분석이에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29 주석에서 FIU의 역할 중 "제공(Dissemination)"에 대한 설명으로 가장 옳은 것은?',
  ['FIU는 어떠한 경우에도 권한당국에게 정보를 제공할 수 없다.','FIU는 권한당국에게 정보 및 분석의 결과를 자발적으로 혹은 요청 시 제공할 수 있어야 하며, 이러한 제공은 안전하고 보안이 확보된 전용 채널을 통해 이루어져야 한다.','FIU의 정보 제공은 반드시 공개된 일반 통신망을 통해서만 이루어져야 한다.','FIU는 요청이 있는 경우에만 정보를 제공할 수 있으며 자발적으로 제공할 수는 없다.'],1,
  'FIU는 권한당국에게 정보 및 분석 결과를 자발적으로 혹은 요청 시 제공할 수 있어야 하며, 이러한 제공은 안전하고 보안이 확보된 전용 채널을 통해 이루어져야 해요. 자발적 제공은 자금세탁·전제범죄·테러자금조달을 의심할 만한 근거가 있는 경우에 이루어질 수 있어요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FIU의 분석 소프트웨어 사용은 장려되나 사람의 판단을 전부 대신할 수는 없다.\nㄴ. 기초분석은 특정 대상(사람, 자산 등)을 식별하고 범죄와의 연결고리를 확인하는 것이다.\nㄷ. 전략분석은 자금세탁·테러자금조달 관련 동향과 패턴을 식별하며 정책 수립에 활용될 수 있다.\nㄹ. FIU의 정보 제공은 안전하고 보안이 확보된 전용 채널을 통해 이루어져야 하며 자발적 제공도 가능하다.',
  ['1개.','3개.','4개.','2개.'],2,
  'ㄱ~ㄹ 모두 옳은 설명이에요. FIU 분석 소프트웨어의 역할, 기초분석과 전략분석의 정의, FIU 정보 제공 채널의 요건을 정확히 구분해야 풀리는 종합형 문제예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29 주석에서 "요청에 의한 제공"에 대한 설명으로 가장 옳은 것은?',
  ['FIU는 권한당국으로부터 정보 제공 요청을 받으면, 그 내용이나 목적과 무관하게 예외 없이 요청받은 모든 정보를 그대로 제공해야 하는 절대적인 의무를 부담하는 것으로 이해해야 한다','정보를 제공할 것인지 여부에 대한 최종 결정 권한은, FIU가 아니라 정보를 요청한 권한당국 측이 갖는 것으로 이해해야 한다','FIU는 권고사항 31에 따라 권한당국의 정보 요청에 응할 수 있어야 하며, FIU가 권한당국으로부터 이러한 요청을 받을 시 분석을 실행할 것인지 그리고/또는 요청 당국에 정보를 제공할 것인지 여부는 각 FIU가 결정한다.','FIU는 그 성격상 권한당국으로부터 어떠한 형태의 정보 제공 요청도 받을 수 없도록 국제기준상 원천적으로 차단되어 있는 것으로 이해해야 한다'],2,
  'FIU는 권고사항 31에 따라 권한당국의 정보 요청에 응할 수 있어야 하며, 이러한 요청에 대해 분석을 실행할 것인지, 정보를 제공할 것인지 여부는 "각 FIU가 결정"해요. 즉 자동으로 모든 정보를 제공해야 하는 것은 아니에요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29 주석에서 FIU의 "정보 접근"에 대한 설명으로 옳지 않은 것은?',
  ['FIU는 분석 기능을 제대로 수행하기 위해서 최대한 폭넓은 금융, 행정 및 법집행 관련 정보에 접근할 수 있어야 한다.','FIU는 필요에 따라 보고기관들이 FIU에 보고하는 정보 외에도 보고기관으로부터 추가적인 정보를 획득하고 사용할 수 있어야 하며, FIU가 취득할 수 있어야 하는 정보는 보고기관이 FATF 권고사항(10, 11 및 22)에 따라 관리할 의무가 있는 정보를 포함한다.','FIU는 보고기관이 FIU에 이미 보고한 정보 외에는 어떠한 추가 정보에도 접근할 수 없다.','기타 출처 정보에는 공개·공공의 정보, 기타 당국이 수집·유지한 정보, 적절한 경우 상업용 자료 등이 포함될 수 있다.'],2,
  'FIU는 보고기관들이 이미 보고한 정보 "외에도" 필요에 따라 보고기관으로부터 추가적인 정보를 획득·사용할 수 있어야 하며, 최대한 폭넓은 금융·행정·법집행 관련 정보(공개정보, 타 당국 수집정보, 상업용 자료 등)에 접근할 수 있어야 해요. "보고된 정보 외에는 어떠한 추가 정보에도 접근할 수 없다"는 서술은 원문과 정반대예요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FIU가 권한당국의 요청에 분석을 실행하고 정보를 제공할지 여부는 각 FIU가 결정한다.\nㄴ. FIU가 취득할 수 있는 정보는 보고기관이 FATF 권고사항 10, 11, 20에 따라 관리할 의무가 있는 정보를 포함한다.\nㄷ. FIU는 분석을 위해 공개정보, 타 당국 수집정보, 상업용 자료 등 폭넓은 정보에 접근할 수 있어야 한다.\nㄹ. FIU는 정보 보안·비밀 규정을 구비하고 직원의 기밀취급 허가 및 접근통제를 관리해야 한다.',
  ['3개.','2개.','1개.','4개.'],0,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. FIU가 취득 가능한 정보의 근거 권고사항은 10, 11, 20이 아니라 10(CDD), 11(기록보존), 22(DNFBP 관련)예요.','ultra'),
M('jd1_3',
  'FATF 권고사항 29 주석에서 FIU에 제공되어야 하는 자원에 대한 설명으로 가장 옳은 것은?',
  ['FIU에 대한 자원 제공 여부는 각국의 재정 상황에 따른 전적으로 임의적인 사항으로 취급되며, 국제기준상 이를 판단할 수 있는 최소한의 공통 기준조차 마련되어 있지 않은 것으로 이해된다','FIU는 그 자율과 독립을 보장받고 사명을 효과적으로 다할 수 있도록 적절한 재정적, 인적 및 기술적 자원을 제공받아야 하며, 각국은 FIU 직원들이 비밀유지를 포함하는 높은 수준의 전문성을 유지하도록 하는 절차를 마련하여야 한다.','FIU 소속 직원이 갖추어야 할 전문성이나 도덕성 수준에 대해서는, 국제기준이나 각국의 관련 법령 어디에서도 구체적인 요구사항을 규정하고 있지 않은 것으로 알려져 있다','FIU에 대한 재정적 지원은 그 독립성 확보를 위해, 정부 예산이 아니라 반드시 민간 기업의 자발적인 후원금만으로 이루어지도록 국제기준이 정하고 있는 것으로 이해된다'],1,
  'FIU는 자율과 독립을 보장받고 사명을 효과적으로 다할 수 있도록 적절한 재정적·인적·기술적 자원을 제공받아야 하며, 각국은 FIU 직원들이 비밀유지를 포함한 높은 수준의 전문성과 도덕성을 유지하고 적절한 훈련을 받도록 하는 절차를 마련해야 해요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FIU는 정보의 분석·요청·제공 결정에 대한 재량권을 포함해 업무를 자유롭게 수행할 권한과 능력을 갖춰야 한다.\nㄴ. FIU가 기존 정부기관 내에 설립되는 경우, FIU의 핵심업무는 다른 기관 업무와 통합되어 함께 운영되어야 한다.\nㄷ. FIU는 정치·정부·산업의 부적절한 영향과 간섭으로부터 자유로운 상태에서 기능을 수행해야 한다.\nㄹ. FIU는 에그몬트 그룹 회원 가입을 신청해야 한다.',
  ['4개.','3개.','2개.','1개.'],1,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. FIU가 기존 정부기관 내에 설립되더라도, FIU의 핵심업무는 다른 기관 업무와 통합되지 않고 명확히 구분되어야 해요(ㄴ은 취지가 반대로 되어 있어 옳지 않아요).','ultra'),
M('jd1_2',
  '<보기>의 국제협약·성명과 그 핵심 규율 대상을 옳게 연결한 것은?\nㄱ. 비엔나 협약(1988)\nㄴ. 바젤위원회 선언(1988)\nㄷ. 팔레모 협약(2000)\nㄹ. 메리다 협약(2003)\nA. 은행 CDD 최초 강조\nB. 마약범죄 관련 자금세탁 범죄화\nC. 조직범죄 전반으로 자금세탁 확대\nD. 부패범죄와 자산회복(Asset Recovery)',
  ['ㄱ-B, ㄴ-A, ㄷ-C, ㄹ-D.','ㄱ-A, ㄴ-B, ㄷ-D, ㄹ-C.','ㄱ-D, ㄴ-A, ㄷ-B, ㄹ-C.','ㄱ-B, ㄴ-C, ㄷ-A, ㄹ-D.'],0,
  '비엔나 협약(마약범죄 관련 자금세탁 범죄화), 바젤위원회 선언(은행 CDD 최초 강조), 팔레모 협약(조직범죄 전반으로 자금세탁 확대), 메리다 협약(부패범죄와 자산회복)이 옳은 연결이에요. 이 네 문헌의 핵심 규율 대상을 혼동하지 않는 것이 중요해요.','ultra'),
M('jd1_2',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] A국 금융회사는 은행 경영진 차원에서 고객확인의무(CDD)를 최초로 명문화하고, 자금세탁 혐의거래에 대한 지원을 거절하며 수사기관에 협조하는 내부절차를 수립하였는데, 이는 특정 국제기구의 1988년 성명에 근거한 조치였다.',
  ['이는 비엔나 협약(1988)에 근거한 조치로, 마약범죄에 대한 형사처벌만을 규정한다.','이는 팔레모 협약에 근거한 조치이다.','이는 UNSCR 1267호에 근거한 조치이다.','이는 바젤위원회 선언(1988)에 근거한 조치로, 이 선언은 은행의 CDD, 자금세탁 혐의거래 지원거절, 수사기관 협조, 내부절차 수립을 주요내용으로 한다.'],3,
  '은행 CDD의 최초 강조, 자금세탁 혐의거래 지원거절, 수사기관 협조, 내부절차 수립은 바젤위원회 선언(1988)의 4가지 주요내용에 해당해요. 이는 국제결제은행(BIS) 산하 바젤위원회가 발표한 성명으로, 마약범죄를 직접 형사처벌하는 조약인 비엔나 협약과는 구분돼요.','ultra'),
M('jd1_2',
  '<보기>의 국제협약·UNSCR을 채택 또는 발표된 시간 순서대로 옳게 나열한 것은?\nㄱ. 팔레모 협약\nㄴ. 비엔나 협약\nㄷ. 테러자금조달의 억제를 위한 국제협약\nㄹ. UNSCR 1373호\nㅁ. 메리다 협약',
  ['ㅁ → ㄴ → ㄹ → ㄱ → ㄷ.','ㄷ → ㅁ → ㄴ → ㄱ → ㄹ.','ㄹ → ㅁ → ㄱ → ㄴ → ㄷ.','ㄴ → ㄷ → ㄱ → ㄹ → ㅁ.'],3,
  '연도 순서는 비엔나 협약(1988) → 테러자금조달의 억제를 위한 국제협약(1999) → 팔레모 협약(2000) → UNSCR 1373호(2001) → 메리다 협약(2003)이에요. 국제협약과 UNSCR을 하나의 시간축에 배열하는 유형의 문제예요.','ultra'),
M('jd1_2',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] B국 정부는 UN 안전보장이사회의 별도 지정 없이, 자체적인 판단과 국내법에 근거하여 특정 테러단체의 자산을 동결하는 조치를 취하였다.',
  ['이는 UNSCR 1267호(1999)와 관련된 사례로, 이 결의는 반드시 UN 안전보장이사회의 지정이 있어야만 자산동결이 가능하도록 규정한다.','이는 비엔나 협약과 관련된 사례이다.','이는 팔레모 협약과 관련된 사례이다.','이는 UNSCR 1373호(2001)와 관련된 사례로, 이 결의는 UN의 별도 지정 없이도 각국이 자체적으로 테러 관련 자를 지정하여 국내법에 근거해 자산을 동결할 수 있도록 하는 것을 특징으로 한다.'],3,
  'UNSCR 1373호(2001)는 UN의 별도 지정(1267호와 같은 지정기반 방식) 없이도 각국이 자체적으로 테러 관련자를 지정하고 국내법에 근거하여 자산을 동결할 수 있도록 하는 것이 핵심 특징이에요. 반면 UNSCR 1267호는 UN 안전보장이사회 또는 관련 제재위원회의 지정(Targeted Sanctions)에 근거해요.','ultra'),
M('jd1_2',
  '<보기>는 UNSCR 1267호와 1373호를 비교한 것이다. 옳지 않은 것은?',
  ['UNSCR 1267호(1999)는 지정기반(Targeted Sanctions) 방식으로, UN 제재리스트에 등재된 알카에다·탈레반 관련자를 대상으로 한다.','UNSCR 1373호(2001)는 각국이 자체적으로 지정할 수 있으며, 국내법에 기반한 동결을 특징으로 하고 9·11 테러 이후 채택되었다.','두 결의 모두 지정된 개인·단체의 자금 및 자산을 지체 없이 동결할 의무를 부과한다는 공통점이 있다.','UNSCR 1267호와 1373호는 완전히 동일한 지정 방식을 사용하므로 실무상 구별할 필요가 없다.'],3,
  '1267호는 UN(제재위원회)의 지정에 근거한 지정기반 방식이고, 1373호는 각국이 자체적으로 지정 가능한 방식이라는 점에서 서로 다른 지정 메커니즘을 가져요. "완전히 동일한 지정 방식이므로 구별할 필요가 없다"는 서술은 옳지 않아요. 다만 두 결의 모두 지체 없는 동결의무를 부과한다는 공통점은 있어요.','ultra'),
M('jd1_2',
  '테러자금조달의 억제를 위한 국제협약(1999)에서 "테러 실행 여부와 무관하게 처벌 가능한지"에 대한 최근 출제 경향에 대한 설명으로 가장 옳은 것은?',
  ['이 협약은 자금이 실제로 특정 테러행위에 사용되었다는 사실이 입증되지 않더라도, 테러 행위에 이용될 것이라는 의도를 가지고 자금을 제공·모집한 것만으로도 처벌이 가능하도록 규정하고 있다.','이 협약은 테러행위가 실제로 완전히 실행되고 결과가 발생하여 완료된 경우에만 비로소 자금조달자를 처벌할 수 있도록 하는 결과범 구조를 취하고 있는 것으로 이해해야 한다','테러 행위가 미수에 그쳐 실제 결과가 발생하지 않은 경우에는, 자금조달자에 대해 어떠한 형태의 처벌도 이루어질 수 없는 것으로 이해해야 한다','이 협약은 테러자금조달죄가 성립하기 위해 반드시 실제 테러행위라는 결과의 발생을 요구하는 결과범 구조를 취하고 있는 것으로 이해해야 한다'],0,
  '테러자금조달의 억제를 위한 국제협약(1999)은 자금이 실제로 특정 테러행위에 사용되었다는 사실이 입증되지 않더라도, 테러 행위에 이용될 것이라는 의도를 가지고 자금을 제공·모집한 것만으로도 처벌 가능한 거동범(추상적 위험범) 구조를 취해요.','ultra'),
M('jd1_1',
  '<보기>는 국제협약과 관련 핵심 개념을 연결한 것이다. 옳지 않은 것은?',
  ['팔레모 협약 - 국제조직범죄방지협약, 조직범죄 전반으로 AML 확대, 전제범죄 확대.','비엔나 협약 - 최초 국제 AML 협약, 마약범죄 관련 자금세탁 범죄화, 몰수·국제공조 포함.','테러자금조달의 억제를 위한 국제협약 - UN 반부패협약으로서 부패범죄 예방과 자산회복을 핵심으로 한다.','메리다 협약 - UN 반부패협약, 자산회복(Asset Recovery), 국제부패범죄 협력.'],2,
  'UN 반부패협약이자 자산회복(Asset Recovery)을 핵심으로 하는 것은 메리다 협약(UNCAC)이에요. 테러자금조달의 억제를 위한 국제협약(1999)은 테러자금조달의 범죄화를 규율하는 별개의 협약으로, 부패범죄나 자산회복과는 직접적인 관련이 없어요.','ultra'),
M('jd1_3',
  '동부 및 남부 아프리카 자금세탁방지그룹(ESAAMLG)에 대한 설명으로 가장 옳은 것은?',
  ['ESAAMLG에는 영국과 미국이 정식 회원국으로 가입되어 있으며, 두 나라가 사무국 운영 비용과 행정 업무를 공동으로 전담하는 특수한 지위를 부여받고 있는 것으로 알려져 있다','ESAAMLG는 아프리카 대륙과는 지리적으로 무관한 서아프리카 인근의 도서국 15개국만을 대상으로 하는 소규모 지역 협의체에 불과한 것으로 알려져 있다','ESAAMLG는 자금세탁과 테러 및 확산자금조달을 방지하기 위한 글로벌 표준을 준수하는 지역 기구로, 앙골라·보츠와나·에티오피아·케냐·남아프리카공화국·남수단·탄자니아·우간다 등 20개 국가로 구성되어 있으며, 영국과 미국은 1999년 탄자니아에서 출범한 이래 동 기구의 회원국들과 협력·지원을 해오고 있다.','ESAAMLG는 2020년 코로나19 팬데믹 대응을 계기로 새롭게 설립된 신생 기구로, 그 이전에는 동부·남부 아프리카 지역에 이와 유사한 조직이 전혀 존재하지 않았다'],2,
  'ESAAMLG는 동·남부 아프리카 20개국(앙골라, 보츠와나, 에티오피아, 케냐, 남아공, 남수단, 탄자니아, 우간다 등)으로 구성된 지역 기구로, 1999년 탄자니아에서 출범했어요. 영국과 미국은 회원국이 아니라 "협력·지원"을 해온 국가로 명시되어 있어요.','ultra'),
M('jd1_3',
  '2008년 서울에서 개최된 Egmont Group 총회에 대한 설명으로 옳지 않은 것은?',
  ['이 총회는 5월 24일부터 28일까지 개최되었으며, 참석 규모는 10개국 미만의 소규모 회의였다.','Egmont Group 총회가 아시아 지역에서 개최된 것은 우리나라가 최초였다.','동 총회에는 90개국 FIU 관계자 및 UNODC, 세계은행(World Bank) 등 12개 국제기구 관계자 250여 명이 참석하였다.','동 총회에서는 자금세탁/테러자금조달 방지를 위한 전 세계 FIU 간 협력 강화 방안을 논의하였다.'],0,
  '2008년 서울 Egmont Group 총회에는 90개국 FIU 관계자 및 UNODC·세계은행 등 12개 국제기구 관계자 250여 명이 참석한 대규모 국제회의였어요. "10개국 미만의 소규모 회의"라는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. GIABA는 서아프리카경제공동체(ECOWAS)의 전문 기관으로 공식 설립되었다.\nㄴ. GAFILAT는 아프리카·중동 25개국이 참여하는 지역기구이다.\nㄷ. 에그몬트 그룹은 1995년 13개국으로 출범하여 2023년 12월 현재 165개국이 회원이다.\nㄹ. 우리나라는 2002년 6월 모나코 총회에서 에그몬트 그룹 정회원으로 가입하였다.\nㅁ. 2015년 서울에서 아시아 최초로 에그몬트 그룹 총회가 개최되었다.',
  ['2개.','3개.','4개.','5개.'],1,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. 에그몬트 그룹은 1995년 13개국으로 출범하여 이후 꾸준히 회원국이 늘어 2023년 12월 현재 165개국이 회원으로 참여하고 있어요. GAFILAT는 아프리카·중동이 아니라 남미·중미 18개국이 참여하는 라틴아메리카 지역기구이고(ㄴ), 서울 에그몬트 그룹 총회는 2015년이 아니라 2008년에 개최되었어요(ㅁ).','ultra'),
M('jd2_9',
  '2020년 FATF의 TBML 업데이트 보고서 중 세관 부문의 중점사항에 대한 설명으로 옳지 않은 것은?',
  ['세관은 일반적으로 무역 부문의 최우선 집행당국으로, 무역기반자금세탁(TBML)을 비롯하여 국제 교역 시스템 남용 범죄 방지라는 임무를 갖고 있다.','세관은 국제 교역, 재화의 흐름, 국제 공급망 등 TBML의 확인·수사에 필수적인 요소들과 관련하여 심도 있는 지식을 보유하고 있으므로, TBML 활동의 확인에 핵심적인 국제 교역 서류 및 데이터에 유일한 접근권을 가진 경우가 많다.','TBML 적발에 세관 화물 분석이 사용될 수 있으며, 세관은 불법적 목적으로 국제 운송을 이용하는 행위를 적발하는 독특한 위치를 가지고 있다.','세관은 TBML 관련 업무에 있어 관세 징수, 세율 결정 등 전통적 업무와는 완전히 분리된 별도의 독립 기관으로 전환되어야 한다.'],3,
  '세관은 관세 징수·세율 결정 등 전통적 업무를 처리하면서 동시에 TBML 단속을 위한 충분한 역량을 갖추고, 자국 FIU 및 법집행기관에서 제공되는 운송 관련 문서와 금융정보를 조사할 수 있어야 하며, 세관 내 전담팀이나 부서를 만들 것이 권고돼요. "전통적 업무와 완전히 분리된 별도의 독립 기관으로 전환되어야 한다"는 서술은 원문에 없는 내용이에요.','ultra'),
M('jd2_9',
  'TBML 단속을 위한 세관과 FIU 간의 협력에 대한 설명으로 옳지 않은 것은?',
  ['세관과 FIU 간의 긴밀한 협력을 통해 집합적 역량을 상당 수준 강화하여 의심스러운 무역 활동 및 의심스러운 금융 활동을 연계함으로써 TBML을 확인할 수 있다.','세관과 FIU는 서로 다른 법적 근거와 목적을 가진 기관이므로 어떠한 정보도 공유해서는 안 된다.','세계관세기구(WCO)와 에그몬트 그룹(Egmont Group)의 \'세관-FIU 협력 편람\'에서는 국가 차원에서 세관·FIU가 강력한 협력관계를 수립할 것을 권고하고 있다.','이러한 협력관계는 고위 경영진 수준, 실무 관리자·담당관 수준, 분석관 수준에서 형성돼야 하며, 분기별 혹은 반기별로 중간관리자 회의를 개최하여 전략적 계획을 통해 TBML을 방지하고 정보를 교환할 수 있도록 해야 한다.'],1,
  '세관-FIU 협력 편람은 오히려 국가 차원에서 세관과 FIU가 "강력한 협력관계를 수립"할 것을 권고하며, 실무 목적의 의심스러운 금융정보 교환, 관세중심 자금세탁 활동·관세사기·밀반출입 의심 개인·법인 정보 공유 등을 포함할 수 있다고 명시해요. "어떠한 정보도 공유해서는 안 된다"는 서술은 원문과 정반대예요.','ultra'),
M('jd2_9',
  'TBML 활동에서 조직범죄집단(OCG, Organised Criminal Groups)의 개입 양상에 대한 설명으로 가장 옳은 것은?',
  ['OCG(조직범죄집단)가 개입된 TBML 사건의 경우, 국내 법집행기관이 세관이 관할하는 영역까지 자금이나 재화의 흐름을 추적하는 것은 원천적으로 불가능한 것으로 이해해야 한다','OCG가 개입돼 불법자금을 해외로 운송되는 상업용 제품으로 전환하는 현금을 중심으로 한 범죄활동이 이에 해당되며, TBML 위험이 높은 국가의 경우 세관당국·FIU·법집행기관이 각각의 AML/CFT 노력을 조율하는 것이 매우 중요하다.','조직범죄집단(OCG)이라는 개념은 TBML이라는 주제와는 전혀 관련성이 없는 별개의 독립적인 개념으로 이해해야 한다','OCG의 개입은 오로지 국내에서 이루어지는 거래에서만 나타나는 현상일 뿐, 재화나 자금이 해외로 운송되는 과정과는 무관한 것으로 이해해야 한다'],1,
  'OCG가 개입돼 불법자금을 해외로 운송되는 상업용 제품으로 전환하는 현금 중심의 범죄활동이 TBML의 전형적 양상이며, TBML 위험이 높은 국가에서는 세관당국·FIU·법집행기관이 AML/CFT 노력을 조율하는 것이 중요해요. 또한 TBML 사건에서는 국내 차원의 전제범죄 수사가 국제적인 자금세탁 수사로 이어지기도 하는데, 이는 법집행기관이 세관 영역까지 자금 및 재화를 추적하는 것이 가능하기 때문이에요.','ultra'),
M('jd2_9',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 세관은 TBML을 비롯한 국제 교역 시스템 남용 범죄 방지 임무를 갖는 무역 부문 최우선 집행당국이다.\nㄴ. WCO와 에그몬트 그룹은 세관-FIU 협력 편람을 통해 양 기관 간 강력한 협력관계 수립을 권고한다.\nㄷ. FIU의 금융 분석 전문성과 세관의 국제 교역 전문성이 결합하면 AML/CFT 조치의 효과성 향상에 기여할 수 있다.\nㄹ. OCG가 개입된 TBML은 반드시 무역대금을 전액 전신송금으로만 결제하며 현금은 전혀 사용하지 않는 범죄활동만을 의미한다.',
  ['1개.','4개.','2개.','3개.'],3,
  'ㄱ, ㄴ, ㄷ은 옳은 설명이에요. OCG가 개입된 TBML은 오히려 불법자금을 상업용 제품으로 전환하는 현금 중심의 범죄활동을 포함할 수 있어요. "현금을 전혀 사용하지 않는다"는 ㄹ의 서술은 옳지 않아요.','ultra'),
M('jd2_6',
  '<보기>의 사례에 대한 설명으로 가장 옳은 것은?\n[사례] 국내 세관은 특정 수출업체의 화물 신고 내역이 실제 거래 관행과 상이함을 발견하고, 이를 국내 FIU에 통보하였다. FIU는 이 정보를 분석하여 관련 금융거래에 대한 의심거래보고 여부를 검토하였다.',
  ['이는 세관과 FIU 간의 협력을 통해 무역기반자금세탁(TBML) 의심 활동을 확인하는 전형적인 사례에 해당하며, 국내 AML/CFT 법률체계에서 세관과 FIU가 각자의 전문성을 결합해 협력하는 구조를 보여준다.','세관과 FIU는 법적으로 서로 정보를 공유할 수 있는 근거가 전혀 없으므로, 이 사례와 같은 협력 자체가 관련 법령을 위반한 위법행위에 해당하는 것으로 이해해야 한다','이 사례는 순수한 관세 행정 사안일 뿐이며, 국내 AML/CFT 법률체계나 자금세탁방지제도와는 어떠한 관련성도 갖지 않는 것으로 이해해야 한다','FIU는 관련 법령상 세관으로부터 화물 신고 이상 내역과 같은 어떠한 정보도 제공받을 권한을 갖고 있지 않은 것으로 이해해야 한다'],0,
  '이는 세관과 FIU 간의 협력을 통해 무역기반자금세탁(TBML) 의심 활동을 확인하는 전형적인 사례로, 국내 AML/CFT 법률체계에서 세관과 FIU는 서로 정보를 공유하며 협력할 수 있는 근거를 갖고 있어요.','ultra'),
M('jd2_10',
  'MiCA(Regulation on Markets in Crypto Assets)의 성격에 대한 설명으로 옳지 않은 것은?',
  ['MiCA는 기존 금융서비스 법규가 적용되지 않던 암호자산에 대해 법적 명확성을 제공하고, EU 수준에서 암호자산 발행자(권유자)와 암호자산사업자에 대한 통일된 규칙을 수립하려는 27개 회원국 전체에 걸쳐 적용 효력을 갖는 EU의 법률이다.','MiCA는 27개 회원국 중 일부 국가에만 선택적으로 적용되며, 나머지 회원국은 자국의 독자적인 암호자산 규제를 그대로 유지할 수 있다.','종전 금융상품 시장(markets in financial intruments)에 관한 규제법으로 MiFIR, MiFIDⅡ 등이 있었다면, 이제 암호자산시장에 관한 규제법인 MiCA Regulation이 존재하게 된 것이다.','MiCA는 유럽연합의 기존 금융서비스 법규에서 다루지 않던 암호자산에도 적용할 여지가 있는 회원국의 제도적 틀을 대체하고 있다.'],1,
  'MiCA는 "27개 회원국 전체에 걸쳐 적용 효력을 갖는" EU의 법률(Regulation)이에요. "일부 국가에만 선택적으로 적용되며 나머지는 독자적 규제를 유지할 수 있다"는 서술은 원문과 정반대예요.','ultra'),
M('jd2_10',
  'MiCA 제1조에서 밝히고 있는 목적에 대한 설명으로 가장 옳은 것은?',
  ['자산준거 토큰 및 이머니 토큰이 아닌 암호자산, 자산준거 토큰 그리고 이머니 토큰의 일반대중에 대한 권유 및 거래플랫폼에서의 매매거래에 대한 허용에 관하여, 그리고 암호자산서비스 제공자들에 관하여 통일된 요건을 규정하는 것이다.','MiCA 제1조는 암호자산과 관련된 사항이 아니라, 오로지 전통적인 은행의 건전성 규제만을 유일한 목적으로 삼고 있는 것으로 이해해야 한다','MiCA 제1조는 암호자산이나 관련 시장과는 전혀 무관하며, 오로지 기존의 전통적인 증권시장을 규율하는 것만을 목적으로 삼고 있는 것으로 이해해야 한다','MiCA 제1조가 궁극적으로 추구하는 목적은, 회원국들이 서로 다른 개별적인 규제 요건을 계속 유지하도록 장려하여 규제의 다양성을 보장하는 것으로 이해해야 한다'],0,
  'MiCA 제1조는 자산준거 토큰 및 이머니 토큰이 아닌 암호자산, 자산준거 토큰, 이머니 토큰의 일반대중에 대한 권유 및 거래플랫폼 매매거래 허용에 관하여, 그리고 암호자산서비스 제공자들에 관하여 "통일된 요건"을 규정한다고 목적을 밝히고 있어요.','ultra'),
M('jd2_10',
  'MiCA가 구분하는 암호자산의 3가지 유형에 해당하지 않는 것은?',
  ['자산준거 토큰(Asset Referenced Token).','자산준거 토큰이나 이머니 토큰이 아닌 암호자산.','이머니 토큰(E-money Token).','중앙은행이 발행하는 법정화폐 그 자체(CBDC).'],3,
  'MiCA는 암호자산을 ①자산준거 토큰이나 이머니 토큰이 아닌 암호자산 ②자산준거 토큰 ③이머니 토큰의 3가지로 구분하여, 지급 또는 투자의 수단으로서의 수용도 등에 따라 차등화된 규제를 적용해요. 중앙은행이 발행하는 법정화폐 자체(CBDC)는 MiCA가 규율하는 암호자산 분류에 포함되지 않아요.','ultra'),
M('jd2_10',
  'MiCA가 금융시스템의 안정성과 소비자·투자자 보호를 위해 도입하고 있는 차등화된 규제 요건에 해당하지 않는 것은?',
  ['암호자산 보유자에게 최소 연 20%의 수익률을 법적으로 보장하는 요건.','암호자산의 발행, 일반대중에 대한 권유(offering to the public) 및 암호자산 거래 플랫폼에서의 매매거래에 대한 허용(admission to trading on trading platforms)에 필요한 투명성 및 공시 요건.','암호자산서비스제공자, 자산준거 토큰/이머니 토큰 발행자에 대한 인가와 감독, 운영·조직 및 지배구조(거버넌스)에 관한 요건.','암호자산 발행·권유·매매거래 허용에 있어서 보유자들에 대한 보호 요건, 암호자산서비스제공자 고객 보호 요건, 암호자산시장의 무결성 확보를 위해 내부자거래·내부정보의 불법적 공개 및 시장 조작을 방지하는 요건.'],0,
  'MiCA의 차등화된 규제 요건은 투명성·공시 요건, 인가·감독·거버넌스 요건, 보유자·고객 보호 요건, 시장 무결성(내부자거래·시장조작 방지) 요건 등이에요. "암호자산 보유자에게 최소 연 20% 수익률을 법적으로 보장"하는 요건은 MiCA가 규정하는 내용이 아니며, 애초에 규제 취지와 맞지 않아요.','ultra'),
M('jd2_10',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. MiCA는 27개 회원국 전체에 적용되는 EU의 법률(Regulation)이다.\nㄴ. MiCA는 종전의 GDPR과 유사하게 암호자산시장을 규율하는 개인정보보호 중심의 법이다.\nㄷ. MiCA는 암호자산을 3가지 유형(비ART/EMT 암호자산, ART, EMT)으로 구분한다.\nㄹ. MiCA는 암호자산서비스제공자에 대한 인가·감독 요건을 규정한다.',
  ['1개.','2개.','4개.','3개.'],3,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. MiCA는 GDPR(개인정보보호 규정)이 아니라 MiFIR·MiFID II와 유사한 성격으로 암호자산시장을 규율하는 금융규제 법률이에요(ㄴ).','ultra'),
M('jd1_5',
  '미국 통화감독청(OCC)의 조직 구조에 대한 설명으로 옳지 않은 것은?',
  ['OCC는 오직 워싱턴 D.C. 본사 한 곳에서만 모든 감독 업무를 직접 수행하며 지역 사무소는 존재하지 않는다.','OCC는 미국 은행들의 해외활동을 감독하기 위한 런던 사무소를 두고 있다.','워싱턴 D.C.에 본사를 둔 OCC는 전국 60개 도시에 94개의 감독사무소(supervisory operating locations)가 있다.','OCC는 4개의 지역(geographic regions)을 감독하는 4개의 특별구 사무소(district offices)를 두고 있다.'],0,
  'OCC는 전국 60개 도시에 94개의 감독사무소와 4개 지역을 감독하는 4개의 특별구 사무소, 그리고 미국 은행의 해외활동 감독을 위한 런던 사무소까지 두고 있는 전국적·국제적 조직 구조를 갖추고 있어요. "본사 한 곳에서만 업무를 수행하며 지역 사무소는 존재하지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd1_5',
  '미국 통화감독관(Comptroller of the Currency)에 대한 설명으로 옳은 것은?',
  ['통화감독관이라는 직위는 FDIC, FSOC, FFIEC와 같은 어떠한 관련 기구에도 소속되지 않으며, 이들 기구와는 완전히 분리된 독립적인 지위를 갖는 것으로 이해해야 한다','대통령은 미 상원의 동의에 따라 5년간 OCC를 이끌어 나가는 통화감독관을 임명하며, 통화감독관은 연방예금보험공사(FDIC)에서 이사직을 맡고 있으며, 금융안정성감독협의회(FSOC)와 연방금융기관검사협의회(FFIEC)의 회원이기도 하다.','통화감독관을 임명하는 절차에 있어서는, 대통령이 상원의 별도 동의 절차를 거치지 않고 단독으로 임의에 따라 자유롭게 임명할 수 있는 것으로 이해해야 한다','통화감독관이라는 직위는 임기가 정해져 있지 않은 종신직으로 운영되어, 스스로 사임하지 않는 한 계속하여 그 직위를 유지할 수 있는 것으로 이해해야 한다'],1,
  '통화감독관은 대통령이 미 상원의 동의를 받아 5년 임기로 임명하며, FDIC에서 이사직을 맡고 FSOC와 FFIEC의 회원이기도 해요.','ultra'),
M('jd1_5',
  '<보기>는 미국의 연방(Federal) 및 주(State) 차원의 금융감독기관을 정리한 것이다. 옳지 않은 것은?',
  ['주(State) 차원에는 자율규제기구인 FINRA(Financial Industry Regulatory Authority)와 뉴욕주 금융서비스국(New York Department of Financial Services, DFS) 등이 있다.','FinCEN과 OFAC는 미 재무부 산하 기관으로 분류된다.','SEC와 FDIC는 주(State) 차원의 기관으로, 연방 차원의 금융당국과는 무관하다.','연방 금융당국에는 미 재무부(Treasury) 산하 FRB, OCC, FinCEN, OFAC와 미 상무부(DOC), 미 법무부(DOJ) 산하 FBI, SEC, FDIC 등이 포함된다.'],2,
  'SEC(증권거래위원회)와 FDIC(연방예금보험공사)는 연방(Federal) 차원의 기관으로 분류돼요. "주(State) 차원의 기관으로 연방과 무관하다"는 서술은 옳지 않아요. 주 차원에는 FINRA와 같은 자율규제기구(SRO)나 뉴욕주 DFS 등이 있어요.','ultra'),
M('jd1_5',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. OCC는 전국 60개 도시에 94개의 감독사무소를 두고 있다.\nㄴ. 통화감독관은 대통령이 상원 동의를 받아 5년 임기로 임명한다.\nㄷ. 통화감독관은 FDIC 이사직을 맡지 않으며 FSOC·FFIEC 회원도 아니다.\nㄹ. 미국의 금융감독 체계는 연방(Federal) 차원과 주(State) 차원으로 구분되며, 주 차원에는 FINRA·뉴욕주 DFS 등이 있다.',
  ['1개.','2개.','4개.','3개.'],3,
  'ㄱ, ㄴ, ㄹ은 옳은 설명이에요. 통화감독관은 FDIC 이사직을 맡지 않는 것이 아니라 실제로 FDIC 이사직을 맡으며 FSOC·FFIEC의 회원이에요(ㄷ은 사실이 반대로 서술되어 옳지 않아요).','ultra'),
M('jd2_8',
  '테러자금금지법(공중 등 협박목적 및 대량살상무기확산을 위한 자금조달행위의 금지에 관한 법률) 제5조의2(금지행위)에 대한 설명으로 옳지 않은 것은?',
  ['누구든지 제1항에 따른 개인, 법인 또는 단체라는 점을 알면서, 그를 이롭게 할 목적으로 자금 또는 재산을 모집하거나 운반·보관해서는 아니 된다.','누구든지 제2조 제1호 각 목의 어느 하나에 해당하는 행위를 하거나 하려고 하는 개인, 법인 또는 단체라는 점을 알면서 그를 이롭게 할 목적으로 그 개인, 법인 또는 단체에 직접 또는 제3자를 통하여 자금 또는 재산을 제공해서는 아니 된다.','누구든지 제1항에 따른 개인, 법인 또는 단체라는 점을 알면서 그를 이롭게 할 목적으로 같은 조 제1항 또는 제2항에 따른 행위를 강요하거나 권유해서는 아니 된다.','제5조의2의 금지행위는 자금 또는 재산의 직접 제공에만 한정되며, 제3자를 통한 간접 제공이나 모집·운반·보관 행위는 금지 대상에 포함되지 않는다.'],3,
  '제5조의2 제1항은 "직접 또는 제3자를 통하여" 자금·재산을 제공하는 행위를 금지하며, 제2항은 모집·운반·보관 행위도 금지 대상에 포함해요. "직접 제공에만 한정되며 간접 제공이나 모집·운반·보관은 포함되지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '테러자금금지법 제6조(벌칙) 제1항에 따라 10년 이하의 징역 또는 1억원 이하의 벌금에 처해지는 행위에 해당하는 것은?',
  ['거짓이나 그 밖의 부정한 방법으로 제4조 제4항에 따른 허가를 받아 금융거래를 한 금융거래제한대상자의 상대방.','제5조의2 제1항 또는 제2항을 위반하여 자금 또는 재산을 제공·모집하거나 운반·보관한 자, 제5조의2 제3항을 위반하여 같은 조 제1항 또는 제2항에 따른 행위를 강요하거나 권유한 자.','제5조 제2항을 위반하여 관할 수사기관에 신고하지 아니한 자.','제5조 제3항을 위반하여 신고 사실을 누설한 자.'],1,
  '제6조 제1항은 제5조의2 제1항·제2항(자금·재산 제공·모집·운반·보관) 및 제3항(강요·권유) 위반자를 10년 이하의 징역 또는 1억원 이하의 벌금에 처해요. 거짓·부정한 방법의 허가 관련 위반(②)은 3년 이하의 징역 또는 3천만원 이하의 벌금(제2항), 신고의무 위반(③④)은 2년 이하의 징역 또는 1천만원 이하의 벌금(제3항)에 해당하는 상대적으로 경한 처벌이에요.','ultra'),
M('jd2_8',
  '테러자금금지법 제6조 제2항에 따라 3년 이하의 징역 또는 3천만원 이하의 벌금에 처해지는 자에 해당하지 않는 것은?',
  ['금융거래제한대상자라는 사실을 알면서 제4조 제4항에 따른 허가를 받지 아니하고 같은 항 제2호에 해당하는 행위를 한 금융거래제한대상자의 상대방.','제5조의2 제1항 또는 제2항을 위반하여 자금 또는 재산을 제공·모집하거나 운반·보관한 자.','허가를 받지 아니하고 제4조 제4항 각 호의 어느 하나에 해당하는 행위를 한 금융거래제한대상자.','거짓이나 그 밖의 부정한 방법으로 제4조 제4항에 따른 허가를 받고 제4조 제4항 각 호의 어느 하나에 해당하는 행위를 한 금융거래제한대상자 또는 그 상대방.'],1,
  '제5조의2 제1항·제2항 위반(자금·재산 제공·모집·운반·보관)은 제6조 제1항에 따라 "10년 이하의 징역 또는 1억원 이하의 벌금"이라는 더 중한 처벌 대상이에요. 제6조 제2항(3년 이하 징역 또는 3천만원 이하 벌금)은 허가 관련 부정행위·무허가행위 등에 해당해요.','ultra'),
M('jd2_8',
  '테러자금금지법 제6조에 대한 설명으로 옳지 않은 것은?',
  ['제1항부터 제3항까지의 죄를 범한 자에게는 징역과 벌금을 병과(倂科)할 수 있는 것으로 이 조항이 정하고 있어, 두 형벌을 함께 부과하는 것이 가능한 것으로 이해해야 한다','제1항 제1호 또는 제2항 제1호부터 제3호까지에 해당하는 죄의 미수범에 대해서도 처벌한다는 규정이 이 조항에 명시되어 있는 것으로 이해해야 한다','제1항 제1호의 죄를 범할 목적으로 예비하거나 음모한 자는 3년 이하의 징역 또는 3천만 원 이하의 벌금에 처하도록 이 조항이 규정하고 있는 것으로 이해해야 한다','법인의 대표자나 법인 또는 개인의 대리인, 사용인, 그 밖의 종업원이 그 법인 또는 개인의 업무에 관하여 위반행위를 하면, 그 법인 또는 개인에게는 벌금형이 아니라 행위자와 동일한 징역형이 과해지는 것으로 이 조항이 규정하고 있는 것으로 이해해야 한다'],3,
  '테러자금금지법 제6조의 양벌규정은 위반행위를 한 행위자를 벌하는 외에, 그 법인 또는 개인에게는 징역형이 아니라 해당 조문에 정한 벌금형을 과하도록 규정하고 있어요. "법인 또는 개인에게도 행위자와 동일한 징역형이 과해진다"는 서술은 옳지 않아요(양벌규정상 법인·개인에게는 벌금형만 부과돼요).','ultra'),
M('jd2_8',
  '테러자금금지법 제6조 제7항의 양벌규정에 대한 예외 사유에 대한 설명으로 가장 옳은 것은?',
  ['법인의 규모가 일정 수준 이상인 경우에만 예외가 인정된다.','법인 또는 개인은 어떠한 경우에도 예외 없이 항상 처벌받는다.','법인 또는 개인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 양벌규정에 따른 처벌을 하지 아니한다.','양벌규정에는 어떠한 예외 사유도 존재하지 않는다.'],2,
  '양벌규정에 따르면, 법인 또는 개인이 위반행위를 방지하기 위해 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 경우에는 그 법인·개인에 대한 처벌을 하지 아니해요(면책 사유).','ultra'),
M('jd2_8',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 테러자금금지법 제5조의2 제1항은 자금·재산의 직접 및 제3자를 통한 제공을 모두 금지한다.\nㄴ. 제6조 제1항 위반은 10년 이하 징역 또는 5천만원 이하 벌금에 처해질 수 있다.\nㄷ. 제6조에 따라 미수범도 처벌되며, 예비·음모도 처벌 대상이다.\nㄹ. 양벌규정상 법인·개인이 상당한 주의와 감독을 게을리하지 않았다면 처벌하지 아니한다.',
  ['4개.','3개.','2개.','1개.'],1,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. 제6조 제1항 위반의 벌금형은 5천만원이 아니라 1억원 이하예요(ㄴ).','ultra'),
M('jd2_8',
  '확산자금조달금지 제도상 "확산(Proliferation)"의 정의에 대한 설명으로 가장 옳은 것은?',
  ['확산이라는 개념은 오로지 핵무기를 제조하는 행위에만 국한되어 적용되는 좁은 개념으로, 생화학무기 등 다른 유형의 대량살상무기는 이 정의에 포함되지 않는 것으로 이해해야 한다','확산은 국가 간에 이루어지는 합법적인 무기 거래 전반을 폭넓게 지칭하는 용어로서, 해당 거래가 국내법이나 국제적 의무를 위반하였는지 여부와는 무관하게 사용되는 개념인 것으로 이해해야 한다','확산이란 대량살상무기(Weapon Mass Destruction, WMD)의 제조, 획득, 보유, 개발, 수출, 환적, 중개, 운송, 이전, 비축 또는 사용 등(기술 및 이중용도제품 포함)에 대해, 국내법 및/또는 국제의무를 위반하는 것을 의미한다.','확산자금조달이라는 문제는 자금세탁방지 및 테러자금조달방지(AML/CFT) 논의와는 전혀 별개의 독립적인 국제법 영역에서 다루어지는 것으로, 서로 연계하여 논의될 실익이 없는 것으로 이해해야 한다'],2,
  '확산이란 대량살상무기(WMD)의 제조·획득·보유·개발·수출·환적·중개·운송·이전·비축·사용 등(기술 및 이중용도제품 포함)에 대해 국내법 및/또는 국제의무를 위반하는 것을 의미해요. AML/CFT에서 "확산"이라는 용어는 이러한 정의를 포함한 기술·제품·소프트웨어·서비스 또는 전문지식의 획득·공급·사용 등의 광의의 개념으로 사용돼요.','ultra'),
M('jd2_8',
  '확산자금조달(Proliferation Financing)의 특징에 대한 설명으로 옳지 않은 것은?',
  ['이익을 얻기 위해 권한이 없거나 바람직하지 않은 개인 및 기업이 인수·판매가 가능한 대량살상무기(WMD) 프로그램에 사용될 수 있다는 점이 우려사항이다.','확산에 사용되는 장치는 반드시 장거리 미사일과 같은 정교한 기술만을 포함하며, 비교적 단순하거나 조잡한 장치는 확산의 개념에서 제외된다.','대량살상무기확산은 세계 안보에 큰 위협이 되고 있으며, 민감한 재료·기술·서비스 및 전문지식에 대해 적절한 안전장치가 수립·유지·시행되지 않을 경우 위험이 커진다.','확산은 다양한 형태를 취할 수 있지만, 궁극적으로는 핵기술, 생물학무기 또는 화학무기와 관련된 프로그램에서 사용될 수 있는 기술, 제품, 소프트웨어, 서비스 또는 전문지식의 전달 또는 수출 및 정교한 기술을 말한다.'],1,
  '확산은 장거리 미사일과 같은 정교한 기술뿐만 아니라 "비교적 단순하거나 조잡한 장치"도 포함하는 개념이에요. "반드시 정교한 기술만을 포함하며 단순하거나 조잡한 장치는 제외된다"는 서술은 원문과 반대예요.','ultra'),
M('jd2_8',
  '<보기> 중 확산자금조달금지 제도상 "확산"의 정의에 포함되는 행위에 해당하지 않는 것을 모두 고른 것은?\nㄱ. 대량살상무기의 제조, 획득, 보유\nㄴ. 대량살상무기의 개발, 수출, 환적, 중개\nㄷ. 대량살상무기의 운송, 이전, 비축 또는 사용\nㄹ. 국내법과 국제의무를 모두 준수하며 이루어지는 민간 항공기의 정상적인 국제 운항',
  ['ㄱ, ㄴ.','ㄱ, ㄴ, ㄷ.','ㄷ, ㄹ.','ㄹ만.'],3,
  '확산의 정의는 대량살상무기의 제조·획득·보유·개발·수출·환적·중개·운송·이전·비축·사용 등이 "국내법 및/또는 국제의무를 위반"하는 경우를 의미해요. ㄹ(국내법·국제의무를 모두 준수하는 민간 항공기의 정상적인 국제 운항)은 위반 요소가 없는 적법한 행위로, 확산의 정의에 해당하지 않아요.','ultra'),
M('jd1_3',
  'FATF 40 권고사항 중 권고사항 7(확산금융 관련 정밀금융제재, targeted financial sanction)에 대한 설명으로 옳지 않은 것은?',
  ['이 결의안에 따라 각국은 유엔 헌장 제7장에 의거하여 유엔 안보리가 또는 그 권한에 의하여 지정한 그 어떠한 개인이나 단체(entity)의 자금 혹은 기타 자산을 지체 없이 동결하여야 한다.','각국은 대량살상무기확산과 이에 대한 자금조달을 방지, 억제 및 차단(disruption)하는 유엔안보리결의안을 이행하기 위하여 정밀화된 금융제재를 이행하여야 한다.','유엔안보리결의안(UNSCR) 2094호와 연관되며, UNSCR의 결정은 비군사적 제재인 경우 모든 회원국가에게 법적 구속력을 갖고 있다.','권고사항 7에 따른 정밀금융제재는 지정된 개인이나 단체의 이익을 위해서라면 자금이나 기타 자산이 직간접적으로 제공되는 것이 허용된다.'],3,
  '권고사항 7은 지정된 개인이나 단체에게 혹은 이들의 이익(benefit)을 위해 그 어떠한 자금이나 기타 자산이 직간접적으로 "제공되지 않도록" 하여야 한다고 규정해요. "제공되는 것이 허용된다"는 서술은 원문과 정반대예요.','ultra'),
M('jd2_8',
  '테러자금금지법에 확산금융 이슈를 반영한 배경에 대한 설명으로 옳지 않은 것은?',
  ['제정 당시 WMD 확산행위자의 금융행위에 대한 정밀금융제재를 시행할 수 있는 입법이 부재하였다.','외국환거래법 및 고시를 통해 WMD 확산행위자의 외환거래에 한해서는 사전허가제 운영이 가능하였다.','테러자금금지법 제정 당시부터 WMD 확산행위에 대한 정밀금융제재가 이미 완비되어 있었으므로 별도의 반영이 필요 없었다.','당시 테러자금금지법은 테러자금조달방지를 목적으로 하고 있어, WMD 확산행위는 규제 범위에 없었다.'],2,
  '테러자금금지법 제정 당시에는 WMD 확산행위자의 금융행위에 대한 정밀금융제재를 시행할 수 있는 입법이 "부재"하였고, 당시 법은 테러자금조달방지 목적에 한정되어 WMD 확산행위는 규제 범위에 없었어요. 이후 확산금융 이슈가 반영되었으므로 "제정 당시부터 이미 완비되어 있었다"는 서술은 옳지 않아요.','ultra'),
M('jd2_8',
  '확산자금 관련 테러자금금지법의 주요 특징에 해당하지 않는 것은?',
  ['금융거래제한대상자의 지정.','금융거래제한대상자의 금융거래등에 대한 금융위원회의 허가.','금융거래등의 확대 및 사전동결제도(동결리스트를 설정하고 허가를 받게 하는 방식), 순사기관 신고의무와 의심거래보고 의무, 누설금지 등.','확산자금조달과 관련된 모든 규제 권한은 오직 국세청장에게만 부여되어 있다.'],3,
  '확산자금 관련 테러자금금지법의 주요 특징은 금융거래제한대상자 지정, 금융위원회의 허가, 사전동결제도, 수사기관 신고의무·의심거래보고의무·누설금지 등이에요. "규제 권한이 오직 국세청장에게만 부여"된다는 서술은 원문에 없는 내용이에요.','ultra'),
M('jd2_8',
  '확산자금 관련 테러자금금지법의 주요내용에 대한 설명으로 옳지 않은 것은?',
  ['확산자금조달로 이용된다는 사실을 알면서 자금 또는 재산을 모집, 제공하거나 이를 운반·보관한 자와 이를 강요하거나 권유한 자에 대해 처벌한다.','확산자금조달로 의심되는 금융거래는 FIU에 보고해야 한다.','확산자금조달로 의심되는 금융거래는 어떠한 기관에도 보고할 의무가 없다.','금융위원회는 확산자금조달 등과 관련된 자를 금융거래제한대상자로 지정해야 한다.'],2,
  '확산자금조달로 의심되는 금융거래는 "FIU에 보고해야" 해요. "어떠한 기관에도 보고할 의무가 없다"는 서술은 원문과 정반대예요.','ultra'),
M('jd2_8',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF 권고사항 7은 확산금융 관련 정밀금융제재(targeted financial sanction)를 규정한다.\nㄴ. UNSCR 2094호는 확산금융과 관련되나 각국이 자율적으로 선택할 수 있는 권고적 효력만을 가질 뿐 법적 구속력은 없다.\nㄷ. 테러자금금지법 제정 당시 WMD 확산행위자에 대한 정밀금융제재 입법이 부재하여 이후 확산금융 이슈가 반영되었다.\nㄹ. 확산자금조달로 의심되는 금융거래는 FIU에 보고해야 하며, 금융위원회는 관련자를 금융거래제한대상자로 지정한다.',
  ['1개.','2개.','3개.','4개.'],2,
  'ㄱ, ㄷ, ㄹ은 옳은 설명이에요. UNSCR 2094호와 같은 유엔헌장 제7장에 의거한 안보리결의는 권고적 효력이 아니라 모든 회원국에 대해 법적 구속력을 가져요(ㄴ은 옳지 않아요).','ultra'),
M('jd2_7b',
  '특정금융정보법 제9조(외국환거래자료 등의 통보)에 대한 설명으로 옳지 않은 것은?',
  ['한국은행 총재, 세관의 장, 그 밖에 대통령령으로 정하는 자는 「외국환거래법」 제17조에 따라 신고와 관련된 자료와 같은 법 제21조에 따른 통보에 관련된 자료를 금융정보분석원장에게 통보하여야 한다.','한국은행 총재, 세관의 장, 그 밖에 대통령령으로 정하는 자는 외국환거래 관련 자료를 금융정보분석원장이 아니라 국세청장에게 통보하여야 하는 법적 의무를 부담한다','제1항에 따른 통보 대상 자료의 범위 및 통보 절차 등에 관하여 필요한 사항은 대통령령으로 정한다.','이 조항은 외국환거래 관련 자료를 금융정보분석원과 공유하도록 하는 근거 규정에 해당한다.'],1,
  '특정금융정보법 제9조는 한국은행 총재·세관의 장 등이 외국환거래 관련 자료를 금융정보분석원장에게 통보하도록 규정해요. "국세청장에게 통보해야 한다"는 서술은 통보 대상 기관이 잘못되어 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조(수사기관 등에 대한 정보 제공)에서 금융정보분석원장이 특정금융거래정보를 제공할 수 있는 대상 기관에 해당하지 않는 것은?',
  ['금융위원회 또는 국가정보원장.','전국의 모든 개별 초·중·고등학교장.','고위공직자범죄수사처장, 국세청장, 관세청장, 중앙선거관리위원회.','검찰총장, 행정안전부장관, 지방자치단체의 장(정보 제공이 필요한 경우에 한정).'],1,
  '제10조 제1항이 규정하는 정보 제공 대상 기관은 검찰총장, 행정안전부장관, 지방자치단체의 장(필요한 경우 한정), 고위공직자범죄수사처장, 국세청장, 관세청장, 중앙선거관리위원회, 금융위원회, 국가정보원장 등이에요. "전국의 모든 개별 초·중·고등학교장"은 이 조항이 규정하는 정보 제공 대상이 아니에요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조에 따라 금융정보분석원장이 특정형사사건의 수사등을 위해 정보를 제공할 수 있는 업무 범위에 해당하지 않는 것은?',
  ['불법재산, 자금세탁행위 또는 공중협박자금조달행위와 관련된 형사사건의 수사, 조세탈루 확인을 위한 조사업무, 조세체납자에 대한 징수업무.','금융회사등의 신규 지점 개설 인허가 심사 업무.','관세범칙사건 조사, 관세체납자에 대한 징수업무 및 관세형사범죄 확인을 위한 조사업무, 정치자금법 위반사건의 조사.','금융감독업무 또는 테러위험인물에 대한 조사업무.'],1,
  '제10조가 규정하는 "특정형사사건의 수사등"에는 불법재산·자금세탁·공중협박자금조달 관련 형사사건 수사, 조세탈루·체납 관련 업무, 관세범칙·체납 관련 업무, 정치자금법 위반사건 조사, 금융감독업무, 테러위험인물 조사업무가 포함돼요. "금융회사등의 신규 지점 개설 인허가 심사 업무"는 이 조항이 규정하는 정보 제공 목적 업무가 아니에요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제1항에서 금융정보분석원장이 검찰총장 등에게 제공할 수 있는 정보에 해당하지 않는 것은?',
  ['금융회사등의 임직원 개인의 인사평가 기록 및 급여명세.','제4조 제1항 또는 제4조의2에 따라 금융회사등이 보고한 정보 중 특정형사사건의 수사등과의 관련성을 고려하여 대통령령으로 정하는 정보.','제11조 제1항에 따라 외국금융정보분석기구로부터 제공받은 정보 중 특정형사사건의 수사등과의 관련성을 고려하여 대통령령으로 정하는 정보.','제1호 및 제2호의 정보 또는 제4조의2 및 제9조에 따라 보고·통보받은 정보를 정리하거나 분석한 정보.'],0,
  '제10조 제1항이 규정하는 제공 가능 정보는 금융회사등이 보고한 정보(STR·CTR), 외국금융정보분석기구로부터 제공받은 정보, 이들을 정리·분석한 정보 등이에요. "금융회사등 임직원 개인의 인사평가 기록 및 급여명세"는 이 조항이 규정하는 정보 범위가 아니에요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제10조 제2항에 대한 설명으로 가장 옳은 것은?',
  ['경찰청장과 해양경찰청장은 제10조 제1항에 규정된 기관에 해당하지 않으므로, 제2항이 아니라 오직 별도의 개별 법률 제정을 통해서만 특정금융거래정보를 제공받을 수 있는 것으로 정해져 있다','금융정보분석원장은 불법재산, 자금세탁행위 또는 공중협박자금조달행위와 관련된 형사사건의 수사에 필요하다고 인정되는 경우에는 대통령령으로 정하는 특정금융거래정보를 경찰청장, 해양경찰청장에게 제공한다.','제10조 제2항은 제1항과 완전히 동일한 대상 기관(검찰총장, 국세청장 등)을 규정하고 있어 조문을 별도로 구분해 둘 실익이 없는 중복 규정에 해당한다','경찰청장에 대한 정보 제공은 형사사건 전반이 아니라 조세 관련 사건에 한정하여 이루어지는 것으로 정해져 있다'],1,
  '특정금융정보법 제10조 제2항은 금융정보분석원장이 불법재산·자금세탁행위·공중협박자금조달행위와 관련된 형사사건의 수사에 필요하다고 인정되는 경우 대통령령으로 정하는 특정금융거래정보를 경찰청장·해양경찰청장에게 제공하도록 정한 조항으로, 제1항의 검찰총장·국세청장 등과는 별도의 대상 기관을 규정해요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 특정금융정보법 제9조는 한국은행 총재·세관의 장 등이 외국환거래 관련 자료를 FIU에 통보하도록 규정한다.\nㄴ. 제10조 제1항은 검찰총장, 국세청장, 관세청장, 국가정보원장 등에 대한 특정금융거래정보 제공 근거를 규정한다.\nㄷ. 제10조 제2항은 경찰청장·해양경찰청장에 대한 별도의 정보 제공 근거를 규정한다.\nㄹ. 제10조가 규정하는 정보 제공 목적에는 정치자금법 위반사건 조사와 테러위험인물 조사업무가 포함된다.',
  ['4개.','3개.','2개.','1개.'],0,
  'ㄱ~ㄹ 모두 옳은 설명이에요. 제9조·제10조 제1항·제2항이 정하는 통보·정보제공 대상 기관과 정보 제공 목적(정치자금법 위반, 테러위험인물 조사 포함)을 정확히 이해해야 풀리는 문제예요.','ultra'),
M('jd2_7b',
  '특정금융정보법상 고액현금거래보고(CTR) 정보의 통보 유예 사유에 해당하지 않는 것은?',
  ['해당 통보가 사람의 생명이나 신체의 안전을 위협할 우려가 있는 경우.','해당 통보 대상자가 단순히 외국인이라는 사유만 있는 경우.','해당 통보가 증거인멸, 증인 위협 등 공정한 사법절차의 진행을 방해할 우려가 명백한 경우.','해당 통보가 질문·조사 등 행정절차의 진행을 방해하거나 과도하게 지연시킬 우려가 명백한 경우.'],1,
  '통보 유예 사유는 ①생명·신체 안전 위협 우려 ②증거인멸·증인 위협 등 사법절차 방해 우려 ③행정절차 방해·과도한 지연 우려 3가지예요. "통보 대상자가 단순히 외국인이라는 사유"는 통보 유예 사유로 규정되어 있지 않아요.','ultra'),
M('jd2_7b',
  '금융정보분석원장의 통보 유예 절차에 대한 설명으로 옳지 않은 것은?',
  ['금융정보분석원장은 검찰총장등이 유예 사유가 지속되고 있음을 제시하고 통보의 유예를 서면으로 반복하여 요청하는 경우, 요청받은 날부터 2회에 한정하여(생명·신체 안전 위협 우려의 경우는 제외) 매 1회 3개월의 범위에서 유예기간 동안 통보를 유예하여야 한다.','금융정보분석원장은 명의인에게 통보하기 위하여 필요한 경우 관계 행정기관등의 장에게 이용 목적을 분명하게 밝힌 문서로 주민등록전산정보자료, 사업장 소재지 등 사업자에 관한 기본사항의 제공을 요청할 수 있다.','통보 유예 요청은 서면이 아니라 구두로도 가능하며, 재요청 횟수에는 별도의 제한이 없다','금융정보분석원장은 검찰총장등으로부터 일정한 사유로 통보의 유예를 서면으로 요청받은 경우에는 6개월의 범위에서 통보를 유예하여야 한다.'],2,
  '통보 유예 재요청은 반드시 서면으로 이루어져야 하며 2회에 한정해 매 1회 3개월 범위에서만 가능해요. "구두로도 가능하며 재요청 횟수에 제한이 없다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조(금융거래정보의 비밀보장 등)에서 특정금융거래정보를 다른 사람에게 제공·누설하거나 목적 외의 용도로 사용해서는 안 되는 자에 해당하지 않는 것은?',
  ['금융정보분석원 소속 공무원.','금융정보분석원의 전산시스템(특정금융거래정보의 처리를 위한 전산시스템) 관리자 및 해당 전산시스템 관리업무 수행자.','중계기관에 종사하는 사람, 수취 금융회사에 종사하는 사람.','법률에 명시적으로 열거된 자(금융정보분석원 소속 공무원, 전산시스템 관리자 등)에 한하여 규정이 적용되며, 특정금융거래정보와 관련 없는 일반 국민 개개인은 애초에 이 조항의 규율 대상이 아니다'],3,
  '제12조는 금융정보분석원 소속 공무원, 전산시스템 관리자, 중계기관·수취금융회사 종사자 등 법률에 명시적으로 열거된 자를 규율 대상으로 해요. "특정금융거래정보와 전혀 무관한 일반 국민 개개인 모두"는 이 조항이 열거하는 대상에 해당하지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조에 대한 설명으로 옳지 않은 것은?',
  ['누구든지 제1항 각 호의 어느 하나에 해당하는 자에게 특정금융거래정보 등을 제공할 것을 요구하거나 목적 외의 다른 용도로 사용할 것을 요구해서는 아니 된다.','제10조에 따라 제공된 특정금융거래정보는 형사재판뿐 아니라 민사·행정재판에서도 특별한 제한 없이 증거로 사용될 수 있다','제4조 제1항에 따른 보고에 관여한 금융회사등의 종사자는 제16조 및 제17조와 관련된 재판을 제외하고는 그 보고와 관련된 사항에 관하여 증언을 거부할 수 있다. 다만 중대한 공익상의 필요가 있는 경우에는 그러하지 아니하다.','제10조에 따라 제공된 특정금융거래정보는 재판에서 증거로 할 수 없다.'],1,
  '특정금융정보법상 제10조에 따라 제공된 정보는 원칙적으로 재판에서 증거로 할 수 없어요. "형사·민사·행정재판을 불문하고 아무런 제한 없이 자유롭게 증거로 사용될 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조 제4항의 증언거부권에 대한 설명으로 가장 옳은 것은?',
  ['STR 보고에 관여한 금융회사등의 종사자는, 어떠한 재판 절차가 진행되든 관계없이 예외 없이 항상 증언을 거부할 권리를 갖는 것으로 이해해야 한다','이 조항이 규정하는 증언거부권은, STR 보고와 직접적인 관련이 없는 그 밖의 모든 사항에 대해서도 폭넓게 인정되는 것으로 이해해야 한다','제4조 제1항에 따른 보고(STR)에 관여한 금융회사등의 종사자는 제16조 및 제17조와 관련된 재판을 제외하고는 그 보고와 관련된 사항에 관하여 증언을 거부할 수 있으나, 중대한 공익상의 필요가 있는 경우에는 증언을 거부할 수 없다.','이 조항에 따른 증언거부권은 오직 금융회사의 대표이사에게만 인정되는 권리로서, 일반 직원에게는 이러한 권리가 전혀 인정되지 않는 것으로 이해해야 한다'],2,
  'STR 보고에 관여한 금융회사등의 종사자는 제16조·제17조 관련 재판을 제외하고는 그 보고와 관련된 사항에 대해 증언을 거부할 수 있는 권리가 있지만, "중대한 공익상의 필요가 있는 경우"에는 이 증언거부권이 제한돼요.','ultra'),
M('jd2_7b',
  '특정금융정보법 제12조의2(특정금융거래정보 등의 보존 및 폐기)에 대한 설명으로 가장 옳은 것은?',
  ['특정금융거래정보의 보존기간은 대통령령이 아니라 각 금융정보분석원 직원이 담당 업무의 특성에 따라 개인적으로 재량껏 정할 수 있는 것으로 규정되어 있다','특정금융거래정보는 수집과 동시에 즉시 폐기하여야 하며, 이 법상 정보등을 일정 기간 보존하는 절차 자체가 원천적으로 허용되지 않는 것으로 규정되어 있다','금융정보분석원장은 특정금융거래정보를 어떠한 기간의 제한도 두지 않고 영구적으로 보존해야 하며, 이후 어떠한 사유로도 폐기할 수 없는 것으로 규정되어 있다','금융정보분석원장은 특정금융거래정보(제5조의3, 제9조, 제13조, 제15조 제7항에 따라 제공받거나 통보받은 정보 또는 자료)를 다른 법령에도 불구하고 대통령령으로 정하는 바에 따라 기간을 정하여 보존하여야 한다.'],3,
