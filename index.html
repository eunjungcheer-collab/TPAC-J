  ['금융기관 또는 특정 비금융사업자·전문직이 비밀 혹은 기밀유지의 법적 의무가 있다는 이유로 사법공조 요청을 거부하여서는 안 되나, 변호사 특권 또는 비밀유지의무가 적용되는 경우는 예외로 한다','금융기관은 비밀유지 의무를 이유로 사법공조 요청을 예외 없이 항상 거부할 수 있으며, 어떠한 경우에도 협조할 필요가 없다','변호사 특권이나 비밀유지의무는 이 주석서상 사법공조 거부 제한의 예외 사유로 인정되지 않으며, 다른 비밀유지 의무와 완전히 동일하게 취급된다','특정 비금융사업자·전문직은 비밀유지 의무와 무관하게 사법공조와는 애초에 관련이 없는 주체로 이해해야 한다'],0,
  '금융기관·DNFBP는 비밀·기밀유지 의무를 이유로 사법공조 요청을 거부할 수 없지만, 변호사 특권 또는 비밀유지의무가 적용되는 경우는 예외로 인정돼요.','ultra'),
M('jd1_3',
  'FATF 권고사항 37(국제사법공조) 주석서 (e)항에 따른 요청 국가의 기밀유지 의무에 대한 설명으로 가장 옳은 것은?',
  ['수사 또는 조사의 투명성을 보호하기 위하여 의뢰 받은 사법공조 요청과 해당 내용에 대한 기밀을 자국법의 근본적인 원칙에 의거하여 유지하여야 하며, 요청 국가가 자국이 기밀유지 의무를 지킬 수 없는 경우 공조를 요청한 국가에 이를 즉시 알려야 한다','사법공조 요청의 기밀유지 여부는 각국의 재량에 전적으로 맡겨져 있어, 이와 관련해 상대국에 대해 부담하는 어떠한 통지 의무도 존재하지 않는 것으로 이해해야 한다','요청 국가가 기밀을 유지할 수 없는 사정이 발생하더라도, 공조를 요청한 국가에 이러한 사실을 알릴 법적 의무는 전혀 부담하지 않는 것으로 이해해야 한다','사법공조 요청의 기밀유지라는 절차는 수사·조사의 투명성 확보와는 전혀 무관한, 단순히 형식적인 행정 절차에 불과한 것으로 이해해야 한다'],0,
  '요청 국가는 수사·조사의 투명성 보호를 위해 사법공조 요청과 내용의 기밀을 자국법의 근본원칙에 따라 유지해야 하며, 기밀을 유지할 수 없는 경우에는 공조를 요청한 국가에 즉시 알려야 해요.','ultra'),
M('jd1_3',
  'FATF 권고사항 38 평가방법론 38.1에 따라 외국이 확인·동결·압수·몰수를 요청할 수 있는 대상에 해당하지 않는 것은?',
  ['자금세탁·전제범죄·테러자금조달로 세탁된 재산, 자금세탁·전제범죄·테러자금조달의 수익','자금세탁·전제범죄·테러자금조달 범죄에 사용된 수단, 자금세탁·전제범죄·테러자금조달 범죄사용으로 계획된 수단','위 각 재산에 상당하는 가치가 있는 재산','범죄와 전혀 무관한 것으로 확인된 제3자 소유의 일반 생활용품'],3,
  '38.1은 자금세탁·전제범죄·테러자금조달로 세탁된 재산, 그 수익, 범죄에 사용됐거나 사용 계획된 수단, 이에 상당하는 가치의 재산에 대한 확인·동결·압수·몰수 요청에 신속히 대응할 권한당국 보유를 요구해요. "범죄와 무관한 제3자 소유 일반 생활용품"은 이에 해당하지 않아요.','ultra'),
M('jd1_3',
  'FATF 권고사항 38 평가방법론 38.2에 따른 유죄판결 없는 몰수제도(독립몰수제)에 대한 설명으로 가장 옳은 것은?',
  ['각국은 자국법의 근본원칙에 위배되지 않는 한, 최소한 사망·도피·부재 등의 이유로 범죄인이 법정 출소 요구에 응할 수 없거나 범죄인의 신원을 확인할 수 없는 경우, 유죄판결 없는 몰수제도(독립몰수제) 및 관련 잠정조치에 기반한 협력 요청에 공조를 제공하는 당국을 마련한다','유죄판결 없는 몰수제도는 그 성격상 어떠한 경우에도 국제사법공조의 대상이 될 수 없는 것으로 이해해야 하며, 이는 각국의 자국법 원칙과 무관한 절대적 제한이다','범죄인의 사망이나 도피와 같은 사정은, 몰수 관련 국제협력을 판단하는 것과는 전혀 무관한 고려 요소로 이해해야 한다','독립몰수제에 기반한 협력 요청은 자국법의 근본원칙과 상충하는지 여부와는 관계없이, 예외 없이 모두 수용해야 하는 것으로 이해해야 한다'],0,
  '각국은 자국법 근본원칙에 위배되지 않는 한, 범죄인이 사망·도피·부재 등으로 법정에 출석할 수 없거나 신원 확인이 불가능한 경우, 독립몰수제 및 관련 잠정조치에 기반한 협력 요청에 공조를 제공할 당국을 마련해야 해요.','ultra'),

function stableHash(str){
  // 문제 내용을 기반으로 한 안정적인 해시(문제 순서가 바뀌어도 같은 문제는 항상 같은 ID를 가져요)
  let h1=0xdeadbeef^0, h2=0x41c6ce57^0;
  for(let i=0;i<str.length;i++){
    const ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
QUESTIONS.forEach((q)=>{q.id=(q.c||'x')+'_'+stableHash(q.q||q.a||'');});

(function dedupeIds(){
  const seen={};
  QUESTIONS.forEach((q)=>{

  });
})();

/* ============ 저장소: localStorage 기반 (다운로드한 파일에서도 동작) ============
   이 앱은 claude.ai에 게시하지 않고 다운로드해서 단독 파일로 써도 저장이 되도록
   브라우저 내장 localStorage를 사용해요. 같은 기기·같은 브라우저에서는 탭을 닫거나
   새로고침해도 기록이 유지되지만, 다른 기기나 다른 브라우저로 접속하면 기록이
   공유되지 않고 새로 시작돼요(각 브라우저가 자기 자신의 localStorage만 가짐).
   window.storage(원격 저장)를 쓰던 기존 코드와 최대한 동일한 함수 시그니처를
   유지해서, 이 아래 4개 함수만 바꾸면 나머지 코드는 그대로 동작하도록 했어요. */
const LS_PREFIX='amlquiz_je_';
function sget(key,retries=2){
  try{
    const raw=localStorage.getItem(LS_PREFIX+key);
    if(raw===null) return Promise.resolve({value:null, failed:false});
    return Promise.resolve({value:JSON.parse(raw), failed:false});
  }catch(e){
    return Promise.resolve({value:null, failed:false}); // 손상된 데이터 등 → 빈 값으로 간주하고 진행
  }
}
/* 이름 자동 기억: 한 번 입력하면 화면을 오가거나(뒤로가기) 새로고침해도 다시 입력하지 않도록
   localStorage에 저장해요. 실패해도 화면 진행에는 영향을 주지 않도록 조용히 무시해요. */
async function saveNameToStorage(name){
  try{
    localStorage.setItem(LS_PREFIX+NAME_KEY, JSON.stringify({name}));
  }catch(e){/* 이름 기억 실패는 조용히 무시 - 시험 진행에 지장 없음 */}
}
async function loadNameFromStorage(){
  try{
    const raw=localStorage.getItem(LS_PREFIX+NAME_KEY);
    if(raw){const d=JSON.parse(raw); return d.name||'';}
  }catch(e){/* 저장된 이름이 없으면 빈 값으로 진행 */}
  return '';
}
function sset(key,val,retries=4){
  try{
    localStorage.setItem(LS_PREFIX+key, JSON.stringify(val));
    return Promise.resolve({ok:true});
  }catch(e){
    // 저장공간 초과 등으로 실패한 경우
    return Promise.resolve({ok:false});
  }
}
/* 학생별/전체 데이터를 각각 하나의 키로 묶어 저장 왕복 횟수를 최소화.
   반환값은 {data, failed} 형태예요. failed가 true이면 data는 신뢰할 수 없는
   기본값이므로, 호출하는 쪽에서 이 값으로 저장(덮어쓰기)하면 안 돼요. */
async function getStudentData(name){
  const {value:d, failed}=await sget('student_'+APP_KEY+'_'+safeName(name));
  const data=d||{profile:{points:0,level:1,coupons:0},wrong:[],examLogs:[]};
  if(!data.examLogs) data.examLogs=[];
  if(!data.wrong) data.wrong=[];
  if(!data.profile) data.profile={points:0,level:1,coupons:0};
  if(!data.answeredIds) data.answeredIds=[]; // 랜덤 뽑기에서 중복 출제를 피하기 위해, 지금까지 실제로 답을 제출했던 문제 id를 모두 모아둬요.
  if(data.inProgress===undefined) data.inProgress=null; // 중간에 저장해 둔 '이어서 풀기'용 시험 진행 상태(한 명당 최대 1개).
  return {data, failed};
}
const MAX_EXAM_LOGS=40; // 학생별 시험 기록(오답노트)은 최근 40회까지 보관해요.

/* ============ HELPERS ============ */
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickByCats(cats){
  if(!cats||cats.length===0) return QUESTIONS.slice();
  return QUESTIONS.filter(q=>cats.includes(q.c));
}
/* 범위(카테고리) 선택에 이어 난이도(중/상/전체)까지 함께 걸러서 문제 풀(pool)을 만들어요. */
function pickPool(cats,diff){
  let pool=pickByCats(cats);
  if(diff && diff!=='all') pool=pool.filter(q=>(q.d||'mid')===diff);
  return pool;
}
function catName(id){const c=CATS.find(x=>x.id===id);return c?c.name:id;}
function questionById(id){return QUESTIONS.find(q=>q.id===id);}
/* 저장에는 {id, your}만 있으므로, 화면에 보여줄 때 QUESTIONS에서 문제/정답/해설을 다시 찾아 채워요. */
function wrongDisplayInfo(w){
  const q=questionById(w.id);
  if(!q) return {q:'(삭제되었거나 찾을 수 없는 문제예요)',your:w.your||'-',correct:'-',explain:'',cat:''};
  return {q:q.q, your:(w.your===null||w.your===undefined||w.your==='')?'(제출 안함)':w.your,
    correct:q.t==='mcq'?q.o[q.a]:q.a, explain:q.e, cat:q.c};
}
function fmtDate(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDT(ts){const d=new Date(ts);return fmtDate(ts)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function monthKey(ts){const d=new Date(ts);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월';}

/* ============ MODAL (alert/confirm이 샌드박스에서 막혀 있어 대체) ============ */
function showAlert(msg){
  return new Promise(resolve=>{
    const ov=document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent=msg;
    document.getElementById('modalBtns').innerHTML=`<button class="btn btn-primary" id="modalOkBtn">확인</button>`;
    ov.classList.remove('hidden');
    document.getElementById('modalOkBtn').onclick=()=>{ov.classList.add('hidden');resolve(true);};
  });
}
function showConfirm(msg){
  return new Promise(resolve=>{
    const ov=document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent=msg;
    document.getElementById('modalBtns').innerHTML=`<button class="btn btn-ghost" id="modalCancelBtn">취소</button><button class="btn btn-primary" id="modalOkBtn">확인</button>`;
    ov.classList.remove('hidden');
    document.getElementById('modalOkBtn').onclick=()=>{ov.classList.add('hidden');resolve(true);};
    document.getElementById('modalCancelBtn').onclick=()=>{ov.classList.add('hidden');resolve(false);};
  });
}
/* 버튼이 3개 이상 필요한 선택 팝업(예: 저장하고 나가기 / 지금 채점 / 계속 풀기)에 사용해요. */
function showChoice(msg,options){
  return new Promise(resolve=>{
    const ov=document.getElementById('modalOverlay');
    document.getElementById('modalMsg').textContent=msg;
    const btnsEl=document.getElementById('modalBtns');
    btnsEl.style.flexDirection='column';
    btnsEl.innerHTML=options.map(o=>`<button class="btn ${o.cls||'btn-ghost'}" data-key="${o.key}">${o.label}</button>`).join('');
    ov.classList.remove('hidden');
    options.forEach(o=>{
      document.querySelector(`#modalBtns [data-key="${o.key}"]`).onclick=()=>{ov.classList.add('hidden');btnsEl.style.flexDirection='';resolve(o.key);};
    });
  });
}

function startQuiz(mode){
  const nameEl=document.getElementById('nameInput');
  state.name=(nameEl?nameEl.value:state.name).trim();

  saveNameToStorage(state.name);
  state.mode=mode||state.mode;
  const pool=pickPool(state.cats,state.diff);
  let list;
  if(state.mode==='wrong'){
    loadWrongPoolAndStart();
    return;
  } else if(state.mode==='mission'){
    list=shuffle(pool).slice(0,8);
  } else {
    list=state.order==='shuffle'?shuffle(pool):pool.slice();
  }

}

/* 전범위(또는 선택 범위) 안에서 무작위로 N문제를 뽑아 바로 시작해요.
   문제 수가 N보다 적으면 있는 만큼만 뽑아요.
   이미 이 이름으로 예전에 답을 제출했던 문제(sd.answeredIds)는 가능한 한 제외하고 뽑아서,
   랜덤 뽑기를 여러 번 해도 문제가 겹치지 않도록 해요. 안 푼 문제가 부족하면 그만큼만 뽑고 안내해요. */
async function startRandomDraw(n){
  const nameEl=document.getElementById('nameInput');
  state.name=(nameEl?nameEl.value:state.name).trim();
  if(!state.name){showAlert('이름을 입력해 주세요!');return;}
  if(!safeName(state.name)){showAlert('이름에 특수문자나 공백만 있으면 기록이 저장되지 않아요. 다른 이름으로 입력해 주세요!');return;}
  saveNameToStorage(state.name);
  state.mode='full';
  const pool=pickPool(state.cats,state.diff);
  showLoading('문제를 준비하고 있어요...');
  const {data:sd, failed}=await getStudentData(state.name);
  hideLoading();
  let usablePool=pool;
  let note='';
  if(!failed && sd.answeredIds && sd.answeredIds.length>0){
    const answeredSet=new Set(sd.answeredIds);
    const fresh=pool.filter(q=>!answeredSet.has(q.id));
    if(fresh.length>=n){
      usablePool=fresh;
    } else if(fresh.length>0){
      usablePool=fresh;
      note=`아직 안 풀어본 문제가 ${fresh.length}문제뿐이라 ${fresh.length}문제만 뽑았어요. (이미 풀었던 문제는 제외하고 뽑았어요)`;
    } else {
      usablePool=pool;
      note='선택한 범위의 문제를 이미 모두 풀어봤어요! 그래서 이번엔 전체 범위에서 다시 무작위로 뽑았어요.';
    }
  }
  const list=shuffle(usablePool).slice(0,n);
  if(list.length===0){showAlert('선택한 범위에 문제가 없어요. 범위를 다시 확인해 주세요.');return;}
  if(note) await showAlert(note);
  beginList(list);
}

/* 오답 모드: 이 학생의 실제 오답 기록만 정확히 불러와서 사용 (중복 채우기 없음 → 엉뚱한 문제가 섞이지 않음)
   - '최근 시험 오답만': 가장 최근에 제출한 시험(examLogs의 마지막 기록)에서 틀린 문제만
   - '전체 누적 오답': 지금까지 본 모든 시험 기록(examLogs)과 현재 미해결 오답(sd.wrong)을 합쳐서
     한 번이라도 틀렸던(그리고 아직 확실히 정리 안 된) 문제를 모두 포함 → 로그인/기기를 바꿔도,
     시간이 지나도 항상 똑같이 반영돼요. */
async function fetchCloudWrongData(name){
  /* 구글시트에 기록된 이 학생의 모든 응시 회차(다른 기기 포함)를 가져와,
     시간순으로 마지막 결과가 정답이면 오답 목록에서 빼는 방식으로
     '지금 시점 기준 진짜 오답'만 골라내요. GAS_URL이 없거나 네트워크에
     실패하면 조용히 빈 결과를 돌려주고, 로컬 기록만으로 이어서 동작해요. */
  if(!GAS_URL) return {wrongList:[], sessions:[]};
  try{
    const res=await fetch(`${GAS_URL}?action=detail&name=${encodeURIComponent(name)}&app=${encodeURIComponent(APP_LABEL)}`);
    const json=await res.json();
    if(!json.ok || !json.sessions) return {wrongList:[], sessions:[]};
    const sessions=json.sessions;
    const byTimeAsc=sessions.slice().sort((a,b)=>new Date(a.ts)-new Date(b.ts));
    const wrongMap={};
    byTimeAsc.forEach(s=>{
      (s.detail||[]).forEach(d=>{
        if(d.ok===false) wrongMap[d.id]={id:d.id, your:d.your};
        else delete wrongMap[d.id];
      });
    });
    return {wrongList:Object.values(wrongMap), sessions};
  }catch(e){
    return {wrongList:[], sessions:[]};
  }
}
async function loadWrongPoolAndStart(){
  const {data:sd, failed}=await getStudentData(state.name);
  if(failed){
    await showAlert('오답 기록을 불러오지 못했어요. 브라우저 저장공간을 확인한 뒤 다시 시도해 주세요.');
    return;
  }
  showLoading('오답 기록을 불러오고 있어요...');
  const cloud=await fetchCloudWrongData(state.name);
  hideLoading();
  let wn=[];
  if(state.wrongScope==='recent'){
    const logs=sd.examLogs||[];
    const localLast=logs.length?logs[logs.length-1]:null;
    const cloudLast=cloud.sessions.length?cloud.sessions.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts))[0]:null;
    const localTs=localLast?localLast.ts:0;
    const cloudTs=cloudLast?new Date(cloudLast.ts).getTime():0;
    if(!localLast && !cloudLast){
      showAlert('아직 제출한 시험 기록이 없어요! 먼저 다른 모드로 시험을 한 번 봐 주세요.');
      return;
    }
    if(cloudTs>localTs){
      // 다른 기기에서 본 시험이 이 기기의 기록보다 더 최근이면 그쪽을 최근 시험으로 봐요.
      wn=(cloudLast.detail||[]).filter(d=>d.ok===false).map(d=>({id:d.id, your:d.your}));
    } else {
      wn=localLast.wrongList||[];
    }
    if(wn.length===0){showAlert('가장 최근 시험에서는 틀린 문제가 없었어요! 완벽했네요 🎉');return;}
  } else {
    // sd.wrong(현재 미해결 오답) + 모든 로컬 시험 기록의 오답 + 구글시트(다른 기기 포함)의 오답을 모두 합쳐요.
    const fromLogs=[];
    (sd.examLogs||[]).forEach(l=>{(l.wrongList||[]).forEach(w=>fromLogs.push(w));});
    wn=[...(sd.wrong||[]), ...fromLogs, ...cloud.wrongList];
    if(wn.length===0){
      if((sd.examLogs||[]).length===0 && cloud.sessions.length===0){
        showAlert('아직 본 시험이 없어요! 먼저 다른 모드로 시험을 한 번 봐 주세요.');
      } else {
        showAlert('지금까지 틀렸던 문제를 모두 맞혔어요! 완벽해요 🎉');
      }
      return;
    }
  }
  const ids=[...new Set(wn.map(w=>w.id))];
  let list=QUESTIONS.filter(q=>ids.includes(q.id));
  list=shuffle(list);
  beginList(list);
}

function beginList(list){
  state.list=list;
  state.idx=0;state.correct=0;state.wrong=[];state.answers={};
  state.startTime=Date.now();state.combo=0;state.maxCombo=0;state.setIdx=0;
  state.selected=null;state.submitted=false;state.giveUp=false;
  state.sheetSessionId=uid(); // 구글시트에 이번 시험 회차를 구분해 저장하기 위한 고유 id
  screen='quiz';
  render();
  window.scrollTo(0,0);
  startTimerForCurrent();
}

/* 문제를 하나 제출할 때마다(전체를 다 풀지 않아도) 호출되어, 지금까지의 진행 상황을
   구글시트로 보내요. mode:'no-cors'로 보내기 때문에 응답 내용은 읽을 수 없지만(요청은
   정상적으로 도착해요), 이 방식이 Apps Script 웹앱 배포와 가장 궁합이 좋아요.
   네트워크 실패나 GAS_URL 미설정 시에도 조용히 무시되어 시험 진행에는 전혀 지장이 없어요. */
function syncToGoogleSheet(){
  if(!GAS_URL) return;
  try{
    const detail=[];
    const wrongIds=[];
    let correctCount=0, answeredCount=0;
    Object.keys(state.answers).forEach(qid=>{
      const ok=state.answers[qid];
      answeredCount++;
      if(ok) correctCount++; else wrongIds.push(qid);
      const q=QUESTIONS.find(x=>x.id===qid);
      if(!q) return;
      const w=state.wrong.find(x=>x.id===qid);
      detail.push({
        id:qid, q:q.q,
        your: w ? w.your : (q.t==='mcq'?q.o[q.a]:q.a),
        correct: q.t==='mcq'?q.o[q.a]:q.a,
        ok
      });
    });
    const payload={
      app:APP_LABEL,
      sessionId:state.sheetSessionId,
      name:state.name,
      score: answeredCount>0?Math.round(correctCount/answeredCount*100):0,
      answered: answeredCount,
      total: state.list.length,
      wrongIds,
      detail
    };
    fetch(GAS_URL,{
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(payload)
    }).catch(()=>{});
  }catch(e){/* 구글시트 동기화 실패는 조용히 무시 - 로컬 저장에는 영향 없음 */}
}

/* ============ 이어서 풀기(일시정지/재개) ============
   시험 도중 '그만 풀래요'를 누르면 바로 채점하지 않고, 지금까지 푼 내용(문제 목록·순서,
   맞은 개수, 틀린 목록, 콤보 등)을 학생 이름으로 저장해 둘 수 있어요. 나중에 같은 이름으로
   다시 들어오면 이어서 풀 수 있고, 최종 점수는 끝까지 다 풀거나 '지금까지 푼 것만 채점하기'를
   선택했을 때만 매겨져요. 한 사람당 이어서 풀기 저장은 1개만 유지돼요(새로 저장하면 이전 것을 덮어써요). */
async function pauseAndExit(){
  showLoading('저장하고 있어요...');
  clearInterval(state.timerId);clearInterval(state.missionTimerId);clearInterval(state.lockTimerId);
  // 이미 답을 제출한 문제를 보고 있다가 멈춘 경우엔, 다음 문제부터 이어지도록 인덱스를 한 칸 넘겨요.
  let idxToSave=state.idx;
  if(state.submitted) idxToSave=state.idx+1;
  if(idxToSave>=state.list.length){
    // 사실상 마지막 문제까지 다 푼 상태 → 그냥 채점해요.
    hideLoading();
    finishQuiz();
    return;
  }
  const {data:sd, failed}=await getStudentData(state.name);
  if(failed){
    hideLoading();
    await showAlert('저장할 수 없었어요. 브라우저 저장공간을 확인한 뒤 다시 시도해 주세요.');
    return;
  }
  sd.inProgress={
    listIds: state.list.map(q=>q.id),
    idx: idxToSave,
    correct: state.correct,
    wrong: state.wrong,
    answers: state.answers,
    combo: state.combo,
    maxCombo: state.maxCombo,
    setIdx: state.setIdx,
    mode: state.mode,
    cats: state.cats,
    order: state.order,
    wrongScope: state.wrongScope,
    diff: state.diff,
    savedAt: Date.now()
  };
  const ok=await setStudentData(state.name,sd);
  hideLoading();
  if(!ok){
    await showAlert('저장에 실패했어요. 브라우저 저장공간을 확인한 뒤 다시 시도해 주세요.');
    return;
  }
  const nm=state.name;
  state=newSession();
  state.name=nm;
  state.hasResume=true;
  state.resumeInfo=sd.inProgress;
  screen='setup';
  render();
  await showAlert(`✅ ${idxToSave}/${sd.inProgress.listIds.length}문제까지 푼 내용을 저장했어요!\n다음에 "이어서 풀기" 버튼을 누르면 여기서부터 다시 시작할 수 있어요.`);
}

/* 저장된 '이어서 풀기' 기록이 있는지 이름 기준으로 확인해서 setup 화면 배너에 반영해요. */
async function refreshResumeStatus(){
  if(!state.name){state.hasResume=false;state.resumeInfo=null;if(screen==='setup')render();return;}
  const {data:sd, failed}=await getStudentData(state.name);
  if(failed || !sd.inProgress){state.hasResume=false;state.resumeInfo=null;}
  else {state.hasResume=true;state.resumeInfo=sd.inProgress;}
  if(screen==='setup') render();
}

/* 저장해 둔 문제 목록(id)을 실제 문제 데이터로 복원해서 그 지점부터 이어서 풀어요. */
async function resumeProgress(){
  if(!state.name){showAlert('이름을 입력해 주세요!');return;}
  showLoading('불러오는 중...');
  const {data:sd, failed}=await getStudentData(state.name);
  hideLoading();
  if(failed || !sd.inProgress){
    await showAlert('이어서 풀 수 있는 기록을 찾지 못했어요.');
    state.hasResume=false;state.resumeInfo=null;render();
    return;
  }
  const ip=sd.inProgress;
  const list=(ip.listIds||[]).map(id=>questionById(id)).filter(Boolean);
  if(list.length===0){
    await showAlert('저장된 문제를 더 이상 찾을 수 없어요. 새로 시작해 주세요.');
    sd.inProgress=null;await setStudentData(state.name,sd);
    state.hasResume=false;state.resumeInfo=null;render();
    return;
  }
  state.list=list;
  state.idx=Math.min(ip.idx||0,list.length-1);
  state.correct=ip.correct||0;
  state.wrong=ip.wrong||[];
  state.answers=ip.answers||{};
  state.combo=ip.combo||0;
  state.maxCombo=ip.maxCombo||0;
  state.setIdx=ip.setIdx||0;
  state.mode=ip.mode||'full';
  state.cats=ip.cats||[];
  state.order=ip.order||'seq';
  state.wrongScope=ip.wrongScope||'all';
  state.diff=ip.diff||'ultra';
  state.startTime=Date.now();
  state.selected=null;state.submitted=false;state.giveUp=false;
  screen='quiz';
  render();
  window.scrollTo(0,0);
  startTimerForCurrent();
}

/* 이어서 풀 수 있는 저장 기록이 있는데 새 시험을 시작하려는 경우, 그 기록이 사라진다는 걸 미리 알려줘요. */
async function confirmOverwriteResumeIfNeeded(){
  if(!state.hasResume) return true;
  const ok=await showConfirm('이어서 풀 수 있는 시험 기록이 있어요. 새로 시작하면 그 기록은 사라져요. 그래도 새로 시작할까요?');
  if(ok){
    const {data:sd}=await getStudentData(state.name);
    sd.inProgress=null;
    await setStudentData(state.name,sd);
    state.hasResume=false;state.resumeInfo=null;
  }
  return ok;
}

/* 그만 풀 때 '저장하고 나가기 / 지금까지 채점하기 / 계속 풀기' 중에서 고르게 해요. */
async function showExitChoice(){
  const opts=[];
  if(state.mode!=='mission'){
    opts.push({key:'pause',label:'⏸️ 저장하고 나중에 이어풀기',cls:'btn-primary'});
  }
  opts.push({key:'score',label:'📝 지금까지 푼 것만 채점하기',cls:'btn-ghost'});
  opts.push({key:'cancel',label:'🙅 계속 풀래요',cls:'btn-outline'});
  const choice=await showChoice('그만 풀까요? 원하는 방법을 골라 주세요.',opts);
  if(choice==='pause') await pauseAndExit();
  else if(choice==='score') giveUp();
}

/* ============ QUIZ SCREEN ============ */
function currentQ(){return state.list[state.idx];}

function renderQuiz(){
  const q=currentQ();
  if(!q) return renderResult();
  const total=state.list.length;
  const isMission=state.mode==='mission';
  const timeDisplay=isMission?state.missionTimeLeft:state.timeLeft;
  const timePct=isMission?Math.max(0,state.missionTimeLeft/300*100):Math.max(0,state.timeLeft/60*100);
  const submittedInfo=state.submitted?state.lastResult:null;
  const isLocked=state.mode==='deep' && !state.submitted && Date.now()<state.lockUntil;
  let choicesHtml='';
  if(q.t==='mcq'){
    choicesHtml=q.o.map((opt,i)=>{
      let cls='choice';
      if(state.submitted){
        if(i===q.a) cls+=' correct';
        else if(i===state.selected) cls+=' wrong';
      } else if(isLocked){
        cls+=' locked';
      } else if(state.selected===i){
        cls+=' sel';
      }
      return `<div class="${cls}" data-idx="${i}">${['①','②','③','④'][i]} ${opt}</div>`;
    }).join('');
  } else {
    choicesHtml=`<input type="text" class="kbdinput ${isLocked?'locked':''}" id="shortInput" placeholder="정답을 입력하세요" ${state.submitted||isLocked?'disabled':''} value="${state.selected||''}">`;
  }
  let feedback='';
  if(state.submitted){
    const ok=submittedInfo.ok;
    feedback=`<div class="explain-box ${ok?'right':''}"><b>${ok?'정답이에요! 🎉':'아쉬워요! 다시 확인해볼까요?'}</b>${q.e}</div>`;
  }
  return `
  <div class="card">
    <div class="tag">${catName(q.c)}</div>
    <div class="meta-row"><span>${state.idx+1} / ${total}</span><span>맞은 개수 ${state.correct}</span></div>
    <div class="meta-row"><span class="timer-text" style="font-weight:700;color:var(--leaf-dark);">⏱️ ${timeDisplay}${isMission?'초 남음(전체)':'초'}</span><span></span></div>
    <div class="timerbar-outer"><div class="timerbar-inner" style="width:${timePct}%;"></div></div>
    ${state.mode==='deep' && !state.submitted ? renderLockCountdown(isLocked) : ''}
    <div class="qtext">Q${state.idx+1}. ${q.q}</div>
    <div id="choicesWrap">${choicesHtml}</div>
    ${feedback}
    <div class="meta-row" style="margin-top:2px;"><span class="timer-text" style="font-weight:700;color:var(--leaf-dark);">⏱️ ${timeDisplay}${isMission?'초 남음(전체)':'초'}</span><span></span></div>
    <div class="timerbar-outer"><div class="timerbar-inner" style="width:${timePct}%;"></div></div>
    ${state.submitted?
      `<button class="btn btn-primary" id="nextBtn">${state.idx===total-1?'결과 보기':'다음 문제'}</button>`
      :`<button class="btn btn-primary" id="submitBtn">답안 제출</button>`}
    <div class="giveup" id="giveupBtn">🚪 그만 풀래요</div>
  </div>`;
}

function renderLockCountdown(isLocked){
  const remain=Math.max(1,Math.ceil((state.lockUntil-Date.now())/1000));
  if(isLocked){
    return `<div class="lock-countdown wait" id="lockCountdown"><div class="num">${remain}</div><div>🔒 문제를 꼼꼼히 읽어보세요! (초 후 선택 가능)</div></div>`;
  }
  return `<div class="lock-countdown go" id="lockCountdown"><div class="go-emoji">🔓</div><div>이제 보기를 선택할 수 있어요!</div></div>`;
}
/* 꼼꼼 정독 모드: 5초 동안 남은 시간을 숫자(5,4,3,2,1)로 문제 위에 크게 실시간으로 보여주고,
   0초가 되는 순간 선택지 4개의 색이 자동으로 채워지도록 200ms마다 갱신 */
function updateLockUI(){
  if(state.mode!=='deep' || state.submitted) return;
  const el=document.getElementById('lockCountdown');
  if(!el) return;
  const remain=Math.max(0,Math.ceil((state.lockUntil-Date.now())/1000));
  if(remain>0){
    el.className='lock-countdown wait';
    el.innerHTML=`<div class="num">${remain}</div><div>🔒 문제를 꼼꼼히 읽어보세요! (초 후 선택 가능)</div>`;
    document.querySelectorAll('.choice').forEach(c=>c.classList.add('locked'));
    const si=document.getElementById('shortInput');
    if(si){si.classList.add('locked');si.disabled=true;}
  } else {
    el.className='lock-countdown go';
    el.innerHTML=`<div class="go-emoji">🔓</div><div>이제 보기를 선택할 수 있어요!</div>`;
    document.querySelectorAll('.choice').forEach(c=>c.classList.remove('locked'));
    const si=document.getElementById('shortInput');
    if(si){si.classList.remove('locked');si.disabled=false;}
  }
}

function startTimerForCurrent(){
  clearInterval(state.timerId);clearInterval(state.missionTimerId);clearInterval(state.lockTimerId);
  state.timeLeft=60;
  if(state.mode==='deep'){
    state.lockUntil=Date.now()+5000;
    updateLockUI();
    state.lockTimerId=setInterval(()=>{
      updateLockUI();
      if(Date.now()>=state.lockUntil){clearInterval(state.lockTimerId);}
    },200);
  }
  if(state.mode==='mission'){
    if(!state.missionStarted){
      state.missionTimeLeft=300;state.missionStarted=true;
      state.missionTimerId=setInterval(()=>{
        state.missionTimeLeft--;
        if(state.missionTimeLeft<=0){clearInterval(state.missionTimerId);finishMissionByTime();return;}
        document.querySelectorAll('.timerbar-inner').forEach(bar=>{bar.style.width=Math.max(0,state.missionTimeLeft/300*100)+'%';});
        document.querySelectorAll('.timer-text').forEach(el=>{el.textContent='⏱️ '+state.missionTimeLeft+'초 남음(전체)';});
      },1000);
    }
    return;
  }
  state.timerId=setInterval(()=>{
    state.timeLeft--;
    if(state.timeLeft<=0){clearInterval(state.timerId);autoSubmitTimeout();return;}
    document.querySelectorAll('.timerbar-inner').forEach(bar=>{bar.style.width=Math.max(0,state.timeLeft/60*100)+'%';});
    document.querySelectorAll('.timer-text').forEach(el=>{el.textContent='⏱️ '+state.timeLeft+'초';});
  },1000);
}

function finishMissionByTime(){
  if(!state.submitted){handleSubmit(true);}
}

function autoSubmitTimeout(){
  if(!state.submitted){handleSubmit(true);}
}

function handleSubmit(timeout){
  clearInterval(state.timerId);
  const q=currentQ();
  let ok=false;
  if(timeout && state.selected==null){
    ok=false;
  } else if(q.t==='mcq'){
    ok=state.selected===q.a;
  } else {
    const val=(state.selected||'').toString().trim();
    ok=val.length>0 && val.replace(/\s/g,'')===q.a.replace(/\s/g,'');
  }
  state.submitted=true;
  state.lastResult={ok};
  state.answers[q.id]=ok;
  if(ok){
    state.correct++;state.combo++;state.maxCombo=Math.max(state.maxCombo,state.combo);
    if([3,5,10].includes(state.combo)) showCombo(state.combo);
  } else {
    state.combo=0;
    state.wrong.push({id:q.id,q:q.q,your:q.t==='mcq'?(state.selected!=null?q.o[state.selected]:'(제출 안함)'):(state.selected||'(제출 안함)'),correct:q.t==='mcq'?q.o[q.a]:q.a,explain:q.e,cat:q.c});
  }
  syncToGoogleSheet();
  render();
}

function showCombo(n){
  const el=document.getElementById('comboPop');
  el.textContent=`🔥 ${n}콤보!`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),1200);
}

function goNext(){
  state.idx++;
  state.selected=null;state.submitted=false;
  if(state.idx>=state.list.length){
    finishQuiz();
    return;
  }
  if(state.mode==='focus' && state.idx>0 && state.idx%state.setSize===0){
    screen='setresult';render();window.scrollTo(0,0);return;
  }
  render();
  window.scrollTo(0,0);
  startTimerForCurrent();
}

function renderSetResult(){
  const doneInSet=Math.min(state.idx,state.list.length);
  return `
  <div class="card" style="text-align:center;">
    <h2 class="card-title">🎯 세트 완료!</h2>
    <p>지금까지 ${doneInSet}문제 중 ${state.correct}문제를 맞혔어요.</p>
    <button class="btn btn-primary" id="nextSetBtn">다음 세트 시작</button>
    <div class="giveup" id="giveupSetBtn" style="margin-top:12px;">🚪 그만 풀래요</div>
  </div>`;
}

/* ============ RESULT (채점 로직: 저장 왕복을 병렬화하여 속도 개선) ============ */
function showLoading(msg){
  const ov=document.getElementById('modalOverlay');
  document.getElementById('modalMsg').innerHTML=`<span class="spinner"></span><br>${msg}`;
  document.getElementById('modalBtns').innerHTML='';
  ov.classList.remove('hidden');
}
function hideLoading(){document.getElementById('modalOverlay').classList.add('hidden');}
let isFinalizing=false;
function finishQuiz(){
  if(isFinalizing) return;
  isFinalizing=true;
  clearInterval(state.timerId);clearInterval(state.missionTimerId);clearInterval(state.lockTimerId);
  showLoading('채점하고 있어요...');
  finalizeAndShowResult(false).finally(()=>{isFinalizing=false;});
}
function giveUp(){
  if(isFinalizing) return;
  isFinalizing=true;
  clearInterval(state.timerId);clearInterval(state.missionTimerId);clearInterval(state.lockTimerId);
  showLoading('채점하고 있어요...');
  finalizeAndShowResult(true).finally(()=>{isFinalizing=false;});
}
/* 시험 결과 저장을 한 번의 시도로 처리. 실패 시 finalizeAndShowResult에서 여러 번 재시도하거나
   결과 화면의 '저장 다시 시도' 버튼으로 나중에 다시 호출해도 안전하도록(중복 저장 방지) 설계함.
   examLogId로 이미 저장된 시도인지 확인해서, 재시도해도 포인트가 중복 지급되거나
   시험 기록이 중복으로 쌓이지 않아요. */
async function attemptSaveResult(){
  // 순서대로(하나씩) 호출: 두 storage 호출을 동시에 보내면 일부 환경에서 조용히 실패했어요.
  // 읽기(get)는 '데이터 없음'과 '실패'를 구분하지 않고 항상 사용 가능한 값을 즉시 돌려주므로
  // 여기서 더 이상 실패를 검사하지 않아요. 진짜 성공 여부는 마지막의 저장(set) 결과로 판단해요.
  const {data:sd}=await getStudentData(state.name);
  const {data:ed}=await getExamData();

  const alreadyLogged=sd.examLogs.some(l=>l.id===state.lastExamLogId);
  if(!alreadyLogged){
    // 저장 용량을 줄이기 위해 문제 텍스트/정답/해설은 저장하지 않고 id와 내가 쓴 답만 저장해요.
    // (표시할 때는 QUESTIONS에서 id로 다시 찾아와요)
    state.wrong.forEach(w=>{
      const exist=sd.wrong.find(x=>x.id===w.id);
      if(!exist) sd.wrong.push({id:w.id,your:w.your});
      else exist.your=w.your;
    });
    Object.keys(state.answers).forEach(qid=>{
      if(state.answers[qid]===true) sd.wrong=sd.wrong.filter(w=>w.id!==qid);
    });
    // 랜덤 뽑기에서 이미 풀어본 문제를 다시 안 뽑기 위해, 이번에 실제로 답을 낸 문제 id들을 누적 기록해요.
    if(!sd.answeredIds) sd.answeredIds=[];
    Object.keys(state.answers).forEach(qid=>{
      if(!sd.answeredIds.includes(qid)) sd.answeredIds.push(qid);
    });
    sd.examLogs.push({
      id:state.lastExamLogId, ts:Date.now(), mode:state.mode, score:state.finalScore,
      correct:state.correct, total:state.finalTotal, answered:state.finalAnswered, complete:!state.giveUp,
      cats:state.cats.length?state.cats.map(catName).join(','):'전체',
      wrongList:state.wrong.map(w=>({id:w.id,your:w.your}))
    });
    if(sd.examLogs.length>MAX_EXAM_LOGS) sd.examLogs=sd.examLogs.slice(sd.examLogs.length-MAX_EXAM_LOGS);

    sd.profile.points=(sd.profile.points||0)+state.pointsGained;
    let couponGained=0;
    while(sd.profile.points>=100){sd.profile.points-=100;sd.profile.coupons=(sd.profile.coupons||0)+1;couponGained++;}
    sd.profile.level=Math.min(5,1+Math.floor(((sd.profile.coupons*100)+sd.profile.points)/100));
    state.couponGained=couponGained;
  }
  state.profile=sd.profile;
  sd.inProgress=null; // 채점까지 끝났으니 '이어서 풀기'용 임시 저장은 지워요.

  const alreadyInResults=(ed.results||[]).some(r=>r.examLogId===state.lastExamLogId);
  if(!alreadyInResults){
    ed.results.push({
      id:uid(), examLogId:state.lastExamLogId, name:state.name, ts:Date.now(), score:state.finalScore,
      correct:state.correct, total:state.finalTotal, answered:state.finalAnswered, complete:!state.giveUp,
      mode:state.mode, cats:state.cats.length?state.cats.map(catName).join(','):'전체'
    });
    ed.hof.push({name:state.name,score:state.finalScore,ts:Date.now()});
    ed.hof.sort((a,b)=>b.score-a.score||b.ts-a.ts);
    ed.hof=ed.hof.slice(0,50);
  }

  const savedStudent=await setStudentData(state.name,sd);
  if(!savedStudent) return false;
  const savedExam=await setExamData(ed);
  return savedExam;
}

async function finalizeAndShowResult(gaveUp){
  state.giveUp=gaveUp;
  const answeredCount=Object.keys(state.answers).length;
  const totalCount=state.list.length;
  const score100 = answeredCount>0 ? Math.round((state.correct/answeredCount)*100) : 0;
  state.finalScore=score100;
  state.finalAnswered=answeredCount;
  state.finalTotal=totalCount;
  state.finalPct=totalCount>0?answeredCount/totalCount:0;
  state.lastExamLogId=uid();
  state.pointsGained=(answeredCount>=30 && score100>=90)?10:0;
  state.couponGained=0;

  // 저장 실패가 단발성 네트워크 문제로 시험 결과 자체를 잃어버리지 않도록,
  // 실패하면 잠시 기다렸다가 전체 과정을 다시 시도해요 (최대 3번).
  let saved=false;
  for(let attempt=0; attempt<3 && !saved; attempt++){
    if(attempt>0) await wait(1500);
    saved=await attemptSaveResult();
  }
  state.saveFailed=!saved;
  if(!state.profile) state.profile={points:0,level:1,coupons:0};
  hideLoading();
  screen='result';
  render();
  if(!saved){
    // 놓치기 쉬운 작은 경고문구 대신, 확인이 필요한 팝업으로 명확히 알려줌
    await showAlert('⚠️ 이번 시험 결과가 저장되지 못했어요.\n\n오답모드에서 이 시험의 오답을 보려면, 결과 화면의 "🔄 저장 다시 시도" 버튼을 눌러 주세요.');
  }
}
async function retrySaveResult(){
  showLoading('저장을 다시 시도하고 있어요...');
  let saved=false;
  for(let attempt=0; attempt<3 && !saved; attempt++){
    if(attempt>0) await wait(1500);
    saved=await attemptSaveResult();
  }
  state.saveFailed=!saved;
  if(!state.profile) state.profile={points:0,level:1,coupons:0};
  hideLoading();
  render();
  await showAlert(saved?'✅ 저장됐어요! 이제 오답모드에서도 이 시험의 오답을 확인할 수 있어요.':'❌ 이번에도 저장에 실패했어요. 브라우저 저장공간을 확인한 뒤 잠시 후 다시 시도해 주세요.');
}

function fanfareTier(score,pct){
  if(pct<0.6){
    if(score>=90) return {tier:'f90',msg:'잘했어요! 최고예요! 👏 다음엔 모든 문제를 풀면 더 좋아요!'};
    if(score>=80) return {tier:'f80',msg:'고생했어요! 📘 다음엔 모든 문제를 풀면 더 좋아요!'};
    return null;
  }
  if(score>=100) return {tier:'f100',msg:'🎉🎉 당신은 AML 마스터! 존경합니다! 🎉🎉'};
  if(score>=95) return {tier:'f95',msg:'너무너무 잘했어요! 당신은 자금세탁방지 전문가! 🛡️'};
  if(score>=90) return {tier:'f90',msg:'잘했어요! 최고예요! 👏'};
  if(score>=80) return {tier:'f80',msg:'고생했어요! 📘'};
  return null;
}

/* ============ 오답노트 PDF 생성/인쇄 (html2canvas + jsPDF) ============ */
/* 모바일 대응(중요): window.open()이나 pdf.save()의 자동(프로그램) 클릭 방식은
   삼성 인터넷 등 일부 모바일 브라우저에서 새 창이 회색으로 멈추거나 다운로드가
   조용히 실패하는 문제가 있었어요. 그래서 PDF가 준비되면 학생이 '직접 손가락으로
   누르는' 진짜 링크 버튼을 화면에 보여주는 방식으로 바꿨어요. 이 방식은 브라우저가
   막을 수 없는 가장 안정적인 방법이에요. */
/* 글자 크기 문제(중요): 화면(#printArea)을 모바일 좁은 너비 그대로 캡처해서 A4 전체 폭에
   늘려 넣다 보니 글자가 실제보다 훨씬 크게 인쇄됐어요. 그래서 PDF를 만들 때는 화면에 보이지
   않는 곳에 '문서에 어울리는 고정 너비(760px) + 작은 글자 크기'의 인쇄용 사본을 따로 만들어
   그것을 캡처하도록 바꿨어요. */
let lastPdfBlobUrl=null;
let lastPdfFilename=null;
function buildPrintClone(sourceNode){
  const clone=document.createElement('div');
  clone.className='pdf-clone';
  clone.style.cssText='position:fixed;left:-9999px;top:0;width:760px;background:#ffffff;padding:26px 30px;font-family:"Noto Sans KR",sans-serif;box-sizing:border-box;';
  const style=document.createElement('style');
  style.textContent=`
    .pdf-clone .card-title{font-size:18px;margin:0 0 4px;color:#0f2038;font-family:Georgia,'Nanum Myeongjo','Batang',serif;}
    .pdf-clone .wrongitem{border:1px solid #dde3ea;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
    .pdf-clone .wq{font-size:12.5px;font-weight:700;margin-bottom:4px;line-height:1.45;color:#1b2430;}
    .pdf-clone .wu{font-size:11px;color:#c0392b;}
    .pdf-clone .wa{font-size:11px;color:#1f7a5c;font-weight:700;}
    .pdf-clone .wrongitem > div:last-child{font-size:10.5px;color:#5b6b7c;margin-top:3px;line-height:1.45;}
  `;
  clone.appendChild(style);
  const inner=document.createElement('div');
  inner.innerHTML=sourceNode.innerHTML;
  clone.appendChild(inner);
  document.body.appendChild(clone);
  return clone;
}
async function generateWrongNotePDF(){
  const node=document.getElementById('printArea');
  if(!node) return;
  if(!window.html2canvas || !(window.jspdf&&window.jspdf.jsPDF)){
    await showAlert('PDF 기능을 불러오는 중이에요. 브라우저 저장공간을 확인한 뒤 잠시 후 다시 시도해 주세요.');
    return;
  }
  showLoading('PDF를 만들고 있어요...');
  let clone=null;
  try{
    clone=buildPrintClone(node);
    await new Promise(r=>setTimeout(r,30)); // 레이아웃이 반영될 시간을 살짝 줌
    const canvas=await html2canvas(clone,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:800});
    const imgData=canvas.toDataURL('image/jpeg',0.92);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pageWidth=pdf.internal.pageSize.getWidth();
    const pageHeight=pdf.internal.pageSize.getHeight();
    const imgWidth=pageWidth;
    const imgHeight=canvas.height*imgWidth/canvas.width;
    let heightLeft=imgHeight;
    let position=0;
    pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
    heightLeft-=pageHeight;
    while(heightLeft>0){
      position=heightLeft-imgHeight;
      pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
      heightLeft-=pageHeight;
    }
    if(lastPdfBlobUrl){ try{URL.revokeObjectURL(lastPdfBlobUrl);}catch(e){} }
    lastPdfBlobUrl=pdf.output('bloburl');
    lastPdfFilename=`오답노트_${safeName(state.name)||'학생'}_${fmtDate(Date.now())}.pdf`;
    hideLoading();
    showPdfReadyModal();
  }catch(e){
    hideLoading();
    await showAlert('PDF를 만드는 중 문제가 발생했어요. 브라우저 저장공간을 확인하고 다시 시도해 주세요.');
  } finally {
    if(clone && clone.parentNode) clone.parentNode.removeChild(clone);
  }
}
function showPdfReadyModal(){
  const ov=document.getElementById('modalOverlay');
  document.getElementById('modalMsg').innerHTML='📄 오답노트 PDF가 준비됐어요!<br>아래 버튼을 <b>직접 눌러서</b> 저장하거나 열어 주세요.';
  const btns=document.getElementById('modalBtns');
  btns.style.flexDirection='column';
  btns.innerHTML=`
    <a href="${lastPdfBlobUrl}" download="${lastPdfFilename}" class="btn btn-primary" style="margin-bottom:8px;">⬇️ PDF 다운로드</a>
    <a href="${lastPdfBlobUrl}" class="btn btn-outline" style="margin-bottom:8px;">📄 PDF 열어서 보기 · 인쇄</a>
    <button class="btn btn-ghost" id="modalCloseBtn">닫기</button>
  `;
  ov.classList.remove('hidden');
  document.getElementById('modalCloseBtn').onclick=()=>{ov.classList.add('hidden');btns.style.flexDirection='';};
}

async function showWrongHistoryScreen(){

  app.innerHTML=`<div class="card"><p>불러오는 중...</p></div>`;

    document.getElementById('backHomeBtn').onclick=()=>{screen='setup';render();};
    return;
  }
  const logs=(sd.examLogs||[]).slice().reverse();
  const totalWrong=logs.reduce((s,l)=>s+((l.wrongList&&l.wrongList.length)||0),0);
  app.innerHTML=`
  <div class="card">
    <h2 class="card-title">📚 ${state.name}님의 오답노트 모아보기</h2>
    ${logs.length===0?'<p>아직 시험 기록이 없어요. 먼저 시험을 봐 주세요!</p>':`
    <p style="font-size:13px;color:var(--sub);margin-bottom:14px;">지금까지 본 시험 ${logs.length}회 · 누적 오답 ${totalWrong}개</p>
    ${totalWrong>0?`<button class="btn btn-primary" id="viewAllWrongBtn" style="margin-bottom:16px;">📖 전체 오답 모아서 보기 (중복 없이, PDF·인쇄)</button>`:''}
    ${logs.map(l=>`<div class="hist-item" data-logid="${l.id}">
      <div class="hist-top"><span>${fmtDT(l.ts)}</span><span style="color:${l.score>=90?'var(--good)':'var(--leaf-dark)'};">${l.score}점</span></div>
      <div class="hist-sub">${modeLabel(l.mode)} · ${l.cats} · 틀린 문제 ${(l.wrongList&&l.wrongList.length)||0}개${l.complete?'':' · 중도포기'}</div>
    </div>`).join('')}
    `}
    <button class="btn btn-ghost" id="backHomeBtn" style="margin-top:10px;">돌아가기</button>
  </div>`;
  document.getElementById('backHomeBtn').onclick=()=>{screen='setup';render();};
  const allBtn=document.getElementById('viewAllWrongBtn');
  if(allBtn){
    allBtn.onclick=()=>{
      // 같은 문제가 여러 시험에서 반복해서 틀렸어도 한 번만 보여주고,
      // 대신 틀린 횟수와 날짜들을 함께 표시 (중복 제거)
      const map=new Map();
      logs.slice().reverse().forEach(l=>{ // 오래된 시험부터 순서대로 모음(최근 정보로 갱신되도록)
        (l.wrongList||[]).forEach(w=>{
          if(!map.has(w.id)){
            map.set(w.id,{id:w.id,your:w.your,count:0,dates:[]});
          }
          const entry=map.get(w.id);
          entry.count++;
          entry.dates.push(fmtDate(l.ts));
          entry.your=w.your; // 가장 최근에 쓴 답으로 갱신
        });
      });
      const combined=Array.from(map.values()).sort((a,b)=>b.count-a.count||a.id.localeCompare(b.id));
      showWrongHistoryDetail(`${state.name}님의 전체 누적 오답노트 (중복 제거)`,combined,'combined');
    };
  }
  document.querySelectorAll('.hist-item').forEach(el=>{
    el.onclick=()=>{
      const log=logs.find(l=>l.id===el.dataset.logid);
      if(!log)return;
      showWrongHistoryDetail(`${state.name}님의 오답노트 · ${fmtDT(log.ts)}`,log.wrongList||[],'single');
    };
  });
}

async function generateCloudPDF(name){
  const node=document.getElementById('cloudPrintArea');
  if(!node) return;
  if(!window.html2canvas || !(window.jspdf&&window.jspdf.jsPDF)){
    await showAlert('PDF 기능을 불러오는 중이에요. 잠시 후 다시 시도해 주세요.');
    return;
  }
  showLoading('PDF를 만들고 있어요...');
  let clone=null;
  try{
    clone=buildPrintClone(node);
    await new Promise(r=>setTimeout(r,30));
    const canvas=await html2canvas(clone,{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:800});
    const imgData=canvas.toDataURL('image/jpeg',0.92);
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF('p','mm','a4');
    const pageWidth=pdf.internal.pageSize.getWidth();
    const pageHeight=pdf.internal.pageSize.getHeight();
    const imgWidth=pageWidth;
    const imgHeight=canvas.height*imgWidth/canvas.width;
    let heightLeft=imgHeight, position=0;
    pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
    heightLeft-=pageHeight;
    while(heightLeft>0){
      position=heightLeft-imgHeight;
      pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,position,imgWidth,imgHeight);
      heightLeft-=pageHeight;
    }
    if(lastPdfBlobUrl){ try{URL.revokeObjectURL(lastPdfBlobUrl);}catch(e){} }
    lastPdfBlobUrl=pdf.output('bloburl');
    lastPdfFilename=`${safeName(name)||'학생'}_오답노트_${fmtDate(Date.now())}.pdf`;
    hideLoading();
    showPdfReadyModal();
  }catch(e){
    hideLoading();
    await showAlert('PDF를 만드는 중 문제가 발생했어요.');
  } finally {
    if(clone && clone.parentNode) clone.parentNode.removeChild(clone);
  }
}

function inRange(ts,range){
  const d=new Date(ts),now=new Date();
  if(range==='all')return true;
  if(range==='week'){const start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);return ts>=start.getTime();}
  if(range==='month')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(range==='year')return d.getFullYear()===now.getFullYear();
  if(range==='semester'){
    const sem1=now.getMonth()<6;
    const dsem1=d.getMonth()<6;
    return d.getFullYear()===now.getFullYear() && dsem1===sem1;
  }
  return true;
}

  const active=document.querySelector('#excelRangeGrid .chip.active');
  const range=active?active.dataset.range:'all';
  const rows=results.filter(r=>inRange(r.ts,range)).sort((a,b)=>a.ts-b.ts).map(r=>({
    이름:r.name,날짜:fmtDT(r.ts),점수:r.score,'맞은개수':r.correct,'전체문제':r.total,'푼문제':r.answered,
    진행:r.complete?'완료':'중도포기',모드:modeLabel(r.mode),범위:r.cats
  }));
  if(rows.length===0){showAlert('해당 기간에 데이터가 없어요.');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'자금세탁방지결과');
  XLSX.writeFile(wb,`자금세탁방지_결과_${range}_${fmtDate(Date.now())}.xlsx`);
}
async function doSemesterEnd(results){
  const ok=await showConfirm('현재까지 기록을 엑셀로 저장한 뒤 초기화할까요? 포인트·쿠폰·랭킹은 유지돼요.');
  if(!ok)return;
  doExcelDownload(results);
  const {data:ed, failed}=await getExamData();
  if(failed){await showAlert('기록을 불러오지 못해 초기화를 진행하지 않았어요. 다시 시도해 주세요.');return;}
  ed.results=[];
  const ok2=await setExamData(ed);
  if(!ok2){await showAlert('초기화 저장에 실패했어요. 다시 시도해 주세요.');return;}
  await showAlert('학기가 마감되고 시험 기록이 초기화됐어요.');
  renderTeacherDashAsync();
}

/* ============ EVENT BINDING ============ */
function bindEvents(){
  if(screen==='setup'){
    document.getElementById('nameInput').oninput=(e)=>{state.name=e.target.value;};
    document.getElementById('nameInput').onblur=(e)=>{state.name=e.target.value.trim();refreshResumeStatus();};
    const resumeBtn=document.getElementById('resumeBtn');
    if(resumeBtn) resumeBtn.onclick=()=>{
      const nameEl=document.getElementById('nameInput');
      state.name=(nameEl?nameEl.value:state.name).trim();
      resumeProgress();
    };
    document.querySelectorAll('.chip[data-cat]').forEach(c=>{
      c.onclick=()=>{
        const id=c.dataset.cat;
        if(state.cats.includes(id)) state.cats=state.cats.filter(x=>x!==id);
        else state.cats.push(id);
        render();
      };
    });
    document.querySelectorAll('.chip[data-random]').forEach(c=>{
      c.onclick=async()=>{
        const nameEl=document.getElementById('nameInput');
        state.name=(nameEl?nameEl.value:state.name).trim();
        if(!state.name){showAlert('이름을 입력해 주세요!');return;}
        await refreshResumeStatus();
        if(!(await confirmOverwriteResumeIfNeeded())) return;
        startRandomDraw(parseInt(c.dataset.random,10));
      };
    });
    document.getElementById('shuffleChk').onchange=(e)=>{state.order=e.target.checked?'shuffle':'seq';};
    document.querySelectorAll('.mode-card').forEach(m=>{
      m.onclick=(e)=>{
        if(e.target.closest('.scope-chip')) return; // 오답 범위 칩 클릭은 모드 카드 클릭과 분리
        state.mode=m.dataset.mode;render();
      };
    });
    document.querySelectorAll('.scope-chip[data-scope]').forEach(c=>{
      c.onclick=(e)=>{e.stopPropagation();state.wrongScope=c.dataset.scope;render();};
    });
    document.querySelectorAll('.scope-chip[data-diff]').forEach(c=>{
      c.onclick=(e)=>{e.stopPropagation();state.diff=c.dataset.diff;render();};
    });
    document.getElementById('missionBtn').onclick=async()=>{
      const nameEl=document.getElementById('nameInput');
      state.name=(nameEl?nameEl.value:state.name).trim();
      if(state.name){await refreshResumeStatus();if(!(await confirmOverwriteResumeIfNeeded()))return;}
      state.missionStarted=false;startQuiz('mission');
    };
    document.getElementById('startBtn').onclick=async()=>{
      const nameEl=document.getElementById('nameInput');
      state.name=(nameEl?nameEl.value:state.name).trim();
      if(state.name){await refreshResumeStatus();if(!(await confirmOverwriteResumeIfNeeded()))return;}
      state.missionStarted=false;startQuiz(state.mode);
    };
    document.getElementById('couponBtn').onclick=()=>{
      const nameEl=document.getElementById('nameInput');state.name=nameEl.value.trim();
      showCouponScreen();
    };
    document.getElementById('hofBtn').onclick=()=>{showHOFScreen();};
    document.getElementById('wrongHistoryBtn').onclick=()=>{showWrongHistoryScreen();};
    document.getElementById('teacherBtn').onclick=()=>{screen='tlogin';render();};
    document.getElementById('resetMyDataBtn').onclick=async()=>{
      const nameEl=document.getElementById('nameInput');
      const nm=(nameEl?nameEl.value:state.name).trim();
      if(!nm){showAlert('먼저 이름을 입력해 주세요!');return;}
      const ok=await showConfirm(`"${nm}"님의 오답노트와 포인트·리워드 기록을 모두 지울까요? 이 작업은 되돌릴 수 없어요.`);
      if(!ok)return;
      showLoading('초기화하고 있어요...');
      const ok2=await setStudentData(nm,{profile:{points:0,level:1,coupons:0},wrong:[],examLogs:[],answeredIds:[],inProgress:null});
      state.hasResume=false;state.resumeInfo=null;
      hideLoading();
      await showAlert(ok2?'초기화됐어요! 이제 새로 시작해 보세요.':'초기화 저장에 실패했어요. 브라우저 저장공간을 확인하고 다시 시도해 주세요.');
    };
    document.getElementById('storageTestBtn').onclick=async()=>{
      showLoading('저장 기능을 테스트하고 있어요...');
      const testKey='storagetest_'+APP_KEY;
      const testVal={ping:Date.now()};
      let writeOk=false, readOk=false, readBack=null;
      try{
        const w=await sset(testKey,testVal);
        writeOk=w.ok;
        if(writeOk){
          const r=await sget(testKey);
          readOk=!r.failed && r.value && r.value.ping===testVal.ping;
          readBack=r.value;
        }
      }catch(e){}
      hideLoading();
      if(writeOk && readOk){
        await showAlert('✅ 저장 기능이 정상 작동해요!\n\n오답모드가 계속 안 된다면, 실제로 저장된 시험 기록이 없는 경우예요. 시험을 한 번 보고 나서 결과 화면에 저장 실패 경고가 없는지 확인한 뒤, 오답모드를 다시 시도해 주세요.');
      } else {
        await showAlert('❌ 저장 기능을 사용할 수 없는 상태예요.\n\n브라우저가 localStorage를 지원하지 않거나(매우 오래된 브라우저), 시크릿/비공개 모드로 열려 있거나, 브라우저 저장공간이 가득 찬 경우일 수 있어요.\n\n일반 창(시크릿 모드 아님)으로 다시 열어서 시도해 주세요.');
      }
    };
  }
  else if(screen==='quiz'){
    if(!state.submitted){
      document.querySelectorAll('.choice').forEach(c=>{
        c.onclick=()=>{
          if(state.mode==='deep' && Date.now()<state.lockUntil){return;}
          state.selected=parseInt(c.dataset.idx);render();
        };
      });
      const si=document.getElementById('shortInput');
      if(si) si.oninput=(e)=>{state.selected=e.target.value;};
      const sb=document.getElementById('submitBtn');
      if(sb) sb.onclick=async()=>{
        if(state.mode==='deep' && Date.now()<state.lockUntil){showAlert('아직 5초가 지나지 않았어요!');return;}
        if(state.selected===null || state.selected===undefined || state.selected===''){
          const ok=await showConfirm('답을 선택하지 않았어요. 그래도 제출할까요?');
          if(!ok){return;}
        }
        handleSubmit(false);
      };
    } else {
      document.getElementById('nextBtn').onclick=()=>goNext();
    }
    document.getElementById('giveupBtn').onclick=async()=>{
      if(isFinalizing) return;
      clearInterval(state.timerId);clearInterval(state.missionTimerId);
      await showExitChoice();
    };
  }
  else if(screen==='setresult'){
    document.getElementById('nextSetBtn').onclick=()=>{render();window.scrollTo(0,0);startTimerForCurrent();};
    document.getElementById('giveupSetBtn').onclick=async()=>{
      if(isFinalizing) return;
      await showExitChoice();
    };
  }
  else if(screen==='result'){
    document.getElementById('wrongNoteBtn').onclick=()=>{screen='wrongnote';render();};
    document.getElementById('backHomeBtn').onclick=()=>{const nm=state.name;state=newSession();state.name=nm;screen='setup';render();refreshResumeStatus();};
    document.getElementById('retryBtn').onclick=()=>{const nm=state.name;const cats=state.cats;const ord=state.order;const md=state.mode;state=newSession();state.name=nm;state.cats=cats;state.order=ord;state.mode=md;screen='setup';render();refreshResumeStatus();};
    const rsb=document.getElementById('retrySaveBtn');
    if(rsb) rsb.onclick=()=>retrySaveResult();
  }
  else if(screen==='wrongnote'){
    document.getElementById('pdfBtn').onclick=()=>generateWrongNotePDF();
    document.getElementById('backResultBtn').onclick=()=>{screen='result';render();};
  }
  else if(screen==='tlogin'){
    document.getElementById('pwSubmit').onclick=()=>{
      const v=document.getElementById('pwInput').value;
      if(v===TEACHER_PW){screen='tdash';render();renderTeacherDashAsync();}
      else showAlert('비밀번호가 틀렸어요.');
    };
    document.getElementById('pwCancel').onclick=()=>{screen='setup';render();};
  }
}

/* 앱을 처음 열 때, 예전에 저장해 둔 이름이 있으면 자동으로 채워 넣어요. */
(async function initApp(){
  const savedName=await loadNameFromStorage();
  if(savedName) state.name=savedName;
  render();
  if(savedName) refreshResumeStatus();
})();
</script>
