<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>자금세탁방지 완전정복 - 제도편 · 제도 · 실무</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --leaf:#1b3358; --leaf-dark:#0f2038; --root:#46607e; --root-dark:#2e4560; --flower:#b8935a; --flower-dark:#8a6a3a;
  --bg1:#eef1f6; --bg2:#f3f0e6; --card:#ffffff; --ink:#1b2430; --sub:#5b6b7c;
  --good:#1f7a5c; --warn:#c1791f; --gold:#c9a961; --line:#dde3ea;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Noto Sans KR',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1) 0%, #f6f4ec 45%, var(--bg2) 100%);
  min-height:100vh;padding-bottom:40px;}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
.hero{text-align:center;padding:18px 10px 6px;}
.hero .eyebrow{font-size:13px;color:var(--leaf);font-weight:700;letter-spacing:.5px;}
.hero h1{font-family:Georgia,'Nanum Myeongjo','Batang',serif;font-size:32px;margin:4px 0 6px;
  background:linear-gradient(90deg,var(--leaf),var(--flower));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{font-size:13px;color:var(--sub);margin:0 0 14px;}
.gauge{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--root),#8899ab,var(--leaf),#c9a961);position:relative;margin-bottom:4px;}
.gauge .mark{position:absolute;top:-4px;width:3px;height:18px;background:#1b2430;border-radius:2px;}
.gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:16px;}
.card{background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(46,125,50,.09);padding:22px 20px;margin-bottom:16px;}
h2.card-title{font-family:Georgia,'Nanum Myeongjo','Batang',serif;font-size:22px;margin:0 0 14px;color:var(--leaf-dark);}
label.field-label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--ink);}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:1.5px solid #cdd6e3;font-size:16px;background:#f4f6fa;}
input[type=text]:focus{outline:2px solid var(--leaf);}
.chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
.chip{border:1.5px solid #cdd6e3;border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#f4f6fa;transition:.15s;}
.chip b{display:block;font-size:14px;}
.chip small{color:var(--sub);font-size:11px;}
.chip.active{border-color:var(--leaf);background:#e7ecf5;box-shadow:0 0 0 2px rgba(46,125,50,.15) inset;}
.toggle-row{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px;}
.toggle-row input{width:18px;height:18px;}
.mode-card{border:1.5px solid #cdd6e3;border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#f4f6fa;}
.mode-card.active{border-color:var(--leaf);background:#e7ecf5;box-shadow:0 0 0 2px rgba(46,125,50,.15) inset;}
.mode-card .mt{font-weight:700;font-size:15px;}
.mode-card .md{font-size:12px;color:var(--sub);margin-top:2px;}
.mission{background:linear-gradient(90deg,#2c4f78,#1b3358);color:#fff;border-radius:16px;padding:16px;text-align:center;font-weight:700;font-size:15px;margin:14px 0;cursor:pointer;}
.btn{display:block;width:100%;text-align:center;padding:16px;border-radius:16px;font-weight:800;font-size:16px;border:none;cursor:pointer;text-decoration:none;box-sizing:border-box;}
.btn-primary{background:linear-gradient(90deg,var(--leaf),var(--leaf-dark));color:#fff;box-shadow:0 8px 18px rgba(46,125,50,.28);}
.btn-outline{background:#fff;border:1.6px solid var(--leaf);color:var(--leaf-dark);}
.btn-ghost{background:#edf0f5;color:var(--ink);}
.row2{display:flex;gap:10px;margin-top:10px;}
.row2 .btn{flex:1;}
.small-note{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;}
.tag{display:inline-block;background:#e7ecf5;color:var(--leaf-dark);font-weight:700;font-size:13px;padding:6px 12px;border-radius:20px;margin-bottom:10px;}
.meta-row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:8px;}
.timerbar-outer{height:8px;background:#e3e7ee;border-radius:5px;overflow:hidden;margin-bottom:14px;}
.timerbar-inner{height:100%;background:linear-gradient(90deg,var(--leaf),var(--flower));transition:width 1s linear;}
.qtext{font-size:19px;font-weight:700;line-height:1.5;margin:8px 0 18px;white-space:pre-line;}
.choice{border:1.6px solid #cdd6e3;border-radius:16px;padding:16px;margin-bottom:10px;font-size:15px;cursor:pointer;background:#f4f6fa;}
.choice.sel{border-color:var(--root);background:#e9edf3;}
.choice.correct{border-color:var(--good);background:#e7f6ec;}
.choice.wrong{border-color:#c0392b;background:#fdeceb;}
.choice.locked{background:#e4e7ec;border-color:#c3ccd6;color:#1b2430;cursor:not-allowed;}
.lock-note{font-size:12px;font-weight:700;margin-top:2px;}
.lock-note.wait{color:var(--warn);}
.lock-note.go{color:var(--leaf-dark);}
.lock-countdown{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#f2f4f8;border:3px dashed #b7c2d1;border-radius:18px;padding:10px 14px 14px;margin:4px 0 14px;font-weight:800;color:#9c7a3f;font-size:14px;transition:.2s;}
.lock-countdown .num{font-size:64px;font-weight:900;font-family:Georgia,'Nanum Myeongjo','Batang',serif;color:var(--flower-dark);min-width:60px;text-align:center;line-height:1;}
.lock-countdown .go-emoji{font-size:44px;line-height:1;}
.lock-countdown.go{color:var(--leaf-dark);border-color:var(--leaf);background:#eef1f6;border-style:solid;}
.scope-row{display:flex;gap:8px;margin:6px 0 2px;}
.scope-chip{flex:1;border:1.5px solid #cdd6e3;border-radius:12px;padding:9px 6px;text-align:center;font-size:12.5px;font-weight:700;cursor:pointer;background:#f4f6fa;color:var(--sub);}
.scope-chip.active{border-color:var(--leaf);background:#e7ecf5;color:var(--leaf-dark);}
.hist-item{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#f4f6fa;}
.hist-item:active{background:#edf0f5;}
.hist-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;}
.hist-sub{font-size:12px;color:var(--sub);margin-top:4px;}
.explain-box{background:#fdeceb;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.6;margin:10px 0 16px;}
.explain-box.right{background:#e7f6ec;}
.explain-box b{display:block;margin-bottom:6px;font-size:15px;}
.giveup{display:block;text-align:center;color:var(--sub);font-size:13px;margin-top:14px;text-decoration:underline;cursor:pointer;}
.combo-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0.7);background:linear-gradient(135deg,var(--gold),#e9cf8a);color:#4a3a14;font-weight:900;font-size:26px;padding:22px 34px;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.25);z-index:999;opacity:0;transition:.25s;text-align:center;}
.combo-pop.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.score-big{text-align:center;font-family:Georgia,'Nanum Myeongjo','Batang',serif;font-size:54px;font-weight:700;color:var(--leaf-dark);margin:6px 0 2px;}
.score-sub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:14px;}
.fanfare{text-align:center;font-weight:900;font-size:19px;border-radius:16px;padding:16px;margin:14px 0;}
.fanfare.f80{background:#f7f1e2;color:#9c7a3f;}
.fanfare.f90{background:#e7ecf5;color:var(--leaf-dark);}
.fanfare.f95{background:#f5eedd;color:var(--flower-dark);}
.fanfare.f100{background:linear-gradient(135deg,#e9cf8a,#c9a961);color:#4a3a14;}
.point-box{display:flex;justify-content:space-between;align-items:center;background:#eef1f7;border-radius:14px;padding:14px 16px;margin:10px 0;font-size:14px;}
.point-box b{color:var(--leaf-dark);font-size:16px;}
.level-pill{background:#e7ecf5;color:var(--leaf-dark);font-weight:700;font-size:13px;padding:8px 14px;border-radius:20px;display:inline-block;margin-top:6px;}
.coupon-toast{background:linear-gradient(135deg,#e6cf9a,#c9a961);border-radius:16px;padding:16px;text-align:center;font-weight:800;color:#4a3a14;margin:14px 0;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-weight:700;background:#f6faf4;}
.tabbar{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto;}
.tabbtn{flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
.tabbtn.active{color:var(--leaf-dark);border-color:var(--leaf);}
.month-head{background:#eef1f7;border-radius:12px;padding:12px 14px;margin-bottom:6px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer;}
.warnbox{background:#f7f1e2;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#8a6a3a;margin-bottom:14px;}
.hidden{display:none !important;}
.modal-overlay{position:fixed;inset:0;background:rgba(20,30,15,.5);display:flex;align-items:center;justify-content:center;z-index:1200;padding:24px;}
.modal-overlay.hidden{display:none !important;}
.modal-box{background:#fff;border-radius:20px;padding:24px 20px;max-width:340px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);}
.modal-box p{font-size:15px;line-height:1.6;margin:0 0 18px;text-align:center;color:var(--ink);white-space:pre-line;}
.spinner{display:inline-block;width:32px;height:32px;border:4px solid #dbe2ea;border-top-color:var(--leaf);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.footer-copy{text-align:center;color:#8b97a6;font-size:12px;margin-top:20px;}
.hof-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.hof-rank{width:28px;height:28px;border-radius:50%;background:#eef1f7;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--leaf-dark);}
.hof-rank.gold{background:#ffd54f;color:#4a3a14;}
.hof-rank.silver{background:#d8d8d8;}
.hof-rank.bronze{background:#e0ad7a;color:#4a2b00;}
.kbdinput{width:100%;padding:14px;border-radius:14px;border:1.6px solid var(--leaf);font-size:16px;margin-bottom:14px;background:#eef1f7;}
.wrongitem{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.wrongitem .wq{font-weight:700;margin-bottom:6px;}
.wrongitem .wa{color:var(--good);font-weight:700;font-size:13px;}
.wrongitem .wu{color:#c0392b;font-size:13px;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;left:0;top:0;width:100%;}
}
</style>
</head>

<script>
/* ============ QUESTION BANK ============ */
const CATS = [

  {id:'jd2_9', name:'[제도] 9장 무역기반자금세탁(TBML)', icon:'🚢'},

function S(c,q,a,e){return {c,t:'short',q,a,e};}

const QUESTIONS = [
M('jd1_1',
  '<보기> 중 옳은 설명을 모두 고른 것은?\nㄱ. 국제자금세탁방지기구(FATF)는 비엔나 협약(1988)과 팔레모 협약(2000)을 근거로 자금세탁을 "범죄수익의 불법원천을 가장하기 위한 과정"이라 정의한다.\nㄴ. 테러자금 억제를 위한 국제협약(1999)은 자금의 전부가 실제로 테러행위에 이용되었음이 입증되어야만 범죄가 성립한다고 규정한다.\nㄷ. FATF 40 권고사항은 1996년 전제범죄 확대, 2001년 9개 특별권고(CFT) 반영, 2012년 및 2023년 11월 개정을 거쳤다.\nㄹ. 자금세탁의 3단계 중 예치·배치(Placement)는 거래빈도·거래량을 정상거래처럼 꾸며 자금추적을 불가능하게 만드는 단계이다.\nㅁ. AML/CFT 규제의 사법규제 측면에는 자금세탁행위의 범죄화뿐 아니라 범죄수익의 몰수·추징도 포함된다.',
  ['ㄱ, ㄷ, ㅁ.','ㄱ, ㄷ, ㄹ.','ㄴ, ㄹ, ㅁ.','ㄱ, ㄴ, ㄷ.'],0,
  'ㄱ·ㄷ·ㅁ이 옳아요. ㄴ은 틀려요 — 협약상 자금이 실제로 테러행위에 이용되었다는 사실의 입증은 요구되지 않아요. ㄹ도 틀려요 — 거래빈도·거래량을 정상거래처럼 꾸며 자금추적을 불가능하게 만드는 것은 예치·배치가 아니라 은폐·반복(Layering)의 설명이에요.','ultra'),
M('jd1_1',
  '<보기>의 5개 항목을 사법규제·금융규제·국제협력체계 중 알맞은 축으로 옳게 분류한 것은?\nㄱ. 고액현금거래보고(CTR) 의무 부과\nㄴ. 범죄수익 및 재산의 몰수·추징\nㄷ. 범죄인 인도\nㄹ. 고객확인의무(CDD) 부과\nㅁ. 자금세탁행위를 범죄로 규정하여 형사처벌',
  ['금융규제: ㄱ, ㄹ / 사법규제: ㄴ, ㄷ / 국제협력체계: ㅁ.','금융규제: ㄱ, ㄹ / 사법규제: ㄴ, ㅁ / 국제협력체계: ㄷ.','금융규제: ㄱ, ㄴ, ㄹ / 사법규제: ㅁ / 국제협력체계: ㄷ.','금융규제: ㄴ, ㄹ / 사법규제: ㄱ, ㅁ / 국제협력체계: ㄷ.'],1,
  '금융규제는 CDD·STR·CTR 등 금융회사등의 보고·확인 의무(ㄱ, ㄹ), 사법규제는 범죄화·몰수·추징(ㄴ, ㅁ), 국제협력체계는 정보교환·범죄인인도·사법공조(ㄷ)로 분류돼요. 5개 항목 전부를 정확히 분류해야 정답을 고를 수 있어요.','ultra'),
M('jd1_1',
  '다음 사건·개정을 연도가 빠른 순서대로 옳게 나열한 것은?\nㄱ. 팔레모 협약 채택\nㄴ. FATF 40권고사항 전제범죄 확대 개정\nㄷ. 비엔나 협약 채택\nㄹ. 테러자금 억제를 위한 국제협약 채택\nㅁ. FATF 40권고사항에 9개 특별권고(CFT) 반영',
  ['ㅁ → ㄱ → ㄷ → ㄴ → ㄹ.','ㄴ → ㅁ → ㄷ → ㄱ → ㄹ.','ㄱ → ㄷ → ㅁ → ㄹ → ㄴ.','ㄷ → ㄴ → ㄹ → ㄱ → ㅁ.'],3,
  '연도 순서는 비엔나 협약(1988) → FATF 전제범죄 확대 개정(1996) → 테러자금 억제 국제협약(1999) → 팔레모 협약(2000) → 9개 특별권고 반영(2001, 9.11 테러 이후)이에요. 테러자금 억제 국제협약(1999)이 팔레모 협약(2000)보다 먼저라는 점이 가장 헷갈리기 쉬운 포인트예요.','ultra'),
M('jd1_1',
  '<보기>의 사례 5가지를 자금세탁 단계와 옳게 짝지은 것은?\nㄱ. 환거래\nㄴ. 허위송장 발행\nㄷ. 인출금 반복\nㄹ. 대출\nㅁ. 위장회사를 통한 부동산 매각',
  ['예치·배치: ㄱ, ㄷ / 은폐·반복: ㄹ / 합법화·통합: ㄴ, ㅁ.','예치·배치: ㄴ, ㄹ / 은폐·반복: ㄱ, ㄷ / 합법화·통합: ㅁ.','예치·배치: ㄱ, ㄹ, ㄷ / 은폐·반복: 없음 / 합법화·통합: ㄴ, ㅁ.','예치·배치: ㄱ, ㄹ / 은폐·반복: ㄷ / 합법화·통합: ㄴ, ㅁ.'],3,
  '환거래(ㄱ)와 대출(ㄹ)은 예치·배치, 인출금 반복(ㄷ)은 은폐·반복, 허위송장 발행(ㄴ)과 위장회사를 통한 부동산 매각(ㅁ)은 합법화·통합 단계의 사례예요. 5개 사례 전부를 정확한 단계로 분류해야 정답을 고를 수 있어요.','ultra'),
M('jd1_1',
  '<보기> 중 옳지 않은 설명을 모두 고른 것은?\nㄱ. 화이트칼라형 범죄는 사회적 지위나 권한을 이용하며, 다른 범죄에 비해 국가·사회에 미치는 피해가 간접적이면서도 크다.\nㄴ. 자금세탁의 조직범죄성이란, 실제 소유자가 직접·단독으로 자금세탁을 수행하는 경우가 대부분이라는 의미이다.\nㄷ. 자금세탁의 국제범죄성은 금융기관·무역거래·전자지갑 등을 통해 2개국 이상의 국경을 넘나드는 것을 핵심 특징으로 한다.\nㄹ. 자금세탁방지 체계가 엄격한 국가일수록 자금세탁의 경유지로 선호된다.',
  ['ㄴ, ㄷ, ㄹ.','ㄴ, ㄹ.','ㄷ, ㄹ.','ㄱ, ㄴ.'],1,
  'ㄴ은 틀려요 — 조직범죄성은 단독 수행이 일부에 불과하고 조직에 의한 진행이 일반적이라는 의미예요. ㄹ도 틀려요 — 자금세탁방지 체계가 미흡한 국가일수록 경유지로 선호돼요. ㄱ, ㄷ은 옳은 설명이라 정답 조합에서 빠져야 해요.','ultra'),
M('jd1_1',
  '1편 1장 1절의 내용을 종합할 때, <보기> 중 옳은 설명의 개수는?\nㄱ. 자금세탁의 정의 근거는 비엔나 협약(1988)·팔레모 협약(2000)이며, 정의는 전환·이체 / 은닉·가장 / 취득·소유·사용의 3가지 유형으로 구성된다.\nㄴ. 테러자금조달 정의의 근거협약은 1999년 채택되었고, 이 협약 자체에 CFT 9개 특별권고가 명시되어 있다.\nㄷ. AML/CFT 글로벌 기본원칙은 사법제도·금융제도 2가지 축으로만 구성되며, 국제협력체계는 포함되지 않는다.\nㄹ. 전제범죄 범위가 모든 중대범죄로 확대된 것은 1996년 FATF 40권고사항 개정에 의한 것이다.',
  ['3개.','4개.','1개.','2개.'],3,
  'ㄱ, ㄹ만 옳아요. ㄴ은 틀려요 — 9개 특별권고(CFT)는 1999년 테러자금 억제 국제협약이 아니라, 2001년 9.11 테러 이후 FATF 40권고사항에 반영된 것이에요. ㄷ도 틀려요 — AML/CFT 규제는 사법제도·금융제도·국제협력체계의 3가지 축으로 구성돼요.','ultra'),
M('jd1_2',
  '다음 <보기>의 국제조약·선언을 채택 연도가 이른 순서대로 옳게 나열한 것은?\nㄱ. 팔레모 협약(UN국제조직범죄방지협약)\nㄴ. 은행제도의 범죄 이용 방지에 관한 선언(바젤위원회 선언)\nㄷ. 유럽평의회 범죄수익규제협약\nㄹ. 테러자금 억제를 위한 국제협약\nㅁ. UN 부패방지협약(메리다협약)',
  ['ㄹ → ㄷ → ㄴ → ㅁ → ㄱ.','ㄴ → ㄷ → ㄹ → ㄱ → ㅁ.','ㄱ → ㄴ → ㄷ → ㄹ → ㅁ.','ㄹ → ㄱ → ㄷ → ㅁ → ㄴ.'],1,
  '연도 순서는 바젤위원회 선언(1988) → 유럽평의회 범죄수익규제협약(1990) → 테러자금 억제 국제협약(1999) → 팔레모 협약(2000) → 메리다 협약(2003)이에요. 바젤위원회 선언이 비엔나 협약과 같은 1988년이지만 유럽평의회 협약(1990)보다 앞선다는 점, 테러자금협약(1999)이 팔레모 협약(2000)보다 앞선다는 점이 핵심 함정이에요.','ultra'),
M('jd1_2',
  '<보기> 중 옳은 설명을 모두 고른 것은?\nㄱ. 우리나라는 비엔나 협약을 기준으로 1995년 마약류 불법거래 방지에 관한 특례법을 제정하였고, 1998년 협약 가입에 대해 국회에서 비준하였다.\nㄴ. 바젤위원회 선언(1988)의 주요내용에는 은행의 고객확인의무, 법규준수 및 혐의거래 지원거절, 수사기관에 대한 협조, 내부절차 수립이 포함된다.\nㄷ. 팔레모 협약은 마약범죄를 전제범죄로 한정하며 국제조직범죄에는 적용되지 않는다.\nㄹ. 유럽평의회 범죄수익규제협약(1990)은 비엔나 협약과 달리 자금세탁행위의 전제범죄를 마약 관련 범죄에 한정하지 않고 불법수익이 발생하는 모든 범죄를 대상으로 한다.',
  ['ㄱ, ㄴ, ㄹ.','ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄱ, ㄷ, ㄹ.'],0,
  'ㄱ, ㄴ, ㄹ이 옳아요. ㄷ은 틀려요 — 팔레모 협약은 마약범죄에 한정되지 않고, 3인 이상 조직범죄단체의 국제적 중대범죄(조직범죄단체 가담, 범죄수익금 세탁, 사법방해, 부패행위 등)를 대상으로 해요.','ultra'),
M('jd1_2',
  '다음은 테러자금 억제를 위한 국제협약(1999)의 조문 내용이다. (ㄱ)~(ㄷ)에 해당하는 조문 번호를 <보기>에서 옳게 연결한 것은?\n[내용]\n· (ㄱ): 각종 테러관련 협약상의 범죄행위에 사용될 것을 알면서 자금을 제공하거나 모집하는 행위를 범죄로 규정\n· (ㄴ): 테러관련 자금 및 그로부터 발생한 이익 등의 확인·탐지·동결·압류를 위한 조치를 규정\n· (ㄷ): 금융기관의 실명확인 조치 및 의심스러운 거래 보고제도 마련을 권고\n[보기] a.제2조  b.제7조  c.제8조  d.제18조',
  ['ㄱ-a, ㄴ-c, ㄷ-d.','ㄱ-a, ㄴ-b, ㄷ-d.','ㄱ-a, ㄴ-d, ㄷ-c.','ㄱ-b, ㄴ-c, ㄷ-d.'],0,
  '(ㄱ)은 제2조(범죄행위 규정), (ㄴ)은 제8조(몰수를 위한 확인·탐지·동결·압류), (ㄷ)은 제18조(실명확인·의심거래보고제도)에 대한 설명이에요. 제7조는 관할권 확립에 관한 조문으로, 이 문제에서는 함정 보기로 쓰였어요.','ultra'),
M('jd1_2',
  '다음 중 국제조약·선언과 핵심 내용의 연결로 옳지 않은 것은?',
  ['바젤위원회 선언(1988) - 은행의 CDD, 내부절차 수립 등을 권고하는 자율 선언.','비엔나 협약(1988) - 마약범죄를 전제범죄로 규정.','볼프스버그 준칙 - UN 총회 결의로 채택된 다자조약으로 모든 회원국에 법적 구속력을 가진다.','팔레모 협약(2000) - 3인 이상 조직범죄단체의 국제적 중대범죄 처벌을 위한 국가간 협력·입법의무 규정.'],2,
  '볼프스버그 준칙은 UN이 채택한 다자조약이 아니라, 12개 선진은행의 모임인 Wolfsberg 그룹이 자율적으로 제정한 준칙(Private Banking CDD 지침, 환거래은행 주의의무 준칙 등)이에요. 법적 구속력이 있는 국제조약이 아니에요.','ultra'),
M('jd1_2',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 볼프스버그 그룹의 Private Banking 관련 CDD 지침(Global AML Guidelines for Private Banking)은 2000년 10월에 발표되었다.\nㄴ. 볼프스버그 그룹의 환거래은행 주의의무 준칙(Wolfsberg AML Principles for Correspondent Banking)은 2002년 11월에 발표되었다.\nㄷ. 볼프스버그 그룹은 12개 선진은행들의 모임이다.\nㄹ. 바젤위원회는 2001년 10월에 은행의 고객확인의무 관련 보고서(Customer due diligence for banks)를 발표하였고, 이는 FATF 40개 권고사항 개정에 영향을 끼쳤다.',
  ['4개.','3개.','1개.','2개.'],0,
  'ㄱ, ㄴ, ㄷ, ㄹ 모두 옳은 설명이에요. Private Banking 지침(2000.10)과 환거래은행 준칙(2002.11)의 발표 시점을 서로 뒤바꾸지 않고 정확히 기억해야 풀리는 문제예요.','ultra'),
M('jd1_2',
  '메리다 협약(UNCAC)의 구성에 대한 설명으로 옳지 않은 것은?',
  ['이 협약은 공공부문의 부패만을 규율 대상으로 하며 민간부문의 부패행위는 협약의 적용범위에서 제외된다.','제3장은 범죄규정 및 법집행에 관한 사항을 다룬다.','제2장은 예방조치로, 독립적인 부패방지기구 설치와 공직자 재산공개 등을 포함한다.','제4장은 국제협력, 제5장은 자산회복에 관한 사항을 다룬다.'],0,
  '메리다 협약은 선·후진국, 공공·민간 부문 모두를 대상으로 하는 반부패 국제규범이에요. 민간부문이 제외된다는 설명은 옳지 않아요.','ultra'),
M('jd1_2',
  '비엔나 협약(1988)과 우리나라의 이행에 대한 설명으로 옳지 않은 것은?',
  ['우리나라는 1998년 이 협약 가입에 대하여 국회에서 비준하였다.','이 협약의 주요내용에는 마약범죄의 정의, 자금세탁 행위의 범죄화·몰수, 국제협력 등이 포함되며, 조직범죄단체 가담죄도 이 협약에서 처음 규정되었다.','비엔나 협약은 마약거래방지에 관한 전 세계적 규범이 되고 있는 UN 협약이다.','우리나라는 이 협약을 기준으로 1995년 마약류 불법거래 방지에 관한 특례법을 제정하였다.'],1,
  '조직범죄단체 가담죄를 처벌 대상으로 규정한 것은 비엔나 협약이 아니라 팔레모 협약(2000)이에요. 비엔나 협약의 핵심은 마약범죄 정의, 자금세탁행위 범죄화·몰수, 범죄인도·사법공조예요.','ultra'),
M('jd1_2',
  '팔레모 협약(UN국제조직범죄방지협약)의 체결 배경 및 내용에 대한 설명으로 옳지 않은 것은?',
  ['1998년 유엔총회 결의에 따라 정부간 임시위원회가 설치되었다.','2000년 12월 이탈리아 팔레모에서 협약이 체결되었다.','이 협약은 2인 이상이 관여하는 모든 형태의 범죄를 조직범죄로 규정하며, 범죄의 국제성 여부는 요건이 아니다.','국제조직범죄에 대처하기 위한 포괄적 국제협약을 만들기로 결정하였다.'],2,
  '팔레모 협약은 "3인 이상" 조직범죄단체의 "국제적인" 중대범죄를 대상으로 해요. 2인 이상, 국제성 불요라는 서술은 원문과 다른 오답이에요.','ultra'),
M('jd1_2',
  '<보기> 중 옳은 설명을 모두 고른 것은?\nㄱ. 유럽평의회 범죄수익규제협약은 Council of Europe에 의해 1990년 도입되었다.\nㄴ. 이 협약은 비엔나 협약과 마찬가지로 전제범죄를 마약관련 범죄로 한정한다.\nㄷ. 이 협약은 불법수익이 발생하는 모든 범죄를 자금세탁의 전제범죄로 포함하는 것이 특징이다.\nㄹ. 이 협약의 정식 명칭에는 "Search, Seizure and Confiscation of Proceeds from Crime"이 포함된다.',
  ['ㄱ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄱ, ㄴ, ㄹ.','ㄴ, ㄷ, ㄹ.'],0,
  'ㄱ, ㄷ, ㄹ이 옳아요. ㄴ은 틀려요 — 이 협약은 비엔나 협약과 달리 전제범죄를 마약관련 범죄에 한정하지 않는 것이 핵심 특징이에요.','ultra'),
M('jd1_2',
  '<보기> 중 바젤위원회 선언(1988)의 주요내용에 해당하는 것의 개수는?\nㄱ. 은행의 고객확인의무(CDD)\nㄴ. 자금거래 관련 법규 준수 및 자금세탁 혐의거래에 대한 지원거절\nㄷ. 국제형사경찰기구(인터폴)를 통한 범죄인 인도 절차 수립\nㄹ. 고객비밀보호 관련법규가 허용하는 범위 내에서 수사기관에 대한 협조\nㅁ. 동 원칙 준수와 관련된 내부절차 수립',
  ['5개.','3개.','4개.','2개.'],2,
  '바젤위원회 선언의 주요내용은 ㄱ, ㄴ, ㄹ, ㅁ 4가지예요. ㄷ(인터폴을 통한 범죄인 인도 절차)은 바젤위원회 선언의 내용이 아니라, 다른 국제조약의 사법공조·범죄인인도 관련 내용을 끼워 넣은 함정이에요.','ultra'),
M('jd1_2',
  '테러자금 억제를 위한 국제협약(1999)의 체결 배경에 대한 설명으로 옳지 않은 것은?',
  ['이 협약은 2001년 9.11 테러 발생 이후 그에 대한 대응으로 새롭게 체결된 협약이다.','새로운 방법으로 테러조직을 고사시키고 테러를 줄이려는 의도에서 국제적 공조로 추진되었다.','1999년 국제테러에 대한 경제적 대응조치로서 체결되었다.','기존의 테러대책이 직접적인 테러에만 초점을 맞추어 테러조직의 활동에 효과적으로 대응하지 못했다는 반성에서 촉구되었다.'],0,
  '테러자금 억제를 위한 국제협약은 1999년에 채택되었으며, 이는 2001년 9.11 테러가 발생하기 이전이에요. 9.11 테러 이후 체결된 협약이라는 설명은 시점을 뒤바꾼 오답이에요.','ultra'),
M('jd1_2',
  '메리다 협약(UNCAC)의 채택에 대한 설명으로 옳은 것은?',
  ['2003년 10월 31일 제58차 UN총회에서 채택되었다.','FATF 40 권고사항의 일부로 채택되었다.','1988년 UN 마약류 및 향정신성물질 불법거래방지협약과 동시에 채택되었다.','2000년 12월 이탈리아 팔레모에서 채택되었다.'],0,
  '메리다 협약(UN 부패방지협약)은 2003년 10월 31일 제58차 UN총회에서 채택되었어요. 나머지는 각각 팔레모 협약, 비엔나 협약, FATF 40 권고사항과 혼동을 유도하는 오답이에요.','ultra'),
M('jd1_2',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 팔레모 협약은 3인 이상 조직범죄단체의 국제적 중대범죄 처벌을 위한 국가간 협력의무와 국내 입법의무를 규정한다.\nㄴ. 볼프스버그 준칙은 UN 산하 기구가 제정한 법적 구속력 있는 국제조약이다.\nㄷ. 바젤위원회 선언은 국제결제은행(BIS) 산하 위원회가 발표한 은행 자율 준수 선언이다.\nㄹ. 유럽평의회 범죄수익규제협약은 전제범죄를 마약범죄로 한정하지 않는다는 점에서 비엔나 협약과 차별화된다.\nㅁ. 메리다 협약은 공공부문뿐 아니라 민간부문의 부패도 규율 대상으로 포함한다.',
  ['2개.','5개.','3개.','4개.'],3,
  'ㄱ, ㄷ, ㄹ, ㅁ은 옳은 설명이에요. 팔레모 협약은 3인 이상 조직범죄단체의 국제적 중대범죄 처벌을 위한 국가간 협력의무와 국내 입법의무를 규정하고(ㄱ), 바젤위원회 선언(1988년)은 BIS 산하 바젤은행감독위원회가 발표한 은행 자율 준수 선언이며(ㄷ), 유럽평의회 범죄수익규제협약은 전제범죄를 마약범죄로 한정하지 않는다는 점에서 비엔나 협약과 차별화되고(ㄹ), 메리다 협약은 공공부문뿐 아니라 민간부문의 부패도 규율 대상으로 포함해요(ㅁ). 볼프스버그 준칙은 UN 산하 기구가 아니라 민간 은행 모임이 제정한 자율준칙으로 법적 구속력이 없어 ㄴ만 옳지 않아요.','ultra'),
M('jd1_2',
  '팔레모 협약이 처벌 대상으로 규정하는 행위에 해당하지 않는 것은?',
  ['사법방해.','조직범죄단체 가담.','마약 및 향정신성물질의 불법재배.','범죄수익금 세탁.'],2,
  '마약 및 향정신성물질의 불법재배는 비엔나 협약(1988)의 내용이에요. 팔레모 협약은 조직범죄단체 가담, 범죄수익금 세탁, 사법방해, 각종 부패행위 등을 처벌 대상으로 규정해요.','ultra'),
M('jd1_2',
  '<보기> 중 조약의 체결 배경 설명으로 옳지 않은 것을 모두 고른 것은?\nㄱ. 비엔나 협약은 마약거래방지에 관한 UN 규범을 목적으로 한다.\nㄴ. 팔레모 협약은 1998년 UN총회 결의에 따라 정부간 임시위원회를 설치하여 국제조직범죄에 대응하기 위해 체결되었다.\nㄷ. 바젤위원회 선언은 UN총회의 결의로 채택된 다자조약이다.\nㄹ. 메리다 협약은 선·후진국, 공공·민간 부문 모두를 대상으로 하는 반부패 국제규범이다.',
  ['ㄷ만.','ㄱ, ㄷ.','ㄱ, ㄴ, ㄷ.','ㄷ, ㄹ.'],0,
  'ㄷ만 틀려요 — 바젤위원회 선언은 UN총회가 채택한 다자조약이 아니라, 국제결제은행(BIS) 산하 바젤위원회가 발표한 은행 자율 준수 선언이에요. ㄱ, ㄴ, ㄹ은 모두 옳은 설명이에요.','ultra'),
M('jd1_3',
  'FATF의 설립과 대응영역 확대에 대한 설명으로 옳지 않은 것은?',
  ['FATF는 1989년 설립 당시부터 대량살상무기 확산금융 방지를 핵심 설립 목적으로 규정하였으며, 이후 영역이 축소되어 현재는 자금세탁 방지에만 집중하고 있다.','FATF는 총회(Plenary), 운영위원회(Steering Group), 5개 실무그룹(Working Group)으로 운영된다.','FATF의 대응영역은 마약자금(1989년) → 중대범죄의 자금세탁(1996년) → 테러자금조달(2001년) → 대량살상무기 확산금융(2012년) 순으로 확대되어 왔다.','FATF는 UN협약 및 안전보장이사회 결의와 관련된 금융조치(Financial Action)의 이행을 위한 행동기구로 1989년 G7 정상회담의 합의로 설립되었다.'],0,
  'FATF는 1989년 마약자금 대응을 시작으로 이후 중대범죄 자금세탁(1996) → 테러자금조달(2001) → 대량살상무기 확산금융(2012) 순으로 영역을 지속적으로 "확대"해 왔어요. 설립 당시부터 확산금융이 핵심 목적이었다거나 이후 영역이 "축소"되었다는 설명은 정반대의 오답이에요.','ultra'),
M('jd1_3',
  '다음은 FATF 실무그룹에 대한 설명이다. (ㄱ)~(ㅁ)에 해당하는 실무그룹명을 <보기>에서 옳게 연결한 것은?\n(ㄱ) 고위험·비협조 국가를 가려내 전략적 미비점을 지적하고 제재(ICRG 프로세스)를 논의한다.\n(ㄴ) ML/TF의 새로운 빈법을 점검·확인하고 필요한 사항을 PDG에 제공한다.\n(ㄷ) 회원국의 상호평가·후속조치 운영, 감독, 상호평가 방법론의 발전을 담당한다.\n(ㄹ) FSRBs 소속 국가들의 국제기준 이행을 지원하고, FSRB와 FATF 상호 간 이해를 증진한다.\n(ㅁ) 국제기준을 명확히 하고 발전시키는 것과 지침서 개발, FATF의 전략·우선순위 검토를 담당한다.\n[보기] a.ECG  b.PDG  c.RTMG  d.ICRG  e.GNCG',
  ['ㄱ-d, ㄴ-c, ㄷ-b, ㄹ-e, ㅁ-a.','ㄱ-d, ㄴ-c, ㄷ-a, ㄹ-e, ㅁ-b.','ㄱ-d, ㄴ-a, ㄷ-c, ㄹ-e, ㅁ-b.','ㄱ-e, ㄴ-c, ㄷ-a, ㄹ-d, ㅁ-b.'],1,
  '(ㄱ)ICRG(국제협력점검), (ㄴ)RTMG(유형론), (ㄷ)ECG(평가·이행), (ㄹ)GNCG(지역기구협력), (ㅁ)PDG(정책개발)예요. 5개 실무그룹의 영문 약자와 역할을 전부 정확히 매칭해야 풀리는 문제예요.','ultra'),
M('jd1_3',
  '권고 10(고객확인의무, CDD)에 대한 설명으로 옳지 않은 것은?',
  ['금융회사는 기준금액 USD/EUR 15,000을 초과하는 일회성 거래행위를 하는 경우 고객확인을 이행할 의무가 있다.','이 권고사항의 기준금액은 가상자산사업자에게 적용되는 기준금액과 동일하게 USD/EUR 1,000이다.','금융회사의 익명 또는 가명 계좌개설은 금지되어야 한다.','금융회사는 거래관계(business relation)를 수립하는 경우 고객확인을 이행할 의무가 있다.'],1,
  '권고 10(CDD)의 일회성 거래 기준금액은 USD/EUR 15,000이에요. 반면 가상자산사업자(권고 15)에게 적용되는 고객확인 기준금액은 USD/EUR 1,000으로 더 낮아요. 두 기준금액을 서로 같다고 서술한 것이 오답 포인트예요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명을 모두 고른 것은?\nㄱ. 권고 15는 가상자산사업자에게 금융회사에 준하는 자금세탁방지의무(CDD, STR 등)를 부과한다.\nㄴ. 권고 16(전신송금)은 트래블룰과 관련하여, 금융회사가 송금인 및 수취인 정보를 전신송금 및 관련 메시지에 포함하고 기록으로 남기도록 요구한다.\nㄷ. 권고 6(테러 관련 정밀금융제재)은 유엔안보리결의 1267호(1999) 및 후속 결의에 따른 지정 개인·단체에 대한 자산동결을 요구한다.\nㄹ. 권고 15의 가상자산 고객확인 기준금액과 권고 10의 일반 금융회사 기준금액은 동일하게 설정되어 있다.',
  ['ㄴ, ㄷ, ㄹ.','ㄱ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄹ.','ㄱ, ㄴ, ㄷ.'],3,
  'ㄱ, ㄴ, ㄷ이 옳아요. ㄹ은 틀려요 — 권고 15(가상자산)의 기준금액은 1,000USD/EUR, 권고 10(일반 금융회사)의 기준금액은 15,000USD/EUR로 서로 달라요.','ultra'),
M('jd1_3',
  '권고 22(특정 비금융사업자와 전문직, DNFBPs의 고객확인의무)가 적용되는 상황에 해당하지 않는 것은?',
  ['카지노에서 고객이 기준금액 이상의 금융거래를 행하는 경우.','부동산 중개인이 고객을 위하여 부동산 매매와 관련된 거래에 참여하는 경우.','귀금속상이 고객과 기준금액 이상의 현금거래를 하는 경우.','환거래은행이 요청 금융회사의 사업 성격을 파악하기 위해 국경 간 환거래계약을 체결하는 경우.'],3,
  '환거래은행 관련 조치(요청 금융회사의 사업 성격 파악 등)는 권고 13(환거래은행)의 내용이에요. 권고 22는 카지노, 부동산 중개인, 귀금속상, 변호사·공증인 등 특정 비금융사업자(DNFBP)와 전문직에 적용되는 고객확인의무를 규정해요.','ultra'),
M('jd1_3',
  '권고 37(국제사법공조), 권고 38(국제사법공조: 동결과 몰수), 권고 39(범죄인 송환), 권고 40(기타 국제협력)에 대한 설명으로 옳지 않은 것은?',
  ['권고 38에 따라 각국은 외국으로부터 세탁된 재산 등에 대한 확인·동결·압수·몰수 요청이 있는 경우 신속한 대응을 취할 수 있는 권한을 가지고 있어야 한다.','권고 40에 따라 각국은 자국의 권한당국이 관련 국제협력을 자발적으로 또는 상대의 요청에 의하여 신속하고 효과적으로 제공할 수 있도록 하여야 한다.','권고 37에 따라 각국은 자금세탁·전제범죄·테러자금조달 수사·기소·사법절차에서 상호 최대한의 사법공조를 제공하여야 한다.','권고 39에 따라 각국은 자국민을 인도하지 않는 경우, 그 사건을 자국의 권한당국에 회부하여 기소할 의무를 부담하지 않으며 사건을 그대로 종결할 수 있다'],3,
  '권고 39에 따라 각국은 자국민을 인도(송환)하지 않는 경우, 오히려 지체 없이 그 사건을 자국의 권한당국에 회부하여 기소할 의무를 부담해요(인도 대신 기소, aut dedere aut judicare 원칙). "기소 의무를 부담하지 않고 종결할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd1_3',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 권고 39(범죄인 송환)는 자금세탁 및 테러자금조달을 범죄인 송환 대상에서 명시적으로 제외하도록 규정한다.\nㄴ. 범죄인 송환을 위해 쌍방가벌성이 요구되는 경우, 양국이 해당 범죄행위를 동일한 용어로 지칭하지 않더라도 양국 모두 그 행위를 불법화하고 있다면 쌍방가벌성 요건이 충족된 것으로 간주되어야 한다.\nㄷ. 권고 37(국제사법공조)에 따라 국내 체제와 일관성이 있다면, 해외 사법당국이나 법집행당국이 국내 관련기관에 직접 공조를 요청하는 경우에도 사용될 수 있어야 한다.\nㄹ. 국제사법공조에 관한 권고사항은 은행의 비밀유지를 이유로 공조 제공을 거절할 수 있도록 예외를 명시적으로 허용하고 있다.',
  ['2개.','4개.','3개.','1개.'],0,
  'ㄴ, ㄷ은 옳은 설명이에요. 권고 39는 오히려 자금세탁·테러자금조달을 범죄인 송환이 가능한 범죄로 규정하도록 요구하며(ㄱ), 국제사법공조 권고사항은 은행 비밀유지를 이유로 공조를 거절하는 것을 허용하지 않아요(ㄹ).','ultra'),
M('jd1_3',
  '다음 중 FATF 40개 권고사항의 번호와 주제가 옳게 짝지어진 것은?',
  ['권고 8 - 금융정보분석원(FIU)','권고 15 - 신기술(New Technologies)·가상자산','권고 20 - 특정비금융사업자 및 전문직(DNFBPs)의 의심거래보고','권고 29 - 비영리조직(Non-Profit Organisations)'],1,
  '권고 15는 신기술(New Technologies)·가상자산을 규율해요. 참고로 권고 8은 비영리조직(NPO), 권고 20은 의심거래보고(STR), 권고 29는 금융정보분석원(FIU)을 다뤄요. 나머지 선택지는 번호와 주제가 서로 뒤바뀐 오답이에요.','ultra'),
M('jd1_3',
  'FATF 40 권고사항의 영역 구분에 대한 설명으로 옳지 않은 것은?',
  ['"Ⅴ. 법인과 법률관계의 투명성과 실제소유자" 영역에는 신탁 등 법률관계의 악용을 방지하는 권고 25가 포함된다.','"Ⅳ. 예방조치" 영역에는 각국의 위험평가 결과에 따라 FIU를 설립하고 상호평가를 실시하는 절차가 핵심 내용으로 포함된다.','"Ⅵ. FIU 설립 등 관계기관의 권한·책임" 영역에는 금융회사에 대한 규정과 감독, DNFBP 검사, 현금휴대반출입 등이 포함된다.','"Ⅶ. 국제협력" 영역에는 국제사법공조, 범죄인 송환, 기타 국제협력이 포함된다.'],1,
  'FIU 설립과 상호평가 절차는 "Ⅵ. FIU 설립 등 관계기관의 권한·책임" 영역과 "Ⅰ. AML/CFT 정책과 조정" 영역(위험평가)에 해당해요. "Ⅳ. 예방조치"는 가명계좌 금지, 고객확인, 기록보관 등 금융회사등의 사전적 조치를 다루는 영역이에요.','ultra'),
M('jd1_3',
  'FATF의 상호평가(Mutual Evaluation)에 대한 설명으로 옳지 않은 것은?',
  ['제4차 라운드 기준 상호평가는 일반적으로 7~8년 주기로 실시되었다.','상호평가는 FATF 40 권고사항(기술적 평가)과 11개 효과성 평가(즉시성과)의 이행 여부를 평가 대상으로 한다.','상호평가는 FATF가 각국의 국제기준 이행을 점검하고 후속조치를 통해 이행을 지속 관리하며, 미이행국에 금융제재조치를 실행하는 과정을 말한다.','상호평가팀은 회원국의 전문가(법률 2, 법집행 2, 금융 2, 사무국 2명 등 총 10명)가 평가하는 자체평가(Self-Assessment) 방식으로 진행되며, 다른 회원국 전문가의 참여 없이 자국 전문가로만 구성된다.'],3,
  '상호평가는 자국 전문가만으로 평가하는 자체평가가 아니라, 다른 회원국의 전문가들이 평가하는 동료평가(Peer Review) 방식이에요. 평가팀은 법률 2, 법집행 2, 금융 2, 사무국 2명 등 총 10명으로 구성되며, 이들은 피평가국이 아닌 다른 회원국 소속 전문가예요.','ultra'),
M('jd1_3',
  '다음은 FATF 상호평가 절차이다. (ㄱ)~(ㅂ)을 진행 순서대로 옳게 나열한 것은?\nㄱ. 현지실사(2~3주)\nㄴ. 자료 제출(6개월)\nㄷ. 보고서 작성(6~8개월)\nㄹ. 총회 토의\nㅁ. 후속조치 결정\nㅂ. 제재(ICRG 프로세스)',
  ['ㄷ → ㄴ → ㅂ → ㄹ → ㅁ → ㄱ.','ㅁ → ㄴ → ㅂ → ㄷ → ㄱ → ㄹ.','ㅂ → ㄴ → ㅁ → ㄷ → ㄹ → ㄱ.','ㄴ → ㄱ → ㄷ → ㄹ → ㅁ → ㅂ.'],3,
  'FATF 상호평가 절차는 자료 제출(6개월) → 현지실사(2~3주) → 보고서 작성(6~8개월) → 총회 토의 → 후속조치 결정 → 제재(ICRG 프로세스) 순으로 진행돼요. 자료 제출이 현지실사보다 먼저라는 점에 유의해야 해요.','ultra'),
M('jd1_3',
  '지역별 자금세탁방지기구(FSRBs)에 대한 설명으로 옳지 않은 것은?',
  ['유라시아 자금세탁방지기구(EAG)는 2004년 10월 모스크바에서 설립되었으며 Russia, China, India 등이 회원국이다.','FATF 기준을 준수하는 전 세계의 지역별 자금세탁방지기구는 9개의 FATF 스타일 지역기관(FSRB)으로 구성되어 있다.','FSRB는 FATF 기준의 이행에는 관여하지 않으며, 오직 정보 교환 목적의 친목 협의체 역할만을 수행한다.','FSRB의 글로벌 네트워크는 200개 이상의 정부와 20개 이상의 관찰자 국제조직을 하나로 묶는 데 기여하고 있다.'],2,
  'FSRB는 전 세계 AML/CFT 활동의 상당 부분을 감독하며, FATF 기준을 이행하기 위해 회원국의 관할권을 지원하고 회원의 AML/CFT 체제를 평가해요. 단순 친목 협의체가 아니라 실질적인 감독·평가 기능을 수행해요.','ultra'),
M('jd1_3',
  '에그몬 그룹(Egmont Group)에 대한 설명으로 옳은 것은?',
  ['에그몬 그룹의 정보교환은 공개된 일반 인터넷망을 통해서만 이루어지며 별도의 보안 시스템은 없다.','에그몬 그룹은 FATF의 정식 5개 실무그룹 중 하나로서 FATF 총회의 직속 산하기관이다.','에그몬 그룹은 각국의 FIU(금융정보분석기구) 간 협력과 정보교환을 위한 국제협의체이다.','우리나라 FIU는 에그몬 그룹에 가입되어 있지 않아 다른 국가와 정보를 교환할 수 없다.'],2,
  '우리나라 FIU는 에그몬 그룹의 보안 웹사이트(ESW)를 통해 수시로 자금세탁 관련 업무상 필요한 정보를 각국 금융정보분석기구와 교환하고 있어요. 에그몬 그룹은 FATF의 정식 실무그룹이 아니라 FIU 간 협력을 위한 별도의 국제협의체이며, 정보교환은 보안 웹사이트를 통해 이루어져요.','ultra'),
M('jd1_4',
  '유럽연합(EU) 자금세탁방지지침(AMLD)의 첫 번째 지침(AMLD 1, Directive 91/308/EEC)에 대한 설명으로 옳지 않은 것은?',
  ['당시 적용 대상은 금융기관 중심이었고, 의심스러운 거래를 발견할 경우 금융정보분석원에 보고하도록 하는 최초의 공식 보고시스템을 도입하였다.','이 지침은 처음부터 마약범죄뿐 아니라 모든 중대범죄를 자금세탁의 전제범죄로 광범위하게 규정하였다.','1991년 6월 10일 유럽이사회(Council of the European Communities)가 채택하였다.','"자금세탁을 목적으로 금융시스템의 사용 방지"를 주요 내용으로 하며, 회원국들이 금융시스템에 자금세탁방지를 위한 법을 제정하도록 요구하였다.'],1,
  'AMLD 1(첫 번째 지침)은 1988년 비엔나 협약에서 정의한 대로 마약밀매에 대한 자금세탁에 대해서만 전제범죄를 한정하였고, 회원국들이 전제범죄를 다른 범죄로 확대하도록 "장려"하는 데 그쳤어요. 처음부터 모든 중대범죄를 전제범죄로 규정했다는 설명은 옳지 않아요.','ultra'),
M('jd1_4',
  '유럽연합(EU) 자금세탁방지지침(AMLD)의 법적 성격에 대한 설명으로 옳지 않은 것은?',
  ['EU의 AMLD는 전 세계 모든 국가에 공통으로 적용되는 국제조약으로서, EU 비회원국에도 동일한 법적 구속력을 가진다.','EU는 "국가 공동체"로서의 독특한 성격상, 여러 회원국의 의회 승인 없이도 법적 효력을 가진 조치를 채택할 수 있다.','EU의 지침은 회원국들의 국내법보다 우선한다.','EU 지침은 자금세탁방지와 관련하여 바젤위원회나 FATF의 국제기준보다 훨씬 더 많은 비중을 차지하기도 한다.'],0,
  'EU의 AMLD는 EU 회원국에만 적용되며, EU 비회원국에는 적용되지 않아요. 전 세계 모든 국가에 적용되는 국제조약이라는 설명은 옳지 않아요.','ultra'),
M('jd1_4',
  '다음 <보기> 중 옳은 설명을 모두 고른 것은?\nㄱ. AMLD 1(1991)의 적용 대상은 금융기관 중심이었고, 당시 비금융부문은 적용 대상에 포함되지 않았다.\nㄴ. AMLD 1은 회원국들에게 고객알기제도(KYC) 의무를 부과하였다.\nㄷ. AMLD 1이 도입한 의심거래 보고 체계는 세계 최초의 공식적인 의심스러운 활동 보고시스템으로 평가된다.\nㄹ. AMLD 1은 유럽연합 회원국뿐 아니라 아시아·아메리카 국가에도 곧바로 법적 구속력을 가졌다.',
  ['ㄱ, ㄴ, ㄷ.','ㄴ, ㄷ, ㄹ.','ㄱ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄹ.'],0,
  'ㄱ, ㄴ, ㄷ이 옳아요. ㄹ은 틀려요 — EU 지침은 EU 회원국에만 적용되며, 다른 대륙의 비회원국에는 법적 구속력이 없어요.','ultra'),
M('jd1_5',
  '미국의 금융감독체계에 대한 설명으로 옳지 않은 것은?',
  ['미국의 금융감독체계는 우리나라와 달리 금융분야별로 감독기구가 구분되어진 "분리형 금융감독체계"를 가지고 있다.','미국은 연방준비제도(FRS) 또는 연방예금보험공사(FDIC) 가입 여부와 무관하게 모든 은행이 단일한 하나의 감독기관으로부터만 감독을 받는 통합형 체계를 가지고 있다.','미국 재무부(Department of Treasury)는 경제와 금융시스템을 총괄하는 행정부처로서 AML/CFT 업무를 포함한 금융정책과 감독에 관한 입법 관련 업무를 수행한다.','금융안정감독협의회(FSOC)는 금융시스템을 모니터링하고 대응하는 기구이며, 소비자금융보호국(CFPB)은 금융소비자 보호를 전담한다.'],1,
  '미국은 국법은행, 연준 가입 주법은행, 외국은행지점, 은행지주회사에 따라 감독기관이 다르고 중복될 수도 있는 체계예요. "단일한 하나의 감독기관으로부터만 감독"받는다는 설명은 미국 금융감독체계의 특징(분리형, 가입 여부에 따른 중복 가능성)과 정반대예요.','ultra'),
M('jd1_5',
  '다음 <보기>의 미국 금융감독기관과 그 핵심 역할의 연결로 옳지 않은 것은?\nㄱ. 연방준비제도이사회(FRB) - 은행감독을 주도, 통화정책 수행, 금융위기 관리·예방, 결제제도 안정성 확보\nㄴ. 통화감독청(OCC) - 재무부 산하 기관으로 국법은행 및 연방저축기관협회(FSA)를 감독\nㄷ. 증권거래위원회(SEC) - 1934년 증권거래법에 근거해 증권회사·투자자문사·뮤추얼펀드 등을 감독\nㄹ. 금융범죄단속네트워크(FinCEN) - 대통령 직속 기관으로서 국내외 개인·단체에 대한 경제제재 및 자산동결을 주된 업무로 한다',
  ['ㄴ.','ㄱ.','ㄷ.','ㄹ.'],3,
  'FinCEN은 대통령 직속 기관이 아니라 "미국 재무부 산하" 소속기관으로, 1990년 4월 25일 설립되었어요. 경제제재·자산동결(SDNs List 등)을 주된 업무로 하는 기관은 FinCEN이 아니라 OFAC(해외자산통제국)이에요.','ultra'),
M('jd1_5',
  '미국의 OFAC(해외자산통제국)과 FinCEN에 대한 설명으로 옳지 않은 것은?',
  ['OFAC은 1950년에 설립되어 미국 정부의 외교정책 수단으로서 중요한 역할을 수행하고 있다.','OFAC과 FinCEN은 동일한 법령(SDNs List 관련 규정)에 근거하여 완전히 동일한 목적과 기능을 수행하는 사실상 같은 조직이다.','FinCEN은 은행비밀법(BSA)에 근거하여 금융범죄 예방과 차단을 목적으로 업무를 수행하며, 이는 OFAC과 성격이 다른 목적을 가진다.','OFAC은 특별지정제재대상 목록(SDNs List)을 발표하며, 국내외 단체·개인에 대해 자산동결이나 거래 통제를 할 수 있다.'],1,
  'OFAC과 FinCEN은 둘 다 미국 재무부 산하이지만 목적이 달라요. OFAC은 경제제재(자산동결·거래통제, SDNs List)를 통한 외교정책 수단이고, FinCEN은 BSA에 근거한 금융범죄 예방·차단(SAR 접수·분석 등)을 목적으로 해요. "완전히 동일한 목적과 기능"이라는 설명은 옳지 않아요.','ultra'),
M('jd1_5',
  '미국 금융기관의 의심활동보고(SAR)에 대한 설명으로 옳은 것은?',
  ['SAR은 OFAC에 제출하여야 하며 FinCEN과는 무관하다.','SAR 제출 의무는 금융기관이 아니라 개인 고객에게 부과된다.','금융기관은 은행비밀법(BSA) 및 31 USC 5318에 근거하여 30일 이내에 FinCEN에 의심활동보고(SAR)를 제출하여야 한다.','SAR 제출 기한은 법령상 정해져 있지 않아 금융기관이 자율적으로 결정한다.'],2,
  'BSA 및 31 USC 5318(제4편)에 근거하여, 금융기관은 30일 이내에 FinCEN에 의심활동보고(SAR)를 제출하도록 의무화되어 있어요.','ultra'),
M('jd1_5',
  '미국 증권거래위원회(SEC)의 기능에 대한 설명으로 옳지 않은 것은?',
  ['증권회사(Broker-Dealer), 투자자문사, 신용평가사 등에 대한 검사 및 감독 기능을 가진다.','연방증권관련 법의 해석 및 집행규정의 제정·개정 기능을 가진다.','1934년 증권거래법(Securities Exchange Act)을 설립근거로 하는 독립적인 연방 정부기관이다.','SEC는 은행지주회사에 대한 감독권을 독점적으로 보유하며, FRB는 은행지주회사 감독에 관여하지 않는다.'],3,
  '은행지주회사에 대한 감독권과 역할은 1999년 그램-리치-블라일리법(금융서비스현대화법)에 따라 FRB(연방준비제도이사회)에 규정되어 있어요. SEC가 은행지주회사 감독권을 독점한다는 설명은 옳지 않아요.','ultra'),
M('jd1_5',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 미국 재무부는 우리나라의 기획재정부와 금융위원회의 역할을 함께 수행하는 성격을 가진다.\nㄴ. 국법은행에 대한 감독은 미국 재무부 산하 통화감독청(OCC)이 주로 담당한다.\nㄷ. 연방준비제도(FRS)에 가입한 은행은 오직 연방준비은행(FRB)만이 배타적으로 감독권을 가지며 주정부 금융당국은 관여하지 않는다.\nㄹ. FinCEN은 1950년에 설립되었으며 OFAC과 설립 연도가 동일하다.',
  ['3개.','2개.','4개.','1개.'],1,
  'ㄱ, ㄴ은 옳은 설명이에요. FRS 가입 은행은 FRB뿐 아니라 주정부 금융당국도 함께 감독권을 가지며(ㄷ), FinCEN(1990년 설립)과 OFAC은 설립 연도가 동일하지 않아요(ㄹ).','ultra'),
M('jd1_5',
  '다음 미국 금융감독기관(관련 법령·설립 연도 기준)을 이른 순서대로 옳게 나열한 것은?\nㄱ. 해외자산통제국(OFAC)\nㄴ. 증권거래위원회(SEC)\nㄷ. 금융범죄단속네트워크(FinCEN)',
  ['ㄷ → ㄱ → ㄴ.','ㄱ → ㄴ → ㄷ.','ㄴ → ㄷ → ㄱ.','ㄴ → ㄱ → ㄷ.'],3,
  'SEC의 근거법인 증권거래법은 1934년, OFAC은 1950년, FinCEN은 1990년에 각각 제정·설립되었어요. 세 기관의 정확한 시점을 알아야 순서를 맞출 수 있는 문제예요.','ultra'),
M('jd2_6',
  '우리나라의 AML/CFT 제도 도입 배경과 체계에 대한 설명으로 옳지 않은 것은?',
  ['우리나라의 AML/CFT 제도는 국제사회의 요구와 무관하게 순수하게 국내적 필요에 의해 독자적으로 발전한 것으로, FATF 40 권고사항과는 별개의 체계를 가지고 있다.','우리나라 AML/CFT 체계는 금융회사등이 고객확인(CDD)을 통한 의심거래보고(STR)와 고액현금거래보고(CTR)를 FIU에 보고하고, FIU는 법집행기관에 정보를 제공하여 범죄수사 등을 통해 자금세탁 및 테러자금조달을 방지하는 구조이다.','UN, OECD 등 국제사회와 FATF가 각국에 자금세탁방지체계를 강화할 것을 촉구하는 상황에서, 2001년 외환거래 자유화조치에 따른 불법자금 유출입 방지 대책 등이 필요하여 AML/CFT제도를 도입하였다.','2010년 World Bank는 자금세탁방지를 위한 법률제도의 요구사항으로 8개 항목을 제시하였다.'],0,
  '우리나라의 AML/CFT 체계는 UN·OECD 등 국제사회와 FATF의 요구, 그리고 FATF 40 권고사항의 핵심조치사항(위험의 확인, 예방조치 적용, 권한당국의 권한·책임 정립, 법인·신탁의 투명성 강화, 국제협력 촉진 등)에 근거하여 발전해 왔어요. "국제사회의 요구와 무관"하다는 설명은 옳지 않아요.','ultra'),
M('jd2_6',
  'FATF 40 권고사항과 테러자금조달금지제도(CFT)에 대한 설명으로 옳지 않은 것은?',
  ['자금세탁방지제도(AML)는 자금세탁을 범죄화하고 자금세탁의 전제범죄를 지정하여 범죄수익을 몰수 및 추징하는 것이다.','자금세탁과 테러자금의 범죄화 정의는 국제협력을 위해 전 세계 모든 국가가 완전히 동일한 단일 협약(FATF 40 권고사항)에만 근거하며, 비엔나 협약이나 팔레모 협약과는 무관하다.','테러자금조달금지제도(CFT)는 테러자금조달을 범죄로 처벌하고 관련 자산을 동결 및 몰수하는 것을 말한다.','테러자금조달금지제도(CFT)의 주요내용에는 테러자금조달행위 처벌, 테러자금조달 의심거래에 대하여 금융회사등이 FIU에 보고, 테러 관련자 자산의 동결과 금융거래 허가제도 운영이 포함된다.'],1,
  '자금세탁과 테러자금의 범죄화 정의는 비엔나 협약과 팔레모 협약에 근거해요. FATF 40 권고사항만이 유일한 근거라는 설명, 비엔나·팔레모 협약과 무관하다는 설명은 옳지 않아요.','ultra'),
M('jd2_7',
  '금융실명제의 제정 배경과 추진 과정에 대한 설명으로 옳지 않은 것은?',
  ['제2차 금융실명제 추진(1987년)은 노태우 정부의 대선공약으로 추진되었으나, 1989년 경기 악화와 증시 폭락으로 여론이 악화되어 1990년 3월 유보선언을 하였다.','금융실명제는 1982년에 처음 추진되었으나, 1993년 김영삼 대통령의 긴급 재정경제명령으로 전격 시행되었다.','제1차 금융실명제 추진(1982년)은 이철희·장영자 거액 어음 부도사건을 계기로 하였으나 국회 논의 과정에서 보류되었다.','제3차 금융실명제 추진(1993년)은 국회의 입법 절차를 통한 정식 법률 제정으로 이루어졌으며, 대통령의 긴급명령과는 무관하다.'],3,
  '제3차 금융실명제 추진은 1993년 8월 12일 김영삼 정부가 "대통령 긴급명령 발표"를 통해 금융실명제를 전격 발표한 것이에요. 부작용을 최소화하기 위해 국회의 정식 입법 절차가 아닌 대통령의 긴급명령을 통해 신속하게 실시했다는 점이 핵심이에요.','ultra'),
M('jd2_7',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 금융실명제 긴급명령의 주요내용에는 실명거래의 의무·대상 및 범위, 기존 비실명 금융자산에 대한 조치가 포함된다.\nㄴ. 금융실명제 긴급명령의 주요내용에는 실명전환 의무기간과 유예기간 내 실명전환하지 않은 자산에 대한 과징금이 포함된다.\nㄷ. 금융실명제 긴급명령의 주요내용에는 국세청 자금출처조사의 범위는 포함되지 않으며 이는 별도의 세법령 사항이다.\nㄹ. 금융실명제 긴급명령은 긴급명령 발동요건의 충족 여부와는 무관하게 시행되었다.',
  ['4개.','1개.','2개.','3개.'],2,
  'ㄱ, ㄴ은 옳은 설명이에요. 금융실명제 긴급명령의 주요내용에는 국세청 자금출처조사의 범위도 포함되어 있고(ㄷ), 긴급명령은 발동요건을 충족하여 시행되었어요(ㄹ).','ultra'),
M('jd2_7',
  '금융실명법의 AML/CFT 관련 주요 특징 중 "실지명의의 확인"에 대한 설명으로 옳지 않은 것은?',
  ['실명확인증표의 사진으로 본인 식별이 어려운 경우, 다른 실명확인증표가 없더라도 계좌 개설 신청서에 서명을 받는 것만으로 실명확인 절차를 대체할 수 있다.','제시된 실명확인증표의 사진에 의하여 본인 여부 식별이 어려운 경우에는 다른 실명확인증표를 보완용으로 사용이 가능하다.','실명확인은 성명과 주민등록번호의 확인 및 실명확인증표에 첨부된 사진 등에 의하여 거래자 본인 여부를 확인해야 한다.','금융회사등은 실명에 의해 금융거래를 해야 한다.'],0,
  '실명확인증표의 사진으로 본인 식별이 어려운 경우에는 다른 실명확인증표를 보완용으로 사용하는 것이 원칙이에요. "다른 증표 없이 서명만으로 대체할 수 있다"는 서술은 옳지 않아요.','ultra'),
M('jd2_7',
  '금융실명법상 차명 금융거래 금지에 대한 설명으로 옳지 않은 것은?',
  ['불법 차명거래를 알선·중개한 금융회사등의 임직원에게는 3천만원 이하의 과태료가 부과될 수 있다.','불법 차명거래를 알선·중개한 금융회사등의 종사자는 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.','불법재산의 은닉, 자금세탁행위, 공중협박자금조달행위와 함께 강제집행의 면탈, 그 밖의 탈법행위를 목적으로 타인의 실명으로 금융거래를 하는 행위를 금지한다.','차명계좌의 계좌 금전의 소유권은 실제로 자금을 출연한 출연자에게 귀속되는 것으로 추정하며, 차명계좌의 명의자(차명계좌주)에게는 어떠한 권리도 인정되지 않는다.'],3,
  '금융실명법상 차명계좌 금전의 소유권은 "출연자가 아닌 차명계좌주"로 추정돼요. 실제 자금을 낸 출연자에게 소유권이 귀속된다는 설명은 원문과 정반대예요.','ultra'),
M('jd2_7',
  '금융실명법 제2조(정의)에 대한 설명으로 옳지 않은 것은?',
  ['"금융자산"이란 금융회사등이 취급하는 예금, 적금, 부금, 계금, 예탁금, 출자금, 신탁재산, 주식, 채권, 수익증권, 출자지분, 어음, 수표, 채무증서 등 금전 및 유가증권과 그 밖에 이와 유사한 것을 말한다.','"금융거래"란 예금 계좌를 신규로 개설하는 행위만을 의미하며, 기존 계좌를 통한 입금·출금·환매·중개 등의 행위는 금융거래의 정의에서 제외된다.','"실지명의"란 주민등록표상의 명의, 사업자등록증상의 명의, 그 밖에 대통령령으로 정하는 명의를 말한다.','"금융회사등"에는 은행법에 따른 은행뿐 아니라 상호저축은행, 농업협동조합, 수산업협동조합, 신용협동조합, 새마을금고, 보험회사, 체신관서 등이 포함된다.'],1,
  '금융실명법상 "금융거래"란 금융회사등이 금융자산을 수입·매매·환매·중개·할인·발행·상환·환급·수탁·등록·교환하거나 그 이자·할인액 또는 배당을 지급하는 것과 이를 대행하는 것 등을 포괄하는 개념이에요. "신규 계좌 개설만"을 의미한다는 설명은 지나치게 좁게 축소된 오답이에요.','ultra'),
M('jd2_7',
  '금융실명법 제3조에 따른 실명확인 예외(실명을 확인하지 아니할 수 있는 경우)에 해당하지 않는 것은?',
  ['공과금 수납 및 100만원 이하의 송금 등 대통령령으로 정하는 거래.','실명이 확인된 계좌에 의한 계속거래(繼續去來).','고액자산가가 1천만원 이상의 신규 계좌를 개설하는 거래.','외국통화의 매입, 외국통화로 표시된 예금의 수입 또는 외국통화로 표시된 채권의 매도 등 대통령령으로 정하는 기간 동안의 거래.'],2,
  '고액자산가의 1천만원 이상 신규 계좌 개설은 오히려 강화된 고객확인(EDD)이 필요한 고위험 거래에 해당해요. 실명확인 예외 사유가 아니라, 실명확인 예외 사유로는 계속거래, 공과금 수납·100만원 이하 송금, 외국통화 관련 거래 등이 있어요.','ultra'),
M('jd2_7',
  '다음 <보기> 중 금융실명법상 불법 차명거래 알선·중개에 대한 제재로 옳은 것을 모두 고른 것은?\nㄱ. 알선·중개한 금융회사등의 종사자는 5년 이하의 징역에 처할 수 있다.\nㄴ. 알선·중개한 금융회사등의 종사자는 5천만원 이하의 벌금에 처할 수 있다.\nㄷ. 알선·중개한 금융회사등의 임직원에게는 3천만원 이하의 과태료가 부과될 수 있다.\nㄹ. 알선·중개한 금융회사등의 종사자는 형사처벌 없이 과태료만 부과된다.',
  ['ㄱ, ㄴ, ㄷ.','ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄹ.','ㄱ, ㄷ, ㄹ.'],0,
  'ㄱ, ㄴ, ㄷ이 옳아요. ㄹ은 틀려요 — 종사자는 5년 이하의 징역 "또는" 5천만원 이하의 벌금이라는 형사처벌의 대상이며, "형사처벌 없이 과태료만"이라는 설명은 옳지 않아요(과태료는 임직원에게 별도로 부과될 수 있는 사항이에요).','ultra'),
M('jd2_7b',
  '특정 금융거래정보의 보고 및 이용 등에 관한 법률(특정금융정보법)의 제정 배경에 대한 설명으로 옳지 않은 것은?',
  ['반사회적인 범죄행위를 예방하고 건전하고 투명한 금융거래 질서의 확립을 목적으로 하였다.','2001년 제2차 외환자유화 조치에 따른 불법자금의 국내외 유출입에 효율적으로 대처하기 위해 제정되었다.','이 법은 금융실명법이 제정되기 이전인 1993년에 최초로 제정되어 금융실명제의 모법(母法) 역할을 하였다.','금융거래를 이용한 자금세탁행위를 효과적으로 규제하고 국제자금세탁방지기구(FATF)의 기준 준수를 목적으로 하였다.'],2,
  '특정금융정보법은 2001년 제2차 외환자유화 조치를 배경으로 제정되었으며, 1993년에 전격 시행된 금융실명법보다 이후에 제정되었어요. 금융실명법의 "모법"이라는 설명은 옳지 않아요.','ultra'),
M('jd2_7b',
  '특정금융정보법의 연혁에 대한 설명으로 옳지 않은 것은?',
  ['2005년 1월, 고객확인제도(CDD)와 고액현금거래보고제도(CTR)를 도입하였다.','2007년 12월, 공중협박자금조달행위에 대해서도 자금세탁행위와 동일한 규제를 적용하였다.','2009년, 우리나라는 FATF에 최초로 가입하며 동시에 FATF 의장국이 되었다.','2008년 12월, 특정비금융사업자(DNFBPs) 중 카지노에 대하여 자금세탁방지의무를 부과하였다.'],2,
  '2009년 우리나라는 FATF의 자금세탁방지제도 구현을 인정받아 FATF의 정회원으로 가입하였어요. "동시에 FATF 의장국이 되었다"는 내용은 언급된 바 없는 오답이에요.','ultra'),
M('jd2_7b',
  '2013년 특정금융정보법 개정에 대한 설명으로 옳지 않은 것은?',
  ['자금세탁방지를 위한 금융실명법과 특정금융정보법 개정안이 동시에 발의되어 2014년 5월 국회를 통과하였다.','국세청에 조세탈루 징수를 위하여 특정금융거래정보를 제공하도록 하였다.','의심거래보고(STR)의 기준금액을 새로 설정하여 5천만원 이상 거래만 보고하도록 강화하였다.','전산관리자·감독검사자에게 비밀보장 의무를 부과하고, 임직원 제재규정을 명확화하였다.'],2,
  '2013년 개정의 핵심 내용 중 하나는 의심거래보고 "기준금액 폐지"예요. 기준금액을 강화(5천만원으로 설정)했다는 설명은 옳지 않아요 — 오히려 금액 기준 자체를 없앤 것이 개정의 취지예요.','ultra'),
M('jd2_7b',
  '<보기> 중 특정금융정보법의 연도별 개정 내용으로 옳은 것의 개수는?\nㄱ. 2014년 - 불법차명거래 시 의심거래보고 의무를 부과하고, 금융회사등이 고객확인을 할 수 없을 때는 신규거래를 거절하고 당해거래를 종료하도록 개정하였다.\nㄴ. 2016년 - 개인 고객 및 법인·단체 고객의 실제소유자 확인 제도를 전면 폐지하였다.\nㄷ. 2016~17년 - 소액해외송금업에 대해서도 자금세탁방지의무가 부과되었다.\nㄹ. 2016~17년 - 전자금융업, 대부업(자산규모 500억원 이상) 금융거래를 수행하는 금융회사까지 자금세탁방지의무를 부과하였다.',
  ['1개.','4개.','2개.','3개.'],2,
  'ㄱ, ㄷ은 옳은 설명이에요. 2016년 개정은 실제소유자 확인 제도를 폐지한 것이 아니라 확인 방법을 구체화한 것이고(ㄴ), 전자금융업·대부업에 대한 자금세탁방지의무 부과는 2016~17년이 아니라 2019년이에요(ㄹ).','ultra'),
M('jd2_7b',
  '2020~2021년 특정금융정보법 주요 개정 내용에 대한 설명으로 옳지 않은 것은?',
  ['고객확인제도의 일회성 금융거래 기준금액을 전신송금 100만원, 가상자산거래 100만원, 카지노 300만원 등으로 변경하였다.','이 시기 개정에서 가상자산사업자의 자금세탁방지의무 부과와 가상자산사업자와 거래하는 금융회사등의 의무는 포함되지 않았으며, 이는 2022년에 처음 도입되었다.','상호금융에 대한 AML/CFT 검사권한을 금융감독원과 상호금융중앙회에 병행 위탁하였다.','금융거래 종료일로부터 5년간 자료를 보관하도록 하는 의무를 부과하였다.'],1,
  '가상자산사업자의 자금세탁방지의무 부과와 가상자산사업자와 거래하는 금융회사등의 의무는 2020~2021년 개정에 이미 포함되어 있었어요. 2022년에 새로 도입된 것은 가상자산의 "트래블룰" 시행이에요.','ultra'),
M('jd2_7b',
  '2022년과 2024년 특정금융정보법 주요 개정 내용에 대한 설명으로 옳지 않은 것은?',
  ['2024년, 실명확인 입출금계정을 발급할 수 있는 금융회사등이 갖추어야 할 요건을 규정하였다.','2022년, 가상자산의 트래블룰이 시행되어 가상자산사업자가 100만원 상당 이상의 가상자산을 이전하는 경우 송·수신인 정보의 제공·보관 의무가 부과되었다.','2024년, 가상자산이용자보호법상 영업정지 조치를 미이행하거나 부정한 방법으로 금전 등을 수수한 경우라도 가상자산사업자 신고를 직권으로 말소할 수는 없도록 규정하였다.','2024년, 가상자산사업자 변경신고 시 신고사항 유형별로 신고서 제출기한을 달리 정할 수 있도록 고시 위임 근거를 마련하였다.'],2,
  '2024년 개정에서는 가상자산이용자보호법상 영업정지 조치 미이행이나 부정한 방법으로 금전 등을 수수한 경우, 가상자산사업자 "신고를 직권으로 말소할 수 있도록" 규정했어요. "말소할 수는 없다"는 설명은 정반대의 오답이에요.','ultra'),
M('jd2_7b',
  '다음 <보기>의 특정금융정보법 개정 시점을 이른 순서대로 옳게 나열한 것은?\nㄱ. 특정비금융사업자(카지노)에 대한 자금세탁방지의무 부과\nㄴ. 가상자산의 트래블룰 시행\nㄷ. 고객확인제도(CDD)와 고액현금거래보고제도(CTR) 도입\nㄹ. 전자금융업·대부업(자산규모 500억원 이상)에 대한 자금세탁방지의무 부과\nㅁ. FATF 정회원 가입',
  ['ㅁ → ㄴ → ㄱ → ㄹ → ㄷ.','ㄴ → ㄹ → ㅁ → ㄷ → ㄱ.','ㅁ → ㄷ → ㄴ → ㄹ → ㄱ.','ㄷ → ㄱ → ㅁ → ㄹ → ㄴ.'],3,
  '연도 순서는 CDD·CTR 도입(2005.1) → 카지노 자금세탁방지의무(2008.12) → FATF 정회원 가입(2009) → 전자금융업·대부업 의무 부과(2019) → 가상자산 트래블룰 시행(2022)이에요.','ultra'),
M('jd2_7b',
  '<보기> 중 옳지 않은 설명을 모두 고른 것은?\nㄱ. 2007년 12월 개정으로 국세청에 대한 특정금융거래정보 제공범위가 확대되었다.\nㄴ. 2016~17년도 개정으로 국가정보원에 제공하는 특정금융거래정보가 구체화되었다.\nㄷ. 2019년 개정으로 자금세탁방지 및 공중협박자금조달금지에 관한 업무규정이 전면개정되고, 금융회사등의 내부통제 의무가 구체화되었다.\nㄹ. 2020~2021년 개정에서 과태료는 오히려 하향 조정되었다.\nㅁ. 2024년 개정에서 실명확인 입출금계정 발급 요건 규정과 가상자산사업자 변경신고 제출기한 관련 고시 위임 근거가 마련되었다.',
  ['ㄹ, ㅁ.','ㄹ만.','ㄱ, ㄴ, ㄹ.','ㄱ, ㄹ.'],1,
  'ㄹ만 틀려요 — 2020~2021년 개정에서 과태료는 "상향" 조정되었어요. ㄱ, ㄴ, ㄷ, ㅁ은 모두 옳은 설명이에요.','ultra'),
M('jd2_8',
  '우리나라의 자금세탁에 대한 범죄수익 규제체계에 대한 설명으로 옳지 않은 것은?',
  ['전제범죄 자체는 형법 등 개별법에 따라 처벌한다.','불법수익 등의 은닉·가장 및 수수죄는 마약류특례법으로 처벌한다.','범죄수익 등의 은닉·가장죄와 불법수익 등의 은닉·가장죄는 구분 없이 모두 특정금융정보법 하나로만 처벌된다.','범죄수익 등의 은닉·가장죄 및 수수죄는 범죄수익은닉규제법으로 처벌한다.'],2,
  '범죄수익 등의 은닉·가장·수수죄는 범죄수익은닉규제법, 마약류 관련 불법수익 등의 은닉·가장·수수죄는 마약류특례법으로 각각 별도로 처벌해요. 특정금융정보법은 처벌법이 아니라 금융회사등의 고객확인·의심거래보고 등 의무를 규정하는 법이에요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법의 제정 배경에 대한 설명으로 옳은 것은?',
  ['이 법은 특정금융정보법과 완전히 동시에 제정되어, 두 법률 사이에는 어느 쪽이 모법인지를 따질 실익이 전혀 없는 것으로 이해해야 한다','이 법은 1993년 금융실명법과 동시에 제정되어, 금융실명제 도입과 함께 자금세탁 규제의 근간을 마련한 것으로 이해해야 한다','2001년, 범죄로 인한 수익의 자금세탁행위를 규제하고 동 수익의 몰수 및 추징에 관한 특례를 규정함으로써, 동법에 규정된 범죄를 조장하는 경제적 요인을 근원적으로 제거할 목적으로 특정금융정보법과 함께 제정되었다.','이 법은 2009년 우리나라의 FATF 정회원 가입을 계기로 그 이행 의무를 충족하기 위해 처음으로 제정된 신규 입법으로 이해해야 한다'],2,
  '범죄수익은닉규제법은 2001년 범죄로 인한 수익의 자금세탁행위를 규제하고 몰수·추징에 관한 특례를 규정함으로써 범죄를 조장하는 경제적 요인을 근원적으로 제거하기 위해 제정되었어요. 1993년 금융실명법이나 2009년 FATF 가입과는 시기적으로 무관해요.','ultra'),
M('jd2_8',
  '범죄수익은닉규제법상 전제범죄 범위의 확대에 대한 설명으로 옳지 않은 것은?',
  ['2006년 7월 개정에서는 형법상 사기 및 횡령·배임의 죄 중 피해금액이 1억원 이상 3억원 미만인 경우와 관세법 위반 범죄를 전제범죄 범위에 포함시켰다.','2006년 7월, 형법상 사기 및 횡령·배임의 죄(3억원 이상 5억원 미만인 경우)와 식품위생법 위반 범죄를 전제범죄 범위에 포함시켰다.','2009년 3월, 상표법 위반 및 지적재산권 침해범죄를 포함한 저작권법 위반, 컴퓨터프로그램보호법 위반죄를 전제범죄 범위에 포함시켰다.','2009년 6월, 처벌 및 몰수의 대상이 되는 범죄에 공중협박자금조달금지법 위반행위를 추가하여 테러자금조달행위에 대한 제재수단을 확보하였다.'],0,
  '2006년 7월 개정에서는 형법상 사기 및 횡령·배임의 죄(피해금액 3억원 이상 5억원 미만인 경우)와 식품위생법 위반 범죄를 전제범죄 범위에 포함시켰어요. "1억원 이상 3억원 미만, 관세법 위반"이라는 금액·법률명은 옳지 않아요.','ultra'),
M('jd2_8',
  '2022년 1월 범죄수익은닉규제법 개정으로 "특정범죄"의 정의가 어떻게 바뀌었는가에 대한 설명으로 옳은 것은?',
  ['재산상 부정한 이익을 취득할 목적으로 범한 죄로서 사형, 무기 또는 장기 3년 이상의 징역이나 금고에 해당하는 죄(제2호나목에 해당하는 죄는 제외) 등 모두 "특정범죄"에 해당하는 것으로 개정되었다.','자금세탁범죄와 직접 관련된 범죄만을 하나하나 열거하는 열거주의 방식으로 축소 개정되어, 개정 이전보다 오히려 특정범죄의 범위가 좁아진 것으로 이해해야 한다','특정범죄의 정의가 마약류 관련 범죄로만 한정되도록 개정되어, 그 밖의 중대범죄는 특정범죄에서 제외되는 것으로 이해해야 한다','특정범죄의 정의에서 외국인이 국외에서 범한 죄는 국적과 관계없이 예외 없이 모두 제외하도록 개정되어, 속인주의 적용이 완전히 배제된 것으로 이해해야 한다'],0,
  '2022년 1월 개정으로 특정범죄는 재산상 부정한 이익을 취득할 목적으로 범한 죄로서 사형·무기 또는 장기 3년 이상의 징역·금고에 해당하는 죄 등을 포괄적으로 규정하는 방식으로 정의되었어요. 열거주의로의 축소나 마약류 한정, 외국인 국외범죄의 전면 제외는 옳지 않아요.','ultra'),
M('jd2_8',
  '<보기> 중 범죄수익은닉규제법의 연혁으로 옳은 것의 개수는?\nㄱ. 2001년 - 특정금융정보법과 함께 제정\nㄴ. 2006년 7월 - 사기·횡령·배임죄(1억~3억원) 및 도로교통법 위반죄를 전제범죄에 포함\nㄷ. 2006년 7월 - 저작권법·컴퓨터프로그램보호법 위반죄를 전제범죄에 포함\nㄹ. 2014년 - 공중협박자금조달금지법 위반행위를 처벌·몰수 대상 범죄에 추가\nㅁ. 2022년 1월 - 특정범죄의 정의를 재산상 부정한 이익 취득 목적의 중대범죄 등으로 개정',
  ['3개.','4개.','5개.','2개.'],3,
  'ㄱ, ㅁ은 옳은 설명이에요. 2006년 7월 개정은 사기·횡령·배임죄(3억~5억원) 및 식품위생법 위반죄를 포함시킨 것이고(ㄴ), 저작권법 위반죄 포함은 2006년이 아니라 2009년 3월이며(ㄷ), 공중협박자금조달금지법 위반행위 추가는 2014년이 아니라 2009년 6월이에요(ㄹ).','ultra'),
M('jd2_8',
  '범죄수익은닉규제법 제2조(정의)상 "범죄수익"에 해당하는 것에 대한 설명으로 옳지 않은 것은?',
  ['중대범죄에 해당하는 범죄행위에 의하여 생긴 재산은 범죄수익에 해당한다.','성매매알선등행위의처벌에관한법률 위반죄 중 성매매에 제공되는 사실을 알면서 자금·토지 또는 건물을 제공하는 행위와 관련된 자금은 범죄수익에 해당할 수 있다.','범죄수익에서 유래한 재산은 범죄수익의 정의에 포함되지 않으며, 오직 최초 범죄행위로 직접 취득한 재산만 범죄수익으로 인정된다.','중대범죄에 해당하는 범죄행위의 보수(報酬)로 얻은 재산도 범죄수익에 해당한다.'],2,
  '범죄수익은닉규제법상 "범죄수익에서 유래한 재산"이란 범죄수익의 과실(果實)로 얻은 재산, 범죄수익의 대가로 얻은 재산 및 이들 재산의 대가로 얻은 재산 등도 포함하는 별도의 개념으로 규정되어 있어요. 최초 취득 재산만 인정된다는 설명은 옳지 않아요.','ultra'),
M('jd2_8',
  '테러자금금지법(공중 등 협박목적 및 대량살상무기확산을 위한 자금조달행위의 금지에 관한 법률)에 대한 설명으로 옳지 않은 것은?',
  ['이 법은 테러자금 억제를 위한 국제협약(1999)을 이행하기 위한 법적 장치의 역할을 한다.','우리나라는 이 국제협약(1999)에 대해 2004년 2월 17일 서명·비준하였고, 이를 이행하기 위한 국내법인 테러자금금지법은 이보다 나중인 2007년 12월에 제정되었다.','이 법은 협약 서명·비준과 동시인 2004년 2월 17일에 제정되어 즉시 시행되었다.','이 법에서는 "테러자금"이라는 용어 대신 "공중 등 협박목적을 위한 자금(공중협박자금)"이라는 용어를 사용한다.'],2,
  '테러자금금지법은 국제협약 서명·비준(2004년 2월 17일)보다 나중인 "2007년 12월"에 제정되었어요. 협약 서명·비준과 국내 이행법률 제정 시점을 혼동하지 않아야 해요.','ultra'),
M('jd2_8',
  '테러자금금지법 제2조제1호가 정의하는 "공중협박자금"에 대한 설명으로 옳은 것은?',
  ['국가·지방자치단체 또는 외국정부(국제기구 포함)의 권한 행사를 방해하거나 의무 없는 일을 하게 할 목적의 자금이라 하더라도, 실제로 폭력행위에 사용된 자금만 해당하며 모집·운반·보관 단계에 있는 자금은 아직 공중협박자금에 해당하지 않는 것으로 보아야 한다','국가·지방자치단체 또는 외국정부(국제기구 포함)의 권한 행사를 방해할 목적의 자금이라 하더라도, 오직 국내 정부기관을 대상으로 한 협박에 이용되는 경우로 한정되며 외국정부나 국제기구에 대한 협박 목적 자금은 정의에서 제외되는 것으로 보아야 한다','국가·지방자치단체 또는 외국정부(국제기구 포함)의 권한 행사를 방해하거나 의무 없는 일을 하게 할 목적으로 또는 공중을 협박할 목적으로 하는 일정한 유형의 폭력·파괴행위에 이용하기 위하여 모집·제공되거나 운반·보관된 자금이나 재산을 의미한다.','공중을 협박할 목적으로 하는 폭력·파괴행위에 이용하기 위해 모집·제공되거나 운반·보관된 자금이라 하더라도, 그 대상이 민간 기업에 대한 협박인 경우로 한정되며 정부기관에 대한 협박 목적 자금은 정의에서 제외되는 것으로 보아야 한다'],2,
  '공중협박자금은 국가·지방자치단체 또는 외국정부(국제기구 포함)의 권한 행사를 방해하거나 의무 없는 일을 하게 할 목적으로 또는 공중을 협박할 목적으로 하는 일정한 유형의 폭력·파괴행위에 이용하기 위해 모집·제공되거나 운반·보관된 자금이나 재산을 의미해요. 실제 사용 여부와 무관하게 모집·운반·보관 단계의 자금도 포함되고, 국내외 정부기관·국제기구·민간기업 등 대상을 가리지 않아요.','ultra'),
M('jd2_8',
  'FATF와 테러자금금지법의 관계에 대한 설명으로 옳지 않은 것은?',
  ['2014년 5월 개정은 대량살상무기확산금융 관련 정밀금융제재와는 무관하며, 오직 테러자금조달행위 처벌 범위 확대만을 다루었다.','2014년 5월 개정으로, 특정 테러행위와 관계없는 테러리스트·테러단체에 대한 자금조달행위도 처벌할 수 있도록 관련 조항(제5조의2, 제6조)이 개정되었다.','FATF는 2001년 9.11 테러 발생 직후 테러자금조달금지에 관한 9개 특별권고사항(Special Recommendations)을 발표하였다.','이 9개 특별권고사항은 이후 FATF의 기준 개정을 거쳐 FATF 40 권고사항에 흡수되었다.'],0,
  '2014년 5월 개정은 테러자금조달행위 처벌 범위 확대(제5조의2, 제6조)뿐 아니라, FATF 권고사항에 추가된 대량살상무기확산금융 관련 정밀금융제재를 이행하기 위한 관련 조항(제명, 제1조, 제2조, 제4조, 제5조)도 함께 개정했어요. "무관하다"는 설명은 옳지 않아요.','ultra'),
M('jd2_8',
  '특정금융정보법과 테러자금금지법의 AML/CFT 관련 연계에 대한 설명으로 옳지 않은 것은?',
  ['금융거래의 상대방이 자금세탁행위 또는 공중협박자금조달행위를 하고 있다고 의심되는 합당한 근거가 있는 경우에도 FIU장에게 보고할 의무가 있다.','테러자금금지법과 특정금융정보법은 서로 완전히 독립적인 별개의 체계로, 두 법 사이에는 어떠한 연계나 참조 관계도 존재하지 않는다.','금융기관등은 금융거래와 관련하여 수수한 재산이 불법재산이라고 의심되는 합당한 근거가 있는 경우 FIU장에게 지체 없이 보고할 의무가 있다.','특정금융정보법은 테러자금금지법상 공중협박자금을 "불법재산"에 포함되는 것으로 규정한다.'],1,
  '특정금융정보법은 테러자금금지법상 공중협박자금을 불법재산에 포함시키는 등 두 법이 서로 긴밀하게 연계되어 있어요. "완전히 독립적이며 연계가 없다"는 설명은 옳지 않아요.','ultra'),
M('jd2_8',
  '<보기> 중 테러자금금지법에 대한 설명으로 옳은 것의 개수는?\nㄱ. 테러자금금지법은 금융거래제한대상자 지정과 금융거래허가제도에 대해서도 규율한다.\nㄴ. 테러자금금지법은 특정금융정보법과 함께 테러자금지원을 위한 자금세탁을 예방하거나 이에 대응하는 법적 수단의 근거이다.\nㄷ. 2014년 5월 개정에서는 제명(법률 명칭)을 포함해 어떠한 조항도 개정되지 않았다.\nㄹ. 테러자금금지법은 FATF의 9개 특별권고사항과는 무관하게 순수한 국내 입법으로만 만들어졌다.',
  ['1개.','3개.','2개.','4개.'],2,
  'ㄱ, ㄴ은 옳은 설명이에요. 2014년 5월 개정에서는 제명을 포함한 여러 조항이 실제로 개정되었고(ㄷ), 테러자금금지법은 FATF의 9개 특별권고사항 이행을 위해 제정된 법이에요(ㄹ은 무관하다는 서술이 옳지 않아요).','ultra'),
M('jd1_2',
  '유엔안보리결의 1267호와 1373호의 차이에 대한 설명으로 옳지 않은 것은?',
  ['1373호는 2001년 9.11 테러 이후 채택되었으며, 각국이 유엔의 별도 지정 없이도 자체적으로 테러리스트를 지정하여 국내법에 근거해 자산을 동결할 수 있도록 요구한다.','1267호와 1373호 모두 유엔 제재위원회가 사전에 작성한 동일한 단일 리스트에 근거해서만 자산동결이 가능하며, 회원국의 자체 지정 권한은 인정되지 않는다.','1267호는 유엔 제재위원회가 작성한 지정 리스트(알카에다·탈레반 관련 등)에 기반한 지정형 제재(Targeted Sanctions)이다.','1373호에 따라 각국은 자체적으로 지정한 테러리스트·테러단체에 대해서도 자산을 동결할 법적 의무를 부담한다.'],1,
  '1267호는 유엔 제재위원회의 지정 리스트에 근거한 제재인 반면, 1373호는 유엔의 별도 지정이 없어도 "각국이 자체적으로" 테러리스트를 지정하여 국내법에 근거해 자산동결을 할 수 있도록(그리고 하도록) 요구해요. "회원국의 자체 지정 권한이 인정되지 않는다"는 설명은 1373호의 핵심 취지와 정반대예요.','ultra'),
M('jd1_2',
  'A국 정부가 유엔 제재위원회의 별도 지정 없이 자체적인 판단으로 국내법에 근거하여 특정 테러단체의 자산을 동결하는 조치를 취하였다. 이 조치와 가장 관련이 깊은 것은?',
  ['유엔안보리결의 1373호.','유럽평의회 범죄수익규제협약(1990).','유엔안보리결의 1267호.','바젤위원회 선언(1988).'],0,
  '유엔의 사전 지정 없이 각국이 자체적으로 테러리스트를 지정하여 국내법에 근거해 자산을 동결하는 것은 유엔안보리결의 1373호(2001)의 특징이에요. 1267호는 유엔 제재위원회의 지정 리스트에 근거한 제재라는 점에서 차이가 있어요.','ultra'),
M('jd1_2',
  '다음 <보기> 중 국제조약과 그 핵심 규율 대상의 연결로 옳은 것을 모두 고른 것은?\nㄱ. 비엔나 협약 - 마약범죄 관련 자금세탁\nㄴ. 팔레모 협약 - 조직범죄 전반으로의 자금세탁 확대\nㄷ. 메리다 협약(UNCAC) - 부패범죄 및 자산회복(Asset Recovery)\nㄹ. 테러자금 억제를 위한 국제협약 - 부패범죄의 국제적 규율',
  ['ㄱ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄹ.'],1,
  'ㄱ, ㄴ, ㄷ이 옳아요. ㄹ은 틀려요 — 테러자금 억제를 위한 국제협약은 테러자금조달의 범죄화를 규율하는 조약이지, 부패범죄를 규율하는 조약이 아니에요. 부패범죄와 자산회복은 메리다 협약(UNCAC)의 영역이에요.','ultra'),
M('jd1_2',
  '메리다 협약(UNCAC)에 대한 설명으로 옳지 않은 것은?',
  ['이 협약은 부패범죄에 대한 예방조치와 형사처벌 절차만을 규율할 뿐, 부패범죄로 인한 수익의 자금세탁 방지 조치나 자산회수 절차와는 별도로 운영되는 독립적인 협약으로 이해해야 한다','UN 반부패협약으로서, 부패범죄에 대한 예방조치·범죄규정 및 법집행·국제협력·자산회복 등을 규정한다.','자산회복(Asset Recovery)은 이 협약의 핵심 개념 중 하나로, 부패범죄로 해외에 유출된 자산을 원소유국으로 회복시키는 것과 관련된다.','이 협약은 2003년 10월 31일 제58차 UN총회에서 채택되었다.'],0,
  '메리다 협약(UNCAC)은 예방조치·범죄규정·법집행·국제협력뿐 아니라 부패범죄 수익에 대한 자산회수(Asset Recovery) 절차까지 포괄적으로 규정하는 협약이에요. "자금세탁방지 조치나 자산회수와는 별도로 운영되는 독립적 협약"이라는 서술은 옳지 않아요.','ultra'),
M('jd1_2',
  '다음 사건·협약을 연도가 이른 순서대로 옳게 나열한 것은?\nㄱ. 팔레모 협약\nㄴ. 유엔안보리결의 1373호\nㄷ. 비엔나 협약\nㄹ. 테러자금 억제를 위한 국제협약\nㅁ. 메리다 협약',
  ['ㄴ → ㄹ → ㅁ → ㄷ → ㄱ.','ㄹ → ㅁ → ㄷ → ㄴ → ㄱ.','ㄷ → ㄹ → ㄱ → ㄴ → ㅁ.','ㄱ → ㅁ → ㄷ → ㄹ → ㄴ.'],2,
  '연도 순서는 비엔나 협약(1988) → 테러자금 억제 국제협약(1999) → 팔레모 협약(2000) → 유엔안보리결의 1373호(2001) → 메리다 협약(2003)이에요. 테러자금협약(1999)이 팔레모협약(2000)보다 앞서고, 1373호(2001)는 그 다음이라는 점이 핵심이에요.','ultra'),
M('jd1_2',
  '테러자금 억제를 위한 국제협약(1999)의 처벌 요건에 대한 설명으로 옳은 것은?',
  ['테러 행위가 실제로 실행되어 인명 피해가 발생한 경우에만 처벌이 가능하다.','자금이 직접적으로 제공된 경우에만 처벌 대상이 되며, 간접적인 자금 제공은 처벌 대상에서 제외된다.','테러 행위가 실제로 실행되었는지 여부와 무관하게, 자금을 제공·모집하려는 의도나 인식만으로도 처벌이 가능하다.','테러자금조달죄가 성립하려면 반드시 자금의 전액이 테러행위에 사용되었음이 사후에 입증되어야 한다.'],2,
  '이 협약은 자금이 실제로 테러행위에 이용되었는지 여부와 무관하게, 직접적이든 간접적이든 그런 의도·인식을 가지고 자금을 제공·모집한 것만으로 범죄가 성립하도록 규정하고 있어요. "실행 여부와 무관하게 처벌 가능"이 핵심이에요.','ultra'),
M('jd2_9',
  'FATF가 정의하는 무역기반자금세탁(TBML)에 대한 설명으로 옳지 않은 것은?',
  ['FATF는 2006년 TBML 보고서에서 TBML을 "불법자금의 원천을 합법화시키기 위한 목적으로 무역거래를 이용하여 범죄수익을 가장하거나 이동시키는 일련의 절차"라고 정의하였다.','2020년 FATF 방법론연구 실무그룹(RTMG)의 보고서에서는 TBML을 "자금의 불법적인 출처를 합법화하거나 범죄활동에 자금을 조달하기 위한 노력의 일환으로서 무역거래를 통해 범죄수익을 숨기고 자금을 이동시키는 과정"이라고 정의하였다.','TBML은 반드시 실제 재화의 물리적 이동을 동반해야 성립하며, 서류상으로만 존재하는 유령선적(phantom shipments)은 TBML의 수법에 해당하지 않는다.','TBML은 자금세탁의 여러 방법 중 무역거래(수출입)를 매개로 하는 것이 특징이다.'],2,
  '2020년 FATF 보고서에 따르면 TBML의 수법에는 실제 재화의 이동이 없는 "유령선적(phantom shipments)"도 포함돼요. 실제 물리적 이동이 반드시 있어야 한다는 설명은 옳지 않아요.','ultra'),
M('jd2_9',
  'FATF의 TBML 관련 주요 발표 연혁에 대한 설명으로 옳지 않은 것은?',
  ['2005년, FATF는 회원국들에 대한 설문조사 및 사례연구를 실시하였다.','2007년, FATF는 "TBML 단속을 위한 기본 6대 원칙"을 발표하였다.','2008년, FATF는 "TBML을 위한 Best Practice"를 발간하였다.','2012년, FATF는 자체적으로 "TBML을 위한 위험지표"를 최초로 발표하였고, 이는 APG의 보고서보다 먼저 발표되었다.'],3,
  '2012년에는 APG(아·태 자금세탁방지기구)가 "TBML을 위한 방법론" 보고서를 발간했어요. FATF의 "TBML을 위한 위험지표"는 이보다 훨씬 뒤인 2021년에 발표되었어요. 연도와 발표기관을 뒤바꾼 오답이에요.','ultra'),
M('jd2_9',
  '다음 <보기>의 FATF·APG의 TBML 관련 발표를 연도가 이른 순서대로 옳게 나열한 것은?\nㄱ. FATF, "TBML을 위한 Best Practice" 발간\nㄴ. FATF, "TBML 단속을 위한 기본 6대 원칙" 발표\nㄷ. APG, "TBML을 위한 방법론" 보고서 발간\nㄹ. FATF, "TBML을 위한 동향 및 발전" 발간\nㅁ. FATF, "TBML을 위한 위험지표" 발간',
  ['ㅁ → ㄹ → ㄷ → ㄴ → ㄱ.','ㄴ → ㄱ → ㄷ → ㄹ → ㅁ.','ㄱ → ㅁ → ㄷ → ㄴ → ㄹ.','ㄱ → ㄹ → ㅁ → ㄴ → ㄷ.'],1,
  '연도 순서는 6대 원칙(2007) → Best Practice(2008) → APG 방법론 보고서(2012) → 동향 및 발전(2020) → 위험지표(2021)예요.','ultra'),
M('jd2_9',
  'FATF가 2007년 발표한 "TBML 단속을 위한 기본 6대 원칙"에 해당하지 않는 것은?',
  ['기존 자금세탁방지프로그램에 TBML을 포함할 것.','수출입업자가 자체적으로 세관신고 없이 무역대금을 결제할 수 있는 특례를 마련할 것.','국내 제관당국과 기타 자금세탁 감독기관 간 협력을 강화할 것.','FATF가 발간한 TBML 보고서를 활용할 것.'],1,
  '6대 원칙은 ①기존 자금세탁방지프로그램에 TBML 포함 ②FATF 발간 TBML보고서 활용 ③국내 제관당국·자금세탁 감독기관 간 협력강화 ④공인된 방식의 무역정보 수집·교환 및 정보보호법령 준수 ⑤무역정보 국제협력 채널 구축 ⑥합법적인 무역활동을 저해하지 않을 것이에요. "세관신고 없이 결제할 수 있는 특례 마련"은 6대 원칙에 없는, 오히려 취지에 반하는 내용이에요.','ultra'),
M('jd2_9',
  '<보기> 중 FATF의 "TBML 단속을 위한 기본 6대 원칙"에 해당하는 것의 개수는?\nㄱ. 공인된 방식으로 무역정보를 수집 및 교환하고 정보보호법령을 준수할 것\nㄴ. 무역정보 국제협력 채널을 구축할 것\nㄷ. 합법적인 무역 활동을 저해하지 않을 것\nㄹ. 모든 수출입 거래에 대해 사전 허가제를 도입할 것',
  ['1개.','3개.','2개.','4개.'],1,
  'ㄱ, ㄴ, ㄷ이 6대 원칙에 해당해요. ㄹ(모든 수출입 거래에 대한 사전 허가제 도입)은 6대 원칙에 없는 내용이며, 오히려 "합법적인 무역활동을 저해하지 않을 것"이라는 원칙과 충돌할 수 있는 과도한 규제예요.','ultra'),
M('jd2_9',
  '2008년 FATF가 발간한 "TBML Best Practice"의 주요내용에 대한 설명으로 옳지 않은 것은?',
  ['TBML/TF 관련 교육 프로그램은 오직 세관 공무원만을 대상으로 하며, 수출입업자·운송업자·금융기관·FIU 등 민간 이해관계자는 교육 대상에서 제외된다.','세관, 법집행기관, FIU, 세무당국 및 은행감독기관 등이 TBML/TF에 대한 협업체계를 구축하는 것이 중요하다고 판단하였다.','TBML의 중요 요소로 TBML/TF의 정의, 무역거래 정보가 수출입업자를 통해 전달되어지는 과정, 검사당국의 사후 모니터링, 무역금융에서 보아야 할 사품이동에 따른 결제, 대외무역에 따른 외환거래 등이 있다.','FATF는 무역체계가 새로운 ML/TF의 위험을 증가시키고 있다고 판단하였다.'],0,
  'TBML/TF 위험에 적합한 교육 프로그램은 이해관계자(수출입업자), 운송업자, 세관, 세무당국, 금융기관, FIU 등 폭넓은 주체를 대상으로 해요. 세관 공무원만을 대상으로 한다는 설명은 옳지 않아요.','ultra'),
M('jd2_9',
  '2020년 FATF 보고서("TBML Update: Trends and Developments")에서 설명하는 TBML 수법에 대한 설명으로 옳지 않은 것은?',
  ['재화가치의 과소 또는 과대 설정도 TBML 수법에 포함된다.','실제 재화의 이동이 없는 유령선적(phantom shipments)도 TBML 수법에 포함된다.','2006년 FATF의 연구에서 처음으로 확인된 TBML 수법에는 과소 또는 과대 송장 청구가 포함된다.','이러한 수법들은 무역거래나 거래 관련 송장과는 무관하게, 순수한 금융계좌 간 자금이체만으로 이루어진다.'],3,
  '2020년 보고서가 설명하는 TBML 수법(과소·과대 송장 청구, 재화가치 조작, 유령선적 등)은 모두 "무역거래나 거래 관련 송장"과 밀접하게 연관되어 있어요. 순수한 금융계좌 간 자금이체만으로 이루어진다는 설명은 TBML의 핵심 특징(무역거래를 매개로 함)과 배치돼요.','ultra'),
M('jd2_10',
  'FATF의 가상자산 관련 논의 배경에 대한 설명으로 옳지 않은 것은?',
  ['FATF는 초기에 가상화폐를 "가치의 저장 및 이동, 측량이 가능하며 협정을 맺은 당사자간 청구권이 인정되는 디지털 화폐"로 정의하였다.','FATF는 2014년부터 IT기술의 발달로 인하여 Fintech와 가상화폐가 새로운 자금세탁과 테러자금조달의 유형이 될 것이라 판단하고 FATF ML/TF 방법론실무그룹(RTMG)에서 첫 논의를 시작하였다.','FATF는 설립 초기인 1989년부터 가상자산을 핵심 규율 대상으로 명시하고 있었으며, 2014년 논의는 기존 정의를 재확인한 것에 불과하다.','FATF는 "화폐(Currency)"라는 용어가 각국의 중앙은행에 혼선을 줄 수 있다는 점을 감안하여, 가상화폐(Virtual Currency)를 가상자산(Virtual Asset)으로 용어의 정의를 변경하였다.'],2,
  'FATF가 가상자산(당시 가상화폐) 문제를 처음 논의하기 시작한 것은 2014년부터예요. 1989년 설립 당시부터 가상자산이 핵심 규율 대상이었다는 설명은 시대착오적인 오답이에요(1989년에는 가상자산이라는 개념 자체가 존재하지 않았어요).','ultra'),
M('jd2_10',
  '다음 <보기>의 FATF 가상화폐/가상자산 관련 조치·가이던스를 발표 시기가 이른 순서대로 옳게 나열한 것은?\nㄱ. Money or Value Transfer Services\nㄴ. Virtual Currencies - Key Definitions and Potential AML/CFT Risks\nㄷ. Updated Guidance for a Risk-Based Approach to Virtual Assets and VASP\nㄹ. Virtual Currencies - Guidance for a Risk-Based Approach\nㅁ. Virtual Assets: Targeted Update on Implementation of the FATF Standards',
  ['ㄴ → ㄹ → ㄱ → ㄷ → ㅁ.','ㄱ → ㄹ → ㄷ → ㄴ → ㅁ.','ㅁ → ㄷ → ㄹ → ㄴ → ㄱ.','ㄹ → ㅁ → ㄱ → ㄴ → ㄷ.'],0,
  '연도 순서는 Key Definitions(2014.6) → Guidance for a Risk-Based Approach(2015.6) → Money or Value Transfer Services(2016.2) → Updated Guidance(2021.8) → Targeted Update(2023.6)예요.','ultra'),
M('jd2_10',
  '2019년 FATF의 가상자산사업자(VASP) 관련 공개성명서(Public Statement)에 대한 설명으로 옳지 않은 것은?',
  ['VASP는 인·허가(license) 또는 신고·등록을 하여야 한다고 발표하였다.','범죄자의 VASP 진입을 차단하고, 미신고 영업에 대해서는 제재가 필요하다고 발표하였다.','이 공개성명서는 FATF 40 권고사항 중 권고 20(의심거래보고)만을 개정 대상으로 하였으며, 다른 권고사항과는 무관하였다.','가상자산을 재산(property), 수익(proceeds), 자금(funds) 또는 이에 상응하는 가치(corresponding value)로 간주하였다.'],2,
  '2019년 공개성명서를 계기로 FATF 40 권고사항 중 "권고 15(새로운 기술)"에 대한 권고사항 및 주석서 등이 수정·업데이트되었어요. 권고 20(STR)만을 대상으로 했다는 설명은 옳지 않아요.','ultra'),
M('jd2_10',
  '우리나라의 특정금융정보법과 VASP의 관계에 대한 설명으로 옳은 것은?',
  ['특정금융정보법과 VASP 관련 의무는 국제기준과 무관하게 독자적으로 마련되었다.','FATF의 2019년 공개성명서와 권고 15 개정에 따라, 국내 특정금융정보법도 개정되어 VASP가 AML/CFT 의무를 준수하게 되는 기준이 되었다.','VASP는 특정금융정보법의 적용 대상에서 명시적으로 제외된다.','특정금융정보법은 VASP에 대해서는 어떠한 의무도 부과하지 않는다.'],1,
  'FATF의 국제기준(2019년 공개성명서, 권고 15 개정)에 따라 국내 특정금융정보법도 개정되어 VASP가 금융회사등에 준하는 AML/CFT 의무를 준수하게 되는 기준이 마련되었어요.','ultra'),
M('jd2_10',
  'FATF가 2019년 발표한 VASP를 위한 자금이동규칙(Travel Rule)의 정의에 대한 설명으로 가장 정확한 것은?',
  ['가상자산사업자가 해외로 출장(Travel)을 갈 때 준수해야 하는 신고 절차를 의미한다.','투자자가 가상자산을 해외 거래소로 이동시킬 때 납부해야 하는 세금 규정을 의미한다.','정부가 가상자산 거래 전체를 실시간으로 감시하는 국가 통제 시스템을 의미한다.','가상자산거래소가 가상자산을 보낸 이와 받은 이의 정보를 수집하여 VASP 등을 확인하는 절차를 의미한다.'],3,
  '자금이동규칙(Travel Rule)은 가상자산거래소가 가상자산을 보낸 이(송금인)와 받은 이(수취인)의 정보를 수집하여 VASP 등을 확인하는 절차를 의미해요. 국가 통제 시스템이나 출장 신고, 세금 규정과는 무관해요.','ultra'),
M('jd2_10',
  'VASP를 위한 자금이동규칙(Travel Rule)에서 송금기관과 수취기관의 의무에 대한 설명으로 옳지 않은 것은?',
  ['송금기관은 수취인에 대해, 수취기관은 송금인에 대해 각각 상대방에 대한 제재대상 검색(sanctions screening)을 해야 한다.','송금기관과 수취기관 모두 자신이 직접 관리하는 고객(송금기관은 송금인, 수취기관은 수취인)에 대해서만 제재대상 검색을 하면 되며, 거래 상대방에 대한 검색 의무는 없다.','송금기관은 송금인의 필수 정보를 검증하여 수집·보관하고, 수취인 정보는 검증하지 않고 수집해야 한다.','수취기관은 수취인의 필수 정보를 검증하여 수집·보관하고, 송금인 정보는 검증하지 않고 수집해야 한다.'],1,
  '자금이동규칙상 송금기관은 "수취인"에 대해, 수취기관은 "송금인"에 대해 제재대상 검색(sanctions screening)을 해야 해요. 즉 각 기관이 상대방(거래 상대방)의 정보를 검색하는 구조예요. "자신이 관리하는 고객에 대해서만 검색하면 된다"는 설명은 이 구조와 반대예요.','ultra'),
M('jd2_10',
  '자금이동규칙(Travel Rule)상 필수 정보의 종류에 해당하지 않는 것은?',
  ['송금인의 물리적 주소, 국가실명번호, CI 또는 생년월일.','송금인의 계좌번호(거래에 사용되는 지갑주소).','송금인의 이름.','송금인이 보유한 모든 과거 거래내역과 예상 향후 투자 계획서.'],3,
  '필수 정보의 종류는 송금인 이름, 송금인 계좌번호(지갑주소), 송금인의 물리적 주소·국가실명번호·CI·생년월일, 수취인 이름, 수취인 계좌번호(지갑주소)예요. "과거 거래내역 전체와 향후 투자 계획서"는 자금이동규칙상 필수 정보로 명시된 바 없는, 지나치게 확대된 오답이에요.','ultra'),
M('jd2_10',
  '<보기> 중 VASP를 위한 자금이동규칙(Travel Rule)에 대한 설명으로 옳은 것의 개수는?\nㄱ. 국가는 송금기관이 송금인·수취인 정보를 거래 발생 전 또는 동시에, 안전하게 수취기관에 전송하도록 해야 한다.\nㄴ. 송금기관과 수취기관은 각각 상대방에 대해 거래를 모니터링하고 이상징후 발생 시 보고해야 한다.\nㄷ. 자금이동규칙은 2015년 FATF가 전통 금융회사만을 위해 발표한 규칙으로 VASP에는 적용되지 않는다.\nㄹ. 자금이동규칙은 전통 금융회사의 전신송금(권고 16)과 완전히 무관한 별개의 개념으로, 어떠한 유사성도 없다.',
  ['1개.','3개.','4개.','2개.'],3,
  'ㄱ, ㄴ은 옳은 설명이에요. 자금이동규칙은 2015년이 아니라 2019년 FATF가 VASP를 위해 발표하였고(ㄷ), 전통 금융회사의 전신송금(권고 16)과 유사한 개념으로 설계되었어요(ㄹ은 무관하다는 서술이 옳지 않아요).','ultra'),
M('jd3_11',
  'FATF의 특정비금융사업자와 전문직(DNFBPs)에 대한 AML/CFT 의무 강화 연혁에 대한 설명으로 옳지 않은 것은?',
  ['DNFBPs에 대한 AML/CFT 의무는 2003년 최초 도입 이후 개정 없이 현재까지 R.22·R.23·R.28의 원문 그대로 유지되고 있으며, 업권별 RBA 가이던스도 발표된 적이 없다.','FATF는 2007년 6월 총회에서 DNFBPs의 평가를 위한 실무그룹(WGEI)의 회의에 DNFBPs 대표자가 참여하는 방안을 승인하였고, 같은 해 9월 회의에 DNFBPs 대표들이 참석하였다.','FATF는 2003년 6월 총회에서 DNFBPs에 대하여 AML/CFT 의무를 부과하는 방안을 골자로 하는 권고안을 채택하면서, R.22(고객확인), R.23(기타수단), R.28(규제와 감독)의 적용을 최종 채택하였다.','FATF는 제1차 라운드 상호평가(1992~1995년)의 운영 경험을 바탕으로, 제2차 라운드 상호평가(1996~2003년) 기간 중 DNFBPs에 대한 AML/CFT 의무 적용에 대하여 권고사항 강화를 지속적으로 논의하였다.'],0,
  'DNFBPs 의무는 2003년 도입 이후에도 지속적으로 발전해 왔어요. 제3차 라운드(2004~2013년) 동안 2008년 카지노·부동산중개업자·귀금속상·법률가를 위한 4개 RBA 가이던스가 발표되었고, 제4차 라운드(2014~2022년)에서는 위험기반 접근방식과 효과성 평가에 중점을 두고 2019년 법률가·회계사·신탁회사 등을 위한 RBA 가이던스가 업데이트되었어요. "개정 없이 원문 그대로 유지", "가이던스 발표 없음"이라는 서술은 명백히 옳지 않아요.','ultra'),
M('jd3_11',
  '<보기> 중 FATF가 DNFBPs에 대하여 최종 채택한 권고사항과 그 내용의 연결로 옳은 것을 모두 고른 것은?\nㄱ. R.22 - 특정비금융사업자와 전문직의 고객확인\nㄴ. R.23 - 특정비금융사업자와 전문직에 대한 기타수단(전신송금)\nㄷ. R.28 - 특정 비금융사업자와 전문직에 대한 규제와 감독\nㄹ. R.29 - 특정비금융사업자와 전문직을 위한 금융정보분석원(FIU) 설립',
  ['ㄱ, ㄷ.','ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.'],0,
  'FATF가 2003년 6월 총회에서 DNFBPs에 대해 최종 채택한 권고사항은 R.22(고객확인), R.23(기타수단), R.28(규제와 감독) 3개예요. ㄴ의 "기타수단(전신송금)"이라는 설명은 R.23의 실제 내용과 달라요 — R.23은 의심거래보고·내부통제 등에 관한 조항이고, 전신송금은 R.16의 내용이에요. R.29(FIU)는 DNFBPs 전용 권고사항이 아니라 모든 보고기관에 적용되는 일반 권고예요.','ultra'),
M('jd3_11',
  'FATF가 정의하는 특정비금융사업자와 전문직(DNFBPs)의 5개 업종에 해당하지 않는 것은?',
  ['부동산 중개인.','귀금속상 및 보석상.','카지노.','가상자산사업자(VASP).'],3,
  'DNFBPs의 5개 업종은 카지노, 부동산 중개인, 귀금속상·보석상, 변호사·공증인·기타 독립적 법률전문가 및 회계사, 신탁·회사설립대리인(TCSP)이에요. 가상자산사업자(VASP)는 FATF 권고 15에서 별도로 정의·규율되는 업종으로, DNFBPs 5개 업종에는 포함되지 않아요.','ultra'),
M('jd3_11',
  '법률 전문가들을 위한 위험기반접근법(RBA) 가이드라인(2019)의 주요 핵심 요약에 대한 설명으로 옳지 않은 것은?',
  ['위험기반접근법(RBA)은 FATF 권고안의 효과적인 이행에 핵심이 되며, 위험이 큰 곳에 자원을 먼저 배분해야 함을 의미한다.','법률 전문가들의 구성이 개인 변호사부터 대규모 다국적 기업에 속한 법률가까지 매우 다양하므로, 모든 경우에 적용할 수 있는 단일한 접근방식이 존재한다.','이 지침은 준법 문화를 조성하고 촉진하는 것이 법률 전문가들의 고위 경영진의 책임임을 강조한다.','이 지침은 실제소유자 요건 및 지명약정(nominee arrangement)에 대한 감독의 중요성을 강조한다.'],1,
  '이 지침은 규모·활동·위험 프로필의 다양성을 감안할 때 모든 경우에 적용할 수 있는 "단일한 접근방식은 없다"고 명시하고 있어요. "단일한 접근방식이 존재한다"는 서술은 원문과 정반대예요.','ultra'),
M('jd3_11',
  '<보기>는 법률 전문가들을 위한 RBA 가이드라인(2019)에서 법률 전문가와 법률회사가 특정 활동 수행 시 ML/TF에 더 취약한 것으로 밝혀진 활동들이다. 이에 해당하지 않는 것은?\nㄱ. 부동산 매매\nㄴ. 고객 자금, 증권 또는 기타 자산 관리\nㄷ. 은행, 저축 또는 증권 계좌 관리\nㄹ. 회사의 설립, 운영 또는 관리를 위한 조직\nㅁ. 법정에서의 소송대리 및 변론',
  ['ㄴ, ㅁ.','ㄱ, ㅁ.','ㄱ, ㄴ, ㄷ, ㄹ, ㅁ 모두 해당.','ㅁ만.'],3,
  'ㄱ~ㄹ은 모두 지침 90번 문단에서 언급하는 취약 활동(부동산 매매, 고객 자금·증권·자산 관리, 은행·저축·증권 계좌 관리, 회사 설립·운영·관리를 위한 조직, 법인·법률관계 설립운영관리 및 사업체 매매)에 해당해요. ㅁ(법정에서의 소송대리·변론)은 이 지침에서 별도로 취약 활동으로 열거되지 않은 통상적인 법률 서비스 영역이에요.','ultra'),
M('jd3_11',
  '법률 전문가들을 위한 RBA 가이드라인(2019)의 91번 문단 내용에 대한 설명으로 옳지 않은 것은?',
  ['의뢰인이 법률 자문에 대해 갖는 권리는 위험기반접근법(RBA) 시행으로 인해 불리한 영향을 받아서는 안 된다.','법률 전문가와 법률회사는 자신이 제공하는 서비스로 인해 발생하는 ML/TF 위험에 경계해야 한다.','법률 전문가와 법률회사는 자신도 모르게 ML/TF에 관여하지 않도록 스스로를 보호해야 한다.','법률가라는 직업이 범죄자에 의해 오용되는 것은 개별 법률회사의 평판 문제일 뿐이므로, 법률 직업 전체의 평판 위험과는 무관하다.'],3,
  '91번 문단은 오히려 ML/TF에 관여함으로써 관련된 개인·법률회사뿐 아니라 "법률 직업 전체"에 평판 위험을 초래할 수 있으며, 법률가라는 직업이 범죄자에 의해 오용되는 것은 용납되지 말아야 한다고 강조해요. "개별 법률회사의 문제일 뿐 직업 전체와는 무관하다"는 서술은 원문과 반대예요.','ultra'),
M('jd3_11',
  '법률 전문가들을 위한 RBA 가이드라인(2019)에서 제시하는 가장 일반적으로 사용되는 위험 기준(위험 범주)을 <보기>에서 모두 고른 것은?\nㄱ. 국가 또는 지리적 위험\nㄴ. 고객 위험\nㄷ. 서비스/거래 위험\nㄹ. 담보물 가치 위험',
  ['ㄱ, ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄱ, ㄷ.','ㄴ, ㄷ, ㄹ.'],1,
  '지침 4번 문단에서 가장 일반적으로 사용되는 위험 기준으로 국가 또는 지리적 위험, 고객 위험, 서비스/거래 위험 3가지를 제시해요. "담보물 가치 위험"은 이 지침이 제시하는 위험 범주가 아니에요.','ultra'),
M('jd3_11',
  '법률 전문가들을 위한 RBA 가이드라인(2019)의 93번 문단에 대한 설명으로 옳은 것은?',
  ['금융기관에서 사용하는 자동 거래 모니터링 시스템은 대부분의 법률 전문가에게도 그대로 적합하게 적용된다.','개별 법률 전문가가 고객의 업무를 조사할 것으로 기대되지는 않지만, 비즈니스 관계 과정에서 업무 유형이나 고객 활동의 특성 변화를 식별·감지할 수 있는 좋은 위치에 있을 수 있다.','법률 전문가와 의뢰인의 관계는 예외 없이 항상 장기간의 상호작용을 거쳐야만 성립하며, 단기 고객 관계는 인정되지 않는다.','본질적으로 위험이 낮은 단기 고객이라면, 그 고객에게 나타나는 위험의 특성은 고려할 필요가 없다.'],1,
  '93번 문단은 금융기관의 자동 거래 모니터링 시스템이 대부분의 법률 전문가에게는 적합하지 않다고 지적하고, 법률 전문가와 의뢰인의 관계가 경우에 따라 단기 고객에게도 존재할 수 있다고 설명해요(예: 부동산 거래). 또한 법률 전문가가 고객의 업무를 직접 조사할 것으로 기대되지는 않지만 업무 유형·고객 활동 특성 변화를 식별할 좋은 위치에 있을 수 있고, 단기 고객이라도(예: 일회성 고객관계) 나타나는 위험 특성은 반드시 고려해야 한다고 강조해요.','ultra'),
M('jd3_11',
  '법률 전문가들을 위한 RBA 가이드라인(2019)의 104번 문단에서 제시하는 거래/서비스 위험 요소에 해당하지 않는 것은?',
  ['실질적으로 금융 중개자 역할을 하는 법률 전문가가 비즈니스 거래를 용이하게 하는 행위에서, 자신이 관리하는 계좌를 통해 자금의 수취 및 송금을 처리하는 서비스.','법률 전문가가 의뢰인의 업무에 대한 적절한 지식 없이 실제로 의뢰인의 지위, 평판 및 신용을 제3자에게 대표하거나 보증하는 서비스.','고객이 법률 전문가의 신탁계좌를 통해, 법률 전문가가 보유하고 있는 계좌 이외의 금융거래를 요구할 수 있는 서비스.','법률 전문가가 매 분기 정기적으로 의뢰인 명부를 감독당국에 자진 제출하는 서비스.'],3,
  '104번 문단이 제시하는 고위험 거래/서비스 요소는 실질적 금융중개자 역할, 신탁계좌를 통한 비R.22 활동 거래, 신탁계좌 이외 금융거래 요구, 고객에 대한 지식 없는 대표·보증, 관할당국으로부터 실소유권을 숨길 수 있는 서비스 등이에요. "정기적으로 의뢰인 명부를 감독당국에 자진 제출"은 오히려 투명성을 높이는 조치로, 위험 요소로 열거된 바 없어요.','ultra'),
M('jd3_11',
  '<보기> 중 법률 전문가들을 위한 RBA 가이드라인(2019)에서 감독자를 위한 내용으로 강조하는 것을 모두 고른 것은?\nㄱ. 자율규제단체(SRB)의 감독·모니터링 역할\nㄴ. 법률전문 직업에 대한 면허 또는 등록요건\nㄷ. 현장 감독 및 외부 감독을 위한 메커니즘\nㄹ. 공공과 민간 부문 간 정보교환의 가치',
  ['ㄱ, ㄴ만.','ㄷ, ㄹ만.','ㄱ, ㄴ, ㄷ, ㄹ 모두.','ㄱ, ㄷ만.'],2,
  '지침 7번 문단은 법률 전문가와 감독자들을 위한 내용으로, 감독·모니터링에서 자율규제단체(SRB)의 역할, 법률전문 직업에 대한 면허·등록요건, 현장 감독 및 외부 감독을 위한 메커니즘·집행·지침·교육, 공공과 민간 부문 간 정보교환의 가치를 모두 강조해요. ㄱ~ㄹ 전부 해당돼요.','ultra'),
M('jd3_11',
  '부동산 부문을 위한 RBA 가이던스(2008)의 지리적 위험(3.2.1) 평가 요소에 해당하지 않는 것은?',
  ['부동산 전문가가 근무하는 사무실 건물의 내진 설계 등급 및 화재 안전 인증 여부.','자금이 해외에서 발생하여 대면하지 않고 거래가 이루어졌는지 여부.','해당 국가의 AML/CFT 제도의 효율성 및 결함이 있는 것으로 식별되었는지 여부.','해당 국가 또는 부동산 전문가가 활동하는 국가와 연관된 UN 및 국제기구에서 발표한 경제 또는 금융 제재·금수 조치 또는 유사한 조치의 대상인지 여부.'],0,
  '지리적 위험 요소는 출신 국가·지역, 해당 국가 AML/CFT 제도의 효율성·결함, 적절한 AML/CFT 법률·규정 부재 국가에 대한 법적 투명성·프레임워크 준수 수준, UN·국제기구의 제재·금수 조치 대상 여부, 부동산 소재지, 구매자·판매자 소재지 및 비즈니스 관계의 성격·목적, 자금이 해외에서 발생하여 비대면으로 거래가 이루어졌는지 여부 등이에요. "사무실 건물의 내진 설계·화재 안전 인증"은 이 가이던스의 위험 평가 요소가 아니에요.','ultra'),
M('jd3_11',
  '부동산 부문을 위한 RBA 가이던스(2008)의 고객 위험(3.2.2, 109번 문단)에 대한 설명으로 옳지 않은 것은?',
  ['구매자 또는 판매자가 부패, 조직범죄 또는 심각한 사기에 연루되었거나 테러 활동에 자금을 제공·지원한다고 신뢰할 수 있는 출처에 의해 파악된 고위험 국가 출신인지 여부를 고려해야 한다.','구매자가 투자 프로그램(투자이민 등)에 의한 시민권을 갖고 있는지 여부는 부동산 거래 자체의 적법성과만 관련될 뿐, 자금 원천의 위험을 평가하는 요소로는 고려되지 않는 것으로 이해해야 한다','고객이 금융제재 대상에 포함되어 있는지 또는 UN과 같은 국제기구에서 채택한 제재·금수 조치의 대상인지 여부를 고려해야 한다.','고객이 자금세탁·테러지원 위험과 연관성이 있는지 여부를 고려해야 한다.'],1,
  '부동산 부문 RBA 가이던스는 투자이민 등에 의한 시민권 취득 여부를 자금 원천의 적법성과 연관된 고객위험 평가 요소로 명시하고 있어요. "거래의 적법성과만 관련될 뿐 자금 원천 위험 평가 요소로 고려되지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd3_11',
  '국제변호사협회(IBA) 등 주요 변호사 협회가 공동 발간한 AML 가이드북 "A Lawyer\'s Guide to Detecting and Preventing Money Laundering"(2014)에 대한 설명으로 옳지 않은 것은?',
  ['이 가이드에 따르면 변호사협회는 법조계 교육에 있어 핵심적인 역할을 하며, 개인 변호사와 법률회사는 자금세탁방지(AML) 의무를 인식하고 준수할 책임에서 면제된다.','이 가이드북은 미국·유럽 등 주요 변호사 협회가 공동으로 발간하였다.','발간 당시 2009년 자금세탁 규모가 세계 국내총생산(GDP)의 2.7%(미화 약 1조 6,000억 달러)에 달한다는 보도 자료가 인용되었다.','이 가이드는 자금세탁방지(AML)에 대한 준수에 초점을 맞추고 있으며, 테러자금조달 방지와 관련해서는 변호사의 역할 문제를 포괄적으로 다루는 것을 목적으로 하지는 않는다.'],0,
  '이 가이드는 변호사협회가 법조계 교육에서 핵심적인 역할을 하지만, "개인 변호사와 법률회사"도 자금세탁방지(AML) 의무를 인식하고 준수해야 할 책임이 있다고 명시해요. "의무에서 면제된다"는 서술은 원문과 정반대예요.','ultra'),
M('jd3_11',
  'IBA AML 가이드북(2014)이 제시하는 <그림2 - 자금세탁 및 테러자금조달에 취약한 법률 서비스>의 5가지 유형에 해당하지 않는 것은?',
  ['국제 항공권 예약 대행(Booking of international flight tickets).','의뢰인 계좌의 이용(Use of client accounts).','부동산 구입(Purchase of real estate).','신탁·회사·자선단체의 관리 및 설립(Management/Creation of trusts, companies and charities).'],0,
  'IBA 가이드북의 그림2는 변호사가 취약한 5가지 유형으로 의뢰인 계좌 이용, 부동산 구입, 신탁·회사·자선단체 관리, 신탁·회사·자선단체 설립, 허위(Sham) 소송을 제시해요. "국제 항공권 예약 대행"은 이 가이드북이 제시하는 취약 유형이 아니에요.','ultra'),
M('jd3_11',
  'OECD의 "조세범죄 및 화이트칼라 범죄를 조장하는 전문가 단속 가이던스"(2021)에서 정의하는 "전문 조력자(Professional Enablers)"의 범위에 해당하지 않는 자는?',
  ['세무사, 변호사 및 법률 고문, 회계사, 재무 고문.','해당 국가의 국세청장 및 금융감독원장 등 정부 고위공직자.','회사 설립 및 등록 대리인, 공증인, 신탁 관리자, 신탁 및 기업 서비스 제공자.','금융기관.'],1,
  'OECD 가이던스가 정의하는 전문 조력자는 세무사, 변호사 및 법률 고문, 회계사, 재무 고문, 금융기관, 회사 설립 및 등록 대리인, 공증인, 신탁 관리자, 신탁 및 기업 서비스 제공자 등을 포함해요. "국세청장·금융감독원장 등 정부 고위공직자"는 전문 조력자의 정의에 포함되는 민간 전문직 범주가 아니에요.','ultra'),
M('jd3_11',
  'OECD 전문 조력자 단속 가이던스(2021)에서 제시하는 정부의 5가지 대응책을 <보기>에서 옳게 나열한 것은?\nㄱ. 전문 조력자의 역할 이해\nㄴ. 전문 조력자 식별 방안\nㄷ. 전문 조력자 차단을 위한 법과 규제\nㄹ. 전문 조력자 억제 방안\nㅁ. 전문 조력자 대응을 위한 국내외 다자간 노력\nㅂ. 전문 조력자에 대한 형사처벌 전면 금지',
  ['ㄱ, ㄴ, ㄷ, ㄹ, ㅁ.','ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ.','ㄱ, ㄴ, ㄷ, ㅂ.','ㄴ, ㄷ, ㄹ, ㅁ, ㅂ.'],0,
  'OECD 가이던스가 제시하는 5가지 대응책은 ①전문 조력자의 역할 이해 ②전문 조력자 식별 방안 ③전문 조력자 차단을 위한 법과 규제 ④전문 조력자 억제 방안 ⑤전문 조력자 대응을 위한 국내외 다자간 노력이에요. ㅂ("형사처벌 전면 금지")은 이 가이던스의 대응책이 아니며, 오히려 일부 국가는 형사제재와 별개로 민사적 제재 조항도 존재한다고 설명해요.','ultra'),
M('jd3_11',
  'OECD 전문 조력자 단속 가이던스(2021)에서 제시하는 전문 조력자 식별 방안에 해당하지 않는 것은?',
  ['자발적 공개 프로그램을 통한 정보 수집, 페이퍼 컴퍼니 및 의심스러운 이사진에 대한 내부 데이터베이스 생성.','내부고발 보고서 활용, 정부 기관과의 문서 진위 확인, 납세자 신원 확인.','세금에 대한 데이터베이스인 OECD APT 디렉토리 확인, 데이터 마이닝 및 STR 정보분석을 통한 반복적 거래와 전문가 식별.','전문 조력자가 소속된 협회나 단체의 자율규제 성명서만을 근거로, 별도의 데이터 검증 절차 없이 명단을 확정하여 공개한다.'],3,
  '전문 조력자 식별 방안은 자발적 공개 프로그램, 내부 데이터베이스 생성, 내부고발 보고서 활용, 문서 진위 확인, 납세자 신원 확인, OECD APT 디렉토리 확인, 데이터 마이닝 등이에요. "자율규제 성명서만으로 검증 없이 명단 확정"은 이에 해당하지 않아요.','ultra'),
M('jd3_11',
  'OECD 전문 조력자 단속 가이던스(2021)의 "전문 조력자 차단을 위한 법과 규제"에 대한 설명으로 옳지 않은 것은?',
  ['변호사, 세무사, 공증인, 회계사는 법률로 부여된 전문적 특권과 전문적인 기술을 바탕으로, 법률 및 금융시스템의 게이트키퍼로서 활동한다.','전문 조력자의 범죄행위를 처벌하기 위해서는 형사 제재만을 활용해야 하며, 변호사협회나 회계윤리기구와 같은 전문 기관을 통한 자율규제 방식의 제재는 국제적으로 인정되지 않는다.','호주, 프랑스 및 영국과 같은 일부 국가에서는 전문 조력자에 대한 형사처벌과 별개로 민사적 제재 조항도 존재한다.','많은 국가에서는 변호사협회나 국제회계윤리이사회(IESBA) 등의 전문 기관에 행동 강령과 윤리적 의무를 부과하며, 이러한 기관은 위법 행위에 대해 면허 정지 및 구성원 추방 등의 제재를 가할 수 있다.'],1,
  '호주·프랑스·영국 등에서는 형사처벌과 별개로 민사적 제재도 존재하며, 변호사협회나 IESBA 같은 전문 기관도 면허 정지·구성원 추방 등의 제재를 가할 수 있어요. "형사 제재만이 유일한 수단이며 전문 기관 제재는 인정되지 않는다"는 서술은 옳지 않아요.','ultra'),
M('jd3_11',
  '<보기>의 5가지 항목을 국제기구·단체와 발간 연도를 옳게 짝지은 것은?\nㄱ. 법률 전문가들을 위한 위험기반접근법(RBA) 가이드라인 - FATF\nㄴ. A Lawyer\'s Guide to Detecting and Preventing Money Laundering - IBA 등\nㄷ. 조세범죄 및 화이트칼라 범죄를 조장하는 전문가 단속 가이던스 - OECD\nㄹ. 부동산중개업자를 위한 RBA 가이던스 - FATF',
  ['ㄱ(2019년), ㄴ(2021년), ㄷ(2014년), ㄹ(2008년).','ㄱ(2008년), ㄴ(2019년), ㄷ(2021년), ㄹ(2014년).','ㄱ(2019년), ㄴ(2014년), ㄷ(2021년), ㄹ(2008년).','ㄱ(2019년), ㄴ(2014년), ㄷ(2008년), ㄹ(2021년).'],2,
  '법률 전문가 RBA 가이드라인은 2019년(FATF), IBA 등의 AML 가이드북은 2014년, OECD의 전문 조력자 단속 가이던스는 2021년, 부동산중개업자 RBA 가이던스는 2008년(FATF)이에요. 4개 문헌의 발간 연도와 발간 주체를 모두 정확히 짝지어야 정답을 고를 수 있는 문제예요.','ultra'),
M('jd3_11',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. FATF의 R.22, R.23, R.28은 1996년 총회에서 DNFBPs에 대하여 최초로 채택되었다.\nㄴ. FATF의 제4차 라운드 상호평가(2014~2022년)는 특정비금융사업자에 대한 위험기반 접근방식 및 효과성 평가에 중점을 두었다.\nㄷ. 법률 전문가를 위한 RBA 가이드라인(2019)은 로펌의 특성, 규모 및 복잡성에 상응하는 ML/TF 위험평가 개발을 RBA 적용의 핵심 출발점으로 본다.\nㄹ. DNFBPs에 대한 감독에서 자율규제단체(SRB)의 역할은 법률 전문가 RBA 가이드라인에서 전혀 언급되지 않는다.',
  ['4개.','1개.','3개.','2개.'],3,
  'ㄴ, ㄷ은 옳은 설명이에요. DNFBPs 관련 권고사항은 1996년이 아니라 2003년 6월 총회에서 채택되었고(ㄱ), 법률 전문가 RBA 가이드라인은 자율규제단체(SRB)의 역할도 언급하고 있어요(ㄹ은 옳지 않아요).','ultra'),
M('jd3_11',
  'DNFBPs 관련 국제 가이던스 발전 흐름을 시간 순서대로 옳게 나열한 것은?\nㄱ. FATF, R.22·R.23·R.28 최종 채택\nㄴ. FATF, 카지노·부동산중개업자·귀금속상·법률가를 위한 4개 RBA 가이던스 발표\nㄷ. IBA 등, A Lawyer\'s Guide to Detecting and Preventing Money Laundering 발간\nㄹ. FATF, 법률가·회계사·신탁회사 등을 위한 RBA 가이던스 업데이트\nㅁ. OECD, 전문 조력자 단속 가이던스 발간',
  ['ㄷ → ㅁ → ㄱ → ㄹ → ㄴ.','ㄴ → ㅁ → ㄷ → ㄹ → ㄱ.','ㄱ → ㄴ → ㄷ → ㄹ → ㅁ.','ㄷ → ㄹ → ㄱ → ㄴ → ㅁ.'],2,
  '연도 순서는 R.22·R.23·R.28 채택(2003년) → 4개 업권별 RBA 가이던스(2008년) → IBA AML 가이드북(2014년) → 법률가·회계사·신탁회사 RBA 가이던스 업데이트(2019년) → OECD 전문 조력자 단속 가이던스(2021년)예요.','ultra'),
M('jd3_11',
  '법률 전문가들을 위한 RBA 가이드라인(2019)의 92번 문단에 대한 설명으로 옳지 않은 것은?',
  ['고객관계 과정에서 고객·거래 위험 프로필을 지속적으로 모니터링하고 검토하는 절차도 중요하다.','법률 전문가는 의뢰인, 즉 고객 관계 초기에 고객의 위험평가를 수행해야 한다.','이러한 위험평가는 국가위험평가(NRA)의 결과, 초국가적 위험평가, 법률 서비스/부문에 내재된 ML/TF 위험에 대해 관할 당국이 수행한 부문별 보고서, 다른 관할권의 위험 보고서 등을 통해 알 수 있다.','법률 전문가는 지표 및 위험 요소에 대한 FATF 지침을 참조할 수 없으며, 오직 자체적으로 개발한 위험평가 모델만을 사용해야 한다.'],3,
  '92번 문단은 법률 전문가가 지표 및 위험 요소에 대한 FATF 지침을 "참조할 수 있다"고 명시해요. "참조할 수 없으며 자체 모델만 사용해야 한다"는 서술은 원문과 반대예요.','ultra'),
M('jd3_11',
  '<보기> 중 부동산 부문을 위한 RBA 가이던스(2008)의 내용으로 옳은 것을 모두 고른 것은?\nㄱ. 부동산 사업의 위험평가는 부동산 중개인의 우려 사항 및 고객의 의심 또는 일반적인 행동을 포함한 고위험을 평가할 필요가 있다.\nㄴ. 위험평가는 부동산 전문가 사업의 규모, 부동산 회사와 관련된 거래의 재정적 가치, 부동산 거래의 성격을 고려하는 접근 방식을 따라야 한다.\nㄷ. 부동산 부문과 관련하여 기타 DNFBPs 및 은행 등은 AML/CFT 위험에 대한 노출을 고려하는 RBA를 채택할 필요가 없다.\nㄹ. 부동산이 상업용 또는 주거용인지 여부는 위험평가와 무관한 요소이다.',
  ['ㄱ, ㄴ.','ㄱ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ.','ㄴ, ㄷ, ㄹ.'],0,
  'ㄱ, ㄴ이 옳아요. ㄷ은 틀려요 — 부동산 부문과 관련하여 기타 DNFBPs 및 은행 등도 AML/CFT 위험 노출을 고려하는 RBA를 "채택해야 한다"고 명시해요. ㄹ도 틀려요 — 상업용·주거용 부동산 관련 여부는 위험평가 시 고려해야 할 거래 성격 요소 중 하나예요.','ultra'),
M('jd1_4',
  '유럽연합(EU)의 자금세탁방지지침(AMLD)에 대한 설명으로 옳지 않은 것은?',
  ['자금세탁방지지침(AMLD, Anti-Money Laundering Directives)은 각 회원국이 자금세탁 및 테러자금조달을 방지할 수 있도록 강력한 법적 틀을 제공한다.','유럽연합의 지침은 회원국들의 국내법보다 우선하며, 자금세탁방지와 관련된 바젤위원회 또는 FATF의 국제기준보다 훨씬 더 많은 비중을 차지하기도 한다.','유럽연합은 "국가 공동체"로서 여러 회원국의 의회 승인 없이도 법의 효력을 가진 조치를 채택할 수 있다는 점에서 다른 국제기구와 근본적으로 다른 독특한 성격을 가진다.','유럽연합의 지침은 유럽연합 회원국뿐 아니라 전 세계 모든 국가에 직접적으로 적용되는 강행규범이다.'],3,
  '유럽연합의 지침은 유럽연합 회원국에만 적용되며, 다른 국가에는 적용되지 않아요. "전 세계 모든 국가에 직접 적용되는 강행규범"이라는 서술은 옳지 않아요.','ultra'),
M('jd1_4',
  '유럽연합 제1차 자금세탁방지지침(AMLD 1, Directive 91/308/EEC, 1991년)에 대한 설명으로 옳지 않은 것은?',
  ['1991년 6월 10일 유럽이사회(Council of the European Communities)가 채택하였으며, "자금세탁을 목적으로 한 금융시스템의 사용 방지"라는 제목을 가진다.','당시 적용 대상은 금융기관 중심이었으며, 비금융부문은 적용 대상에 포함되지 않았고, 고객알기제도(KYC) 의무를 부과하였다.','의심스러운 거래를 발견할 경우 금융정보분석원에 보고해야 하는데, 이는 의심스러운 활동에 대한 최초의 공식 보고시스템이었다.','제1차 지침은 1988년 비엔나 협약에서 정의한 대로 마약밀매에 대한 자금세탁뿐 아니라, 모든 중대범죄를 전제범죄로 명시적으로 포함하였다.'],3,
  '제1차 지침은 1988년 비엔나 협약에서 정의한 대로 "마약밀매에 대한 자금세탁에 대해서만" 전제범죄를 한정하였고, 회원국들이 자금세탁방지에 대하여 전제범죄를 다른 범죄로 확대하도록 권장하는 수준이었어요. "모든 중대범죄를 명시적으로 포함"한 것은 이후 지침(AMLD 2)의 내용이에요.','ultra'),
M('jd1_4',
  '유럽연합 제2차 자금세탁방지지침(AMLD 2, Directive 2001/97/EC)에 대한 설명으로 옳지 않은 것은?',
  ['제2차 지침 개정 당시에는 UN과 국제자금세탁방지기구(FATF)의 기준보다 낮은 수준의 자금세탁방지 의무를 제시하여, 국제기준과의 정합성을 의도적으로 낮추었다.','자금세탁방지의 의무를 특정비금융사업자와 전문직(DNFBPs)의 영역으로까지 넓혀서 변호사, 회계사, 부동산 중개인, 공증인 등 법률 및 회계전문가 등을 포함시켰다.','2001년 12월 4일 발표되었고, 회원국들은 2003년 6월 15일까지 국내법에 이행하기로 동의하였다.','자금세탁에서의 범죄행위에 대한 정의를 마약밀매뿐 아니라 부패 및 사기를 포함한 모든 심각한 범죄로 그 영역을 확대하였다.'],0,
  '제2차 지침 개정 당시에는 오히려 UN과 국제자금세탁방지기구(FATF)의 기준보다 "더 높은" 자금세탁방지 의무를 제시하였어요. "국제기준보다 낮은 수준"이라는 서술은 원문과 반대예요.','ultra'),
M('jd1_4',
  '유럽연합 제3차 자금세탁방지지침(EU AMLD 3, Directive 2005/60/EC)의 주요 특징에 대한 설명으로 옳지 않은 것은?',
  ['정치적 주요인물(PEPs)에 대한 강화된 고객확인의무는 이 지침이 아니라 이후의 제4차 지침에서 처음 도입된 내용으로, 제3차 지침 당시에는 관련 규정이 존재하지 않았던 것으로 이해해야 한다','2005년에 개정되었으며, 자금세탁(Money Laundering)과 테러자금조달(Terrorist Financing)에 대한 정의와 범위를 확대하였다.','고객확인에 있어서 위험기반접근방식(RBA)을 세부적으로 반영해야 하고, 법인 또는 개인이 25% 이상 지분을 보유하고 있는 경우 실제소유자의 확인의무가 포함되어 있다.','범죄에서 파생된 자금이 범죄조직뿐 아니라 테러자금 지원에도 적용됨과 동시에, 고객확인의무(CDD) 및 의심거래보고의무(STR)를 비금융사업자와 전문직(DNFBP) 및 15,000유로 이상의 귀금속 및 고가품 거래업자, 회사 설립 등 서비스 제공 법인에도 확대하였다.'],0,
  'EU AMLD 3(2005)은 PEP에 대한 강화된 고객확인의무, 변호사 등 법률전문가의 STR 의무, 유럽연합집행위원회의 상호평가·조정 역할을 이미 규정하고 있었어요. "PEP 강화된 고객확인의무는 제4차 지침에서 처음 도입되었다"는 서술은 옳지 않아요.','ultra'),
M('jd1_4',
  '유럽연합 제3차 자금세탁방지지침(AMLD 3)의 주요내용 중 고객확인의무(CDD)에 대한 설명으로 옳은 것은?',
  ['간소화된 고객확인은 고위험 고객이나 특정 고객에 대해서만 허용되며, 이 경우에는 완전한 고객알기제도(KYC) 절차를 반드시 전부 수행해야 한다.','고객확인의무(CDD)는 모든 고객에게 동일한 수준으로 적용되어야 하며, 위험도에 따른 차등 적용은 허용되지 않는다.','고객확인의무(CDD)의 적용 기준은 오직 자금세탁 의혹이 있는 경우로만 한정되며, 비즈니스 거래관계 수립이나 고액 현금거래는 적용 기준에 포함되지 않는다.','간소화된 고객확인은 저위험 고객이나 특정 고객에 대해서만 허용되며, 이 경우에는 완전한 고객알기제도(KYC) 절차를 수행할 필요는 없다.'],3,
  '제3차 지침상 간소화된 고객확인(CDD)은 저위험 고객이나 특정 고객에 대해서만 허용되며, 이 경우 완전한 KYC 절차를 수행할 필요는 없어요. CDD의 적용은 비즈니스 거래관계 수립, 15,000유로 이상의 현금 거래 수행, ML/TF 의혹이 있는 경우 등에 적용되며, 모든 고위험 고객에게는 강화된 고객확인의무(EDD)를 수행해야 해요.','ultra'),
M('jd1_4',
  '<보기> 중 유럽연합 제3차 지침(AMLD 3)이 규정하는 강화된 고객확인의무(EDD) 수행 시 동반해야 하는 조치를 모두 고른 것은?\nㄱ. 고객에 대한 정보 수집\nㄴ. 자금세탁방지/테러자금조달금지(AML/CFT)에 대한 통제\nㄷ. 고위경영진의 승인\nㄹ. 책임자의 문서화\nㅁ. 해당 고객의 세무조사 이력 전수조사',
  ['ㄱ, ㄴ, ㄷ, ㄹ, ㅁ.','ㄱ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ, ㄹ.','ㄴ, ㄷ, ㄹ, ㅁ.'],2,
  '강화된 고객확인의무(EDD) 수행 시 고객에 대한 정보수집, AML/CFT에 대한 통제, 고위경영진의 승인, 책임자의 문서화 등을 동반해야 해요. "세무조사 이력 전수조사"는 이 지침이 명시하는 EDD 동반 조치가 아니에요.','ultra'),
M('jd1_4',
  '유럽연합 제4차 자금세탁방지지침(AMLD 4, Directive (EU) 2015/849)에 대한 설명으로 옳지 않은 것은?',
  ['2015년 6월 발효되었으며, 자금세탁과 테러자금조달에 금융시스템을 이용하지 못하도록 방지하는 것을 주요 목적으로 한다.','고액현금거래보고 기준을 10,000유로로 강화하였고, 도박 관련 자금세탁 법률상 카지노에서 도박 서비스 제공업체로 그 범위를 확대하였다.','개정된 FATF 권고안에 따라 범죄 행위에 대한 광범위한 정의에 직접 및 간접세와 관련된 조세범죄가 포함되었다.','정치적 주요인물(PEPs)에 대해서는 국내 정치적 주요인물을 포함하지 않고 오직 외국 정치적 주요인물만을 정밀조사 대상으로 규정하였다.'],3,
  '제4차 지침은 정치적 주요인물(PEPs)에 대한 추가 조치로, PEPs는 유럽연합에만 해당되는 것이 아니라 "국내외" 정치적 주요인물 모두 동일한 정밀조사를 명시했어요. 국내 PEP를 제외한다는 서술은 옳지 않아요.','ultra'),
M('jd1_4',
  '유럽연합 제4차 지침(AMLD 4)의 정치적 주요인물(PEPs)에 대한 추가 조치의 성격에 대한 설명으로 옳은 것은?',
  ['PEPs 요건은 범죄적 성격의 조치로, PEPs로 지정되는 것 자체가 범죄활동에 연루되었다는 오명을 씌우는 것으로 해석되어야 한다.','PEPs 요건은 예방적 성격이며, 범죄활동에 연루되었다는 오명을 씌우는 것으로 해석되어서는 안 된다.','PEPs 요건은 국내 정치적 주요인물에게는 전혀 적용되지 않고, 외국 정치적 주요인물에게만 적용된다.','PEPs 요건은 카지노에서의 도박 관련 거래에만 한정하여 적용되는 조치이다.'],1,
  '제4차 지침은 PEPs 요건이 범죄적 성격이 아닌 "예방적" 성격이며, 범죄활동에 연루되었다는 오명을 씌우는 것으로 해석되어서는 안 된다고 명시해요.','ultra'),
M('jd1_4',
  '유럽연합 제4차 지침(AMLD 4)의 실제소유자의 중앙 등록부 관리에 대한 설명으로 옳지 않은 것은?',
  ['기업과 기타 법률관련 단체는 실제소유자에 대한 정확한 최신 정보를 유지해야 하며, 정부에 그 정보를 제공해야 한다.','상호 연결된 등록시스템에는 실제소유자의 특징이 포함되어서는 안 되며, 오직 법인의 명칭 정보만 포함되어야 한다.','이 정보는 각 회원국의 은행, 법률 회사 및 "합법적인 이익을 입증할 수 있는 사람 또는 조직"이 접근할 수 있는 중앙 등록부에서 보관한다.','등록 데이터는 거래를 위한 실제소유자의 특성과 범위를 정한다.'],1,
  '상호 연결된 등록시스템에는 실제소유자의 특징이 "포함되어야 한다"고 명시되어 있어요. "포함되어서는 안 된다"는 서술은 원문과 반대예요.','ultra'),
M('jd1_4',
  '유럽연합 제4차 지침(AMLD 4)에서 강화된 고객확인의무(EDD) 면제조항의 삭제에 대한 설명으로 가장 옳은 것은?',
  ['제4차 지침은 제3차 지침보다 간소화된 고객확인 적용 요건을 완화하여, 위험평가 없이도 모든 공공기관·상장기업에 자동으로 간소화된 CDD를 적용할 수 있도록 하였다.','제4차 지침은 상장기업에 대한 강화된 고객확인의무(EDD)를 전면 면제하는 조항을 신설하였다.','이 조항은 카지노업에만 적용되는 예외 규정으로, 다른 금융기관에는 적용되지 않는다.','제3차 지침(AMLD 3)에서는 공공기관(연금 포함) 및 금융기관, 특정 공시 의무에 따라 규제대상 시장에 상장된 기업 등에 대해 간소화된 고객확인의무(CDD)를 시행할 수 있었으나, 제4차 지침(AMLD 4)에서는 위험평가분석을 수행한 후에만 간소화된 절차 적용이 가능하다.'],3,
  '제3차 지침에서는 공공기관(연금 포함) 및 금융기관, 특정 공시 의무에 따라 규제대상 시장에 상장된 기업 등에 대해 간소화된 고객확인의무를 적용할 수 있었지만, 제4차 지침에서는 이를 완화한 것이 아니라 오히려 위험평가분석을 수행한 후 완순화된 현장실사의 일부로만 적용이 가능하도록 하고, 강화된 고객확인의무(EDD) 면제가 아니라 위험평가를 통한 정당화가 필요하도록 강화했어요.','ultra'),
M('jd1_4',
  '유럽연합 제5차 자금세탁방지지침(AMLD 5, Directive (EU) 2018/843)에 대한 설명으로 옳지 않은 것은?',
  ['유럽연합은 2018년 7월 9일 제5차 지침을 발효시켰고, 2020년 1월 10일까지 국내법에 반영해야 한다.','이 지침은 익명 선불카드의 사용 한도를 오히려 완화하여, 발행금액을 월 500유로까지 확대 허용하였다.','제5차 지침의 주요 특징으로는 유럽중앙은행(ECB)을 포함한 감독당국(FIU 등) 간의 정보 및 협력 증진, 가상화폐에 대한 규제와 모니터링, 실제소유자와 관련된 정보, 선불카드의 사용, 고위험 국가에 대한 실제조사 등이 반영되었다.','기존의 제4차 지침을 개정하여 의무 기관(obliged entities)의 범위를 확장하였고, 특히 가상자산사업자(VASP)와 예술 및 골동품 거래와 관련된 높은 가치를 지닌 상품 거래자 등을 추가하였다.'],1,
  '제5차 지침은 선불카드의 요구사항을 강화하여 익명성을 최소화하고, 익명 선불카드의 사용 한도를 발행금액 월 150유로를 초과하지 않는 금액으로 "축소"하였으며, 테러 위험이 높은 특정 지역에서 사용하는 한도는 50유로로 추가 제한했어요. "한도를 완화하여 월 500유로까지 확대"라는 서술은 원문과 정반대예요.','ultra'),
M('jd1_4',
  '유럽연합 제5차 지침(AMLD 5)에서 가상자산(암호화폐) 규제 강화에 대한 설명으로 옳은 것은?',
  ['가상자산 관련 규제는 유럽중앙은행(ECB)의 소관이 아니라 전적으로 각 회원국의 재량에 맡겨져 있어 지침상 통일된 기준이 없다.','가상자산 및 모든 플랫폼과 가상자산사업자는 고객알기제도와 의심거래보고 등 자금세탁방지 및 테러자금조달금지 의무를 수행해야 한다.','가상자산사업자(VASP)는 제5차 지침이 아니라 제6차 지침에서 최초로 의무 기관에 포함되었다.','가상자산(암호화폐)은 유럽연합의 자금세탁방지 및 테러자금조달금지 적용범위에서 명시적으로 제외되었다.'],1,
  '제5차 지침은 가상자산(암호화폐)을 유럽연합의 자금세탁방지 및 테러자금조달금지 적용범위에 "포함"시켰고, 가상자산 및 모든 플랫폼과 가상자산사업자(VASP)는 고객알기제도와 의심거래보고 등 AML/CFT 의무를 수행해야 한다고 규정했어요. VASP는 제5차 지침에서 의무기관 범위에 신규로 추가되었어요.','ultra'),
M('jd1_4',
  '<보기> 중 유럽연합 제5차 지침(AMLD 5)의 주요내용에 해당하는 것을 모두 고른 것은?\nㄱ. 중앙등록시스템(Registry)의 편리한 접속과 투명성 강화\nㄴ. 고위험 지역과 연관 있는 비즈니스 파트너와의 거래에 대한 광범위한 정보 수집\nㄷ. 자금세탁방지/테러자금조달금지(AML/CFT) 의무를 가진 기업의 조직 자본 또는 의결권 점유율이 25%를 초과하는 개인을 중앙등록시스템의 기록부에 등록\nㄹ. 금융정보분석원(FIU)의 역할로서 실제소유자에 대한 정보 및 거래내역을 분석하여 의심스러운 활동을 파악',
  ['ㄱ, ㄴ, ㄷ, ㄹ 모두.','ㄱ, ㄴ만.','ㄷ, ㄹ만.','ㄱ, ㄷ만.'],0,
  'ㄱ~ㄹ 모두 제5차 지침의 주요내용에 해당해요: 중앙등록시스템 접근성·투명성 강화, 고위험 지역 비즈니스 파트너에 대한 광범위한 정보 수집, 25% 초과 지분·의결권 보유 개인의 중앙등록시스템 등록, FIU의 실제소유자 정보·거래내역 분석 역할까지 모두 포함돼요.','ultra'),
M('jd1_4',
  '"형사법을 통한 자금세탁방지에 관한 지침(Directive (EU) 2018/1673)"에 대한 설명으로 옳지 않은 것은?',
  ['유럽연합은 2018년 11월 12일 이 지침을 발효시켰고, 2020년 12월 3일까지 자국법에 반영해야 하며, 2021년 6월 3일 모든 회원국의 감독기관 및 금융기관과 관련 기업이 이를 준수해야 한다.','이 지침은 자금세탁 관련자에 대한 개인의 형사 책임만을 강화하였을 뿐, 유한책임회사·파트너십·상장회사와 같은 법인의 행동에 대한 책임은 규정하지 않았다.','이 지침의 주요내용에는 자금세탁 전제범죄의 정의 확대(사이버범죄, 환경범죄, 탈세, 부정거래, 암호화폐 사기, 마약밀매, 인신매매 등 22가지 포함), 법인 책임 강화, 회원국 간 사법 협력 강화, 범죄수익 몰수 강화가 포함된다.','이 지침은 자산이 범죄 활동에서 파생되었다는 사실을 알면서 고의적으로 저질러진 자금세탁을 범죄화하는 것을 목표로 한다.'],1,
  '이 지침은 개인의 책임뿐 아니라 유한책임회사·파트너십 및 상장회사 같은 법인도 그 임원의 행동에 대해 자금세탁방지 의무를 위반할 경우 형사 책임을 질 수 있도록 하여, 조직 차원의 책임을 강화하였어요. "법인의 책임은 규정하지 않았다"는 서술은 옳지 않아요.','ultra'),
M('jd1_4',
  '<보기> 중 형사법을 통한 자금세탁방지에 관한 지침(Directive (EU) 2018/1673)이 자금세탁 전제범죄로 확대 포함한 범죄 유형에 해당하는 것을 모두 고른 것은?\nㄱ. 사이버 범죄\nㄴ. 환경 범죄\nㄷ. 탈세\nㄹ. 인신매매\nㅁ. 저작권 등록 지연',
  ['ㄴ, ㄷ, ㅁ.','ㄱ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ, ㄹ.','ㄱ, ㄴ, ㄷ, ㄹ, ㅁ.'],2,
  '이 지침은 자금세탁의 전제범죄로 간주되는 행위의 종류 목록에 사이버 범죄, 환경 범죄, 탈세, 부정거래, 암호화폐 사기, 마약밀매, 인신매매 등 22가지를 포함시켰어요. "저작권 등록 지연"은 이 지침이 열거하는 전제범죄 유형이 아니에요.','ultra'),
M('jd1_4',
  '유럽연합의 최근 자금세탁방지 및 테러자금조달방지 체계(AML/CFT framework)에 대한 설명으로 옳지 않은 것은?',
  ['제6차 지침 및 규정(EU 2023/1113, 규정(EU) 2024/1620 및 규정(EU) 2024/1624)은 모두 의무 기관(obliged entities)이 충족해야 하는 요구 사항을 규율하는 법적 체계를 형성한다.','이 패키지는 "자금세탁방지 및 테러자금조달방지를 위한 청(AMLA)" 설립을 포함하여 유럽연합의 자금세탁방지 및 테러자금조달방지 제도적 체계를 뒷받침한다.','2024년 6월 19일 유럽연합 관보에 제6차 자금세탁방지지침(6th AML Directive), 자금세탁방지청 규정(AMLA Regulation) 및 자금세탁방지 규정(AML Regulation)이 게시되었다.','제6차 자금세탁방지지침(Directive (EU) 2024/1640)은 지침(Directive) 형식이 아니라 규정(Regulation)으로 제정되어, 회원국의 개별 입법 없이 곧바로 직접 적용되는 것으로 이해해야 한다'],3,
  '제6차 자금세탁방지지침(2024/1640)은 그 명칭이 \'Directive\'인 데서 알 수 있듯 지침 형식으로 제정되어 회원국의 개별 법률 전환 절차가 필요해요(직접 적용되는 것은 별도로 제정된 AML Regulation이에요). "규정으로 제정되어 직접 적용된다"는 서술은 옳지 않아요.','ultra'),
M('jd1_4',
  '"지침(EU) 2024/1640"(제6차 자금세탁방지지침)의 배경에 대한 설명으로 옳지 않은 것은?',
  ['이 지침은 제6차 AML/CFT 지침 제안을 포함하여 AML/CFT 입법 패키지가 채택된 결과물이다.','이 지침은 발효 즉시 별도의 자국법 반영 절차 없이 모든 회원국에 자동으로 직접 적용되는 규정(Regulation)과 동일한 법적 효력을 가진다.','2021년 7월 20일에 유럽연합 집행위원회에 의해 제안되었고, 유럽의회와 유럽연합 이사회에서 논의가 진행되어 2024년 5월 31일에 최종 합의에 도달하였다.','2024년 6월 19일에 유럽연합 관보에 게재되었으며, 2024년 7월 9일에 발효되었고, 유럽연합은 2025년 7월 10일까지 자국법으로 시행되어야 한다.'],1,
  '이 지침(Directive)은 2025년 7월 10일까지 "자국법으로 시행되어야" 한다고 명시되어 있어요. 즉 회원국의 국내법 반영(transposition) 절차가 필요한 "지침(Directive)"으로서의 법적 성격을 가지며, 자동으로 직접 적용되는 "규정(Regulation)"과는 법적 효력의 성격이 달라요.','ultra'),
M('jd1_4',
  '"지침(EU) 2024/1640"의 주요 특징에 대한 설명으로 옳지 않은 것은?',
  ['유럽연합 및 회원국 수준에서의 자금세탁 및 테러자금조달 위험식별, 실제소유자 및 은행 계좌 등록부의 설정 및 접근, 부동산 정보에 대한 접근 등을 규정한다.','이 지침은 부동산 정보에 대한 접근을 명시적으로 금지하여, 어떠한 감독당국도 부동산 등록부에 접근할 수 없도록 하였다.','의무 대상 기관의 고위 경영진 및 실제소유자에 대한 등록, 식별 및 확인 요구 사항을 규정한다.','자금세탁 및 테러자금조달에 노출된 부문에 대한 국가 차원의 조치를 규정한다.'],1,
  '이 지침은 오히려 실제소유자 및 은행 계좌 등록부의 설정·접근뿐 아니라 "부동산 정보에 대한 접근"까지 규정하고 있어요. "부동산 정보 접근을 명시적으로 금지"한다는 서술은 원문과 정반대예요.','ultra'),
M('jd1_4',
  '제6차 지침(Directive (EU) 2024/1640)의 주요내용 중 "실제소유자 투명성 및 등록부"에 대한 설명으로 옳지 않은 것은?',
  ['부동산 등록부는 금융정보분석원(FIU)과 기타 관련 감독당국이 부동산 관련 정보를 단일 접근 지점을 통해 이용할 수 있도록 구축된다.','의무 기관(obliged entities)의 고위 경영진, 실제소유자 등록, 식별 및 확인에 대한 요구 사항을 강화한다.','합법적 이해관계를 가진 공익 인사(예: 언론인, 시민사회단체 등)에게는 이러한 실제소유자 정보에 대한 접근이 원천적으로 봉쇄되어야 한다.','각 회원국은 중앙 등록부를 통해 실제소유자 정보를 수집하고, 해당 정보의 정확성과 최신성을 보장하기 위한 검증 권한을 부여한다.'],2,
  '이 지침은 합법적 이해관계를 가진 공익 인사(예: 언론인, 시민사회단체 등)에게 실제소유자 정보에 대한 접근이 "허용된다"고 명시하고 있어요. "원천적으로 봉쇄되어야 한다"는 서술은 원문과 반대예요.','ultra'),
M('jd1_4',
  '제6차 지침(Directive (EU) 2024/1640)의 감독 당국 관련 내용에 대한 설명으로 옳은 것은?',
  ['회원국 내 모든 의무 이행 기관이 적절하고 효과적인 감독을 받을 수 있도록 보장하며, 국경을 초월한 활동을 수행하는 의무 기관에 대한 공동 감독을 위해 감독 대학(supervisory colleges)을 설립할 수 있는 근거를 마련한다.','감독 대학(supervisory colleges)의 운영에는 자금세탁방지청(AMLA)이 관여할 수 없으며, 전적으로 개별 회원국이 독자적으로 운영한다.','국경을 초월한 활동을 수행하는 의무 기관에 대해서는 어떠한 공동 감독 체계도 마련되어 있지 않다.','이 지침은 감독당국의 역할을 축소하고, 감독 기능을 전면적으로 민간 자율규제기구에 이양하도록 규정한다.'],0,
  '제6차 지침은 회원국 내 모든 의무 이행 기관이 적절하고 효과적인 감독을 받을 수 있도록 보장하며, 국경을 초월한 활동을 수행하는 의무 기관에 대한 공동 감독을 위해 감독 대학(supervisory colleges)을 설립할 수 있는 근거를 마련해요. 이러한 감독 대학의 효과적인 운영을 위해 자금세탁방지청(AMLA)이 주도적인 지원 역할을 수행한다고 명시되어 있어요.','ultra'),
M('jd1_4',
  '제6차 지침(Directive (EU) 2024/1640)에서 금융정보분석원(FIU)의 역할에 대한 설명으로 옳지 않은 것은?',
  ['국경을 초월하여 유럽연합 내 금융정보분석원 간의 협력을 강화하여 정보 요청에 대한 응답 시간을 단축하고, FIU.net 시스템의 기능 향상 및 공동 분석을 촉진한다.','FIU의 분석 역량을 강화하고, 다양한 행정·금융 및 법 집행 정보에 대한 즉각적이고 직접적인 접근을 보장한다.','FIU는 유럽연합 차원에서 하나로 통합되어 각 회원국의 개별 FIU는 전면 폐지된다.','불법자금 흐름을 신속하게 차단할 수 있는 권한을 부여한다.'],2,
  '이 지침은 회원국 간 FIU의 "협력 강화"(신속한 정보 교환, FIU.net 기능 향상, 공동 분석)를 다루고 있을 뿐, 각 회원국의 개별 FIU를 폐지하고 하나로 통합한다는 내용은 없어요.','ultra'),
M('jd1_4',
  '<보기>의 유럽연합 자금세탁방지지침(AMLD) 및 관련 지침·규정을 발효(또는 채택) 연도가 이른 순서대로 옳게 나열한 것은?\nㄱ. 제3차 지침\nㄴ. 제1차 지침\nㄷ. 제5차 지침\nㄹ. 제4차 지침\nㅁ. 제6차 지침\nㅂ. 형사법을 통한 자금세탁방지에 관한 지침',
  ['ㄷ → ㄹ → ㄴ → ㄱ → ㅂ → ㅁ.','ㅁ → ㅂ → ㄷ → ㄹ → ㄱ → ㄴ.','ㄴ → ㄱ → ㄹ → ㄷ → ㅂ → ㅁ.','ㄷ → ㄴ → ㅂ → ㄱ → ㅁ → ㄹ.'],2,
  '연도 순서는 제1차 지침(1991) → 제3차 지침(2005) → 제4차 지침(2015) → 제5차 지침(2018.7) → 형사법을 통한 자금세탁방지에 관한 지침(2018.11) → 제6차 지침(2024)이에요. 참고로 제2차 지침(2001)은 제1차와 제3차 사이에 위치해요. 제5차 지침과 형사법 지침이 같은 2018년이지만 형사법 지침(11월)이 제5차 지침(7월)보다 나중이라는 점이 핵심 함정이에요.','ultra'),
M('jd1_4',
  '<보기> 중 옳은 설명의 개수는?\nㄱ. 제3차 지침(AMLD 3)은 25% 이상 지분을 보유하고 있는 경우 실제소유자의 확인의무를 포함하였다.\nㄴ. 제4차 지침(AMLD 4)은 고액현금거래보고 기준을 15,000유로로 강화하였다.\nㄷ. 제5차 지침(AMLD 5)은 익명 선불카드의 사용을 전면 폐지 없이 오히려 한도를 상향 조정하였다.\nㄹ. 제6차 지침(Directive (EU) 2024/1640)은 실제소유자 및 은행 계좌 등록부뿐 아니라 부동산 정보에 대한 접근까지 규정한다.\nㅁ. 형사법을 통한 자금세탁방지에 관한 지침은 자금세탁 전제범죄로 30가지 범죄 유형을 포함하였다.',
  ['4개.','5개.','3개.','2개.'],3,
  'ㄱ, ㄹ은 옳은 설명이에요. 제5차 지침은 익명 선불카드 사용 한도를 상향이 아니라 월 150유로로 축소하였고(ㄷ), 제4차 지침의 고액현금거래보고 기준은 15,000유로가 아니라 10,000유로예요(ㄴ). 형사법을 통한 자금세탁방지에 관한 지침(2018/1673)이 정하는 전제범죄 범죄유형은 30가지가 아니라 22가지 범주로 규정되어 있어요(ㅁ도 옳지 않음).','ultra'),
M('jd1_4',
  '<보기>는 유럽연합 자금세탁방지지침의 각 차수와 핵심 키워드를 연결한 것이다. 옳지 않은 것은?',
